name: 'Install build dependencies'
description: 'Install the system packages of the Linux jobs that run Bazel on the whole repository'

# The packages of the jobs that build and run the tests without a browser: clang and lld for the C++ and Rust of the
# host (CC=clang in .bazelrc), and the GTK development packages that the Linux jobs installed before.
runs:
  using: 'composite'
  steps:
    - name: Install apt dependencies
      shell: bash
      run: |
          sudo apt-get install -y \
            clang \
            lld \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
