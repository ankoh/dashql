name: 'Install build dependencies'
description: 'Install the system packages of the Linux jobs that run Bazel on the whole repository'

# Every job that shares outputs through the remote cache installs the same packages. The C++ toolchain is detected from
# the host (CC=clang in .bazelrc), and a job without clang configures another toolchain whose actions miss the cache.
runs:
  using: 'composite'
  steps:
    - name: Install apt dependencies
      shell: bash
      run: |
          sudo apt-get install -y \
            clang \
            lld \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
