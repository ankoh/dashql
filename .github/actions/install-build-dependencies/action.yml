name: 'Install build dependencies'
description: 'Install the system packages of the Linux jobs that run Bazel on the whole repository'

# The packages of the jobs that build and run the tests without a browser: clang and lld for the C++ and Rust of the
# host (CC=clang in .bazelrc), and pkg-config, which the build script of openssl-sys runs.
runs:
  using: 'composite'
  steps:
    - name: Install apt dependencies
      shell: bash
      run: |
          sudo apt-get install -y clang lld pkg-config
