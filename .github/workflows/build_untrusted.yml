name: Build

on:
    workflow_call:
        inputs:
            commit:
                required: true
                type: string

jobs:
    linux_fastbuild:
        name: Linux Fastbuild
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: 'recursive'
                  fetch-depth: 0
                  ref: ${{ inputs.commit || github.sha }}

            - uses: ./.github/actions/setup-ubuntu-mirror

            - name: Install apt dependencies
              shell: bash
              run: |
                  sudo apt-get install -y \
                    clang \
                    lld \
                    pkg-config \
                    libglib2.0-dev \
                    libgtk-3-dev \
                    libwebkit2gtk-4.1-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev

            - name: Setup GitHub credentials
              uses: ./.github/actions/setup-github-credentials

            - name: Setup Bazel
              uses: bazel-contrib/setup-bazel@0.19.1
              with:
                  bazelisk-cache: true
                  repository-cache: true
                  disk-cache: false
                  bazelrc: |
                      common --credential_helper=github.com=${{ runner.temp }}/bazel-github-credentials

            - name: Verify Bazel lockfile
              shell: bash
              run: bazel mod deps --lockfile_mode=error

            - name: Build Everything
              shell: bash
              run: |
                bazel build --config=fastbuild \
                    //packages/...

            - name: Test Everything
              shell: bash
              run: |
                bazel test --config=fastbuild \
                    //packages/... \
                    --build_tests_only \
                    --test_output=errors \
                    --test_summary=detailed

    agent_integration:
        name: Agent Integration
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: 'recursive'
                  fetch-depth: 0
                  ref: ${{ inputs.commit || github.sha }}

            - uses: ./.github/actions/setup-ubuntu-mirror

            # The sandbox of Claude Code on Linux, see docs/wip/agent_integration_tests.md.
            # Ubuntu restricts the unprivileged user namespaces that bubblewrap needs. It also confines /usr/bin/bwrap
            # with the AppArmor profiles bwrap and unpriv_bwrap: the children of bwrap get no capabilities in a nested
            # user namespace, where the seccomp helper of Claude Code writes /proc/self/setgroups.
            - name: Install the sandbox of the harnesses
              shell: bash
              run: |
                  sudo apt-get install -y bubblewrap socat
                  if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
                      sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
                  fi
                  for profile in bwrap unpriv_bwrap; do
                      if sudo grep -q "^$profile " /sys/kernel/security/apparmor/profiles 2>/dev/null; then
                          echo "Removing the AppArmor profile $profile"
                          echo -n "$profile" | sudo tee /sys/kernel/security/apparmor/.remove > /dev/null
                      fi
                  done
                  sudo grep -i bwrap /sys/kernel/security/apparmor/profiles 2>/dev/null || true

            - name: Setup GitHub credentials
              uses: ./.github/actions/setup-github-credentials

            - name: Setup Bazel
              uses: bazel-contrib/setup-bazel@0.19.1
              with:
                  bazelisk-cache: true
                  repository-cache: true
                  disk-cache: false
                  bazelrc: |
                      common --credential_helper=github.com=${{ runner.temp }}/bazel-github-credentials

            - name: Test the agent integrations
              shell: bash
              run: |
                bazel test --config=fastbuild \
                    //tests/agents/... \
                    --test_output=errors \
                    --test_summary=detailed
