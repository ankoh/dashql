name: Build

on:
    workflow_call:
        inputs:
            commit:
                required: true
                type: string
            signed:
                required: false
                type: boolean
                default: false
            upload_native_packages:
                description: Upload the Electron packages for the Electron release, off for dev.dashql.app
                required: false
                type: boolean
                default: true

jobs:
    # The version of the run, determined once: every job that runs Bazel gets the output of `git describe` of the commit
    # in DASHQL_GIT_DESCRIBE (bazel/versioning.bzl) and doesn't describe the commit itself. A tag that arrives while the
    # run is going would otherwise give the pages, the npm packages and the Electron packages different versions.
    version:
        name: Version
        runs-on: ubuntu-26.04
        outputs:
            describe: ${{ steps.describe.outputs.describe }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.commit || github.sha }}

            - name: Describe the commit
              id: describe
              shell: bash
              run: |
                  set -euo pipefail
                  DESCRIBE="$(git describe --tags --long)"
                  echo "${DESCRIBE}"
                  echo "describe=${DESCRIBE}" >> "${GITHUB_OUTPUT}"

    core_wasm_fastbuild:
        name: Core Wasm Fastbuild
        runs-on: ubuntu-26.04
        needs: [version]
        env:
            DASHQL_GIT_DESCRIBE: ${{ needs.version.outputs.describe }}
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: 'recursive'
                  fetch-depth: 0
                  ref: ${{ inputs.commit || github.sha }}

            - uses: ./.github/actions/setup-ubuntu-mirror

            - name: Install apt dependencies
              shell: bash
              run: |
                  sudo apt-get install -y clang lld

            - name: Setup Bazel
              uses: ./.github/actions/setup-bazel
              with:
                  bazel-mtls-ca: ${{ secrets.BAZEL_CACHE_MTLS_CA }}
                  bazel-mtls-client-cert: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_CERT }}
                  bazel-mtls-client-key: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_KEY }}

            - name: Check crate lockfiles
              shell: bash
              run: |
                bazel mod deps --lockfile_mode=update
                git diff --exit-code -- bazel/crates

            - name: Build WASM
              shell: bash
              run: |
                bazel build --config=fastbuild \
                    //packages/dashql-core-bindings:core_wasm //packages/dashql-dataflow:dataflow_wasm

    core_wasm_release:
        name: Core Wasm Release
        runs-on: ubuntu-26.04
        needs: [version]
        env:
            DASHQL_GIT_DESCRIBE: ${{ needs.version.outputs.describe }}
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: 'recursive'
                  fetch-depth: 0
                  ref: ${{ inputs.commit || github.sha }}

            - uses: ./.github/actions/setup-ubuntu-mirror

            - name: Install apt dependencies
              shell: bash
              run: |
                  sudo apt-get install -y clang lld

            - name: Setup Bazel
              uses: ./.github/actions/setup-bazel
              with:
                  bazel-mtls-ca: ${{ secrets.BAZEL_CACHE_MTLS_CA }}
                  bazel-mtls-client-cert: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_CERT }}
                  bazel-mtls-client-key: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_KEY }}

            - name: Build WASM
              shell: bash
              run: |
                bazel build --config=release \
                    //packages/dashql-core-bindings:core_wasm //packages/dashql-dataflow:dataflow_wasm

    linux_fastbuild:
        name: Linux Fastbuild
        runs-on: ubuntu-26.04
        needs: [version, core_wasm_fastbuild]
        env:
            DASHQL_GIT_DESCRIBE: ${{ needs.version.outputs.describe }}
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: 'recursive'
                  fetch-depth: 0
                  ref: ${{ inputs.commit || github.sha }}

            - uses: ./.github/actions/setup-ubuntu-mirror

            - name: Install apt dependencies
              shell: bash
              run: |
                  sudo apt-get install -y \
                    clang \
                    lld \
                    pkg-config \
                    libglib2.0-dev \
                    libgtk-3-dev \
                    libwebkit2gtk-4.1-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev

            - name: Setup Bazel
              uses: ./.github/actions/setup-bazel
              with:
                  bazel-mtls-ca: ${{ secrets.BAZEL_CACHE_MTLS_CA }}
                  bazel-mtls-client-cert: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_CERT }}
                  bazel-mtls-client-key: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_KEY }}

            - name: Assert WASM is in remote cache
              shell: bash
              run: |
                bazel build --config=fastbuild \
                    --experimental_remote_require_cached \
                    //packages/dashql-core-bindings:core_wasm //packages/dashql-dataflow:dataflow_wasm

            - name: Build Everything
              shell: bash
              run: |
                bazel build --config=fastbuild \
                    //packages/...

            - name: Test Everything
              shell: bash
              run: |
                bazel test --config=fastbuild \
                    //packages/... \
                    --build_tests_only \
                    --test_output=errors \
                    --test_summary=detailed

    agent_integration:
        name: Agent Integration
        runs-on: ubuntu-26.04
        needs: [version]
        env:
            DASHQL_GIT_DESCRIBE: ${{ needs.version.outputs.describe }}
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: 'recursive'
                  fetch-depth: 0
                  ref: ${{ inputs.commit || github.sha }}

            - uses: ./.github/actions/setup-ubuntu-mirror

            # The sandbox of Claude Code on Linux, see docs/design/agent_integration_tests.md.
            # Ubuntu restricts the unprivileged user namespaces that bubblewrap needs. It also confines /usr/bin/bwrap
            # with the AppArmor profiles bwrap and unpriv_bwrap: the children of bwrap get no capabilities in a nested
            # user namespace, where the seccomp helper of Claude Code writes /proc/self/setgroups.
            - name: Install the sandbox of the harnesses
              shell: bash
              run: |
                  sudo apt-get install -y bubblewrap socat
                  if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
                      sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
                  fi
                  for profile in bwrap unpriv_bwrap; do
                      if sudo grep -q "^$profile " /sys/kernel/security/apparmor/profiles 2>/dev/null; then
                          echo "Removing the AppArmor profile $profile"
                          echo -n "$profile" | sudo tee /sys/kernel/security/apparmor/.remove > /dev/null
                      fi
                  done
                  sudo grep -i bwrap /sys/kernel/security/apparmor/profiles 2>/dev/null || true

            - name: Setup Bazel
              uses: ./.github/actions/setup-bazel
              with:
                  bazel-mtls-ca: ${{ secrets.BAZEL_CACHE_MTLS_CA }}
                  bazel-mtls-client-cert: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_CERT }}
                  bazel-mtls-client-key: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_KEY }}

            - name: Test the agent integrations
              shell: bash
              run: |
                bazel test --config=fastbuild \
                    //tests/agents/... \
                    --test_output=errors \
                    --test_summary=detailed

    linux_release:
        name: Linux Release
        runs-on: ubuntu-26.04
        needs: [version, core_wasm_release]
        env:
            DASHQL_GIT_DESCRIBE: ${{ needs.version.outputs.describe }}
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: 'recursive'
                  fetch-depth: 0
                  ref: ${{ inputs.commit || github.sha }}

            - uses: ./.github/actions/setup-ubuntu-mirror

            - name: Install apt dependencies
              shell: bash
              run: |
                  sudo apt-get install -y \
                    clang \
                    lld \
                    pkg-config \
                    libglib2.0-dev \
                    libgtk-3-dev \
                    libwebkit2gtk-4.1-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev

            - name: Setup Bazel
              uses: ./.github/actions/setup-bazel
              with:
                  bazel-mtls-ca: ${{ secrets.BAZEL_CACHE_MTLS_CA }}
                  bazel-mtls-client-cert: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_CERT }}
                  bazel-mtls-client-key: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_KEY }}

            - name: Assert WASM is in remote cache
              shell: bash
              run: |
                bazel build --config=release \
                    --experimental_remote_require_cached \
                    //packages/dashql-core-bindings:core_wasm //packages/dashql-dataflow:dataflow_wasm

            - name: Build Web App
              shell: bash
              run: |
                bazel build --config=release \
                    //packages/...

            - name: Test Web App
              shell: bash
              run: |
                bazel test --config=release \
                    //packages/... \
                    --build_tests_only \
                    --test_output=errors \
                    --test_summary=detailed

            # Kept as long as the npm and Electron packages: a deploy that waits for npm (deploy_gate in publish.yml)
            # can be re-run days later and takes everything from this run
            - uses: actions/upload-artifact@v7
              with:
                name: dashql_app_pages
                path: ./bazel-bin/packages/dashql-app/pages_deploy/
                retention-days: 7

            - uses: actions/upload-artifact@v7
              with:
                name: dashql_org_pages
                path: ./bazel-bin/packages/dashql-org/pages_deploy/
                retention-days: 7

    core_npm_release:
        name: Core NPM Bundle
        runs-on: ubuntu-26.04
        needs: [version, core_wasm_release]
        env:
            DASHQL_GIT_DESCRIBE: ${{ needs.version.outputs.describe }}
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: 'recursive'
                  fetch-depth: 0
                  ref: ${{ inputs.commit || github.sha }}

            - uses: ./.github/actions/setup-ubuntu-mirror

            - name: Install apt dependencies
              shell: bash
              run: |
                  sudo apt-get install -y clang lld

            - name: Setup Bazel
              uses: ./.github/actions/setup-bazel
              with:
                  bazel-mtls-ca: ${{ secrets.BAZEL_CACHE_MTLS_CA }}
                  bazel-mtls-client-cert: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_CERT }}
                  bazel-mtls-client-key: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_KEY }}

            - name: Assert WASM is in remote cache
              shell: bash
              run: |
                bazel build --config=release \
                    --experimental_remote_require_cached \
                    //packages/dashql-core-bindings:core_wasm //packages/dashql-dataflow:dataflow_wasm

            - name: Build and validate the npm tarball of @akohn/dashql
              shell: bash
              run: |
                  bazel build --config=release \
                      //packages/dashql:npm_tarball
                  bazel test --config=release \
                      //packages/dashql:all \
                      --test_output=errors

            - name: Upload the npm tarball of @akohn/dashql
              uses: actions/upload-artifact@v7
              with:
                  name: dashql_npm
                  path: ./bazel-bin/packages/dashql/dashql.tgz
                  if-no-files-found: error
                  retention-days: 7

            # npx -y @akohn/dashql-cli, published after @akohn/dashql, which it depends on
            - name: Build and validate CLI npm tarball
              shell: bash
              run: |
                  bazel build --config=release \
                      //packages/dashql-cli:npm_tarball
                  bazel test --config=release \
                      //packages/dashql-cli:npm_package_test //packages/dashql-cli:binary_test \
                      --test_output=errors

            - name: Upload CLI npm tarball
              uses: actions/upload-artifact@v7
              with:
                  name: dashql_cli_npm
                  path: ./bazel-bin/packages/dashql-cli/dashql-cli.tgz
                  if-no-files-found: error
                  retention-days: 7

    macos_electron_arm64:
        name: macOS Electron arm64
        runs-on: macos-26
        needs: [version, core_wasm_release]
        env:
            DASHQL_GIT_DESCRIBE: ${{ needs.version.outputs.describe }}
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: 'recursive'
                  fetch-depth: 0
                  ref: ${{ inputs.commit || github.sha }}

            - name: Setup Bazel
              uses: ./.github/actions/setup-bazel
              with:
                  bazel-mtls-ca: ${{ secrets.BAZEL_CACHE_MTLS_CA }}
                  bazel-mtls-client-cert: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_CERT }}
                  bazel-mtls-client-key: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_KEY }}

            - name: Test Electron
              shell: bash
              run: |
                bazel test --config=release \
                    //packages/dashql-native:test \
                    //packages/dashql-native:native_addon_utility_test \
                    //packages/dashql-native:startup_smoke_test \
                    //packages/dashql-native/proxy:test \
                    --test_output=errors

            - name: Build Electron arm64 packages
              shell: bash
              env:
                  CSC_LINK: ${{ inputs.signed && secrets.MACOS_DEVELOPER_ID_APPLICATION_BASE64 || '' }}
                  CSC_KEY_PASSWORD: ${{ inputs.signed && secrets.MACOS_DEVELOPER_ID_APPLICATION_SECRET || '' }}
                  APPLE_API_ISSUER: ${{ inputs.signed && secrets.MACOS_STORE_ISSUER_ID || '' }}
                  APPLE_API_KEY_ID: ${{ inputs.signed && secrets.MACOS_STORE_KEY_ID || '' }}
                  APPLE_API_KEY_CONTENT: ${{ inputs.signed && secrets.MACOS_STORE_KEY || '' }}
              run: |
                  if [[ -n "$APPLE_API_KEY_CONTENT" ]]; then
                      APPLE_API_KEY="${{ runner.temp }}/AuthKey_${APPLE_API_KEY_ID}.p8"
                      printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
                      export APPLE_API_KEY
                  fi
                  bazel run --config=release \
                      --run_env=CSC_LINK \
                      --run_env=CSC_KEY_PASSWORD \
                      --run_env=APPLE_API_ISSUER \
                      --run_env=APPLE_API_KEY_ID \
                      --run_env=APPLE_API_KEY \
                      //packages/dashql-native:mac_package_arm64

            - name: Upload Electron arm64 packages
              if: inputs.upload_native_packages
              uses: actions/upload-artifact@v7
              with:
                name: dashql_macos_electron_arm64
                path: ./dist/electron/arm64/
                retention-days: 7

    macos_electron_x86_64:
        name: macOS Electron x86_64
        runs-on: macos-26
        needs: [version, core_wasm_release]
        env:
            DASHQL_GIT_DESCRIBE: ${{ needs.version.outputs.describe }}
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: 'recursive'
                  fetch-depth: 0
                  ref: ${{ inputs.commit || github.sha }}

            - name: Setup Bazel
              uses: ./.github/actions/setup-bazel
              with:
                  bazel-mtls-ca: ${{ secrets.BAZEL_CACHE_MTLS_CA }}
                  bazel-mtls-client-cert: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_CERT }}
                  bazel-mtls-client-key: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_KEY }}

            - name: Build Electron x86_64 packages
              shell: bash
              env:
                  CSC_LINK: ${{ inputs.signed && secrets.MACOS_DEVELOPER_ID_APPLICATION_BASE64 || '' }}
                  CSC_KEY_PASSWORD: ${{ inputs.signed && secrets.MACOS_DEVELOPER_ID_APPLICATION_SECRET || '' }}
                  APPLE_API_ISSUER: ${{ inputs.signed && secrets.MACOS_STORE_ISSUER_ID || '' }}
                  APPLE_API_KEY_ID: ${{ inputs.signed && secrets.MACOS_STORE_KEY_ID || '' }}
                  APPLE_API_KEY_CONTENT: ${{ inputs.signed && secrets.MACOS_STORE_KEY || '' }}
              run: |
                  if [[ -n "$APPLE_API_KEY_CONTENT" ]]; then
                      APPLE_API_KEY="${{ runner.temp }}/AuthKey_${APPLE_API_KEY_ID}.p8"
                      printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
                      export APPLE_API_KEY
                  fi
                  bazel run --config=release \
                      --run_env=CSC_LINK \
                      --run_env=CSC_KEY_PASSWORD \
                      --run_env=APPLE_API_ISSUER \
                      --run_env=APPLE_API_KEY_ID \
                      --run_env=APPLE_API_KEY \
                      //packages/dashql-native:mac_package_x86_64

            - name: Upload Electron x86_64 packages
              if: inputs.upload_native_packages
              uses: actions/upload-artifact@v7
              with:
                name: dashql_macos_electron_x86_64
                path: ./dist/electron/x64/
                retention-days: 7
