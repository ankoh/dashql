name: Publish

on:
    workflow_call:
        inputs:
            commit:
                required: true
                type: string
            channel:
                description: The release channel of the Electron release, stable or latest
                required: true
                type: string
            publish_latest_pages:
                required: false
                type: boolean
                default: true
            publish_stable_pages:
                required: false
                type: boolean
                default: false
            publish_dev_pages:
                required: false
                type: boolean
                default: false
            publish_desktop_release:
                description: Publish the Electron release of the channel, off for dev.dashql.app
                required: false
                type: boolean
                default: true
            npm_tag:
                description: The dist-tag of the npm packages, latest for main, dev for dev.dashql.app, stable for a release
                required: true
                type: string
            require_tip:
                required: false
                type: boolean
                default: false

# Overlapping publishes wait for each other: a cancelled publish would mark the run of a good commit as cancelled
concurrency:
    group: ${{ github.workflow }}
    queue: max

jobs:
    tip:
        name: Gate latest main
        # An older commit must not overwrite a newer one, not even when its build finishes later or is re-run
        runs-on: ubuntu-26.04
        permissions:
            contents: read
        outputs:
            publish: ${{ steps.check.outputs.publish }}
        steps:
            - name: Compare the commit with the tip of main
              id: check
              env:
                  GH_TOKEN: ${{ github.token }}
                  COMMIT: ${{ inputs.commit }}
                  REQUIRE_TIP: ${{ inputs.require_tip }}
              run: |
                  if [[ "${REQUIRE_TIP}" != "true" ]]; then
                      echo "publish=true" >> "${GITHUB_OUTPUT}"
                      exit 0
                  fi
                  TIP="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
                  echo "tip of main: ${TIP}, this commit: ${COMMIT}"
                  if [[ "${TIP}" == "${COMMIT}" ]]; then
                      echo "publish=true" >> "${GITHUB_OUTPUT}"
                  else
                      echo "publish=false" >> "${GITHUB_OUTPUT}"
                  fi

    # The pages and the desktop app show `npx ... @akohn/dashql-cli@<version of the build>`, so the packages of the build
    # are on npm before either goes out. Trusted publishing: npm takes the OIDC token of the run, there is no npm token,
    # and it checks the calling workflow (on_push_main.yml, on_push_dev.yml, on_push_tag.yml), see the README.
    npm_publish:
        name: npm
        needs: [tip]
        if: needs.tip.outputs.publish == 'true'
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            id-token: write
        outputs:
            version: ${{ steps.publish.outputs.version }}
        steps:
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'

            - uses: actions/download-artifact@v8
              with:
                  name: dashql_npm
                  path: ${{ runner.temp }}/npm

            - uses: actions/download-artifact@v8
              with:
                  name: dashql_cli_npm
                  path: ${{ runner.temp }}/npm

            # @akohn/dashql first, the command line tool depends on its exact version. A version that is on npm already
            # is the same build (the version carries the commit), a re-run skips it.
            - name: Publish @akohn/dashql and @akohn/dashql-cli
              id: publish
              env:
                  NPM_DIR: ${{ runner.temp }}/npm
                  NPM_TAG: ${{ inputs.npm_tag }}
              run: |
                  set -euo pipefail
                  echo "npm $(npm --version)"
                  for tarball in dashql.tgz dashql-cli.tgz; do
                      manifest="$(tar -xzOf "${NPM_DIR}/${tarball}" package/package.json)"
                      name="$(node -e 'const m = JSON.parse(process.argv[1]); console.log(m.name)' "${manifest}")"
                      version="$(node -e 'const m = JSON.parse(process.argv[1]); console.log(m.version)' "${manifest}")"
                      # Both packages carry the version of the build, //packages/dashql-cli:npm_package_test
                      echo "version=${version}" >> "${GITHUB_OUTPUT}"
                      if [[ "$(npm view "${name}@${version}" version 2>/dev/null || true)" == "${version}" ]]; then
                          echo "${name}@${version} is on npm already"
                          continue
                      fi
                      npm publish "${NPM_DIR}/${tarball}" --access public --tag "${NPM_TAG}"
                  done

    # The gate of the pages and the desktop app, right before they go out. When it times out, "Re-run failed jobs" runs
    # it and the deploys again, days later perhaps (the artifacts are kept 7 days), while tip and npm_publish keep their
    # results of the first attempt. So it asks again:
    # - whether the commit is still the tip of main: a re-run must not put an older page over a newer one,
    # - whether npm serves both packages of the build: npm has accepted them, but its CDN can serve the metadata of a
    #   package without the new version for a while, and npx of the page would not find it (--prefer-online, no cache).
    deploy_gate:
        name: Gate deploy
        needs: [npm_publish]
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        permissions:
            contents: read
        outputs:
            deploy: ${{ steps.tip.outputs.deploy }}
        steps:
            - name: Compare the commit with the tip of main again
              id: tip
              env:
                  GH_TOKEN: ${{ github.token }}
                  COMMIT: ${{ inputs.commit }}
                  REQUIRE_TIP: ${{ inputs.require_tip }}
              run: |
                  set -euo pipefail
                  if [[ "${REQUIRE_TIP}" == "true" ]]; then
                      TIP="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
                      echo "tip of main: ${TIP}, this commit: ${COMMIT}"
                      if [[ "${TIP}" != "${COMMIT}" ]]; then
                          echo "a newer commit is on main, nothing is deployed"
                          echo "deploy=false" >> "${GITHUB_OUTPUT}"
                          exit 0
                      fi
                  fi
                  echo "deploy=true" >> "${GITHUB_OUTPUT}"

            - uses: actions/setup-node@v6
              if: steps.tip.outputs.deploy == 'true'
              with:
                  node-version: '24'

            - name: Wait until npm serves the packages of the build
              if: steps.tip.outputs.deploy == 'true'
              env:
                  VERSION: ${{ needs.npm_publish.outputs.version }}
              run: |
                  set -euo pipefail
                  for name in @akohn/dashql @akohn/dashql-cli; do
                      until [[ "$(npm view "${name}@${VERSION}" version --prefer-online --registry=https://registry.npmjs.org/ 2>/dev/null || true)" == "${VERSION}" ]]; do
                          echo "npm does not serve ${name}@${VERSION} yet"
                          sleep 10
                      done
                      echo "npm serves ${name}@${VERSION}"
                  done

    desktop_release:
        name: Electron Release
        needs: [deploy_gate]
        if: needs.deploy_gate.outputs.deploy == 'true' && inputs.publish_desktop_release
        runs-on: ubuntu-26.04
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.commit || github.sha }}
                  fetch-depth: 0

            - uses: actions/download-artifact@v8
              with:
                  name: dashql_macos_electron_arm64
                  path: ${{ runner.temp }}/artifacts/electron/arm64

            - uses: actions/download-artifact@v8
              with:
                  name: dashql_macos_electron_x86_64
                  path: ${{ runner.temp }}/artifacts/electron/x64

            - name: Setup Bazel
              uses: ./.github/actions/setup-bazel
              with:
                  bazel-mtls-ca: ${{ secrets.BAZEL_CACHE_MTLS_CA }}
                  bazel-mtls-client-cert: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_CERT }}
                  bazel-mtls-client-key: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_KEY }}

            - name: Publish Electron release to R2
              shell: bash
              env:
                  DASHQL_GET_R2_ENDPOINT: ${{ secrets.R2_DASHQL_GET_ENDPOINT }}
                  DASHQL_GET_R2_ACCESS_KEY_ID: ${{ secrets.R2_DASHQL_GET_ACCESS_KEY_ID }}
                  DASHQL_GET_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_DASHQL_GET_SECRET_ACCESS_KEY }}
                  CHANNEL: ${{ inputs.channel }}
              run: |
                  ARM64="${{ runner.temp }}/artifacts/electron/arm64"
                  X64="${{ runner.temp }}/artifacts/electron/x64"
                  ARM64_MANIFESTS=("$ARM64"/*-mac.yml)
                  X64_MANIFESTS=("$X64"/*-mac.yml)
                  if [[ ${#ARM64_MANIFESTS[@]} -ne 1 || ! -f "${ARM64_MANIFESTS[0]}" ]]; then
                      printf 'expected one arm64 update manifest, found: %s\n' "${ARM64_MANIFESTS[*]}" >&2
                      exit 1
                  fi
                  if [[ ${#X64_MANIFESTS[@]} -ne 1 || ! -f "${X64_MANIFESTS[0]}" ]]; then
                      printf 'expected one x64 update manifest, found: %s\n' "${X64_MANIFESTS[*]}" >&2
                      exit 1
                  fi
                  bazel run --config=release //tools/pack:pack -- publish \
                      --channel "${CHANNEL}" \
                      --source-dir "${{ github.workspace }}" \
                      --macos-arm64-dmg-path "$ARM64"/DashQL-*-arm64.dmg \
                      --macos-arm64-zip-path "$ARM64"/DashQL-*-arm64.zip \
                      --macos-arm64-zip-blockmap-path "$ARM64"/DashQL-*-arm64.zip.blockmap \
                      --macos-arm64-update-manifest-path "${ARM64_MANIFESTS[0]}" \
                      --macos-x64-dmg-path "$X64"/DashQL-*-x64.dmg \
                      --macos-x64-zip-path "$X64"/DashQL-*-x64.zip \
                      --macos-x64-zip-blockmap-path "$X64"/DashQL-*-x64.zip.blockmap \
                      --macos-x64-update-manifest-path "${X64_MANIFESTS[0]}"

            - name: Remove expired Electron releases from R2
              shell: bash
              env:
                  DASHQL_GET_R2_ENDPOINT: ${{ secrets.R2_DASHQL_GET_ENDPOINT }}
                  DASHQL_GET_R2_ACCESS_KEY_ID: ${{ secrets.R2_DASHQL_GET_ACCESS_KEY_ID }}
                  DASHQL_GET_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_DASHQL_GET_SECRET_ACCESS_KEY }}
              run: |
                  bazel run --config=release //tools/pack:vacuum -- \
                      --keep-stable 100 \
                      --keep-latest 10

    pages_deploy:
        name: dashql.app
        needs: [deploy_gate]
        if: needs.deploy_gate.outputs.deploy == 'true' && inputs.publish_latest_pages
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            deployments: write
        environment:
            name: cloudflare-pages
            url: ${{ steps.deployment.outputs.deployment-url }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.commit || github.sha }}

            - uses: actions/download-artifact@v8
              with:
                  name: dashql_app_pages
                  path: ${{ runner.temp }}/artifacts/pages

            - name: Deploy prebuilt web app
              id: deployment
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.PAGES_DASHQL_API_TOKEN }}
                  accountId: ${{ secrets.PAGES_DASHQL_ACCOUNT_ID }}
                  workingDirectory: ${{ runner.temp }}
                  packageManager: npm
                  command: pages deploy ${{ runner.temp }}/artifacts/pages --project-name=dashql --branch=main --commit-hash=${{ inputs.commit }}
                  gitHubToken: ${{ secrets.GITHUB_TOKEN }}

    stable_pages_deploy:
        name: stable.dashql.app
        needs: [deploy_gate]
        if: needs.deploy_gate.outputs.deploy == 'true' && inputs.publish_stable_pages
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            deployments: write
        environment:
            name: cloudflare-pages-stable
            url: ${{ steps.deployment.outputs.deployment-url }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.commit || github.sha }}

            - uses: actions/download-artifact@v8
              with:
                  name: dashql_app_pages
                  path: ${{ runner.temp }}/artifacts/pages

            - name: Deploy prebuilt web app
              id: deployment
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.PAGES_DASHQL_API_TOKEN }}
                  accountId: ${{ secrets.PAGES_DASHQL_ACCOUNT_ID }}
                  workingDirectory: ${{ runner.temp }}
                  packageManager: npm
                  command: pages deploy ${{ runner.temp }}/artifacts/pages --project-name=dashql-stable --branch=main --commit-hash=${{ inputs.commit }}
                  gitHubToken: ${{ secrets.GITHUB_TOKEN }}

    dev_pages_deploy:
        name: dev.dashql.app
        needs: [deploy_gate]
        if: needs.deploy_gate.outputs.deploy == 'true' && inputs.publish_dev_pages
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            deployments: write
        environment:
            name: cloudflare-pages-dev
            url: ${{ steps.deployment.outputs.deployment-url }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.commit || github.sha }}

            - uses: actions/download-artifact@v8
              with:
                  name: dashql_app_pages
                  path: ${{ runner.temp }}/artifacts/pages

            - name: Deploy prebuilt web app
              id: deployment
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.PAGES_DASHQL_API_TOKEN }}
                  accountId: ${{ secrets.PAGES_DASHQL_ACCOUNT_ID }}
                  workingDirectory: ${{ runner.temp }}
                  packageManager: npm
                  command: pages deploy ${{ runner.temp }}/artifacts/pages --project-name=dashql-dev --branch=main --commit-hash=${{ inputs.commit }}
                  gitHubToken: ${{ secrets.GITHUB_TOKEN }}

    org_pages_deploy:
        name: dashql.org
        # Behind the gate like dashql.app: a re-run checks the tip of main again, and both sites of a commit go out together
        needs: [deploy_gate]
        if: needs.deploy_gate.outputs.deploy == 'true' && inputs.publish_latest_pages
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            deployments: write
        environment:
            name: cloudflare-pages-org
            url: ${{ steps.deployment.outputs.deployment-url }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.commit || github.sha }}

            - uses: actions/download-artifact@v8
              with:
                  name: dashql_org_pages
                  path: ${{ runner.temp }}/artifacts/org_pages

            - name: Deploy prebuilt website
              id: deployment
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.PAGES_DASHQL_API_TOKEN }}
                  accountId: ${{ secrets.PAGES_DASHQL_ACCOUNT_ID }}
                  workingDirectory: ${{ runner.temp }}
                  packageManager: npm
                  command: pages deploy ${{ runner.temp }}/artifacts/org_pages --project-name=dashql-org --branch=main --commit-hash=${{ inputs.commit }}
                  gitHubToken: ${{ secrets.GITHUB_TOKEN }}

    coverage_pages_deploy:
        name: coverage.dashql.app
        # Behind the gate like the other sites: a re-run checks the tip of main again, everything of a commit goes out together
        needs: [deploy_gate]
        if: needs.deploy_gate.outputs.deploy == 'true' && inputs.publish_latest_pages
        runs-on: ubuntu-26.04
        # Like the coverage job: without a report the last good page stays, and the publish does not fail
        continue-on-error: true
        permissions:
            contents: read
            deployments: write
        environment:
            name: cloudflare-pages-coverage
            url: ${{ steps.deployment.outputs.deployment-url }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.commit || github.sha }}

            - uses: actions/download-artifact@v8
              with:
                  name: coverage_site
                  path: ${{ runner.temp }}/artifacts/coverage

            - name: Deploy the coverage report
              id: deployment
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.PAGES_DASHQL_API_TOKEN }}
                  accountId: ${{ secrets.PAGES_DASHQL_ACCOUNT_ID }}
                  workingDirectory: ${{ runner.temp }}
                  packageManager: npm
                  command: pages deploy ${{ runner.temp }}/artifacts/coverage --project-name=dashql-coverage --branch=main --commit-hash=${{ inputs.commit }}
                  gitHubToken: ${{ secrets.GITHUB_TOKEN }}
