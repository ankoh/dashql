name: Main

on:
    push:
        branches:
            - 'main'

jobs:
    build:
        name: Build
        uses: ./.github/workflows/build_trusted.yml
        with:
            commit: ${{ github.sha }}
            signed: true
        secrets: inherit

    coverage:
        name: Coverage
        uses: ./.github/workflows/coverage.yml
        with:
            commit: ${{ github.sha }}
        secrets: inherit

    coverage_deploy:
        name: coverage.dashql.app
        # The coverage runs next to the build, the page only moves for a commit that builds
        needs:
            - build
            - coverage
        runs-on: ubuntu-26.04
        # Like the coverage job: a failed run keeps the last good page and does not fail the push
        continue-on-error: true
        permissions:
            contents: read
        environment:
            name: cloudflare-pages-coverage
            url: ${{ steps.deployment.outputs.deployment-url }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}

            - uses: actions/download-artifact@v8
              with:
                  name: coverage_site
                  path: ${{ runner.temp }}/artifacts/coverage

            - name: Deploy the coverage report
              id: deployment
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.PAGES_DASHQL_API_TOKEN }}
                  accountId: ${{ secrets.PAGES_DASHQL_ACCOUNT_ID }}
                  workingDirectory: ${{ runner.temp }}
                  packageManager: npm
                  command: pages deploy ${{ runner.temp }}/artifacts/coverage --project-name=dashql-coverage --branch=main --commit-hash=${{ github.sha }}

    tip:
        name: Check the tip of main
        # Asks after the build, a commit that was pushed during the build replaces this one
        needs:
            - build
        runs-on: ubuntu-26.04
        permissions:
            contents: read
        outputs:
            is_tip: ${{ steps.check.outputs.is_tip }}
        steps:
            - name: Compare the commit with the tip of main
              id: check
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  TIP="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
                  echo "tip of main: ${TIP}, this commit: ${GITHUB_SHA}"
                  if [[ "${TIP}" == "${GITHUB_SHA}" ]]; then
                      echo "is_tip=true" >> "${GITHUB_OUTPUT}"
                  else
                      echo "is_tip=false" >> "${GITHUB_OUTPUT}"
                  fi

    publish:
        name: Publish
        # An older commit must not overwrite a newer one, not even when its build finishes later or is re-run
        if: needs.tip.outputs.is_tip == 'true'
        uses: ./.github/workflows/publish.yml
        with:
            commit: ${{ github.sha }}
        needs:
            - build
            - tip
        secrets: inherit
        permissions:
            contents: read
            deployments: write
