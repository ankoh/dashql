name: Main

on:
    push:
        branches:
            - 'main'

jobs:
    build:
        name: Build
        uses: ./.github/workflows/build_trusted.yml
        with:
            commit: ${{ github.sha }}
            signed: true
        secrets: inherit

    coverage:
        name: Coverage
        uses: ./.github/workflows/coverage.yml
        with:
            commit: ${{ github.sha }}
        secrets: inherit

    coverage_deploy:
        name: coverage.dashql.app
        # The coverage runs next to the build, the page only moves for a commit that builds
        needs:
            - build
            - coverage
        runs-on: ubuntu-26.04
        # Like the coverage job: a failed run keeps the last good page and does not fail the push
        continue-on-error: true
        permissions:
            contents: read
        environment:
            name: cloudflare-pages-coverage
            url: ${{ steps.deployment.outputs.deployment-url }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}

            - uses: actions/download-artifact@v8
              with:
                  name: coverage_site
                  path: ${{ runner.temp }}/artifacts/coverage

            - name: Deploy the coverage report
              id: deployment
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.PAGES_DASHQL_API_TOKEN }}
                  accountId: ${{ secrets.PAGES_DASHQL_ACCOUNT_ID }}
                  workingDirectory: ${{ runner.temp }}
                  packageManager: npm
                  command: pages deploy ${{ runner.temp }}/artifacts/coverage --project-name=dashql-coverage --branch=main --commit-hash=${{ github.sha }}

    publish:
        name: Publish
        uses: ./.github/workflows/publish.yml
        with:
            commit: ${{ github.sha }}
        needs:
            - build
        secrets: inherit
        permissions:
            contents: read
            deployments: write
