name: Main

on:
    push:
        branches:
            - 'main'

jobs:
    build:
        name: Build
        uses: ./.github/workflows/build_trusted.yml
        with:
            commit: ${{ github.sha }}
            signed: true
        secrets: inherit

    coverage:
        name: Coverage
        uses: ./.github/workflows/coverage.yml
        with:
            commit: ${{ github.sha }}
        secrets: inherit

    publish:
        name: Publish
        # Starts after the build and the coverage, a failed coverage does not hold back the publish
        if: ${{ !cancelled() && needs.build.result == 'success' }}
        uses: ./.github/workflows/publish.yml
        with:
            commit: ${{ github.sha }}
            require_tip: true
        needs:
            - build
            - coverage
        secrets: inherit
        permissions:
            contents: read
            deployments: write
