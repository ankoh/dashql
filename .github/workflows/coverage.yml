name: Coverage

on:
    workflow_call:
        inputs:
            commit:
                required: true
                type: string

jobs:
    linux_coverage:
        name: Linux Coverage
        runs-on: ubuntu-26.04
        continue-on-error: true
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: 'recursive'
                  fetch-depth: 0
                  ref: ${{ inputs.commit || github.sha }}

            - uses: ./.github/actions/setup-ubuntu-mirror

            - name: Install apt dependencies
              shell: bash
              run: |
                  sudo apt-get install -y \
                    clang \
                    llvm \
                    lld \
                    lcov \
                    pkg-config \
                    libglib2.0-dev \
                    libgtk-3-dev \
                    libwebkit2gtk-4.1-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev

            - name: Setup Bazel
              uses: ./.github/actions/setup-bazel
              with:
                  bazel-mtls-ca: ${{ secrets.BAZEL_CACHE_MTLS_CA }}
                  bazel-mtls-client-cert: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_CERT }}
                  bazel-mtls-client-key: ${{ secrets.BAZEL_CACHE_MTLS_CLIENT_KEY }}

            - name: Coverage of the Rust core and tools
              shell: bash
              run: |
                bazel coverage --config=fastbuild \
                    --instrumentation_filter="//packages/dashql-core(-session|-shell|-profile)?[/:],//packages/dashql-dataflow[/:],//packages/dashql-parser[/:],//packages/dashql-cli[/:],//packages/dashql-native-proxy[/:],//packages/dashql-pack[/:]" \
                    //packages/dashql-core/... //packages/dashql-core-session/... //packages/dashql-core-shell/... \
                    //packages/dashql-core-profile/... //packages/dashql-dataflow/... //packages/dashql-parser/... //packages/dashql-snapshots/... \
                    //packages/dashql-cli:tests //packages/dashql-native-proxy:test //packages/dashql-pack:test
                cp "$(bazel info output_path)/_coverage/_coverage_report.dat" \
                    /tmp/lcov_linux.dat

            - name: Coverage of the app
              shell: bash
              run: |
                bazel test --config=fastbuild --test_output=errors //packages/dashql-app:coverage_chromium
                cp bazel-testlogs/packages/dashql-app/coverage_chromium/test.outputs/coverage.dat \
                    /tmp/lcov_app.dat
                {
                    echo '```text'
                    cat bazel-testlogs/packages/dashql-app/coverage_chromium/test.outputs/coverage_summary.txt
                    echo '```'
                } >> "$GITHUB_STEP_SUMMARY"

            - name: Render the coverage report
              shell: bash
              env:
                  COMMIT: ${{ inputs.commit }}
              run: |
                # Without --prefix, genhtml strips the prefix of the largest crate and shows the others with absolute paths.
                # The function rate is left out: the app has no function records, and the Rust ones count every
                # instantiation of a function on its own.
                genhtml /tmp/lcov_linux.dat /tmp/lcov_app.dat \
                    --output-directory /tmp/coverage_site \
                    --title "DashQL ${COMMIT::7}" \
                    --prefix "$PWD/packages" \
                    --hierarchical \
                    --no-function-coverage
                cp /tmp/lcov_linux.dat /tmp/coverage_site/lcov_rust.info
                cp /tmp/lcov_app.dat /tmp/coverage_site/lcov_app.info
                cp bazel-testlogs/packages/dashql-app/coverage_chromium/test.outputs/coverage_summary.txt \
                    /tmp/coverage_site/app_gaps.txt
                bazel run --config=fastbuild //packages/dashql-pack:pack -- coverage-badge \
                    /tmp/lcov_linux.dat /tmp/lcov_app.dat \
                    --output /tmp/coverage_site/badge.svg
                # The same rule as the release badge in dashql-pack
                printf '/badge.svg\n  Cache-Control: no-cache\n' > /tmp/coverage_site/_headers

            - uses: actions/upload-artifact@v7
              with:
                  name: coverage_site
                  path: /tmp/coverage_site/
                  retention-days: 1

            - name: Upload to Coveralls
              uses: coverallsapp/github-action@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  files: /tmp/lcov_linux.dat /tmp/lcov_app.dat
                  format: lcov
                  flag-name: linux

    coverage_deploy:
        name: Cloudflare Pages (coverage.dashql.app)
        needs:
            - linux_coverage
        runs-on: ubuntu-26.04
        # Like the coverage job: a failed run keeps the last good page and does not fail the push
        continue-on-error: true
        permissions:
            contents: read
        environment:
            name: cloudflare-pages-coverage
            url: ${{ steps.deployment.outputs.deployment-url }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.commit || github.sha }}

            - uses: actions/download-artifact@v8
              with:
                  name: coverage_site
                  path: ${{ runner.temp }}/artifacts/coverage

            - name: Deploy the coverage report
              id: deployment
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.PAGES_DASHQL_API_TOKEN }}
                  accountId: ${{ secrets.PAGES_DASHQL_ACCOUNT_ID }}
                  workingDirectory: ${{ runner.temp }}
                  packageManager: npm
                  command: pages deploy ${{ runner.temp }}/artifacts/coverage --project-name=dashql-coverage --branch=main --commit-hash=${{ inputs.commit }}
