  - name: knowledge_space_list
    method: GET
    host: connect
    path: /ssot/knowledge-space
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Notebook-AI/paths/~1ssot~1knowledge-space/get
    description: Get all knowledge spaces in the current data space. Since v65.0.
    example: CALL cdp.knowledge_space_list ();
    rows: /knowledgeSpaces
    columns:
      - {name: client_context, api_name: clientContext, type: VARCHAR, description: "Client context of the knowledge space. Since v65.0."}
      - {name: dataspace, api_name: dataSpace, type: VARCHAR, description: "Name of the data space that the knowledge space belongs to. Since v65.0."}
      - {name: description, type: VARCHAR, description: "Description of the knowledge space. Since v65.0."}
      - {name: developer_name, api_name: developerName, type: VARCHAR, description: "Developer name of the knowledge space. Since v65.0."}
      - {name: knowledge_space_config_id, api_name: knowledgeSpaceConfigId, type: VARCHAR, description: "ID of the knowledge space configuration. Since v65.0."}
      - {name: knowledge_space_def_id, api_name: knowledgeSpaceDefId, type: VARCHAR, description: "Definition ID of the knowledge space. Since v65.0."}
      - {name: knowledge_space_id, api_name: knowledgeSpaceId, type: VARCHAR, description: "ID of the knowledge space. Since v65.0."}
      - {name: label, type: VARCHAR, description: "Label of the knowledge space. Since v65.0."}
      - {name: libraries, type: JSON, array: 1, schema: KnowledgeSpaceLibraryOutputRepresentation, description: "List of libraries in the knowledge space. Since v65.0."}
    effect: read
    evidence: O
    result_description: One row per item of `/knowledgeSpaces` in the response. Schema `KnowledgeSpaceOutputRepresentation`.
    notes: "**Notes:** An empty list doesn't mean Notebook AI is available: this returns `{\"knowledgeSpaces\":[]}` with HTTP 200 on both enabled and disabled orgs ([MedTech kit](https://github.com/salesforce-misc/Data360MedTechSolutionKit/blob/main/.claude/skills/notebook-ai/SKILL.md), one org). The spec says \"current data space\", but this call has no data space option and no source says how the space is chosen. To find a space, match on `label`, because `developer_name` can come back with a suffix. See [`knowledge_space_create`](#knowledge_space_create)."

