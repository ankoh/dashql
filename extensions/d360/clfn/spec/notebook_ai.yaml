  - name: deep_research_status_get
    method: GET
    host: connect
    path: /ssot/knowledge-space/deep-research/{researchId}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Notebook-AI/paths/~1ssot~1knowledge-space~1deep-research~1%7BresearchId%7D/get
    description: Get the deep research status by research ID. Since v67.0.
    example: CALL cdp.deep_research_status_get (research_id => 'research-abc123');
    options:
      - {name: research_id, api_name: researchId, in: path, type: string, required: true, description: "Unique identifier for the deep research job."}
    columns:
      - {name: config, type: JSON, description: "Deep research configuration. Since v67.0."}
      - {name: error, type: JSON, description: "Error details if the job failed. Since v67.0."}
      - {name: plan, type: JSON, schema: KnowledgeSpaceDeepResearchPlanOutputRepresentation, description: "Execution plan with steps. Since v67.0."}
      - {name: query, type: VARCHAR, description: "Query text. Since v67.0."}
      - {name: report, type: JSON, description: "Report content. Since v67.0."}
      - {name: research_id, api_name: researchId, type: VARCHAR, description: "Deep research job identifier. Since v67.0."}
      - {name: run_details, api_name: runDetails, type: JSON, description: "Execution details. Since v67.0."}
      - {name: status, type: VARCHAR, description: "Job status. Valid values are PENDING, RUNNING, COMPLETED, FAILED, and CANCELLED. Since v67.0."}
    effect: read
