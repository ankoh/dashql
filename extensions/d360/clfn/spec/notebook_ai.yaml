    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Notebook-AI/paths/~1ssot~1knowledge-space~1config~1%7BknowledgeSpaceConfigApiNameOrId%7D/delete
    description: Delete a knowledge space configuration. Since v65.0.
    example: CALL cdp.knowledge_space_configuration_delete (knowledge_space_config_api_name_or_id => 'Default_Config');
    options:
      - {name: knowledge_space_config_api_name_or_id, api_name: knowledgeSpaceConfigApiNameOrId, in: path, type: string, required: true, description: "API name or ID of the knowledge space configuration."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 200). One row with only the standard columns.
    notes: "**Notes:** The [MedTech kit](https://github.com/salesforce-misc/Data360MedTechSolutionKit/blob/main/.claude/skills/notebook-ai/SKILL.md) reports that `knowledge_space_create` fails with `No Knowledge Space Config Found For the DataSpace` when a data space has no configuration."

