    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Notebook-AI/paths/~1ssot~1knowledge-space~1provision/post
    description: Provision a knowledge space for the specified data spaces. Since v65.0.
    example: CALL cdp.knowledge_space_provision (dataspaces => ['default', 'analytics']);
    options:
      - {name: id, in: body, type: string, description: "ID of the asset. Since v58.0."}
      - {name: name, in: body, type: string, description: "Name of the asset. Since v58.0."}
      - {name: namespace, in: body, type: string, description: "Namespace of the asset. Since v58.0."}
      - {name: dataspaces, api_name: dataSpaces, in: body, array: 1, type: string, description: "List of data space names to provision. Since v65.0."}
    columns:
      - {name: success, type: BOOLEAN, description: "Indicates whether the provisioning request succeeded (`true`) or not (`false`). Since v65.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `KnowledgeSpaceProvisionOutputRepresentation`.
    notes: "**Notes:** No source explains how this relates to enabling Notebook AI. The [MedTech kit](https://github.com/salesforce-misc/Data360MedTechSolutionKit/blob/main/.claude/skills/notebook-ai/SKILL.md) never calls it, and it treats provisioning as an admin step. The result is only `success`, and the spec doesn't say whether provisioning continues after the response. [`knowledge_space_configuration_list`](#knowledge_space_configuration_list) has a `provisioning_status` column with undocumented values."

  - name: files_remove
    method: POST
    host: connect
    path: /ssot/knowledge-space/remove-files
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Notebook-AI/paths/~1ssot~1knowledge-space~1remove-files/post
    description: Remove files from a knowledge library. Since v65.0.
    example: CALL cdp.files_remove (knowledge_artifact_id => '1aQxx00000000JNEAY', knowledge_artifact_source => 'FILE_UPLOAD', knowledge_source_files_list => [(file_name = 'old-document.pdf', file_path = 'collections/1aQxx00000000JNEAY/old-document.pdf')]);
    options:
      - {name: id, in: body, type: string, description: "ID of the asset. Since v58.0."}
      - {name: name, in: body, type: string, description: "Name of the asset. Since v58.0."}
      - {name: namespace, in: body, type: string, description: "Namespace of the asset. Since v58.0."}
      - {name: knowledge_artifact_id, api_name: knowledgeArtifactId, in: body, type: string, description: "ID of the library the files belong to: `knowledge_library_id`, not the knowledge space ID."}
      - {name: knowledge_artifact_source, api_name: knowledgeArtifactSource, in: body, type: string, description: "`FILE_UPLOAD` or `URL`, the two values in the spec's examples."}
      - {name: knowledge_source_files_list, api_name: knowledgeSourceFilesList, in: body, schema: KnowledgeSpaceIndexFilesInput_knowledgeSourceFilesList, array: 1, description: "Items take `file_name`, `file_path`, `file_type` and `fileIndexStatus`, from `KnowledgeSourceFileInputRepresentation`. The spec types the items as plain objects."}
      - {name: knowledge_source_id, api_name: knowledgeSourceId, in: body, type: string, description: "Unique identifier of the knowledge source. Applies only to URL sources. Since v65.0."}
      - {name: search_index_api_name, api_name: searchIndexApiName, in: body, type: string, description: "API name of the search index to use for knowledge indexing. Since v65.0."}
      - {name: website_url, api_name: websiteUrl, in: body, type: string, description: "Website URL. Since v65.0."}
    columns:
      - {name: knowledge_artifact_id, api_name: knowledgeArtifactId, type: VARCHAR, description: "Unique identifier of the knowledge artifact. Since v65.0."}
      - {name: knowledge_artifact_source, api_name: knowledgeArtifactSource, type: VARCHAR, description: "Source system or origin of the knowledge artifact. Since v65.0."}
      - {name: knowledge_source_files_list, api_name: knowledgeSourceFilesList, type: JSON, array: 1, schema: KnowledgeSourceFileOutputRepresentation, description: "List of indexed knowledge source files. Since v65.0."}
      - {name: knowledge_source_id, api_name: knowledgeSourceId, type: VARCHAR, description: "Unique identifier of the knowledge source. Since v65.0."}
      - {name: off_core_job_id, api_name: offCoreJobId, type: VARCHAR, description: "Off-core job ID from the search index API call. Since v65.0."}
      - {name: search_index_api_name, api_name: searchIndexApiName, type: VARCHAR, description: "API name of the search index. Since v65.0."}
      - {name: website_url, api_name: websiteUrl, type: VARCHAR, description: "Website URL. Since v65.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `KnowledgeSpaceIndexFilesOutputRepresentation`.
    notes: "**Notes:** The [MedTech kit](https://github.com/salesforce-misc/Data360MedTechSolutionKit/blob/main/.claude/skills/notebook-ai/SKILL.md) covers indexing but not this call, so its `file_path` rule isn't confirmed here. The spec's example uses the `knowledge_space/collections/library/...` form. Copying the `file_path` that [`knowledge_space_details_get`](#knowledge_space_details_get) reports for the file is my suggestion, and no source states it. The spec's response example has an empty `knowledge_source_files_list`, so an empty list doesn't mean nothing was removed."

  - name: deep_research_as_knowledge_source_add
    method: POST
    host: connect
    path: /ssot/knowledge-space/space/{knowledgeSpaceApiNameOrId}/deep-research/source
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Notebook-AI/paths/~1ssot~1knowledge-space~1space~1%7BknowledgeSpaceApiNameOrId%7D~1deep-research~1source/post
    description: Copy a completed deep research report into the knowledge space's GENERATED_RESOURCES library and trigger indexing. This causes the research findings to be available for future queries. Since v67.0.
    example: CALL cdp.deep_research_as_knowledge_source_add (knowledge_space_api_name_or_id => '1T8xx0000004CYqCAM', research_id => 'research-abc123', report_file_path => '/sfdrive/temp/research-abc123-report.md', file_name => 'AI_Research_Trends_Report.md');
    options:
      - {name: knowledge_space_api_name_or_id, api_name: knowledgeSpaceApiNameOrId, in: path, type: string, required: true, description: "API name or ID of the knowledge space. Since v67.0."}
      - {name: id, in: body, type: string, description: "ID of the asset. Since v58.0."}
      - {name: name, in: body, type: string, description: "Name of the asset. Since v58.0."}
      - {name: namespace, in: body, type: string, description: "Namespace of the asset. Since v58.0."}
      - {name: file_name, api_name: fileName, in: body, type: string, description: "File name that overrides the default. If unspecified, the default value is the base name of `report_file_path`. Since v67.0."}
      - {name: report_file_path, api_name: reportFilePath, in: body, type: string, description: "Short-lived sfdrive path where the report is stored. Since v67.0."}
      - {name: research_id, api_name: researchId, in: body, type: string, description: "Deep research job identifier, used for logging. Since v67.0."}
    columns:
      - {name: knowledge_source_id, api_name: knowledgeSourceId, type: VARCHAR, description: "ID of the GENERATED_RESOURCES knowledge source in the library. Since v67.0."}
      - {name: knowledge_src_file_ref_id, api_name: knowledgeSrcFileRefId, type: VARCHAR, description: "ID of the knowledge source file reference record. Since v67.0."}
      - {name: persisted_file_path, api_name: persistedFilePath, type: VARCHAR, description: "Persistent sfdrive path of the copied report. Since v67.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `KnowledgeSpaceDeepResearchAddSourceOutputRepresentation`.
    notes: "**Notes:** No documented call returns `report_file_path`: [`deep_research_report_get`](#deep_research_report_get) returns only `research_id` and the report text. The spec calls the path short-lived, so don't store it for later. The spec says `research_id` is used for logging, which suggests the path decides which report is copied. The spec says this triggers indexing, and no source says how to watch that finish."

  - name: file_chunks_summary_get
    method: POST
    host: connect
    path: /ssot/knowledge-space/summary
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Notebook-AI/paths/~1ssot~1knowledge-space~1summary/post
    description: Get all chunks for files in a knowledge space. Since v65.0.
    example: CALL cdp.file_chunks_summary_get (search_index_name => 'KnowledgeIndex', container_id => ['container-1', 'container-2']);
    options:
      - {name: id, in: body, type: string, description: "ID of the asset. Since v58.0."}
      - {name: name, in: body, type: string, description: "Name of the asset. Since v58.0."}
      - {name: namespace, in: body, type: string, description: "Namespace of the asset. Since v58.0."}
      - {name: additional_filter, api_name: additionalFilter, in: body, map: true, type: object, description: "Additional filter parameters. Since v65.0."}
      - {name: container_id, api_name: containerId, in: body, array: 1, type: string, description: "List of container IDs. Since v65.0."}
      - {name: search_index_name, api_name: searchIndexName, in: body, type: string, description: "Name of the search index. Since v65.0."}
    columns:
      - {name: all_chunks, api_name: allChunks, type: VARCHAR, description: "Content of all chunks. Since v65.0."}
      - {name: file_path, api_name: filepath, type: VARCHAR, description: "File path. Since v65.0."}
    effect: read
    evidence: O
    result_description: One row. Schema `KnowledgeSpaceFileChunksOutputRepresentation`.
    notes: |
      **Notes:** The spec doesn't define `container_id` (its example uses `container-1`) or `additional_filter`. It returns one row even though `container_id` is a list, and `all_chunks` is one string with the chunk text run together. The column is `filepath` here and `filePath` elsewhere. Neither kit's skill calls this function.

      This isn't the Intelligent Context chunks endpoint. The [Retail kit](https://github.com/salesforce-misc/Data360AgentforceSolutionKitRetail/blob/main/.claude/skills/intelligent-context/SKILL.md) reports that `POST /ssot/intelligent-context/{lens}/chunks` returns `UNKNOWN_EXCEPTION` indefinitely on `{"files":[]}`, and transiently for about the first 90 seconds. This call has no `files` option, and no source shows how it treats an empty `container_id`.

