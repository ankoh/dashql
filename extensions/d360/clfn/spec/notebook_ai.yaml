  - name: knowledge_space_details_get
    method: GET
    host: connect
    path: /ssot/knowledge-space/{knowledgeSpaceApiNameOrId}/details
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Notebook-AI/paths/~1ssot~1knowledge-space~1%7BknowledgeSpaceApiNameOrId%7D~1details/get
    description: Reads one knowledge space with its libraries, sources and files. Use it to find the library to upload into and to poll file indexing. Since v65.0.
    example: CALL cdp.knowledge_space_details_get (knowledge_space_api_name_or_id => '1T8xx0000004CYqCAM');
    options:
      - {name: knowledge_space_api_name_or_id, api_name: knowledgeSpaceApiNameOrId, in: path, type: string, required: true, description: "API name or ID of the knowledge space."}
    columns:
      - {name: client_context, api_name: clientContext, type: VARCHAR, description: "Client context of the knowledge space. Since v65.0."}
      - {name: dataspace, api_name: dataSpace, type: VARCHAR, description: "Name of the data space that the knowledge space belongs to. Since v65.0."}
      - {name: description, type: VARCHAR, description: "Description of the knowledge space. Since v65.0."}
      - {name: developer_name, api_name: developerName, type: VARCHAR, description: "Developer name of the knowledge space. Since v65.0."}
      - {name: knowledge_space_config_id, api_name: knowledgeSpaceConfigId, type: VARCHAR, description: "ID of the knowledge space configuration. Since v65.0."}
      - {name: knowledge_space_def_id, api_name: knowledgeSpaceDefId, type: VARCHAR, description: "Definition ID of the knowledge space. Since v65.0."}
      - {name: knowledge_space_id, api_name: knowledgeSpaceId, type: VARCHAR, description: "ID of the knowledge space. Since v65.0."}
      - {name: label, type: VARCHAR, description: "Label of the knowledge space. Since v65.0."}
      - {name: libraries, type: JSON, array: 1, schema: KnowledgeSpaceLibraryOutputRepresentation, description: "List of libraries in the knowledge space. Since v65.0."}
    effect: read
    evidence: O
    result_description: One row. Schema `KnowledgeSpaceOutputRepresentation`.
    notes: |
      **Notes:** This returns one row, not a list. The useful data is nested in the `libraries` JSON column, at `libraries[].sources[].files[]`.

      The [MedTech kit](https://github.com/salesforce-misc/Data360MedTechSolutionKit/blob/main/.claude/skills/notebook-ai/SKILL.md) takes the upload target from the library with `knowledge_category` = `PERSONAL`. `sources` stays `[]` until indexing starts, so this call can't show whether a file already reached S3 (one org).

  - name: session_conversation_list
    method: GET
    host: connect
    path: /ssot/knowledge-space/{knowledgeSpaceApiNameOrId}/session/{knowledgeSpaceSessionId}/conversation
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Notebook-AI/paths/~1ssot~1knowledge-space~1%7BknowledgeSpaceApiNameOrId%7D~1session~1%7BknowledgeSpaceSessionId%7D~1conversation/get
    description: Get conversation messages for a knowledge space session. Since v65.0.
    example: CALL cdp.session_conversation_list (knowledge_space_api_name_or_id => '1T8xx0000004CYqCAM', knowledge_space_session_id => 'session-123');
    options:
      - {name: knowledge_space_api_name_or_id, api_name: knowledgeSpaceApiNameOrId, in: path, type: string, required: true, description: "API name or ID of the knowledge space."}
      - {name: knowledge_space_session_id, api_name: knowledgeSpaceSessionId, in: path, type: string, required: true, description: "ID of the knowledge space session."}
    rows: /messages
    columns:
      - {name: cited_references, api_name: citedReferences, type: JSON, description: "List of cited references. Since v65.0."}
      - {name: feedback_id, api_name: feedbackId, type: VARCHAR, description: "Feedback ID for the message. Since v65.0."}
      - {name: id, type: VARCHAR, description: "Unique identifier of the message. Since v65.0."}
      - {name: is_content_safe, api_name: isContentSafe, type: BOOLEAN, description: "Indicates whether the content is safe (`true`) or not (`false`). Since v65.0."}
      - {name: message, type: VARCHAR, description: "Message content for the InformResponseMessage type. Since v65.0."}
      - {name: message_type, api_name: messageType, type: VARCHAR, description: "Type of the message. Since v65.0."}
      - {name: sequence_id, api_name: sequenceId, type: BIGINT, description: "Sequence ID of the message. Since v65.0."}
      - {name: text, type: VARCHAR, description: "Text content of the message. Since v65.0."}
      - {name: timestamp, type: BIGINT, description: "Timestamp of the message. Since v65.0."}
      - {name: role, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
      - {name: content, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
    effect: read
    evidence: O
    result_description: One row per item of `/messages` in the response. Schema `KnowledgeSpaceConversationMsgOutputRepresentation`.
    notes: "**Notes:** The spec contradicts itself here. The schema has `message`, `text`, `message_type` and a BIGINT `timestamp`. Its response example has `role`, `content` and an ISO 8601 string `timestamp`. If the example is right, the columns above stay empty and the data is only in `_raw`."

