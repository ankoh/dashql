    result_description: One row. Schema `KnowledgeSpaceRunResearchOutputRepresentation`.
    notes: "**Notes:** The JSON columns have no schema in the spec. Its examples show `run_details` with `start_time`, `currentStep` and `progress`, and `plan` with `title`, `estimatedDurationMinutes` and `steps`. `report` is an object here, while [`deep_research_report_get`](#deep_research_report_get) returns it as a string."

