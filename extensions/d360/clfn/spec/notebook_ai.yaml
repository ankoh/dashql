  - name: files_index
    method: POST
    host: connect
    path: /ssot/knowledge-space/index-files
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Notebook-AI/paths/~1ssot~1knowledge-space~1index-files/post
    description: Starts indexing files already uploaded to a library, or a website URL. It's the last step of the upload flow, after `presigned_urls_get` and the S3 `PUT`. Since v65.0.
    example: CALL cdp.files_index (knowledge_artifact_id => '1aQxx00000000JNEAY', knowledge_artifact_source => 'FILE_UPLOAD', knowledge_source_files_list => [(file_name = 'report.pdf', file_path = 'collections/1aQxx00000000JNEAY/report.pdf', file_type = 'PDF')]);
    options:
      - {name: id, in: body, type: string, description: "ID of the asset. Since v58.0."}
      - {name: name, in: body, type: string, description: "Name of the asset. Since v58.0."}
      - {name: namespace, in: body, type: string, description: "Namespace of the asset. Since v58.0."}
      - {name: knowledge_artifact_id, api_name: knowledgeArtifactId, in: body, type: string, description: "ID of the library the files belong to: `knowledge_library_id`, not the knowledge space ID."}
      - {name: knowledge_artifact_source, api_name: knowledgeArtifactSource, in: body, type: string, description: "`FILE_UPLOAD` or `URL`, the two values in the spec's examples."}
      - {name: knowledge_source_files_list, api_name: knowledgeSourceFilesList, in: body, schema: KnowledgeSpaceIndexFilesInput_knowledgeSourceFilesList, array: 1, description: "Items take `file_name`, `file_path`, `file_type` and `fileIndexStatus`, from `KnowledgeSourceFileInputRepresentation`. The spec types the items as plain objects."}
      - {name: knowledge_source_id, api_name: knowledgeSourceId, in: body, type: string, description: "Unique identifier of the knowledge source. Applies only to URL sources. Since v65.0."}
      - {name: search_index_api_name, api_name: searchIndexApiName, in: body, type: string, description: "API name of the search index to use for knowledge indexing. Since v65.0."}
      - {name: website_url, api_name: websiteUrl, in: body, type: string, description: "Website URL. Since v65.0."}
    columns:
      - {name: knowledge_artifact_id, api_name: knowledgeArtifactId, type: VARCHAR, description: "Unique identifier of the knowledge artifact. Since v65.0."}
      - {name: knowledge_artifact_source, api_name: knowledgeArtifactSource, type: VARCHAR, description: "Source system or origin of the knowledge artifact. Since v65.0."}
      - {name: knowledge_source_files_list, api_name: knowledgeSourceFilesList, type: JSON, array: 1, schema: KnowledgeSourceFileOutputRepresentation, description: "List of indexed knowledge source files. Since v65.0."}
      - {name: knowledge_source_id, api_name: knowledgeSourceId, type: VARCHAR, description: "Unique identifier of the knowledge source. Since v65.0."}
      - {name: off_core_job_id, api_name: offCoreJobId, type: VARCHAR, description: "Off-core job ID from the search index API call. Since v65.0."}
      - {name: search_index_api_name, api_name: searchIndexApiName, type: VARCHAR, description: "API name of the search index. Since v65.0."}
      - {name: website_url, api_name: websiteUrl, type: VARCHAR, description: "Website URL. Since v65.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `KnowledgeSpaceIndexFilesOutputRepresentation`.
    notes: |
      **Done when:** [`knowledge_space_details_get`](#knowledge_space_details_get), at `libraries[].sources[].files[].fileStatus`: `INDEXED` or `FAILED`. `IN_PROGRESS` and `PROCESSING` mean it's still running. The [MedTech kit](https://github.com/salesforce-misc/Data360MedTechSolutionKit/blob/main/.claude/skills/notebook-ai/SKILL.md) polls every 10 seconds for about 5 minutes.

      **Notes:** **`file_path` conflict.** The [MedTech kit](https://github.com/salesforce-misc/Data360MedTechSolutionKit/blob/main/.claude/skills/notebook-ai/SKILL.md) says it must be `collections/{knowledgeLibraryId}/{fileName}`, "NOT `knowledge_space/collections/...`". The spec's examples use `knowledge_space/collections/library/document.pdf`. The kit's form is the one it ran (one org), so the example above uses it.

      **Not safely retryable.** This can take 60 to 180 seconds, and it has returned HTTP 500 after indexing began (one org). After a timeout or 5xx, the kit waits about 5 seconds and reads the file status first. It re-sends only if none of the files appear, and only once, because a re-send can start a duplicate job. It also never sends files that are already `INDEXED` or still running.

      **Failures.** `FAILED` means the file never reached S3 or `file_path` is wrong, according to the kit, which stops rather than retrying. Accepted types are PDF, TXT and HTML, and other types fail with `Unsupported file type`. Small files can return `INDEXED` right away.

      The URL form (`knowledge_artifact_source => 'URL'` with `website_url`) appears only in the spec's example, and the kit doesn't cover it. No example sends `search_index_api_name`.

      For comparison, the [Retail kit](https://github.com/salesforce-misc/Data360AgentforceSolutionKitRetail/blob/main/.claude/skills/intelligent-context/SKILL.md) reports a 30 to 90 second wait between upload and processing for Intelligent Context. That's a different pipeline, and the MedTech kit has no such wait.

