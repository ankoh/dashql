    description: Get all sessions for a knowledge space. Since v65.0.
    example: CALL cdp.knowledge_space_session_list (knowledge_space_api_name_or_id => '1T8xx0000004CYqCAM', limit => 20);
    options:
      - {name: knowledge_space_api_name_or_id, api_name: knowledgeSpaceApiNameOrId, in: path, type: string, required: true, description: "API name or ID of the knowledge space."}
      - {name: limit, in: query, type: integer, description: "Maximum number of sessions to return. Since v65.0."}
    rows: /knowledgeSpaceSessions
    columns:
      - {name: agent_type, api_name: agentType, type: VARCHAR, description: "Agent type used when the session was created. Since v65.0."}
      - {name: knowledge_space_def_id, api_name: knowledgeSpaceDefId, type: VARCHAR, description: "Definition ID of the knowledge space. Since v65.0."}
      - {name: knowledge_space_id, api_name: knowledgeSpaceId, type: VARCHAR, description: "ID of the knowledge space. Since v65.0."}
      - {name: knowledge_space_session_entity_id, api_name: knowledgeSpaceSessionEntityId, type: VARCHAR, description: "Entity ID of the knowledge space session. Since v65.0."}
      - {name: last_active_time, api_name: lastActiveTime, type: VARCHAR, description: "Last active time of the session. Since v65.0."}
      - {name: session_id, api_name: sessionId, type: VARCHAR, description: "ID of the knowledge space session. Since v65.0."}
    effect: read
    evidence: O
    result_description: One row per item of `/knowledgeSpaceSessions` in the response. Schema `KnowledgeSpaceSessionOutputRepresentation`.
    notes: "**Notes:** `limit` is the only paging control in the spec, with no offset or token. The result has both `session_id` and `knowledge_space_session_entity_id`, and no source says which one the session calls expect as `knowledge_space_session_id`."

