    example: CALL cdp.tag_bulk_create (tags => [(fully_qualified_name = 'Compliance_Tags.PII.Phone', label = 'Phone Number', description = 'Phone numbers (personal or business).'), (fully_qualified_name = 'Compliance_Tags.PII.CreditCard', label = 'Credit Card Number', description = 'Credit card PAN, PCI-regulated.', classification_fully_qualified_names = ['Compliance_Classifications.PII', 'Compliance_Classifications.Sensitive'])]);
    options:
      - {name: tags, in: body, schema: TagCreateInputRepresentation, array: 1, description: "List of tag create inputs. Since v67.0."}
    columns:
      - {name: has_errors, api_name: hasErrors, type: BOOLEAN, description: "Indicates whether any item failed (`true`) or all items succeeded (`false`). Since v67.0."}
      - {name: results, type: JSON, array: 1, schema: BatchResultItemRepresentation, description: "List of per-item results in the same order as the input list. Since v67.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `BatchRepresentation`.
    notes: "**Notes:** Send parents and children in separate calls, parents first. The spec's sample has an intentionally invalid item, removed here."

  - name: tag_bulk_delete
    method: POST
    host: connect
    path: /ssot/data-governance/tags/actions/bulk-delete
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Governance/paths/~1ssot~1data-governance~1tags~1actions~1bulk-delete/post
    description: Deletes multiple tags in a single request, cascading each deletion to its child tags and assignments. Since v67.0.
    example: CALL cdp.tag_bulk_delete (fully_qualified_names => ['Compliance_Tags.PII.Phone', 'Compliance_Tags.PII.Obsolete']);
    options:
      - {name: fully_qualified_names, api_name: fullyQualifiedNames, in: body, array: 1, type: string, description: "Fully-qualified API names of tags to delete. Maximum of 200 items. Since v67.0."}
    columns:
      - {name: has_errors, api_name: hasErrors, type: BOOLEAN, description: "Indicates whether any item failed (`true`) or all items succeeded (`false`). Since v67.0."}
      - {name: results, type: JSON, array: 1, schema: BatchResultItemRepresentation, description: "List of per-item results in the same order as the input list. Since v67.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `BatchRepresentation`.

  - name: tag_bulk_update
    method: POST
    host: connect
    path: /ssot/data-governance/tags/actions/bulk-update
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Governance/paths/~1ssot~1data-governance~1tags~1actions~1bulk-update/post
    description: Updates multiple tags in a single requests. Omitted fields are left unchanged. Validation runs against the state before the batch operation. For example, if item 1 re-parents tag A and item 2 references tag A, item 2 validates against tag A's ancestry before the batch operation. Since v67.0.
    example: CALL cdp.tag_bulk_update (items => [(fully_qualified_name = 'Compliance_Tags.PII.Email', label = 'Email Address (PII)'), (fully_qualified_name = 'Compliance_Tags.PII.Phone', parent_tag_fully_qualified_name = 'Compliance_Tags.PII.Contact'), (fully_qualified_name = 'Compliance_Tags.PII.CreditCard', classification_fully_qualified_names = ['Compliance_Classifications.PII', 'Compliance_Classifications.Sensitive'])]);
    options:
      - {name: items, in: body, schema: TagBulkUpdateItemInputRepresentation, array: 1, description: "List of tag update items. Since v67.0."}
    columns:
      - {name: has_errors, api_name: hasErrors, type: BOOLEAN, description: "Indicates whether any item failed (`true`) or all items succeeded (`false`). Since v67.0."}
      - {name: results, type: JSON, array: 1, schema: BatchResultItemRepresentation, description: "List of per-item results in the same order as the input list. Since v67.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `BatchRepresentation`.
    notes: "**Notes:** The spec's sample has an intentionally failing item, removed here."

  - name: tags_propagate
    method: POST
    host: connect
    path: /ssot/data-governance/tags/actions/propagate
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Governance/paths/~1ssot~1data-governance~1tags~1actions~1propagate/post
    description: Propagates data governance tags to the specified objects. Since v67.0.
    example: CALL cdp.tags_propagate (object_names => ['Individual_DLO__dll', 'Contact_DLO__dll']);
    options:
      - {name: object_names, api_name: objectNames, in: body, array: 1, type: string, required: true, description: "List of object developer names to propagate the tag to. Since v67.0."}
    columns:
      - {name: has_errors, api_name: hasErrors, type: BOOLEAN, description: "Indicates whether any item failed (`true`) or all items succeeded (`false`). Since v67.0."}
      - {name: results, type: JSON, array: 1, schema: BatchResultItemRepresentation, description: "List of per-item results in the same order as the input list. Since v67.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `BatchRepresentation`.
    notes: "**Notes:** The body names objects but no tags, and the spec doesn't say which tags move or whether the work finishes before the call returns. The option says the objects are propagated *to*, while [Help](https://help.salesforce.com/s/articleView?language=en_US&id=data.c360_a_using_tagging_and_classification_dg.htm&type=5) describes tags going from a source object to its downstream objects, and the spec's samples pass DLOs (Help, seen only in a search excerpt). [Data graphs](https://help.salesforce.com/apex/HTViewHelpDoc?id=data.c360_a_data_graph_tag_propagation.htm) also depend on this: a tag added to a DMO after the graph exists needs manual propagation, and a user missing any required tag can't read the graph (same caveat). At most 20 objects."

  - name: access_policy_rule_replace
    method: PUT
    host: connect
    path: /ssot/data-governance/access-policies/{name}/rules/{ruleName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Governance/paths/~1ssot~1data-governance~1access-policies~1%7Bname%7D~1rules~1%7BruleName%7D/put
    description: Overwrites or upserts a single rule within an access policy. Since v67.0.
    example: CALL cdp.access_policy_rule_replace (name => 'RestrictSensitiveFields', rule_name => 'Mask_SSN', body_name => 'Mask_SSN', label => 'Mask SSN', category => 'TRANSFORM_POLICY_RULE_DEFINITION', effect => 'Transform', action => ['Read'], resource_scope_type => 'FIELD', principal_scope_type => 'ANY', resource_domains => ['Account__dlm'], resource_transform => 'FIRST_N_CHARS_RESOURCE_TRANSFORM', resource_transform_arguments => [(type = 'NUMBER', value = '4')], transform_precedence => 100);
    options:
      - {name: name, in: path, type: string, required: true, description: "Developer name of the parent access policy."}
      - {name: rule_name, api_name: ruleName, in: path, type: string, required: true, description: "Developer name of the rule. Must equal `body_name`."}
      - {name: action, in: body, array: 1, type: string, description: "Actions the rule applies to, such as `Read`. Since v67.0."}
      - {name: category, in: body, type: string, enum: [ACCESS_POLICY_RULE_DEFINITION, GOVERNANCE_POLICY_RULE_DEFINITION, TRANSFORM_POLICY_RULE_DEFINITION, RECORD_POLICY_RULE_DEFINITION, IDENTIFIED_RECORD_POLICY_RULE_DEFINITION], required: true, description: "MDAPI rule category. Since v67.0."}
      - {name: effect, in: body, type: string, enum: [Permit, Forbid, Transform], required: true, description: "Effect of the rule. Since v67.0."}
      - {name: label, in: body, type: string, description: "Display label for the rule. Since v67.0."}
      - {name: body_name, api_name: name, in: body, type: string, required: true, description: "Developer name of the rule (PolicyRuleDefinition fullName). Since v67.0."}
      - {name: principal_authentication_level, api_name: principalAuthenticationLevel, in: body, type: string, enum: [UNIDENTIFIED, IDENTIFIED, AUTHENTICATED, INTERNAL], description: "Required principal authentication level. Since v67.0."}
      - {name: principal_scope_type, api_name: principalScopeType, in: body, type: string, enum: [ANY], description: "Principal scope type. Since v67.0."}
      - {name: resource_domains, api_name: resourceDomains, in: body, array: 1, type: string, description: "DMOs or objects the rule scopes to. Required for record-scope (RLS) rules. Since v67.0."}
      - {name: resource_scope_type, api_name: resourceScopeType, in: body, type: string, enum: [ANY, FIELD, RECORD], description: "Resource scope type. Since v67.0."}
      - {name: resource_transform, api_name: resourceTransform, in: body, type: string, enum: [LAST_N_CHARS_RESOURCE_TRANSFORM, FIRST_N_CHARS_RESOURCE_TRANSFORM, ALL_BUT_LAST_N_CHARS_RESOURCE_TRANSFORM, ALL_BUT_FIRST_N_CHARS_RESOURCE_TRANSFORM, CLOSEST_ORDER_OF_MAGNITUDE_RESOURCE_TRANSFORM, NULL_RESOURCE_TRANSFORM, EMPTY_STRING_RESOURCE_TRANSFORM, TRUNCATE_DATE_RESOURCE_TRANSFORM, ROUND_RESOURCE_TRANSFORM, REPLACE_ALL_CHARS_RESOURCE_TRANSFORM], description: "For Transform or FLS rules, the transform applied to the field. Since v67.0."}
      - {name: resource_transform_arguments, api_name: resourceTransformArguments, in: body, schema: ResourceTransformArgumentInputRepresentation, array: 1, description: "Static argument list for the resource transform, such as the `2` for `FIRST_N_CHARS_RESOURCE_TRANSFORM`. Since v67.0."}
      - {name: rule_consumer, api_name: ruleConsumer, in: body, type: string, enum: [ALL, DATACLOUD, MULESOFT, TABLEAU, CORE], description: "Consumer of the rule's enforcement. Since v67.0."}
      - {name: transform_precedence, api_name: transformPrecedence, in: body, type: integer, description: "Tiebreaker when multiple Transform rules apply to the same field. The lower value wins. Applies only to Transform-effect rules. Since v67.0."}
      - {name: unless, in: body, schema: ConditionGroupInputRepresentation, description: "Condition group that, when met, exempts the rule from applying. Since v67.0."}
      - {name: when, in: body, schema: ConditionGroupInputRepresentation, description: "Condition group that must be met for the rule to apply. Since v67.0."}
    columns:
      - {name: action, type: JSON, description: "Actions the rule applies to, such as `Read`. Since v67.0."}
      - {name: category, type: VARCHAR, description: "MDAPI rule category, which determines the validator that dispatches. Since v67.0."}
      - {name: effect, type: VARCHAR, description: "Effect of the rule. Since v67.0."}
      - {name: id, type: VARCHAR, description: "18-character record ID of the underlying PolicyRuleDefinition. Since v67.0."}
      - {name: label, type: VARCHAR, description: "Display label for the rule. Since v67.0."}
      - {name: name, type: VARCHAR, description: "Developer name of the rule (PolicyRuleDefinition fullName). Since v67.0."}
      - {name: principal_authentication_level, api_name: principalAuthenticationLevel, type: VARCHAR, description: "Required principal authentication level. Since v67.0."}
      - {name: principal_scope_type, api_name: principalScopeType, type: VARCHAR, description: "Principal scope type. Since v67.0."}
      - {name: resource_domains, api_name: resourceDomains, type: JSON, description: "DMOs or objects the rule scopes to. Required for record-scope (RLS) rules; typically empty or absent for OLS or FLS. Since v67.0."}
      - {name: resource_scope_type, api_name: resourceScopeType, type: VARCHAR, description: "Resource scope type. Since v67.0."}
      - {name: resource_transform, api_name: resourceTransform, type: VARCHAR, description: "For Transform or FLS rules, the transform applied to the field before the principal sees it. Since v67.0."}
      - {name: resource_transform_arguments, api_name: resourceTransformArguments, type: JSON, array: 1, schema: ResourceTransformArgumentRepresentation, description: "Static argument list for the resource transform, such as the `2` for `FIRST_N_CHARS_RESOURCE_TRANSFORM`. Since v67.0."}
      - {name: rule_consumer, api_name: ruleConsumer, type: VARCHAR, description: "Consumer of the rule's enforcement. Since v67.0."}
      - {name: transform_precedence, api_name: transformPrecedence, type: BIGINT, description: "Tiebreaker when multiple Transform rules apply to the same field. The lower value wins. Emitted only on Transform-effect rules. Since v67.0."}
      - {name: unless, type: JSON, schema: ConditionGroupRepresentation, description: "Condition group that, when met, exempts the rule from applying. Since v67.0."}
      - {name: when, type: JSON, schema: ConditionGroupRepresentation, description: "Condition group that must be met for the rule to apply. Since v67.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `AccessPolicyRuleRepresentation`.
    notes: "**Notes:** `rule_name` and `body_name` must be equal, or the call returns `NAME_MISMATCH`. It's a full overwrite, and the schema requires each condition's `id` on update, so read the rule with `access_policy_rule_get` first and send those ids back. No call deletes a single rule, and the spec doesn't show what upserting a second rule into a one-rule policy does. A 403 can mean a missing `CanAccessCustomerDataCloudAPI` or `ModifyAccessPolicies` permission."

schemas:
  AccessPolicyRuleInputRepresentation:
    description: Represents the input for a single rule within an access policy.
    attributes:
      - {name: action, array: 1, type: string, description: "Actions the rule applies to, such as `Read`. Since v67.0."}
      - {name: category, type: string, enum: [ACCESS_POLICY_RULE_DEFINITION, GOVERNANCE_POLICY_RULE_DEFINITION, TRANSFORM_POLICY_RULE_DEFINITION, RECORD_POLICY_RULE_DEFINITION, IDENTIFIED_RECORD_POLICY_RULE_DEFINITION], required: true, description: "MDAPI rule category. Since v67.0."}
      - {name: effect, type: string, enum: [Permit, Forbid, Transform], required: true, description: "Effect of the rule. Since v67.0."}
      - {name: label, type: string, description: "Display label for the rule. Since v67.0."}
      - {name: name, type: string, required: true, description: "Developer name of the rule (PolicyRuleDefinition fullName). Since v67.0."}
      - {name: principal_authentication_level, api_name: principalAuthenticationLevel, type: string, enum: [UNIDENTIFIED, IDENTIFIED, AUTHENTICATED, INTERNAL], description: "Required principal authentication level. Since v67.0."}
      - {name: principal_scope_type, api_name: principalScopeType, type: string, enum: [ANY], description: "Principal scope type. Since v67.0."}
      - {name: resource_domains, api_name: resourceDomains, array: 1, type: string, description: "DMOs or objects the rule scopes to. Required for record-scope (RLS) rules. Since v67.0."}
      - {name: resource_scope_type, api_name: resourceScopeType, type: string, enum: [ANY, FIELD, RECORD], description: "Resource scope type. Since v67.0."}
      - {name: resource_transform, api_name: resourceTransform, type: string, enum: [LAST_N_CHARS_RESOURCE_TRANSFORM, FIRST_N_CHARS_RESOURCE_TRANSFORM, ALL_BUT_LAST_N_CHARS_RESOURCE_TRANSFORM, ALL_BUT_FIRST_N_CHARS_RESOURCE_TRANSFORM, CLOSEST_ORDER_OF_MAGNITUDE_RESOURCE_TRANSFORM, NULL_RESOURCE_TRANSFORM, EMPTY_STRING_RESOURCE_TRANSFORM, TRUNCATE_DATE_RESOURCE_TRANSFORM, ROUND_RESOURCE_TRANSFORM, REPLACE_ALL_CHARS_RESOURCE_TRANSFORM], description: "For Transform or FLS rules, the transform applied to the field. Since v67.0."}
      - {name: resource_transform_arguments, api_name: resourceTransformArguments, schema: ResourceTransformArgumentInputRepresentation, array: 1, description: "Static argument list for the resource transform, such as the `2` for `FIRST_N_CHARS_RESOURCE_TRANSFORM`. Since v67.0."}
      - {name: rule_consumer, api_name: ruleConsumer, type: string, enum: [ALL, DATACLOUD, MULESOFT, TABLEAU, CORE], description: "Consumer of the rule's enforcement. Since v67.0."}
      - {name: transform_precedence, api_name: transformPrecedence, type: integer, description: "Tiebreaker when multiple Transform rules apply to the same field. The lower value wins. Applies only to Transform-effect rules. Since v67.0."}
      - {name: unless, schema: ConditionGroupInputRepresentation, description: "Condition group that, when met, exempts the rule from applying. Since v67.0."}
      - {name: when, schema: ConditionGroupInputRepresentation, description: "Condition group that must be met for the rule to apply. Since v67.0."}

  ClassificationAssignmentBulkItemInputRepresentation:
    description: Represents a single classification with its list of target tags for bulk creation.
    attributes:
      - {name: classification_fully_qualified_name, api_name: classificationFullyQualifiedName, type: string, required: true, description: "Fully-qualified API name of the source classification. Since v67.0."}
      - {name: tag_fully_qualified_names, api_name: tagFullyQualifiedNames, array: 1, type: string, required: true, description: "Fully-qualified API names of the target tags. Maximum 50. Since v67.0."}

  ClassificationBulkUpdateItemInputRepresentation:
    description: Represents the input for a single classification item in a bulk update operation.
    attributes:
      - {name: description, type: string, description: "Updated description. Since v67.0."}
      - {name: fully_qualified_name, api_name: fullyQualifiedName, type: string, description: "Fully-qualified API name of the classification to update. Since v67.0."}
      - {name: label, type: string, description: "Updated display label. Since v67.0."}
      - {name: tag_fully_qualified_names, api_name: tagFullyQualifiedNames, array: 1, type: string, description: "Replaces all tag links. Maximum of 200 items. Provide an empty list to remove all links. Omit to leave unchanged. Since v67.0."}

  ClassificationCreateInputRepresentation:
    description: Represents the input for creating a data governance classification.
    attributes:
      - {name: description, type: string, description: "Description of the classification. Since v67.0."}
      - {name: fully_qualified_name, api_name: fullyQualifiedName, type: string, description: "Fully-qualified API name of the classification in dotted path format. Use 2-3 segments: `<TaxonomyName>.<Level1>[.<Level2>]`. Since v67.0."}
      - {name: label, type: string, description: "Display label of the classification. Since v67.0."}
      - {name: tag_fully_qualified_names, api_name: tagFullyQualifiedNames, array: 1, type: string, description: "Fully-qualified API names of tags to associate with the classification. Maximum of 200 items. Since v67.0."}

  ConditionGroupInputRepresentation:
    description: Recursive group of conditions joined by AND or OR.
    attributes:
      - {name: operands, schema: ConditionNodeInputRepresentation, array: 1, description: "Operands joined by the operator. Each operand is either a nested group or a leaf condition. Required. Since v67.0."}
      - {name: operator, type: string, description: "Logical operator joining the operands (AND or OR). Required. Since v67.0."}

  ConditionLeafInputRepresentation:
    description: Leaf condition within an AccessPolicy clause tree.
    attributes:
      - {name: clause, type: string, enum: [WHEN, UNLESS], description: "Which clause of the rule this condition belongs to. Since v67.0."}
      - {name: context_path, api_name: contextPath, type: string, enum: [SESSION_DATASPACE, SESSION_CONSUMER_ID, CONTEXT_AGENT_ID, CONTEXT_AGENT_VERSION_ID], description: "Context-side path the condition tests. Mutually exclusive with principal_path / resource_path. Since v67.0."}
      - {name: id, type: string, description: "18-character record ID of the underlying PolicyRuleDefinitionCond. Optional on create; required on update. Since v67.0."}
      - {name: operator, type: string, enum: [EQUALS, NOT_EQUALS, GREATER_THAN, LESS_THAN, GREATER_THAN_OR_EQUAL, LESS_THAN_OR_EQUALS, IN, LIKE, CONTAINS_ANY, CONTAINS_NONE, CONTAINS_ALL, IS, EXISTS, HIERARCHICALLY_ABOVE, HIERARCHICALLY_BELOW, CONTAINS, STARTS_WITH, ENDS_WITH], description: "Comparison operator applied to the selected condition path. Valid operators depend on the selected path and value type. Required. Since v67.0."}
      - {name: principal_path, api_name: principalPath, type: string, enum: [IS_AUTHENTICATED, ASSIGNED_PERMISSIONS_PATH, USER_ID, ORGANIZATION_ID, USER_ROLE_ID, RBAC_TAGS, SCALAR_ATTRIBUTE, PLURAL_ATTRIBUTE, PLACEHOLDER, IS_INTERNAL, CONTACT_ID], description: "Principal-side path the condition tests. Mutually exclusive with resource_path / context_path. Since v67.0."}
      - {name: resource_expression, api_name: resourceExpression, schema: ResourceExpressionInputRepresentation, description: "Projection or join expression that relates the resource-side row to another object. Mutually exclusive with values and value_principal_path. Since v67.0."}
      - {name: resource_path, api_name: resourcePath, type: string, enum: [NAMESPACE, ENTITY, RESOURCE, FIELD, ENTITYTYPE, ENTITYKIND, FIELDKIND, DATASPACE, TAG, SYSTEMTAG, OBJECT_TAG, CLASSIFICATION, IMPLICITTAG, OBJECT_SYSTEMTAG, RECORDFIELD, OBJECT_CLASSIFICATION, EXPRESSION, OBJECT_DATASPACE, RECORDFIELDTYPE, METADATAKIND, OBJECT], description: "Resource-side path the condition tests. Mutually exclusive with principal_path / context_path. Since v67.0."}
      - {name: value_domain, api_name: valueDomain, type: string, description: "Optional value-domain qualifier scoping the comparison. Since v67.0."}
      - {name: value_principal_path, api_name: valuePrincipalPath, type: string, enum: [IS_AUTHENTICATED, ASSIGNED_PERMISSIONS_PATH, USER_ID, ORGANIZATION_ID, USER_ROLE_ID, RBAC_TAGS, SCALAR_ATTRIBUTE, PLURAL_ATTRIBUTE, PLACEHOLDER, IS_INTERNAL, CONTACT_ID], description: "Right-side dynamic value pulled from the current principal. Mutually exclusive with values and resource_expression. Since v67.0."}
      - {name: values, schema: PolicyValueInputRepresentation, array: 1, description: "Typed values the operator compares against. Mutually exclusive with value_principal_path and resource_expression. Since v67.0."}

  ConditionNodeInputRepresentation:
    description: Node in a recursive AccessPolicy condition tree (group or condition). Exactly one of group or condition must be provided.
    attributes:
      - {name: condition, schema: ConditionLeafInputRepresentation, description: "Leaf condition at this node. Provide either condition or group, but not both. Since v67.0."}
      - {name: group, schema: ConditionGroupInputRepresentation, description: "Nested condition group at this node. Provide either group or condition, but not both. Since v67.0."}

  PolicyValueInputRepresentation:
    description: A single typed value within an AccessPolicy condition's value set. Exactly one of the typed value fields (or the reference pair) must be provided.
    attributes:
      - {name: boolean_value, api_name: booleanValue, type: boolean, description: "Boolean-typed value (mutually exclusive with the other typed value fields). Since v67.0."}
      - {name: date_time_value, api_name: dateTimeValue, type: string, format: date-time, description: "DateTime-typed value (UTC instant, mutually exclusive with the other typed value fields). Since v67.0."}
      - {name: date_value, api_name: dateValue, type: string, format: date-time, description: "Date-typed value (UTC calendar day, mutually exclusive with the other typed value fields). Since v67.0."}
      - {name: number_value, api_name: numberValue, type: string, description: "Number-typed value, string-encoded to preserve BigDecimal precision. Mutually exclusive with the other typed value fields. Since v67.0."}
      - {name: percent_value, api_name: percentValue, type: string, description: "Percent-typed value, string-encoded to preserve BigDecimal precision. Mutually exclusive with the other typed value fields. Since v67.0."}
      - {name: reference, type: string, description: "Reference value (for example, a tag, classification, or custom permission API name). Paired with reference_type. Orthogonal to the typed value fields. Since v67.0."}
      - {name: reference_type, api_name: referenceType, type: string, description: "Type discriminator for the reference field (for example, STANDARD_TAG, CUSTOM_TAG, STANDARD_CLASSIFICATION, CUSTOM_PERMISSION). Since v67.0."}
      - {name: text_value, api_name: textValue, type: string, description: "Plain-text value. Mutually exclusive with the other typed value fields. Since v67.0."}

  ResourceExpressionInputRepresentation:
    description: Projection/join expression for an RLS-with-joins condition (EXISTS operator).
    attributes:
      - {name: projection, schema: ResourceExpressionJoinInputRepresentation, description: "Join definition of the projection, specifying the joined object, its alias, and the join predicate. Since v67.0."}
      - {name: type, type: string, description: "Expression type — always PROJECTION for join-based RLS. Required. Since v67.0."}
      - {name: version, type: integer, description: "Schema version of the expression body. Since v67.0."}

  ResourceExpressionJoinInputRepresentation:
    description: A single join within an AccessPolicy resource-expression projection.
    attributes:
      - {name: alias, type: string, description: "Alias used to qualify the joined relation in the predicate, for example `individual`. Required. Since v67.0."}
      - {name: predicate, schema: ResourceExpressionPredicateInputRepresentation, description: "Join predicate that specifies how a row in the joined object relates to the resource-side row. Since v67.0."}
      - {name: schema, type: string, description: "Joined Data Model Object or object API name, for example `Individual__dlm`. This is a name, not a record ID. Required. Since v67.0."}

  ResourceExpressionPredicateInputRepresentation:
    description: Represents the join predicate of an AccessPolicy resource-expression projection.
    attributes:
      - {name: predicate, type: string, required: true, description: "Join predicate definition, as a JSON expression that relates a row in the joined object to the resource-side row. Since v67.0."}

  ResourceTransformArgumentInputRepresentation:
    description: A static argument to an AccessPolicy rule's resource transform. Value is always string-encoded regardless of type.
    attributes:
      - {name: type, type: string, description: "Argument type discriminator (STRING, NUMBER, BOOLEAN). Required. Since v67.0."}
      - {name: value, type: string, description: "Argument value, string-encoded regardless of type. Required. Since v67.0."}

  TagAssignmentTargetInputRepresentation:
    description: Represents a target object and optional field for a tag assignment.
    attributes:
      - {name: field_name, api_name: fieldName, type: string, description: "API name of the field. Requires `object_name`. Since v67.0."}
      - {name: object_name, api_name: objectName, type: string, description: "API name of the data object. Since v67.0."}
      - {name: tag_fully_qualified_name, api_name: tagFullyQualifiedName, type: string, description: "Not in the spec schema: from the spec's examples."}
      - {name: targets, schema: TagAssignmentTargetInput_targets, array: 1, description: "Not in the spec schema: from the spec's examples."}

  TagAssignmentTargetInput_targets:
    unknown: warning
    attributes:
      - {name: object_name, api_name: objectName, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: field_name, api_name: fieldName, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}

  TagBulkUpdateItemInputRepresentation:
