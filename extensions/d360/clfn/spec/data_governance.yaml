title: Data Governance
description: |
  This family labels data and controls who can read it. [Governance runs on tags rather than per-user permissions](https://trailhead.salesforce.com/content/learn/modules/data-cloud-governance-quick-look/get-to-know-data-cloud-governance): you label objects and fields, and policies act on the labels.

  - **Tags and assignments:** a tag taxonomy holds tags up to two levels deep. A tag assignment puts a tag on an object or field.
  - **Classifications and taxonomies:** classifications group tags, in their own taxonomies. A classification assignment links a classification to a tag, not to data.
  - **Detection:** detection instructions tell an LLM what a tag means. Generating suggestions starts a job per object, and you approve or reject the results.
  - **Access policies and rules:** a policy holds rules that permit, forbid or mask.
  - **Object access grants:** these give a permission set access to an object in a data space.

  Dependencies set the order: create a taxonomy before its tags, a parent tag before its children, and tags before anything that references them.

  Gotchas:

  - Names are dotted paths, `<Taxonomy>.<Level1>[.<Level2>]`. A taxonomy's `fully_qualified_name` is just its name.
  - List `limit` must be 5 to 200, so smaller values return 400.
  - Bulk calls can return success with failed items. Check `has_errors` and each `results[].statusCode`.
  - Most deletes return 202, and tags can sit in state `Deleting`.

  ```sql
  CALL cdp.tag_taxonomy_create (name => 'Compliance_Tags', label => 'Compliance Tags');
  CALL cdp.tag_create (fully_qualified_name => 'Compliance_Tags.PII', label => 'PII');
  CALL cdp.tag_create (fully_qualified_name => 'Compliance_Tags.PII.Email', label => 'Email Address');
  CALL cdp.tag_assignment_create (tag_fully_qualified_name => 'Compliance_Tags.PII.Email', object_name => 'Individual_DLO__dll', field_name => 'Email');
  CALL cdp.tags_propagate (object_names => ['Individual_DLO__dll']);
  ```

functions:
  - name: access_policy_delete
    method: DELETE
    host: connect
    path: /ssot/data-governance/access-policies/{name}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Governance/paths/~1ssot~1data-governance~1access-policies~1%7Bname%7D/delete
    description: Permanently deletes an access policy and cascades the delete to its rules. Since v67.0.
    example: CALL cdp.access_policy_delete (name => 'RestrictSensitiveFields');
    options:
      - {name: name, in: path, type: string, required: true, description: "Developer name of the access policy."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 202). One row with only the standard columns.

  - name: classification_assignment_delete
    method: DELETE
    host: connect
    path: /ssot/data-governance/classification-assignments/{id}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Governance/paths/~1ssot~1data-governance~1classification-assignments~1%7Bid%7D/delete
    description: Deletes a data governance classification assignment by ID. Since v67.0.
    example: CALL cdp.classification_assignment_delete (id => '9aa000000000050');
    options:
      - {name: id, in: path, type: string, required: true, description: "ID of the classification assignment."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 202). One row with only the standard columns.

  - name: classification_taxonomy_delete
    method: DELETE
    host: connect
    path: /ssot/data-governance/classification-taxonomies/{name}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Governance/paths/~1ssot~1data-governance~1classification-taxonomies~1%7Bname%7D/delete
    description: Deletes a classification taxonomy. Since v67.0.
    example: CALL cdp.classification_taxonomy_delete (name => 'Data_Residency_Classifications');
    options:
      - {name: name, in: path, type: string, required: true, description: "API name or developer name of the classification taxonomy."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 202). One row with only the standard columns.
    notes: |
      **Done when:** `classification_taxonomy_get` returns 404. Inferred from the 202 response and the `Deleting` state, not documented.

      **Notes:** Returns 412 `REFERENTIAL_INTEGRITY_VIOLATION` if the taxonomy has external dependencies or child classifications, so delete those first. System taxonomies can't be deleted. Returns 202. The spec has a `Deleting` state and the errors "Entity is already being deleted" and "Cannot update entity in Deleting state", so deletion looks like it finishes in the background. No source documents a wait.

  - name: classification_delete
    method: DELETE
    host: connect
    path: /ssot/data-governance/classifications/{fullyQualifiedName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Governance/paths/~1ssot~1data-governance~1classifications~1%7BfullyQualifiedName%7D/delete
    description: Deletes a classification and cascades the deletion to any child classifications and assignments. Since v67.0.
    example: CALL cdp.classification_delete (fully_qualified_name => 'Compliance_Classifications.Sensitive');
    options:
      - {name: fully_qualified_name, api_name: fullyQualifiedName, in: path, type: string, required: true, description: "Fully-qualified API name of the classification."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 202). One row with only the standard columns.
    notes: |
      **Done when:** `classification_get` returns 404. Inferred from the 202 response and the `Deleting` state, not documented.

      **Notes:** The description promises a cascade to children and assignments, but the spec also lists a 412 "has external dependencies or children classifications". Sources conflict. System classifications can't be deleted. Returns 202. The spec has a `Deleting` state and the errors "Entity is already being deleted" and "Cannot update entity in Deleting state", so deletion looks like it finishes in the background. No source documents a wait.

  - name: object_access_grant_delete
    method: DELETE
    host: connect
    path: /ssot/data-governance/object-access-grants/{objectApiName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Governance/paths/~1ssot~1data-governance~1object-access-grants~1%7BobjectApiName%7D/delete
    description: Deletes a single object access grant. Since v67.0.
    example: CALL cdp.object_access_grant_delete (object_api_name => 'Account__dlm', dataspace_name => 'default', permission_set_name => 'DC_Analyst_PermSet');
    options:
      - {name: object_api_name, api_name: objectApiName, in: path, type: string, required: true, description: "API name of the Data Cloud object."}
      - {name: dataspace_name, api_name: dataSpaceName, in: query, type: string, description: "Name of the data space. If unspecified, the `default` data space is used. Since v67.0."}
      - {name: permission_set_name, api_name: permissionSetName, in: query, type: string, description: "Developer name of the permission set. Since v67.0."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 204). One row with only the standard columns.
    notes: "**Notes:** A grant is identified by object, data space and permission set, as the 404 message shows. The spec marks `permission_set_name` optional, and doesn't say which grant is meant without it when several permission sets grant the object. Pass all three."

  - name: tag_assignment_delete
    method: DELETE
    host: connect
    path: /ssot/data-governance/tag-assignments/{id}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Governance/paths/~1ssot~1data-governance~1tag-assignments~1%7Bid%7D/delete
    description: Deletes a data governance tag assignment by ID. Since v67.0.
    example: CALL cdp.tag_assignment_delete (id => '9aa000000000001');
    options:
      - {name: id, in: path, type: string, required: true, description: "ID of the tag assignment."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 202). One row with only the standard columns.

  - name: tag_taxonomy_delete
    method: DELETE
    host: connect
    path: /ssot/data-governance/tag-taxonomies/{fullyQualifiedName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Governance/paths/~1ssot~1data-governance~1tag-taxonomies~1%7BfullyQualifiedName%7D/delete
    description: Deletes a tag taxonomy and all child tags. Since v67.0.
    example: CALL cdp.tag_taxonomy_delete (fully_qualified_name => 'Marketing_Tags');
    options:
      - {name: fully_qualified_name, api_name: fullyQualifiedName, in: path, type: string, required: true, description: "Fully qualified API name of the tag taxonomy. A taxonomy has one segment, so this is its developer name, such as `Compliance_Tags`."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 202). One row with only the standard columns.
    notes: |
      **Done when:** `tag_taxonomy_get` returns 404. Inferred from the 202 response and the `Deleting` state, not documented.

      **Notes:** The description promises deleting all child tags, but the spec also lists a 412 "has external dependencies or children tags". Sources conflict. System taxonomies can't be deleted. Returns 202. The spec has a `Deleting` state and the errors "Entity is already being deleted" and "Cannot update entity in Deleting state", so deletion looks like it finishes in the background. No source documents a wait.

  - name: tag_delete
    method: DELETE
    host: connect
    path: /ssot/data-governance/tags/{fullyQualifiedName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Governance/paths/~1ssot~1data-governance~1tags~1%7BfullyQualifiedName%7D/delete
    description: Deletes a tag and cascades the deletion to any child tags and assignments. Since v67.0.
    example: CALL cdp.tag_delete (fully_qualified_name => 'Compliance_Tags.PII.Phone');
    options:
      - {name: fully_qualified_name, api_name: fullyQualifiedName, in: path, type: string, required: true, description: "Fully qualified API name of the tag."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 202). One row with only the standard columns.
    notes: |
      **Done when:** `tag_get` returns 404. Inferred from the 202 response and the `Deleting` state, not documented.

      **Notes:** The description promises a cascade to children and assignments, but the spec also lists a 412 "has external dependencies or children tags". Sources conflict. System tags can't be deleted. No source says what happens to policies that test the tag. Returns 202. The spec has a `Deleting` state and the errors "Entity is already being deleted" and "Cannot update entity in Deleting state", so deletion looks like it finishes in the background. No source documents a wait.

  - name: tag_detection_instruction_deactivate
    method: DELETE
    host: connect
    path: /ssot/data-governance/tags/{fullyQualifiedName}/detection-instructions/active
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Governance/paths/~1ssot~1data-governance~1tags~1%7BfullyQualifiedName%7D~1detection-instructions~1active/delete
    description: Deactivates the currently active detection instruction for a tag. Since v67.0.
    example: CALL cdp.tag_detection_instruction_deactivate (fully_qualified_name => 'Compliance_Tags.PII.CreditCard');
    options:
      - {name: fully_qualified_name, api_name: fullyQualifiedName, in: path, type: string, required: true, description: "Fully-qualified API name of the tag (dotted path)."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 202). One row with only the standard columns.
    notes: "**Notes:** This deactivates the instruction and doesn't delete the tag. Returns 202."

  - name: access_policy_list
    method: GET
    host: connect
    path: /ssot/data-governance/access-policies
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Governance/paths/~1ssot~1data-governance~1access-policies/get
    description: Returns a paginated list of builder-compatible access policies. To include system or legacy policies that aren't builder-compatible, set `include_incompatible` to `true`. Since v67.0.
    example: CALL cdp.access_policy_list (search_string => 'mask', include_incompatible => true);
    options:
      - {name: include_incompatible, api_name: includeIncompatible, in: query, type: boolean, description: "Indicates whether to include policies that aren't builder-compatible (`true`) or not (`false`). If unspecified, the default value is `false`. Since v67.0."}
      - {name: limit, in: query, type: integer, description: "Maximum number of access policies to return. Values are `5` through `200`. If unspecified, the default value is `25`. Since v67.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. If unspecified, no rows are skipped. Since v67.0."}
      - {name: search_string, api_name: searchString, in: query, type: string, description: "Case-insensitive substring to match against the policy name or label. Since v67.0."}
    rows: /records
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: builder_compatible, api_name: builderCompatible, type: BOOLEAN, description: "Indicates whether the policy was authored to be renderable in the access policy builder (`true`) or not (`false`). Since v67.0."}
      - {name: builder_validated, api_name: builderValidated, type: BOOLEAN, description: "Indicates whether the access policy validator has run for the policy (`true`) or not (`false`). Read-only; the server derives this value on save. Since v67.0."}
      - {name: description, type: VARCHAR, description: "Description of the policy. Since v67.0."}
      - {name: rules, type: JSON, array: 1, schema: AccessPolicyRuleRepresentation, description: "Rules contained in the policy. The access policy builder restricts a policy to one rule; multi-rule policies have `builder_compatible` set to `false`. Since v67.0."}
    paging: {kind: url, from: {body: /nextPageUrl}}
    effect: read
    evidence: O
    result_description: "One row per item of `/records` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`. Schema `AccessPolicyRepresentation`."
    notes: |
      **Paging:** `next_page_url`.

      **Notes:** An org without the feature can return 404, although the spec declares only 400. [sf-pi](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/registry/connect-openapi-overrides.json) records this from a live org, and [config-snapshot-data360](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md) saw the same (community, one org).

  - name: access_policy_get
    method: GET
    host: connect
    path: /ssot/data-governance/access-policies/{name}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Governance/paths/~1ssot~1data-governance~1access-policies~1%7Bname%7D/get
    description: Returns a single access policy and its rules by developer name. Since v67.0.
    example: CALL cdp.access_policy_get (name => 'RestrictSensitiveFields');
    options:
      - {name: name, in: path, type: string, required: true, description: "Developer name of the access policy."}
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: builder_compatible, api_name: builderCompatible, type: BOOLEAN, description: "Indicates whether the policy was authored to be renderable in the access policy builder (`true`) or not (`false`). Since v67.0."}
      - {name: builder_validated, api_name: builderValidated, type: BOOLEAN, description: "Indicates whether the access policy validator has run for the policy (`true`) or not (`false`). Read-only; the server derives this value on save. Since v67.0."}
      - {name: description, type: VARCHAR, description: "Description of the policy. Since v67.0."}
      - {name: rules, type: JSON, array: 1, schema: AccessPolicyRuleRepresentation, description: "Rules contained in the policy. The access policy builder restricts a policy to one rule; multi-rule policies have `builder_compatible` set to `false`. Since v67.0."}
    effect: read
    evidence: O
    result_description: One row. Schema `AccessPolicyRepresentation`.
    notes: "**Notes:** The spec lists `MULTIPLE_RULES_NOT_ALLOWED` and `NAME_MISMATCH` as 400s on this read. Those look like errors of `access_policy_rule_replace` filed under the wrong verb."

  - name: access_policy_rule_get
    method: GET
    host: connect
    path: /ssot/data-governance/access-policies/{name}/rules/{ruleName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Governance/paths/~1ssot~1data-governance~1access-policies~1%7Bname%7D~1rules~1%7BruleName%7D/get
    description: Returns the details of a specific rule within an access policy. Since v67.0.
    example: CALL cdp.access_policy_rule_get (name => 'RestrictSensitiveFields', rule_name => 'Mask_SSN');
    options:
      - {name: name, in: path, type: string, required: true, description: "Developer name of the parent access policy."}
      - {name: rule_name, api_name: ruleName, in: path, type: string, required: true, description: "Developer name of the rule."}
    columns:
      - {name: action, type: JSON, description: "Actions the rule applies to, such as `Read`. Since v67.0."}
      - {name: category, type: VARCHAR, description: "MDAPI rule category, which determines the validator that dispatches. Since v67.0."}
      - {name: effect, type: VARCHAR, description: "Effect of the rule. Since v67.0."}
      - {name: id, type: VARCHAR, description: "18-character record ID of the underlying PolicyRuleDefinition. Since v67.0."}
      - {name: label, type: VARCHAR, description: "Display label for the rule. Since v67.0."}
      - {name: name, type: VARCHAR, description: "Developer name of the rule (PolicyRuleDefinition fullName). Since v67.0."}
      - {name: principal_authentication_level, api_name: principalAuthenticationLevel, type: VARCHAR, description: "Required principal authentication level. Since v67.0."}
      - {name: principal_scope_type, api_name: principalScopeType, type: VARCHAR, description: "Principal scope type. Since v67.0."}
      - {name: resource_domains, api_name: resourceDomains, type: JSON, description: "DMOs or objects the rule scopes to. Required for record-scope (RLS) rules; typically empty or absent for OLS or FLS. Since v67.0."}
      - {name: resource_scope_type, api_name: resourceScopeType, type: VARCHAR, description: "Resource scope type. Since v67.0."}
      - {name: resource_transform, api_name: resourceTransform, type: VARCHAR, description: "For Transform or FLS rules, the transform applied to the field before the principal sees it. Since v67.0."}
      - {name: resource_transform_arguments, api_name: resourceTransformArguments, type: JSON, array: 1, schema: ResourceTransformArgumentRepresentation, description: "Static argument list for the resource transform, such as the `2` for `FIRST_N_CHARS_RESOURCE_TRANSFORM`. Since v67.0."}
      - {name: rule_consumer, api_name: ruleConsumer, type: VARCHAR, description: "Consumer of the rule's enforcement. Since v67.0."}
      - {name: transform_precedence, api_name: transformPrecedence, type: BIGINT, description: "Tiebreaker when multiple Transform rules apply to the same field. The lower value wins. Emitted only on Transform-effect rules. Since v67.0."}
      - {name: unless, type: JSON, schema: ConditionGroupRepresentation, description: "Condition group that, when met, exempts the rule from applying. Since v67.0."}
      - {name: when, type: JSON, schema: ConditionGroupRepresentation, description: "Condition group that must be met for the rule to apply. Since v67.0."}
    effect: read
    evidence: O
    result_description: One row. Schema `AccessPolicyRuleRepresentation`.

  - name: auto_tagging_job_list
    method: GET
    host: connect
    path: /ssot/data-governance/auto-tagging-jobs
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Governance/paths/~1ssot~1data-governance~1auto-tagging-jobs/get
    description: Returns a paginated list of data governance auto-tagging jobs, optionally filtered by object or status. Auto-tagging jobs are created by the generate tag suggestions action. Since v67.0.
    example: CALL cdp.auto_tagging_job_list ();
    options:
      - {name: limit, in: query, type: integer, description: "Maximum number of auto-tagging jobs to return. Values are from `5` through `200`. The default value is `25` if unspecified. Since v67.0."}
      - {name: object_name, api_name: objectName, in: query, type: string, description: "API name of the object to filter jobs by. Since v67.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. If unspecified, no rows are skipped. Since v67.0."}
      - {name: status, in: query, type: string, description: "Status to filter jobs by. Values are `InProgress`, `Success`, or `Fail`. Since v67.0."}
    rows: /jobs
    columns:
      - {name: created_date, api_name: createdDate, type: TIMESTAMPTZ, description: "Date the job was created. Since v67.0."}
      - {name: id, type: VARCHAR, description: "ID of the job. Since v67.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: TIMESTAMPTZ, description: "Date the job status was last updated. Since v67.0."}
      - {name: object_name, api_name: objectName, type: VARCHAR, description: "Target object API name. Since v67.0."}
      - {name: status, type: VARCHAR, description: "Status of the job. Since v67.0."}
    paging: {kind: url, from: {body: /nextPageUrl}}
    effect: read
    evidence: O
    result_description: "One row per item of `/jobs` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`, `count`, `limit`, `offset`, `previousPageUrl`. Schema `AutoTaggingJobRepresentation`."
    notes: "**Paging:** `next_page_url`."

  - name: auto_tagging_job_get
    method: GET
    host: connect
    path: /ssot/data-governance/auto-tagging-jobs/{id}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Governance/paths/~1ssot~1data-governance~1auto-tagging-jobs~1%7Bid%7D/get
    description: Returns a single data governance auto-tagging job by ID, reporting its progress and status. Since v67.0.
    example: CALL cdp.auto_tagging_job_get (id => '...');
    options:
      - {name: id, in: path, type: string, required: true, description: "ID of the auto-tagging job. Since v67.0."}
    columns:
      - {name: created_date, api_name: createdDate, type: TIMESTAMPTZ, description: "Date the job was created. Since v67.0."}
      - {name: id, type: VARCHAR, description: "ID of the job. Since v67.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: TIMESTAMPTZ, description: "Date the job status was last updated. Since v67.0."}
      - {name: object_name, api_name: objectName, type: VARCHAR, description: "Target object API name. Since v67.0."}
      - {name: status, type: VARCHAR, description: "Status of the job. Since v67.0."}
    effect: read
    evidence: O
    result_description: One row. Schema `AutoTaggingJobRepresentation`.
    notes: "**Notes:** The `id` is a `job_id` from `tag_suggestions_generate`."

  - name: classification_assignment_list
    method: GET
    host: connect
    path: /ssot/data-governance/classification-assignments
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Governance/paths/~1ssot~1data-governance~1classification-assignments/get
    description: Returns a paginated list of data governance classification assignments, optionally filtered by tag or classification. Since v67.0.
    example: CALL cdp.classification_assignment_list ();
