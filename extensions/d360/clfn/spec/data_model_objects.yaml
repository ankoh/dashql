    effect: read
    evidence: O
    result_description: One row. Schema `DataModelObjectRepresentation`.
    notes: "**Notes:** A 404 can also mean you lack access to the DMO (spec). The spec's examples and [live fixtures](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/test/fixtures/live/dmo-create.json) (community) show fields the schema omits, so they land in `_raw`: `dataSpaceName`, `creationType`, `isEnabled`, `isEditable`, `isSegmentable` and `hasExternalDataLakeObjectMappings`. The [tool text](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/DmoTools.java) also sends `includeActiveFieldsOnly` and `includeStatus`, which the spec doesn't list."

  - name: dmo_relationship_list
    method: GET
    host: connect
    path: /ssot/data-model-objects/{dataModelObjectName}/relationships
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Model-Objects/paths/~1ssot~1data-model-objects~1%7BdataModelObjectName%7D~1relationships/get
    description: Get the details of all data model object (DMO) relationships between fields in the source DMO and fields in the target DMO. Since v64.0.
    example: CALL cdp.dmo_relationship_list (data_model_object_name => 'ssot__Individual__dlm', status => 'Active');
    options:
      - {name: data_model_object_name, api_name: dataModelObjectName, in: path, type: string, required: true, description: "Developer name of the DMO, with the `__dlm` suffix."}
      - {name: creation_type, api_name: creationType, in: query, type: string, enum: [CalculatedInsight, Curated, Custom, SegmentMembership, Standard, System], description: "Filter the returned results based on relationship creation type. Since v64.0."}
      - {name: dataspace, in: query, type: string, description: "Name of the data space. If unspecified, the `default` data space is used. Since v64.0."}
      - {name: limit, in: query, type: integer, description: "Maximum number of relationships to return. If unspecified, the default value is `20`. Since v64.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. Must be an integer greater than zero. If unspecified, no rows are skipped. Since v64.0."}
      - {name: order_by, api_name: orderBy, in: query, type: string, enum: [FilterSortOrderAsc, FilterSortOrderDesc], description: "Sort order for the result set: `ASC` for ascending or `DESC` for descending. If unspecified, results are returned in ascending order. Since v64.0."}
      - {name: sort_by, api_name: sortBy, in: query, type: string, description: "The field on which the results are to be sorted. Since v64.0."}
      - {name: status, in: query, type: string, enum: [Active, Creating, DeactivateByUser, Deleting, Error, Inactive, Updating], description: "Filter the returned results based on relationship status. Since v64.0."}
    rows: /relationships
