title: Data Model Objects
description: |
  A data lake object (DLO, `__dll`) holds ingested rows as they arrived. A data model object (DMO, `__dlm`) is the shared schema that identity resolution, insights and segments read. This family defines DMOs, maps DLO fields onto them, and declares relationships between DMOs.

  The order is: a stream creates the DLO, you pick or create a DMO, you map one onto the other, then you add relationships. Read the exact field names with `dlo_get` and `dmo_get` first. The [DMO guide](https://developer.salesforce.com/docs/data/connectapi/guide/dmo-use-case.md) walks through the mapping calls.

  The traps:

  - Pass a custom DMO name without `__dlm` on create. Every later call uses the full name. Sources disagree, see [`dmo_create`](#dmo_create).
  - Each `dmo_mapping_create` covers one DLO and one DMO, and must include the DLO's primary key.
  - For Engagement data, the event date field must be mapped to a field of exactly the same type.
  - Mapping create returns `CREATING`, so poll `dmo_mapping_get`.
  - Relationships need mappings on both DMOs (community).
  - Empty results vary: a DMO with no relationships returns 204, and one with no mappings returns 404 (community).

  ```sql
  CALL cdp.dmo_get (data_model_object_name => 'ssot__Individual__dlm');
  CALL cdp.dmo_mapping_create (
    dataspace => 'default',
    label => 'S3_Subscribers_Individual',
    source_entity_developer_name => 'S3_Subscribers__dll',
    target_entity_developer_name => 'ssot__Individual__dlm',
    field_mapping => [
      (source_field_developer_name = 'Subscriber_ID__c', target_field_developer_name = 'ssot__SourceSystemId__c'),
      (source_field_developer_name = 'LastName__c', target_field_developer_name = 'ssot__LastName__c')
    ]
  );
  /* Repeat until status is ACTIVE */
  CALL cdp.dmo_mapping_get (object_source_target_map_developer_name => 'S3_Subscribers_Individual');
  ```

functions:
  - name: dmo_mapping_delete
    method: DELETE
    host: connect
    path: /ssot/data-model-object-mappings/{objectSourceTargetMapDeveloperName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Model-Objects/paths/~1ssot~1data-model-object-mappings~1%7BobjectSourceTargetMapDeveloperName%7D/delete
    tools: [d360_dmo_mapping_delete]
    description: Delete a mapping between a data lake object (DLO) source and a data model object (DMO) target. Since v61.0.
    example: CALL cdp.dmo_mapping_delete (object_source_target_map_developer_name => 'S3_Subscribers_Individual');
    options:
      - {name: object_source_target_map_developer_name, api_name: objectSourceTargetMapDeveloperName, in: path, type: string, required: true, description: "Developer name of the object mapping. Retrieve it from `dmo_mapping_list`, or from the `developer_name` that `dmo_mapping_create` returns."}
      - {name: dataspace, in: query, type: string, description: "Name of the data space. If unspecified, the `default` data space is used."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 200). One row with only the standard columns.
    notes: "**Notes:** The [tool source](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/MappingTools.java) says the stream and the DMO stay, but data stops flowing into the DMO from that source. Sources disagree on whether this call works: the spec and the MCP server offer it, and a [community plugin](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/test/fixtures/live/mapping-delete.json) ran a mapping delete live (community, one org), while [afd360](https://github.com/javrrr/afd360/blob/main/src/resources/mapping.ts) says a mapping can't be deleted directly and relies on deleting the DMO (community, one org)."

  - name: dmo_field_mappings_delete
    method: DELETE
    host: connect
    path: /ssot/data-model-object-mappings/{objectSourceTargetMapDeveloperName}/field-mappings
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Model-Objects/paths/~1ssot~1data-model-object-mappings~1%7BobjectSourceTargetMapDeveloperName%7D~1field-mappings/delete
    description: Delete a field mapping between a data lake object (DLO) source and a data model object (DMO) target. Since v61.0.
    example: CALL cdp.dmo_field_mappings_delete (object_source_target_map_developer_name => 'S3_Subscribers_Individual');
    options:
      - {name: object_source_target_map_developer_name, api_name: objectSourceTargetMapDeveloperName, in: path, type: string, required: true, description: "Developer name of the object source target mapping between a DLO and a DMO. Retrieve this value from the [get data model object mappings](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getDataModelObjectMappingCollection) endpoint. Since v61.0."}
      - {name: dataspace, in: query, type: string, description: "Name of the data space. If unspecified, the `default` data space is used. Since v61.0."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 200). One row with only the standard columns.
    notes: "**Notes:** The spec's path names no field mapping and defines no body, so nothing says which field this removes, or whether it removes all of them. The [DMO guide](https://developer.salesforce.com/docs/data/connectapi/guide/dmo-use-case.md) doesn't show the request. Prefer [`dmo_field_mapping_delete`](#dmo_field_mapping_delete), whose path names the field."

  - name: dmo_delete
    method: DELETE
    host: connect
    path: /ssot/data-model-objects/{dataModelObjectName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Model-Objects/paths/~1ssot~1data-model-objects~1%7BdataModelObjectName%7D/delete
    tools: [d360_dmo_delete]
    description: Delete a standard or custom data model object (DMO). Since v61.0.
    example: CALL cdp.dmo_delete (data_model_object_name => 'CustomDMO__dlm');
    options:
      - {name: data_model_object_name, api_name: dataModelObjectName, in: path, type: string, required: true, description: "Developer name of the DMO, with the `__dlm` suffix."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 204). One row with only the standard columns.
    notes: "**Notes:** The [catalog](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/runtime/FamilyCatalog.java) says this \"Cascades to dependent objects\". The [tool source](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/DmoTools.java) says to make sure no streams, mappings, insights or segments reference the DMO first. [afd360](https://github.com/javrrr/afd360/blob/main/src/resources/dmo.ts) reports both behaviors (community, one org): mappings cascade, while other references return 412 \"referenced in other features\". It retries for about a minute, because a reference can linger after its dependent is deleted. It also reports that deleting a DMO that is already gone returns 500 `INTERNAL_ERROR`, not the spec's 404."

  - name: dmo_relationship_delete
    method: DELETE
    host: connect
    path: /ssot/data-model-objects/relationships/{name}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Model-Objects/paths/~1ssot~1data-model-objects~1relationships~1%7Bname%7D/delete
    description: Delete a data model object (DMO) relationship between a field in the source DMO and a field in the target DMO. Since v64.0.
    example: CALL cdp.dmo_relationship_delete (name => 'ds1_Individual_Id_map_ds1_DataSpace1Dmo_Id_1726382174104');
    options:
      - {name: name, in: path, type: string, required: true, description: "ID or developer name of the field source target relationship. Since v64.0."}
      - {name: dataspace, in: query, type: string, description: "Name of the data space. If unspecified, the `default` data space is used. Since v64.0."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 200). One row with only the standard columns.

  - name: dmo_mapping_list
    method: GET
    host: connect
    path: /ssot/data-model-object-mappings
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Model-Objects/paths/~1ssot~1data-model-object-mappings/get
    tools: [d360_dmo_mapping_list]
    description: Get the details of all mappings associated with a data model object (DMO). Since v61.0.
    example: CALL cdp.dmo_mapping_list (dmo_developer_name => 'ssot__Individual__dlm');
    options:
      - {name: dataspace, in: query, type: string, description: "Name of the data space. If unspecified, the `default` data space is used. Since v61.0."}
      - {name: dlo_developer_name, api_name: dloDeveloperName, in: query, type: string, description: "Developer name of the data lake object (DLO) source object. Since v61.0."}
      - {name: dmo_developer_name, api_name: dmoDeveloperName, in: query, type: string, required: true, description: "Developer name of the DMO target object. Since v61.0."}
    rows: /objectSourceTargetMaps
    columns:
      - {name: developer_name, api_name: developerName, type: VARCHAR, description: "Developer name of the object source target map. Since v61.0."}
      - {name: field_mappings, api_name: fieldMappings, type: JSON, array: 1, schema: CdpFieldSourceTargetMapRepresentation, description: "List of field mappings from the object source target map. Since v61.0."}
      - {name: source_entity_developer_name, api_name: sourceEntityDeveloperName, type: VARCHAR, description: "Source DLO entity developer name of the object source target map. Since v61.0."}
      - {name: status, type: VARCHAR, description: "Status of the object source target map. Since v61.0."}
      - {name: target_entity_developer_name, api_name: targetEntityDeveloperName, type: VARCHAR, description: "Target DMO entity developer name of the object source target map. Since v61.0."}
    paging: {kind: url, from: {body: /nextPageUrl}}
    errors: {empty_on: [404]}
    effect: read
    evidence: O
    result_description: "One row per item of `/objectSourceTargetMaps` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`. Schema `CdpObjectSourceTargetMapRepresentation`."
    notes: |
      **Paging:** `next_page_url`.

      **Notes:** A 404 here can mean "no mappings", not a failure. The spec lists `Object source target map not found for the given target object developer name` under 404, and two community sources treat it as an empty list ([API quirks](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md), one org, and [data-360-sdk](https://github.com/javrrr/data-360-sdk/blob/main/src/resources/data-model-objects.ts), which matches the message prefix `Object Source Target Map not found`). A 404 saying the DLO wasn't found is a real error, so check the message. Identity resolution DMOs (`Unified*`, `*IdentityLink__dlm`) have no mappings (community).

      There's no call for all mappings, so loop over DMOs (community). The spec requires `dmo_developer_name`, yet its 400 text reads "DMO or source object (CRM) developer name is missing", and the [tool text](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/MappingTools.java) also sends `source_object_name` (for example `Account`) as an alternative. The spec doesn't list that parameter.

  - name: dmo_mapping_get
    method: GET
    host: connect
    path: /ssot/data-model-object-mappings/{objectSourceTargetMapDeveloperName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Model-Objects/paths/~1ssot~1data-model-object-mappings~1%7BobjectSourceTargetMapDeveloperName%7D/get
    tools: [d360_dmo_mapping_get]
    description: Get one DLO-to-DMO mapping by developer name, with its field mappings and status. Use it to check that a new or changed mapping became active.
    example: CALL cdp.dmo_mapping_get (object_source_target_map_developer_name => 'S3_Subscribers_Individual');
    options:
      - {name: object_source_target_map_developer_name, api_name: objectSourceTargetMapDeveloperName, in: path, type: string, required: true, description: "Developer name of the object mapping. Retrieve it from `dmo_mapping_list`, or from the `developer_name` that `dmo_mapping_create` returns."}
      - {name: dataspace, in: query, type: string, description: "Name of the data space. If unspecified, the `default` data space is used."}
    columns:
      - {name: developer_name, api_name: developerName, type: VARCHAR, description: "Developer name of the object source target map. Since v61.0."}
      - {name: field_mappings, api_name: fieldMappings, type: JSON, array: 1, schema: CdpFieldSourceTargetMapRepresentation, description: "List of field mappings from the object source target map. Since v61.0."}
      - {name: source_entity_developer_name, api_name: sourceEntityDeveloperName, type: VARCHAR, description: "Source DLO entity developer name of the object source target map. Since v61.0."}
      - {name: status, type: VARCHAR, description: "Status of the object source target map. Since v61.0."}
      - {name: target_entity_developer_name, api_name: targetEntityDeveloperName, type: VARCHAR, description: "Target DMO entity developer name of the object source target map. Since v61.0."}
    effect: read
    evidence: O
    result_description: One row. Schema `CdpObjectSourceTargetMapRepresentation`.
    notes: "**Notes:** The spec's `status` enum is Title Case (`Active`, `Creating`), while the [DMO guide](https://developer.salesforce.com/docs/data/connectapi/guide/dmo-use-case.md) and spec examples show `ACTIVE` and `CREATING`. [sf-pi overrides](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/registry/connect-openapi-overrides.json) also record live spellings outside the enum. Compare without regard to case. `field_mappings` also holds system fields the server added."

  - name: dmo_list
    method: GET
    host: connect
    path: /ssot/data-model-objects
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Model-Objects/paths/~1ssot~1data-model-objects/get
    tools: [d360_dmo_list]
    description: Get a paginated list of all data model objects (DMOs). Since v61.0.
    example: CALL cdp.dmo_list ();
    options:
      - {name: limit, in: query, type: integer, description: "Maximum number of DMOs to return. If unspecified, the default value is `50`. Since v61.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. Must be an integer greater than zero. If unspecified, no rows are skipped. Since v61.0."}
      - {name: order_by, api_name: orderBy, in: query, type: string, description: "Sort order for the result set: `ASC` for ascending or `DESC` for descending. If unspecified, results are returned in ascending order. Since v61.0."}
    rows: /dataModelObject
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: category, type: VARCHAR, description: "Category. Since v60.0."}
      - {name: event_date_time_field_name, api_name: eventDateTimeFieldName, type: VARCHAR, description: "Name of the event date and time field. This property is required when the value of the category property is `Engagement`. Since v60.0."}
      - {name: fields, type: JSON, array: 1, schema: DataObjectFieldRepresentation, description: "List of fields. Since v60.0."}
      - {name: record_modified_field_name, api_name: recordModifiedFieldName, type: VARCHAR, description: "Record modified field. Since v60.0."}
      - {name: type, type: VARCHAR, description: "Type of data object. Since v60.0."}
      - {name: status, type: VARCHAR, description: "Status of the DMO. Since v60.0."}
      - {name: creation_type, api_name: creationType, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
      - {name: dataspace_name, api_name: dataSpaceName, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
      - {name: has_external_data_lake_object_mappings, api_name: hasExternalDataLakeObjectMappings, type: BOOLEAN, description: "Not in the spec schema: from the spec's examples."}
      - {name: is_editable, api_name: isEditable, type: BOOLEAN, description: "Not in the spec schema: from the spec's examples."}
      - {name: is_enabled, api_name: isEnabled, type: BOOLEAN, description: "Not in the spec schema: from the spec's examples."}
      - {name: is_segmentable, api_name: isSegmentable, type: BOOLEAN, description: "Not in the spec schema: from the spec's examples."}
    paging: {kind: url, from: {body: /nextPageUrl}}
    effect: read
    evidence: O
    result_description: "One row per item of `/dataModelObject` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`. Schema `DataModelObjectRepresentation`."
    notes: |
      **Paging:** `next_page_url`.

      **Notes:** This returns the whole catalog, including DMOs the org doesn't use: over 1,000, at 20 to 40 s per page of 200 ([API quirks](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md), community, one org). For the ones in use, [`metadata`](profiles_and_metadata.md#metadata) with `entity_type = 'DataModelObject'` is one fast call, but it lists each active relationship twice (same source). The spec's 400 text caps `offset` at 2000.

      The [tool text](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/DmoTools.java) sends filters the spec omits: `dataObjectCategory`, `dataspace_name`, `creation_type`, `dataModelObjectStatus`, `includeFields`, `includeStatus`, `is_enabled`, `mktDataConnectionId`, `search`. It also limits `limit` to 1 to 50, which the 200-per-page report above contradicts.

      `category` comes back in upper case (`PROFILE`, `UNASSIGNED`), and [sf-pi overrides](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/registry/connect-openapi-overrides.json) record live values outside the spec's enum. The MCP server names `DirectoryTable` for unstructured file DMOs, and the community names `Segment_Membership`, `Activation_Audience` and `Vector_Embedding`. The tool text says `is_enabled = false` doesn't mean disabled: the DMO can still be mapped.

