      - {name: is_enabled, api_name: isEnabled, type: BOOLEAN, description: "Not in the spec schema: from the spec's examples."}
      - {name: is_segmentable, api_name: isSegmentable, type: BOOLEAN, description: "Not in the spec schema: from the spec's examples."}
    effect: write
    evidence: O
    result_description: One row. Schema `DataModelObjectRepresentation`.
    notes: |
      **Done when:** `dmo_get` returns a populated `dataSpaceName`, found in `_raw`. It may return incomplete fields before that ([afd360](https://github.com/javrrr/afd360/blob/main/src/resources/dmo.ts), community). Waits of 60 to 90 s are reported (community).

      **Notes:** **The `__dlm` conflict.** Sources disagree on whether `name` takes the suffix.

      | Source | Says |
      |---|---|
      | The spec's example | Sends `CustomDMO`, returns `CustomDMO__dlm` |
      | MCP [tool text](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/DmoTools.java) and [request class](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/model/request/dmo/DmoCreateRequest.java) | Don't include it, "the API appends it" |
      | [afd360](https://github.com/javrrr/afd360/blob/main/skills/afd360/SKILL.md) (community) | "The platform appends these" |
      | MCP [catalog](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/runtime/FamilyCatalog.java) | "API name must end with `__dlm`" |
      | MCP [payload examples](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/resources/metadata/payload-examples.json) | Send `CustomMetric__dlm`, and also `objectType` and `objectCategory`, which the spec lacks |

      Pass the bare name. The spec's 400 text forbids two consecutive underscores, which a suffixed name would break, though that's my inference. This hasn't been tested. Field names behave the same way: the spec's `CustomDMO123` returns as `CustomDMO123__c`, with `KQ_CustomDMO123__c` added.

      **Rules:** at least one field needs `is_primary_key = true` for the create to succeed, and Engagement DMOs need `event_date_time_field_name` ([tool text](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/DmoTools.java)). No source documents whether that value takes `__c`. A name that "has been previously used" is also rejected (spec 400 text), so a deleted DMO's name may not be reusable.

      **`category`:** the enum is `Profile`, while the spec's example sends `PROFILE`. [afd360](https://github.com/javrrr/afd360/blob/main/src/resources/dmo.ts) sends title case and reads back upper case (community, one org). The tool text also accepts `Segment_Membership`, while the [request class](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/model/request/dmo/DmoCreateRequest.java) lists only the three spec values.

      **`is_dynamic_lookup`** appears in the spec's example but not its schema, and the field-level `data_type` conflict is under [the schema](#dataobjectfieldinputrepresentation).

  - name: dmo_relationship_create
    method: POST
    host: connect
    path: /ssot/data-model-objects/{dataModelObjectName}/relationships
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Model-Objects/paths/~1ssot~1data-model-objects~1%7BdataModelObjectName%7D~1relationships/post
    description: Create bulk data model object (DMO) relationships between fields in the source DMO and fields in the target DMO. If a relationship already exists, it is skipped. Since v64.0.
    example: CALL cdp.dmo_relationship_create (data_model_object_name => 'SalesOrder__dlm', dataspace => 'default', relationships => [(source_object_name = 'SalesOrder__dlm', target_object_name = 'ssot__Individual__dlm', source_field_name = 'CustomerId__c', target_field_name = 'ssot__Id__c', cardinality = 'ManyToOne', relationship_owner = 'DataCloud')]);
    options:
      - {name: data_model_object_name, api_name: dataModelObjectName, in: path, type: string, required: true, description: "Developer name of the source DMO, with the `__dlm` suffix. The spec doesn't say which end goes here, but afd360 passes the source (community)."}
      - {name: dataspace, in: query, type: string, description: "Name of the data space. If unspecified, the `default` data space is used. Since v64.0."}
      - {name: relationships, in: body, schema: FieldSrcTrgtRelationshipInputRepresentation, array: 1, required: true, description: "List of relationships to be created. Since v64.0."}
    rows: /relationships
    columns:
      - {name: cardinality, type: VARCHAR, description: "Cardinality between the fields involved in the relationship. Since v64.0."}
      - {name: creation_type, api_name: creationType, type: VARCHAR, description: "Creation type of the relationship. Since v64.0."}
      - {name: id, type: VARCHAR, description: "ID of the relationship. Since v64.0."}
      - {name: name, type: VARCHAR, description: "Developer name of the relationship. Since v64.0."}
      - {name: owner, type: VARCHAR, description: "Owner of the relationship. Since v64.0."}
      - {name: source_field, api_name: sourceField, type: JSON, schema: RelationshipFieldRepresentation, description: "Details about the source field involved in the relationship. Since v64.0."}
      - {name: source_object, api_name: sourceObject, type: JSON, schema: RelationshipObjectRepresentation, description: "Details about the source object involved in the relationship. Since v64.0."}
      - {name: status, type: VARCHAR, description: "Status of the relationship. Since v64.0."}
      - {name: target_field, api_name: targetField, type: JSON, schema: RelationshipFieldRepresentation, description: "Details about the target field involved in the relationship. Since v64.0."}
      - {name: target_object, api_name: targetObject, type: JSON, schema: RelationshipObjectRepresentation, description: "Details about the target object involved in the relationship. Since v64.0."}
      - {name: source_entity, api_name: sourceEntity, type: JSON, description: "Not in the spec schema: from the spec's examples."}
      - {name: target_entity, api_name: targetEntity, type: JSON, description: "Not in the spec schema: from the spec's examples."}
    paging: {kind: url, from: {body: /nextPageUrl}}
    effect: write
    evidence: O
    result_description: "One row per item of `/relationships` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`. Schema `FieldSrcTrgtRelationshipRepresentation`."
    notes: |
      **Paging:** `next_page_url`.

      **Done when:** `dmo_relationship_list.status` is `ACTIVE`, found by `name`. Live responses start at `CREATING` (community). The spec's enum also has `Error`.

      **Notes:** **Both DMOs need mappings first.** Otherwise this returns 400 `INVALID_INPUT` with `No ObjectSourceTargetMaps were found` ([afd360](https://github.com/javrrr/afd360/blob/main/src/resources/relationship.ts), community, one org). The same source says this works for any mapped pair, not only custom DMOs.

      **The spec's example is wrong on two names.** It sends `owner` and `creation_type`, but the schema has `relationship_owner` and no creation type. The same source reports the API rejects both as unrecognized (community, one org). A [community template](https://github.com/Jaganpro/sf-skills/blob/main/skills/sf-datacloud/assets/definitions/relationship.template.json) also uses `relationship_owner`.

      The spec says existing relationships are skipped, but not whether they appear in the response. [afd360](https://github.com/javrrr/afd360/blob/main/src/resources/relationship.ts) falls back to `dmo_relationship_list` when the response has none (community). Segment joins need a declared relationship ([notes](api_notes.md)).

  - name: dmo_field_mapping_add
    method: PATCH
    host: connect
    path: /ssot/data-model-object-mappings/{mappingName}/field-mappings
    tools: [d360_dmo_field_mapping_add]
    description: Add field mappings to an existing DLO-to-DMO mapping without recreating it. Use it when the source gains a field or a mapping missed one.
    example: CALL cdp.dmo_field_mapping_add (mapping_name => 'S3_Subscribers_Individual', source_entity_developer_name => 'S3_Subscribers__dll', target_entity_developer_name => 'ssot__Individual__dlm', field_mapping => [(source_field_developer_name = 'DateOfBirth__c', target_field_developer_name = 'ssot__BirthDate__c')]);
    options:
      - {name: mapping_name, api_name: mappingName, in: path, type: string, required: true, description: "Developer name of the object mapping, for example `Contact_00D000000000000_map_ContactPointAddress_1714460254874`."}
      - {name: dataspace, in: query, type: string, description: "Name of the data space. If unspecified, the `default` data space is used."}
      - {name: field_mapping, api_name: fieldMapping, in: body, schema: CdpFieldSourceTargetMapInputRepresentation, array: 1, required: true, description: "Field mappings to add. See the notes for the `field_mappings` conflict."}
      - {name: source_entity_developer_name, api_name: sourceEntityDeveloperName, in: body, type: string, required: true, description: "Source DLO developer name. The guide sends it, and the spec's 400 text for the sibling PATCH treats it as required."}
      - {name: target_entity_developer_name, api_name: targetEntityDeveloperName, in: body, type: string, description: "Target DMO developer name. The guide sends it."}
      - {name: description, in: body, type: string, description: "Description of the mapping. The guide sends it."}
      - {name: label, in: body, type: string, description: "Label of the mapping. The guide sends it."}
      - {name: name, in: body, type: string, description: "Name of the mapping. The guide sends it."}
    columns:
      - {name: developer_name, api_name: developerName, type: VARCHAR, description: "Developer name of the object mapping."}
      - {name: field_mappings, api_name: fieldMappings, type: JSON, description: "Field mappings, each with `developer_name`, `source_field_developer_name` and `target_field_developer_name`."}
      - {name: source_entity_developer_name, api_name: sourceEntityDeveloperName, type: VARCHAR, description: "Source DLO developer name."}
      - {name: status, type: VARCHAR, description: "Mapping status. The guide shows `UPDATING` here."}
      - {name: target_entity_developer_name, api_name: targetEntityDeveloperName, type: VARCHAR, description: "Target DMO developer name."}
    effect: write
    unknown: warning
    evidence: S
    result_description: One row.
    notes: |
      **Done when:** `dmo_mapping_get.status` returns to `ACTIVE`. The guide shows `UPDATING` in the response.

      **Notes:** This path isn't in the spec, and it's the `dmo_field_mapping_update` path without the last segment. The options follow Step 4 of the [DMO guide](https://developer.salesforce.com/docs/data/connectapi/guide/dmo-use-case.md), the only source showing a full request. The MCP [request class](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/model/request/mapping/FieldMappingAddRequest.java) differs: it sends only `field_mappings`, plural, with no entity names. Check which one the server accepts.

