    notes: "**Notes:** This path isn't in the spec, which has only [`dmo_field_mappings_delete`](#dmo_field_mappings_delete) with no field name. The MCP server and a [community plugin](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/src/mapping/client.ts) use this one, and the plugin's [fixture](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/test/fixtures/live/mapping-delete.json) records a live success (community, one org). Field mapping names follow `<source>_fieldmap_<target>`, as `dmo_mapping_get` shows."

schemas:
  CdpFieldSourceTargetMapInputRepresentation:
    description: Represents the input for creating a field source target map.
    attributes:
      - {name: dataspace_name, api_name: dataSpaceName, type: string, description: "Name of the data space. If unspecified, the `default` data space is used. This property is required for data graph resources. Since v59.0."}
      - {name: description, type: string, description: "Description of the object to create. Since v59.0."}
      - {name: label, type: string, description: "Label of the object to create. This property is required for data graph resources. Since v59.0."}
      - {name: name, type: string, description: "API name of the object to create. This property is required for data graph resources. Since v59.0."}
      - {name: source_field_developer_name, api_name: sourceFieldDeveloperName, type: string, description: "Source DLO field developer name, with `__c` (`customer_id__c`). Since v61.0."}
      - {name: target_field_developer_name, api_name: targetFieldDeveloperName, type: string, description: "Target DMO field developer name, for example `ssot__FirstName__c`. Since v61.0."}

  FieldSrcTrgtRelationshipInputRepresentation:
    description: Represents the input to create a field source target relationship between data model objects (DMOs).
    attributes:
      - {name: cardinality, type: string, enum: [ManyToOne, OneToOne], required: true, description: "Cardinality between the fields involved in the relationship. Since v64.0."}
      - {name: dataspace_name, api_name: dataSpaceName, type: string, description: "Name of the data space for the relationship creation. Since v64.0."}
      - {name: relationship_owner, api_name: relationshipOwner, type: string, enum: [DataCloud, Sobject], description: "Owner of the relationship. The spec's example sends `owner`, which a community source reports the API rejects (one org). Since v64.0."}
      - {name: source_field_name, api_name: sourceFieldName, type: string, required: true, description: "Developer name of the source field in the relationship. Since v64.0."}
      - {name: source_object_name, api_name: sourceObjectName, type: string, description: "Developer name of the source object in the relationship. Optional in the spec, though its example and community clients send it. Since v64.0."}
      - {name: target_field_name, api_name: targetFieldName, type: string, required: true, description: "Developer name of the target field in the relationship. Since v64.0."}
      - {name: target_object_name, api_name: targetObjectName, type: string, description: "Developer name of target object in the relationship. Optional in the spec, though its example and community clients send it. Since v64.0."}
      - {name: creation_type, api_name: creationType, type: string, description: "Not in the spec schema: from the spec's examples."}
      - {name: owner, type: string, description: "Not in the spec schema: from the spec's examples."}
