    effect: write
    evidence: O
    result_description: One row. Schema `CdpDataGraphOutputRepresentation`.
    notes: |
      **Done when:** `data_graph_get.status` = `ready`, compared without case. The create response said `creating` with an empty `values_dmo_name` in a [community fixture](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/test/fixtures/live/data-graph-create.json). No source documents the full set of values or a typical wait.

      **Notes:** **It creates more than the definition.** In [one org](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md), a graph with 12 nodes added 18 system DMOs (community). They appear in [`metadata`](profiles_and_metadata.md#metadata) under `Profile` or `Related`, so a category filter doesn't catch them:

      | Kind | Name pattern | How many | Where the API names it |
      |---|---|---|---|
      | FRAGMENT | `Dg_xxxx_<15 chars>_FRAGMENT__dlm` | 1 per node | `memberDmoName` (metadata), `fragmentDMOName` (get) |
      | STATE | `Dg_xxxx_<15 chars>_STATE__dlm` | Some nodes | Nowhere |
      | ID | `<name>_<13 digits>_ID__dlm` | 1 | `id_dmo_name` |
      | VALUE | `<name>_<13 digits>_VALUE__dlm` | 1 | `values_dmo_name` |
      | State table | `DataGraphStateTable__dlm` | 1 per org | Nowhere |

      These patterns come from one graph, and that source warns other graph kinds may differ.

      **It also points to a transform.** A [community fixture](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/test/fixtures/live/data-graph-get.json) of [`data_graph_get`](#data_graph_get) returns `dayZeroTransformDevName` and `dayZeroMappingDevName`, both `Dg_<graph>_<13 digits>`. The field names suggest a transform and a mapping made for the graph. They aren't in the spec, and no source says whether [`transform_list`](data_transforms.md#transform_list) shows that transform.

      **The spec's example and schema disagree.** Its example sends `creation_mode`, `full_refresh_config`, `incremental_refresh_config`, `dataspace_name` and, on nodes and fields, `dev_name`. None of these are in the schema, so they aren't options here.

      - `creation_mode => 'draft'` is what [`data_graph_activate`](#data_graph_activate) needs. A [community request](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/scripts/live-scenarios/p5.mjs) without it reached `ready` with no activate call (one org).
      - That request also had no refresh settings, and its response showed a daily full refresh with incremental off.
      - The schema says `dataspace_name`. The spec's example, that request and the response all say `dataspace_name`.
      - The schema requires `ci_field_type` and `key_qualifier_name` on every field. The spec's example omits both, and the request omits `ci_field_type`.
      - The schema's `source_object.type` values are uppercase. The spec's example sends `standard`, and the request sends `custom`.

      **Real-time graphs:** the spec's only `type` value is `NONE`. The [docs](https://developer.salesforce.com/docs/data/agentic-memory-context/guide/agentic-memory-create-rtdg-for-getcontext.md) describe creating real-time graphs in the UI, and no source shows it through this call.

  - name: data_graph_activate
    method: POST
    host: connect
    path: /ssot/data-graphs/{dataGraphName}/actions/activate
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Graphs/paths/~1ssot~1data-graphs~1%7BdataGraphName%7D~1actions~1activate/post
    description: Activate a data graph draft. Activation saves the draft configuration and builds the data graph, which starts a materialization job to process the data according to the graph definition. In the Data 360 UI, this action corresponds to **Save and Build**. Since v67.0.
    example: CALL cdp.data_graph_activate (data_graph_name => 'Customer_Graph', full_refresh_config => (schedule = (frequency = 1, time_granularity = 'Day')));
    options:
      - {name: data_graph_name, api_name: dataGraphName, in: path, type: string, required: true, description: "Name of the data graph. Since v67.0."}
      - {name: full_refresh_config, api_name: fullRefreshConfig, in: body, schema: DataGraphFullRefreshConfigInputRepresentation, description: "Configuration of the full refresh schedule for standard data graphs. Since v67.0."}
    columns:
      - {name: errors, type: JSON, array: 1, schema: CdpErrorRepresentation, description: "List of errors that resulted from the action. Since v57.0."}
      - {name: success, type: BOOLEAN, description: "Indicates whether the action was initiated successfully (`true`) or not (`false`). Since v57.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `CdpDataGraphActionResponseRepresentation`.
    notes: |
      **Done when:** `data_graph_get.status` = `ready`, compared without case. `success = true` means only that the action started. No source documents the intermediate values.

      **Notes:** This is for drafts, which the schema of [`data_graph_create`](#data_graph_create) can't request. The community tool with live graph fixtures has no activate command, so this call has no live evidence here.

      The spec's example also puts `data_graph_name` in the body. The schema doesn't have it there, and the path already carries it.

  - name: data_graph_refresh
    method: POST
    host: connect
    path: /ssot/data-graphs/{dataGraphName}/actions/refresh
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Graphs/paths/~1ssot~1data-graphs~1%7BdataGraphName%7D~1actions~1refresh/post
    description: Start a rebuild of a data graph's materialized data, outside its schedule. Since v64.0.
    example: CALL cdp.data_graph_refresh (data_graph_name => 'Customer_Graph');
    options:
      - {name: data_graph_name, api_name: dataGraphName, in: path, type: string, required: true, description: "Name of the data graph. Since v64.0."}
    columns:
      - {name: errors, type: JSON, array: 1, schema: CdpErrorRepresentation, description: "List of errors that resulted from the action. Since v57.0."}
      - {name: success, type: BOOLEAN, description: "Indicates whether the action was initiated successfully (`true`) or not (`false`). Since v57.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `CdpDataGraphActionResponseRepresentation`.
    notes: |
      **Done when:** No documented signal. Poll `data_graph_get.status`, where a community fixture shows `ready`, and `last_run_status`, which is in the spec with no documented values.

      **Notes:** **Check `success`.** In a [community fixture](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/test/fixtures/live/data-graph-refresh.json), the call returned `success: false` with the error code `DG_REFRESH_NOT_ALLOWED`, while the tool exited normally and [counted it as a success](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/docs/API_COVERAGE.md). That tool's refresh test uses a [disposable graph over an empty DMO](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/LIVE_TESTING.md). The message is redacted, so the reason is unknown.

      **Retries:** that tool [marks the call billable](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/src/resources/dataGraph.ts) under Data Services and treats a timeout as an unknown outcome, so it checks `data_graph_get` before retrying (community).

      No source says whether this is a full or incremental refresh.

schemas:
  CdpDataGraphDataRecencyInputRepresentation:
    description: Data graph recency criteria input representation.
    attributes:
      - {name: field_name, api_name: fieldName, type: string, required: true, description: "API name of the field to which recency criteria is applied. Since v59.0."}
      - {name: value, type: integer, required: true, description: "Value of the criteria. Since v59.0."}
      - {name: value_type, api_name: valueType, type: string, required: true, description: "Type of value. Valid values are `time` and `record`. Since v59.0."}
      - {name: value_unit, api_name: valueUnit, type: string, required: true, description: "For time, valid value is `DAY`. For record, valid value is `RECORD`. Since v59.0."}

  CdpDataGraphFieldInputRepresentation:
    description: Data graph field input representation.
    attributes:
      - {name: ci_field_type, api_name: ciFieldType, type: string, description: "The spec marks this required, but the example here leaves it out. Calculated insight field type. Since v59.0."}
      - {name: data_type, api_name: dataType, type: string, required: true, description: "Data type of the field. Since v59.0."}
      - {name: is_key_column, api_name: isKeyColumn, type: boolean, required: true, description: "Indicates whether the field is a primary key (`true`) or not (`false`). Since v59.0."}
      - {name: is_projected, api_name: isProjected, type: boolean, required: true, description: "Indicates whether this field needs to be projected in output value JSON (`true`) or not (`false`). Since v59.0."}
      - {name: key_qualifier_name, api_name: keyQualifierName, type: string, description: "The spec marks this required, but the example here leaves it out. Key qualifier name. Since v59.0."}
      - {name: source_field_name, api_name: sourceFieldName, type: string, required: true, description: "API name of the field of the object. Since v59.0."}
      - {name: usage_tag, api_name: usageTag, type: string, required: true, description: "Tag that indicates whether the field represents a key qualifier field (`KEY_QUALIFIER`) or not (`NONE`). Since v59.0."}
      - {name: dev_name, api_name: devName, type: string, description: "Not in the spec schema: from the spec's examples."}

  CdpDataGraphPathToParentInputRepresentation:
    description: Data graph source object path input representation.
    attributes:
      - {name: field_name, api_name: fieldName, type: string, required: true, description: "Field name of this object that joins with parent_field_name. Since v59.0."}
      - {name: parent_field_name, api_name: parentFieldName, type: string, required: true, description: "Field name of the parent object that participated in the path. Since v59.0."}

  CdpDataGraphSourceInputRepresentation:
    description: Data graph source object input representation.
    attributes:
      - {name: dataspace_name, api_name: dataSpaceName, type: string, description: "Name of the data space. If unspecified, the `default` data space is used. This property is required for data graph resources. Since v59.0."}
      - {name: description, type: string, description: "Description of the object to create. Since v59.0."}
      - {name: label, type: string, description: "Label of the object to create. This property is required for data graph resources. Since v59.0."}
      - {name: name, type: string, description: "API name of the object to create. This property is required for data graph resources. Since v59.0."}
      - {name: fields, schema: CdpDataGraphFieldInputRepresentation, array: 1, description: "List of fields on the source object that need to be included in the data graph. Since v59.0."}
      - {name: json_path, api_name: jsonPath, type: string, description: "Projected JSON path of this object in the output value JSON from root. Since v59.0."}
      - {name: path, schema: CdpDataGraphPathToParentInputRepresentation, array: 1, description: "Path of the source object. Since v59.0."}
      - {name: recency_criteria, api_name: recencyCriteria, schema: CdpDataGraphDataRecencyInputRepresentation, array: 1, description: "Recency criteria of the source object. Since v59.0."}
      - {name: related_objects, api_name: relatedObjects, schema: CdpDataGraphSourceInputRepresentation, array: 1, description: "List of related child objects that need to be included in the data graph. Since v59.0."}
      - {name: type, type: string, enum: [CALCULATED, CALCULATED_STREAMING, CALCULATED_REAL_TIME, STANDARD, CUSTOM, SYSTEM, DERIVED, BRIDGE, SEGMENT_MEMBERSHIP, ML_PREDICTION, ACTIVATION_AUDIENCE, TRANSFORM], description: "Type of the source object. Since v59.0."}
      - {name: dev_name, api_name: devName, type: string, description: "Not in the spec schema: from the spec's examples."}

  DataGraphFullRefreshConfigInputRepresentation:
    description: Represents the input for a full refresh data graph.
    attributes:
      - {name: schedule, schema: DataGraphScheduleInputRepresentation, description: "Details about the full refresh schedule. Since v67.0."}

  DataGraphScheduleInputRepresentation:
    description: Represents the input for a data graph schedule.
    attributes:
      - {name: frequency, type: integer, description: "Frequency of the schedule refresh. Since v67.0."}
      - {name: time_granularity, api_name: timeGranularity, type: string, description: "Type of time granularity. The spec's example sends `Day`, a [community fixture](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/test/fixtures/live/data-graph-get.json) returned `day`, and other values aren't documented. Since v67.0."}

  data_graph_create_fullRefreshConfig:
    unknown: warning
    attributes:
      - {name: schedule, schema: data_graph_create_fullRefreshConfig_schedule, description: "Seen in examples: the spec types the parent as a free-form object."}

  data_graph_create_fullRefreshConfig_schedule:
    unknown: warning
    attributes:
      - {name: frequency, type: integer, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: time_granularity, api_name: timeGranularity, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}

  data_graph_create_incrementalRefreshConfig:
    unknown: warning
    attributes:
      - {name: enabled, type: boolean, description: "Seen in examples: the spec types the parent as a free-form object."}
