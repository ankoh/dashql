title: Data Graphs
description: |
  A data graph joins a primary DMO and its related objects into a [materialized JSON view](https://developer.salesforce.com/docs/data/data-cloud-query-guide/references/data-cloud-query-api-reference/c360a-api-data-graphs-overview.md), so an app can fetch a whole customer by key without writing joins.

  The functions split in two. `data_graph_*` manage the definition: create, read, activate a draft, refresh, delete. `datagraph_*` read the graph's records and schema through `/ssot`. The same reads on the tenant host are in [profiles and metadata](profiles_and_metadata.md#direct_datagraph_lookup): `direct_datagraph_lookup`, `direct_datagraph_get` and `direct_datagraph_metadata`.

  The order: the DMOs and relationships must exist, then create, wait for `status`, read, refresh, delete. The spec has no update call and no plain list, so `datagraph_metadata` is the list.

  What matters most:

  - Each record arrives as a JSON string in `data[].json_blob__c`, which needs a second parse.
  - `lookup_keys` is one string that includes its square brackets.
  - Creating a graph also creates system DMOs and points to a transform (community). See [`data_graph_create`](#data_graph_create).
  - Refresh can report `success = false`, so check the column.
  - The spec's create example uses attributes its schema doesn't have, including the one that makes a draft.

  ```sql
  CALL cdp.data_graph_create (name => 'Customer_Graph', label => 'Customer Graph', type => 'NONE', primary_object_name => 'ssot__Individual__dlm', source_object => (name = 'ssot__Individual__dlm', type = 'standard', json_path = '$', fields = [(source_field_name = 'ssot__Id__c', is_key_column = true, is_projected = true, data_type = 'Text', usage_tag = 'NONE')], related_objects = []));
  CALL cdp.data_graph_get (data_graph_name => 'Customer_Graph'); /* poll status */
  CALL cdp.datagraph_lookup (data_graph_entity_name => 'Customer_Graph', lookup_keys => '[ssot__Individual__dlm.ssot__Id__c=10000001]');
  CALL cdp.data_graph_refresh (data_graph_name => 'Customer_Graph');
  ```

functions:
  - name: data_graph_delete
    method: DELETE
    host: connect
    path: /ssot/data-graphs/{dataGraphName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Graphs/paths/~1ssot~1data-graphs~1%7BdataGraphName%7D/delete
    description: Delete a data graph. Since v59.0.
    example: CALL cdp.data_graph_delete (data_graph_name => 'Customer_Graph');
    options:
      - {name: data_graph_name, api_name: dataGraphName, in: path, type: string, required: true, description: "API name: `name` from the create response, or `developer_name` from `datagraph_metadata`."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 200). One row with only the standard columns.
    notes: |
      **Notes:** No source says what happens to the graph's system DMOs and transform, or to objects that reference the graph, such as personalization points. Compare [`metadata`](profiles_and_metadata.md#metadata) before and after.

      The spec has no data space option here.

      In a [community probe](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/test/fixtures/live/p5-probe-data-graph-delete-error.json), deleting a missing graph returned the code `INTERNAL_ERROR`, not a separate not-found code (community, one org).

  - name: data_graph_get
    method: GET
    host: connect
    path: /ssot/data-graphs/{dataGraphName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Graphs/paths/~1ssot~1data-graphs~1%7BdataGraphName%7D/get
    description: Read one graph's definition and status. Use it to poll a graph after create, activate or refresh. For the graph's records, use `datagraph_lookup` or `datagraph_query`. Since v59.0.
    example: CALL cdp.data_graph_get (data_graph_name => 'Customer_Graph');
    options:
      - {name: data_graph_name, api_name: dataGraphName, in: path, type: string, required: true, description: "API name: `name` from the create response, or `developer_name` from `datagraph_metadata`."}
    columns:
      - {name: created_by, api_name: createdBy, type: VARCHAR, description: "Who or what created the base object. Since v59.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date when the base object was created. Since v59.0."}
      - {name: dataspace_name, api_name: dataspaceName, type: VARCHAR, description: "Name of the data space of the base object. If unspecified, the `default` data space is used. Since v59.0."}
      - {name: description, type: VARCHAR, description: "Description of the base object. Since v59.0."}
      - {name: id, type: VARCHAR, description: "ID of the base object. Since v59.0."}
      - {name: label, type: VARCHAR, description: "Label of the base object. Since v59.0."}
      - {name: modified_by, api_name: modifiedBy, type: VARCHAR, description: "Who or what most recently modified the base object. Since v59.0."}
      - {name: modified_date, api_name: modifiedDate, type: VARCHAR, description: "When the base object was most recently modified. Since v59.0."}
      - {name: name, type: VARCHAR, description: "Name of the base object. Since v59.0."}
      - {name: extended_properties, api_name: extendedProperties, type: VARCHAR, description: "Extended properties of the data graph. Since v59.0."}
      - {name: id_dmo_label, api_name: idDmoLabel, type: VARCHAR, description: "Label of the data model object (DMO) that contains the ID table of the data graph. Since v59.0."}
      - {name: id_dmo_name, api_name: idDmoName, type: VARCHAR, description: "API name of the data model object (DMO) that contains the ID table of the data graph. Since v59.0."}
      - {name: kind, type: VARCHAR, description: "Reserved for internal use. Since v59.0."}
      - {name: last_run_status, api_name: lastRunStatus, type: VARCHAR, description: "Status for the most recent run of the data graph. Since v59.0."}
      - {name: primary_object_label, api_name: primaryObjectLabel, type: VARCHAR, description: "Label of the primary data model object (DMO) of the data graph. Since v59.0."}
      - {name: primary_object_name, api_name: primaryObjectName, type: VARCHAR, description: "Developer name of the primary object. Since v59.0."}
      - {name: source_object, api_name: sourceObject, type: JSON, schema: CdpDataGraphSourceObjectOutputRepresentation, description: "Source object. Since v59.0."}
      - {name: status, type: VARCHAR, description: "Status of the data graph. Since v59.0."}
      - {name: type, type: VARCHAR, description: "Type of the data graph. Since v59.0."}
      - {name: values_dmo_label, api_name: valuesDmoLabel, type: VARCHAR, description: "Label of the data model object (DMO) that contains the data graph JSON records. Since v59.0."}
      - {name: values_dmo_name, api_name: valuesDmoName, type: VARCHAR, description: "API name of the DMO that contains the data graph JSON records. Since v59.0."}
      - {name: version, type: VARCHAR, description: "Version of the data graph. Since v59.0."}
    effect: read
    evidence: O
    result_description: One row. Schema `CdpDataGraphOutputRepresentation`.
    notes: |
      **Notes:** **Compared with `datagraph_metadata`:** this call adds labels, the refresh schedule, node `json_path` and `relatedSegments`. The tree is under `source_object`, and fields use `source_field_name` ([community, one org](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md)).

      **Status can disagree.** The same source saw `Inprogress` from metadata while this call said `ready`, and a day later both said ready. Letter case differs too, so compare without case. That tool trusts this call's `status` (community, one org).

      **Fields outside the spec** land in `_raw`. A [live fixture](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/test/fixtures/live/data-graph-get.json) has `full_refresh_config`, `incremental_refresh_config`, `dayZeroTransformDevName`, `dayZeroMappingDevName`, and `source_object.fragmentDMOName` (community).

      That fixture has no `last_run_status`, although the spec lists it, and its dates look like `Wed Jul 29 06:07:06 GMT 2026`, not ISO 8601 (community).

  - name: datagraph_lookup
    method: GET
    host: connect
    path: /ssot/data-graphs/data/{dataGraphEntityName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Graphs/paths/~1ssot~1data-graphs~1data~1%7BdataGraphEntityName%7D/get
    tools: [d360_datagraph_lookup]
    description: Query a data graph by the primary key of either the primary data model object (DMO) or the Individual linked DMO. For real-time data graphs, the endpoint attempts to retrieve data from the real-time data graph but falls back to the standard data graph if the real-time data graph is unavailable. Since v59.0.
    example: CALL cdp.datagraph_lookup (data_graph_entity_name => 'UnifiedIndividual_DG', lookup_keys => '[UnifiedLinkssotIndividualIr1__dlm.SourceRecordId__c=10000001]');
    options:
      - {name: data_graph_entity_name, api_name: dataGraphEntityName, in: path, type: string, required: true, description: "API name of the data graph to query. Since v59.0."}
      - {name: dataspace, in: query, type: string, description: "Name of the data space in which to query the data graph. By default, the endpoint queries the `default` dataspace. Since v59.0."}
      - {name: lookup_keys, api_name: lookupKeys, in: query, type: string, required: true, description: "Lookup key and value to search on. Specify one of these key-value pairs: - The primary key of the primary DMO, for example, `lookup_keys=[id__c=def]` - The primary key of the Individual linked DMO, for example, `lookup_keys=[IndividualLink__dlm.SourceRecordId__c=1111111]` Since v59.0."}
      - {name: no_cache, api_name: noCache, in: query, type: boolean, description: "Indicates whether to read data from the standard, non-real-time data graph (`true`) or the real-time data graph (`false`). The default is `false`. Since v59.0."}
    columns:
      - {name: data, type: JSON, description: "Result data set. Since v52.0."}
      - {name: done, type: BOOLEAN, description: "Specifies whether the query is done (`true`) or not (`false`). Since v52.0."}
      - {name: end_time, api_name: endTime, type: VARCHAR, description: "Query end time. Not returned for data graphs. Since v52.0."}
      - {name: metadata, type: JSON, description: "Result metadata set. Not returned for data graphs. Since v52.0."}
      - {name: query_id, api_name: queryId, type: VARCHAR, description: "Query ID. Not returned for data graphs. Since v52.0."}
      - {name: row_count, api_name: rowCount, type: BIGINT, description: "Number of rows in the result data set. Not returned for data graphs. Since v52.0."}
      - {name: start_time, api_name: startTime, type: VARCHAR, description: "Query start time. Not returned for data graphs. Since v52.0."}
    effect: read
    evidence: O
    result_description: One row. Schema `CdpQueryOutputRepresentation`.
    notes: |
      **Notes:** **`data_graph_entity_name`** is the graph's name, not a DMO name. The docs' example is `UnifiedIndividual_DG`.

      **`lookup_keys`** is one string, brackets included. The spec lists only two forms: the primary DMO's primary key and the Individual linked DMO's primary key. The [lookup reference](https://developer.salesforce.com/docs/data/data-cloud-query-guide/references/data-cloud-query-api-reference/c360a-api-v1-data-graphs-lookup.md) covers more, but it documents the [tenant host route](profiles_and_metadata.md#direct_datagraph_lookup), and no source says whether all of it applies to `/ssot`:

      | Search on | Primary key | Primary key and key qualifier | Other fields |
      |---|---|---|---|
      | Primary DMO | `[primaryDMO__dlm.PrimaryKeyField=value]` | `[primaryDMO__dlm.PrimaryKeyField=value, primaryDMO__dlm.key_qualifier_field=value]` | `[primaryDMO__dlm.anyField=value, primaryDMO__dlm.anyField2=value]` |
      | Value DMO | `[valueDMO__dlm.PrimaryKeyField=value]` | `[valueDMO__dlm.PrimaryKeyField=value, valueDMO__dlm.key_qualifier_field=value]` | Not supported |
      | Link table DMO | `[DMO__dlm.primaryKeyField=value]` | `[DMO__dlm.primaryKeyField=value, DMO__dlm.key_qualifier_field=value]` | `[linkTableDMO__dlm.anyField=value, linkTableDMO__dlm.anyField2=value]` |
      | Participating DMO | `[Participating__dlm.primaryKey=value]` | Not supported | Not supported |

      Per that reference, several keys must all match, contact-based lookup takes one contact key per request, and real-time graphs only search by primary key and key qualifier. Use `datagraph_metadata` to find the DMO and field names.

      **Result:** `data` is an array with one element per matching record, and a key can match more than one unified record. Each element's `json_blob__c` is a JSON string holding the nested record.

      **`no_cache` sources conflict.** The spec says `true` reads the standard graph and `false` the real-time graph. Salesforce's MCP server describes it as ["Bypass cache"](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/QueryTools.java), which suggests fresher data, while the spec's `true` reads the non-real-time graph.

      **Projection isn't in the spec for this route.** The tenant host route documents `fields` and `filters`. The MCP server sends `projectedFields` and `projectedFilters` here, so neither is confirmed.

  - name: datagraph_query
    method: GET
    host: connect
    path: /ssot/data-graphs/data/{dataGraphEntityName}/{id}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Graphs/paths/~1ssot~1data-graphs~1data~1%7BdataGraphEntityName%7D~1%7Bid%7D/get
    tools: [d360_datagraph_query]
    description: Query data graph data by ID. For real-time data graphs, the API retrieves data from the real-time data graph and only falls back to the standard data graph if the real-time data graph is unavailable. Since v59.0.
    example: CALL cdp.datagraph_query (data_graph_entity_name => 'UnifiedIndividual_DG', id => '100005', live => true);
    options:
      - {name: data_graph_entity_name, api_name: dataGraphEntityName, in: path, type: string, required: true, description: "API name of the data graph to query. Since v59.0."}
      - {name: id, in: path, type: string, required: true, description: "Record ID to query for, which is matched against the primary key field of the primary data model object (DMO) in the data graph. Since v59.0."}
      - {name: dataspace, in: query, type: string, description: "Name of the data space to query. If unspecified, the `default` data space is used. Since v59.0."}
      - {name: live, in: query, type: boolean, description: "Indicates whether live lookup for the data graph is enabled (`true`) or not (`false`). Since v63.0."}
    columns:
      - {name: data, type: JSON, description: "Result data set. Since v52.0."}
      - {name: done, type: BOOLEAN, description: "Specifies whether the query is done (`true`) or not (`false`). Since v52.0."}
      - {name: end_time, api_name: endTime, type: VARCHAR, description: "Query end time. Not returned for data graphs. Since v52.0."}
      - {name: metadata, type: JSON, description: "Result metadata set. Not returned for data graphs. Since v52.0."}
      - {name: query_id, api_name: queryId, type: VARCHAR, description: "Query ID. Not returned for data graphs. Since v52.0."}
      - {name: row_count, api_name: rowCount, type: BIGINT, description: "Number of rows in the result data set. Not returned for data graphs. Since v52.0."}
      - {name: start_time, api_name: startTime, type: VARCHAR, description: "Query start time. Not returned for data graphs. Since v52.0."}
      - {name: ssot__id__c, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
      - {name: ssot__name__c, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
      - {name: ssot__age__c, type: BIGINT, description: "Not in the spec schema: from the spec's examples."}
      - {name: ssot__ContactPointEmail__dlm, type: JSON, description: "Not in the spec schema: from the spec's examples."}
      - {name: ssot__orders__dlm, type: JSON, description: "Not in the spec schema: from the spec's examples."}
    effect: read
    evidence: O
    result_description: One row. Schema `CdpQueryOutputRepresentation`.
    notes: |
      **Notes:** This is a get by key, and it takes no SQL. For any key other than the primary DMO's primary key, use `datagraph_lookup`.

      **`live`:** the [reference](https://developer.salesforce.com/docs/data/data-cloud-query-guide/references/data-cloud-query-api-reference/c360a-api-v1-data-graphs-name-id.md) says `true` retrieves the latest data and the default is precalculated data. It also says `live` doesn't support real-time graphs. Live queries have [longer latency and higher credit use](https://developer.salesforce.com/docs/data/data-cloud-query-guide/references/data-cloud-query-api-reference/c360a-api-data-graphs-overview.md).

      **The response shape conflicts.** The reference shows `data[].json_blob__c` holding a JSON string, as in `datagraph_lookup`. The spec's by-id example is a nested object with no `data` wrapper, although its schema has `data`. The table follows the schema.

      Projection is the same open question as on [`datagraph_lookup`](#datagraph_lookup).

  - name: datagraph_metadata
    method: GET
    host: connect
    path: /ssot/data-graphs/metadata
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Graphs/paths/~1ssot~1data-graphs~1metadata/get
    tools: [d360_datagraph_metadata]
    description: Query data graph metadata. This API supports both standard and real-time data graphs that allow you to retrieve metadata from each respective graph type. Since v59.0.
    example: CALL cdp.datagraph_metadata (data_graph_entity_name => 'UnifiedIndividual_DG');
    options:
      - {name: data_graph_entity_name, api_name: dataGraphEntityName, in: query, type: string, description: "API name of the data graph to query. If unspecified, metadata for all data graphs is returned. Since v59.0."}
      - {name: dataspace, in: query, type: string, description: "Name of the data space to query. If unspecified, the `default` data space is used. Since v59.0."}
    rows: /dataGraphMetadata
    columns:
      - {name: dataspace_name, api_name: dataspaceName, type: VARCHAR, description: "Name of the data space in which the data graph metadata resides. Since v59.0."}
      - {name: description, type: VARCHAR, description: "Description of the data graph metadata. Since v59.0."}
      - {name: developer_name, api_name: developerName, type: VARCHAR, description: "Developer name of the data graph metadata. Since v59.0."}
      - {name: dg_object, api_name: dgObject, type: JSON, schema: DataGraphObjectDataRepresentation, description: "Metadata for the data object of the data graph. Since v59.0."}
      - {name: extended_properties, api_name: extendedProperties, type: JSON, description: "Extended properties of the data graph metadata. Since v59.0."}
      - {name: id_dmo_name, api_name: idDmoName, type: VARCHAR, description: "API name of the data model object (DMO) that contains the ID table for the data graph. Since v59.0."}
      - {name: ids_dmo, api_name: idsDmo, type: JSON, schema: DataGraphIdsDmoRepresentation, description: "Data about the DMO that contains the ID table for the data graph. Since v61.0."}
      - {name: primary_object_name, api_name: primaryObjectName, type: VARCHAR, description: "Name of the primary object for the data graph. Since v59.0."}
      - {name: primary_object_type, api_name: primaryObjectType, type: VARCHAR, description: "Data type of the primary object for the data graph. Since v59.0."}
      - {name: status, type: VARCHAR, description: "Status of the data graph. Since v59.0."}
      - {name: values_dmo, api_name: valuesDmo, type: JSON, schema: DataGraphValuesDmoRepresentation, description: "Data about the data model object (DMO) that contains the JSON records for the data graph. Since v61.0."}
      - {name: values_dmo_name, api_name: valuesDmoName, type: VARCHAR, description: "API name of the DMO that contains the JSON records for the data graph. Since v59.0."}
      - {name: version, type: VARCHAR, description: "Version of the data graph metadata. Since v59.0."}
    effect: read
    evidence: O
    result_description: One row per item of `/dataGraphMetadata` in the response. Schema `CdpQueryDataGraphMetadataRepresentation`.
    notes: |
      **Notes:** This is the list of graphs: the spec has no `GET /ssot/data-graphs`, and a [community SDK](https://github.com/javrrr/data-360-sdk/blob/main/src/resources/data-graphs.ts) wraps this call as one. `developer_name` is the name the other calls take.

      One call returns every graph's full tree: `dg_object` holds `related_objects`, recursively. Each node has `type`, `fields`, `paths`, `filterCriteria`, `recency_criteria` and `memberDmoName`, the node's fragment DMO ([community, one org](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md)).

      `status` here can differ from [`data_graph_get`](#data_graph_get).

