    effect: read
    evidence: O
    result_description: One row. Schema `DataStreamDetailedRepresentation`.
    notes: |
      **Notes:** **Status values.** `status` and `last_run_status` aren't in the published schema's spelling. Salesforce's sf-pi repo [accepts other values from live responses](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/registry/connect-openapi-overrides.json) for these fields, and the spec's own examples show uppercase. A [community SDK](https://github.com/javrrr/data-360-sdk/blob/main/src/schemas.ts) lists `status` as `PROCESSING`, `ACTIVE`, `ERROR`, `DELETING`, `NEEDS_ACTIVATION`, `INACTIVE`, and `last_run_status` as `NONE`, `PENDING`, `IN_PROGRESS`, `EXTRACTING`, `SUCCESS`, `FAILURE`, `CANCELLED`.

      **Field names.** The [official guide](https://developer.salesforce.com/docs/data/connectapi/guide/data-stream-use-case.md) reads DLO field names from `data_lake_object_info.fields`. The spec's examples only show `data_lake_field_info_representation`. Check both. Custom CRM fields end in `_c` here, not `__c`.

      **Output isn't valid input.** The community SDK and afd360 report (community):

      | Result | Create input |
      |---|---|
      | `source_fields.datatype` | `source_fields.dataType` |
      | `mappings.sourceFieldName` | `mappings.sourceFieldLabel` |
      | `connector_info.connectorDetails.type` | not accepted, 400 `JSON_PARSER_ERROR` |
      | `connector_type = 'AwsS3'` | `connector_type = 'DataConnector'` |
      | `data_access_mode = 'INGEST'` | `data_access_mode = 'Ingest'` in the spec |

  - name: datastream_update
    method: PATCH
    host: connect
    path: /ssot/data-streams/{recordIdOrDeveloperName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Streams/paths/~1ssot~1data-streams~1%7BrecordIdOrDeveloperName%7D/patch
    tools: [d360_datastream_update]
    description: Change a stream's label, refresh settings, source fields or mappings, or disable CRM fields in bulk. Only the attributes you pass change.
    example: CALL cdp.datastream_update (record_id_or_developer_name => '0dkRM000000001XYAQ', data_stream_type => 'SFDC', mappings => [(target_field_name = 'IsEnrollmentRequired', transformation_formula = NULL), (target_field_name = 'customField_c', transformation_formula = NULL)]);
    options:
      - {name: record_id_or_developer_name, api_name: recordIdOrDeveloperName, in: path, type: string, required: true, description: "`record_id` from the result, or the developer name."}
      - {name: connector_patch_info, api_name: connectorPatchInfo, in: body, schema: ConnectorPatchInputRepresentation, description: "Information about the connector for the data stream. Since v60.0."}
      - {name: data_lake_object_info, api_name: dataLakeObjectInfo, in: body, schema: DataStreamPatchInput_dataLakeObjectInfo, array: 1, description: "DLO fields to add or change. The spec types this as an array, and its BYOL example sends one object with `data_lake_field_input_representations`."}
      - {name: data_stream_type, api_name: datastreamType, in: body, type: string, description: "Type of data stream. Possible values include: - `AZURE` - `COMMERCE_CLOUD-S3` - `CONNECTORSFRAMEWORK` - `CRM-S3` - `DATA_CONNECTORS` - `DATA_CONNECTORS_STREAMING` - `DFU-BUNDLE` - `DFU-DE` - `EVENTS` - `GCS` - `INGEST_API` - `MCIS` - `S3` - `SFDC` - `SFDC_BUNDLE` - `SFDC_PACKAGE_KIT` - `SFTP` - `SLACK` Since v60.0."}
      - {name: label, in: body, type: string, description: "Label of the data stream. Since v60.0."}
      - {name: mappings, in: body, schema: DataStreamFieldMappingInputRepresentation, array: 1, description: "Mappings between source fields or formulas and DLO fields. A mapping with `transformation_formula = NULL` disables that field on a CRM stream."}
      - {name: refresh_config, api_name: refreshConfig, in: body, schema: RefreshConfigInputRepresentation, description: "New refresh settings."}
      - {name: source_fields, api_name: sourceFields, in: body, schema: DataStreamSourceFieldInputRepresentation, array: 1, description: "Source fields to add. Not used for streams of type `EVENTS`. To re-enable disabled fields of a CRM stream, add them here."}
      - {name: advanced_attributes, api_name: advancedAttributes, in: body, schema: datastream_update_advancedAttributes, description: "Not in the spec schema: from the spec's examples."}
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: data_lake_object_info, api_name: dataLakeObjectInfo, type: JSON, schema: DataLakeObjectRepresentation, description: "Information about the data lake object (DLO) related to the data stream. Since v60.0."}
      - {name: record_id, api_name: recordId, type: VARCHAR, description: "Record ID of the data stream. Since v60.0."}
      - {name: status, type: VARCHAR, description: "Status of the data stream. Since v60.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `DataStreamRepresentation`.
    notes: |
      **Done when:** `datastream_get.status` returns to `ACTIVE`. The update returns `PROCESSING` ([official guide](https://developer.salesforce.com/docs/data/connectapi/guide/data-stream-use-case.md)).

      **Notes:** **Bulk disable CRM fields.** This is the [official use case](https://developer.salesforce.com/docs/data/connectapi/guide/data-stream-use-case.md), and the example above is its request. When a CRM field is deleted or the integration user loses access, the stream keeps trying to extract it and fails. Disabling fields one by one starts a deploy cycle per field, and no other field operation can run during a cycle. A single call handles all fields in one cycle.

      1. Call `datastream_get` and find each field's `name` under `data_lake_object_info.fields`. Custom fields end in `_c`.
      2. Call `datastream_update` with `data_stream_type => 'SFDC'` and one mapping per field. Each has `target_field_name` and `transformation_formula = NULL`.

      `NULL` must be sent as a JSON `null`. The call returns `status = 'PROCESSING'`. The DLO keeps its fields, and only the source link and formula are removed.

      - Never disable `Id`, `SystemModstamp`, `SfdcOrganizationId`, `DataSource`, `DataSourceObject` or `cdp_sys_PartitionDate`.
      - Check first if you can restore access instead. Mappings, transforms, segments and activations get null or stale values for a disabled field.
      - To re-enable a field, add it to `source_fields` with this function.

      **What can change.** The [MCP tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/datastream/DataStreamTools.java) lists `refresh_config` (`refresh_mode`, `frequency`, `is_acceleration_enabled`), `label`, `mappings` and `source_fields` as updatable, and `shouldFetchImmediately`, `last_run_status` and `total_records` as read-only. For Ingestion API streams, the [official page](https://developer.salesforce.com/docs/data/data-cloud-int/guide/c360-a-create-ingestion-data-stream.md) says refresh mode "cannot be changed" after creation. One community project [deletes and recreates on any drift](https://github.com/javrrr/afd360/blob/main/src/resources/data-stream.ts) instead of patching.

      ```sql
      CALL cdp.datastream_update (record_id_or_developer_name => 'S3Stream',
        refresh_config => (refresh_mode = 'UPSERT', frequency = (frequency_type = 'WEEKLY', refresh_day_of_week = 'Monday', hours = [8])));

      /* Add a source column and map it */
      CALL cdp.datastream_update (record_id_or_developer_name => 'S3Stream',
        source_fields => [(name = 'NewField', data_type = 'Text')],
        mappings => [(source_field_label = 'NewField', target_field_name = 'NewField', target_field_returntype = 'Text')]);
      ```

      **Spec gaps.** The spec's schema has no `advanced_attributes` here, but its S3 and BYOL update examples send it (`file_name`, `import_directory`, `incrementalColumn`), and a [community SDK](https://github.com/javrrr/data-360-sdk/blob/main/src/schemas.ts) says it's accepted. It's therefore missing from the options above. The spec types `data_lake_object_info` as an array, and its example sends one object. Two spec formula examples are cut off (`CONCAT(source_field['first name']`), so don't copy them.

