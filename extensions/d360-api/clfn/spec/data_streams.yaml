      - {name: last_refresh_date, api_name: lastRefreshDate, type: VARCHAR, description: "Data and time of the most recent refresh for the data stream. Since v62.0."}
      - {name: last_run_status, api_name: lastRunStatus, type: VARCHAR, description: "Status of the most recent run. Since v60.0."}
      - {name: mappings, type: JSON, array: 1, schema: DataStreamFieldMappingRepresentation, description: "Data stream mappings. Since v60.0."}
      - {name: record_id, api_name: recordId, type: VARCHAR, description: "Record ID of the data stream. Since v60.0."}
      - {name: refresh_config, api_name: refreshConfig, type: JSON, schema: RefreshConfigRepresentation, description: "Data stream refresh configuration. Since v60.0."}
      - {name: source_fields, api_name: sourceFields, type: JSON, array: 1, schema: DataStreamSourceFieldRepresentation, description: "List of data stream source field information. Since v60.0."}
      - {name: status, type: VARCHAR, description: "Status of the data stream. Since v60.0."}
      - {name: total_records, api_name: totalRecords, type: BIGINT, description: "Total records in the data stream. Since v60.0."}
      - {name: is_enabled, api_name: isEnabled, type: BOOLEAN, description: "Not in the spec schema: from the spec's examples."}
      - {name: capabilities, type: JSON, description: "Not in the spec schema: from the spec's examples."}
    paging: {kind: url, from: {body: /nextPageUrl}}
    effect: read
    evidence: O
    result_description: "One row per item of `/dataStreams` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`. Schema `DataStreamDetailedRepresentation`."
    notes: |
      **Paging:** `next_page_url`. Follow it, and don't compute offsets. `offset` counts from 1, though the spec calls it rows to skip: its examples show `offset=1` on the first page, and [one project found](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md) that `offset=0` acts like 1 and `limit=3&offset=1` links to `offset=4` (community, one org). Page size is also unclear: the spec says 1 to 200, and [another project](https://github.com/javrrr/afd360/blob/main/src/resources/data-stream.ts) reports a cap near 10 whatever `limit` says (community, one org).

      **Notes:** The list omits field mappings [even with `include_mappings => 'true'`](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md) (community), so call `datastream_get` per stream when you need them.

      There is no data space option. Filter on `data_lake_object_info.dataSpaceInfo` on the client (community). The same project measured about 4 seconds for a list of 10 streams (community, one org).

      The `order_by` description in the spec mixes `ASC`/`DESC` with field names and doesn't say how to combine them. The [MCP tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/datastream/DataStreamTools.java) also sends a `source_object_name` filter that the spec doesn't have, so it isn't an option here.

