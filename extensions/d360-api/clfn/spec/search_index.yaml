      **Notes:** [Salesforce's tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/SearchIndexTools.java) says to read `search_index_config` and `search_index_get` first and build the body from them. The spec requires the same fields as create, so a label change still sends the whole definition.

      A GET response can't be sent back as is. GET returns `chunk_dmo_developer_name` and `vector_dmo_developer_name` with `__dlm` in the spec's examples, while this call takes them without it. GET also returns display-name fields that are [reported to return a 500 on input](https://github.com/javrrr/afd360/blob/main/docs/resources.md#searchindex) (community), per [`search_index_create`](#search_index_create).

      No source says which fields can change or whether an update rebuilds the index. afd360 [avoids PATCH](https://github.com/javrrr/afd360/blob/main/src/resources/search-index.ts) and deletes and recreates the index instead (community). The `vector_embedding_related_fields` conflict on create applies here too.

  - name: search_index_create
    method: POST
    host: connect
    path: /ssot/search-index
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Search-Index/paths/~1ssot~1search-index/post
    tools: [d360_search_index_create]
    description: Create a search index over a DMO. The platform generates the chunk and index DMOs, then chunks and embeds the data in the background. Since v60.0.
    example: CALL cdp.search_index_create (label => 'Articles Search', developer_name => 'Articles_Search', source_dmo_developer_name => 'Articles__dlm', chunk_dmo_name => 'Articles Search chunk', chunk_dmo_developer_name => 'Articles_Search_chunk', vector_dmo_name => 'Articles Search index', vector_dmo_developer_name => 'Articles_Search_index', search_type => 'HYBRID', processing_type => 'NEAR_REALTIME', vector_embedding => (vector_embedding_related_fields = [(related_dmo_developer_name = 'Articles__dlm', related_dmo_field_developer_name = 'Id__c', relationships = [])]), chunking_configuration => (field_level_configurations = [(source_dmo_developer_name = 'Articles__dlm', source_dmo_field_developer_name = 'Body__c', config = (id = 'passage_extraction', user_values = [(id = 'strip_html', value = 'true'), (id = 'max_tokens', value = '512')]))]), vector_embedding_configuration => (embedding_model = (id = 'e5_large_v2', user_values = [(id = 'dimension', value = '1024'), (id = 'max_token_limit', value = '512')]), index = (id = 'HNSW', user_values = [(id = 'hnswEfConstruction', value = '2000'), (id = 'M', value = '64')]), similarity_metric = 'COSINE'));
    options:
      - {name: id, in: body, type: string, description: "ID of the asset. Since v58.0."}
      - {name: name, in: body, type: string, description: "Name of the asset. Since v58.0."}
      - {name: namespace, in: body, type: string, description: "Namespace of the asset. Since v58.0."}
      - {name: activation_status, api_name: activationStatus, in: body, type: string, description: "Activation status of the semantic search record. Since v60.0."}
      - {name: attachment_dmo_developer_name, api_name: attachmentDmoDeveloperName, in: body, type: string, description: "Developer name of the attachment `MktDataModelObject`. For example, `loanAgreement__dlm`. Since v62.0."}
      - {name: chunk_dmo_developer_name, api_name: chunkDmoDeveloperName, in: body, type: string, required: true, description: "Developer name of the data model object (DMO) used for chunking, excluding the `__dlm` suffix. Since v60.0."}
      - {name: chunk_dmo_name, api_name: chunkDmoName, in: body, type: string, required: true, description: "Name of the DMO used for chunking. Since v60.0."}
      - {name: chunking_configuration, api_name: chunkingConfiguration, in: body, schema: ChunkingConfigInputRepresentation, required: true, description: "Chunking configuration. Since v60.0."}
      - {name: description, in: body, type: string, description: "Description of semantic search record to be created. Since v60.0."}
      - {name: developer_name, api_name: developerName, in: body, type: string, required: true, description: "Developer name of the semantic search record to be created. Since v60.0."}
      - {name: index_configuration, api_name: indexConfiguration, in: body, schema: IndexConfigInputRepresentation, description: "Index configuration for the semantic search record. Since v64.0."}
      - {name: label, in: body, type: string, required: true, description: "Label of semantic search record to be created. Since v60.0."}
      - {name: processing_type, api_name: processingType, in: body, type: string, description: "Processing type of the search index, such as `NEAR_REALTIME` or `REALTIME`. Only `NEAR_REALTIME` is reported to work (community). Since v63.0."}
      - {name: ranking_configurations, api_name: rankingConfigurations, in: body, schema: SearchRankingFieldInputRepresentation, array: 1, description: "List of ranking configurations for hybrid search. Selecting fields for a ranking configuration is optional. Since v60.0."}
      - {name: search_type, api_name: searchType, in: body, type: string, required: true, description: "Type of the search index (`HYBRID` or `VECTOR`). Since v60.0."}
      - {name: source_dmo_developer_name, api_name: sourceDmoDeveloperName, in: body, type: string, required: true, description: "Developer name of the source (parent) `MktDataModelObject`. For example, `loanAgreement__dlm`. Since v60.0."}
      - {name: transcribe_dmo_developer_name, api_name: transcribeDmoDeveloperName, in: body, type: string, description: "Transcribe output DMO developer name. Since v60.0."}
      - {name: transcribe_dmo_id, api_name: transcribeDmoId, in: body, type: string, description: "Transcribe output DMO ID. Since v60.0."}
      - {name: transcribe_dmo_name, api_name: transcribeDmoName, in: body, type: string, description: "Transcribe output DMO name. Since v60.0."}
      - {name: transform_configurations, api_name: transformConfigurations, in: body, schema: TransformConfigInputRepresentation, array: 1, description: "Transform configuration, used for transcribing audio and video. Salesforce's tool calls it required, but the spec doesn't. Since v60.0."}
      - {name: vector_dmo_developer_name, api_name: vectorDmoDeveloperName, in: body, type: string, required: true, description: "Developer name of the vector DMO, excluding the `__dlm` suffix. Since v60.0."}
      - {name: vector_dmo_name, api_name: vectorDmoName, in: body, type: string, required: true, description: "Name of the vector DMO. Since v60.0."}
      - {name: vector_embedding, api_name: vectorEmbedding, in: body, schema: VectorEmbeddingInputRepresentation, required: true, description: "Vector embedding objects. Since v60.0."}
      - {name: vector_embedding_configuration, api_name: vectorEmbeddingConfiguration, in: body, schema: VectorEmbeddingConfigInputRepresentation, required: true, description: "Vector embedding configuration. Since v60.0."}
      - {name: parsing_configurations, api_name: parsingConfigurations, in: body, array: 1, description: "Not in the spec schema: from the MCP server's request class."}
      - {name: post_processing_configurations, api_name: postProcessingConfigurations, in: body, array: 1, description: "Not in the spec schema: from the MCP server's request class."}
      - {name: pre_processing_configurations, api_name: preProcessingConfigurations, in: body, array: 1, description: "Not in the spec schema: from the MCP server's request class."}
      - {name: rule_configuration, api_name: ruleConfiguration, in: body, type: object, description: "Not in the spec schema: from the MCP server's request class."}
      - {name: semantic_search_ranking_configurations, api_name: semanticSearchRankingConfigurations, in: body, array: 1, description: "Not in the spec schema: from the MCP server's request class."}
      - {name: source_app, api_name: sourceApp, in: body, type: string, description: "Not in the spec schema: from the MCP server's request class."}
      - {name: source_app_developer_name, api_name: sourceAppDeveloperName, in: body, type: string, description: "Not in the spec schema: from the MCP server's request class."}
    columns:
      - {name: current_page_url, api_name: currentPageUrl, type: VARCHAR, description: "Current page URL. Since v60.0."}
      - {name: next_page_url, api_name: nextPageUrl, type: VARCHAR, description: "Next page URL, if it exists. Since v60.0."}
      - {name: total_size, api_name: totalSize, type: BIGINT, description: "Total size of the collection. Since v60.0."}
      - {name: chunking_strategies, api_name: chunkingStrategies, type: JSON, description: "List of chunking strategy object IDs. Since v60.0."}
      - {name: id, type: VARCHAR, description: "ID of the semantic search definition that was updated or created. Since v60.0."}
      - {name: ranking_configurations, api_name: rankingConfigurations, type: JSON, description: "List of ranking configuration object IDs that were created for hybrid search. Since v60.0."}
      - {name: transformations, type: JSON, description: "The list of transformation IDs. Since v60.0."}
      - {name: vector_embedding, api_name: vectorEmbedding, type: JSON, schema: VectorEmbeddingRepresentation, description: "The structure for vector embeddings, including any extra fields. Since v60.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `SemanticSearchRepresentation`.
    notes: |
      **Done when:** `search_index_get.runtime_status` = `READY`; `FAILED` is terminal. Allow several minutes, and over 15 on a newly mapped source DMO (one org).

      **Notes:** **Before you call it.** Salesforce's tool says to [read `search_index_config` first](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/SearchIndexTools.java) and take ids from there. The source DMO has to be ready, and these reports come from one community tool, [afd360](https://github.com/javrrr/afd360/blob/main/docs/resources.md#searchindex) (community):

      - A custom DMO needs `dataspace_name` populated, about 90 s after creation, or create returns 400.
      - A 400, sometimes a 500, saying the DMO is "not fully materialized" can last about 90 s longer. afd360 retries 6 times, 15 s apart.
      - Create the mapping first. [Without mapped data](https://github.com/javrrr/afd360/blob/main/src/resources/search-index.ts), the index can sit at a null `runtime_status` indefinitely.

      Salesforce's docs agree on the cause: [chunking runs only on content that exists in the source](https://developer.salesforce.com/docs/data/data-cloud-code-ext/guide/use-chunking-in-search-index.md).

      **`vector_embedding_related_fields` conflict.** Salesforce's [request class](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/model/request/searchindex/SearchIndexCreateRequest.java) says to "use empty list" when no related fields are needed, and the spec's examples and [Salesforce's kit](https://github.com/salesforce-misc/Data360AgentforceSolutionKitRetail/blob/main/.claude/skills/intelligent-context/SKILL.md) send `[]`. afd360 reports that [an empty list makes the server throw a null pointer error](https://github.com/javrrr/afd360/blob/main/docs/resources.md#searchindex) and sends the source DMO's primary key instead (community). No source settles it, so the example sends the key, which fits both. The spec also ties these fields to filtering: a NoCode retriever's filter field must be one of them. A [community skill](https://github.com/Jaganpro/sf-skills/blob/main/skills/sf-datacloud-retrieve/SKILL.md) says `hybrid_search` prefilters work only on fields configured at creation (community).

      **Names.** `source_dmo_developer_name` includes `__dlm`. `chunk_dmo_developer_name` and `vector_dmo_developer_name` must not, because the platform appends it. The chunk and index names you choose become the tables you query. They [also show up as DLOs](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md) ending `_chunk__dll` and `_index__dll`, with no data stream (community). Sending the display-name inputs `source_dmo_name`, `source_dmo_field_name`, `related_dmo_name` or `related_dmo_field_name` is [reported to return an opaque 500](https://github.com/javrrr/afd360/blob/main/docs/resources.md#searchindex) (community), although the spec lists them as input.

      **Don't retry blindly.** An error doesn't prove the index wasn't created. afd360 [saw the index land while the POST failed](https://github.com/javrrr/afd360/blob/main/src/resources/search-index.ts), so it reads the index by name before giving up (community). It also uses a 120 s timeout. The response carries only ids, so call `search_index_get` afterward.

      **What the sources disagree on:**

      - `transform_configurations`: [Salesforce's tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/SearchIndexTools.java) lists it as required, but the spec doesn't, and community examples omit it.
      - `processing_type`: [afd360](https://github.com/javrrr/afd360/blob/main/src/resources/search-index.ts) says only `NEAR_REALTIME` is accepted through the API and `REALTIME` is reserved (community). The spec lists both.
      - HNSW `user_values`: the spec's config example marks `hnswEfConstruction` and `M` read-only, at 2000 and 64. Salesforce's examples send those values, and a [community skill](https://github.com/Jaganpro/sf-skills/blob/main/skills/sf-datacloud-retrieve/SKILL.md) says to send `[]` (community).
      - The body: Salesforce's request class also has `parsing_configurations`, `pre_processing_configurations`, `post_processing_configurations`, `rule_configuration`, `semantic_search_ranking_configurations`, `source_app` and `source_app_developer_name`, which the spec lacks.
      - Data space: the spec has no data space option, but [Salesforce's kit](https://github.com/salesforce-misc/Data360AgentforceSolutionKitRetail/blob/main/.claude/skills/intelligent-context/SKILL.md) posts with `?dataspace=default`.

      **Reading the index.** Run `vector_search` or `hybrid_search` in a `SELECT` over the connection. The arguments are `TABLE("<name>_index__dlm")`, the search text, a prefilter string (`''` if none) and the number of results. The spec's retriever examples join `c."RecordId__c" = v."RecordId__c"`, then `c."SourceRecordId__c"` to the source DMO's key. Some also read `Chunk__c`, `DataSource__c` and `DataSourceObject__c` from the chunk DMO. A prefilter is a string, so its quotes double: `'Language__c = ''en_US'''`. [One community plugin](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/src/query/searchSql.ts) joins `v."SourceRecordId__c" = c."RecordId__c"` instead, but it labels that SQL unverified, so prefer the spec's form. [Another community example](https://github.com/Jaganpro/sf-skills/blob/main/skills/sf-ai-agentforce-observability/references/query-patterns.md) uses the spec's join. Salesforce's [published SQL reference doesn't cover these functions](https://developer.salesforce.com/docs/llms-data-cloud.txt), going by its index. No source says whether `hybrid_search` works on a `VECTOR` index.

  - name: search_index_process_history
    method: GET
    host: connect
    path: /ssot/search-index/{id}/process-history
    tools: [d360_search_index_process_history]
    description: Get the processing runs of one search index. Use it to see why an index isn't ready or when it last ran.
    example: CALL cdp.search_index_process_history (search_index_api_name_or_id => 'Articles_Search', limit => 20);
    options:
      - {name: search_index_api_name_or_id, api_name: id, in: path, type: string, required: true, description: "ID or API Name of the search index"}
      - {name: limit, in: query, type: integer, description: "Maximum number of records to return (default 50)"}
      - {name: offset, in: query, type: integer, description: "1-based offset for pagination (default 1). Must be >= 1."}
    effect: read
    unknown: warning
    evidence: S
    result_description: The public sources don't document this response. One row, with the response in `_raw`.
    notes: |
      **Paging:** `limit` and 1-based `offset`. The response isn't documented, so a script passes `offset` itself. Salesforce's tool says pagination "is currently unreliable" and fetches only the first page.

      **Notes:** [Salesforce's tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/SearchIndexTools.java) says the response is a list of process history records "with status, timestamps, and details", but no source names the fields. There is no spec entry, and [one community plugin](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/docs/API_COVERAGE.md) leaves this call out as unverified.

