    attributes:
      - {name: name, type: string, description: "Name of the tokenization, such as `TYPEAHEAD` or `STANDARD`. Since v64.0."}

  TransformConfigInputRepresentation:
    description: Represents the input for transforming an unstructured configuration.
    attributes:
      - {name: file_level_configuration, api_name: fileLevelConfiguration, schema: TransformFileLevelConfigurationInputRepresentation, array: 1, description: "File-level configurations used in the transform. Since v61.0."}
      - {name: transform_type, api_name: transformType, type: string, description: "Type of the transformation. Only transcribe is currently supported. Since v61.0."}

  TransformFileLevelConfigurationInputRepresentation:
    description: Represents the input for a file transform configuration.
    attributes:
      - {name: config, schema: ConfigInputRepresentation, description: "Transform configuration. Since v61.0."}
      - {name: file_extensions, api_name: fileExtensions, array: 1, type: string, description: "File extensions list, for example, `<mp4, mp3>`. Since v61.0."}

  UserValueInputRepresentation:
    description: Represents the input for a user value.
    attributes:
      - {name: id, type: string, description: "ID, such as `strip_html` or `max_tokens`. Since v60.0."}
      - {name: value, type: string, description: "Value, such as `false`, `100`, or `COSINE`. Since v60.0."}

  VectorEmbeddingConfigInputRepresentation:
    description: Represents the input for a vector-embedding configuration.
    attributes:
      - {name: embedding_model, api_name: embeddingModel, schema: ConfigInputRepresentation, description: "Deployed ML model that creates embeddings, for example, `e5-large`. Since v60.0."}
      - {name: index, schema: ConfigInputRepresentation, description: "Type used in vector indexing, such as `HNSW` or `FLAT`. Since v60.0."}
      - {name: similarity_metric, api_name: similarityMetric, type: string, description: "Similarity metric used to calculate distance between vectors, for example, `COSINE`. Since v60.0."}
      - {name: version, type: string, description: "Version of the record. Since v60.0."}

  VectorEmbeddingInputRepresentation:
    description: Represents the input for vector embedding.
    attributes:
      - {name: id, type: string, description: "ID of the asset. Since v58.0."}
      - {name: name, type: string, description: "Name of the asset. Since v58.0."}
      - {name: namespace, type: string, description: "Namespace of the asset. Since v58.0."}
      - {name: einstein_studio_model_id, api_name: einsteinStudioModelId, type: string, description: "Einstein Studio AI model ID. Since v60.0."}
      - {name: vector_embedding_related_fields, api_name: vectorEmbeddingRelatedFields, schema: VectorEmbeddingRelatedFieldsInputRepresentation, array: 1, description: "Extra fields for vector embedding, which NoCode retrievers filter on. Salesforce allows an empty list, and one community tool reports a server error on it. Since v60.0."}

  VectorEmbeddingRelatedFieldsInputRepresentation:
    description: Represents the input for vector-embedding extra fields.
    attributes:
      - {name: id, type: string, description: "ID of the asset. Since v58.0."}
      - {name: name, type: string, description: "Name of the asset. Since v58.0."}
      - {name: namespace, type: string, description: "Namespace of the asset. Since v58.0."}
      - {name: related_dmo_developer_name, api_name: relatedDmoDeveloperName, type: string, description: "Related data model object (DMO) developer name. Since v60.0."}
      - {name: related_dmo_field_developer_name, api_name: relatedDmoFieldDeveloperName, type: string, description: "Related DMO field developer name. Since v60.0."}
      - {name: related_dmo_field_name, api_name: relatedDmoFieldName, type: string, description: "Related DMO field name. Reported to return a 500 on input (community). Since v61.0."}
      - {name: related_dmo_name, api_name: relatedDmoName, type: string, description: "Related DMO name. Reported to return a 500 on input (community). Since v61.0."}
      - {name: relationship_cardinality, api_name: relationshipCardinality, type: string, description: "Relationship cardinality between the source DMO field and target DMO field. For example, `OneToOne`, `ManyToOne`, or `OneToMany`. Since v64.0."}
      - {name: relationships, schema: SourceTargetRelationshipInputRepresentation, array: 1, description: "Field relationship paths. Since v60.0."}
