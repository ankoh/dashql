    reference_url: https://developer.salesforce.com/docs/data/data-cloud-int/references/data-cloud-ingestionapi-ref/c360-a-api-delete-a-job.md
    description: Deletes a closed job, along with its stored job data and metadata. The job then no longer appears in the get or list calls.
    example: CALL cdp.ingest_job_delete (id => '913a8b00-7a9e-4331-aaf6-a019ae5021ab');
    options:
      - {name: id, in: path, type: string, required: true, description: "Job id from [`ingest_job_create`](#ingest_job_create)."}
    effect: write
    unknown: warning
    evidence: D
    result_description: No response body (HTTP 204). One row with only the standard columns.
    notes: "**Notes:** [The job must be in `UploadComplete`, `JobComplete`, `Aborted` or `Failed`](https://developer.salesforce.com/docs/data/data-cloud-int/references/data-cloud-ingestionapi-ref/c360-a-api-delete-a-job.md). The list leaves out `Open` and `InProgress`, so abort an open job first. The page doesn't say what happens to processing when an `UploadComplete` job is deleted, or say anything about records already loaded."
