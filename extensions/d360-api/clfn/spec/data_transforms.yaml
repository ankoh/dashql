  - name: transform_run
    method: POST
    host: connect
    path: /ssot/data-transforms/{dataTransformNameOrId}/actions/run
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Transforms/paths/~1ssot~1data-transforms~1%7BdataTransformNameOrId%7D~1actions~1run/post
    tools: [d360_transform_run]
    description: Run a data transform. Since v60.0.
    example: CALL cdp.transform_run (data_transform_name_or_id => 'account_summary');
    options:
      - {name: data_transform_name_or_id, api_name: dataTransformNameOrId, in: path, type: string, required: true, description: "Name or ID of the data transform to run."}
      - {name: definition_name, api_name: definitionName, in: body, type: string, description: "Not in the spec schema (MCP server)."}
      - {name: should_force_full_run, api_name: shouldForceFullRun, in: body, type: boolean, description: "Not in the spec schema (MCP server)."}
    columns:
      - {name: errors, type: JSON, array: 1, schema: CdpErrorRepresentation, description: "List of errors that resulted from the action. Since v57.0."}
      - {name: success, type: BOOLEAN, description: "Indicates whether the action was initiated successfully (`true`) or not (`false`). Since v57.0."}
      - {name: request_id, api_name: requestId, type: VARCHAR, description: "Request ID assigned to this data transform run request for tracking. Since v67.0."}
      - {name: should_force_full_run, api_name: shouldForceFullRun, type: BOOLEAN, description: "Indicates whether to force the transform to run in full mode (`true`) or not (`false`). Since v60.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `CdpDataTransformActionResponseRepresentation`.
    notes: |
      **Done when:** `transform_get.last_run_status` leaves `Pending` and `InProgress`. Then `transform_run_history_list` has the job. Since v67, `request_id` here and `histories[].requestId` both identify the run, though no source says they match.

      **Notes:** Batch only. The spec lists these 400s: "Unable to run streaming transform", "Unable to run inactive transform" and "Definition name is required for multi-definition transforms". So wait for `status` = `Active`.

      **Missing options.** The spec declares no body, yet that last 400 needs a definition name. The [MCP request class](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/model/request/datatransform/DataTransformRunRequest.java) sends `definition_name` and `should_force_full_run` in the body, and [sf-pi](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/data-shapes.md) sees `should_force_full_run` in the response. Neither is an option here yet.

      **Full or incremental.** [Help](https://help.salesforce.com/apex/HTViewHelpDoc?id=data.c360_a_batch_transform_run_types.htm) says the run type is chosen automatically and can't be configured, which `should_force_full_run` seems to contradict. It says manual runs, joins, aggregations and multi-row formulas force a full run, and an unchanged run is skipped (`SkippedNoChanges`). [Help](https://help.salesforce.com/s/articleView?id=sf.c360_a_batch_transform_data_drift.htm&language=en_US&type=5) adds that incremental runs can drift, so a full run happens every 24 hours. In the UI, [the `Replace` write mode attempts incremental runs and `Upsert` loads all input every run](https://help.salesforce.com/s/articleView?id=sf.c360_a_batch_transform_create.htm&language=en_US&type=5).

      **Cost and retries.**

      - Runs [consume Data Services credits](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/messages/data360.transform.run.md) (community).
      - That CLI [checks status before retrying](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/src/commands/data360/transform/run.ts) after a timeout, since the outcome is unknown (community).
      - Concurrent batch runs are [50 on one limits page](https://help.salesforce.com/s/articleView?language=en_US&id=sf.c360_a_limits_and_guidelines.htm) and [5 on another](https://help.salesforce.com/s/articleView?language=en_US&id=sf.c360_a_limits_and_guidelines_cdp.htm&type=5).

  - name: transform_update
    method: PUT
    host: connect
    path: /ssot/data-transforms/{dataTransformNameOrId}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Transforms/paths/~1ssot~1data-transforms~1%7BdataTransformNameOrId%7D/put
    tools: [d360_transform_update]
    description: Update a data transform. Since v60.0.
    example: |
      CALL cdp.transform_update (
        data_transform_name_or_id => 'account_summary',
        name => 'account_summary',
        label => 'Account Summary',
        type => 'BATCH',
        definition => (
          type = 'DCSQL',
          version = '1.0',
          manifest = (nodes = (
            account_summary_output = (
              name = 'account_summary_output',
              relation_name = 'Account_Summary__dll',
              config = (materialized = 'table', writeMode = 'OVERWRITE'),
              compiled_code = $$SELECT "Id__c", "Name__c" FROM "Account__dlm" WHERE "AnnualRevenue__c" > 1000000$$
            )
          )),
          output_data_objects = [(
            name = 'Account_Summary__dll',
            label = 'Account Summary',
            category = 'Profile',
            type = 'dataLakeObject',
            fields = [
              (name = 'Id__c', label = 'Account ID', type = 'Text', is_primary_key = true),
              (name = 'Name__c', label = 'Account Name', type = 'Text', is_primary_key = false)
            ]
          )]
        )
      );
    options:
      - {name: data_transform_name_or_id, api_name: dataTransformNameOrId, in: path, type: string, required: true, description: "Name or ID of the data transform to update."}
      - {name: filter_group, api_name: filterGroup, in: query, type: string, description: "Group on which to filter response results. Valid values are `Big`, `Medium`, and `Small`. - `Big` provides comprehensive results by returning properties whose filter group is `Big`, `Medium`, or `Small`. - `Medium` provides moderate results by returning properties whose filter group is `Medium` or `Small`. - `Small` provides essential results by returning only properties whose filter group is `Small`. The default is `Big`. Since v60.0."}
      - {name: currency_iso_code, api_name: currencyIsoCode, in: body, type: string, description: "Currency ISO code of the data transform. Since v62.0."}
      - {name: dataspace_name, api_name: dataSpaceName, in: body, type: string, description: "Data space that the data transform belongs to. Required for DMO-based data transforms. Since v60.0."}
      - {name: definition, in: body, schema: transform_create.definition, required: true, description: "Single definition. Its shape depends on the definition type: [DCSQL](#dcsqldatatransformdefinitioninputrepresentation), [SQL](#sqldatatransformdefinitioninputrepresentation) or [STL](#stldatatransformdefinitioninputrepresentation). The spec marks it required, yet its multi-definition examples send `definitions` without it. Since v60.0."}
      - {name: definitions, in: body, schema: DataTransformDefinitionInputRepresentation, array: 1, description: "List of definitions for batch transforms. Since v63.0."}
      - {name: description, in: body, type: string, description: "Description of the data transform. Since v60.0."}
      - {name: full_run_frequency, api_name: fullRunFrequency, in: body, type: string, enum: [Daily, Monthly, Weekly], description: "Full run frequency of the data transform. Since v60.0."}
      - {name: label, in: body, type: string, required: true, description: "Label of the data transform. Since v60.0."}
      - {name: name, in: body, type: string, required: true, description: "Name of the data transform. Since v60.0."}
      - {name: primary_source, api_name: primarySource, in: body, type: string, description: "In cases where the transformation contains table joins, describes the primary source. Since v60.0."}
      - {name: type, in: body, type: string, enum: [BATCH, STREAMING], required: true, description: "Type of data transform. Since v60.0."}
      - {name: creation_type, api_name: creationType, in: body, type: string, description: "Not in the spec schema: from the MCP server's request class."}
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: action_urls, api_name: actionUrls, type: JSON, schema: BatchActionRepresentation, description: "Actions available for the data transform. Since v60.0."}
      - {name: creation_type, api_name: creationType, type: VARCHAR, description: "Creation type of the data transform. Since v60.0."}
      - {name: dataspace_name, api_name: dataSpaceName, type: VARCHAR, description: "Data space for the data transform. Since v60.0."}
      - {name: definition, type: JSON, description: "Base definition for the data transform. The endpoint returns the definition output object that corresponds to the type of data transform. For example, the Stl Data Transform Definition Output is returned for the `Stl` and `StlHidden` types. Since v60.0."}
      - {name: definitions, type: JSON, array: 1, schema: DataTransformDefinitionRepresentation, description: "List of definitions for batch data transforms. Since v63.0."}
      - {name: description, type: VARCHAR, description: "Description of the data transform. Since v60.0."}
      - {name: full_run_frequency, api_name: fullRunFrequency, type: VARCHAR, description: "Full run frequency of the data transform. Since v63.0."}
      - {name: last_run_date, api_name: lastRunDate, type: VARCHAR, description: "Last date the data transform was run. Since v60.0."}
      - {name: last_run_error_code, api_name: lastRunErrorCode, type: JSON, schema: CdpErrorRepresentation, description: "Error code of the last run. Since v60.0."}
      - {name: last_run_status, api_name: lastRunStatus, type: VARCHAR, description: "Status of the last run. Since v60.0."}
      - {name: schedule, type: JSON, schema: ScheduleRepresentation, description: "The schedule for the data transform. Since v60.0."}
      - {name: status, type: VARCHAR, description: "The status of the data transform. Since v60.0."}
      - {name: type, type: VARCHAR, description: "Type of data transform. Since v60.0."}
      - {name: version, type: BIGINT, description: "Version of the data transform. Since v60.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `DataTransformRepresentation`.
    notes: |
      **Notes:** **Send the whole transform.** The spec shares its input schema with create, so `definition`, `label`, `name` and `type` are required on this `PUT`. The [MCP request class](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/model/request/datatransform/DataTransformUpdateRequest.java) says the opposite: all fields optional "to support partial updates", and it mentions `PATCH`, though the tool sends `PUT`. Neither has been tested here, so read with `transform_get` and resend everything. What a `PUT` does to omitted optional fields isn't documented.

      **Multi-definition rules.** The spec's 400s: "Streaming data transform cannot have multiple definitions", "Batch data transform definition limit exceeded" ([5 in Help](https://help.salesforce.com/s/articleView?id=sf.c360_a_batch_transform_limitations.htm&language=en_US&type=5)) and "Multi-definition transform cannot be moved to single definition".

      **Can a streaming transform change?** Sources disagree. [Help](https://help.salesforce.com/s/articleView?id=data.c360_a_streaming_transform_considerations.htm&language=en_US&type=5) says you can't change one after saving, and to delete and recreate it. A [release note](https://help.salesforce.com/s/articleView?id=release-notes.rn_c360_truth.htm&language=en_US&release=250&type=5) says the name and SQL expression can change, effective on incoming data at save, with a [rebuild](#transform_rebuild) for existing data.

      **Spec example.** It uses `key_qualifier_field`, while the schema has `key_qualifier_field_name`. Follow the schema. It also shows `schedule` with `interval` and `days_of_week` inside a definition, which the [schedule schema](segments.md#cdphourlyscheduleinputrepresentation) covers.

  - name: transform_schedule_set
    method: PUT
    host: connect
    path: /ssot/data-transforms/{dataTransformNameOrId}/schedule
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Transforms/paths/~1ssot~1data-transforms~1%7BdataTransformNameOrId%7D~1schedule/put
    tools: [d360_transform_schedule_set]
    description: Update a data transform's schedule. Since v60.0.
    example: CALL cdp.transform_schedule_set (data_transform_name_or_id => 'account_summary', frequency => 'Daily', time => (hour = 2, minute = 0, time_zone = 'America/Los_Angeles'));
    options:
      - {name: data_transform_name_or_id, api_name: dataTransformNameOrId, in: path, type: string, required: true, description: "Name or ID of the data transform."}
      - {name: definition_name, api_name: definitionName, in: body, type: string, description: "Name of the schedule definition. Since v63.0."}
      - {name: frequency, in: body, type: string, enum: [Daily, Hourly, "None"], required: true, description: "Frequency on which the schedule is run. `None` removes the schedule and is the default. Since v58.0."}
      - {name: should_force_specified_minutes, api_name: shouldForceSpecifiedMinutes, in: body, type: boolean, description: "Only applicable to data transforms. If `true`, the consumer's schedule is used. If `false`, the transform is distributed over an hour to avoid hourly hotspots. Set to `true` only when the schedule is critical. If unspecified, the default value is `false`. Since v64.0."}
      - {name: time, in: body, schema: CdpTimeInputRepresentation, required: true, description: "When to run the schedule. Since v58.0."}
      - {name: interval, in: body, type: string, description: "Not in the spec schema: sf-pi records it as required by the platform."}
      - {name: days_of_week, api_name: daysOfWeek, in: body, array: 1, description: "Not in the spec schema (sf-pi)."}
      - {name: day_of_week, api_name: dayOfWeek, in: body, type: string, description: "Not in the spec schema: from the MCP server's request class."}
      - {name: week_of_month, api_name: weekOfMonth, in: body, type: string, description: "Not in the spec schema: from the MCP server's request class."}
      - {name: days_of_month, api_name: daysOfMonth, in: body, array: 1, description: "Not in the spec schema: from the MCP server's request class."}
    columns:
      - {name: frequency, type: VARCHAR}
      - {name: next_scheduled_date, api_name: nextScheduledDate, type: VARCHAR}
      - {name: time_info, api_name: timeInfo, type: JSON, schema: TimeOutputRepresentation}
      - {name: days_of_week, api_name: daysOfWeek, type: JSON}
      - {name: interval, type: BIGINT}
      - {name: run_from, api_name: runFrom, type: JSON, schema: TimeOutputRepresentation}
      - {name: run_to, api_name: runTo, type: JSON, schema: TimeOutputRepresentation}
      - {name: type, type: VARCHAR, description: "Type of schedule frequency. The endpoint returns the schedule output object that corresponds to the type of schedule frequency. Only `Daily`, `Hourly`, or `None` are supported for data transforms. For example, the Daily Schedule Output is returned for the `Daily` publish frequency. Since v58.0."}
      - {name: time, type: JSON, schema: CdpTimeRepresentation}
    effect: write
    evidence: O
    result_description: One row. Schema `CdpScheduleBaseRepresentation`.
    notes: |
      **Notes:** **`interval` is missing from the table.** [sf-pi](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/data-shapes.md) says the platform requires it, from 1 to 31, although the spec lists only `frequency` and `time`. So this example may be rejected until the option exists. The spec has `interval` and `days_of_week` on the [hourly input](segments.md#cdphourlyscheduleinputrepresentation), and its example uses `Hourly`, `interval` = 8 and `days_of_week` = `Wednesday`, `Thursday`, `Friday`. sf-pi's daily example sends `interval` = 1.

      **Frequencies disagree.** The spec's response text says only `Daily`, `Hourly` and `None` apply to transforms. The [MCP request class](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/model/request/datatransform/DataTransformScheduleRequest.java) also lists `Monthly`, `MonthlyRelative` and `Weekly`, and spells days `MONDAY` where the spec has `Monday`.

      **Other rules:**

      - `frequency` = `None` [clears the schedule](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/data-shapes.md). The spec still marks `time` required, so send it.
      - `time.minute` isn't exact by default: with `should_force_specified_minutes` = `false`, the run is spread over the hour. The [MCP class](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/model/request/datatransform/DataTransformScheduleRequest.java) calls that field hidden from REST and leaves it out, while the spec documents it since v64.
      - `time_zone` is camelCase. [`time_zone` is rejected](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/data-shapes.md) with `JSON_PARSER_ERROR`.
      - Multi-definition transforms: set `definition_name`.
      - [A run due while the previous one is still going is skipped](https://help.salesforce.com/s/articleView?id=sf.c360_a_batch_transform_schedule.htm&language=en_US&type=5). Runs never overlap.
      - This is a batch feature. Streaming transforms [run continually](https://trailhead.salesforce.com/content/learn/modules/batch-data-transforms-in-data-cloud-quick-look/get-started-with-batch-data-transforms-in-data-360).

schemas:
  AggregateInputRepresentation:
    description: Represents the input for an aggregation.
    attributes:
      - {name: action, type: string, enum: [Avg, Count, Maximum, Median, Minimum, StdDev, StdDevP, Sum, Unique, Var, VarP], required: true, description: "Action to execute on the aggregation. Since v60.0."}
      - {name: label, type: string, required: true, description: "Label of field that is created after the aggregation. Since v60.0."}
      - {name: name, type: string, required: true, description: "Name of the field that is created after the aggregation. Since v60.0."}
      - {name: source, type: string, required: true, description: "Name of the field that is the source of the aggregation. Since v60.0."}

  AggregateParametersInputRepresentation:
    description: Represents the aggregate node parameters input.
    attributes:
      - {name: aggregations, schema: AggregateInputRepresentation, array: 1, required: true, description: "Aggregations. Since v60.0."}
      - {name: groupings, array: 1, type: string, required: true, description: "Groupings. Since v60.0."}
      - {name: node_type, api_name: nodeType, type: string, enum: [Hierarchical, Standard], required: true, description: "Determines which fields are required. Hierarchical requires: `parent_field` and `self_field`. `percentage_field` is optional. Standard requires `aggregations`. Since v60.0."}
      - {name: parent_field, api_name: parentField, type: string, required: true, description: "Defines the parent field in the hierarchical aggregate mode. Since v60.0."}
      - {name: percentage_field, api_name: percentageField, type: string, required: true, description: "Percentage field. Since v60.0."}
      - {name: pivot_v2, schema: PivotV2InputRepresentation, required: true, description: "Pivot v2. Since v60.0."}
      - {name: self_field, api_name: selfField, type: string, required: true, description: "Defines the self field in the hierarchical aggregate mode. Since v60.0."}

  CdpScheduleInputRepresentation:
    description: Base schedule input representation.
    attributes:
      - {name: definition_name, api_name: definitionName, type: string, description: "Name of the schedule definition. Since v63.0."}
      - {name: frequency, type: string, enum: [Daily, Hourly, "None"], required: true, description: "Frequency on which the schedule is run. `None` removes the schedule and is the default. Since v58.0."}
      - {name: should_force_specified_minutes, api_name: shouldForceSpecifiedMinutes, type: boolean, description: "Only applicable to data transforms. If `true`, the consumer's schedule is used. If `false`, the transform is distributed over an hour to avoid hourly hotspots. Set to `true` only when the schedule is critical. If unspecified, the default value is `false`. Since v64.0."}
      - {name: time, schema: CdpTimeInputRepresentation, required: true, description: "When to run the schedule. Since v58.0."}
      - {name: days_of_week, api_name: daysOfWeek, array: 1, description: "Not in the spec schema: from the spec's examples."}
      - {name: interval, type: integer, description: "Not in the spec schema: from the spec's examples."}

  CdpTimeInputRepresentation:
    description: Time input source for when to run the schedule.
    attributes:
      - {name: hour, type: integer, required: true, description: "Hour when the schedule should run, [0 to 23](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/model/request/datatransform/DataTransformTimeInput.java). Since v60.0."}
      - {name: minute, type: integer, required: true, description: "Minute in the hour when the schedule should run, [0 to 59](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/model/request/datatransform/DataTransformTimeInput.java). Exact only with `should_force_specified_minutes`. Since v60.0."}
      - {name: time_zone, api_name: timeZone, type: string, required: true, description: "Time zone of the schedule, such as `America/Los_Angeles`. Since v60.0."}

  DataObjectInputRepresentation:
    description: Input representation for a data object in Data 360.
    attributes:
      - {name: dataspace_name, api_name: dataSpaceName, type: string, description: "Name of the data space. If unspecified, the `default` data space is used. This property is required for data graph resources. Since v59.0."}
      - {name: description, type: string, description: "Description of the object to create. Since v59.0."}
      - {name: label, type: string, description: "Label of the object to create. This property is required for data graph resources. Since v59.0."}
      - {name: name, type: string, description: "API name of the object to create. This property is required for data graph resources. Since v59.0."}
      - {name: category, type: string, enum: [Engagement, Other, Profile], description: "Category of the data object. Since v60.0."}
      - {name: event_date_time_field_name, api_name: eventDateTimeFieldName, type: string, description: "Name of the event date and time field. This property is required when the value of the category property is `Engagement`. Since v60.0."}
      - {name: fields, schema: DataObjectFieldInputRepresentation, array: 1, description: "Fields in the data object. Since v60.0."}
      - {name: record_modified_field_name, api_name: recordModifiedFieldName, type: string, description: "Record modified field name. Since v60.0."}
      - {name: type, type: string, enum: [DataLakeObject, DataModelObject], description: "Type of data object. Since v60.0."}

  DataTransformDefinitionInputRepresentation:
    attributes:
