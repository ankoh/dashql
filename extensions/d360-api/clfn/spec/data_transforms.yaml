    description: Represents slice definition.
    attributes:
      - {name: fields, array: 1, type: string, required: true, description: "List of fields for `Select` or `Drop`. Since v60.0."}
      - {name: ignore_missing_fields, api_name: ignoreMissingFields, type: boolean, required: true, description: "Indicates whether to ignore missing fields (`true`) or not (`false`). Since v60.0."}
      - {name: mode, type: string, enum: [Drop, Select], required: true, description: "Slice mode. Since v60.0."}

  SchemaTypePropertiesCastInputRepresentation:
    description: Represents casting for types.
    attributes:
      - {name: format, type: string, required: true, description: "DateTime format. Since v60.0."}
      - {name: length, type: integer, required: true, description: "Total length of text. Since v60.0."}
      - {name: precision, type: integer, required: true, description: "Length of arbitrary precision value. Since v60.0."}
      - {name: scale, type: integer, required: true, description: "Number of digits to right of decimal point. Since v60.0."}
      - {name: symbols, schema: SchemaFormatSymbolsInputRepresentation, required: true, description: "Number format. Since v60.0."}
      - {name: type, type: string, enum: [Boolean, DateOnly, DateTime, Number, Text], required: true, description: "DataType to Convert to"}

