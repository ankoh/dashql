  DataTransformNodeInputRepresentation:
    description: Represents a single node in a series of nodes that make up a batch data transform.
    attributes:
      - {name: parameters, schema: AggregateParametersInputRepresentation, description: "-"}
      - {name: action, type: string, enum: [Aggregate, Append_V2, Bucket, ComputeRelative, DateFormatConversion, Extension, Extract, Filter, Formula, Join, Load, OutputD360, Recommendation, Save, Schema, Split, SqlFilter, TypeCast, Update], required: true, description: "Action that determines the type of node. Use the node input object that corresponds to the type of action. For example, use the Aggregate Node Input for the `Aggregate` action. Since v60.0."}
      - {name: schema, schema: SchemaParametersInputRepresentation, description: "Schema changes for the node. Since v60.0."}
      - {name: sources, array: 1, type: string, required: true, description: "Source node IDs. Since v60.0."}

  DcSqlDataTransformDefinitionInputRepresentation:
    description: Represents the input definition for Dc Sql data transforms.
    attributes:
      - {name: label, type: string, description: "Label of the transform definition. Since v63.0."}
      - {name: name, type: string, description: "Name of the transform definition. Since v63.0."}
      - {name: output_data_objects, api_name: outputDataObjects, schema: DataObjectInputRepresentation, array: 1, description: "Information about the objects into which the data transform writes the transformed data. Since v60.0."}
      - {name: schedule, schema: CdpScheduleInputRepresentation, description: "Schedule for running the transform. Applies to transforms that use the definitions array structure (which can contain one or more definitions). Does not apply to legacy transforms with a single definition field. Since v67.0."}
      - {name: type, type: string, enum: [DbtHidden, DcSql, Sql, SqlHidden, Stl, StlHidden], required: true, description: "Type of definition. Definition type. `DCSQL` in the MCP examples, `DcSql` in the spec enum. Since v60.0."}
      - {name: version, type: string, required: true, description: "Version of the transform. `1.0` in the MCP examples. Since v60.0."}
      - {name: manifest, schema: DcSqlDataTransformManifestInputRepresentation, description: "Manifest of the DC SQL data transform. Since v63.0."}

  DcSqlDataTransformDependsOn:
    attributes:
      - {name: nodes, array: 1, type: string, description: "Names of the nodes this node depends on."}

  DcSqlDataTransformManifestInputRepresentation:
    description: Input representation of the DCSQL transform manifest format
    attributes:
      - {name: macros, map: true, type: object, description: "Manifest macros. Since v63.0."}
      - {name: nodes, map: true, type: object, description: "SQL nodes, keyed by node name. The spec types input nodes as plain objects, so the node attributes come from its output form. Since v63.0. Each is a [DcSqlDataTransformNode](#dcsqldatatransformnode)."}
      - {name: sources, map: true, type: object, description: "Manifest sources. Each has `relation_name`, the table read, in the output form. Since v63.0."}

  DcSqlDataTransformNode:
    attributes:
      - {name: name, type: string, description: "Node name. Other nodes refer to it in `depends_on` and in `FROM`."}
      - {name: compiled_code, type: string, description: "The node's SQL."}
      - {name: relation_name, type: string, description: "Table this node writes to. Set on output nodes in the MCP examples."}
      - {name: config, schema: DcSqlDataTransformNodeConfiguration, description: "Materialization and write mode."}
      - {name: depends_on, schema: DcSqlDataTransformDependsOn, description: "Nodes this node reads."}
      - {name: resource_type, type: string, enum: [macro, model, source], description: "Type of node resource. Not used in the MCP examples."}

  DcSqlDataTransformNodeConfiguration:
    attributes:
      - {name: materialized, type: string, enum: [ephemeral, table], description: "`ephemeral` for intermediate nodes and `table` for outputs in the MCP examples."}
      - {name: write_mode, api_name: writeMode, type: string, enum: [Append, DeleteOnly, Merge, MergeUpsertDelete, Overwrite], description: "Write mode for the node. The examples send `OVERWRITE`."}

  PivotV2InputRepresentation:
