visualize-snapshots:
  - name: table_default_dashboard
    script:
      input: |
        SELECT product, revenue FROM product_summary VISUALIZE USING table ();

  - name: table_dashboard
    script:
      input: |
        SELECT product, revenue FROM product_summary VISUALIZE USING table (
          dashboard => (row => 2, column => 4, width => 6, height => 5)
        );
    dashboard:
      row: 2
      column: 4
      width: 6
      height: 5
