visualize-snapshots:
  # The spec of the tag is passed through, the statement is its data
  - name: vis_encoding
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp);
    script:
      input: |
        /* @vis vegalite
           {
             "mark": {"type": "line", "point": true},
             "encoding": {
               "x": {"field": "date", "type": "temporal", "timeUnit": "month"},
               "y": {"field": "revenue", "type": "quantitative", "aggregate": "sum"},
               "color": {"field": "category", "type": "nominal"}
             }
           }
        */
        SELECT category, revenue, date FROM sales WHERE revenue > 0;

  # Every Vega-Lite property is kept, also those DashQL does not know
  - name: vis_layers_and_transforms
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp);
    script:
      input: |
        /* @vis vegalite
           {
             "title": "Revenue",
             "transform": [{"calculate": "datum.revenue * 2", "as": "double"}],
             "layer": [
               {"mark": "bar", "encoding": {"x": {"field": "category"}, "y": {"field": "double"}}},
               {"mark": {"type": "rule", "color": "red"}, "encoding": {"y": {"aggregate": "mean", "field": "double"}}}
             ],
             "resolve": {"scale": {"y": "independent"}},
             "config": {"view": {"stroke": null}}
           }
        */
        SELECT category, revenue FROM sales;

  # The data of the tag is replaced by the statement
  - name: vis_data_replaced
    script:
      input: |
        /* @vis vegalite {"data": {"values": [{"a": 1}]}, "mark": "point"} */
        SELECT 1 AS a;

  # The card places the chart
  - name: vis_card
    script:
      input: |
        /* @vis vegalite {"mark": "bar"}
           @vis card row=1 width=12 height=4 */
        SELECT 1 AS a;
    dashboard:
      row: 1
      width: 12
      height: 4
