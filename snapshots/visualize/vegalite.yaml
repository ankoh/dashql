visualize-snapshots:

  - name: vis_encoding
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp);
        catalog-id: 1
        tables:
          - catalog-id: "256.65536.4294967296"
            name: sales
            text: "create tab..timestamp)"
            columns:
              - catalog-id: "256.65536.4294967296.0"
                name: category
                text: "category text"
              - catalog-id: "256.65536.4294967296.1"
                name: date
                text: "date timestamp"
              - catalog-id: "256.65536.4294967296.2"
                name: revenue
                text: "revenue int"
        errors: []
    script:
      input: |
        /* @vis vegalite
           {
             "mark": {"type": "line", "point": true},
             "encoding": {
               "x": {"field": "date", "type": "temporal", "timeUnit": "month"},
               "y": {"field": "revenue", "type": "quantitative", "aggregate": "sum"},
               "color": {"field": "category", "type": "nominal"}
             }
           }
        */
        SELECT category, revenue, date FROM sales WHERE revenue > 0;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT category, revenue, date FROM sales WHERE revenue > 0"
        },
        "mark": {
          "type": "line",
          "point": true
        },
        "encoding": {
          "x": {
            "field": "date",
            "type": "temporal",
            "timeUnit": "month"
          },
          "y": {
            "field": "revenue",
            "type": "quantitative",
            "aggregate": "sum"
          },
          "color": {
            "field": "category",
            "type": "nominal"
          }
        }
      }

  - name: vis_layers_and_transforms
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp);
        catalog-id: 1
        tables:
          - catalog-id: "256.65536.4294967296"
            name: sales
            text: "create tab..timestamp)"
            columns:
              - catalog-id: "256.65536.4294967296.0"
                name: category
                text: "category text"
              - catalog-id: "256.65536.4294967296.1"
                name: date
                text: "date timestamp"
              - catalog-id: "256.65536.4294967296.2"
                name: revenue
                text: "revenue int"
        errors: []
    script:
      input: |
        /* @vis vegalite
           {
             "title": "Revenue",
             "transform": [{"calculate": "datum.revenue * 2", "as": "double"}],
             "layer": [
               {"mark": "bar", "encoding": {"x": {"field": "category"}, "y": {"field": "double"}}},
               {"mark": {"type": "rule", "color": "red"}, "encoding": {"y": {"aggregate": "mean", "field": "double"}}}
             ],
             "resolve": {"scale": {"y": "independent"}},
             "config": {"view": {"stroke": null}}
           }
        */
        SELECT category, revenue FROM sales;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT category, revenue FROM sales"
        },
        "title": "Revenue",
        "transform": [
          {
            "calculate": "datum.revenue * 2",
            "as": "double"
          }
        ],
        "layer": [
          {
            "mark": "bar",
            "encoding": {
              "x": {
                "field": "category"
              },
              "y": {
                "field": "double"
              }
            }
          },
          {
            "mark": {
              "type": "rule",
              "color": "red"
            },
            "encoding": {
              "y": {
                "aggregate": "mean",
                "field": "double"
              }
            }
          }
        ],
        "resolve": {
          "scale": {
            "y": "independent"
          }
        },
        "config": {
          "view": {
            "stroke": null
          }
        }
      }

  - name: vis_data_replaced
    script:
      input: |
        /* @vis vegalite {"data": {"values": [{"a": 1}]}, "mark": "point"} */
        SELECT 1 AS a;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT 1 AS a"
        },
        "mark": "point"
      }

  - name: vis_card
    script:
      input: |
        /* @vis vegalite {"mark": "bar"}
           @vis card row=1 width=12 height=4 */
        SELECT 1 AS a;
    dashboard:
      row: 1
      width: 12
      height: 4
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT 1 AS a"
        },
        "mark": "bar"
      }
