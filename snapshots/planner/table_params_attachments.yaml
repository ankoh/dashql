        - catalog-id: 'local/256.65536.4294967296'
          type: TABLE
          name: sales
      unresolved-references: []
      nodes:
        - id: 0
          script: bar
          connection: local
          statement-id: 0
          type: SELECT
          sql: |-
            with sales_2 as (select * from external('/mnt/external/attachments/test/sales.parquet', format => 'parquet'))
