  - name: RemoteReadsAttachment
    connections:
      - name: trino
        kind: REMOTE
    attachments:
      - file: sales.parquet
        stamp: 1
    scripts:
      - name: bar
        connection: trino
        input: |
          select * from :sales;
    expected:
