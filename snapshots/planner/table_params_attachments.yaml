          cacheable: true
          terminal-statement-id: 0
          signature: "1eb30f7c26bd60a8b4d4c790560f2a31"
        - name: bar
          connection: local
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "82df8d1f834302fe349f1efab32d41d7"
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      attachments:
        - name: sales
          path: /mnt/external/attachments/test/sales.parquet
      diagnostics:
        - script: bar
          text: ":sales"
          error: true
          message: 'the table parameter :sales matches sales.sql and sales.parquet'
      checked-references:
        - script: bar
          references:
            - text: ":sales"
              kind: invalid
              errors:
                - 'the table parameter :sales matches sales.sql and sales.parquet'
      collisions:
        - name: sales
          members: [sales.sql,sales.parquet]

