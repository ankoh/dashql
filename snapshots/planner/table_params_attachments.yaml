planner-snapshots:

  - name: LocalReadsAttachment
    connections:
      - name: local
        kind: LOCAL
    attachments:
      - file: sales.parquet
        stamp: 1
        query: select 'eu' as region, 10 as amount union all select 'us', 20
    scripts:
      - name: bar
        connection: local
        input: |
          select region, sum(amount) from :sales group by region;
    expected:
      valid: true
      connections:
        - name: local
          kind: LOCAL
      scripts:
        - name: bar
          connection: local
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "98580409e7b3a9b0f4647fa6e27b8a9d\nattachment sales.parquet=1"
      entities: []
      unresolved-references: []
      nodes:
        - id: 0
          script: bar
          connection: local
          statement-id: 0
          type: SELECT
          sql: |-
            with sales as (select * from external('/mnt/external/attachments/test/sales.parquet', format => 'parquet'))
            select region, sum(amount) from sales group by region
          produces-output: true
          barrier: false
          script-result: true
          attachments: [sales.parquet]
          accesses: []
      edges: []
      attachments:
        - name: sales
          path: /mnt/external/attachments/test/sales.parquet
      references:
        - node: 0
          script: bar
          text: ":sales"
          attachment: sales.parquet
          cte: sales
      diagnostics: []
      checked-references:
        - script: bar
          references:
            - text: ":sales"
              attachment: sales.parquet
              kind: attachment

  - name: AttachmentYieldsItsName
