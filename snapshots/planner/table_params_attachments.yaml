          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "cddaa8812c02564db28aceb91cd63f4e"
          references: [foo]
      entities: []
      unresolved-references: []
      nodes:
        - id: 0
          script: foo
          connection: local
          statement-id: 0
          type: SELECT
          sql: |-
            with sales as (select * from external('/mnt/external/attachments/test/sales.parquet', format => 'parquet'))
            select region, amount from sales where amount > 5
          produces-output: true
          barrier: false
          script-result: true
          attachments: [sales.parquet]
          accesses: []
        - id: 1
          script: bar
          connection: local
          statement-id: 0
          type: SELECT
          sql: |-
            with sales as (select * from external('/mnt/external/attachments/test/sales.parquet', format => 'parquet')),
            foo as (
            select region, amount from sales where amount > 5
            )
            select count(*) from foo
          produces-output: true
          barrier: false
          script-result: true
          inlined-scripts: [0]
          attachments: [sales.parquet]
          accesses: []
      edges: []
      attachments:
        - name: sales
          path: /mnt/external/attachments/test/sales.parquet
      references:
        - node: 0
          script: foo
          text: ":sales"
          attachment: sales.parquet
          cte: sales
        - node: 1
          script: bar
          text: ":foo"
          target: foo
          cte: foo
      diagnostics: []
      checked-references:
        - script: foo
          references:
            - text: ":sales"
              attachment: sales.parquet
              kind: attachment
        - script: bar
          references:
            - text: ":foo"
              target: foo
              kind: inline

