  - name: InlinedQueryReadsAttachment
    connections:
      - name: local
        kind: LOCAL
    attachments:
      - file: sales.parquet
        stamp: 1
        query: select 'eu' as region, 10 as amount
    scripts:
      - name: foo
        connection: local
        input: |
          select region, amount from :sales where amount > 5;
      - name: bar
        connection: local
        input: |
          select count(*) from :foo;
    expected:
      valid: true
      connections:
        - name: local
          kind: LOCAL
      scripts:
        - name: foo
          connection: local
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
