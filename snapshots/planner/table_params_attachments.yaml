      unresolved-references: []
      nodes: []
      edges: []
      attachments:
        - name: sales
          path: /mnt/external/attachments/test/sales.parquet
      diagnostics:
        - script: bar
          text: ":sales"
          error: true
          message: 'bar.sql runs on the connection trino and cannot read the attachment sales.parquet, only the embedded Hyper reads attachments'
      checked-references:
        - script: bar
          references:
            - text: ":sales"
              attachment: sales.parquet
              kind: invalid
              errors:
                - 'bar.sql runs on the connection trino and cannot read the attachment sales.parquet, only the embedded Hyper reads attachments'

