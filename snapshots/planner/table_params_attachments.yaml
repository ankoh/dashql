  - name: ScriptAttachmentCollision
    connections:
      - name: local
        kind: LOCAL
    attachments:
      - file: sales.parquet
        stamp: 1
    scripts:
      - name: sales
        connection: local
        input: |
          select 1 as id;
      - name: bar
        connection: local
        input: |
          select * from :sales;
    expected:
