planner-snapshots:

  - name: SessionSkipsManual
    connections:
      - name: db
        kind: LOCAL
        catalog: |
          create table orders (id int, region text, amount int);
    scripts:
      - name: orders_all
        connection: db
        input: |
          /* All orders, expensive without a filter.
             @manual */
          select id, region, amount from orders;
      - name: west
        connection: db
        input: |
          select sum(amount) from :orders_all where region = 'west';
      - name: other
        connection: db
        input: |
          select count(*) from orders;
