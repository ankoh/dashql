planner-snapshots:
  # A call without a spec goes to the backend, in session order
  - name: CallBackend
    scripts:
      - name: queries
        input: |
          select 1;
          call my_schema.procedure (a => 1);
          select 2;

  # A spec shadows its namespace: a call in it never reaches the backend, the host runs its description
  - name: CallRegisteredNamespace
    client_functions: tickets
    scripts:
      - name: queries
        input: |
          select 1;
          call tickets.ticket_list (project => 'a');
          explain call tickets.ticket_delete (id => 1);
          select 2;

  # Another namespace goes to the backend as written, an unknown function of the shadowed namespace doesn't. It counts
  # as a write, so only a run of the script plans it.
  - name: CallShadowing
    client_functions: tickets
    targets: [queries]
    scripts:
      - name: queries
        input: |
          call other.procedure (a => 1);
          call tickets.backend_procedure (a => 1);

  # A query value is its text without the parentheses around all of it. A query can start and end with its own, and a
  # string can hold one.
  - name: CallEmbeddedQuery
    client_functions: tickets
    targets: [queries]
    scripts:
      - name: queries
        input: |
          call tickets.ticket_create (project => 'a', title => 'b', affected => (select 1));
          call tickets.ticket_create (project => 'a', title => 'b', affected => (((select 1))));
          call tickets.ticket_create (project => 'a', title => 'b', affected => ((select 1) union (select 2)));
          call tickets.ticket_create (project => 'a', title => 'b', affected => (((select 1) union (select 2))));
          call tickets.ticket_create (project => 'a', title => 'b', affected => (with a as (select ')' as b) select b from a));

  # The values of the inputs fill in the parameters of a call
  - name: CallInputs
    client_functions: tickets
    scripts:
      - name: queries
        input: |
          /** @param :project = 'OPS'
           * @param :size = 50
           * @param :full = true */
          call tickets.ticket_list (project => :project, page_size => :size);
          call tickets.ticket_search (query => (full = :full));

  # A parameter of a call needs a value
  - name: CallInputWithoutValue
    client_functions: tickets
    scripts:
      - name: queries
        input: |
          call tickets.ticket_list (project => :project);

  # No backend judges a client function call, so an error of its checks stops the plan
  - name: CallCheckFails
    client_functions: tickets
    scripts:
      - name: queries
        input: |
          select 1;
          call tickets.ticket_list (page_size => 1);

  # A script with a call that writes runs only on request: a run of the session leaves it out, an EXPLAIN of it and a
  # call that reads run
  - name: CallWrite
    client_functions: tickets
    scripts:
      - name: queries
        input: |
          call tickets.ticket_delete (id => 1);
      - name: explained
        input: |
          explain call tickets.ticket_delete (id => 1);
      - name: listed
        input: |
          call tickets.ticket_list (project => 'a');
      - name: raw_get
        input: |
          call tickets.request (method => 'GET', path => '/x', host => 'api');
      - name: raw_post
        input: |
          call tickets.request (method => 'POST', path => '/x', host => 'api');

  # A run of the script plans its write
  - name: CallWriteTarget
    client_functions: tickets
    targets: [queries]
    scripts:
      - name: queries
        input: |
          call tickets.ticket_delete (id => 1);

  # A call runs in the host, no query of its connection can inline it
  - name: CallReferenced
    client_functions: tickets
    scripts:
      - name: producer
        input: |
          call tickets.ticket_list (project => 'a');
      - name: consumer
        input: |
          select * from :producer;

  # The LOCAL connection scans the result of a call that reads, the host materializes it
  - name: CallScanned
    client_functions: tickets
    hyper: skip
    connections:
      - name: d360
        kind: REMOTE
      - name: local
        kind: LOCAL
    scripts:
      - name: open_tickets
        connection: d360
        input: |
          call tickets.ticket_list (project => 'a', _pages => 3);
      - name: counted
        connection: local
        input: |
          select count(*), max(_next) from :open_tickets;

  # Another script reads no call that writes, and no EXPLAIN, which sends nothing
  - name: CallReferencedWrite
    client_functions: tickets
    connections:
      - name: d360
        kind: REMOTE
      - name: local
        kind: LOCAL
    scripts:
      - name: deleted
        connection: d360
        input: |
          call tickets.ticket_delete (id => 1);
      - name: explained
        connection: d360
        input: |
          explain call tickets.ticket_list (project => 'a');
      - name: consumer
        connection: local
        input: |
          select * from :deleted, :explained;
