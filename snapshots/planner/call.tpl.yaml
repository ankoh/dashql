planner-snapshots:
  # A call without a spec goes to the backend, in session order
  - name: CallBackend
    scripts:
      - name: queries
        input: |
          select 1;
          call my_schema.procedure (a => 1);
          select 2;

  # A spec shadows its namespace: a call in it never reaches the backend, the host runs its description
  - name: CallRegisteredNamespace
    client_functions: tickets
    scripts:
      - name: queries
        input: |
          select 1;
          call tickets.ticket_list (project => 'a');
          explain call tickets.ticket_delete (id => 1);
          select 2;

  # Another namespace goes to the backend as written, an unknown function of the shadowed namespace doesn't
  - name: CallShadowing
    client_functions: tickets
    scripts:
      - name: queries
        input: |
          call other.procedure (a => 1);
          call tickets.backend_procedure (a => 1);

  # The values of the inputs fill in the parameters of a call
  - name: CallInputs
    client_functions: tickets
    scripts:
      - name: queries
        input: |
          /** @param :project = 'OPS'
           * @param :size = 50
           * @param :full = true */
          call tickets.ticket_list (project => :project, page_size => :size);
          call tickets.ticket_search (query => (full = :full));

  # A parameter of a call needs a value
  - name: CallInputWithoutValue
    client_functions: tickets
    scripts:
      - name: queries
        input: |
          call tickets.ticket_list (project => :project);

  # No backend judges a client function call, so an error of its checks stops the plan
  - name: CallCheckFails
    client_functions: tickets
    scripts:
      - name: queries
        input: |
          select 1;
          call tickets.ticket_list (page_size => 1);

  # A write is planned, the runtime decides whether it may run
  - name: CallWrite
    client_functions: tickets
    scripts:
      - name: queries
        input: |
          call tickets.ticket_delete (id => 1);

  # A script reads a query of another script, not a call
  - name: CallReferenced
    client_functions: tickets
    scripts:
      - name: producer
        input: |
          call tickets.ticket_list (project => 'a');
      - name: consumer
        input: |
          select * from :producer;
