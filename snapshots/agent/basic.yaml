  - name: cancel_pending_generation
    input:
      prompt: Write a query.
      intent: sql
      max-attempts: 3
    events:
      - type: cancel
    expected:
      operations:
        - phase: IDLE
          attempt: 0
          intent: SQL
          effect:
            type: RESOLVE_CONTEXT
        - phase: CANCELLED
          attempt: 0
          intent: SQL
