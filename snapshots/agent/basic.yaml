agent-snapshots:

  - name: classify_sql_success
    input:
      prompt: Return the number one.
      max-attempts: 3
    events:
      - type: model_response
        value: sql
      - type: resolved_context
        value: ''
      - type: model_response
        value: select 1
      - type: applied_result
    expected:
      operations:
        - phase: CLASSIFYING
          attempt: 0
          effect:
            type: MODEL_REQUEST
            kind: CLASSIFY
            prompt: |-
              Return the number one.
        - phase: CLASSIFYING
          attempt: 0
          intent: SQL
          effect:
            type: RESOLVE_CONTEXT
        - phase: GENERATING
          attempt: 1
          intent: SQL
          effect:
            type: MODEL_REQUEST
            kind: GENERATE
            prompt: |-
              Return the number one.
        - phase: APPLYING
          attempt: 1
          intent: SQL
          effect:
            type: APPLY_PROPOSAL
            disposition: CREATE
            candidate: |-
              select 1
          validation:
            candidate: |-
              select 1
            errors: []
        - phase: SUCCEEDED
          attempt: 1
          intent: SQL

  - name: repair_empty_response
    input:
      prompt: Return the number one.
      intent: sql
      max-attempts: 3
      script: select 1
    events:
      - type: resolved_context
        value: ''
      - type: model_response
        value: ''
      - type: model_response
        value: select 1
      - type: applied_result
    expected:
      operations:
        - phase: IDLE
          attempt: 0
          intent: SQL
          effect:
            type: RESOLVE_CONTEXT
        - phase: GENERATING
          attempt: 1
          intent: SQL
          effect:
            type: MODEL_REQUEST
            kind: GENERATE
            prompt: |-
              Return the number one.
        - phase: REPAIRING
          attempt: 2
          intent: SQL
          effect:
            type: MODEL_REQUEST
            kind: REPAIR
            prompt: |-
              Return the number one.
            errors:
              - The model returned an empty result.
          validation:
            candidate: |-
            errors:
              - The model returned an empty result.
        - phase: APPLYING
          attempt: 2
          intent: SQL
          effect:
            type: APPLY_PROPOSAL
            disposition: REPLACE
            candidate: |-
              select 1
          validation:
            candidate: |-
              select 1
            errors: []
        - phase: SUCCEEDED
          attempt: 2
          intent: SQL

  - name: visualize_replaces_focused_visualization
    input:
      prompt: Change the chart to bars.
      intent: visualize
      script: select 1 visualize using vegalite (mark => line)
    events:
      - type: resolved_context
        value: current chart
      - type: model_response
        value: '{"mark":"bar"}'
      - type: applied_result
    expected:
      operations:
        - phase: IDLE
          attempt: 0
          intent: VISUALIZE
          effect:
            type: RESOLVE_CONTEXT
        - phase: GENERATING
          attempt: 1
          intent: VISUALIZE
          effect:
            type: MODEL_REQUEST
            kind: GENERATE
            prompt: |-
              Change the chart to bars.
            context: |-
              current chart
            editing-chart: 1
        - phase: APPLYING
          attempt: 1
          intent: VISUALIZE
          effect:
            type: APPLY_PROPOSAL
            disposition: REPLACE
            candidate: |-
              select 1
              visualize using vegalite (
                mark => bar
              );
          validation:
            candidate: |-
              select 1
              visualize using vegalite (
                mark => bar
              );
            errors: []
        - phase: SUCCEEDED
          attempt: 1
          intent: VISUALIZE

  - name: visualize_creates_beside_focused_sql
    input:
      prompt: Chart this query.
      intent: visualize
      script: select 1
    events:
      - type: resolved_context
        value: source query
      - type: model_response
        value: '{"mark":"bar"}'
      - type: applied_result
    expected:
      operations:
        - phase: IDLE
          attempt: 0
          intent: VISUALIZE
          effect:
            type: RESOLVE_CONTEXT
        - phase: GENERATING
          attempt: 1
          intent: VISUALIZE
          effect:
            type: MODEL_REQUEST
            kind: GENERATE
            prompt: |-
              Chart this query.
            context: |-
              source query
        - phase: APPLYING
          attempt: 1
          intent: VISUALIZE
          effect:
            type: APPLY_PROPOSAL
            disposition: CREATE
            candidate: |-
              select 1
              visualize using vegalite (
                mark => bar
              );
          validation:
            candidate: |-
              select 1
              visualize using vegalite (
                mark => bar
              );
            errors: []
        - phase: SUCCEEDED
          attempt: 1
          intent: VISUALIZE

  - name: exhaust_invalid_sql
    input:
      prompt: Write a query.
      intent: sql
      max-attempts: 2
    events:
      - type: resolved_context
        value: ''
      - type: model_response
        value: select (
      - type: model_response
        value: select (
    expected:
      operations:
        - phase: IDLE
          attempt: 0
          intent: SQL
          effect:
            type: RESOLVE_CONTEXT
        - phase: GENERATING
          attempt: 1
          intent: SQL
          effect:
            type: MODEL_REQUEST
            kind: GENERATE
            prompt: |-
              Write a query.
        - phase: REPAIRING
          attempt: 2
          intent: SQL
          effect:
            type: MODEL_REQUEST
            kind: REPAIR
            prompt: |-
              Write a query.
            previous-candidate: |-
              select (
            errors:
              - 'syntax error, unexpected EOF'
          validation:
            candidate: |-
              select (
            errors:
              - 'syntax error, unexpected EOF'
        - phase: FAILED
          attempt: 2
          intent: SQL
          validation:
            candidate: |-
              select (
