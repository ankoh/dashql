agent-snapshots:

  - name: classify_sql_success
    input:
      prompt: Return the number one.
      max-attempts: 3
    events:
      - type: model_response
        value: sql
      - type: resolved_context
        value: ''
      - type: model_response
        value: select 1
      - type: applied_result
    expected:
      operations:
        - status: PENDING
          phase: CLASSIFYING
          attempt: 0
          effect:
            type: MODEL_REQUEST
            kind: CLASSIFY
            prompt: |-
              Return the number one.
        - status: PENDING
          phase: CLASSIFYING
          attempt: 0
          intent: SQL
          effect:
            type: RESOLVE_CONTEXT
        - status: PENDING
          phase: GENERATING
          attempt: 1
          intent: SQL
          effect:
            type: MODEL_REQUEST
            kind: GENERATE
            prompt: |-
              Return the number one.
        - status: PENDING
          phase: APPLYING
          attempt: 1
          intent: SQL
          effect:
            type: APPLY_PROPOSAL
            disposition: CREATE
            candidate: |-
              select 1
          attempt-result:
            candidate: |-
              select 1
            errors: []
        - status: OK
          phase: SUCCEEDED
          attempt: 1
          intent: SQL

