  - name: vis_tag_board_not_a_query
    script:
      input: |
        /* @board row=4 width=3 */
        select 1 as a;
        /* @board row=1 column=2 width=4 height=2 */
        create table t (a int);
      catalog-id: 1
      tables:
        - catalog-id: "256.65536.4294967296"
          name: t
          text: "create tab.. t (a int)"
          columns:
            - catalog-id: "256.65536.4294967296.0"
              name: a
              text: "a int"
      touched-relations:
        - statement-id: 1
          name: t
      errors: []
      expressions:
        - expression-idx: 0
          type: literal/integer
          is-const: true
          statement-id: 0
          text: "1"
      constants:
        - expression: 0
          text: "1"
      name-scopes:
        - scope-id: 0
          columns:
            - name: a
              expression: 0
          text: "select 1 as a"
      board:
        statement-id: 1
        row: 1
        column: 2
        width: 4
        height: 2

  - name: vis_tag_flow
    script:
      input: |
        /* @flow x=-40 y=120 */
        create table t (a int);
        /* @vis table */
        select a from t;
      catalog-id: 1
      tables:
        - catalog-id: "256.65536.4294967296"
          name: t
          text: "create tab.. t (a int)"
          columns:
            - catalog-id: "256.65536.4294967296.0"
              name: a
              text: "a int"
      touched-relations:
        - statement-id: 0
          name: t
      errors: []
      table-refs:
        - type: name/internal
          catalog-id: "256.65536.4294967296"
          statement-id: 1
          text: "t"
      expressions:
        - expression-idx: 0
          type: colref/internal
          catalog: "256.65536.4294967296.0"
          statement-id: 1
          text: "a"
      name-scopes:
        - scope-id: 1
          sources:
            - type: table
              name: t
              text: "t"
          columns:
            - name: a
              expression: 0
          text: "select a from t"
      visualizations:
        - statement-id: 1
          source: "select a from t"
          renderer: table
          dashboard:
            width: 6
            height: 6
      flow:
        statement-id: 0
        x: -40
        y: 120

  - name: vis_tag_flow_twice
