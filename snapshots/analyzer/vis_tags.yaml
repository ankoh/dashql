  - name: vis_tag_flow_args
    script:
      input: |
        /* @flow x=1 depth=3 z */
        select 1;
        /* @flow x=y y=99999999999 */
        select 2;
        /* @flow y=5 x=6 */
        select 3;
      catalog-id: 1
      errors:
        - type: INVALID_VIS_TAG
          severity: WARNING
          message: 'unknown @flow arg "depth", expected x, y, width or height'
          text: "depth=3"
        - type: INVALID_VIS_TAG
          severity: WARNING
          message: '@flow takes key=value args, not "z"'
          text: "z"
        - type: INVALID_VIS_TAG
          severity: WARNING
          message: '@flow needs y'
          text: "flow"
        - type: INVALID_VIS_TAG
          severity: WARNING
          message: '@flow x must be an integer'
          text: "x=y"
        - type: INVALID_VIS_TAG
          severity: WARNING
          message: '@flow y is out of range'
          text: "y=99999999999"
        - type: INVALID_VIS_TAG
          severity: WARNING
          message: '@flow needs x'
          text: "flow"
      expressions:
        - expression-idx: 0
          type: literal/integer
          is-const: true
          statement-id: 0
          text: "1"
        - expression-idx: 1
          type: literal/integer
          is-const: true
          statement-id: 1
          text: "2"
        - expression-idx: 2
          type: literal/integer
          is-const: true
          statement-id: 2
          text: "3"
      constants:
        - expression: 0
          text: "1"
        - expression: 1
          text: "2"
        - expression: 2
          text: "3"
      name-scopes:
        - scope-id: 0
          columns:
            - name: '?'
              expression: 0
          text: "select 1"
        - scope-id: 1
          columns:
            - name: '?'
              expression: 1
          text: "select 2"
        - scope-id: 2
          columns:
            - name: '?'
              expression: 2
          text: "select 3"
      flow:
        statement-id: 2
        x: 6
        y: 5

  - name: vis_tag_flow_size
    script:
      input: |
        /* @flow width=400 height=96 */
        select 1;
      catalog-id: 1
      errors: []
      expressions:
        - expression-idx: 0
          type: literal/integer
