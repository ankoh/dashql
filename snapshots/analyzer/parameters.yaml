  - name: parameters_param_tags
    script:
      input: |-
        /**
         * @param :min = 10
         * @param :region = 'North America'
         * @param :day
         * @param :span = interval '3' day
         * @param :bad = now()
         * @param broken
         */
        select * from orders where amount > :min and region = :region and day = :day::date and ts > now() - :span;
        /* @param :min = 20
           @param :"foo-2" = date '2024-01-01' */
        select :min, :"foo-2"
      catalog-id: 1
      errors:
        - type: INVALID_PARAM_TAG
          severity: WARNING
          message: 'now() is no literal, a literal is a number, a string, true, false, null, or a typed literal like date ''2024-01-01'' or interval ''3'' day'
          text: "now()"
        - type: INVALID_PARAM_TAG
          severity: WARNING
          message: 'the script already has a value for @param :min, this tag is ignored'
          text: ":min"
      table-refs:
        - type: name/unresolved
          statement-id: 0
          text: "orders"
      expressions:
        - expression-idx: 0
          type: colref/unresolved
          statement-id: 0
          text: "amount"
        - expression-idx: 1
          type: colref/unresolved
          statement-id: 0
          text: "region"
        - expression-idx: 2
          type: colref/unresolved
          statement-id: 0
          text: "day"
        - expression-idx: 3
          type: colref/unresolved
          statement-id: 0
          text: "ts"
        - expression-idx: 4
          type: function
          name: now
          is-const: true
          statement-id: 0
          text: "now()"
      parameters:
        - kind: scalar
          name: min
          statement-id: 0
          text: ":min"
        - kind: scalar
          name: region
          statement-id: 0
          text: ":region"
        - kind: scalar
          name: day
          statement-id: 0
          cast: "date"
          text: ":day"
        - kind: scalar
          name: span
          statement-id: 0
          text: ":span"
        - kind: scalar
          name: min
          statement-id: 1
          text: ":min"
        - kind: scalar
          name: foo-2
          statement-id: 1
          text: ":\"foo-2\""
      name-scopes:
        - scope-id: 0
          sources:
            - type: unresolved
              name: orders
              text: "orders"
          text: "select * f..() - :span"
        - scope-id: 1
          columns:
            - name: '?'
              computed: true
            - name: '?'
              computed: true
          text: "select :mi.., :\"foo-2\""
      param-values:
        - name: min
          value: "10"
          statement-id: 0
        - name: region
          value: "'North America'"
          statement-id: 0
        - name: day
          statement-id: 0
        - name: span
          value: "interval '3' day"
          statement-id: 0
        - name: bad
          statement-id: 0
        - name: foo-2
          value: "date '2024-01-01'"
          statement-id: 1
      inferred-tables:
        - name: orders
          confidence: confident
          columns:
            - name: amount
              confidence: confident
            - name: region
              confidence: confident
            - name: day
              confidence: confident
            - name: ts
              confidence: confident

