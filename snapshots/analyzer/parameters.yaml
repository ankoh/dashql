  - name: parameters_tables
    script:
      input: |-
        insert into :target select * from :source join (select * from $0 where y = :y) o on true;
        delete from $1 where id = ?
      catalog-id: 1
      errors: []
      expressions:
        - expression-idx: 0
          type: colref/unresolved
          statement-id: 0
          text: "y"
        - expression-idx: 1
          type: colref/unresolved
          statement-id: 1
          text: "id"
      parameters:
        - kind: table
          name: target
          statement-id: 0
          text: ":target"
        - kind: table
          name: source
          statement-id: 0
          text: ":source"
        - kind: table
          name: 0
          statement-id: 0
          text: "$0"
        - kind: scalar
          name: y
          statement-id: 0
          text: ":y"
        - kind: table
          name: 1
          statement-id: 1
          text: "$1"
        - kind: scalar
          statement-id: 1
          text: "?"
      name-scopes:
        - scope-id: 1
          sources:
            - type: subquery
              name: o
              scope: 0
              text: "(select * .. y = :y) o"
          text: "select * f.. o on true"

