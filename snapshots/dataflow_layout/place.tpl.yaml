dataflow_layout-snapshots:
  # Fixed boxes stay, a consumer goes right of its producers at the median of their rows
  - name: RightOfProducers
    boxes:
      - name: orders
        fixed: [400, 800]
      - name: report
      - name: regions
        fixed: [400, 100]
    edges:
      - from: orders
        to: report
      - from: regions
        to: report

  # A producer without placed producers goes left of its consumer
  - name: LeftOfConsumer
    boxes:
      - name: orders
      - name: report
        rows: 2
        fixed: [600, 40]
    edges:
      - from: orders
        to: report.1

  # Two consumers that want the same slot, the second one moves to the nearest free slot
  - name: FreeSlot
    boxes:
      - name: orders
        fixed: [0, 0]
      - name: by_region
      - name: by_month
    edges:
      - from: orders
        to: by_region
      - from: orders
        to: by_month

  # A box without edges goes below everything, at the left edge
  - name: Below
    boxes:
      - name: orders
        rows: 2
        fixed: [120, 0]
      - name: regions
        fixed: [480, 200]
      - name: alone
