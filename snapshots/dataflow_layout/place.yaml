dataflow_layout-snapshots:

  - name: RightOfProducers
    boxes:
      - name: orders
        fixed: [400,800]
      - name: report
      - name: regions
        fixed: [400,100]
    edges:
      - from: orders
        to: report
      - from: regions
        to: report
    expected:
      orders: [400,800,280,80]
      report: [776,448,280,80]
      regions: [400,100,280,80]

  - name: LeftOfConsumer
    boxes:
      - name: orders
      - name: report
        rows: 2
        fixed: [600,40]
    edges:
      - from: orders
        to: report.1
    expected:
      orders: [224,72,280,80]
      report: [600,40,280,112]

  - name: FreeSlot
    boxes:
      - name: orders
        fixed: [0,0]
      - name: by_region
      - name: by_month
    edges:
      - from: orders
        to: by_region
      - from: orders
        to: by_month
    expected:
      orders: [0,0,280,80]
      by_region: [376,0,280,80]
      by_month: [376,96,280,80]

  - name: Below
    boxes:
      - name: orders
        rows: 2
        fixed: [120,0]
      - name: regions
        fixed: [480,200]
      - name: alone
    expected:
      orders: [120,0,280,112]
      regions: [480,200,280,80]
      alone: [120,312,280,80]
