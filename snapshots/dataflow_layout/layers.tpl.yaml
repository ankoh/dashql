dataflow_layout-snapshots:
  # A chain flows from left to right, the consumer is aligned with the row it reads
  - name: Chain
    boxes:
      - name: orders
        rows: 3
      - name: report
      - name: chart
    edges:
      - from: orders.2
        to: report
      - from: report
        to: chart

  # A box with a chart is taller, its consumer aligns with the row below the chart
  - name: Chart
    boxes:
      - name: sales
        rows: 2
        chart: 0
      - name: report
    edges:
      - from: sales.1
        to: report

  # Two consumers of one producer stack in the next layer
  - name: Fanout
    boxes:
      - name: orders
      - name: by_region
      - name: by_month
    edges:
      - from: orders
        to: by_region
      - from: orders
        to: by_month

  # A source sits right before its consumer, not in the first layer
  - name: LateSource
    boxes:
      - name: orders
      - name: filtered
      - name: report
      - name: regions
    edges:
      - from: orders
        to: filtered
      - from: filtered
        to: report
      - from: regions
        to: report

  # The order of the second layer avoids the crossing of the session order
  - name: Crossing
    boxes:
      - name: a
      - name: b
      - name: from_b
      - name: from_a
    edges:
      - from: a
        to: from_a
      - from: b
        to: from_b

  # The back edge of a cycle is reversed
  - name: Cycle
    boxes:
      - name: a
      - name: b
    edges:
      - from: a
        to: b
      - from: b
        to: a

  # Connected parts stack, boxes without edges go into rows of four below them
  - name: PartsAndIsolatedBoxes
    boxes:
      - name: a
      - name: from_a
      - name: b
      - name: from_b
      - name: alone_1
        rows: 2
      - name: alone_2
      - name: alone_3
      - name: alone_4
      - name: alone_5
    edges:
      - from: a
        to: from_a
      - from: b
        to: from_b

  # A collapsed box is its header, edges attach to it
  - name: Collapsed
    boxes:
      - name: schema
        rows: 4
        collapsed: true
      - name: report
    edges:
      - from: schema.3
        to: report
