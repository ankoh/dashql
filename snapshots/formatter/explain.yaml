formatter-snapshots:

  - name: explain_select
    input: |-
      explain select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              explain select 1;
          - mode: compact
            expected: |-
              explain select 1;
          - mode: pretty
            expected: |-
              explain select 1;

  - name: explain_with_analyze
    input: |-
      explain (analyze) select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              explain (analyze) select 1;
          - mode: compact
            expected: |-
              explain (analyze)
              select 1;
          - mode: pretty
            expected: |-
              explain (analyze)
              select 1;

  - name: explain_with_options
    input: |-
      explain (analyze, format text) select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              explain (analyze, format text) select 1;
          - mode: compact
            expected: |-
              explain (analyze, format text)
              select 1;
          - mode: pretty
            expected: |-
              explain (analyze, format text)
              select 1;

  - name: explain_create_table
    input: |-
      explain create table foo (id integer)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              explain create table foo (id integer);
          - mode: compact
            expected: |-
              explain create table foo (id integer);
          - mode: pretty
            expected: |-
              explain create table foo (id integer);

  - name: coverage_explain_raw_sql_subquery_descriptor
    input: |-
      explain (format sql, sql_dialect internal_spark_2025_12)
      select * from raw_sql_subquery(descriptor(foo int), 'bar')
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              explain (format sql, sql_dialect internal_spark_2025_12) select * from raw_sql_subquery(descriptor(foo integer), 'bar');
          - mode: compact
            expected: |-
              explain (format sql, sql_dialect internal_spark_2025_12)
              select * from raw_sql_subquery(descriptor(foo integer), 'bar');
          - mode: pretty
            expected: |-
              explain (format sql, sql_dialect internal_spark_2025_12)
              select *
              from raw_sql_subquery(descriptor(foo integer), 'bar');

  - name: explain_streaming_options
    input: |-
      explain (
        format sql,
        sql_dialect internal_spark,
        streaming_table orders,
        change_data_feed orders_cdf,
        streaming_key_columns (id),
        streaming_actions_column _action,
        change_data_feed_record_type_column _record_type,
        change_data_feed_columns descriptor(_record_type text)
      )
      select * from orders;
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              explain (format sql, sql_dialect internal_spark, streaming_table orders, change_data_feed orders_cdf, streaming_key_columns (id), streaming_actions_column _action, change_data_feed_record_type_column _record_type, change_data_feed_columns descriptor(_record_type text)) select * from orders;
          - mode: compact
            expected: |-
              explain (
                format sql, sql_dialect internal_spark, streaming_table orders, change_data_feed orders_cdf,
                streaming_key_columns (id), streaming_actions_column _action, change_data_feed_record_type_column _record_type,
                change_data_feed_columns descriptor(_record_type text)
              )
              select * from orders;
          - mode: pretty
            expected: |-
              explain (
                format sql,
                sql_dialect internal_spark,
                streaming_table orders,
                change_data_feed orders_cdf,
                streaming_key_columns (id),
                streaming_actions_column _action,
                change_data_feed_record_type_column _record_type,
                change_data_feed_columns descriptor(_record_type text)
              )
              select *
              from orders;
