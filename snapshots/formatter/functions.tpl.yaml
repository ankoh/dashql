formatter-snapshots:

  # CAST

  - name: func_cast_int
    input: select cast(x as integer)
    dialects:
      hyper:

  - name: func_cast_varchar
    input: select cast(123 as varchar)
    dialects:
      hyper:

  - name: func_cast_timestamp
    input: select cast('2021-01-01' as timestamp)
    dialects:
      hyper:

  - name: func_cast_timestamp_tz
    input: select cast('2021-01-01' as timestamp with time zone)
    dialects:
      hyper:

  # EXTRACT

  - name: func_extract_year
    input: select extract(year from d)
    dialects:
      hyper:

  - name: func_extract_day
    input: select extract(day from created_at)
    dialects:
      hyper:

  # POSITION

  - name: func_position
    input: select position('x' in name)
    dialects:
      hyper:

  # SUBSTRING

  - name: func_substring_from
    input: select substring(name from 1)
    dialects:
      hyper:

  - name: func_substring_from_for
    input: select substring(name from 1 for 3)
    dialects:
      hyper:

  # TRIM

  - name: func_trim_both
    input: select trim(both ' ' from name)
    dialects:
      hyper:

  - name: func_trim_leading
    input: select trim(leading from name)
    dialects:
      hyper:

  - name: func_trim_simple
    input: select trim(name)
    dialects:
      hyper:

  # Conditional functions

  - name: func_nullif
    input: select nullif(a, b)
    dialects:
      hyper:

  - name: func_coalesce
    input: select coalesce(a, b)
    dialects:
      hyper:

  # Window functions

  - name: func_over_partition
    input: select sum(x) over (partition by y)
    dialects:
      hyper:

  - name: func_over_order
    input: select row_number() over (order by x)
    dialects:
      hyper:

  - name: func_over_partition_order
    input: select rank() over (partition by a order by b)
    dialects:
      hyper:

  - name: func_over_empty
    input: select count(*) over ()
    dialects:
      hyper:

  - name: func_over_rows_between
    input: select sum(x) over (order by ts rows between unbounded preceding and current row) from t
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: select sum(x) over (order by ts rows between unbounded preceding and current row) from t;
          - mode: compact
            expected: select sum(x) over (order by ts rows between unbounded preceding and current row) from t;
          - mode: pretty
            expected: |-
              select sum(x) over (order by ts rows between unbounded preceding and current row)
              from t;
        validation:
          setup: create table t (x integer, ts timestamp);

  - name: func_over_range_current_row
    input: select sum(x) over (order by ts range current row) from t
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: select sum(x) over (order by ts range current row) from t;
          - mode: compact
            expected: select sum(x) over (order by ts range current row) from t;
          - mode: pretty
            expected: |-
              select sum(x) over (order by ts range current row)
              from t;
        validation:
          setup: create table t (x integer, ts timestamp);

  - name: func_over_rows_value_bounds
    input: select sum(x) over (order by ts rows between 2 preceding and 1 following) from t
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: select sum(x) over (order by ts rows between 2 preceding and 1 following) from t;
          - mode: compact
            expected: select sum(x) over (order by ts rows between 2 preceding and 1 following) from t;
          - mode: pretty
            expected: |-
              select sum(x) over (order by ts rows between 2 preceding and 1 following)
              from t;
        validation:
          setup: create table t (x integer, ts timestamp);

  - name: func_filter
    input: select count(*) filter (where x > 0)
    dialects:
      hyper:

  - name: func_within_group
    input: select percentile_cont(0.5) within group (order by x)
    dialects:
      hyper:
