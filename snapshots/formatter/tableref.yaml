  - name: tableref_function_table_relation_argument_full_query
    input: |-
      SELECT
          "v"."hybrid_score__c" AS "Score",
          "c"."Chunk__c" AS "Chunk",
          "c"."SourceRecordId__c" AS "SourceRecordId",
          "c"."RecordId__c" AS "RecordId",
          "c"."DataSource__c" AS "DataSource",
          "c"."DataSourceObject__c" AS "DataSourceObject"
      FROM
          hybrid_search(
              TABLE("KnowledgeArticle_index__dlm"),
                  $"_SEARCH_STRING",
                  $"_PREFILTER_EXPRESSION",
                  /*Integer(EED3)*/
          ) AS "v"
              INNER JOIN "KnowledgeArticle_chunk__dlm" AS "c" ON "c"."RecordId__c" = "v"."RecordId__c"
              INNER JOIN "ssot__KnowledgeArticleVersion__dlm" AS "kav" ON "c"."SourceRecordId__c" = "kav"."ssot__Id__c"
              AND "c"."SourceRecordId__c" IN (
                  SELECT DISTINCT "kds"."ParentId__c"
                  FROM "DataCategorySelectionCustom__dlm" AS "kds"
                  WHERE ARRAY_CONTAINS($"CATEGORY_IDS", "kds"."DataCategoryId__c")
              )
      ORDER BY "Score" DESC
          LIMIT /*Integer(7776)*/
    dialects:
      duckdb:
        formatted:
          - mode: inline
            expected: |-
              select "v"."hybrid_score__c" as "Score", "c"."Chunk__c" as "Chunk", "c"."SourceRecordId__c" as "SourceRecordId", "c"."RecordId__c" as "RecordId", "c"."DataSource__c" as "DataSource", "c"."DataSourceObject__c" as "DataSourceObject" from hybrid_search(table("KnowledgeArticle_index__dlm"), $"_SEARCH_STRING", $"_PREFILTER_EXPRESSION", /*Integer(EED3)*/) "v" join "KnowledgeArticle_chunk__dlm" "c" on "c"."RecordId__c" = "v"."RecordId__c" join "ssot__KnowledgeArticleVersion__dlm" "kav" on "c"."SourceRecordId__c" = "kav"."ssot__Id__c" and "c"."SourceRecordId__c" in (select distinct "kds"."ParentId__c" from "DataCategorySelectionCustom__dlm" "kds" where ARRAY_CONTAINS($"CATEGORY_IDS", "kds"."DataCategoryId__c")) order by "Score" desc limit /*Integer(7776)*/;
          - mode: compact
            expected: |-
              select "v"."hybrid_score__c" as "Score", "c"."Chunk__c" as "Chunk", "c"."SourceRecordId__c" as "SourceRecordId",
                "c"."RecordId__c" as "RecordId", "c"."DataSource__c" as "DataSource",
                "c"."DataSourceObject__c" as "DataSourceObject"
              from hybrid_search(
                  table("KnowledgeArticle_index__dlm"), $"_SEARCH_STRING", $"_PREFILTER_EXPRESSION", /*Integer(EED3)*/
                ) "v"
                join "KnowledgeArticle_chunk__dlm" "c" on "c"."RecordId__c" = "v"."RecordId__c"
                join "ssot__KnowledgeArticleVersion__dlm" "kav"
                  on "c"."SourceRecordId__c" = "kav"."ssot__Id__c"
                    and "c"."SourceRecordId__c" in (
                      select distinct "kds"."ParentId__c"
                      from "DataCategorySelectionCustom__dlm" "kds"
                      where ARRAY_CONTAINS($"CATEGORY_IDS", "kds"."DataCategoryId__c")
                    )
              order by "Score" desc
              limit /*Integer(7776)*/;
          - mode: pretty
            expected: |-
              select "v"."hybrid_score__c" as "Score",
                "c"."Chunk__c" as "Chunk",
                "c"."SourceRecordId__c" as "SourceRecordId",
                "c"."RecordId__c" as "RecordId",
                "c"."DataSource__c" as "DataSource",
                "c"."DataSourceObject__c" as "DataSourceObject"
              from hybrid_search(
                  table("KnowledgeArticle_index__dlm"), $"_SEARCH_STRING", $"_PREFILTER_EXPRESSION", /*Integer(EED3)*/
                ) "v"
                join "KnowledgeArticle_chunk__dlm" "c" on "c"."RecordId__c" = "v"."RecordId__c"
                join "ssot__KnowledgeArticleVersion__dlm" "kav"
                  on "c"."SourceRecordId__c" = "kav"."ssot__Id__c"
                    and "c"."SourceRecordId__c" in (
                      select distinct "kds"."ParentId__c"
                      from "DataCategorySelectionCustom__dlm" "kds"
                      where ARRAY_CONTAINS($"CATEGORY_IDS", "kds"."DataCategoryId__c")
                    )
              order by "Score" desc
              limit /*Integer(7776)*/;

