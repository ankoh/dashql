  - name: tableref_derived_select_with_subqueries
    input: |-
      select
        cntrycode,
        count(*) as numcust,
        sum(c_acctbal) as totacctbal
      from
        (
          select
            substring(c_phone from 1 for 2) as cntrycode,
            c_acctbal
          from customer
          where substring(c_phone from 1 for 2) in ('13', '31', '23', '29', '30', '18', '17')
            and c_acctbal > (
              select avg(c_acctbal)
              from customer
              where c_acctbal > 0.00
                and substring(c_phone from 1 for 2) in ('13', '31', '23', '29', '30', '18', '17')
            )
            and not exists (
              select *
              from orders
              where o_custkey = c_custkey
            )
        ) as custsale
      group by cntrycode
      order by cntrycode;
    dialects:
      duckdb:
        formatted:
          - mode: inline
            expected: |-
              select cntrycode, count(*) as numcust, sum(c_acctbal) as totacctbal from (select substring(c_phone from 1 for 2) as cntrycode, c_acctbal from customer where substring(c_phone from 1 for 2) in ('13', '31', '23', '29', '30', '18', '17') and c_acctbal > (select avg(c_acctbal) from customer where c_acctbal > 0.00 and substring(c_phone from 1 for 2) in ('13', '31', '23', '29', '30', '18', '17')) and not exists (select * from orders where o_custkey = c_custkey)) custsale group by cntrycode order by cntrycode;
          - mode: compact
            expected: |-
              select cntrycode, count(*) as numcust, sum(c_acctbal) as totacctbal
              from (
                select substring(c_phone from 1 for 2) as cntrycode, c_acctbal
                from customer
                where substring(c_phone from 1 for 2) in ('13', '31', '23', '29', '30', '18', '17')
                  and c_acctbal > (
                      select avg(c_acctbal)
                      from customer
                      where c_acctbal > 0.00 and substring(c_phone from 1 for 2) in ('13', '31', '23', '29', '30', '18', '17')
                    ) and not exists (select * from orders where o_custkey = c_custkey)
              ) custsale
              group by cntrycode
              order by cntrycode;
          - mode: pretty
            expected: |-
              select cntrycode, count(*) as numcust, sum(c_acctbal) as totacctbal
              from (
                select substring(c_phone from 1 for 2) as cntrycode, c_acctbal
                from customer
                where substring(c_phone from 1 for 2) in ('13', '31', '23', '29', '30', '18', '17')
                  and c_acctbal > (
                      select avg(c_acctbal)
                      from customer
                      where c_acctbal > 0.00 and substring(c_phone from 1 for 2) in ('13', '31', '23', '29', '30', '18', '17')
                    )
                  and not exists (
                    select *
                    from orders
                    where o_custkey = c_custkey
                  )
              ) custsale
              group by cntrycode
              order by cntrycode;
        validation:
          setup: |-
            create table customer(c_phone varchar, c_acctbal decimal, c_custkey integer);
            create table orders(o_custkey integer);

