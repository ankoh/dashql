formatter-snapshots:

  - name: vis_table_source
    input: |-
      select * from sales visualize using vegalite (mark => bar)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select * from sales visualize using vegalite (mark => bar);
          - mode: compact
            expected: |-
              select * from sales
              visualize using vegalite (
                mark => bar
              );
          - mode: pretty
            expected: |-
              select *
              from sales
              visualize using vegalite (
                mark => bar
              );

