  - name: vis_cte_union_source
    input: |-
      with events as (select * from source), aggregates_other as (select ts_hour, sum(cpu_time) as metric, 'other' as target from events where not marker group by ts_hour, marker), aggregates_filtered as (select ts_hour, sum(cpu_time) as metric, 'filtered' as target from events where marker group by ts_hour) select * from aggregates_other union all select * from aggregates_filtered visualize using vegalite (mark => bar, encoding => (x => (field => ts_hour, type => temporal), y => (field => metric, type => quantitative), color => (field => target)))
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with events as (select * from source), aggregates_other as (select ts_hour, sum(cpu_time) as metric, 'other' as target from events where not marker group by ts_hour, marker), aggregates_filtered as (select ts_hour, sum(cpu_time) as metric, 'filtered' as target from events where marker group by ts_hour) select * from aggregates_other union all select * from aggregates_filtered visualize using vegalite (mark => bar, encoding => (x => (field => ts_hour, type => temporal), y => (field => metric, type => quantitative), color => (field => target)));
          - mode: compact
            expected: |-
              with events as (select * from source), aggregates_other as (
                select ts_hour, sum(cpu_time) as metric, 'other' as target from events where not marker group by ts_hour, marker
              ), aggregates_filtered as (
                select ts_hour, sum(cpu_time) as metric, 'filtered' as target from events where marker group by ts_hour
              )
              select * from aggregates_other union all select * from aggregates_filtered
              visualize using vegalite (
                mark => bar,
                encoding => (
                  x => (field => ts_hour, type => temporal), y => (field => metric, type => quantitative),
                  color => (field => target)
                )
              );
          - mode: pretty
            expected: |-
              with events as (
                select *
                from source
              ), aggregates_other as (
                select ts_hour, sum(cpu_time) as metric, 'other' as target
                from events
                where not marker
                group by ts_hour, marker
              ), aggregates_filtered as (
                select ts_hour, sum(cpu_time) as metric, 'filtered' as target
                from events
                where marker
                group by ts_hour
              )
              select *
              from aggregates_other
              union all
              select *
              from aggregates_filtered
              visualize using vegalite (
                mark => bar,
                encoding => (
                  x => (
                    field => ts_hour,
                    type => temporal
                  ),
                  y => (
                    field => metric,
                    type => quantitative
                  ),
                  color => (
                    field => target
                  )
                )
              );

