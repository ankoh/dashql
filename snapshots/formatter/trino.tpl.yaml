formatter-snapshots:
  # The same array type should be rendered in the selected output dialect.
  - name: coverage_trino_array_json_cast
    input: select cast(json_parse(payload) as array(json)) as items from events
    dialects:
      trino:
      hyper:

  - name: coverage_trino_nested_array_cast
    input: select cast(payload as array(array(integer))) from events
    dialects:
      trino:
      hyper:

  - name: coverage_trino_bracket_array_cast
    input: select cast(payload as integer[]) from events
    dialects:
      trino:
      hyper:
