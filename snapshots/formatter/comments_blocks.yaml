formatter-snapshots:

  - name: comment_paragraphs
    input: |-
      -- First paragraph of the comment that is long enough to wrap.
      --
      -- Second paragraph of the comment that is also long enough to wrap.
      select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            width: 30
            expected: |-
              -- First paragraph of the
              -- comment that is long enough
              -- to wrap.
              --
              -- Second paragraph of the
              -- comment that is also long
              -- enough to wrap.
              select 1;
          - mode: pretty
            width: 30
            expected: |-
              -- First paragraph of the
              -- comment that is long enough
              -- to wrap.
              --
              -- Second paragraph of the
              -- comment that is also long
              -- enough to wrap.
              select 1;

  - name: comment_empty_marker
    input: |-
      --
      select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            expected: |-
              --
              select 1;
          - mode: pretty
            expected: |-
              --
              select 1;

  - name: comment_empty_edges
    input: |-
      --
      -- text
      --
      select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            expected: |-
              -- text
              select 1;
          - mode: pretty
            expected: |-
              -- text
              select 1;

  - name: comment_long_word
    input: |-
      -- short averyveryveryveryveryverylongwordthatdoesnotfit end
      select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            width: 20
            expected: |-
              -- short
              -- averyveryveryvery
              -- veryverylongwordt
              -- hatdoesnotfit end
              select 1;
          - mode: pretty
            expected: |-
              -- short averyveryveryveryveryverylongwordthatdoesnotfit end
              select 1;

  - name: comment_split_after_words
    input: |-
      -- ab cdefghijklmnopqrstuvwxyz
      select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            width: 20
            expected: |-
              -- ab
              -- cdefghijklmnopqrs
              -- tuvwxyz
              select 1;
          - mode: pretty
            expected: |-
              -- ab cdefghijklmnopqrstuvwxyz
              select 1;

  - name: comment_region_without_end
    input: |-
      -- @param
      -- Text that is not closed and wraps because it is quite long.
      select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            width: 30
            expected: |-
              /**
               * @param
               * Text that is not closed and wraps because it is quite long.
               */
              select 1;
          - mode: pretty
            expected: |-
              /**
               * @param
               * Text that is not closed and wraps because it is quite long.
               */
              select 1;

  - name: comment_region_after_comments
    input: |-
      -- Leading text that wraps because it is quite long.
      -- @param extra
      -- content inside the region
      -- @end
      -- @vis vegalite
      -- { "a": 1 }
      -- @end
      -- trailing text
      select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            width: 30
            expected: |-
              /**
               * Leading text that wraps because it is quite long.
               * trailing text
               *
               * @param extra
               * content inside the region
               * @vis vegalite
               * {"a": 1}
               */
              select 1;
          - mode: pretty
            expected: |-
              /**
               * Leading text that wraps because it is quite long.
               * trailing text
               *
               * @param extra
               * content inside the region
               * @vis vegalite
               * {"a": 1}
               */
              select 1;

  - name: comment_adjacent_regions
    input: |-
      -- @param
      -- one
      -- @end
      -- @vis vegalite
      -- two
      -- @end
      select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            expected: |-
              /**
               * @param
               * one
               * @vis vegalite
               * two
               */
              select 1;
          - mode: pretty
            expected: |-
              /**
               * @param
               * one
               * @vis vegalite
               * two
               */
              select 1;

  - name: comment_regions_one_end_line
    input: |-
      -- @param Revenue per region, which is long enough to be wrapped.
      -- @vis table
      -- @end
      select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            expected: |-
              /**
               * @param Revenue per region, which is long enough to be wrapped.
               * @vis table
               */
              select 1;
          - mode: pretty
            expected: |-
              /**
               * @param Revenue per region, which is long enough to be wrapped.
               * @vis table
               */
              select 1;

  - name: vis_line_comments_to_block
    input: |-
      -- @vis vegalite
      -- {"mark": "bar", "encoding": {"x": {"field": "region"}}}
      -- @end
      select region from sales
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select region from sales;
          - mode: compact
            expected: |-
              /**
               * @vis vegalite
               * {"mark": "bar", "encoding": {"x": {"field": "region"}}}
               */
              select region from sales;
          - mode: pretty
            expected: |-
              /**
               * @vis vegalite
               * {"mark": "bar", "encoding": {"x": {"field": "region"}}}
               */
              select region
              from sales;

  - name: vis_line_comments_several_tags
    input: |-
      -- Revenue dashboard.
      -- @param Revenue per region.
      -- @board width=6 height=3
      -- @vis table
      -- @end
      select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            expected: |-
              /**
               * Revenue dashboard.
               *
               * @param Revenue per region.
               * @board width=6 height=3
               * @vis table
               */
              select 1;
          - mode: pretty
            expected: |-
              /**
               * Revenue dashboard.
               *
               * @param Revenue per region.
               * @board width=6 height=3
               * @vis table
               */
              select 1;

  - name: vis_block_comment_several_tags
    input: |-
      /* Revenue dashboard.
            @param Revenue per region.
        @vis    card   width=6  height=3
            @vis vegalite {"mark":"bar"}
      */
      select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            expected: |-
              /**
               * Revenue dashboard.
               *
               * @param Revenue per region.
               * @board width=6 height=3
               * @vis vegalite
               * {"mark": "bar"}
               */
              select 1;
          - mode: pretty
            expected: |-
              /**
               * Revenue dashboard.
               *
               * @param Revenue per region.
               * @board width=6 height=3
               * @vis vegalite
               * {"mark": "bar"}
               */
              select 1;

  - name: vis_inline_json
    input: |-
      /* @vis vegalite {"mark": {"type": "line", "point": true}, "encoding": {"x": {"field": "date", "type": "temporal"}, "y": {"field": "revenue", "aggregate": "sum"}}} */
      /*@vis   board  width=12 */
      select date, revenue from sales
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select date, revenue from sales;
          - mode: compact
            expected: |-
              /**
               * @vis vegalite
               * {
               *   "mark": {"type": "line", "point": true},
               *   "encoding": {"x": {"field": "date", "type": "temporal"}, "y": {"field": "revenue", "aggregate": "sum"}}
               * }
               * @board width=12
               */
              select date, revenue from sales;
          - mode: pretty
            expected: |-
              /**
               * @vis vegalite
               * {
               *   "mark": {"type": "line", "point": true},
               *   "encoding": {"x": {"field": "date", "type": "temporal"}, "y": {"field": "revenue", "aggregate": "sum"}}
               * }
               * @board width=12
               */
              select date, revenue
              from sales;

  - name: vis_json_breaks_at_the_width
    input: |-
      /* @vis vegalite {"layer": [{"mark": {"type": "bar", "tooltip": true}, "encoding": {"x": {"field": "region", "type": "nominal", "sort": "-y"}, "y": {"field": "revenue", "type": "quantitative", "aggregate": "sum"}}}, {"mark": {"type": "rule", "color": "red"}, "encoding": {"y": {"datum": 1000}}}]} */
      select region, revenue from sales
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select region, revenue from sales;
          - mode: compact
            width: 80
            expected: |-
              /**
               * @vis vegalite
               * {
               *   "layer": [
               *     {
               *       "mark": {"type": "bar", "tooltip": true},
               *       "encoding": {
               *         "x": {"field": "region", "type": "nominal", "sort": "-y"},
               *         "y": {"field": "revenue", "type": "quantitative", "aggregate": "sum"}
               *       }
               *     },
               *     {
               *       "mark": {"type": "rule", "color": "red"},
               *       "encoding": {"y": {"datum": 1000}}
               *     }
               *   ]
               * }
               */
              select region, revenue from sales;
          - mode: pretty
            width: 80
            expected: |-
              /**
               * @vis vegalite
               * {
               *   "layer": [
               *     {
               *       "mark": {"type": "bar", "tooltip": true},
               *       "encoding": {
               *         "x": {"field": "region", "type": "nominal", "sort": "-y"},
               *         "y": {"field": "revenue", "type": "quantitative", "aggregate": "sum"}
               *       }
               *     },
               *     {
               *       "mark": {"type": "rule", "color": "red"},
               *       "encoding": {"y": {"datum": 1000}}
               *     }
               *   ]
               * }
               */
              select region, revenue
              from sales;

  - name: vis_malformed_json_and_markdown
    input: |-
      /* @vis vegalite
         {"mark": "bar",
      */
      select 1;
      /* @vis markdown
         ### {{metric}}
         - {{value}}
           - {{detail}}
      */
      select 'a' as metric, 1 as value, 'x' as detail
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;

              select 'a' as metric, 1 as value, 'x' as detail;
          - mode: compact
            expected: |-
              /**
               * @vis vegalite
               * {"mark": "bar",
               */
              select 1;

              /**
               * @vis markdown
               * ### {{metric}}
               * - {{value}}
               *   - {{detail}}
               */
              select 'a' as metric, 1 as value, 'x' as detail;
          - mode: pretty
            expected: |-
              /**
               * @vis vegalite
               * {"mark": "bar",
               */
              select 1;

              /**
               * @vis markdown
               * ### {{metric}}
               * - {{value}}
               *   - {{detail}}
               */
              select 'a' as metric, 1 as value, 'x' as detail;

  - name: vis_line_comments_with_comment_end
    input: |-
      -- @vis markdown
      -- see */ here
      -- @end
      select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            expected: |-
              -- @vis markdown
              -- see */ here
              -- @end
              select 1;
          - mode: pretty
            expected: |-
              -- @vis markdown
              -- see */ here
              -- @end
              select 1;

  - name: annotation_comments_are_merged
    input: |-
      -- @param
      -- Add to and subtract from timestamps and measure the distance between them.
      -- @end

      /* @vis vegalite
         {"mark": "bar"}
      */
      /* @board width=6 */
      select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            expected: |-
              /**
               * @param
               * Add to and subtract from timestamps and measure the distance between them.
               * @vis vegalite
               * {"mark": "bar"}
               * @board width=6
               */
              select 1;
          - mode: pretty
            expected: |-
              /**
               * @param
               * Add to and subtract from timestamps and measure the distance between them.
               * @vis vegalite
               * {"mark": "bar"}
               * @board width=6
               */
              select 1;

  - name: annotation_comments_with_ordinary_comments
    input: |-
      /* @param Revenue. */
      -- a note
      /* @vis table */
      select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            expected: |-
              /**
               * a note
               *
               * @param Revenue.
               * @vis table
               */
              select 1;
          - mode: pretty
            expected: |-
              /**
               * a note
               *
               * @param Revenue.
               * @vis table
               */
              select 1;

  - name: comment_tag_without_name
    input: |-
      -- @
      -- text
      select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            expected: |-
              -- @ text
              select 1;
          - mode: pretty
            expected: |-
              -- @ text
              select 1;

  - name: comment_crlf_block
    input: |-
      -- first line
      -- second line
      select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            expected: |-
              -- first line second line
              select 1;
          - mode: pretty
            expected: |-
              -- first line second line
              select 1;

  - name: blank_line_after_block_comment
    input: |-
      /* Separated */

      select 1;

      /* Attached */
      select 2;
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;

              select 2;
          - mode: compact
            expected: |-
              /* Separated */

              select 1;

              /* Attached */
              select 2;
          - mode: pretty
            expected: |-
              /* Separated */

              select 1;

              /* Attached */
              select 2;

  - name: blank_line_after_line_comment
    input: |-
      -- Separated

      select 1;
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;
          - mode: compact
            expected: |-
              -- Separated

              select 1;
          - mode: pretty
            expected: |-
              -- Separated

              select 1;
