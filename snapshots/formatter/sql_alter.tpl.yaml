formatter-snapshots:
  # Validation runs the output of every mode in one database, so what it runs undoes itself
  - name: alter_table_add_and_drop_column
    input: ALTER  TABLE  t  ADD  b  INT; alter table t drop b
    dialects:
      hyper:
        validation:
          setup: create table t(a int);
  - name: alter_table_rename_column
    input: alter table t rename a to b; alter table t rename column b to a
    dialects:
      hyper:
        validation:
          setup: create table t(a int);
  - name: alter_table_rename
    input: alter table s.t rename to u; alter table s.u rename to t
    dialects:
      hyper:
        validation:
          setup: create schema s; create table s.t(a int);
  - name: alter_table_if_exists
    input: alter table if exists t add column if not exists b int not null default 1
    dialects:
      hyper:
  - name: alter_table_drop_column_if_exists
    input: alter table t drop if exists a
    dialects:
      hyper:
  - name: alter_table_set_schema
    input: alter table t set schema s
    dialects:
      hyper:
  - name: alter_table_column_type
    input: alter table t alter a type bigint
    dialects:
      hyper:
  - name: alter_table_actions
    input: alter table t add column a int, drop column b, rename column c to d
    dialects:
      hyper:
  - name: alter_table_drop_column_condition_after
    input: alter table t add column b int; alter table t drop b if exists
    dialects:
      hyper:
        validation:
          setup: create table t(a int);
  - name: alter_table_drop_column_behavior
    input: alter table t drop column a cascade; alter table t drop column if exists b restrict; alter table t drop c if exists cascade
    dialects:
      hyper:
  - name: alter_table_column_type_using
    input: alter table t alter column a type bigint using a::bigint; alter table t alter b set data type text
    dialects:
      hyper:
  - name: alter_view
    input: alter  view  if exists s.v rename to w; alter view w set schema o
    dialects:
      hyper:
  - name: schema_statements
    input: CREATE  SCHEMA IF NOT EXISTS s; alter schema s rename to o; drop schema o; drop schema if exists d.s cascade; drop schema r restrict
    dialects:
      hyper:
