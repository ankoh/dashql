formatter-snapshots:

  - name: coverage_call_no_args
    input: |-
      CALL  foo( )
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              call foo ();
          - mode: compact
            expected: |-
              call foo ();
          - mode: pretty
            expected: |-
              call foo ();

  - name: coverage_call_options
    input: |-
      CALL cdp.segment_list (BATCH_SIZE=>200,"Quoted"=>'x', b => -1.5, c => TRUE, d => null, e => $$raw  text$$)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              call cdp.segment_list (BATCH_SIZE => 200, "Quoted" => 'x', b => -1.5, c => TRUE, d => null, e => $$raw  text$$);
          - mode: compact
            expected: |-
              call cdp.segment_list (BATCH_SIZE => 200, "Quoted" => 'x', b => -1.5, c => TRUE, d => null, e => $$raw  text$$);
          - mode: pretty
            expected: |-
              call cdp.segment_list (BATCH_SIZE => 200, "Quoted" => 'x', b => -1.5, c => TRUE, d => null, e => $$raw  text$$);

  - name: coverage_call_nested
    input: |-
      call t.f(a=>(b=1,c=(d=[1,2],e=[(f=1),(g=2)])),h=>[],i=>())
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              call t.f (a => (b = 1, c = (d = [1, 2], e = [(f = 1), (g = 2)])), h => [], i => ());
          - mode: compact
            expected: |-
              call t.f (a => (b = 1, c = (d = [1, 2], e = [(f = 1), (g = 2)])), h => [], i => ());
          - mode: pretty
            expected: |-
              call t.f (a => (b = 1, c = (d = [1, 2], e = [(f = 1), (g = 2)])), h => [], i => ());

  - name: coverage_call_sql_and_secret
    input: |-
      call t.f(a=>(select x from y where z>1),b=>secret(pw),c=>:param)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              call t.f (a => (select x from y where z > 1), b => secret(pw), c => :param);
          - mode: compact
            expected: |-
              call t.f (a => (select x from y where z > 1), b => secret(pw), c => :param);
          - mode: pretty
            expected: |-
              call t.f (
                a => (
                  select x
                  from y
                  where z > 1
                ),
                b => secret(pw),
                c => :param
              );

  - name: coverage_call_explain
    input: |-
      explain call t.f(a=>1)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              explain call t.f (a => 1);
          - mode: compact
            expected: |-
              explain call t.f (a => 1);
          - mode: pretty
            expected: |-
              explain call t.f (a => 1);

  - name: coverage_call_long
    input: |-
      call cdp.segment_create (dataspace => 'default', display_name => 'Any high-value order', description => 'Individuals with an order over 5000', include_dbt => (models = (models = [(name = 'any_high_value_order', sql = (select distinct a from b join c on d = e where f > 5000))])));
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              call cdp.segment_create (dataspace => 'default', display_name => 'Any high-value order', description => 'Individuals with an order over 5000', include_dbt => (models = (models = [(name = 'any_high_value_order', sql = (select distinct a from b join c on d = e where f > 5000))])));
          - mode: compact
            expected: |-
              call cdp.segment_create (
                dataspace => 'default', display_name => 'Any high-value order', description => 'Individuals with an order over 5000',
                include_dbt => (
                  models = (
                    models = [(name = 'any_high_value_order', sql = (select distinct a from b join c on d = e where f > 5000))]
                  )
                )
              );
          - mode: pretty
            expected: |-
              call cdp.segment_create (
                dataspace => 'default',
                display_name => 'Any high-value order',
                description => 'Individuals with an order over 5000',
                include_dbt => (
                  models = (
                    models = [(
                      name = 'any_high_value_order',
                      sql = (
                        select distinct a
                        from b
                          join c on d = e
                        where f > 5000
                      )
                    )]
                  )
                )
              );

  - name: coverage_call_one_argument_per_line
    input: |-
      call cdp.document_ai_schema_generate (ml_model => 'llmgateway__VertexAIGemini25Flash001', files => [(file_id = :file_id)], x => 1, yy => 22);
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              call cdp.document_ai_schema_generate (ml_model => 'llmgateway__VertexAIGemini25Flash001', files => [(file_id = :file_id)], x => 1, yy => 22);
          - mode: compact
            expected: |-
              call cdp.document_ai_schema_generate (
                ml_model => 'llmgateway__VertexAIGemini25Flash001', files => [(file_id = :file_id)], x => 1, yy => 22
              );
          - mode: pretty
            expected: |-
              call cdp.document_ai_schema_generate (
                ml_model => 'llmgateway__VertexAIGemini25Flash001',
                files => [(file_id = :file_id)],
                x => 1,
                yy => 22
              );

  - name: coverage_call_array_of_objects
    input: |-
      call cdp.dmo_mapping_create (single => [(source_field_developer_name = 'order_id__c', target_field_developer_name = 'OrderId__c', other_field_developer_name = 'x')], field_mapping => [(source_field_developer_name = 'order_id__c', target_field_developer_name = 'OrderId__c'), (source_field_developer_name = 'individual_id__c', target_field_developer_name = 'IndividualId__c')]);
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              call cdp.dmo_mapping_create (single => [(source_field_developer_name = 'order_id__c', target_field_developer_name = 'OrderId__c', other_field_developer_name = 'x')], field_mapping => [(source_field_developer_name = 'order_id__c', target_field_developer_name = 'OrderId__c'), (source_field_developer_name = 'individual_id__c', target_field_developer_name = 'IndividualId__c')]);
          - mode: compact
            expected: |-
              call cdp.dmo_mapping_create (
                single => [(
                  source_field_developer_name = 'order_id__c', target_field_developer_name = 'OrderId__c',
                  other_field_developer_name = 'x'
                )],
                field_mapping => [
                  (source_field_developer_name = 'order_id__c', target_field_developer_name = 'OrderId__c'), (
                    source_field_developer_name = 'individual_id__c', target_field_developer_name = 'IndividualId__c'
                  )
                ]
              );
          - mode: pretty
            expected: |-
              call cdp.dmo_mapping_create (
                single => [(
                  source_field_developer_name = 'order_id__c',
                  target_field_developer_name = 'OrderId__c',
                  other_field_developer_name = 'x'
                )],
                field_mapping => [
                  (source_field_developer_name = 'order_id__c', target_field_developer_name = 'OrderId__c'),
                  (source_field_developer_name = 'individual_id__c', target_field_developer_name = 'IndividualId__c')
                ]
              );

  - name: coverage_call_object_one_field_per_line
    input: |-
      call t.f (advanced_attributes => (database = 'ANALYTICS_ANALYTICS_ANALYTICS', schema = 'PUBLIC_PUBLIC_PUBLIC', object = 'CUSTOMER_ORDERS_CUSTOMER_ORDERS_CUSTOMER'));
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              call t.f (advanced_attributes => (database = 'ANALYTICS_ANALYTICS_ANALYTICS', schema = 'PUBLIC_PUBLIC_PUBLIC', object = 'CUSTOMER_ORDERS_CUSTOMER_ORDERS_CUSTOMER'));
          - mode: compact
            expected: |-
              call t.f (
                advanced_attributes => (
                  database = 'ANALYTICS_ANALYTICS_ANALYTICS', schema = 'PUBLIC_PUBLIC_PUBLIC',
                  object = 'CUSTOMER_ORDERS_CUSTOMER_ORDERS_CUSTOMER'
                )
              );
          - mode: pretty
            expected: |-
              call t.f (
                advanced_attributes => (
                  database = 'ANALYTICS_ANALYTICS_ANALYTICS',
                  schema = 'PUBLIC_PUBLIC_PUBLIC',
                  object = 'CUSTOMER_ORDERS_CUSTOMER_ORDERS_CUSTOMER'
                )
              );

  - name: coverage_call_multiline_string
    input: |-
      call t.f (id => :job_id, csv => $$id,total
      o-1,77506
      $$);
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              call t.f (id => :job_id, csv => $$id,total
              o-1,77506
              $$);
          - mode: compact
            expected: |-
              call t.f (id => :job_id, csv => $$id,total
              o-1,77506
              $$);
          - mode: pretty
            expected: |-
              call t.f (id => :job_id, csv => $$id,total
              o-1,77506
              $$);

  - name: call_description_blank_line
    input: |-
      /**
       * The description.
       */

      call t.f (a => 1);
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              call t.f (a => 1);
          - mode: compact
            expected: |-
              /**
               * The description.
               */

              call t.f (a => 1);
          - mode: pretty
            expected: |-
              /**
               * The description.
               */

              call t.f (a => 1);
