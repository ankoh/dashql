formatter-snapshots:
  - name: pipe_preserve_where_select
    input: |-
      from sales |> where revenue > 0 |> select region, revenue as amount
    dialects:
      hyper:

  - name: pipe_preserve_all_stages
    input: |-
      from sales |> extend revenue * 1.2 as adjusted |> aggregate sum(adjusted) as total group by region |> distinct |> as totals |> left join regions as r using (region) |> order by total desc |> limit 10 offset 5
    dialects:
      hyper:

  - name: pipe_preserve_combine_with
    input: |-
      with archive as (select * from archived_sales) from sales |> union all (from archive), (select * from forecast_sales)
    dialects:
      hyper:

  - name: pipe_lower_where_select
    input: |-
      from sales |> where revenue > 0 |> select region, revenue as amount
    dialects:
      hyper:
        formatted:
          - mode: inline
            lower-pipes: true
          - mode: compact
            lower-pipes: true
          - mode: pretty
            lower-pipes: true

  - name: pipe_lower_bare_from
    input: |-
      from sales
    dialects:
      hyper:
        formatted:
          - mode: compact
            lower-pipes: true

  - name: pipe_lower_alias_reference
    input: |-
      from sales |> as s |> left join regions as r on s.region_id = r.id
    dialects:
      hyper:
        formatted:
          - mode: compact
            lower-pipes: true

  - name: pipe_lower_extend_aggregate
    input: |-
      from sales |> extend revenue * 1.2 as adjusted |> aggregate sum(adjusted) as total group by region
    dialects:
      hyper:
        formatted:
          - mode: inline
            lower-pipes: true
          - mode: compact
            lower-pipes: true
          - mode: pretty
            lower-pipes: true

  - name: pipe_lower_explicit_aggregate_group
    input: |-
      from sales |> aggregate region, sum(revenue) as total group by region
    dialects:
      hyper:
        formatted:
          - mode: inline
            lower-pipes: true

  - name: pipe_lower_with_join
    input: |-
      with regions as (select * from region_dim) from sales |> join regions using (region_id)
    dialects:
      hyper:
        formatted:
          - mode: compact
            lower-pipes: true

  - name: pipe_lower_union_from
    input: |-
      from current_sales |> union all (from archived_sales), (select * from forecast_sales)
    dialects:
      hyper:
        formatted:
          - mode: compact
            lower-pipes: true

  - name: pipe_lower_dialects
    input: |-
      from sales |> where revenue > 0
    dialects:
      hyper:
        formatted:
          - mode: compact
            lower-pipes: true
      trino:
        formatted:
          - mode: compact
            lower-pipes: true
