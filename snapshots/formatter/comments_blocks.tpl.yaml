formatter-snapshots:

  # Blank lines between line comment paragraphs
  - name: comment_paragraphs
    input: |-
      -- First paragraph of the comment that is long enough to wrap.
      --
      -- Second paragraph of the comment that is also long enough to wrap.
      select 1
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 30
          - mode: pretty
            width: 30

  # A comment that consists of the marker only
  - name: comment_empty_marker
    input: |-
      --
      select 1
    dialects:
      hyper:

  # Empty comment lines at the start and the end are dropped
  - name: comment_empty_edges
    input: |-
      --
      -- text
      --
      select 1
    dialects:
      hyper:

  # A word that is longer than the width
  - name: comment_long_word
    input: |-
      -- short averyveryveryveryveryverylongwordthatdoesnotfit end
      select 1
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 20

  # A word that starts after other words and has to be split
  - name: comment_split_after_words
    input: |-
      -- ab cdefghijklmnopqrstuvwxyz
      select 1
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 20

  # A tagged region of line comments ends with the run, it needs no end line
  - name: comment_region_without_end
    input: |-
      -- @description
      -- Text that is not closed and wraps because it is quite long.
      select 1
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 30

  # Tag followed by text and region directly after other comments
  - name: comment_region_after_comments
    input: |-
      -- Leading text that wraps because it is quite long.
      -- @description extra
      -- content inside the region
      -- @end
      -- @metadata
      -- { "a": 1 }
      -- @end
      -- trailing text
      select 1
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 30

  # Two regions directly after each other
  - name: comment_adjacent_regions
    input: |-
      -- @description
      -- one
      -- @end
      -- @metadata
      -- two
      -- @end
      select 1
    dialects:
      hyper:

  # The next tag line closes a region, an end line of an older script is accepted
  - name: comment_regions_one_end_line
    input: |-
      -- @description Revenue per region, which is long enough to be wrapped.
      -- @vis table
      -- @end
      select 1
    dialects:
      hyper:

  # A tagged region of line comments is printed as a Javadoc-style comment
  - name: vis_line_comments_to_block
    input: |-
      -- @vis vegalite
      -- {"mark": "bar", "encoding": {"x": {"field": "region"}}}
      -- @end
      select region from sales
    dialects:
      hyper:

  # Several tags of a line comment run become one comment, text before the tags stays a line comment
  - name: vis_line_comments_several_tags
    input: |-
      -- Revenue dashboard.
      -- @description Revenue per region.
      -- @vis card width=6 height=3
      -- @vis table
      -- @end
      select 1
    dialects:
      hyper:

  # A block comment with several tags and uneven indentation
  - name: vis_block_comment_several_tags
    input: |-
      /* Revenue dashboard.
            @description Revenue per region.
        @vis    card   width=6  height=3
            @vis vegalite {"mark":"bar"}
      */
      select 1
    dialects:
      hyper:

  # Inline JSON is printed compactly, the card header gets single spaces
  - name: vis_inline_json
    input: |-
      /* @vis vegalite {"mark": {"type": "line", "point": true}, "encoding": {"x": {"field": "date", "type": "temporal"}, "y": {"field": "revenue", "aggregate": "sum"}}} */
      /*@vis   card  width=12 */
      select date, revenue from sales
    dialects:
      hyper:

  # JSON objects and arrays that don't fit in the line put each entry on a line of their own
  - name: vis_json_breaks_at_the_width
    input: |-
      /* @vis vegalite {"layer": [{"mark": {"type": "bar", "tooltip": true}, "encoding": {"x": {"field": "region", "type": "nominal", "sort": "-y"}, "y": {"field": "revenue", "type": "quantitative", "aggregate": "sum"}}}, {"mark": {"type": "rule", "color": "red"}, "encoding": {"y": {"datum": 1000}}}]} */
      select region, revenue from sales
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 80
          - mode: pretty
            width: 80

  # Malformed JSON and Markdown are kept as written
  - name: vis_malformed_json_and_markdown
    input: |-
      /* @vis vegalite
         {"mark": "bar",
      */
      select 1;
      /* @vis markdown
         ### {{metric}}
         - {{value}}
           - {{detail}}
      */
      select 'a' as metric, 1 as value, 'x' as detail
    dialects:
      hyper:

  # A body that would end a block comment keeps the line form
  - name: vis_line_comments_with_comment_end
    input: |-
      -- @vis markdown
      -- see */ here
      -- @end
      select 1
    dialects:
      hyper:

  # The tagged comments of a statement are merged into one comment, blank lines between them go
  - name: annotation_comments_are_merged
    input: |-
      -- @description
      -- Add to and subtract from timestamps and measure the distance between them.
      -- @end

      /* @vis vegalite
         {"mark": "bar"}
      */
      /* @vis card width=6 */
      select 1
    dialects:
      hyper:

  # Ordinary comments between tagged comments keep them apart
  - name: annotation_comments_with_ordinary_comments
    input: |-
      /* @description Revenue. */
      -- a note
      /* @vis table */
      select 1
    dialects:
      hyper:

  # A tag marker without a name
  - name: comment_tag_without_name
    input: |-
      -- @
      -- text
      select 1
    dialects:
      hyper:

  # Windows line endings in a block comment
  - name: comment_crlf_block
    input: "-- first line\r\n-- second line\r\nselect 1"
    dialects:
      hyper:
