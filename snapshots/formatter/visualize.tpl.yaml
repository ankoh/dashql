formatter-snapshots:

  - name: vis_table_source
    input: |-
      select * from sales visualize using vegalite (mark => bar)
    dialects:
      hyper:

  - name: vis_qualified_source
    input: |-
      select * from warehouse.public.sales visualize using vegalite (mark => point)
    dialects:
      hyper:

  - name: vis_select_source
    input: |-
      select * from sales visualize using vegalite (mark => line)
    dialects:
      hyper:

  - name: vis_cte_union_source
    input: |-
      with events as (select * from source), aggregates_other as (select ts_hour, sum(cpu_time) as metric, 'other' as target from events where not marker group by ts_hour, marker), aggregates_filtered as (select ts_hour, sum(cpu_time) as metric, 'filtered' as target from events where marker group by ts_hour) select * from aggregates_other union all select * from aggregates_filtered visualize using vegalite (mark => bar, encoding => (x => (field => ts_hour, type => temporal), y => (field => metric, type => quantitative), color => (field => target)))
    dialects:
      hyper:

  - name: vis_multi_spec_keys
    input: |-
      select * from sales visualize using vegalite (mark => line, dashboard => (row => 1, column => 2, width => 8, height => 4))
    dialects:
      hyper:

  - name: vis_encoding_simple
    input: |-
      select * from sales visualize using vegalite (mark => bar, encoding => (x => (field => category, type => nominal), y => (field => revenue, type => quantitative)))
    dialects:
      hyper:

  - name: vis_encoding_narrow
    input: |-
      select * from sales visualize using vegalite (mark => bar, encoding => (x => (field => category, type => nominal), y => (field => revenue, type => quantitative)))
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 60

  - name: vis_scale_with_array
    input: |-
      select * from sales visualize using vegalite (encoding => (x => (field => time, type => temporal, scale => (domain => [0, 100]))))
    dialects:
      hyper:

  - name: vis_encoding_shorthand
    input: |-
      select * from sales visualize using vegalite (mark => bar, encoding => (x => date, y => revenue))
    dialects:
      hyper:

  - name: vis_trailing_comma_spec
    input: |-
      select * from sales visualize using vegalite (mark => line, dashboard => (width => 8,),)
    dialects:
      hyper:

  - name: vis_trailing_comma_nested
    input: |-
      select * from sales visualize using vegalite (mark => bar, encoding => (x => (field => date, type => temporal,), y => (field => revenue,),),)
    dialects:
      hyper:

  - name: vis_umap_minimal
    input: |-
      select * from embeddings visualize using umap (vector => embedding)
    dialects:
      hyper:

  - name: vis_umap_full
    input: |-
      select * from embeddings visualize using umap (vector => embedding, category => cluster_id, label => name, neighbors => 15, min_dist => 0.1, metric => cosine)
    dialects:
      hyper:

  - name: vis_markdown
    input: |-
      select product, revenue from product_summary visualize using markdown (template => '## {{product}}: {{revenue}}')
    dialects:
      hyper:

  - name: vis_table
    input: |-
      select product, revenue from product_summary visualize using table (dashboard => (column => 3, width => 9))
    dialects:
      hyper:

  - name: vis_full_example
    input: |-
      select * from sales visualize using vegalite (mark => line, encoding => (x => (field => time, type => temporal), y => (field => value, type => quantitative)), dashboard => (width => 8))
    dialects:
      hyper:
