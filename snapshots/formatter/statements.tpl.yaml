formatter-snapshots:

  - name: coverage_create_table_as
    input: create table if not exists analytics.result as select 1 as value
    dialects:
      hyper:
        validation:
          setup: create schema memory.analytics;

  - name: coverage_create_table_as_modifiers
    input: create temporary table if not exists result (value) on commit preserve rows as select 1 with no data
    dialects:
      hyper:

  - name: coverage_create_table_as_global_with_data
    input: create global temporary table result as select 1 with data
    dialects:
      hyper:

  - name: coverage_create_view
    input: create view analytics.result (value) as select 1
    dialects:
      hyper:

  - name: coverage_create_temporary_view
    input: create temporary view result as select 1
    dialects:
      hyper:

  - name: coverage_create_or_replace_temporary_view
    input: create or replace temp view result as select 1
    dialects:
      hyper:

  - name: coverage_create_or_replace_view_wrap_after_as
    input: create or replace view analytics.result as select * from analytics.source
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 65

  - name: coverage_create_function
    input: create function analytics.render(value int, label varchar) returns varchar
    dialects:
      hyper:

  - name: coverage_create_aggregate
    input: create aggregate analytics.total(value int) returns int
    dialects:
      hyper:

  - name: coverage_set_scalar
    input: SET variable = 'value'
    dialects:
      hyper:

  - name: coverage_set_nested
    input: SET variable = ('some' = 42, 'nested' = ('enabled' = true), 'values' = [43, 44])
    dialects:
      hyper:

  - name: coverage_create_table_modifiers
    input: create unlogged table result (value int) on commit drop
    dialects:
      hyper:

  - name: coverage_create_table_delete_rows
    input: create temporary table result (value int) on commit delete rows
    dialects:
      hyper:
  - name: coverage_drop_table
    input: DROP TABLE IF EXISTS analytics.result
    dialects:
      hyper:

  - name: coverage_drop_view
    input: DROP VIEW analytics.result
    dialects:
      hyper:

  - name: coverage_attach_database
    input: ATTACH DATABASE "path/to/source.hyper" AS source
    dialects:
      hyper:

  - name: coverage_attach_local_database_options
    input: ATTACH LOCAL DATABASE local_source AS attached WITH (access_mode='readonly', encryption_key=DEFAULT)
    dialects:
      hyper:
