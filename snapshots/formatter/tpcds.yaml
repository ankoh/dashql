  - name: coverage_tpcds_02
    input: |-
      WITH wscs AS
        (SELECT sold_date_sk,
                sales_price
         FROM
           (SELECT ws_sold_date_sk sold_date_sk,
                   ws_ext_sales_price sales_price
            FROM web_sales
            UNION ALL SELECT cs_sold_date_sk sold_date_sk,
                             cs_ext_sales_price sales_price
            FROM catalog_sales) sq1),
           wswscs AS
        (SELECT d_week_seq,
                sum(CASE
                        WHEN (d_day_name='Sunday') THEN sales_price
                        ELSE NULL
                    END) sun_sales,
                sum(CASE
                        WHEN (d_day_name='Monday') THEN sales_price
                        ELSE NULL
                    END) mon_sales,
                sum(CASE
                        WHEN (d_day_name='Tuesday') THEN sales_price
                        ELSE NULL
                    END) tue_sales,
                sum(CASE
                        WHEN (d_day_name='Wednesday') THEN sales_price
                        ELSE NULL
                    END) wed_sales,
                sum(CASE
                        WHEN (d_day_name='Thursday') THEN sales_price
                        ELSE NULL
                    END) thu_sales,
                sum(CASE
                        WHEN (d_day_name='Friday') THEN sales_price
                        ELSE NULL
                    END) fri_sales,
                sum(CASE
                        WHEN (d_day_name='Saturday') THEN sales_price
                        ELSE NULL
                    END) sat_sales
         FROM wscs,
              date_dim
         WHERE d_date_sk = sold_date_sk
         GROUP BY d_week_seq)
      SELECT d_week_seq1,
             round(sun_sales1/sun_sales2, 2) r1,
             round(mon_sales1/mon_sales2, 2) r2,
             round(tue_sales1/tue_sales2, 2) r3,
             round(wed_sales1/wed_sales2, 2) r4,
             round(thu_sales1/thu_sales2, 2) r5,
             round(fri_sales1/fri_sales2, 2) r6,
             round(sat_sales1/sat_sales2, 2)
      FROM
        (SELECT wswscs.d_week_seq d_week_seq1,
                sun_sales sun_sales1,
                mon_sales mon_sales1,
                tue_sales tue_sales1,
                wed_sales wed_sales1,
                thu_sales thu_sales1,
                fri_sales fri_sales1,
                sat_sales sat_sales1
         FROM wswscs,
              date_dim
         WHERE date_dim.d_week_seq = wswscs.d_week_seq
           AND d_year = 2001) y,
        (SELECT wswscs.d_week_seq d_week_seq2,
                sun_sales sun_sales2,
                mon_sales mon_sales2,
                tue_sales tue_sales2,
                wed_sales wed_sales2,
                thu_sales thu_sales2,
                fri_sales fri_sales2,
                sat_sales sat_sales2
         FROM wswscs,
              date_dim
         WHERE date_dim.d_week_seq = wswscs.d_week_seq
           AND d_year = 2001+1) z
      WHERE d_week_seq1 = d_week_seq2-53
      ORDER BY d_week_seq1 NULLS FIRST;
    dialects:
      duckdb:
        formatted:
          - mode: inline
            expected: |-
              with wscs as (select sold_date_sk, sales_price from (select ws_sold_date_sk as sold_date_sk, ws_ext_sales_price as sales_price from web_sales union all select cs_sold_date_sk as sold_date_sk, cs_ext_sales_price as sales_price from catalog_sales) sq1), wswscs as (select d_week_seq, sum(case when d_day_name = 'Sunday' then sales_price else NULL end) as sun_sales, sum(case when d_day_name = 'Monday' then sales_price else NULL end) as mon_sales, sum(case when d_day_name = 'Tuesday' then sales_price else NULL end) as tue_sales, sum(case when d_day_name = 'Wednesday' then sales_price else NULL end) as wed_sales, sum(case when d_day_name = 'Thursday' then sales_price else NULL end) as thu_sales, sum(case when d_day_name = 'Friday' then sales_price else NULL end) as fri_sales, sum(case when d_day_name = 'Saturday' then sales_price else NULL end) as sat_sales from wscs, date_dim where d_date_sk = sold_date_sk group by d_week_seq) select d_week_seq1, round(sun_sales1 / sun_sales2, 2) as r1, round(mon_sales1 / mon_sales2, 2) as r2, round(tue_sales1 / tue_sales2, 2) as r3, round(wed_sales1 / wed_sales2, 2) as r4, round(thu_sales1 / thu_sales2, 2) as r5, round(fri_sales1 / fri_sales2, 2) as r6, round(sat_sales1 / sat_sales2, 2) from (select wswscs.d_week_seq as d_week_seq1, sun_sales as sun_sales1, mon_sales as mon_sales1, tue_sales as tue_sales1, wed_sales as wed_sales1, thu_sales as thu_sales1, fri_sales as fri_sales1, sat_sales as sat_sales1 from wswscs, date_dim where date_dim.d_week_seq = wswscs.d_week_seq and d_year = 2001) y, (select wswscs.d_week_seq as d_week_seq2, sun_sales as sun_sales2, mon_sales as mon_sales2, tue_sales as tue_sales2, wed_sales as wed_sales2, thu_sales as thu_sales2, fri_sales as fri_sales2, sat_sales as sat_sales2 from wswscs, date_dim where date_dim.d_week_seq = wswscs.d_week_seq and d_year = 2001 + 1) z where d_week_seq1 = d_week_seq2 - 53 order by d_week_seq1 nulls first;
          - mode: compact
