             (ws3.web_sales*1.0000)/ws2.web_sales web_q2_q3_increase ,
             (ss3.store_sales*1.0000)/ss2.store_sales store_q2_q3_increase
      FROM ss ss1 ,
           ss ss2 ,
           ss ss3 ,
           ws ws1 ,
           ws ws2 ,
           ws ws3
      WHERE ss1.d_qoy = 1
        AND ss1.d_year = 2000
        AND ss1.ca_county = ss2.ca_county
        AND ss2.d_qoy = 2
        AND ss2.d_year = 2000
