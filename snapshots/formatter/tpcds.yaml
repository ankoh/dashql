                    group by s_state
                  ) tmp1
                  where ranking <= 5
                )
              group by rollup(s_state, s_county)
              order by lochierarchy desc, case when grouping(s_state) + grouping(s_county) = 0 then s_state end, rank_within_parent
              limit 100;
          - mode: pretty
