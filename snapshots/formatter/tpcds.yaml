                  and ss_customer_sk = c_customer_sk
                  and ss_cdemo_sk = cd1.cd_demo_sk
                  and ss_hdemo_sk = hd1.hd_demo_sk
                  and ss_addr_sk = ad1.ca_address_sk
                  and ss_item_sk = i_item_sk
                  and ss_item_sk = sr_item_sk
                  and ss_ticket_number = sr_ticket_number
                  and ss_item_sk = cs_ui.cs_item_sk
                  and c_current_cdemo_sk = cd2.cd_demo_sk
                  and c_current_hdemo_sk = hd2.hd_demo_sk
                  and c_current_addr_sk = ad2.ca_address_sk
                  and c_first_sales_date_sk = d2.d_date_sk
                  and c_first_shipto_date_sk = d3.d_date_sk
                  and ss_promo_sk = p_promo_sk
                  and hd1.hd_income_band_sk = ib1.ib_income_band_sk
                  and hd2.hd_income_band_sk = ib2.ib_income_band_sk
                  and cd1.cd_marital_status <> cd2.cd_marital_status
                  and i_color in ('purple', 'burlywood', 'indian', 'spring', 'floral', 'medium')
                  and i_current_price between 64 and 64 + 10
                  and i_current_price between 64 + 1 and 64 + 15
                group by i_product_name,
                  i_item_sk,
                  s_store_name,
                  s_zip,
                  ad1.ca_street_number,
                  ad1.ca_street_name,
                  ad1.ca_city,
                  ad1.ca_zip,
                  ad2.ca_street_number,
                  ad2.ca_street_name,
                  ad2.ca_city,
                  ad2.ca_zip,
                  d1.d_year,
                  d2.d_year,
                  d3.d_year
              )
              select cs1.product_name,
                cs1.store_name,
                cs1.store_zip,
                cs1.b_street_number,
                cs1.b_street_name,
                cs1.b_city,
                cs1.b_zip,
                cs1.c_street_number,
                cs1.c_street_name,
                cs1.c_city,
                cs1.c_zip,
                cs1.syear as cs1syear,
                cs1.cnt as cs1cnt,
                cs1.s1 as s11,
                cs1.s2 as s21,
                cs1.s3 as s31,
                cs2.s1 as s12,
                cs2.s2 as s22,
                cs2.s3 as s32,
                cs2.syear,
                cs2.cnt
              from cross_sales cs1, cross_sales cs2
              where cs1.item_sk = cs2.item_sk
                and cs1.syear = 1999
                and cs2.syear = 1999 + 1
                and cs2.cnt <= cs1.cnt
                and cs1.store_name = cs2.store_name
                and cs1.store_zip = cs2.store_zip
              order by cs1.product_name, cs1.store_name, cs2.cnt, cs1.s1, cs2.s1;

  - name: coverage_tpcds_65
    input: |-
      SELECT s_store_name,
             i_item_desc,
             sc.revenue,
             i_current_price,
             i_wholesale_cost,
             i_brand
      FROM store,
           item,
        (SELECT ss_store_sk,
                avg(revenue) AS ave
         FROM
           (SELECT ss_store_sk,
                   ss_item_sk,
                   sum(ss_sales_price) AS revenue
            FROM store_sales,
                 date_dim
            WHERE ss_sold_date_sk = d_date_sk
              AND d_month_seq BETWEEN 1176 AND 1176+11
            GROUP BY ss_store_sk,
                     ss_item_sk) sa
         GROUP BY ss_store_sk) sb,
        (SELECT ss_store_sk,
                ss_item_sk,
                sum(ss_sales_price) AS revenue
         FROM store_sales,
              date_dim
         WHERE ss_sold_date_sk = d_date_sk
           AND d_month_seq BETWEEN 1176 AND 1176+11
         GROUP BY ss_store_sk,
                  ss_item_sk) sc
      WHERE sb.ss_store_sk = sc.ss_store_sk
        AND sc.revenue <= 0.1 * sb.ave
        AND s_store_sk = sc.ss_store_sk
        AND i_item_sk = sc.ss_item_sk
      ORDER BY s_store_name NULLS FIRST,
               i_item_desc NULLS FIRST,
               s_store_sk NULLS FIRST,
               i_item_sk NULLS FIRST
      LIMIT 100;
