  - name: coverage_tpcds_97
    input: |-
      WITH ssci AS
        (SELECT ss_customer_sk customer_sk ,
                ss_item_sk item_sk
         FROM store_sales,
              date_dim
         WHERE ss_sold_date_sk = d_date_sk
           AND d_month_seq BETWEEN 1200 AND 1200 + 11
         GROUP BY ss_customer_sk ,
                  ss_item_sk),
           csci as
        ( SELECT cs_bill_customer_sk customer_sk ,cs_item_sk item_sk
         FROM catalog_sales,date_dim
         WHERE cs_sold_date_sk = d_date_sk
           AND d_month_seq BETWEEN 1200 AND 1200 + 11
         GROUP BY cs_bill_customer_sk ,cs_item_sk)
      SELECT sum(CASE
                     WHEN ssci.customer_sk IS NOT NULL
                          AND csci.customer_sk IS NULL THEN 1
                     ELSE 0
                 END) store_only ,
             sum(CASE
                     WHEN ssci.customer_sk IS NULL
                          AND csci.customer_sk IS NOT NULL THEN 1
                     ELSE 0
                 END) catalog_only ,
             sum(CASE
                     WHEN ssci.customer_sk IS NOT NULL
                          AND csci.customer_sk IS NOT NULL THEN 1
                     ELSE 0
                 END) store_and_catalog
      FROM ssci
      FULL OUTER JOIN csci ON (ssci.customer_sk=csci.customer_sk
                               AND ssci.item_sk = csci.item_sk)
      LIMIT 100;
    dialects:
      duckdb:
        formatted:
          - mode: inline
            expected: |-
              with ssci as (select ss_customer_sk as customer_sk, ss_item_sk as item_sk from store_sales, date_dim where ss_sold_date_sk = d_date_sk and d_month_seq between 1200 and 1200 + 11 group by ss_customer_sk, ss_item_sk), csci as (select cs_bill_customer_sk as customer_sk, cs_item_sk as item_sk from catalog_sales, date_dim where cs_sold_date_sk = d_date_sk and d_month_seq between 1200 and 1200 + 11 group by cs_bill_customer_sk, cs_item_sk) select sum(case when ssci.customer_sk is not null and csci.customer_sk is null then 1 else 0 end) as store_only, sum(case when ssci.customer_sk is null and csci.customer_sk is not null then 1 else 0 end) as catalog_only, sum(case when ssci.customer_sk is not null and csci.customer_sk is not null then 1 else 0 end) as store_and_catalog from ssci full join csci on ssci.customer_sk = csci.customer_sk and ssci.item_sk = csci.item_sk limit 100;
          - mode: compact
            expected: |-
              with ssci as (
                select ss_customer_sk as customer_sk, ss_item_sk as item_sk
                from store_sales, date_dim
                where ss_sold_date_sk = d_date_sk and d_month_seq between 1200 and 1200 + 11
                group by ss_customer_sk, ss_item_sk
              ), csci as (
                select cs_bill_customer_sk as customer_sk, cs_item_sk as item_sk
                from catalog_sales, date_dim
                where cs_sold_date_sk = d_date_sk and d_month_seq between 1200 and 1200 + 11
                group by cs_bill_customer_sk, cs_item_sk
              )
              select sum(case when ssci.customer_sk is not null and csci.customer_sk is null then 1 else 0 end) as store_only,
                sum(case when ssci.customer_sk is null and csci.customer_sk is not null then 1 else 0 end) as catalog_only,
                sum(case when ssci.customer_sk is not null and csci.customer_sk is not null then 1 else 0 end) as store_and_catalog
