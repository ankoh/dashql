                  where ws_sold_date_sk = d_date_sk and d_year between 1999 and 1999 + 2
                ) sq2
              )
              select channel, i_brand_id, i_class_id, i_category_id, sum(sales) as sum_sales, sum(number_sales) as sum_number_sales
              from (
                select 'store' as channel,
                  i_brand_id,
                  i_class_id,
                  i_category_id,
                  sum(ss_quantity * ss_list_price) as sales,
                  count(*) as number_sales
                from store_sales, item, date_dim
                where ss_item_sk in (
                    select ss_item_sk
                    from cross_items
                  )
                  and ss_item_sk = i_item_sk
                  and ss_sold_date_sk = d_date_sk
                  and d_year = 1999 + 2
                  and d_moy = 11
                group by i_brand_id, i_class_id, i_category_id
                having sum(ss_quantity * ss_list_price) > (
                    select average_sales
                    from avg_sales
                  )
                union all
                select 'catalog' as channel,
                  i_brand_id,
                  i_class_id,
                  i_category_id,
                  sum(cs_quantity * cs_list_price) as sales,
                  count(*) as number_sales
                from catalog_sales, item, date_dim
                where cs_item_sk in (
                    select ss_item_sk
                    from cross_items
                  )
                  and cs_item_sk = i_item_sk
                  and cs_sold_date_sk = d_date_sk
                  and d_year = 1999 + 2
                  and d_moy = 11
                group by i_brand_id, i_class_id, i_category_id
                having sum(cs_quantity * cs_list_price) > (
                    select average_sales
                    from avg_sales
                  )
                union all
                select 'web' as channel,
                  i_brand_id,
                  i_class_id,
                  i_category_id,
                  sum(ws_quantity * ws_list_price) as sales,
                  count(*) as number_sales
                from web_sales, item, date_dim
                where ws_item_sk in (
                    select ss_item_sk
                    from cross_items
                  )
                  and ws_item_sk = i_item_sk
                  and ws_sold_date_sk = d_date_sk
                  and d_year = 1999 + 2
                  and d_moy = 11
                group by i_brand_id, i_class_id, i_category_id
                having sum(ws_quantity * ws_list_price) > (
                    select average_sales
                    from avg_sales
                  )
              ) y
              group by rollup(channel, i_brand_id, i_class_id, i_category_id)
              order by channel nulls first, i_brand_id nulls first, i_class_id nulls first, i_category_id nulls first
              limit 100;

