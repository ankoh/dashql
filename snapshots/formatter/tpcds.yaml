              WHERE d_week_seq =
                  (SELECT d_week_seq
                   FROM date_dim
                   WHERE d_date = '2000-01-03'))
           AND cs_sold_date_sk = d_date_sk
         GROUP BY i_item_id),
           ws_items AS
        (SELECT i_item_id item_id,
                sum(ws_ext_sales_price) ws_item_rev
         FROM web_sales,
              item,
              date_dim
         WHERE ws_item_sk = i_item_sk
           AND d_date IN
             (SELECT d_date
              FROM date_dim
              WHERE d_week_seq =
                  (SELECT d_week_seq
                   FROM date_dim
                   WHERE d_date = '2000-01-03'))
           AND ws_sold_date_sk = d_date_sk
