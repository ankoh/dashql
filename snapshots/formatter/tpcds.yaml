                  ) salesreturns, date_dim, web_site
                where date_sk = d_date_sk and d_date between cast('2000-08-23' as date) and cast('2000-09-06' as date)
                  and wsr_web_site_sk = web_site_sk
                group by web_site_id
              )
              select channel, id, sum(sales) as sales, sum(returns_) as returns_, sum(profit) as profit
              from (
                select 'store channel' as channel, concat('store', s_store_id) as id, sales, returns_,
                  profit - profit_loss as profit
                from ssr
                union all
                select 'catalog channel' as channel, concat('catalog_page', cp_catalog_page_id) as id, sales, returns_,
                  profit - profit_loss as profit
                from csr
                union all
                select 'web channel' as channel, concat('web_site', web_site_id) as id, sales, returns_,
                  profit - profit_loss as profit
                from wsr
              ) x
              group by rollup(channel, id)
              order by channel nulls first, id nulls first
              limit 100;
