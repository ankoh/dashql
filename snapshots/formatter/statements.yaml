formatter-snapshots:

  - name: coverage_multiple_statements
    input: |-
      select 1; select 2
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;

              select 2;
          - mode: compact
            expected: |-
              select 1;

              select 2;
          - mode: pretty
            expected: |-
              select 1;

              select 2;
        validation:
          setup: |-

  - name: coverage_create_table_as
    input: |-
      create table if not exists analytics.result as select 1 as value
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              create table if not exists analytics.result as select 1 as value;
          - mode: compact
            expected: |-
              create table if not exists analytics.result as select 1 as value;
          - mode: pretty
            expected: |-
              create table if not exists analytics.result as select 1 as value;
        validation:
          setup: |-
            create schema memory.analytics;

  - name: coverage_create_table_as_modifiers
    input: |-
      create temporary table if not exists result (value) on commit preserve rows as select 1 with no data
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              create temporary table if not exists result(value) on commit preserve rows as select 1 with no data;
          - mode: compact
            expected: |-
              create temporary table if not exists result(value) on commit preserve rows as select 1 with no data;
          - mode: pretty
            expected: |-
              create temporary table if not exists result(value) on commit preserve rows as select 1 with no data;

  - name: coverage_create_table_as_global_with_data
    input: |-
      create global temporary table result as select 1 with data
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              create global temporary table result as select 1 with data;
          - mode: compact
            expected: |-
              create global temporary table result as select 1 with data;
          - mode: pretty
            expected: |-
              create global temporary table result as select 1 with data;

  - name: coverage_create_view
    input: |-
      create view analytics.result (value) as select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              create view analytics.result(value) as select 1;
          - mode: compact
            expected: |-
              create view analytics.result(value) as select 1;
          - mode: pretty
            expected: |-
              create view analytics.result(value) as select 1;

  - name: coverage_create_temporary_view
    input: |-
      create temporary view result as select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              create temporary view result as select 1;
          - mode: compact
            expected: |-
              create temporary view result as select 1;
          - mode: pretty
            expected: |-
              create temporary view result as select 1;

  - name: coverage_create_or_replace_temporary_view
    input: |-
      create or replace temp view result as select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              create or replace temporary view result as select 1;
          - mode: compact
            expected: |-
              create or replace temporary view result as select 1;
          - mode: pretty
            expected: |-
              create or replace temporary view result as select 1;

  - name: coverage_create_or_replace_view_wrap_after_as
    input: |-
      create or replace view analytics.result as select * from analytics.source
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              create or replace view analytics.result as select * from analytics.source;
          - mode: compact
            width: 65
            expected: |-
              create or replace view analytics.result as
              select * from analytics.source;
          - mode: pretty
            expected: |-
              create or replace view analytics.result as
              select *
              from analytics.source;

  - name: coverage_create_function
    input: |-
      create function analytics.render(value int, label varchar) returns varchar
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              create function analytics.render(value integer, label varchar) returns varchar;
          - mode: compact
            expected: |-
              create function analytics.render(value integer, label varchar) returns varchar;
          - mode: pretty
            expected: |-
              create function analytics.render(value integer, label varchar) returns varchar;

  - name: coverage_create_aggregate
    input: |-
      create aggregate analytics.total(value int) returns int
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              create aggregate analytics.total(value integer) returns integer;
          - mode: compact
            expected: |-
              create aggregate analytics.total(value integer) returns integer;
          - mode: pretty
            expected: |-
              create aggregate analytics.total(value integer) returns integer;

  - name: coverage_set_scalar
    input: |-
      SET variable = 'value'
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              set variable = 'value';
          - mode: compact
            expected: |-
              set variable = 'value';
          - mode: pretty
            expected: |-
              set variable = 'value';

  - name: coverage_set_nested
    input: |-
      SET variable = ('some' = 42, 'nested' = ('enabled' = true), 'values' = [43, 44])
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              set variable = ('some' = 42, 'nested' = ('enabled' = true), 'values' = [43, 44]);
          - mode: compact
            expected: |-
              set variable = ('some' = 42, 'nested' = ('enabled' = true), 'values' = [43, 44]);
          - mode: pretty
            expected: |-
              set variable = ('some' = 42, 'nested' = ('enabled' = true), 'values' = [43, 44]);

  - name: coverage_create_table_modifiers
    input: |-
      create unlogged table result (value int) on commit drop
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              create unlogged table result (value integer) on commit drop;
          - mode: compact
            expected: |-
              create unlogged table result (value integer) on commit drop;
          - mode: pretty
            expected: |-
              create unlogged table result (value integer) on commit drop;

  - name: coverage_create_table_delete_rows
    input: |-
      create temporary table result (value int) on commit delete rows
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              create temporary table result (value integer) on commit delete rows;
          - mode: compact
            expected: |-
              create temporary table result (value integer) on commit delete rows;
          - mode: pretty
            expected: |-
              create temporary table result (value integer) on commit delete rows;

  - name: coverage_drop_table
    input: |-
      DROP TABLE IF EXISTS analytics.result
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              drop table if exists analytics.result;
          - mode: compact
            expected: |-
              drop table if exists analytics.result;
          - mode: pretty
            expected: |-
              drop table if exists analytics.result;

  - name: coverage_drop_view
    input: |-
      DROP VIEW analytics.result
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              drop view analytics.result;
          - mode: compact
            expected: |-
              drop view analytics.result;
          - mode: pretty
            expected: |-
              drop view analytics.result;

  - name: coverage_attach_database
    input: |-
      ATTACH DATABASE "path/to/source.hyper" AS source
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              attach database "path/to/source.hyper" as source;
          - mode: compact
            expected: |-
              attach database "path/to/source.hyper" as source;
          - mode: pretty
            expected: |-
              attach database "path/to/source.hyper" as source;

  - name: coverage_attach_local_database_options
    input: |-
      ATTACH LOCAL DATABASE local_source AS attached WITH (access_mode='readonly', encryption_key=DEFAULT)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              attach local database local_source as attached with (access_mode = 'readonly', encryption_key = DEFAULT);
          - mode: compact
            expected: |-
              attach local database local_source as attached with (access_mode = 'readonly', encryption_key = DEFAULT);
          - mode: pretty
            expected: |-
              attach local database local_source as attached with (access_mode = 'readonly', encryption_key = DEFAULT);
