formatter-snapshots:

  - name: coverage_insert_values
    input: |-
      INSERT INTO insert_target VALUES(1,'one'),(2,'two')
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              insert into insert_target values (1, 'one'), (2, 'two');
          - mode: compact
            expected: |-
              insert into insert_target values (1, 'one'), (2, 'two');
          - mode: pretty
            expected: |-
              insert into insert_target
              values
                (1, 'one'),
                (2, 'two');
        validation:
          setup: |-
            create table insert_target(id int, label text);

  - name: coverage_insert_columns_default
    input: |-
      INSERT INTO insert_target(id,label) VALUES(DEFAULT,'generated')
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              insert into insert_target(id, label) values (default, 'generated');
          - mode: compact
            expected: |-
              insert into insert_target(id, label) values (default, 'generated');
          - mode: pretty
            expected: |-
              insert into insert_target(id, label)
              values
                (default, 'generated');
        validation:
          setup: |-
            create table insert_target(id int default 42, label text);

  - name: coverage_insert_select
    input: |-
      INSERT INTO insert_target(id,label) SELECT id,label FROM insert_source WHERE active
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              insert into insert_target(id, label) select id, label from insert_source where active;
          - mode: compact
            expected: |-
              insert into insert_target(id, label) select id, label from insert_source where active;
          - mode: pretty
            expected: |-
              insert into insert_target(id, label)
              select id, label
              from insert_source
              where active;
        validation:
          setup: |-
            create table insert_target(id int, label text);
            create table insert_source(id int, label text, active boolean);

  - name: coverage_insert_table
    input: |-
      INSERT INTO insert_target TABLE insert_source
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              insert into insert_target table insert_source;
          - mode: compact
            expected: |-
              insert into insert_target table insert_source;
          - mode: pretty
            expected: |-
              insert into insert_target
              table insert_source;
        validation:
          setup: |-
            create table insert_target(id int);
            create table insert_source(id int);

  - name: coverage_insert_default_values
    input: |-
      INSERT INTO insert_target DEFAULT VALUES
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              insert into insert_target default values;
          - mode: compact
            expected: |-
              insert into insert_target default values;
          - mode: pretty
            expected: |-
              insert into insert_target
              default values;
        validation:
          setup: |-
            create table insert_target(id int default 42);

  - name: coverage_insert_with
    input: |-
      WITH source AS(SELECT id,label FROM insert_source) INSERT INTO insert_target(id,label) SELECT id,label FROM source
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with source as (select id, label from insert_source) insert into insert_target(id, label) select id, label from source;
          - mode: compact
            expected: |-
              with source as (select id, label from insert_source) insert into insert_target(id, label) select id, label from source;
          - mode: pretty
            expected: |-
              with source as (
                select id, label
                from insert_source
              )
              insert into insert_target(id, label)
              select id, label
              from source;
        validation:
          setup: |-
            create table insert_target(id int, label text);
            create table insert_source(id int, label text);

  - name: coverage_insert_returning
    input: |-
      INSERT INTO insert_target(id,label) VALUES(1,'one') RETURNING id,label AS inserted_label
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              insert into insert_target(id, label) values (1, 'one') returning id, label as inserted_label;
          - mode: compact
            expected: |-
              insert into insert_target(id, label) values (1, 'one') returning id, label as inserted_label;
          - mode: pretty
            expected: |-
              insert into insert_target(id, label)
              values
                (1, 'one')
              returning id, label as inserted_label;
        validation:
          setup: |-
            create table insert_target(id int, label text);

  - name: coverage_insert_qualified_target_returning_star
    input: |-
      INSERT INTO insert_schema.insert_target DEFAULT VALUES RETURNING *
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              insert into insert_schema.insert_target default values returning *;
          - mode: compact
            expected: |-
              insert into insert_schema.insert_target default values returning *;
          - mode: pretty
            expected: |-
              insert into insert_schema.insert_target
              default values
              returning *;
        validation:
          setup: |-
            create schema insert_schema;
            create table insert_schema.insert_target(id int default 42);

  - name: coverage_explain_insert
    input: |-
      EXPLAIN INSERT INTO insert_target VALUES(1)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              explain insert into insert_target values (1);
          - mode: compact
            expected: |-
              explain insert into insert_target values (1);
          - mode: pretty
            expected: |-
              explain insert into insert_target
              values
                (1);
        validation:
          setup: |-
            create table insert_target(id int);
