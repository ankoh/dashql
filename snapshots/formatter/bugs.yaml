                and ss_addr_sk__c = ad1.ca_address_sk__c
                and ss_item_sk__c = i_item_sk__c
                and ss_item_sk__c = sr_item_sk__c
                and ss_ticket_number__c = sr_ticket_number__c
                and ss_item_sk__c = cs_ui.cs_item_sk__c
                and c_current_cdemo_sk__c = cd2.cd_demo_sk__c
                and c_current_hdemo_sk__c = hd2.hd_demo_sk__c
                and c_current_addr_sk__c = ad2.ca_address_sk__c
                and c_first_sales_date_sk__c = d2.d_date_sk__c
