  - name: bug_parenthesized_and_chain_indentation
    input: |-
      select * from test where (((((ss_store_sk__c = s_store_sk__c and ss_sold_date_sk__c = d1.d_date_sk__c)
        and ss_customer_sk__c = c_customer_sk__c) and ss_cdemo_sk__c = cd1.cd_demo_sk__c)
        and ss_hdemo_sk__c = hd1.hd_demo_sk__c) and ss_addr_sk__c = ad1.ca_address_sk__c)
        and ss_item_sk__c = i_item_sk__c
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select * from test where ss_store_sk__c = s_store_sk__c and ss_sold_date_sk__c = d1.d_date_sk__c and ss_customer_sk__c = c_customer_sk__c and ss_cdemo_sk__c = cd1.cd_demo_sk__c and ss_hdemo_sk__c = hd1.hd_demo_sk__c and ss_addr_sk__c = ad1.ca_address_sk__c and ss_item_sk__c = i_item_sk__c;
          - mode: compact
            indent: 4
            width: 80
            expected: |-
              select *
              from test
              where ss_store_sk__c = s_store_sk__c and ss_sold_date_sk__c = d1.d_date_sk__c
                  and ss_customer_sk__c = c_customer_sk__c
                  and ss_cdemo_sk__c = cd1.cd_demo_sk__c
                  and ss_hdemo_sk__c = hd1.hd_demo_sk__c
                  and ss_addr_sk__c = ad1.ca_address_sk__c and ss_item_sk__c = i_item_sk__c;
          - mode: pretty
            indent: 4
            width: 80
            expected: |-
              select *
              from test
              where ss_store_sk__c = s_store_sk__c
                  and ss_sold_date_sk__c = d1.d_date_sk__c
                  and ss_customer_sk__c = c_customer_sk__c
                  and ss_cdemo_sk__c = cd1.cd_demo_sk__c
                  and ss_hdemo_sk__c = hd1.hd_demo_sk__c
                  and ss_addr_sk__c = ad1.ca_address_sk__c
                  and ss_item_sk__c = i_item_sk__c;
