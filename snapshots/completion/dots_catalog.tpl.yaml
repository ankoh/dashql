completion-snapshots:
  # Complete schema after "from dbname."
  - name: dots_catalog_complete_trailing_dot
    catalog:
      script:
        input: create table dbname.schemaname.foo(a int);
    editor:
      input: select * from dbname.
    cursor:
      search:
        text: dbname.
        index: 7
    completions:
      limit: 3

  # Complete at dot: .sch (schema)
  - name: dots_catalog_complete_at_dot
    catalog:
      script:
        input: create table dbname.schemaname.foo(a int);
    editor:
      input: select * from dbname.sch
    cursor:
      search:
        text: .sch
        index: 0
    completions:
      limit: 3

  # Complete previous dot: .sch index 1
  - name: dots_catalog_complete_previous_dot
    catalog:
      script:
        input: create table dbname.schemaname.foo(a int);
    editor:
      input: select * from dbname.sch
    cursor:
      search:
        text: .sch
        index: 1
    completions:
      limit: 3

  # Complete with quoted schema name
  - name: dots_catalog_complete_previous_dot_quotes
    catalog:
      script:
        input: create table dbname.schemaname.foo(a int);
    editor:
      input: select * from dbname."sch"
    cursor:
      search:
        text: name.
        index: 5
    completions:
      limit: 3

  # Same script: complete schema after dbname.
  - name: dots_catalog_same_script_complete_schema
    catalog: {}
    editor:
      input: |-
        create table dbname.schemaname.foo(a int);
        select * from dbname.
    cursor:
      search:
        text: from dbname.
        index: 12
    completions:
      limit: 3

  # A schema of the default database and a database with a table and a schema of the same name merge into one candidate
  - name: dots_catalog_schema_and_database_share_a_name
    catalog:
      script:
        input: create table x.foo(a int); create table x.foo.bar(b int);
    editor:
      input: select * from x.
    cursor:
      search:
        text: x.
        index: 2
    completions:
      limit: 3
