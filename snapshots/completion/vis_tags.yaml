  - name: vis_vegalite_field
    catalog:
      script:
        input: create table sales (region text, revenue int, date timestamp);
        catalog-id: 1
        tables:
          - catalog-id: "256.65536.4294967296"
            name: sales
            text: "create tab..timestamp)"
            columns:
              - catalog-id: "256.65536.4294967296.0"
                name: date
                text: "date timestamp"
              - catalog-id: "256.65536.4294967296.1"
                name: region
                text: "region text"
              - catalog-id: "256.65536.4294967296.2"
                name: revenue
                text: "revenue int"
        catalog-changes:
          - statement-id: 0
            type: create
            name: sales
            columns: [region,revenue,date]
        errors: []
    editor:
      input: |
        /* @vis vegalite {"mark": "bar", "encoding": {"x": {"field": "re"}}} */
        select region, revenue as total_revenue, date from sales
      catalog-id: 2
      errors:
        - type: INVALID_VIS_TAG
          severity: WARNING
          message: 'unknown field "re", the statement has the columns date, region, total_revenue'
          text: "\"re\""
      table-refs:
