completion-snapshots:
  # The name of a tag at the start of a block comment
  - name: vis_tag_name
    catalog: {}
    editor:
      input: |
        /* @v */
        select 1
    cursor:
      search:
        text: '@v'
        index: 2
    completions:
      limit: 3
  # Line comments do not complete the end tag, it is never needed
  - name: vis_tag_name_line_comment
    catalog: {}
    editor:
      input: |
        -- @e
        select 1
    cursor:
      search:
        text: '@e'
        index: 2
    completions:
      limit: 3
  # The kind after @vis
  - name: vis_kind
    catalog: {}
    editor:
      input: |
        /* @vis ve */
        select 1
    cursor:
      search:
        text: 've'
        index: 2
    completions:
      limit: 3
  # The args of a board placement that are not used yet
  - name: vis_board_arg
    catalog: {}
    editor:
      input: |
        /* @vis table
           @board width=6 h */
        select 1
    cursor:
      search:
        text: ' h '
        index: 2
    completions:
      limit: 3
  # The args of a flow position, on a statement that is no query
  - name: vis_flow_arg
    catalog: {}
    editor:
      input: |
        /* @flow x=4 y */
        create table t (a int)
    cursor:
      search:
        text: ' y '
        index: 2
    completions:
      limit: 3
  # A top-level key of the Vega-Lite spec
  - name: vis_vegalite_top_level_key
    catalog: {}
    editor:
      input: |
        /* @vis vegalite {"ma} */
        select 1
    cursor:
      search:
        text: '"ma'
        index: 3
    completions:
      limit: 3
  # The encoding channels
  - name: vis_vegalite_channel
    catalog: {}
    editor:
      input: |
        /* @vis vegalite
           {"mark": "bar", "encoding": {"
        */
        select 1
    cursor:
      search:
        text: '"encoding": {"'
        index: 14
    completions:
      limit: 3
  # The mark types
  - name: vis_vegalite_mark_type
    catalog: {}
    editor:
      input: |
        /* @vis vegalite {"mark": "b"} */
        select 1
    cursor:
      search:
        text: '"b'
        index: 2
    completions:
      limit: 3
  # Fields are the output columns of the query
  - name: vis_vegalite_field
    catalog:
      script:
        input: create table sales (region text, revenue int, date timestamp);
    editor:
      input: |
        /* @vis vegalite {"mark": "bar", "encoding": {"x": {"field": "re"}}} */
        select region, revenue as total_revenue, date from sales
    cursor:
      search:
        text: '"re"'
        index: 3
    completions:
      limit: 3
  # Keys in JSON that is still typed
  - name: vis_vegalite_half_written
    catalog: {}
    editor:
      input: |
        /* @vis vegalite
           {"mark": "bar", "encoding": {"x": {"field": "a", ty
        */
        select 1 as a
    cursor:
      search:
        text: ' ty'
        index: 3
    completions:
      limit: 3
  # The field types
  - name: vis_vegalite_field_type
    catalog: {}
    editor:
      input: |
        /* @vis vegalite {"encoding": {"y": {"field": "a", "type": "q"}}} */
        select 1 as a
    cursor:
      search:
        text: '"q'
        index: 2
    completions:
      limit: 3
  # The specs in a layer are specs
  - name: vis_vegalite_layer_mark_type
    catalog: {}
    editor:
      input: |
        /* @vis vegalite {"layer": [{"mark": "l"}]} */
        select 1 as a
    cursor:
      search:
        text: '"mark": "l'
        index: 10
    completions:
      limit: 3
  # The properties of a mark definition
  - name: vis_vegalite_mark_key
    catalog: {}
    editor:
      input: |
        /* @vis vegalite {"mark": {"op"}} */
        select 1 as a
    cursor:
      search:
        text: '"op'
        index: 3
    completions:
      limit: 3
  # The type in a mark definition
  - name: vis_vegalite_mark_object_type
    catalog: {}
    editor:
      input: |
        /* @vis vegalite {"mark": {"type": "ar"}} */
        select 1 as a
    cursor:
      search:
        text: '"ar'
        index: 3
    completions:
      limit: 3
  # The aggregates of a field definition
  - name: vis_vegalite_aggregate
    catalog: {}
    editor:
      input: |
        /* @vis vegalite {"encoding": {"y": {"field": "a", "aggregate": "su"}}} */
        select 1 as a
    cursor:
      search:
        text: '"su'
        index: 3
    completions:
      limit: 3
  # The time units of a field definition
  - name: vis_vegalite_time_unit
    catalog: {}
    editor:
      input: |
        /* @vis vegalite {"encoding": {"x": {"field": "a", "timeUnit": "mo"}}} */
        select 1 as a
    cursor:
      search:
        text: '"mo'
        index: 3
    completions:
      limit: 3
  # The properties of a scale
  - name: vis_vegalite_scale_key
    catalog: {}
    editor:
      input: |
        /* @vis vegalite {"encoding": {"y": {"field": "a", "scale": {"ty"}}}} */
        select 1 as a
    cursor:
      search:
        text: '"ty'
        index: 3
    completions:
      limit: 3
  # The scale types
  - name: vis_vegalite_scale_type
    catalog: {}
    editor:
      input: |
        /* @vis vegalite {"encoding": {"y": {"field": "a", "scale": {"type": "lo"}}}} */
        select 1 as a
    cursor:
      search:
        text: '"lo'
        index: 3
    completions:
      limit: 3
  # The properties of an axis
  - name: vis_vegalite_axis_key
    catalog: {}
    editor:
      input: |
        /* @vis vegalite {"encoding": {"x": {"field": "a", "axis": {"ti"}}}} */
        select 1 as a
    cursor:
      search:
        text: '"ti'
        index: 3
    completions:
      limit: 3
  # The properties of a legend
  - name: vis_vegalite_legend_key
    catalog: {}
    editor:
      input: |
        /* @vis vegalite {"encoding": {"color": {"field": "a", "legend": {"or"}}}} */
        select 1 as a
    cursor:
      search:
        text: '"or'
        index: 3
    completions:
      limit: 3
  # The field definitions in an array of a channel
  - name: vis_vegalite_tooltip_array
    catalog: {}
    editor:
      input: |
        /* @vis vegalite {"encoding": {"tooltip": [{"field": "a", "ty"}]}} */
        select 1 as a
    cursor:
      search:
        text: '"ty'
        index: 3
    completions:
      limit: 3
  # The elements of a groupby are columns
  - name: vis_vegalite_groupby
    catalog: {}
    editor:
      input: |
        /* @vis vegalite {"transform": [{"aggregate": [], "groupby": ["re"]}]} */
        select 1 as region, 2 as revenue
    cursor:
      search:
        text: '"re"'
        index: 3
    completions:
      limit: 3
  # The columns in a Markdown placeholder
  - name: vis_markdown_placeholder
    catalog:
      script:
        input: create table sales (region text, revenue int);
    editor:
      input: |
        /* @vis markdown ### {{re}} */
        select region, revenue from sales
    cursor:
      search:
        text: '{{re'
        index: 4
    completions:
      limit: 3
  # Ordinary comments complete nothing
  - name: vis_ordinary_comment
    catalog: {}
    editor:
      input: |
        /* see re */
        select 1
    cursor:
      search:
        text: 're */'
        index: 2
    completions:
      limit: 3
