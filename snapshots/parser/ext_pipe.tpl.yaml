parser-snapshots:
  - name: pipe_from_source
    input: |
      FROM sales;
  - name: pipe_where_select
    input: |
      FROM sales
      |> WHERE revenue > 0
      |> SELECT region, revenue AS amount;
  - name: pipe_extend
    input: |
      SELECT * FROM sales
      |> EXTEND revenue * 1.2 AS adjusted_revenue;
  - name: pipe_aggregate
    input: |
      FROM sales
      |> AGGREGATE sum(revenue) AS total GROUP BY region;
  - name: pipe_aggregate_groups_only
    input: |
      FROM sales
      |> AGGREGATE GROUP BY region;
  - name: pipe_distinct
    input: |
      FROM sales
      |> DISTINCT;
  - name: pipe_join
    input: |
      FROM sales
      |> AS s
      |> LEFT JOIN regions AS r ON s.region_id = r.id;
  - name: pipe_cross_join
    input: |
      FROM sales
      |> CROSS JOIN regions;
  - name: pipe_combine
    input: |
      FROM current_sales
      |> UNION ALL (FROM archived_sales), (SELECT * FROM forecast_sales);
  - name: pipe_order_limit
    input: |
      FROM sales
      |> ORDER BY revenue DESC NULLS LAST
      |> LIMIT 10 OFFSET 5;
  - name: pipe_with
    input: |
      WITH regions AS (SELECT * FROM region_dim)
      FROM sales
      |> JOIN regions USING (region_id);
  - name: pipe_stage_with_rejected
    input: |
      FROM sales
      |> WITH regions AS (SELECT * FROM region_dim)
      |> JOIN regions USING (region_id);
  - name: pipe_visualize
    input: |
      FROM sales
      |> WHERE revenue > 0
      |> VISUALIZE USING vegalite (mark => bar);
