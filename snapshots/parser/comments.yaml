parser-snapshots:

  - name: line_comment_run
    input: |-
      -- Revenue per segment
      --   indented continuation
      select 1
    expected:
      statements:
        - type: SELECT
          ast-begin: 0
          ast-size: 4
          description:
            text: "select 1"
            description-begin: 0
            description-count: 2
            description-blocks: [0,1]
          ast:
            type: OBJECT_SQL_SELECT
            text: "select 1"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "1"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "1"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_INTEGER
                        text: "1"
      scanner-errors: []
      parser-errors: []
      line-breaks:
        - text: [22,23]
        - text: [49,50]
      comments:
        - text: "-- Revenue..er segment"
        - text: "--   inden..ntinuation"
      comment-blocks:
        - type: COMMENT
          text: "-- Revenue..ntinuation"
          comments: [0,2]
          lines:
            - "Revenue per segment"
            - "  indented continuation"
      comment-warnings: []

