parser-snapshots:

  - name: array_values
    input: |-
      select array[1, 2, 3], array[a + 1, b]
    expected:
      statements:
        - type: SELECT
          ast-begin: 0
          ast-size: 21
          description:
            text: "select arr..[a + 1, b]"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select arr..[a + 1, b]"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "array[1, 2..[a + 1, b]"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "array[1, 2, 3]"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: OBJECT_SQL_ARRAY_EXPRESSION
                        text: "array[1, 2, 3]"
                        children:
                          - key: SQL_ARRAY_EXPRESSION_VALUES
                            type: ARRAY
                            text: "1, 2, 3"
                            children:
                              - type: LITERAL_INTEGER
                                text: "1"
                              - type: LITERAL_INTEGER
                                text: "2"
                              - type: LITERAL_INTEGER
                                text: "3"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "array[a + 1, b]"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: OBJECT_SQL_ARRAY_EXPRESSION
                        text: "array[a + 1, b]"
                        children:
                          - key: SQL_ARRAY_EXPRESSION_VALUES
                            type: ARRAY
                            text: "a + 1, b"
                            children:
                              - type: OBJECT_SQL_NARY_EXPRESSION
                                text: "a + 1"
                                children:
                                  - key: SQL_EXPRESSION_OPERATOR
                                    type: ENUM_SQL_EXPRESSION_OPERATOR
                                    value: PLUS
                                  - key: SQL_EXPRESSION_ARGS
                                    type: ARRAY
                                    text: "a + 1"
                                    children:
                                      - type: OBJECT_SQL_COLUMN_REF
                                        text: "a"
                                        children:
                                          - key: SQL_COLUMN_REF_PATH
                                            type: ARRAY
                                            text: "a"
                                            children:
                                              - type: NAME
                                                text: "a"
                                      - type: LITERAL_INTEGER
                                        text: "1"
                              - type: OBJECT_SQL_COLUMN_REF
                                text: "b"
                                children:
                                  - key: SQL_COLUMN_REF_PATH
                                    type: ARRAY
                                    text: "b"
                                    children:
                                      - type: NAME
                                        text: "b"
      scanner-errors: []
      parser-errors: []
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []

