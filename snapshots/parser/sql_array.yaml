  - name: array_any
    input: |-
      select (array[1, 2])[1] from t where a = any (array[21, 23, 20])
    expected:
      statements:
        - type: SELECT
          ast-begin: 0
          ast-size: 26
          description:
            text: "select (ar.., 23, 20])"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select (ar.., 23, 20])"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "(array[1, 2])[1]"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "(array[1, 2])[1]"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: OBJECT_SQL_INDIRECTION
                        text: "(array[1, 2])[1]"
                        children:
                          - key: SQL_INDIRECTION_VALUE
                            type: OBJECT_SQL_ARRAY_EXPRESSION
                            text: "array[1, 2]"
                            children:
                              - key: SQL_ARRAY_EXPRESSION_VALUES
                                type: ARRAY
                                text: "1, 2"
                                children:
                                  - type: LITERAL_INTEGER
                                    text: "1"
                                  - type: LITERAL_INTEGER
                                    text: "2"
                          - key: SQL_INDIRECTION_PATH
                            type: ARRAY
                            text: "[1]"
                            children:
                              - type: OBJECT_SQL_INDIRECTION_INDEX
                                text: "[1]"
                                children:
                                  - key: SQL_INDIRECTION_INDEX_VALUE
                                    type: LITERAL_INTEGER
                                    text: "1"
              - key: SQL_SELECT_FROM
                type: ARRAY
                text: "from t"
                children:
                  - type: OBJECT_SQL_TABLEREF
                    text: "t"
                    children:
                      - key: SQL_TABLEREF_NAME
                        type: ARRAY
                        text: "t"
                        children:
                          - type: NAME
                            text: "t"
              - key: SQL_SELECT_WHERE
                type: OBJECT_SQL_SUBQUERY_EXPRESSION
                text: "a = any (a.., 23, 20])"
                children:
                  - key: SQL_SUBQUERY_ARG0
                    type: OBJECT_SQL_COLUMN_REF
                    text: "a"
                    children:
                      - key: SQL_COLUMN_REF_PATH
                        type: ARRAY
                        text: "a"
                        children:
                          - type: NAME
                            text: "a"
                  - key: SQL_SUBQUERY_ARG1
                    type: OBJECT_SQL_ARRAY_EXPRESSION
                    text: "array[21, 23, 20]"
                    children:
                      - key: SQL_ARRAY_EXPRESSION_VALUES
                        type: ARRAY
                        text: "21, 23, 20"
                        children:
                          - type: LITERAL_INTEGER
                            text: "21"
                          - type: LITERAL_INTEGER
                            text: "23"
                          - type: LITERAL_INTEGER
                            text: "20"
                  - key: SQL_SUBQUERY_OPERATOR
                    type: ENUM_SQL_EXPRESSION_OPERATOR
                    value: EQUAL
                  - key: SQL_SUBQUERY_QUANTIFIER
                    type: ENUM_SQL_SUBQUERY_QUANTIFIER
                    value: ANY
      scanner-errors: []
      parser-errors: []
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []

