            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select arr..y[]::int[]"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "array[]::int[]"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "array[]::int[]"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: OBJECT_SQL_TYPECAST_EXPRESSION
                        text: "array[]::int[]"
                        children:
                          - key: SQL_TYPECAST_VALUE
