parser-snapshots:
  # Explain a simple select
  - name: explain_select
    input: |
      explain select 1
  # Explain with analyze option
  - name: explain_with_analyze
    input: |
      explain (analyze) select 1
  # Explain with multiple options
  - name: explain_with_options
    input: |
      explain (analyze, format text) select 1
  # Explain with option value
  - name: explain_with_bool_option
    input: |
      explain (analyze true, verbose false) select 1
  # Explain create table
  - name: explain_create_table
    input: |
      explain create table foo (id integer)
  # Explain a select with from
  - name: explain_select_from
    input: |
      explain select a, b from t where a > 1
  # Parenthesized VALUES is a query, not an option named "values"
  - name: explain_parenthesized_values
    input: |
      explain (values (1))
  # VALUES remains available as an option name when it has no list argument
  - name: explain_values_option_without_arg
    input: |
      explain (values) select 1
  # Explain internal SQL with a descriptor-valued function argument
  - name: explain_raw_sql_subquery_descriptor
    input: |
      explain (format sql, sql_dialect internal_spark_2025_12)
      with node1 as (
         select * from raw_sql_subquery(columns => descriptor(foo int), 'foo')
      )
      select * from node1
  # Explain streaming SQL with structured option values
  - name: explain_streaming_options
    input: |
      explain (
        format sql,
        sql_dialect internal_spark,
        streaming_table orders,
        change_data_feed orders_cdf,
        streaming_key_columns (id),
        streaming_actions_column _action,
        change_data_feed_record_type_column _record_type,
        change_data_feed_columns descriptor(_record_type text)
      )
      select * from orders;
  # Explain a list of SQL expressions against descriptor columns
  - name: explain_sql_expressions
    input: |
      explain (format sql_expressions, sql_dialect internal_spark_2025_12, columns descriptor(a int))
      expressions (
        1 + 2 + 3,
        3 + a
      )
