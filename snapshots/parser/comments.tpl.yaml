parser-snapshots:
  # Line comments on consecutive lines form a single block
  - name: line_comment_run
    input: |
      -- Revenue per segment
      --   indented continuation
      select 1
  # A blank line splits line comments into separate blocks
  - name: line_comment_runs_split_by_blank_line
    input: |
      -- first block

      -- second block
      select 1
  # Bare `--` lines are empty content lines, leading and trailing ones are dropped
  - name: line_comment_empty_lines
    input: |
      --
      -- first paragraph
      --
      -- second paragraph
      --
      select 1
  # Repeated dashes are stripped, a separator line has no content
  - name: line_comment_separator
    input: |
      ----------
      --- banner
      select 1
  # A trailing comment is a block of its own and never merges with the next line
  - name: line_comment_trailing
    input: |
      select 1; -- trailing
      -- leading for the second statement
      select 2
  # A block comment is a single block, its delimiters and gutters are stripped
  - name: block_comment_gutter
    input: |
      /**
       * Revenue per segment
       *
       * Second paragraph
       */
      select 1
  # Single line block comments
  - name: block_comment_single_line
    input: |
      /* inline */ select 1 /**/
  # Empty block comments and block comments consisting of stars
  - name: block_comment_empty
    input: |
      /**/ select 1 /***/
  # Nested block comments form a single comment
  - name: block_comment_nested
    input: |
      /* outer /* inner */ still outer */ select 1
  # A block comment ends a run of line comments
  - name: block_comment_between_line_comments
    input: |
      -- before
      /* block */
      -- after
      select 1
  # A description header block
  - name: description_line_form
    input: |
      -- @description
      -- Revenue of the open orders per market segment.
      --
      -- Example questions:
      -- - Which segment earns the most?
      -- @end

      -- TPC-H query 3
      select 1
  # Ordinary comments directly before a description become their own block
  - name: description_line_form_after_comment
    input: |
      -- my own note
      -- @description
      -- Revenue per segment.
      -- @end
      -- another note
      select 1
  # Text after the opening tag is content
  - name: description_line_form_inline_text
    input: |
      -- @description Revenue per segment.
      -- Second line.
      -- @end
      select 1
  # Tags may be indented within the comment
  - name: description_line_form_indented
    input: |
      --   @description
      -- Revenue per segment.
      --   @end
      select 1
  # A block comment is a description when its first text is the tag, the comment end closes it
  - name: description_block_form
    input: |
      /* @description
         Revenue per segment.

         Example questions:
         - Which segment earns the most?
      */
      select 1
  # A javadoc-style description
  - name: description_block_form_gutter
    input: |
      /**
       * @description
       * Revenue per segment.
       */
      select 1
  # A single line description block comment
  - name: description_block_form_single_line
    input: |
      /* @description Revenue per segment. */ select 1
  # Each statement gets its own description block
  - name: description_per_statement
    input: |
      -- @description
      -- First query.
      -- @end
      select 1;

      -- @description
      -- Second query.
      -- @end
      select 2;
      select 3
  # A description separated from the statement by SQL is not the statement's description
  - name: description_not_leading
    input: |
      -- @description
      -- First query.
      -- @end
      select 1; select 2
  # A region of line comments ends with the run, it needs no end line
  - name: description_line_form_without_end
    input: |
      -- @description
      -- Revenue per segment.
      -- @vis table
      select 1
  # A blank line ends the run and the region, the end line after it closes nothing
  - name: description_unterminated
    input: |
      -- @description
      -- Revenue per segment.

      -- @end
      select 1
  # Only known tags are tags, any other `@word` is ordinary text
  - name: unknown_tag
    input: |
      -- @todo fix this
      -- @param x
      /* @param x */
      select 1
  # An end tag without an opening tag
  - name: end_tag_without_opening
    input: |
      -- @end
      /* @end */
      select 1
  # Text that only resembles a tag stays an ordinary comment
  - name: not_a_tag
    input: |
      -- see @description
      -- @description: Revenue
      -- @descriptions
      -- @
      -- @DESCRIPTION
      select 1
  # A closing tag with trailing text does not close the region
  - name: end_tag_with_text
    input: |
      -- @description
      -- Revenue per segment.
      -- @end of description
      -- @end
      select 1
  # Every tag line of a block comment starts a block, text before the first tag is an ordinary block
  - name: block_comment_several_tags
    input: |
      /* Revenue dashboard.
         @description Revenue per region.
         @vis card width=6 height=3
         @vis vegalite
         {"mark": "bar"}
      */
      select 1
  # A javadoc-style block comment with several tags
  - name: block_comment_several_tags_gutter
    input: |
      /**
       * @description Revenue per region.
       * @vis table
       */
      select 1
  # The next tag line closes a region of line comments, only the last region needs the end line
  - name: line_comments_several_tags
    input: |
      -- @description Revenue per region.
      -- @vis card width=6 height=3
      -- @vis vegalite
      -- {"mark": "bar"}
      -- @end
      select 1
  # Without the end line, the last region stays an ordinary comment
  - name: line_comments_last_tag_unterminated
    input: |
      -- @description Revenue per region.
      -- @vis table
      select 1
  # A metadata block holds a pretty-printed JSON object
  - name: metadata_line_form
    input: |
      -- @metadata
      -- {
      --   "owner": "finance",
      --   "avg_runtime_ms": 1834
      -- }
      -- @end
      select 1
  # Metadata in a block comment
  - name: metadata_block_form
    input: |
      /* @metadata
       * {"owner": "finance"}
       */
      select 1
  # Values can be any JSON, strings that look like tags stay inside the JSON
  - name: metadata_nested_values
    input: |
      -- @metadata
      -- {
      --   "tags": [
      --     "weekly",
      --     -1
      --   ],
      --   "source": {
      --     "dashboard": "Revenue Weekly",
      --     "notes": "first line\nsecond line"
      --   },
      --   "@end": "@end",
      --   "public": true,
      --   "deleted_at": null
      -- }
      -- @end
      select 1
  # Invalid JSON keeps the block but yields no metadata
  - name: metadata_invalid_json
    input: |
      -- @metadata
      -- owner: finance
      -- @end
      select 1
  # The metadata must be an object
  - name: metadata_not_an_object
    input: |
      -- @metadata
      -- ["finance"]
      -- @end
      select 1
  # Only the first metadata block counts, even if it is invalid
  - name: metadata_twice
    input: |
      -- @metadata
      -- {
      -- @end

      -- @metadata
      -- {"owner": "finance"}
      -- @end
      select 1
  # Metadata and a description side by side, the description stays the statement description
  - name: metadata_and_description
    input: |
      -- @metadata
      -- {
      --   "owner": "finance"
      -- }
      -- @end

      -- @description
      -- Revenue per segment.
      -- @end
      select 1
