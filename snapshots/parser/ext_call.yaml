  - name: call_nested
    input: |-
      CALL t.f (a => (b = 1, c = (d = [1, -2, -1.5, true, false, null, 'x'])), e => [], f => (), g => [(h = 1)]);
    expected:
      statements:
        - type: CALL
          ast-begin: 0
          ast-size: 46
          description:
            text: "CALL t.f (..(h = 1)]);"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_CALL
            text: "CALL t.f (..[(h = 1)])"
            children:
              - key: SQL_CALL_NAME
                type: ARRAY
                text: "t.f"
                children:
                  - type: NAME
                    text: "t"
                  - type: NAME
                    text: "f"
              - key: SQL_CALL_ARGS
                type: ARRAY
                text: "(a => (b =..[(h = 1)])"
                children:
                  - type: OBJECT_SQL_FUNCTION_ARG
                    text: "a => (b = ..ll, 'x']))"
                    children:
                      - key: SQL_FUNCTION_ARG_NAME
                        type: NAME
                        text: "a"
                      - key: SQL_FUNCTION_ARG_VALUE
                        type: ARRAY
                        text: "(b = 1, c ..ll, 'x']))"
                        children:
                          - type: OBJECT_EXT_VARARG_FIELD
                            text: "b = 1"
                            children:
                              - key: EXT_VARARG_FIELD_KEY
                                type: NAME
                                text: "b"
                              - key: EXT_VARARG_FIELD_VALUE
                                type: LITERAL_INTEGER
                                text: "1"
                          - type: OBJECT_EXT_VARARG_FIELD
                            text: "c = (d = [..ull, 'x'])"
                            children:
                              - key: EXT_VARARG_FIELD_KEY
                                type: NAME
                                text: "c"
                              - key: EXT_VARARG_FIELD_VALUE
                                type: ARRAY
                                text: "(d = [1, -..ull, 'x'])"
                                children:
                                  - type: OBJECT_EXT_VARARG_FIELD
                                    text: "d = [1, -2..null, 'x']"
                                    children:
                                      - key: EXT_VARARG_FIELD_KEY
                                        type: NAME
                                        text: "d"
                                      - key: EXT_VARARG_FIELD_VALUE
                                        type: OBJECT_EXT_VARARG_ARRAY
                                        text: "[1, -2, -1..null, 'x']"
                                        children:
                                          - key: EXT_VARARG_ARRAY_VALUES
                                            type: ARRAY
                                            text: "[1, -2, -1..null, 'x']"
                                            children:
                                              - type: LITERAL_INTEGER
                                                text: "1"
                                              - type: OBJECT_SQL_NARY_EXPRESSION
                                                text: "-2"
                                                children:
                                                  - key: SQL_EXPRESSION_OPERATOR
                                                    type: ENUM_SQL_EXPRESSION_OPERATOR
                                                    value: NEGATE
                                                  - key: SQL_EXPRESSION_ARGS
                                                    type: ARRAY
                                                    text: "-2"
                                                    children:
                                                      - type: LITERAL_INTEGER
                                                        text: "2"
                                              - type: OBJECT_SQL_NARY_EXPRESSION
                                                text: "-1.5"
                                                children:
                                                  - key: SQL_EXPRESSION_OPERATOR
                                                    type: ENUM_SQL_EXPRESSION_OPERATOR
                                                    value: NEGATE
                                                  - key: SQL_EXPRESSION_ARGS
                                                    type: ARRAY
                                                    text: "-1.5"
                                                    children:
                                                      - type: LITERAL_FLOAT
                                                        text: "1.5"
                                              - type: BOOL
                                                value: 1
                                              - type: BOOL
                                                value: 0
                                              - type: LITERAL_NULL
                                                text: "null"
                                              - type: LITERAL_STRING
                                                text: "'x'"
                  - type: OBJECT_SQL_FUNCTION_ARG
                    text: "e => []"
                    children:
                      - key: SQL_FUNCTION_ARG_NAME
                        type: NAME
                        text: "e"
                      - key: SQL_FUNCTION_ARG_VALUE
                        type: OBJECT_EXT_VARARG_ARRAY
                        text: "[]"
                        children:
                          - key: EXT_VARARG_ARRAY_VALUES
                            type: ARRAY
                            text: "[]"
                            children: []
                  - type: OBJECT_SQL_FUNCTION_ARG
                    text: "f => ()"
                    children:
                      - key: SQL_FUNCTION_ARG_NAME
                        type: NAME
                        text: "f"
                      - key: SQL_FUNCTION_ARG_VALUE
                        type: ARRAY
                        text: "()"
                        children: []
                  - type: OBJECT_SQL_FUNCTION_ARG
                    text: "g => [(h = 1)]"
                    children:
                      - key: SQL_FUNCTION_ARG_NAME
                        type: NAME
                        text: "g"
                      - key: SQL_FUNCTION_ARG_VALUE
                        type: OBJECT_EXT_VARARG_ARRAY
                        text: "[(h = 1)]"
                        children:
                          - key: EXT_VARARG_ARRAY_VALUES
                            type: ARRAY
                            text: "[(h = 1)]"
                            children:
                              - type: ARRAY
                                text: "(h = 1)"
                                children:
                                  - type: OBJECT_EXT_VARARG_FIELD
                                    text: "h = 1"
                                    children:
                                      - key: EXT_VARARG_FIELD_KEY
                                        type: NAME
                                        text: "h"
                                      - key: EXT_VARARG_FIELD_VALUE
                                        type: LITERAL_INTEGER
                                        text: "1"
