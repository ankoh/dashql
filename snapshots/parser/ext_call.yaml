parser-snapshots:

  - name: call_no_args
    input: |-
      CALL foo();
    expected:
      statements:
        - type: CALL
          ast-begin: 0
          ast-size: 3
          description:
            text: "CALL foo();"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_CALL
            text: "CALL foo()"
            children:
              - key: SQL_CALL_NAME
                type: ARRAY
                text: "foo"
                children:
                  - type: NAME
                    text: "foo"
      scanner-errors: []
      parser-errors: []
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []

