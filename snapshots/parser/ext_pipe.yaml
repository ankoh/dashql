          ast-size: 27
          description:
            text: "FROM sales..AS amount;"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "FROM sales.. AS amount"
            children:
              - key: SQL_SELECT_EXPRESSION_STATEMENT
                type: OBJECT_EXT_PIPE
                text: "FROM sales.. AS amount"
                children:
                  - key: EXT_PIPE_SOURCE
                    type: OBJECT_EXT_PIPE_FROM
                    text: "FROM sales"
                    children:
                      - key: EXT_PIPE_FROM
                        type: ARRAY
                        text: "sales"
                        children:
                          - type: OBJECT_SQL_TABLEREF
                            text: "sales"
                            children:
                              - key: SQL_TABLEREF_NAME
                                type: ARRAY
                                text: "sales"
                                children:
