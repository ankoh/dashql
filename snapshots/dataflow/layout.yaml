  - name: LayoutFanoutGrid
    scripts:
      - name: sales
        input: |
          create table sales (region text, amount int);
      - name: by_region
        input: |
          /* @param :min = 10 */
          /** @vis table */
          select region, sum(amount) as amount from sales where amount > :min::int group by region;
      - name: total
        input: |
          /** @vis table */
          select sum(amount) as total from sales;
      - name: top
        input: |
          /* @param :min = 10 */
          /** @vis table */
          select region, amount from sales where amount > :min::int order by amount desc limit 10;
      - name: regions
        input: |
          /** @vis table */
          select distinct region from sales;
      - name: count
        input: |
          /** @vis table */
          select count(*) as orders from sales;
    expected:
      scripts:
        - name: sales
          statements:
            - type: CREATE_TABLE
              target: sales
              text: "create tab..mount int)"
          box: [0,0,280,80]
        - name: by_region
          statements:
            - type: SELECT
              text: "select reg.. by region"
          box: [376,320,280,288]
        - name: total
          statements:
            - type: SELECT
              text: "select sum..from sales"
          box: [376,0,280,288]
        - name: top
          statements:
            - type: SELECT
              text: "select reg..c limit 10"
          box: [688,320,280,288]
        - name: regions
          statements:
            - type: SELECT
              text: "select dis..from sales"
          box: [688,0,280,288]
        - name: count
          statements:
            - type: SELECT
              text: "select cou..from sales"
          box: [1000,0,280,288]
      inputs:
        - name: min
          type: "integer"
          value: "10"
          box: [0,320,200,80]
      edges:
        - from: sales.0
          to: by_region.0
          kind: table
          name: sales
        - from: ":min"
          to: by_region.0
          kind: input
          name: min
        - from: sales.0
          to: total.0
          kind: table
          name: sales
        - from: sales.0
          to: top.0
          kind: table
          name: sales
        - from: ":min"
          to: top.0
          kind: input
          name: min
        - from: sales.0
          to: regions.0
          kind: table
          name: sales
        - from: sales.0
          to: count.0
          kind: table
          name: sales

