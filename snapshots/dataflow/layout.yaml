dataflow-snapshots:

  - name: LayoutChain
    scripts:
      - name: orders
        input: |
          create table orders (id int, amount int);
          create table regions (id int);
          insert into orders values (1, 10);
      - name: report
        input: |
          select sum(amount) as total from orders;
      - name: chart
        input: |
          select total * 2 from :report;
    expected:
      scripts:
        - name: orders
          statements:
            - type: CREATE_TABLE
              target: orders
              text: "create tab..mount int)"
            - type: CREATE_TABLE
              target: regions
              text: "create tab..s (id int)"
            - type: INSERT
              target: orders
              text: "insert int..es (1, 10)"
          box: [0,0,280,144]
        - name: report
          statements:
            - type: SELECT
              text: "select sum..rom orders"
          box: [376,64,280,80]
        - name: chart
          statements:
            - type: SELECT
              text: "select tot..om :report"
          box: [752,64,280,80]
      edges:
        - from: orders.0
          to: orders.2
          kind: table
          name: orders
        - from: orders.2
          to: report.0
          kind: table
          name: orders
        - from: report.0
          to: chart.0
          kind: inline
          name: report

  - name: LayoutChart
    scripts:
      - name: sales
        input: |
          create table sales (region text, amount int);
      - name: by_region
        input: |
          /** @vis table */
          select region, sum(amount) as amount from sales group by region;
      - name: top
        input: |
          select * from :by_region;
    expected:
      scripts:
        - name: sales
          statements:
            - type: CREATE_TABLE
              target: sales
              text: "create tab..mount int)"
          box: [0,0,280,80]
        - name: by_region
          statements:
            - type: SELECT
              text: "select reg.. by region"
          box: [376,0,280,288]
        - name: top
          statements:
            - type: SELECT
              text: "select * f..:by_region"
          box: [752,0,280,80]
      edges:
        - from: sales.0
          to: by_region.0
          kind: table
          name: sales
        - from: by_region.0
          to: top.0
          kind: inline
          name: by_region

