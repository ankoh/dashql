dataflow-snapshots:
  # A table parameter flows from the terminal query of the referenced script
  - name: InlineReferences
    scripts:
      - name: a
        input: |
          select 1 as x;
      - name: b
        input: |
          select x from :a;
      - name: c
        input: |
          select * from :b, :a;

  # A referenced script is a single SELECT, the reference is invalid but still an edge
  - name: InvalidReferenceToScriptWithCommands
    scripts:
      - name: a
        input: |
          create table t (y int);
          select 1 as x;
      - name: b
        input: |
          select x from :a;

  # A statement of the LOCAL connection scans the result of a script of another connection
  - name: ScanReference
    connections:
      - name: trino
        kind: REMOTE
        catalog: |
          create table orders (id int, amount int);
      - name: local
        kind: LOCAL
    scripts:
      - name: remote
        connection: trino
        input: |
          select id, amount from orders;
      - name: report
        connection: local
        input: |
          select sum(amount) from :remote;

  # A REMOTE connection cannot read a script of another connection
  - name: InvalidReferenceAcrossConnections
    connections:
      - name: trino
        kind: REMOTE
      - name: local
        kind: LOCAL
    scripts:
      - name: a
        connection: local
        input: |
          select 1 as x;
      - name: b
        connection: trino
        input: |
          select * from :a;

  # An inlined query reads its relations through the inlined script
  - name: InlinedReadsFlowThroughTheScript
    scripts:
      - name: schema
        input: |
          create table t (a int);
      - name: filtered
        input: |
          select a from t where a > 1;
      - name: report
        input: |
          select count(*) from :filtered;

  # A cycle of references: the reference that closes the cycle is invalid, as the editor reports it
  - name: ReferenceCycle
    scripts:
      - name: a
        input: |
          select * from :b;
      - name: b
        input: |
          select * from :a;

  # A reference to a script whose analysis is behind its text reads nothing until it is analyzed again
  - name: ReferenceToStaleScript
    scripts:
      - name: report
        input: |
          select 1 as x;
        stale-prepend: "select 2 as y;\n"
      - name: chart
        input: |
          select * from :report;

  # A statement that reads a table itself and through an inlined script reads it twice
  - name: InlinedAndDirectRead
    scripts:
      - name: schema
        input: |
          create table t (a int);
      - name: filtered
        input: |
          select a from t where a > 1;
      - name: report
        input: |
          select * from t, :filtered f where t.a = f.a;
