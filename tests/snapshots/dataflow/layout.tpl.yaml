dataflow-snapshots:
  # A chain flows from left to right, a box is aligned with the row it reads
  - name: LayoutChain
    scripts:
      - name: orders
        input: |
          create table orders (id int, amount int);
          create table regions (id int);
          insert into orders values (1, 10);
      - name: report
        input: |
          select sum(amount) as total from orders;
      - name: chart
        input: |
          select total * 2 from :report;

  # The chart of a visualized terminal statement follows its row
  - name: LayoutChart
    scripts:
      - name: sales
        input: |
          create table sales (region text, amount int);
      - name: by_region
        input: |
          /** @vis table */
          select region, sum(amount) as amount from sales group by region;
      - name: top
        input: |
          select * from :by_region;

  # Two consumers of one producer stack in the next layer
  - name: LayoutFanout
    scripts:
      - name: orders
        input: |
          create table orders (id int);
      - name: by_id
        input: |
          select id from orders;
      - name: count
        input: |
          select count(*) from orders;

  # Five charts of one base table stack in one column, an input read by two of them goes before them
  - name: LayoutFanoutGrid
    scripts:
      - name: sales
        input: |
          create table sales (region text, amount int);
      - name: by_region
        input: |
          /* @param :min = 10 */
          /** @vis table */
          select region, sum(amount) as amount from sales where amount > :min::int group by region;
      - name: total
        input: |
          /** @vis table */
          select sum(amount) as total from sales;
      - name: top
        input: |
          /* @param :min = 10 */
          /** @vis table */
          select region, amount from sales where amount > :min::int order by amount desc limit 10;
      - name: regions
        input: |
          /** @vis table */
          select distinct region from sales;
      - name: count
        input: |
          /** @vis table */
          select count(*) as orders from sales;

  # Three consumers stay a column
  - name: LayoutFanoutBelowThreshold
    scripts:
      - name: sales
        input: |
          create table sales (region text, amount int);
      - name: by_region
        input: |
          /** @vis table */
          select region, sum(amount) as amount from sales group by region;
      - name: total
        input: |
          /** @vis table */
          select sum(amount) as total from sales;
      - name: count
        input: |
          /** @vis table */
          select count(*) as orders from sales;

  # A source sits right before its consumer, not in the first layer
  - name: LayoutLateSource
    scripts:
      - name: orders
        input: |
          create table orders (id int, region int);
      - name: filtered
        input: |
          select id, region from orders where id > 1;
      - name: regions
        input: |
          create table regions (id int, name text);
      - name: report
        input: |
          select f.id, r.name from :filtered f, regions r where f.region = r.id;

  # Two separate parts stack, the session order of their consumers does not matter
  - name: LayoutSeparateParts
    scripts:
      - name: a
        input: |
          create table a (x int);
      - name: b
        input: |
          create table b (x int);
      - name: from_b
        input: |
          select x from b;
      - name: from_a
        input: |
          select x from a;

  # The back edge of a cycle is reversed
  - name: LayoutCycle
    scripts:
      - name: a
        input: |
          select * from :b;
      - name: b
        input: |
          select * from :a;

  # Connected parts stack, boxes without edges go into rows of four below them
  - name: LayoutPartsAndIsolatedBoxes
    scripts:
      - name: a
        input: |
          create table a (x int);
      - name: from_a
        input: |
          select x from a;
      - name: b
        input: |
          create table b (x int);
      - name: from_b
        input: |
          select x from b;
      - name: alone_1
        input: |
          select 1;
          select 2;
      - name: alone_2
        input: |
          select 3;
      - name: alone_3
        input: |
          select 4;
      - name: alone_4
        input: |
          select 5;
      - name: alone_5
        input: |
          select 6;

  # A collapsed box is its header, edges attach to it
  - name: LayoutCollapsed
    collapsed: [schema]
    scripts:
      - name: schema
        input: |
          create table a (x int);
          create table b (x int);
          create table c (x int);
          create table t (x int);
      - name: report
        input: |
          select x from t;

  # Boxes with @flow tags stay, a consumer without one goes right of its producers
  - name: LayoutRightOfFixedProducers
    scripts:
      - name: orders
        input: |
          /** @flow x=400 y=800 */
          create table orders (id int);
      - name: regions
        input: |
          /** @flow x=400 y=100 */
          create table regions (id int);
      - name: report
        input: |
          select o.id from orders o, regions r where o.id = r.id;

  # A producer without a position goes left of its consumer
  - name: LayoutLeftOfFixedConsumer
    scripts:
      - name: orders
        input: |
          create table orders (id int);
      - name: report
        input: |
          create table ids (id int);
          /** @flow x=600 y=40 */
          select id from orders;

  # A resized box keeps its width and the height of its chart, a box with only a size goes next to its consumer
  - name: LayoutSizedBoxes
    scripts:
      - name: orders
        input: |
          /** @flow width=400 */
          create table orders (id int);
      - name: report
        input: |
          /**
           * @vis table
           * @flow x=600 y=0 width=320 height=96
           */
          select id from orders;

  # Two consumers that want the same slot, the second one goes below the first like in a fan-out
  - name: LayoutFreeSlot
    scripts:
      - name: orders
        input: |
          /** @flow x=0 y=0 */
          create table orders (id int);
      - name: by_id
        input: |
          select id from orders;
      - name: count
        input: |
          select count(*) from orders;

  # A box without edges and without a position goes below the boxes with positions, at their left edge
  - name: LayoutBelowFixedBoxes
    scripts:
      - name: orders
        input: |
          /** @flow x=120 y=0 */
          create table orders (id int);
          create table regions (id int);
      - name: report
        input: |
          /** @flow x=480 y=200 */
          select 1;
      - name: alone
        input: |
          select 2;

  # The order of the second layer avoids the crossing of the session order in one connected part
  - name: LayoutCrossing
    scripts:
      - name: a
        input: |
          create table a (x int);
      - name: b
        input: |
          create table b (x int);
      - name: from_b
        input: |
          select x from b;
      - name: from_a
        input: |
          select a.x from a, b;

  # An edge across a layer, the dummy node that it passes orders the layer between
  - name: LayoutLongEdge
    scripts:
      - name: a
        input: |
          create table a (x int);
      - name: b
        input: |
          select x from a;
      - name: c
        input: |
          select * from a, :b;

  # A diamond: the two middle boxes share a layer, the join is right of both
  - name: LayoutDiamond
    scripts:
      - name: base
        input: |
          create table base (id int);
      - name: left
        input: |
          select id from base where id > 0;
      - name: right
        input: |
          select id from base where id < 10;
      - name: joined
        input: |
          select * from :left l, :right r where l.id = r.id;

  # A long chain: one layer per box, every box level with the row it reads
  - name: LayoutLongChain
    scripts:
      - name: s1
        input: |
          select 1 as x;
      - name: s2
        input: |
          select x from :s1;
      - name: s3
        input: |
          select x from :s2;
      - name: s4
        input: |
          select x from :s3;
      - name: s5
        input: |
          select x from :s4;
      - name: s6
        input: |
          select x from :s5;
      - name: s7
        input: |
          select x from :s6;
      - name: s8
        input: |
          select x from :s7;

  # Many boxes in three layers with crossing references
  - name: LayoutManyNodes
    scripts:
      - name: orders
        input: |
          create table orders (id int, customer int, amount int);
      - name: customers
        input: |
          create table customers (id int, region text);
      - name: products
        input: |
          create table products (id int, name text);
      - name: big_orders
        input: |
          select * from orders where amount > 100;
      - name: eu_customers
        input: |
          select * from customers where region = 'EU';
      - name: eu_orders
        input: |
          select o.* from :big_orders o, :eu_customers c where o.customer = c.id;
      - name: product_names
        input: |
          select name from products;
      - name: report
        input: |
          select count(*) from :eu_orders, :product_names;
      - name: totals
        input: |
          select sum(amount) from :big_orders;
      - name: summary
        input: |
          select * from :report, :totals;

  # The references of LayoutManyNodes in reverse session order, after the tables they read: the same columns, the
  # order within a column follows the session order
  - name: LayoutManyNodesReordered
    scripts:
      - name: orders
        input: |
          create table orders (id int, customer int, amount int);
      - name: customers
        input: |
          create table customers (id int, region text);
      - name: products
        input: |
          create table products (id int, name text);
      - name: summary
        input: |
          select * from :report, :totals;
      - name: totals
        input: |
          select sum(amount) from :big_orders;
      - name: report
        input: |
          select count(*) from :eu_orders, :product_names;
      - name: product_names
        input: |
          select name from products;
      - name: eu_orders
        input: |
          select o.* from :big_orders o, :eu_customers c where o.customer = c.id;
      - name: eu_customers
        input: |
          select * from customers where region = 'EU';
      - name: big_orders
        input: |
          select * from orders where amount > 100;

  # Disconnected parts of different shapes, a chain, a pair and a fan-out, stack
  - name: LayoutDisconnectedParts
    scripts:
      - name: a1
        input: |
          select 1 as x;
      - name: a2
        input: |
          select x from :a1;
      - name: a3
        input: |
          select x from :a2;
      - name: b1
        input: |
          select 2 as y;
      - name: b2
        input: |
          select y from :b1;
      - name: c1
        input: |
          create table c (z int);
      - name: c2
        input: |
          select z from c;
      - name: c3
        input: |
          select count(*) from c;
      - name: c4
        input: |
          select max(z) from c;

  # A box that reads itself has no edge between boxes, it lays out like a box without edges
  - name: LayoutSelfReference
    scripts:
      - name: a
        input: |
          select * from :a;
      - name: b
        input: |
          select 1;

  # A box with edges out of several rows: one port per row, the consumers line up with their rows
  - name: LayoutPortsOfSeveralRows
    scripts:
      - name: schema
        input: |
          create table a (x int);
          create table b (x int);
          create table c (x int);
      - name: from_c
        input: |
          select x from c;
      - name: from_a
        input: |
          select x from a;
      - name: from_b
        input: |
          select x from b;

  # A collapsed box in the middle of a chain: edges into and out of it attach to its header
  - name: LayoutCollapsedInChain
    collapsed: [middle]
    scripts:
      - name: schema
        input: |
          create table t (x int);
      - name: middle
        input: |
          insert into t values (1);
          insert into t values (2);
          create table u as select x from t;
      - name: report
        input: |
          select x from u;

  # A cycle whose boxes have positions keeps them, the edges are routed between them
  - name: LayoutCycleWithPositions
    scripts:
      - name: a
        input: |
          /** @flow x=0 y=0 */
          select * from :b;
      - name: b
        input: |
          /** @flow x=480 y=0 */
          select * from :a;

  # Two boxes with the same position: the second goes below the first in their column
  - name: LayoutOverlappingPositions
    scripts:
      - name: orders
        input: |
          /** @flow x=0 y=0 */
          create table orders (id int);
      - name: by_id
        input: |
          /** @flow x=480 y=0 */
          select id from orders;
      - name: count
        input: |
          /** @flow x=480 y=0 */
          select count(*) from orders;

  # Only the boxes of one part have positions, the other part goes below them
  - name: LayoutPartWithoutPositions
    scripts:
      - name: a
        input: |
          /** @flow x=200 y=100 */
          create table a (x int);
      - name: from_a
        input: |
          /** @flow x=680 y=100 */
          select x from a;
      - name: b
        input: |
          create table b (x int);
      - name: from_b
        input: |
          select x from b;

  # Inputs go left of the boxes they feed, an input read by boxes of two layers goes before the first
  - name: LayoutInputsAcrossLayers
    scripts:
      - name: base
        input: |
          /* @param :min = 1 */
          select x from generate_series(1, 10) s(x) where x > :min::int;
      - name: derived
        input: |
          /* @param :min = 1 */
          select x from :base where x > :min::int;
      - name: other
        input: |
          /* @param :max = 5 */
          select x from :derived where x < :max::int;

  # A wide fan-in: six producers stack in one column, the consumer is level with the middle of them
  - name: LayoutWideFanIn
    scripts:
      - name: t1
        input: |
          create table t1 (x int);
      - name: t2
        input: |
          create table t2 (x int);
      - name: t3
        input: |
          create table t3 (x int);
      - name: t4
        input: |
          create table t4 (x int);
      - name: t5
        input: |
          create table t5 (x int);
      - name: t6
        input: |
          create table t6 (x int);
      - name: joined
        input: |
          select * from t1, t2, t3, t4, t5, t6;

  # Without any edge every box goes into rows of four from the origin, a row is as high as its highest box
  - name: LayoutOnlyIsolatedBoxes
    scripts:
      - name: a
        input: |
          select 1;
      - name: b
        input: |
          select 1;
          select 2;
          select 3;
      - name: c
        input: |
          /** @vis table */
          select 1 as x;
      - name: d
        input: |
          select 1;
      - name: e
        input: |
          /* nothing yet */
      - name: f
        input: |
          select 1;
          select 2;
      - name: g
        input: |
          select 1;
      - name: h
        input: |
          select 1;
      - name: i
        input: |
          select 1;

  # Two edges between the same boxes that cross: the rows of the producer and of the consumer are in opposite order
  - name: LayoutTwoEdgesBetweenTwoBoxes
    scripts:
      - name: schema
        input: |
          create table a (x int);
          create table b (x int);
      - name: report
        input: |
          select x from b;
          select x from a;

  # A box without a position between a producer and a consumer with positions goes right of its producer
  - name: LayoutBetweenFixedBoxes
    scripts:
      - name: producer
        input: |
          /** @flow x=0 y=0 */
          create table t (x int);
      - name: middle
        input: |
          create table u as select x from t;
      - name: consumer
        input: |
          /** @flow x=1000 y=300 */
          select x from u;

  # Negative positions stay, a box without edges keeps its negative position too
  - name: LayoutNegativePositions
    scripts:
      - name: producer
        input: |
          /** @flow x=-600 y=-200 */
          create table t (x int);
      - name: consumer
        input: |
          /** @flow x=-120 y=-200 */
          select x from t;
      - name: alone
        input: |
          /** @flow x=-600 y=400 */
          select 1;

  # An input has no position, it goes left of the box with a position that it feeds
  - name: LayoutInputOfFixedBox
    scripts:
      - name: report
        input: |
          /* @param :min = 1
             @flow x=400 y=100 */
          select x from generate_series(1, 10) s(x) where x > :min::int;
      - name: chart
        input: |
          /** @flow x=800 y=100 */
          select x from :report;

  # Only a visualized terminal statement gets a chart, a visualized statement before it is a row
  - name: LayoutChartOfNonTerminalStatement
    scripts:
      - name: base
        input: |
          create table t (x int);
          /** @vis table */
          select x from t;
          insert into t values (1);
      - name: consumer
        input: |
          select x from t;

  # A collapsed box has no chart, it is the header of a box without one
  - name: LayoutCollapsedChart
    collapsed: [chart]
    scripts:
      - name: base
        input: |
          create table t (x int);
      - name: chart
        input: |
          /** @vis table */
          select x from t;
      - name: after
        input: |
          select * from :chart;

  # A chart in the middle of a chain: its consumer is level with its row, not with its chart
  - name: LayoutChartInChain
    scripts:
      - name: base
        input: |
          create table t (x int);
          insert into t values (1);
      - name: chart
        input: |
          /** @vis table */
          select x from t;
      - name: after
        input: |
          select * from :chart;

  # A wide box overlaps the x ranges of two columns and merges them, the edges keep the boxes in two layers
  - name: LayoutWideBoxSpansColumns
    scripts:
      - name: a
        input: |
          /** @flow x=0 y=0 */
          create table t (x int);
      - name: b
        input: |
          /** @flow x=480 y=0 */
          select x from t;
      - name: wide
        input: |
          /** @flow x=0 y=300 width=900 */
          select count(*) from t;

  # A binary tree of references: every box is level with the middle of its consumers
  - name: LayoutBinaryTree
    scripts:
      - name: root
        input: |
          select 1 as x;
      - name: l
        input: |
          select x from :root where x > 0;
      - name: r
        input: |
          select x from :root where x <= 0;
      - name: ll
        input: |
          select x from :l where x > 10;
      - name: lr
        input: |
          select x from :l where x <= 10;
      - name: rl
        input: |
          select x from :r where x > -10;
      - name: rr
        input: |
          select x from :r where x <= -10;

  # A consumer left of its producer keeps its y, the edge runs around the top of the boxes
  - name: LayoutConsumerLeftOfProducer
    scripts:
      - name: producer
        input: |
          /** @flow x=800 y=0 */
          create table t (x int);
      - name: consumer
        input: |
          /** @flow x=0 y=400 */
          select x from t;

  # A cycle of three: the back edge runs around the bottom of the boxes
  - name: LayoutCycleOfThree
    scripts:
      - name: a
        input: |
          select * from :c;
      - name: b
        input: |
          select * from :a;
      - name: c
        input: |
          select * from :b;

  # Eight consumers of one producer stack in one column, the producer is level with one in the middle
  - name: LayoutWideFanOut
    scripts:
      - name: base
        input: |
          create table base (x int);
      - name: c1
        input: |
          select x from base;
      - name: c2
        input: |
          select x from base;
      - name: c3
        input: |
          select x from base;
      - name: c4
        input: |
          select x from base;
      - name: c5
        input: |
          select x from base;
      - name: c6
        input: |
          select x from base;
      - name: c7
        input: |
          select x from base;
      - name: c8
        input: |
          select x from base;

  # A fan-in and a fan-out of one box: the hub is level with the middle of both columns
  - name: LayoutBowtie
    scripts:
      - name: a
        input: |
          create table a (x int);
      - name: b
        input: |
          create table b (x int);
      - name: c
        input: |
          create table c (x int);
      - name: hub
        input: |
          create table hub as select a.x from a, b, c;
      - name: o1
        input: |
          select x from hub;
      - name: o2
        input: |
          select x from hub;
      - name: o3
        input: |
          select x from hub;

  # An edge that skips three layers of a chain runs below the chain
  - name: LayoutEdgeSkipsLayers
    scripts:
      - name: s1
        input: |
          create table t1 (x int);
      - name: s2
        input: |
          create table t2 as select x from t1;
      - name: s3
        input: |
          create table t3 as select x from t2;
      - name: s4
        input: |
          create table t4 as select x from t3;
      - name: s5
        input: |
          select * from t4, t1;

  # Edges out of three rows of one box into one row: the consumer is level with the middle row
  - name: LayoutFanInFromRowsOfOneBox
    scripts:
      - name: schema
        input: |
          create table a (x int);
          create table b (x int);
          create table c (x int);
      - name: report
        input: |
          select * from a, b, c;

  # Two edges from right to left: the boxes start below the room that both take around their top
  - name: LayoutTwoEdgesRightToLeft
    scripts:
      - name: p1
        input: |
          /** @flow x=800 y=0 */
          create table t (x int);
      - name: p2
        input: |
          /** @flow x=800 y=200 */
          create table u (x int);
      - name: consumer
        input: |
          /** @flow x=0 y=300 */
          select * from t, u;

  # A part with positions stays, a box without edges keeps its position, the part without positions and the box
  # without edges and position go below everything
  - name: LayoutFixedPartFreshPartAndLooseBoxes
    scripts:
      - name: a
        input: |
          /** @flow x=0 y=0 */
          create table a (x int);
      - name: from_a
        input: |
          /** @flow x=500 y=0 */
          select x from a;
      - name: b
        input: |
          create table b (x int);
      - name: from_b
        input: |
          select x from b;
      - name: pinned
        input: |
          /** @flow x=1200 y=600 */
          select 1;
      - name: loose
        input: |
          select 2;

  # The sizes of @flow tags are taken as written, also outside the bounds of a resize. An x without y is no position.
  - name: LayoutSizesOutsideTheResizeBounds
    scripts:
      - name: base
        input: |
          /** @flow x=300 width=2000 */
          create table base (x int);
      - name: tiny
        input: |
          /** @flow width=10 */
          select x from base;
