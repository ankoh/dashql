  - name: QuotedInputName
    catalog: |
      create table orders (id int, region text);
    scripts:
      - name: a
        input: |
          /* @param :"the region" = 'EU' */
          select id from orders where region = :"the region";
    expected:
      scripts:
        - name: a
          statements:
            - type: SELECT
              text: "select id ..he region\""
          box: [344,0,280,80]
      inputs:
        - name: the region
          type: "text"
          cast: false
          value: "'EU'"
          box: [0,0,200,80]
      edges:
        - from: ":the region"
          to: a.0
          kind: input
          name: the region
          route: [[200,56],[344,56]]

  - name: InputInCommands
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: load
        input: |
          /* @param :min = 10 */
          create table big as select * from orders where amount > :min::int;
          insert into big select * from orders where amount = :min::int;
      - name: report
        input: |
          select count(*) from big;
    expected:
      scripts:
        - name: load
          statements:
            - type: CREATE_TABLE_AS
              target: big
              text: "create tab.. :min::int"
            - type: INSERT
              target: big
              text: "insert int.. :min::int"
          box: [344,0,280,112]
        - name: report
          statements:
            - type: SELECT
              text: "select cou..) from big"
          box: [768,32,280,80]
      inputs:
        - name: min
          type: "integer"
          value: "10"
          box: [0,32,200,80]
      edges:
        - from: ":min"
          to: load.0
          kind: input
          name: min
          route: [[200,88],[272,88],[272,56],[344,56]]
        - from: load.0
          to: load.1
          kind: table
          name: big
        - from: ":min"
          to: load.1
          kind: input
          name: min
          route: [[200,88],[344,88]]
        - from: load.1
          to: report.0
          kind: table
          name: big
          route: [[624,88],[768,88]]

  - name: InputOfStaleScript
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: a
        input: |
          /* @param :min = 10 */
          select id from orders where amount > :min::int;
        stale-prepend: "select 1;\n"
      - name: b
        input: |
          /* @param :max = 20 */
          select id from orders where amount < :max::int;
    expected:
      scripts:
        - name: a
          analyzed: false
          box: [0,176,280,32]
        - name: b
          statements:
            - type: SELECT
              text: "select id .. :max::int"
          box: [344,0,280,80]
      inputs:
        - name: max
          type: "integer"
          value: "20"
          box: [0,0,200,80]
      edges:
        - from: ":max"
          to: b.0
          kind: input
          name: max
          route: [[200,56],[344,56]]

  - name: InputOrderOfFirstUse
    scripts:
      - name: a
        input: |
          /**
           * @param :first = 1
           * @param :second = 2
           */
          select :second::int;
      - name: b
        input: |
          select :first::int, :second::int;
    expected:
      scripts:
        - name: a
          statements:
            - type: SELECT
              text: "select :second::int"
          box: [344,0,280,80]
        - name: b
          statements:
            - type: SELECT
              text: "select :fi..econd::int"
          box: [344,128,280,80]
      inputs:
        - name: second
          type: "integer"
          value: "2"
          box: [0,0,200,80]
        - name: first
          type: "integer"
          value: "1"
          box: [0,128,200,80]
      edges:
        - from: ":second"
          to: a.0
          kind: input
          name: second
          route: [[200,56],[344,56]]
        - from: ":second"
          to: b.0
          kind: input
          name: second
          route: [[200,56],[272,56],[272,184],[344,184]]
        - from: ":first"
          to: b.0
          kind: input
          name: first
          route: [[200,184],[344,184]]
