  - name: InputUsedTwice
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: a
        input: |
          /* @param :n = 5 */
          select id from orders where amount > :n and id < :n;
          select count(*) from orders where amount > :n;
    expected:
      scripts:
        - name: a
          statements:
            - type: SELECT
              text: "select id ..nd id < :n"
            - type: SELECT
              text: "select cou..mount > :n"
          box: [344,0,280,112]
      inputs:
        - name: n
          type: "bigint"
          cast: false
          value: "5"
          box: [0,32,200,80]
      edges:
        - from: ":n"
          to: a.0
          kind: input
          name: n
          route: [[200,88],[272,88],[272,56],[344,56]]
        - from: ":n"
          to: a.1
          kind: input
          name: n
          route: [[200,88],[344,88]]

  - name: InputLiteralTypes
    scripts:
      - name: a
        input: |
          /**
