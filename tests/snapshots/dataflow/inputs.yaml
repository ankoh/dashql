        - from: ":s"
          to: a.0
          kind: input
          name: s
          route: [[200,312],[272,312],[272,440],[344,440]]
        - from: ":b"
          to: a.0
          kind: input
          name: b
          route: [[200,440],[344,440]]
        - from: ":d"
          to: a.0
          kind: input
          name: d
          route: [[200,568],[272,568],[272,440],[344,440]]
        - from: ":span"
          to: a.0
          kind: input
