           * @param :s = 'EU'
           * @param :b = true
           * @param :d = date '2024-01-01'
           * @param :span = interval '3' day
           * @param :nothing = null
           */
          select :i, :neg, :s, :b, :d, :span, :nothing;
    expected:
      scripts:
        - name: a
          statements:
            - type: SELECT
              text: "select :i,.., :nothing"
          box: [344,384,280,80]
      inputs:
        - name: i
          type: "bigint"
          cast: false
          value: "10"
          box: [0,0,200,80]
        - name: neg
          type: "numeric"
          cast: false
          value: "-2.5"
          box: [0,128,200,80]
        - name: s
          type: "text"
          cast: false
          value: "'EU'"
          box: [0,256,200,80]
        - name: b
          type: "boolean"
          cast: false
          value: "true"
          box: [0,384,200,80]
        - name: d
          type: "date"
          cast: false
          value: "date '2024-01-01'"
          box: [0,512,200,80]
        - name: span
