dataflow-snapshots:

  - name: LastWriter
    scripts:
      - name: schema
        input: |
          create table t (a int);
          insert into t values (1);
          select a from t;
      - name: more
        input: |
          insert into t select a + 1 from t;
      - name: read
        input: |
          select count(*) from t;
    expected:
      scripts:
        - name: schema
          statements:
            - type: CREATE_TABLE
              target: t
              text: "create tab.. t (a int)"
            - type: INSERT
              target: t
              text: "insert int..values (1)"
            - type: SELECT
              text: "select a from t"
          box: [0,0,280,144]
        - name: more
          statements:
            - type: INSERT
              target: t
              text: "insert int..+ 1 from t"
          box: [424,32,280,80]
        - name: read
          statements:
            - type: SELECT
              text: "select cou..(*) from t"
          box: [848,32,280,80]
      edges:
        - from: schema.0
          to: schema.1
          kind: table
          name: t
        - from: schema.1
          to: schema.2
          kind: table
          name: t
        - from: schema.1
          to: more.0
          kind: table
          name: t
          route: [[280,88],[424,88]]
        - from: more.0
          to: read.0
          kind: table
          name: t
          route: [[704,88],[848,88]]

