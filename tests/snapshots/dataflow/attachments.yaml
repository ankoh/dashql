dataflow-snapshots:

  - name: AttachmentsFlowIntoStatements
    connections:
      - name: local
        kind: LOCAL
    attachments:
      - file: sales.parquet
        stamp: 1
      - file: unused.parquet
        stamp: 1
    scripts:
      - name: foo
        connection: local
        input: |
          select region, amount from :sales where amount > 5;
      - name: bar
        connection: local
        input: |
          select count(*) from :foo;
          select * from :sales s, :foo f where s.region = f.region;
    expected:
      scripts:
        - name: foo
          statements:
            - type: SELECT
              text: "select reg..amount > 5"
          box: [344,0,280,80]
        - name: bar
          statements:
            - type: SELECT
              text: "select cou.. from :foo"
            - type: SELECT
              text: "select * f..= f.region"
          box: [768,0,280,112]
      attachments:
        - name: sales
          file: sales.parquet
          box: [0,48,200,80]
        - name: unused
          file: unused.parquet
          box: [0,224,200,80]
      edges:
        - from: sales.parquet
          to: foo.0
          kind: attachment
          name: sales
          route: [[200,104],[272,104],[272,56],[344,56]]
        - from: foo.0
          to: bar.0
          kind: inline
          name: foo
          route: [[624,56],[768,56]]
        - from: foo.0
          to: bar.1
          kind: inline
          name: foo
          route: [[624,56],[696,56],[696,88],[768,88]]
        - from: sales.parquet
          to: bar.1
          kind: attachment
          name: sales
          route: [[200,104],[696,104],[696,88],[768,88]]

  - name: RemoteReadsAttachment
    connections:
      - name: trino
        kind: REMOTE
    attachments:
      - file: sales.parquet
        stamp: 1
    scripts:
      - name: bar
        connection: trino
        input: |
          select * from :sales;
    expected:
      scripts:
        - name: bar
          statements:
            - type: SELECT
              text: "select * f..rom :sales"
          box: [0,0,280,80]
      attachments:
        - name: sales
          file: sales.parquet
          box: [328,0,200,80]
      edges: []

  - name: AttachmentNameCollision
    connections:
      - name: local
        kind: LOCAL
    attachments:
      - file: sales.parquet
        stamp: 1
    scripts:
      - name: sales
        connection: local
        input: |
          select 1 as amount;
      - name: report
        connection: local
        input: |
          select * from :sales;
    expected:
      scripts:
        - name: sales
          statements:
            - type: SELECT
              text: "select 1 as amount"
          box: [0,0,280,80]
        - name: report
          statements:
            - type: SELECT
              text: "select * f..rom :sales"
          box: [328,0,280,80]
      attachments:
        - name: sales
          file: sales.parquet
          box: [656,0,200,80]
      edges: []

  - name: AttachmentAndInput
    connections:
      - name: local
        kind: LOCAL
    attachments:
      - file: sales.parquet
        stamp: 1
      - file: regions.parquet
        stamp: 1
    scripts:
      - name: report
        connection: local
        input: |
          /* @param :min = 10 */
          select * from :sales s, :regions r where s.region = r.region and s.amount > :min::int;
    expected:
      scripts:
        - name: report
          statements:
            - type: SELECT
              text: "select * f.. :min::int"
          box: [344,128,280,80]
      inputs:
        - name: min
          type: "integer"
          value: "10"
          box: [0,0,200,80]
      attachments:
        - name: sales
          file: sales.parquet
          box: [0,128,200,80]
        - name: regions
          file: regions.parquet
          box: [0,256,200,80]
      edges:
        - from: ":min"
          to: report.0
          kind: input
          name: min
          route: [[200,56],[272,56],[272,184],[344,184]]
        - from: sales.parquet
          to: report.0
          kind: attachment
          name: sales
          route: [[200,184],[344,184]]
        - from: regions.parquet
          to: report.0
          kind: attachment
          name: regions
          route: [[200,312],[272,312],[272,184],[344,184]]
