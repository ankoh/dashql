dataflow-snapshots:
  # A load writes its table, the read of the table follows it
  - name: CopyLoadFlowsIntoRead
    scripts:
      - name: setup
        input: |
          create table t (a int);
      - name: load
        input: |
          copy t from '/tmp/t.csv';
      - name: read
        input: |
          select * from t;

  # A chain without positions after a box with a position goes from left to right, level with it
  - name: LayoutChainAfterPositionedBox
    scripts:
      - name: a
        input: |
          /** @flow x=200 y=100 */
          create table a (x int);
      - name: b
        input: |
          create table b as select x from a;
      - name: c
        input: |
          select x from b;

  # A chain without positions before a box with a position goes from left to right, level with it
  - name: LayoutChainBeforePositionedBox
    scripts:
      - name: a
        input: |
          create table a (x int);
      - name: b
        input: |
          create table b as select x from a;
      - name: c
        input: |
          /** @flow x=800 y=100 */
          select x from b;

  # A scan of a script below its consumer runs later, the reference is invalid
  - name: ScanOfALaterScript
    connections:
      - name: local
        kind: LOCAL
      - name: trino
        kind: REMOTE
    scripts:
      - name: bar
        connection: local
        input: |
          select count(*) from :foo;
      - name: foo
        connection: trino
        input: |
          select 1 as x;
