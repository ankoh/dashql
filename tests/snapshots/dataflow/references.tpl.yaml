dataflow-snapshots:
  # A table parameter flows from the terminal query of the referenced script
  - name: InlineReferences
    scripts:
      - name: a
        input: |
          select 1 as x;
      - name: b
        input: |
          select x from :a;
      - name: c
        input: |
          select * from :b, :a;

  # A script that runs only on request is part of the dataflow
  - name: ManualReference
    scripts:
      - name: a
        input: |
          /* @manual */
          select 1 as x;
      - name: b
        input: |
          select x from :a where x > 0;

  # A referenced script is a single SELECT, the reference is invalid but still an edge
  - name: InvalidReferenceToScriptWithCommands
    scripts:
      - name: a
        input: |
          create table t (y int);
          select 1 as x;
      - name: b
        input: |
          select x from :a;

  # A statement of the LOCAL connection scans the result of a script of another connection
  - name: ScanReference
    connections:
      - name: trino
        kind: REMOTE
        catalog: |
          create table orders (id int, amount int);
      - name: local
        kind: LOCAL
    scripts:
      - name: remote
        connection: trino
        input: |
          select id, amount from orders;
      - name: report
        connection: local
        input: |
          select sum(amount) from :remote;

  # A REMOTE connection cannot read a script of another connection
  - name: InvalidReferenceAcrossConnections
    connections:
      - name: trino
        kind: REMOTE
      - name: local
        kind: LOCAL
    scripts:
      - name: a
        connection: local
        input: |
          select 1 as x;
      - name: b
        connection: trino
        input: |
          select * from :a;

  # An inlined query reads its relations through the inlined script
  - name: InlinedReadsFlowThroughTheScript
    scripts:
      - name: schema
        input: |
          create table t (a int);
      - name: filtered
        input: |
          select a from t where a > 1;
      - name: report
        input: |
          select count(*) from :filtered;

  # A cycle of references: the reference that closes the cycle is invalid, as the editor reports it
  - name: ReferenceCycle
    scripts:
      - name: a
        input: |
          select * from :b;
      - name: b
        input: |
          select * from :a;

  # A reference to a script whose analysis is behind its text reads nothing until it is analyzed again
  - name: ReferenceToStaleScript
    scripts:
      - name: report
        input: |
          select 1 as x;
        stale-prepend: "select 2 as y;\n"
      - name: chart
        input: |
          select * from :report;

  # A statement that reads a table itself and through an inlined script reads it twice
  - name: InlinedAndDirectRead
    scripts:
      - name: schema
        input: |
          create table t (a int);
      - name: filtered
        input: |
          select a from t where a > 1;
      - name: report
        input: |
          select * from t, :filtered f where t.a = f.a;

  # Two scripts read one script and a fourth reads both: the diamond has one edge per reference
  - name: ReferenceDiamond
    scripts:
      - name: base
        input: |
          select 1 as x;
      - name: left
        input: |
          select x from :base where x > 0;
      - name: right
        input: |
          select x from :base where x < 10;
      - name: joined
        input: |
          select * from :left l, :right r where l.x = r.x;

  # A table parameter that finds no script and no attachment has no edge, the editor reports the error
  - name: ReferenceToUnknownScript
    scripts:
      - name: a
        input: |
          select 1 as x;
      - name: b
        input: |
          select * from :missing;
          select * from :a;

  # A script that reads itself is a cycle of one, the invalid reference is an edge of the statement to itself
  - name: SelfReference
    scripts:
      - name: a
        input: |
          select * from :a;

  # A cycle of three scripts: the reference that closes the cycle is invalid, a reference into the cycle is not
  - name: ReferenceCycleOfThree
    scripts:
      - name: a
        input: |
          select * from :c;
      - name: b
        input: |
          select * from :a;
      - name: c
        input: |
          select * from :b;
      - name: outside
        input: |
          select * from :a;

  # One script read twice by one statement is one edge
  - name: SameReferenceTwice
    scripts:
      - name: a
        input: |
          select 1 as x;
      - name: b
        input: |
          select * from :a l, :a r where l.x = r.x;

  # A table parameter finds a script that differs only in ASCII case
  - name: ReferenceIgnoresCase
    scripts:
      - name: orders
        input: |
          select 1 as id;
      - name: report
        input: |
          select id from :ORDERS;

  # A script without statements has no terminal query, a reference to it has no edge
  - name: ReferenceToEmptyScript
    scripts:
      - name: empty
        input: |
          /* nothing yet */
      - name: report
        input: |
          select * from :empty;

  # A chain of inline references: every consumer reads the script it names, not the scripts behind it
  - name: InlineReferenceChain
    scripts:
      - name: a
        input: |
          select 1 as x;
      - name: b
        input: |
          select x + 1 as x from :a;
      - name: c
        input: |
          select x + 1 as x from :b;
      - name: d
        input: |
          select x + 1 as x from :c;

  # A REMOTE script is inlined by a script of its connection and scanned by a script of the LOCAL connection
  - name: InlineAndScanOfOneScript
    connections:
      - name: trino
        kind: REMOTE
        catalog: |
          create table orders (id int, amount int);
      - name: local
        kind: LOCAL
    scripts:
      - name: big
        connection: trino
        input: |
          select id, amount from orders where amount > 10;
      - name: remote_count
        connection: trino
        input: |
          select count(*) from :big;
      - name: local_sum
        connection: local
        input: |
          select sum(amount) from :big;

  # A table created from a reference continues the flow of the referenced script as a table edge
  - name: CreateTableFromReference
    scripts:
      - name: a
        input: |
          select 1 as x;
      - name: b
        input: |
          create table t as select x from :a;
      - name: c
        input: |
          select x from t;

  # A @manual script cannot be scanned from another connection, the reference is invalid but still an edge
  - name: ManualReferenceAcrossConnections
    connections:
      - name: trino
        kind: REMOTE
      - name: local
        kind: LOCAL
    scripts:
      - name: all_orders
        connection: trino
        input: |
          /* @manual */
          select 1 as id;
      - name: west
        connection: local
        input: |
          select * from :all_orders;

  # A script that does not parse is one statement, a reference to it is invalid
  - name: ScriptThatDoesNotParse
    scripts:
      - name: broken
        input: |
          select from where 1;
      - name: after
        input: |
          select * from :broken;

  # A script of several statements that does not parse is one statement too, a reference to it is invalid
  - name: ScriptOfStatementsThatDoesNotParse
    scripts:
      - name: broken
        input: |
          select from where 1;
          select 1 as a;
      - name: after
        input: |
          select * from :broken;

  # The inlined script reads the table before the writer, the consumer after it: the table edge goes into the consumer
  - name: InlinedReadBeforeTheWriter
    catalog: |
      create table t (a int);
    scripts:
      - name: base
        input: |
          select a from t;
      - name: write
        input: |
          insert into t values (1);
      - name: top
        input: |
          select * from :base;

  # A chain of inline references reads a table through its first script, the scripts behind it have no table edge
  - name: InlinedChainReadsThroughFirstScript
    scripts:
      - name: write
        input: |
          create table t (a int);
      - name: base
        input: |
          select a from t;
      - name: mid
        input: |
          select a + 1 as a from :base;
      - name: top
        input: |
          select * from :mid;

  # A table, a scan, an inline reference and a table within one script form one chain across two connections
  - name: ScanChainAcrossConnections
    connections:
      - name: trino
        kind: REMOTE
      - name: local
        kind: LOCAL
    scripts:
      - name: setup
        connection: trino
        input: |
          create table t (a int);
      - name: foo
        connection: trino
        input: |
          select a from t;
      - name: bar
        connection: local
        input: |
          select * from :foo;
      - name: baz
        connection: local
        input: |
          create table u as select * from :bar;
          select * from u;
