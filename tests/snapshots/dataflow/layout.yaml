dataflow-snapshots:

  - name: LayoutChain
    scripts:
      - name: orders
        input: |
          create table orders (id int, amount int);
          create table regions (id int);
          insert into orders values (1, 10);
      - name: report
        input: |
          select sum(amount) as total from orders;
      - name: chart
        input: |
          select total * 2 from :report;
    expected:
      scripts:
        - name: orders
          statements:
            - type: CREATE_TABLE
              target: orders
              text: "create tab..mount int)"
            - type: CREATE_TABLE
              target: regions
              text: "create tab..s (id int)"
            - type: INSERT
              target: orders
              text: "insert int..es (1, 10)"
          box: [0,0,280,144]
        - name: report
          statements:
            - type: SELECT
              text: "select sum..rom orders"
          box: [424,64,280,80]
        - name: chart
          statements:
            - type: SELECT
              text: "select tot..om :report"
          box: [848,64,280,80]
      edges:
        - from: orders.0
          to: orders.2
          kind: table
          name: orders
        - from: orders.2
          to: report.0
          kind: table
          name: orders
          route: [[280,120],[424,120]]
        - from: report.0
          to: chart.0
          kind: inline
          name: report
          route: [[704,120],[848,120]]

