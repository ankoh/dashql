  - name: LayoutFanoutGrid
    scripts:
      - name: sales
        input: |
          create table sales (region text, amount int);
      - name: by_region
        input: |
          /* @param :min = 10 */
          /** @vis table */
          select region, sum(amount) as amount from sales where amount > :min::int group by region;
      - name: total
        input: |
          /** @vis table */
          select sum(amount) as total from sales;
      - name: top
        input: |
          /* @param :min = 10 */
          /** @vis table */
          select region, amount from sales where amount > :min::int order by amount desc limit 10;
      - name: regions
        input: |
          /** @vis table */
          select distinct region from sales;
      - name: count
        input: |
          /** @vis table */
          select count(*) as orders from sales;
    expected:
      scripts:
        - name: sales
          statements:
            - type: CREATE_TABLE
              target: sales
              text: "create tab..mount int)"
          box: [0,672,280,80]
        - name: by_region
          statements:
            - type: SELECT
              text: "select reg.. by region"
          box: [424,0,480,288]
        - name: total
          statements:
            - type: SELECT
              text: "select sum..from sales"
          box: [424,672,480,288]
        - name: top
          statements:
            - type: SELECT
              text: "select reg..c limit 10"
          box: [424,336,480,288]
        - name: regions
          statements:
            - type: SELECT
              text: "select dis..from sales"
          box: [424,1008,480,288]
        - name: count
          statements:
            - type: SELECT
              text: "select cou..from sales"
          box: [424,1344,480,288]
      inputs:
        - name: min
          type: "integer"
          value: "10"
          box: [80,336,200,80]
      edges:
        - from: sales.0
          to: by_region.0
          kind: table
          name: sales
          route: [[280,728],[352,728],[352,56],[424,56]]
        - from: ":min"
          to: by_region.0
          kind: input
          name: min
          route: [[280,392],[352,392],[352,56],[424,56]]
        - from: sales.0
          to: total.0
          kind: table
          name: sales
          route: [[280,728],[424,728]]
        - from: sales.0
          to: top.0
          kind: table
          name: sales
          route: [[280,728],[352,728],[352,392],[424,392]]
        - from: ":min"
          to: top.0
          kind: input
          name: min
          route: [[280,392],[424,392]]
        - from: sales.0
          to: regions.0
