dataflow-snapshots:

  - name: CopyLoadFlowsIntoRead
    scripts:
      - name: setup
        input: |
          create table t (a int);
      - name: load
        input: |
          copy t from '/tmp/t.csv';
      - name: read
        input: |
          select * from t;
    expected:
      scripts:
        - name: setup
          statements:
            - type: CREATE_TABLE
              target: t
              text: "create tab.. t (a int)"
          box: [0,0,280,80]
        - name: load
          statements:
            - type: COPY
              target: t
              text: "copy t fro..tmp/t.csv'"
          box: [424,0,280,80]
        - name: read
          statements:
            - type: SELECT
              text: "select * from t"
          box: [848,0,280,80]
      edges:
        - from: setup.0
          to: load.0
          kind: table
          name: t
          route: [[280,56],[424,56]]
        - from: load.0
          to: read.0
          kind: table
          name: t
          route: [[704,56],[848,56]]
