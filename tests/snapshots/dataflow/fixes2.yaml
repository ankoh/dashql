dataflow-snapshots:

  - name: CopyLoadFlowsIntoRead
    scripts:
      - name: setup
        input: |
          create table t (a int);
      - name: load
        input: |
          copy t from '/tmp/t.csv';
      - name: read
        input: |
          select * from t;
    expected:
      scripts:
        - name: setup
          statements:
            - type: CREATE_TABLE
              target: t
              text: "create tab.. t (a int)"
          box: [0,0,280,80]
        - name: load
          statements:
            - type: COPY
              target: t
              text: "copy t fro..tmp/t.csv'"
          box: [424,0,280,80]
        - name: read
          statements:
            - type: SELECT
              text: "select * from t"
          box: [848,0,280,80]
      edges:
        - from: setup.0
          to: load.0
          kind: table
          name: t
          route: [[280,56],[424,56]]
        - from: load.0
          to: read.0
          kind: table
          name: t
          route: [[704,56],[848,56]]

  - name: LayoutChainAfterPositionedBox
    scripts:
      - name: a
        input: |
          /** @flow x=200 y=100 */
          create table a (x int);
      - name: b
        input: |
          create table b as select x from a;
      - name: c
        input: |
          select x from b;
    expected:
      scripts:
        - name: a
          statements:
            - type: CREATE_TABLE
              target: a
              text: "create tab.. a (x int)"
          box: [200,100,280,80]
        - name: b
          statements:
            - type: CREATE_TABLE_AS
              target: b
              text: "create tab..t x from a"
          box: [624,100,280,80]
        - name: c
          statements:
            - type: SELECT
              text: "select x from b"
          box: [1048,100,280,80]
      edges:
        - from: a.0
          to: b.0
          kind: table
          name: a
          route: [[480,156],[624,156]]
        - from: b.0
          to: c.0
          kind: table
          name: b
          route: [[904,156],[1048,156]]

  - name: LayoutChainBeforePositionedBox
    scripts:
      - name: a
        input: |
          create table a (x int);
      - name: b
        input: |
          create table b as select x from a;
      - name: c
        input: |
          /** @flow x=800 y=100 */
          select x from b;
    expected:
      scripts:
        - name: a
          statements:
            - type: CREATE_TABLE
              target: a
              text: "create tab.. a (x int)"
          box: [-48,100,280,80]
        - name: b
          statements:
            - type: CREATE_TABLE_AS
              target: b
              text: "create tab..t x from a"
          box: [376,100,280,80]
        - name: c
          statements:
            - type: SELECT
              text: "select x from b"
          box: [800,100,280,80]
      edges:
        - from: a.0
          to: b.0
          kind: table
          name: a
          route: [[232,156],[376,156]]
        - from: b.0
          to: c.0
          kind: table
          name: b
          route: [[656,156],[800,156]]
