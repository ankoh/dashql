dataflow-snapshots:
  # Statements read a relation from the statement that wrote it last, a write continues the flow
  - name: LastWriter
    scripts:
      - name: schema
        input: |
          create table t (a int);
          insert into t values (1);
          select a from t;
      - name: more
        input: |
          insert into t select a + 1 from t;
      - name: read
        input: |
          select count(*) from t;

  # A table created after the read in session order is read before it is written
  - name: ReadBeforeTheWriter
    scripts:
      - name: read
        input: |
          select a from t;
      - name: schema
        input: |
          create table t (a int);

  # A drop reads no data, a new table of the same name starts a new flow
  - name: DropAndRecreate
    scripts:
      - name: schema
        input: |
          create table t (a int);
          insert into t values (1);
      - name: drop
        input: |
          drop table t;
          create table t (b int);
      - name: read
        input: |
          select b from t;

  # A table created from a query reads the relations of the query
  - name: CreateTableAs
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: load
        input: |
          create table big as select * from orders where amount > 10;
      - name: report
        input: |
          select count(*) from big;

  # Relations of the catalog have no writer in the session
  - name: CatalogRelations
    catalog: |
      create table orders (id int);
    scripts:
      - name: a
        input: |
          select * from orders;

  # Relations of different connections are different
  - name: RelationsPerConnection
    connections:
      - name: trino
        kind: REMOTE
      - name: local
        kind: LOCAL
    scripts:
      - name: remote
        connection: trino
        input: |
          create table t (a int);
          select a from t;
      - name: local
        connection: local
        input: |
          select a from t;

  # A script whose analysis is behind its text is left out, the others are still planned
  - name: StaleAnalysis
    scripts:
      - name: schema
        input: |
          create table t (a int);
      - name: read
        input: |
          select a from t;
        stale-prepend: "select 1;\n"
      - name: other
        input: |
          select a from t;

  # A drop neither produces nor reads data, a read after it reads nothing of the dropped table
  - name: ReadAfterDrop
    scripts:
      - name: schema
        input: |
          create table t (a int);
          insert into t values (1);
          drop table t;
          select * from t;

  # A writer whose analysis is behind its text is left out, the reader reads from the writer before it
  - name: StaleWriter
    scripts:
      - name: schema
        input: |
          create table t (a int);
          insert into t values (1);
      - name: more
        input: |
          insert into t values (2);
        stale-prepend: "select 1;\n"
      - name: read
        input: |
          select count(*) from t;

  # A delete writes the table, the read after it reads from the delete
  - name: DeleteWrites
    scripts:
      - name: schema
        input: |
          create table t (a int);
          insert into t values (1), (2);
      - name: prune
        input: |
          delete from t where a > 2;
      - name: read
        input: |
          select count(*) from t;

  # A write after a read orders the read before it but is no dataflow, the read has no outgoing edge
  - name: WriteAfterRead
    scripts:
      - name: schema
        input: |
          create table t (a int);
      - name: read
        input: |
          select a from t;
      - name: write
        input: |
          insert into t values (1);
      - name: read_again
        input: |
          select a from t;

  # An insert that reads one table and writes another continues two flows
  - name: InsertFromAnotherTable
    scripts:
      - name: schema
        input: |
          create table src (a int);
          create table dst (a int);
      - name: copy
        input: |
          insert into dst select a from src;
      - name: read
        input: |
          select * from dst;

  # Tables created in one script and joined by another: a diamond of table edges
  - name: TableDiamond
    scripts:
      - name: base
        input: |
          create table base (id int, amount int);
      - name: small
        input: |
          create table small as select * from base where amount < 10;
      - name: large
        input: |
          create table large as select * from base where amount >= 10;
      - name: report
        input: |
          select count(*) from small s, large l where s.id = l.id;

  # A script without relations reads and writes nothing, it has no edges
  - name: NoRelations
    scripts:
      - name: schema
        input: |
          create table t (a int);
      - name: constant
        input: |
          select 1 + 1;
          select now();

  # A drop of a catalog table has no writer in the session, it has no edges
  - name: DropCatalogTable
    catalog: |
      create table orders (id int);
    scripts:
      - name: read
        input: |
          select * from orders;
      - name: drop
        input: |
          drop table orders;

  # A table created and dropped in one script, the statements between them read it
  - name: CreateUseDrop
    scripts:
      - name: work
        input: |
          create temp table tmp (a int);
          insert into tmp values (1);
          select a from tmp;
          drop table tmp;
      - name: later
        input: |
          select a from tmp;

  # A view reads the relations of its query when it is created, a read of the view reads from its create
  - name: ViewOfATable
    scripts:
      - name: schema
        input: |
          create table t (a int);
      - name: view
        input: |
          create view v as select a from t;
      - name: read
        input: |
          select * from v;

  # SELECT INTO creates the table it writes
  - name: SelectInto
    scripts:
      - name: schema
        input: |
          create table t (a int);
      - name: copy
        input: |
          select a into t2 from t;
      - name: read
        input: |
          select a from t2;

  # A relation that resolves nowhere is a relation of its own name, its writes and reads still flow
  - name: UnresolvedRelation
    scripts:
      - name: write
        input: |
          insert into nowhere values (1);
      - name: read
        input: |
          select * from nowhere;

  # Writes into a table from several scripts form a chain, every reader reads from the writer before it
  - name: ManyWritersOneTable
    scripts:
      - name: schema
        input: |
          create table log (msg text);
      - name: first
        input: |
          insert into log values ('a');
      - name: second
        input: |
          insert into log values ('b');
      - name: between
        input: |
          select count(*) from log;
      - name: third
        input: |
          insert into log values ('c');
      - name: last
        input: |
          select * from log;

  # The statements of a transaction keep their table edges
  - name: Transaction
    scripts:
      - name: schema
        input: |
          create table t (a int);
      - name: load
        input: |
          begin;
          insert into t values (1);
          insert into t values (2);
          commit;
      - name: read
        input: |
          select count(*) from t;

  # A delete with RETURNING writes the table and produces output, the read after it reads from the delete
  - name: DeleteReturning
    scripts:
      - name: schema
        input: |
          create table t (a int);
          insert into t values (1);
      - name: pop
        input: |
          delete from t where a = 1 returning a;
      - name: read
        input: |
          select * from t;

  # An update writes the table, the delete after it writes after the update, the read reads from the delete
  - name: InsertUpdateDeleteSelect
    scripts:
      - name: load
        input: |
          create table t (a int, b int);
          insert into t values (1, 1), (2, 2);
      - name: bump
        input: |
          update t set b = b + 1 where a > 1;
      - name: prune
        input: |
          delete from t where b > 2;
      - name: read
        input: |
          select count(*) from t;

  # A merge writes its target and reads its source
  - name: MergeWritesTarget
    scripts:
      - name: schema
        input: |
          create table t (a int, b int);
          create table u (a int, c int);
          insert into u values (1, 1);
      - name: sync
        input: |
          merge into t using u on t.a = u.a
          when matched then update set b = u.c
          when not matched then insert (a, b) values (u.a, u.c);
      - name: read
        input: |
          select count(*) from t;

  # An UPDATE reads the table of its FROM and continues the flow of its target
  - name: UpdateFromAnotherTable
    scripts:
      - name: schema
        input: |
          create table t (a int, b int);
          create table u (a int, c int);
      - name: bump
        input: |
          update t set b = u.c from u where t.a = u.a returning t.a;
      - name: read
        input: |
          select * from t;

  # A statement that writes a relation and reads it through an inlined query keeps its own edge of the relation
  - name: InlinedReadAndOwnWrite
    scripts:
      - name: schema
        input: |
          create table t (a int);
      - name: foo
        input: |
          select a from t;
      - name: bar
        input: |
          insert into t select a + 1 from :foo;
      - name: read
        input: |
          select * from t;

  # EXPLAIN reads the relations of its body, an execution-enabled EXPLAIN of an INSERT writes the table
  - name: ExplainOfTable
    scripts:
      - name: schema
        input: |
          create table t (a int);
      - name: plans
        input: |
          explain select * from t;
          explain (analyze) insert into t values (1);
      - name: read
        input: |
          select * from t;
