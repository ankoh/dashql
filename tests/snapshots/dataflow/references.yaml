dataflow-snapshots:

  - name: InlineReferences
    scripts:
      - name: a
        input: |
          select 1 as x;
      - name: b
        input: |
          select x from :a;
      - name: c
        input: |
          select * from :b, :a;
    expected:
      scripts:
        - name: a
          statements:
            - type: SELECT
              text: "select 1 as x"
          box: [0,48,280,80]
        - name: b
          statements:
            - type: SELECT
              text: "select x from :a"
          box: [424,0,280,80]
        - name: c
          statements:
            - type: SELECT
              text: "select * f..rom :b, :a"
          box: [848,48,280,80]
      edges:
        - from: a.0
          to: b.0
          kind: inline
          name: a
          route: [[280,104],[352,104],[352,56],[424,56]]
        - from: a.0
          to: c.0
          kind: inline
          name: a
          route: [[280,104],[848,104]]
        - from: b.0
          to: c.0
          kind: inline
          name: b
          route: [[704,56],[776,56],[776,104],[848,104]]

  - name: ManualReference
    scripts:
      - name: a
        input: |
          /* @manual */
          select 1 as x;
      - name: b
        input: |
          select x from :a where x > 0;
    expected:
      scripts:
        - name: a
          statements:
            - type: SELECT
              text: "select 1 as x"
          manual: true
          box: [0,0,280,80]
        - name: b
          statements:
            - type: SELECT
              text: "select x f..here x > 0"
          box: [424,0,280,80]
      edges:
        - from: a.0
          to: b.0
          kind: inline
          name: a
          route: [[280,56],[424,56]]

  - name: InvalidReferenceToScriptWithCommands
    scripts:
      - name: a
        input: |
          create table t (y int);
          select 1 as x;
      - name: b
        input: |
          select x from :a;
    expected:
      scripts:
        - name: a
          statements:
            - type: CREATE_TABLE
              target: t
              text: "create tab.. t (y int)"
            - type: SELECT
              text: "select 1 as x"
          box: [0,0,280,112]
        - name: b
          statements:
            - type: SELECT
              text: "select x from :a"
          box: [424,32,280,80]
      edges:
        - from: a.1
          to: b.0
          kind: invalid
          name: a
          route: [[280,88],[424,88]]

  - name: ScanReference
    connections:
      - name: trino
        kind: REMOTE
        catalog: |
          create table orders (id int, amount int);
      - name: local
        kind: LOCAL
    scripts:
      - name: remote
        connection: trino
        input: |
          select id, amount from orders;
      - name: report
        connection: local
        input: |
          select sum(amount) from :remote;
    expected:
      scripts:
        - name: remote
          statements:
            - type: SELECT
              text: "select id,..rom orders"
          box: [0,0,280,80]
        - name: report
          statements:
            - type: SELECT
              text: "select sum..om :remote"
          box: [424,0,280,80]
      edges:
        - from: remote.0
          to: report.0
          kind: scan
          name: remote
          route: [[280,56],[424,56]]

  - name: InvalidReferenceAcrossConnections
