          statements:
            - type: SELECT
              text: "select a from t"
          box: [424,0,280,80]
        - name: mid
          statements:
            - type: SELECT
              text: "select a +..from :base"
          box: [848,0,280,80]
        - name: top
          statements:
            - type: SELECT
              text: "select * from :mid"
          box: [1272,0,280,80]
      edges:
