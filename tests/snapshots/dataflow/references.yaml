  - name: InlineReferenceChain
    scripts:
      - name: a
        input: |
          select 1 as x;
      - name: b
        input: |
          select x + 1 as x from :a;
      - name: c
        input: |
          select x + 1 as x from :b;
      - name: d
        input: |
          select x + 1 as x from :c;
    expected:
      scripts:
        - name: a
          statements:
            - type: SELECT
              text: "select 1 as x"
          box: [0,0,280,80]
        - name: b
          statements:
            - type: SELECT
              text: "select x +.. x from :a"
          box: [424,0,280,80]
        - name: c
          statements:
            - type: SELECT
              text: "select x +.. x from :b"
          box: [848,0,280,80]
        - name: d
          statements:
            - type: SELECT
              text: "select x +.. x from :c"
          box: [1272,0,280,80]
      edges:
        - from: a.0
          to: b.0
          kind: inline
          name: a
          route: [[280,56],[424,56]]
        - from: b.0
          to: c.0
          kind: inline
          name: b
          route: [[704,56],[848,56]]
        - from: c.0
          to: d.0
          kind: inline
