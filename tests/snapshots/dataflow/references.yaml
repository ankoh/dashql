    scripts:
      - name: big
        connection: trino
        input: |
          select id, amount from orders where amount > 10;
      - name: remote_count
        connection: trino
        input: |
          select count(*) from :big;
      - name: local_sum
        connection: local
        input: |
          select sum(amount) from :big;
    expected:
      scripts:
        - name: big
          statements:
            - type: SELECT
              text: "select id,..mount > 10"
          box: [0,0,280,80]
        - name: remote_count
          statements:
            - type: SELECT
              text: "select cou.. from :big"
          box: [424,0,280,80]
        - name: local_sum
          statements:
            - type: SELECT
              text: "select sum.. from :big"
          box: [424,128,280,80]
      edges:
        - from: big.0
          to: remote_count.0
