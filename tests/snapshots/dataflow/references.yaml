  - name: ReferenceCycleOfThree
    scripts:
      - name: a
        input: |
          select * from :c;
      - name: b
        input: |
          select * from :a;
      - name: c
        input: |
          select * from :b;
      - name: outside
        input: |
          select * from :a;
    expected:
      scripts:
        - name: a
          statements:
            - type: SELECT
              text: "select * from :c"
          box: [24,128,280,80]
        - name: b
          statements:
            - type: SELECT
              text: "select * from :a"
          box: [448,0,280,80]
        - name: c
          statements:
            - type: SELECT
              text: "select * from :b"
          box: [872,128,280,80]
        - name: outside
          statements:
            - type: SELECT
              text: "select * from :a"
          box: [448,128,280,80]
      edges:
        - from: a.0
          to: b.0
          kind: invalid
          name: a
          route: [[304,184],[376,184],[376,56],[448,56]]
        - from: a.0
          to: outside.0
          kind: inline
          name: a
          route: [[304,184],[448,184]]
        - from: b.0
          to: c.0
          kind: inline
          name: b
          route: [[728,56],[800,56],[800,184],[872,184]]
        - from: c.0
          to: a.0
          kind: inline
          name: c
          route: [[1152,184],[1176,184],[1176,232],[0,232],[0,184],[24,184]]

  - name: SameReferenceTwice
