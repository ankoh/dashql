  - name: ScanChainAcrossConnections
    connections:
      - name: trino
        kind: REMOTE
      - name: local
        kind: LOCAL
    scripts:
      - name: setup
        connection: trino
        input: |
          create table t (a int);
      - name: foo
        connection: trino
        input: |
          select a from t;
      - name: bar
        connection: local
        input: |
          select * from :foo;
      - name: baz
        connection: local
        input: |
          create table u as select * from :bar;
          select * from u;
    expected:
      scripts:
        - name: setup
          statements:
            - type: CREATE_TABLE
              target: t
              text: "create tab.. t (a int)"
          box: [0,0,280,80]
        - name: foo
          statements:
            - type: SELECT
              text: "select a from t"
          box: [424,0,280,80]
        - name: bar
          statements:
            - type: SELECT
              text: "select * from :foo"
          box: [848,0,280,80]
        - name: baz
          statements:
            - type: CREATE_TABLE_AS
              target: u
              text: "create tab.. from :bar"
            - type: SELECT
              text: "select * from u"
          box: [1272,0,280,112]
      edges:
        - from: setup.0
          to: foo.0
          kind: table
