      - name: trino
        kind: REMOTE
      - name: local
        kind: LOCAL
    scripts:
      - name: a
        connection: local
        input: |
          select 1 as x;
      - name: b
        connection: trino
        input: |
          select * from :a;
    expected:
      scripts:
        - name: a
          statements:
            - type: SELECT
              text: "select 1 as x"
          box: [0,0,280,80]
        - name: b
          statements:
            - type: SELECT
              text: "select * from :a"
          box: [424,0,280,80]
      edges:
        - from: a.0
          to: b.0
          kind: invalid
          name: a
          route: [[280,56],[424,56]]

  - name: InlinedReadsFlowThroughTheScript
    scripts:
      - name: schema
        input: |
          create table t (a int);
      - name: filtered
        input: |
          select a from t where a > 1;
      - name: report
        input: |
          select count(*) from :filtered;
    expected:
      scripts:
        - name: schema
          statements:
            - type: CREATE_TABLE
              target: t
              text: "create tab.. t (a int)"
          box: [0,0,280,80]
        - name: filtered
          statements:
            - type: SELECT
              text: "select a f..here a > 1"
          box: [424,0,280,80]
        - name: report
          statements:
            - type: SELECT
              text: "select cou.. :filtered"
          box: [848,0,280,80]
      edges:
        - from: schema.0
          to: filtered.0
          kind: table
          name: t
          route: [[280,56],[424,56]]
        - from: filtered.0
          to: report.0
          kind: inline
          name: filtered
          route: [[704,56],[848,56]]

  - name: ReferenceCycle
    scripts:
      - name: a
        input: |
          select * from :b;
      - name: b
        input: |
          select * from :a;
    expected:
      scripts:
        - name: a
          statements:
            - type: SELECT
              text: "select * from :b"
          box: [448,0,280,80]
        - name: b
          statements:
            - type: SELECT
              text: "select * from :a"
          box: [24,0,280,80]
      edges:
        - from: a.0
          to: b.0
          kind: invalid
          name: a
          route: [[728,56],[752,56],[752,104],[0,104],[0,56],[24,56]]
        - from: b.0
          to: a.0
          kind: inline
          name: b
          route: [[304,56],[448,56]]

  - name: ReferenceToStaleScript
    scripts:
      - name: report
        input: |
          select 1 as x;
        stale-prepend: "select 2 as y;\n"
      - name: chart
        input: |
          select * from :report;
    expected:
      scripts:
        - name: report
          analyzed: false
          box: [0,0,280,32]
        - name: chart
          statements:
            - type: SELECT
              text: "select * f..om :report"
          box: [328,0,280,80]
      edges: []

  - name: InlinedAndDirectRead
    scripts:
      - name: schema
        input: |
          create table t (a int);
      - name: filtered
        input: |
          select a from t where a > 1;
      - name: report
        input: |
          select * from t, :filtered f where t.a = f.a;
    expected:
      scripts:
        - name: schema
          statements:
            - type: CREATE_TABLE
              target: t
              text: "create tab.. t (a int)"
          box: [0,48,280,80]
        - name: filtered
          statements:
            - type: SELECT
              text: "select a f..here a > 1"
          box: [424,0,280,80]
        - name: report
          statements:
            - type: SELECT
              text: "select * f.. t.a = f.a"
          box: [848,48,280,80]
      edges:
        - from: schema.0
          to: filtered.0
          kind: table
          name: t
          route: [[280,104],[352,104],[352,56],[424,56]]
        - from: schema.0
          to: report.0
          kind: table
          name: t
          route: [[280,104],[848,104]]
        - from: filtered.0
          to: report.0
          kind: inline
          name: filtered
          route: [[704,56],[776,56],[776,104],[848,104]]

  - name: ReferenceDiamond
    scripts:
      - name: base
        input: |
          select 1 as x;
      - name: left
        input: |
          select x from :base where x > 0;
      - name: right
        input: |
          select x from :base where x < 10;
      - name: joined
        input: |
          select * from :left l, :right r where l.x = r.x;
    expected:
      scripts:
        - name: base
          statements:
            - type: SELECT
              text: "select 1 as x"
          box: [0,0,280,80]
        - name: left
          statements:
            - type: SELECT
              text: "select x f..here x > 0"
          box: [424,0,280,80]
        - name: right
          statements:
            - type: SELECT
              text: "select x f..ere x < 10"
          box: [424,128,280,80]
        - name: joined
          statements:
            - type: SELECT
              text: "select * f.. l.x = r.x"
          box: [848,0,280,80]
      edges:
        - from: base.0
          to: left.0
          kind: inline
          name: base
          route: [[280,56],[424,56]]
        - from: base.0
          to: right.0
          kind: inline
          name: base
          route: [[280,56],[352,56],[352,184],[424,184]]
        - from: left.0
          to: joined.0
          kind: inline
          name: left
          route: [[704,56],[848,56]]
        - from: right.0
          to: joined.0
          kind: inline
          name: right
          route: [[704,184],[776,184],[776,56],[848,56]]

  - name: ReferenceToUnknownScript
    scripts:
      - name: a
        input: |
          select 1 as x;
      - name: b
        input: |
          select * from :missing;
          select * from :a;
    expected:
      scripts:
        - name: a
          statements:
            - type: SELECT
              text: "select 1 as x"
          box: [0,32,280,80]
        - name: b
          statements:
            - type: SELECT
              text: "select * f..m :missing"
            - type: SELECT
              text: "select * from :a"
          box: [424,0,280,112]
      edges:
        - from: a.0
          to: b.1
          kind: inline
          name: a
          route: [[280,88],[424,88]]

  - name: SelfReference
