dataflow-snapshots:
  # An attachment flows into the statements that scan it, also through an inlined query
  - name: AttachmentsFlowIntoStatements
    connections:
      - name: local
        kind: LOCAL
    attachments:
      - file: sales.parquet
        stamp: 1
      - file: unused.parquet
        stamp: 1
    scripts:
      - name: foo
        connection: local
        input: |
          select region, amount from :sales where amount > 5;
      - name: bar
        connection: local
        input: |
          select count(*) from :foo;
          select * from :sales s, :foo f where s.region = f.region;

  # A REMOTE statement that reads an attachment has no edge, the editor reports the error
  - name: RemoteReadsAttachment
    connections:
      - name: trino
        kind: REMOTE
    attachments:
      - file: sales.parquet
        stamp: 1
    scripts:
      - name: bar
        connection: trino
        input: |
          select * from :sales;

  # A script and an attachment of one name are ambiguous, the reference reads neither
  - name: AttachmentNameCollision
    connections:
      - name: local
        kind: LOCAL
    attachments:
      - file: sales.parquet
        stamp: 1
    scripts:
      - name: sales
        connection: local
        input: |
          select 1 as amount;
      - name: report
        connection: local
        input: |
          select * from :sales;

  # Attachments and inputs feed one statement, both are boxes left of it
  - name: AttachmentAndInput
    connections:
      - name: local
        kind: LOCAL
    attachments:
      - file: sales.parquet
        stamp: 1
      - file: regions.parquet
        stamp: 1
    scripts:
      - name: report
        connection: local
        input: |
          /* @param :min = 10 */
          select * from :sales s, :regions r where s.region = r.region and s.amount > :min::int;
