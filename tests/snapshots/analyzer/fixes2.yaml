analyzer-snapshots:

  - name: statement_ids_of_constants_in_earlier_statements
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: |-
        select * from t where a = 1 and abs(b) > 2;
        select * from u where c = 3 and abs(a) > 4
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", statement-id: 0, text: "t"}
        - {type: name/catalog, catalog-id: "256.65536.1:1", statement-id: 1, text: "u"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", statement-id: 0, text: "a"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:0.1", source: "t", statement-id: 0, text: "b"}
        - {id: 2, type: colref/catalog, catalog: "256.65536.1:1.1", source: "u", statement-id: 1, text: "c"}
        - {id: 3, type: colref/catalog, catalog: "256.65536.1:1.0", source: "u", statement-id: 1, text: "a"}
        - {id: 4, type: function, name: abs, statement-id: 0, text: "abs(b)"}
        - {id: 5, type: function, name: abs, statement-id: 1, text: "abs(a)"}
        - {id: 6, type: literal/integer, is-const: true, statement-id: 0, text: "1"}
        - {id: 7, type: literal/integer, is-const: true, statement-id: 0, text: "2"}
        - {id: 8, type: literal/integer, is-const: true, statement-id: 1, text: "3"}
        - {id: 9, type: literal/integer, is-const: true, statement-id: 1, text: "4"}
      constants:
        - {expression: 6, text: "1"}
        - {expression: 7, text: "2"}
        - {expression: 8, text: "3"}
        - {expression: 9, text: "4"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: t, text: "t"}
          columns:
            - {name: a, table-column: "256.65536.1:0.0"}
            - {name: b, table-column: "256.65536.1:0.1"}
          text: "select * f..abs(b) > 2"
        - scope-id: 1
          sources:
            - {type: table, name: u, text: "u"}
          columns:
            - {name: a, table-column: "256.65536.1:1.0"}
            - {name: c, table-column: "256.65536.1:1.1"}
          text: "select * f..abs(a) > 4"

  - name: update_from_returning_star_target_first
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: with x as (update t set b = 1 from u where u.a = t.a returning *) select * from x
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:1", text: "u"}
        - {type: name/catalog, catalog-id: "256.65536.1:0", role: write, text: "t"}
        - {type: name/cte, text: "x"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:1.0", source: "u", text: "u.a"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", text: "t.a"}
        - {id: 2, type: colref/catalog, catalog: "256.65536.1:0.1", source: "t", text: "b"}
        - {id: 3, type: literal/integer, is-const: true, text: "1"}
      constants:
        - {expression: 3, text: "1"}
      name-scopes:
        - scope-id: 0
          parent: 1
          parent-sources: none
          sources:
            - {type: table, name: u, text: "u"}
            - {type: table, name: t, text: "t"}
          clauses:
            - {sources: except, text: "u"}
          columns:
            - {name: a, table-column: "256.65536.1:0.0"}
            - {name: b, table-column: "256.65536.1:0.1"}
            - {name: a, table-column: "256.65536.1:1.0"}
            - {name: c, table-column: "256.65536.1:1.1"}
          text: "update t s..eturning *"
        - scope-id: 1
          sources:
            - {type: cte, name: x, scope: 0, text: "x"}
          columns:
            - {name: a, table-column: "256.65536.1:0.0"}
            - {name: b, table-column: "256.65536.1:0.1"}
            - {name: a, table-column: "256.65536.1:1.0"}
            - {name: c, table-column: "256.65536.1:1.1"}
          text: "with x as ..t * from x"

  - name: delete_using_returning_star_target_first
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: with x as (delete from v using w where v.id = w.id returning *) select * from x
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:3", text: "w"}
        - {type: name/catalog, catalog-id: "256.65536.1:2", role: write, text: "v"}
        - {type: name/cte, text: "x"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:2.0", source: "v", text: "v.id"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:3.0", source: "w", text: "w.id"}
      name-scopes:
        - scope-id: 0
          parent: 1
          parent-sources: none
          sources:
            - {type: table, name: w, text: "w"}
            - {type: table, name: v, text: "v"}
          clauses:
            - {sources: except, text: "w"}
          columns:
            - {name: id, table-column: "256.65536.1:2.0"}
            - {name: x, table-column: "256.65536.1:2.1"}
            - {name: id, table-column: "256.65536.1:3.0"}
            - {name: y, table-column: "256.65536.1:3.1"}
          text: "delete fro..eturning *"
        - scope-id: 1
          sources:
            - {type: cte, name: x, scope: 0, text: "x"}
          columns:
            - {name: id, table-column: "256.65536.1:2.0"}
            - {name: x, table-column: "256.65536.1:2.1"}
            - {name: id, table-column: "256.65536.1:3.0"}
            - {name: y, table-column: "256.65536.1:3.1"}
          text: "with x as ..t * from x"

  - name: qualified_type_name_of_cast
    script:
      input: select :p::pg_catalog.int4, :q::pg_catalog.text, :r::myschema.mytype
      catalog-id: 1
      errors: []
      parameters:
        - {kind: scalar, name: p, cast: "integer", text: ":p"}
        - {kind: scalar, name: q, cast: "text", text: ":q"}
        - {kind: scalar, name: r, cast: "myschema.mytype", text: ":r"}
      name-scopes:
        - scope-id: 0
          columns:
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
          text: "select :p:..ema.mytype"

  - name: qualified_type_name_of_column
    script:
      input: |-
        create table t (a pg_catalog.int4, b pg_catalog.varchar(10));
        alter table t add column c pg_catalog.bool;
        select * from t
      catalog-id: 1
      tables:
        - catalog-id: "256.65536.1:0"
          name: t
          text: "create tab..rchar(10))"
          columns:
            - {catalog-id: "256.65536.1:0.0", name: a, text: "a pg_catalog.int4"}
            - {catalog-id: "256.65536.1:0.1", name: b, text: "b pg_catal..archar(10)"}
        - catalog-id: "256.65536.1:1"
          name: t
          text: "alter tabl..talog.bool"
          columns:
            - {catalog-id: "256.65536.1:1.0", name: a, text: "a pg_catalog.int4"}
            - {catalog-id: "256.65536.1:1.1", name: b, text: "b pg_catal..archar(10)"}
            - {catalog-id: "256.65536.1:1.2", name: c, text: "c pg_catalog.bool"}
      touched-relations:
        - {statement-id: 0, name: t}
        - {statement-id: 1, name: t}
      errors: []
      table-refs:
        - {type: name/internal, catalog-id: "256.65536.1:1", statement-id: 2, text: "t"}
      expressions:
        - {id: 0, type: literal/integer, is-const: true, statement-id: 0, text: "10"}
      constants:
        - {expression: 0, text: "10"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: t, text: "t"}
          text: "create tab..rchar(10))"
        - scope-id: 1
          sources:
            - {type: table, name: t, text: "t"}
          columns:
            - {name: a, table-column: "256.65536.1:1.0"}
            - {name: b, table-column: "256.65536.1:1.1"}
            - {name: c, table-column: "256.65536.1:1.2"}
          text: "select * from t"

  - name: distinct_on_output_name
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: select distinct on (n) b as n from t order by n
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "t"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.1", text: "n"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:0.1", source: "t", text: "b"}
        - {id: 2, type: colref/catalog, catalog: "256.65536.1:0.1", text: "n"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: t, text: "t"}
          columns:
            - {name: n, expression: 1}
          text: "select dis..order by n"

  - name: grouping_sets_output_name
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: |-
        select b as n, count(*) from t group by rollup (n);
        select b as n, count(*) from t group by cube (n, a);
        select b as n, count(*) from t group by grouping sets ((n), ())
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", statement-id: 0, text: "t"}
        - {type: name/catalog, catalog-id: "256.65536.1:0", statement-id: 1, text: "t"}
        - {type: name/catalog, catalog-id: "256.65536.1:0", statement-id: 2, text: "t"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.1", source: "t", statement-id: 0, text: "b"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:0.1", statement-id: 0, text: "n"}
        - {id: 2, type: colref/catalog, catalog: "256.65536.1:0.1", source: "t", statement-id: 1, text: "b"}
        - {id: 3, type: colref/catalog, catalog: "256.65536.1:0.1", statement-id: 1, text: "n"}
        - {id: 4, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", statement-id: 1, text: "a"}
        - {id: 5, type: colref/catalog, catalog: "256.65536.1:0.1", source: "t", statement-id: 2, text: "b"}
        - {id: 6, type: colref/catalog, catalog: "256.65536.1:0.1", statement-id: 2, text: "n"}
        - {id: 7, type: function, name: count, statement-id: 0, text: "count(*)"}
        - {id: 8, type: function, name: count, statement-id: 1, text: "count(*)"}
        - {id: 9, type: function, name: count, statement-id: 2, text: "count(*)"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: t, text: "t"}
          columns:
            - {name: n, expression: 0}
            - {name: '?', expression: 7}
          text: "select b a..rollup (n)"
        - scope-id: 1
          sources:
            - {type: table, name: t, text: "t"}
          columns:
            - {name: n, expression: 2}
            - {name: '?', expression: 8}
          text: "select b a..ube (n, a)"
        - scope-id: 2
          sources:
            - {type: table, name: t, text: "t"}
          columns:
            - {name: n, expression: 5}
            - {name: '?', expression: 9}
          text: "select b a.. ((n), ())"
