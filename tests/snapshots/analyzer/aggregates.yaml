      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "events"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.2", source: "events", text: "g"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:0.1", source: "events", text: "waiting_jobs"}
        - {id: 2, type: colref/catalog, catalog: "256.65536.1:0.2", source: "events", text: "g"}
        - {id: 3, type: function, name: sum, text: "sum(waiting_jobs)"}
        - {id: 4, type: function, name: max, text: "max(sum(wa..ing_jobs))"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: events, text: "events"}
          columns:
            - {name: g, expression: 0}
            - {name: '?', expression: 4}
          text: "select g, ..group by g"

