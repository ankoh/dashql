  - name: nested_aggregate_filter_and_within_group
    catalog:
      script:
        input: create table events (event text, waiting_jobs int, g int);
        errors: []
    script:
      input: |
        select count(*) filter (where max(g) > 0) from events;
        select percentile_cont(0.5) within group (order by sum(g)) from events;
      catalog-id: 2
      errors:
        - {type: NESTED_AGGREGATE_CALL, message: 'aggregate function calls cannot be nested: max is inside of count', text: "max(g)"}
        - {type: NESTED_AGGREGATE_CALL, message: 'aggregate function calls cannot be nested: sum is inside of percentile_cont', text: "sum(g)"}
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", statement-id: 0, text: "events"}
        - {type: name/catalog, catalog-id: "256.65536.1:0", statement-id: 1, text: "events"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.2", source: "events", statement-id: 0, text: "g"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:0.2", source: "events", statement-id: 1, text: "g"}
        - {id: 2, type: function, name: max, statement-id: 0, text: "max(g)"}
        - {id: 3, type: function, name: count, statement-id: 0, text: "count(*) f..ax(g) > 0)"}
        - {id: 4, type: function, name: sum, statement-id: 1, text: "sum(g)"}
        - {id: 5, type: function, name: percentile_cont, statement-id: 1, text: "percentile..by sum(g))"}
        - {id: 6, type: literal/integer, is-const: true, statement-id: 0, text: "0"}
        - {id: 7, type: literal/float, is-const: true, statement-id: 1, text: "0.5"}
      constants:
        - {expression: 6, text: "0"}
        - {expression: 7, text: "0.5"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: events, text: "events"}
          columns:
            - {name: '?', expression: 3}
          text: "select cou..rom events"
        - scope-id: 1
          sources:
            - {type: table, name: events, text: "events"}
          columns:
            - {name: '?', expression: 5}
          text: "select per..rom events"

