analyzer-snapshots:

  - name: nested_aggregate_through_scalar
    catalog:
      script:
        input: create table events (event text, waiting_jobs int, g int);
        errors: []
    script:
      input: select string_agg(array_distinct(array_agg(e.event)), ',') from events e
      catalog-id: 2
      errors:
        - {type: NESTED_AGGREGATE_CALL, message: 'aggregate function calls cannot be nested: array_agg is inside of string_agg', text: "array_agg(e.event)"}
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "events e"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "events e", text: "e.event"}
        - {id: 1, type: function, name: array_agg, text: "array_agg(e.event)"}
        - {id: 2, type: function, name: array_distinct, text: "array_dist..(e.event))"}
        - {id: 3, type: function, name: string_agg, text: "string_agg..nt)), ',')"}
        - {id: 4, type: literal/string, is-const: true, text: "','"}
      constants:
        - {expression: 4, text: "','"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: e, text: "events e"}
          columns:
            - {name: '?', expression: 3}
          text: "select str..m events e"

  - name: nested_aggregate_direct
    catalog:
