analyzer-snapshots:

  # Unquoted names fold to lower case, quoted names keep their case
  - name: case_unquoted_names_fold
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table "Mixed" ("Col" int, low int);
    script:
      input: select T.A, B from T

  - name: case_quoted_names_keep_case
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table "Mixed" ("Col" int, low int);
    script:
      input: select "Col", col, "LOW", low from "Mixed"

  - name: case_unquoted_does_not_match_quoted_table
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table "Mixed" ("Col" int, low int);
    script:
      input: select low from Mixed

  - name: case_quoted_output_alias
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table "Mixed" ("Col" int, low int);
    script:
      input: select q."K", q.k from (select a as "K" from t) q

  - name: case_quoted_cte_name
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table "Mixed" ("Col" int, low int);
    script:
      input: with "C" as (select 1 as x) select x from "C", c

  - name: case_quoted_schema_name
    catalog:
      script:
        input: create table t (a int, b int); create table s1.k (a int, b int); create table s2.k (c int); create table db1.s3.n (e int);
    script:
      input: select c from "S2".k, S1.K

  # A CTE shadows a catalog table of the same name
  - name: cte_shadows_catalog_table
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with t as (select c as z from u) select z, a from t

  - name: cte_shadows_catalog_table_in_subquery
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with t as (select c as z from u) select * from u where a in (select z from t)

  # A WITH clause that defines a name twice is an error, the first definition stays. A nested WITH may define it again.
  - name: cte_duplicate_name
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with c as (select a from t), c as (select c from u) select * from c

  - name: cte_same_name_in_nested_with
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with c as (select a from t) select * from (with c as (select c from u) select * from c) s, c

  # A non-recursive CTE sees only the CTEs before it, a nested WITH shadows an outer one
  - name: cte_forward_reference
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with c1 as (select z from c2), c2 as (select 1 as z) select z from c1

  - name: cte_self_reference_without_recursive
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with r as (select 1 as n union all select n + 1 from r) select n from r

  - name: cte_nested_shadows_outer
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with k as (select a from t) select s.c, s.a from (with k as (select c from u) select * from k) s

  - name: cte_recursive_with_catalog_join
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with recursive r(n, m) as (select a, b from t union all select r.n, t.b from r join t on t.a = r.m) select n, m from r

  # Set operations: every branch has its own FROM items, the output names come from the first branch
  - name: set_op_branches_do_not_share_tables
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select x.a from t x union all select x.c from u

  - name: set_op_intersect_except
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select q.a from (select a from t intersect select c from u except select id from v) q

  - name: set_op_order_by_right_name
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select a from t union select c from u order by c

  # Self-joins need aliases to tell their sides apart
  - name: self_join_aliases
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select x.a, y.b from t x join t y on x.a = y.b where x.b > y.a

  - name: self_join_one_alias_ambiguous_column
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select t.a, x.a, b from t join t x on t.a = x.b

  # Joins: an ambiguous ON, a NATURAL join without common columns, USING with two columns, FULL and LATERAL joins
  - name: join_on_unqualified_ambiguous
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select b, c from t join u on a = c

  - name: join_natural_no_common_columns
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select p, q, r, s from (select * from t natural join v) z(p, q, r, s)

  - name: join_using_two_columns
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select p, q from (select * from t join t as t2 using (a, b)) z(p, q)

  - name: join_full_outer_using
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select a, b, c from t full outer join u using (a)

  - name: join_lateral_on_true
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select t.a, s.c from t left join lateral (select c from u where u.a = t.a) s on true

  # An aliased join names the join, outside of it the alias hides the names of the FROM items inside it
  - name: join_parenthesized_alias
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select j.a, j.b, j.c, a, t.b from (t join u using (a)) as j

  - name: join_parenthesized_alias_on_sees_inner_names
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select j.a, j.c from (t join u on t.a = u.a) as j

  # An ambiguous column of an aliased join names the columns inside the join, also of a nested one
  - name: join_parenthesized_alias_ambiguous_candidates
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select a from ((t join u on true) as k join v on true) as j

  - name: join_parenthesized_alias_column_aliases
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select x, j.y, z, b from (t join u using (a)) as j(x, y, z)

  - name: join_parenthesized_alias_star
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select p, q, r, s from (select j.*, v.id from (t join u using (a)) as j(p), v) z(p, q, r, s)

  # A function in FROM is a FROM item, its arguments see the FROM items before it, with or without LATERAL
  - name: function_in_from_lateral
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select a, g, g.g from t, lateral generate_series(1, t.b) as g

  - name: function_in_from_column_alias
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select x, g.x, g from generate_series(1, 3) as g(x)

  - name: function_in_from_implicitly_lateral
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select a, generate_series from t, generate_series(1, b), unnest(array[c]) n, u

  - name: function_in_from_definitions_and_ordinality
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select k, v, n, f.ordinality, p.q from json_each_text('{}') with ordinality as f(k, v, n), rows from (f(1), g(2) as (q int)) as p

  - name: join_parenthesized_alias_duplicate
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select x from (t join u using (a)) as v, v

  # The names inside an aliased join are not names of the scope, another FROM item can take them
  - name: join_parenthesized_alias_inner_name_reused
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select t.b, j.c from (t join u on t.a = u.a) as j, t

  - name: join_parenthesized_alias_inner_alias_reused
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select x.x from (t as x join u on true) as j, v as x

  - name: join_parenthesized_alias_inner_duplicate
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select t.a from (t join t on true) as j, t

  # Outside of an aliased join, a FROM item inside it has no name: an invalid reference to a FROM-clause entry
  - name: join_parenthesized_alias_invalid_reference
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select t.b, (select u.c) from (t join u using (a)) as j where j.a > 0

  # An aliased join inside another one is hidden by the outer alias, as are the FROM items inside it
  - name: join_parenthesized_alias_invalid_reference_nested
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select k.a, t.b, j.x from ((t join u on true) as k join v on true) as j

  - name: join_parenthesized_alias_invalid_reference_star
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select t.*, j.* from (t join u on true) j

  # A hidden FROM item of a table that the catalog doesn't know gets no inferred column
  - name: join_parenthesized_alias_invalid_reference_unresolved
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select m.k from (missing m join u on m.a = u.a) as j

  # Output aliases are visible in ORDER BY only, not in WHERE, HAVING or the select list
  - name: output_alias_in_where
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select a + 1 as k from t where k > 1

  - name: output_alias_in_having
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select a, count(*) as n from t group by a having n > 1

  - name: output_alias_in_select_list
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select a + 1 as k, k * 2 from t

  # Unresolved names in every clause
  - name: unresolved_in_every_clause
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: |-
        select f(n1), case when n2 then n3 else a end, sum(b) over (partition by n4 order by n5)
        from t join u on t.a = u.n6
        where n7 > 0
        group by n8
        having max(n9) > 0
        order by n10
        limit 1

  # A window clause and DISTINCT ON read the FROM items
  - name: named_window_and_distinct_on
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select distinct on (a) a, sum(b) over w from t window w as (partition by a order by b) order by a, b

  # Correlation: a correlated subquery in HAVING, a column of the inner scope wins over the outer one
  - name: correlated_in_having
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select a from t group by a having count(*) > (select count(*) from u where u.a = t.a)

  - name: correlated_inner_column_wins
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select (select a from u where c = b) from t

  # Schemas and databases: a schema qualification reads any database, unknown qualifiers stay unresolved
  - name: schema_qualified_any_database
    catalog:
      script:
        input: create table t (a int, b int); create table s1.k (a int, b int); create table s2.k (c int); create table db1.s3.n (e int);
    script:
      input: select e from s3.n

  - name: unqualified_name_of_other_database
    catalog:
      script:
        input: create table t (a int, b int); create table s1.k (a int, b int); create table s2.k (c int); create table db1.s3.n (e int);
    script:
      input: select e from n

  - name: unqualified_name_in_two_schemas
    catalog:
      script:
        input: create table t (a int, b int); create table s1.k (a int, b int); create table s2.k (c int); create table db1.s3.n (e int);
    script:
      input: select a, c from k

  - name: unknown_schema_and_database
    catalog:
      script:
        input: create table t (a int, b int); create table s1.k (a int, b int); create table s2.k (c int); create table db1.s3.n (e int);
    script:
      input: select * from s9.k, db9.s1.k, db1.s1.k

  # Declarations of the script: shadowing the catalog, SELECT INTO, views with column lists, DROP
  - name: script_table_shadows_catalog
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: create table t (z int); select z, a from t

  # A statement before the declaration of a name reads the table of the catalog, or none
  - name: script_table_declared_later
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select a from t; create table t (z int); select z, a from t

  - name: script_table_declared_later_unknown
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select k from n; create table n as select a as k from t; select k from n

  - name: select_into_read_later
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select a, b + 1 as n into tt from t; select a, n from tt

  - name: view_column_list_read_later
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: create view vw (p, q) as select a, b from t; select p, q, a from vw

  - name: create_table_as_schema_qualified_read_later
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: create table s9.m as select a from t; select a from s9.m; select a from m

  - name: drop_catalog_table_then_read
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: drop table t; select a from t

  # A data-modifying statement in WITH is a CTE with the columns of its RETURNING, it writes its target
  - name: cte_data_modifying_delete
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with d as (delete from t where a > 0 returning a, b) select a, b from d

  - name: cte_data_modifying_insert
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with i as (insert into t (a, b) select a, c from u returning *) select i.a, i.b from i

  - name: cte_data_modifying_update
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with x as (update t set b = 1 returning a) select a from x

  # A recursive CTE read twice, inside an expression subquery that it correlates with, and shadowing a catalog table
  - name: cte_recursive_used_twice
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with recursive r(n) as (select 1 union all select n + 1 from r where n < 3) select r1.n, r2.n from r r1 join r r2 on r1.n = r2.n

  - name: cte_recursive_in_expression_subquery
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select a from t where a in (with recursive r(n) as (select c from u union all select n - 1 from r where n > t.b) select n from r)

  - name: cte_recursive_shadows_catalog_table
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with recursive t(n) as (select 1 union all select n + 1 from t where n < 5) select n, a from t

  # WITH RECURSIVE lets a CTE read the CTEs after it
  - name: cte_recursive_forward_reference
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with recursive c1 as (select z from c2), c2 as (select 1 as z) select z from c1

  # A later CTE reads an earlier one from a scalar subquery, a nested WITH reads the CTEs of the outer one, every
  # branch of a set operation sees the CTEs of its WITH
  - name: cte_scalar_subquery_in_later_cte
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with c1 as (select a from t), c2 as (select (select max(a) from c1) as m) select m from c2

  - name: cte_nested_with_sees_outer_cte
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with c as (select a from t) select s.a from (with d as (select a from c) select a from d) s

  - name: cte_visible_in_set_operation_branches
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with c as (select a from t) select c from u union select a from c

  # Set operations: branches of different widths, parenthesized branches with ORDER BY and LIMIT, a VALUES branch, and
  # branches that correlate with the outer query
  - name: set_op_column_count_mismatch
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select q.a, q.b from (select a, b from t union select c from u) q

  - name: set_op_parenthesized_order_limit
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: |-
        (select a from t order by b limit 1) union all (select c from u order by a)

  - name: set_op_values_branch
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select q.a, q.b from (select a, b from t union all values (1, 2)) q

  - name: set_op_correlated_branches
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select * from t where exists (select a from u where u.a = t.b union select id from v where v.x = t.a)

  # Joins: USING with a column of neither side, NATURAL with an unresolved table, ON correlated with the outer query, an
  # unaliased parenthesized join keeps the names inside it
  - name: join_using_unknown_column
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select zz from t join u using (zz)

  - name: join_natural_unresolved_table
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select a, k from t natural join missing

  - name: join_on_correlated_outer
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select (select 1 from u join v on u.a = v.id and v.x = t.b) from t

  - name: join_unaliased_parenthesized_using
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select a, t.b, u.c, v.x from (t join u using (a)) join v on v.id = a

  # LATERAL: a VALUES list, and a lateral derived table inside another one that reads the outermost FROM item
  - name: lateral_values
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select t.a, s.k from t, lateral (values (t.a + 1)) s(k)

  - name: lateral_nested_two_levels
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select s.k from t, lateral (select z.k from u, lateral (select t.a + u.c as k) z) s

  # Stars: a qualifier that names no FROM item, an unresolved FROM item without columns, a schema-qualified star, a star
  # over a CTE with column aliases
  - name: star_unknown_qualifier
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select x.* from t

  - name: star_resolved_and_unresolved
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select q.a, q.zz from (select * from t, missing) q

  - name: star_schema_qualified
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int); create table s1.k (a int, b int); create table s2.k (c int); create table db1.s3.n (e int);
    script:
      input: select q.a, q.b from (select s1.k.* from s1.k) q

  - name: star_cte_column_aliases
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with c(p) as (select a, b from t) select q.p, q.b from (select * from c) q

  # Aliases: an alias that is the name of another table, quoted names with spaces and case
  - name: alias_names_other_table
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select t.c, x.b from u as t, t as x

  - name: quoted_identifiers_with_spaces
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int); create table "my table" ("my col" int, "My Col" int);
    script:
      input: select "my col", m."my col", "My Col" from "my table" m

  # Errors: an alias of a table and a function in FROM, the candidates of a column of three FROM items
  - name: duplicate_alias_table_and_function
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select * from t as g, generate_series(1, 3) as g

  - name: ambiguous_three_candidates
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select a from t, u, t as t2

  # Clauses: grouping sets, a window that refines a named window, a locking clause, TABLESAMPLE and FETCH FIRST, EXPLAIN
  - name: grouping_sets_rollup_cube
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select a, b, count(*), grouping(a) from t group by grouping sets ((a), (b)), rollup (a), cube (b)

  - name: window_frame_inherits_named_window
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select sum(b) over (w rows between 1 preceding and current row) from t window w as (partition by a order by zz)

  - name: locking_clause_of_table
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select b from t, u for update of t nowait

  - name: tablesample_and_fetch_first
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select a from t tablesample bernoulli (10) repeatable (5) fetch first 3 rows only

  - name: explain_select_resolves
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: explain select a from t where zz = 1

  # The same schema in two databases, a view of the catalog
  - name: same_schema_in_two_databases
    catalog:
      script:
        input: create table db1.s.x (a int); create table db2.s.x (b int); create table base (k int, l int); create view bv as select k from base;
    script:
      input: select a, b from s.x

  - name: catalog_view_read_by_script
    catalog:
      script:
        input: create table db1.s.x (a int); create table db2.s.x (b int); create table base (k int, l int); create view bv as select k from base;
    script:
      input: select k, l from bv

  # Declarations: EXPLAIN declares nothing, ALTER VIEW renames a view, a duplicate column, CREATE TABLE AS with a CTE
  - name: explain_create_table_not_declared
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: explain create table z as select a from t; select a from z

  - name: alter_view_rename
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: create view vw as select a from t; alter view vw rename to vw2; select a from vw2

  - name: create_table_duplicate_column
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: create table z (a int, a text); select a from z

  - name: create_table_as_with_cte
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: create table z as with c as (select a from t) select a from c; select a from z

  # The ON condition of a join sees only the inputs of the join, a later FROM item is an invalid reference
  - name: join_on_sees_only_its_inputs
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select 1 from t join u on u.a = v.id, v

  # An earlier FROM item is no input of the join either
  - name: join_on_sees_no_earlier_from_item
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select 1 from v, t join u on u.a = v.id

  # A subquery in the ON condition sees the inputs of the join only
  - name: join_on_subquery_sees_only_its_inputs
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select 1 from t join u on exists (select 1 where v.id = u.a), v

  # CHECK constraints read the columns of the table they create
  - name: create_table_check_constraint
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: create table z (a int primary key, b int check (b > 0), check (a > b))

  # A generated column reads the columns of the table it creates, a name the table doesn't have stays unresolved
  - name: create_table_generated_column
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: create table z (a int, b int generated always as (a * 2) stored, c int generated always as (x + 1) stored); select b from z

  # A name of a FROM item that no column has is the whole row of the item, also of a parent scope
  - name: whole_row_reference
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: select t, (select t from u limit 1), x from t

  # A renamed table of the script is gone under its old name for the statements after the ALTER
  - name: alter_view_rename_then_read_old_name
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: create view vw as select a from t; alter view vw rename to vw2; select a from vw

  # A dropped table of the script is gone for the statements after the DROP
  - name: drop_script_table_then_read
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: create table z (a int); select a from z; drop table z; select a from z
