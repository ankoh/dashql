analyzer-snapshots:

  # INSERT binds its explicit target columns against the target table
  - name: insert_target_columns_resolved
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: insert into t (b, a) select a, c from u

  - name: insert_target_column_unknown
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: insert into t (a, z) values (1, 2)

  - name: insert_target_columns_unresolved_table
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: insert into missing (p, q) select a, b from t

  # The source of an INSERT does not see the columns of its target
  - name: insert_source_does_not_see_target
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: insert into t select b from u

  - name: insert_default_values_returning
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: insert into t default values returning a, b

  - name: insert_with_cte_source
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with c as (select a, c from u) insert into t (a, b) select a, c from c

  # An INSERT into a table of the script reads the declaration before it
  - name: insert_into_script_table
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: create table z (k int, l text); insert into z (l, k) select c::text, a from u

  # ON CONFLICT: the conflict target and the SET targets bind to the target, DO UPDATE sees excluded
  - name: insert_on_conflict_do_update
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: insert into t (a, b) select a, c from u on conflict (a) where b > 0 do update set b = excluded.b + t.b where t.b < excluded.b returning a

  # An unqualified column of DO UPDATE is ambiguous between the target and excluded, as in PostgreSQL
  - name: insert_on_conflict_ambiguous_column
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: insert into t values (1, 2) on conflict (a) do update set b = b + 1

  # RETURNING, the index predicate and their subqueries don't see excluded, RETURNING * has the target columns
  - name: insert_on_conflict_excluded_visibility
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: insert into t values (1, 2) on conflict (a) where excluded.a > 0 do update set (a, b) = (select excluded.a, u.c from u) returning *, excluded.b, (select excluded.a)

  # Unknown columns of the conflict target and the SET targets, DO NOTHING
  - name: insert_on_conflict_unknown_columns
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: insert into t values (1, 2) on conflict (z) do nothing; insert into t values (1, 2) on conflict on constraint t_pkey do update set z = excluded.z

  # The columns of an unknown target are inferred, also through excluded
  - name: insert_on_conflict_unresolved_target
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: insert into missing values (1, 2) on conflict (p) do update set q = excluded.r

  # DELETE with USING, correlated subqueries, RETURNING and a CTE
  - name: delete_using
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: delete from t using u where t.a = u.a and c > 0

  - name: delete_correlated_exists
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: delete from t where exists (select 1 from u where u.a = t.a)

  - name: delete_alias_returning
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: delete from t as x where x.b > 1 returning x.a, b

  - name: delete_with_cte
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with old as (select a from u where c < 0) delete from t where a in (select a from old)

  # UPDATE writes its target, the SET targets bind to the target, the values, WHERE and RETURNING see the target and
  # the FROM items, subqueries correlate with both
  - name: update_set_where
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: update t set b = a + 1 where a > 0

  - name: update_alias
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: update t as x set b = x.a where x.b is null

  - name: update_from
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: update t set b = u.c from u where t.a = u.a

  # A SET target is a column of the target, also when a FROM item has a column of the same name
  - name: update_from_shared_column
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: update t set a = c from u where t.a = u.a

  - name: update_correlated_subquery
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: update t set b = (select max(c) from u where u.a = t.a)

  - name: update_returning
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: update t set b = 0 returning a, b

  - name: update_multiple_columns
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: update t set (a, b) = (select a, c from u where u.a = t.b)

  - name: update_unknown_column
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: update t set z = a

  # The SET targets and the columns of an unknown target are inferred for it
  - name: update_unresolved_target
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: update missing set p = q + 1 where r = 2

  - name: update_with_cte
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: with s as (select a, c from u) update t set b = s.c from s where t.a = s.a

  # MERGE writes its target and reads its source, the conditions and values see both, the SET targets and the INSERT
  # columns bind to the target
  - name: merge_update_insert
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: |-
        merge into t using u on t.a = u.a
        when matched then update set b = u.c
        when not matched then insert (a, b) values (u.a, u.c)

  - name: merge_aliases_delete
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: |-
        merge into t as tgt using (select a, c from u where c > 0) as src on tgt.a = src.a
        when matched and src.c > 10 then delete
        when matched then update set b = src.c

  - name: merge_unresolved_target_returning
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: |-
        merge into missing m using u on m.k = u.a
        when not matched then insert (k, l) values (u.a, u.c)
        returning m.k

  # WHEN NOT MATCHED [BY TARGET] sees the source only, WHEN NOT MATCHED BY SOURCE the target only, WHEN MATCHED both
  - name: merge_not_matched_clause_visibility
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: |-
        merge into t using u on t.a = u.a
        when matched and a > 0 then update set b = c
        when not matched and c > 0 then insert (a, b) values (a, c)
        when not matched by source and b > 0 and c > 0 then delete

  - name: merge_not_matched_clause_subqueries
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: |-
        merge into t using u on t.a = u.a
        when not matched and exists (select 1 from v where v.id = a) then insert (a) values (a)
        when not matched by source and exists (select 1 from w where w.id = a) then delete

  - name: merge_not_matched_clause_inference
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: |-
        merge into missing m using other o on m.k = o.k
        when not matched then insert (k, l) values (o.k, n)
        when not matched by source and z > 0 then delete

  # A qualifier that names the relation that a WHEN NOT MATCHED clause doesn't see is an invalid reference, its column
  # is not inferred
  - name: merge_not_matched_clause_invisible_qualifier
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: |-
        merge into t using u on t.a = u.a
        when not matched then insert (a) values (t.b)
        when not matched by source and u.c > 0 and exists (select 1 from v where v.id = u.a) then delete

  - name: merge_not_matched_clause_invisible_qualifier_inference
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: |-
        merge into missing m using other o on m.k = o.k
        when not matched then insert (k) values (m.extra)
        when not matched by source and o.z > 0 then delete

  # RETURNING doesn't see the excluded row of ON CONFLICT
  - name: insert_on_conflict_returning_excluded_inference
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
    script:
      input: insert into missing values (1, 2) on conflict (p) do update set q = excluded.r returning excluded.s
