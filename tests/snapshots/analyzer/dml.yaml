        - {id: 1, type: colref/catalog, catalog: "256.65536.1:1.0", source: "u", text: "u.a"}
        - {id: 2, type: colref/catalog, catalog: "256.65536.1:1.1", source: "u", text: "c"}
        - {id: 3, type: literal/integer, is-const: true, text: "0"}
      constants:
        - {expression: 3, text: "0"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: u, text: "u"}
            - {type: table, name: t, text: "t"}
          text: "delete fro.. and c > 0"

  - name: delete_correlated_exists
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: delete from t where exists (select 1 from u where u.a = t.a)
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:1", text: "u"}
        - {type: name/catalog, catalog-id: "256.65536.1:0", role: write, text: "t"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:1.0", source: "u", text: "u.a"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", text: "t.a"}
        - {id: 2, type: literal/integer, is-const: true, text: "1"}
      constants:
        - {expression: 2, text: "1"}
      name-scopes:
        - scope-id: 0
          parent: 1
          sources:
            - {type: table, name: u, text: "u"}
          columns:
            - {name: '?', expression: 2}
          text: "(select 1 ..u.a = t.a)"
        - scope-id: 1
          sources:
            - {type: table, name: t, text: "t"}
          text: "delete fro..u.a = t.a)"

  - name: delete_alias_returning
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
