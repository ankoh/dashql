        - {id: 2, type: colref/catalog, catalog: "256.65536.1:1.0", source: "old", text: "a"}
        - {id: 3, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", text: "a"}
        - {id: 4, type: literal/integer, is-const: true, text: "0"}
      constants:
        - {expression: 4, text: "0"}
      name-scopes:
        - scope-id: 0
          parent: 2
          parent-sources: none
          correlation-barrier: true
          sources:
            - {type: table, name: u, text: "u"}
          columns:
            - {name: a, expression: 0}
          text: "select a f..here c < 0"
        - scope-id: 1
          parent: 2
          sources:
            - {type: cte, name: old, scope: 0, text: "old"}
          columns:
            - {name: a, expression: 2}
          text: "(select a from old)"
        - scope-id: 2
          sources:
