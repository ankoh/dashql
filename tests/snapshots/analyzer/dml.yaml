analyzer-snapshots:

  - name: insert_target_columns_resolved
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: insert into t (b, a) select a, c from u
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:1", text: "u"}
        - {type: name/catalog, catalog-id: "256.65536.1:0", role: write, text: "t"}
      inserts:
        - target-ref: 1
          source: "select a, c from u"
          columns:
            - {name: b, resolved: true}
            - {name: a, resolved: true}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:1.0", source: "u", text: "a"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:1.1", source: "u", text: "c"}
      name-scopes:
        - scope-id: 0
          parent: 1
          correlation-barrier: true
          sources:
            - {type: table, name: u, text: "u"}
          columns:
            - {name: a, expression: 0}
            - {name: c, expression: 1}
          text: "select a, c from u"
        - scope-id: 1
          sources:
            - {type: table, name: t, text: "t"}
          text: "insert int.., c from u"

  - name: insert_target_column_unknown
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: insert into t (a, z) values (1, 2)
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", role: write, text: "t"}
      inserts:
        - target-ref: 0
          source: "values (1, 2)"
          columns:
            - {name: a, resolved: true}
            - {name: z, resolved: false}
      expressions:
        - {id: 0, type: literal/integer, is-const: true, text: "1"}
        - {id: 1, type: literal/integer, is-const: true, text: "2"}
      constants:
        - {expression: 0, text: "1"}
        - {expression: 1, text: "2"}
      name-scopes:
        - scope-id: 0
          parent: 1
          correlation-barrier: true
          columns:
            - {name: '?', expression: 0}
            - {name: '?', expression: 1}
          text: "values (1, 2)"
        - scope-id: 1
          sources:
            - {type: table, name: t, text: "t"}
          text: "insert int..ues (1, 2)"

  - name: insert_target_columns_unresolved_table
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: insert into missing (p, q) select a, b from t
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "t"}
        - {type: name/unresolved, role: write, text: "missing"}
      inserts:
        - target-ref: 1
          source: "select a, b from t"
          columns:
            - {name: p, resolved: false}
            - {name: q, resolved: false}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", text: "a"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:0.1", source: "t", text: "b"}
      name-scopes:
        - scope-id: 0
          parent: 1
          correlation-barrier: true
          sources:
            - {type: table, name: t, text: "t"}
          columns:
            - {name: a, expression: 0}
            - {name: b, expression: 1}
          text: "select a, b from t"
        - scope-id: 1
          sources:
            - {type: unresolved, name: missing, text: "missing"}
          text: "insert int.., b from t"

  - name: insert_source_does_not_see_target
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: insert into t select b from u
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:1", text: "u"}
        - {type: name/catalog, catalog-id: "256.65536.1:0", role: write, text: "t"}
      inserts:
        - target-ref: 1
          source: "select b from u"
      expressions:
        - {id: 0, type: colref/unresolved, text: "b"}
      name-scopes:
        - scope-id: 0
          parent: 1
          correlation-barrier: true
          sources:
            - {type: table, name: u, text: "u"}
          columns:
            - {name: b, expression: 0}
          text: "select b from u"
        - scope-id: 1
          sources:
            - {type: table, name: t, text: "t"}
          text: "insert int..t b from u"

  - name: insert_default_values_returning
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: insert into t default values returning a, b
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", role: write, text: "t"}
      inserts:
        - target-ref: 0
          default-values: true
          returning: true
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", text: "a"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:0.1", source: "t", text: "b"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: t, text: "t"}
          columns:
            - {name: a, expression: 0}
            - {name: b, expression: 1}
          text: "insert int..rning a, b"

  - name: insert_with_cte_source
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: with c as (select a, c from u) insert into t (a, b) select a, c from c
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:1", text: "u"}
        - {type: name/cte, text: "c"}
        - {type: name/catalog, catalog-id: "256.65536.1:0", role: write, text: "t"}
      inserts:
        - target-ref: 2
          source: "select a, c from c"
          columns:
            - {name: a, resolved: true}
            - {name: b, resolved: true}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:1.0", source: "u", text: "a"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:1.1", source: "u", text: "c"}
        - {id: 2, type: colref/catalog, catalog: "256.65536.1:1.0", source: "c", text: "a"}
        - {id: 3, type: colref/catalog, catalog: "256.65536.1:1.1", source: "c", text: "c"}
      name-scopes:
        - scope-id: 0
          parent: 2
          parent-sources: none
          correlation-barrier: true
          sources:
            - {type: table, name: u, text: "u"}
          columns:
            - {name: a, expression: 0}
            - {name: c, expression: 1}
          text: "select a, c from u"
        - scope-id: 1
          parent: 2
          correlation-barrier: true
          sources:
            - {type: cte, name: c, scope: 0, text: "c"}
          columns:
            - {name: a, expression: 2}
            - {name: c, expression: 3}
          text: "select a, c from c"
        - scope-id: 2
          sources:
            - {type: table, name: t, text: "t"}
          text: "with c as .., c from c"

  - name: insert_into_script_table
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: create table z (k int, l text); insert into z (l, k) select c::text, a from u
      catalog-id: 2
      tables:
        - catalog-id: "256.65536.2:0"
          name: z
          text: "create tab..t, l text)"
          columns:
            - {catalog-id: "256.65536.2:0.0", name: k, text: "k int"}
            - {catalog-id: "256.65536.2:0.1", name: l, text: "l text"}
      touched-relations:
        - {statement-id: 0, name: z}
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:1", statement-id: 1, text: "u"}
        - {type: name/internal, catalog-id: "256.65536.2:0", statement-id: 1, role: write, text: "z"}
      inserts:
        - statement-id: 1
          target-ref: 1
          source: "select c::.., a from u"
          columns:
            - {name: l, resolved: true}
            - {name: k, resolved: true}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:1.1", source: "u", statement-id: 1, text: "c"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:1.0", source: "u", statement-id: 1, text: "a"}
      name-scopes:
        - scope-id: 1
          parent: 2
          correlation-barrier: true
          sources:
            - {type: table, name: u, text: "u"}
          columns:
            - {name: '?', computed: true}
            - {name: a, expression: 1}
          text: "select c::.., a from u"
        - scope-id: 2
          sources:
            - {type: table, name: z, text: "z"}
          text: "insert int.., a from u"

  - name: delete_using
    catalog:
