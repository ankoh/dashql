          text: "delete fro..ing x.a, b"

  - name: delete_with_cte
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: with old as (select a from u where c < 0) delete from t where a in (select a from old)
