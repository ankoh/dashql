analyzer-snapshots:

  - name: insert_target_columns_resolved
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: insert into t (b, a) select a, c from u
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:1", text: "u"}
        - {type: name/catalog, catalog-id: "256.65536.1:0", role: write, text: "t"}
      inserts:
        - target-ref: 1
          source: "select a, c from u"
          columns:
            - {name: b, resolved: true}
            - {name: a, resolved: true}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:1.0", source: "u", text: "a"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:1.1", source: "u", text: "c"}
      name-scopes:
        - scope-id: 0
          parent: 1
          correlation-barrier: true
          sources:
            - {type: table, name: u, text: "u"}
          columns:
            - {name: a, expression: 0}
            - {name: c, expression: 1}
          text: "select a, c from u"
        - scope-id: 1
          sources:
            - {type: table, name: t, text: "t"}
          text: "insert int.., c from u"

  - name: insert_target_column_unknown
