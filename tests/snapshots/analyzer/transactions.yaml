analyzer-snapshots:

  - name: transaction_committed
    catalog:
      script:
        input: create table items (id int);
        errors: []
    script:
      input: |
        begin;
        insert into items values (1);
        commit;
      catalog-id: 2
      errors: []
      transactions:
        - {begin: 0, end: 2}
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", statement-id: 1, role: write, text: "items"}
      inserts:
        - statement-id: 1
          target-ref: 0
          source: "values (1)"
      expressions:
        - {id: 0, type: literal/integer, is-const: true, statement-id: 1, text: "1"}
      constants:
        - {expression: 0, text: "1"}
      name-scopes:
        - scope-id: 0
          parent: 1
          correlation-barrier: true
          columns:
            - {name: '?', expression: 0}
          text: "values (1)"
        - scope-id: 1
          sources:
            - {type: table, name: items, text: "items"}
          text: "insert int..values (1)"

  - name: transaction_aliases
    script:
      input: |
        begin work; end;
        start transaction read only; rollback;
        begin isolation level serializable; abort;
        begin; commit transaction;
        begin; prepare transaction 'batch';
      catalog-id: 1
      errors: []
      transactions:
        - {begin: 0, end: 1}
        - {begin: 2, end: 3}
        - {begin: 4, end: 5}
        - {begin: 6, end: 7}
        - {begin: 8, end: 9}
      expressions:
        - {id: 0, type: literal/string, is-const: true, statement-id: 9, text: "'batch'"}
      constants:
        - {expression: 0, text: "'batch'"}

  - name: transaction_prepared_standalone
    script:
      input: |
        commit prepared 'batch';
        rollback prepared 'other';
      catalog-id: 1
      errors: []
      expressions:
        - {id: 0, type: literal/string, is-const: true, statement-id: 0, text: "'batch'"}
        - {id: 1, type: literal/string, is-const: true, statement-id: 1, text: "'other'"}
      constants:
        - {expression: 0, text: "'batch'"}
        - {expression: 1, text: "'other'"}

  - name: transaction_not_ended
    script:
      input: |
        begin;
        select 1;
      catalog-id: 1
      errors:
        - {type: UNMATCHED_TRANSACTION_CONTROL, message: 'the transaction is not ended in this script, commit or roll it back', text: "begin"}
      transactions:
        - {begin: 0}
      expressions:
        - {id: 0, type: literal/integer, is-const: true, statement-id: 1, text: "1"}
      constants:
        - {expression: 0, text: "1"}
      name-scopes:
        - scope-id: 0
          columns:
            - {name: '?', expression: 0}
          text: "select 1"

  - name: transaction_not_begun
    script:
      input: |
        select 1;
        commit;
        rollback;
        prepare transaction 'batch';
      catalog-id: 1
      errors:
        - {type: UNMATCHED_TRANSACTION_CONTROL, message: 'no transaction to commit, begin it in this script', text: "commit"}
        - {type: UNMATCHED_TRANSACTION_CONTROL, message: 'no transaction to roll back, begin it in this script', text: "rollback"}
        - {type: UNMATCHED_TRANSACTION_CONTROL, message: 'no transaction to prepare, begin it in this script', text: "prepare tr..on 'batch'"}
      expressions:
        - {id: 0, type: literal/integer, is-const: true, statement-id: 0, text: "1"}
        - {id: 1, type: literal/string, is-const: true, statement-id: 3, text: "'batch'"}
      constants:
        - {expression: 0, text: "1"}
        - {expression: 1, text: "'batch'"}
      name-scopes:
        - scope-id: 0
          columns:
            - {name: '?', expression: 0}
          text: "select 1"

  - name: transaction_nested_begin
    script:
      input: |
        begin;
        start transaction;
        commit;
      catalog-id: 1
      errors:
        - {type: UNMATCHED_TRANSACTION_CONTROL, message: a transaction is already open in this script, text: "start transaction"}
      transactions:
        - {begin: 0, end: 2}

  - name: transaction_savepoints
    script:
      input: |
        begin;
        savepoint a;
        savepoint b;
        rollback to savepoint a;
        release b;
        savepoint "A";
        release a;
        release "A";
        commit;
      catalog-id: 1
      errors:
        - {type: UNMATCHED_TRANSACTION_CONTROL, message: no savepoint b in this transaction, text: "release b"}
        - {type: UNMATCHED_TRANSACTION_CONTROL, message: no savepoint A in this transaction, text: "release \"A\""}
      transactions:
        - {begin: 0, end: 8}

  - name: transaction_savepoints_unmatched
    script:
      input: |
        savepoint a;
        release a;
        begin;
        savepoint a;
        rollback to b;
        commit;
        rollback to a;
      catalog-id: 1
      errors:
        - {type: UNMATCHED_TRANSACTION_CONTROL, message: 'no transaction for the savepoint, begin it in this script', text: "savepoint a"}
        - {type: UNMATCHED_TRANSACTION_CONTROL, message: 'no transaction for the savepoint, begin it in this script', text: "release a"}
        - {type: UNMATCHED_TRANSACTION_CONTROL, message: no savepoint b in this transaction, text: "rollback to b"}
        - {type: UNMATCHED_TRANSACTION_CONTROL, message: 'no transaction for the savepoint, begin it in this script', text: "rollback to a"}
      transactions:
        - {begin: 2, end: 5}

  - name: transaction_two_blocks
    script:
      input: |
        begin;
        select 1;
        commit;
        select 2;
        begin;
        select 3;
      catalog-id: 1
      errors:
        - {type: UNMATCHED_TRANSACTION_CONTROL, message: 'the transaction is not ended in this script, commit or roll it back', text: "begin"}
      transactions:
        - {begin: 0, end: 2}
        - {begin: 4}
      expressions:
        - {id: 0, type: literal/integer, is-const: true, statement-id: 1, text: "1"}
        - {id: 1, type: literal/integer, is-const: true, statement-id: 3, text: "2"}
        - {id: 2, type: literal/integer, is-const: true, statement-id: 5, text: "3"}
      constants:
        - {expression: 0, text: "1"}
        - {expression: 1, text: "2"}
        - {expression: 2, text: "3"}
      name-scopes:
        - scope-id: 0
          columns:
            - {name: '?', expression: 0}
          text: "select 1"
        - scope-id: 1
          columns:
            - {name: '?', expression: 1}
          text: "select 2"
        - scope-id: 2
          columns:
            - {name: '?', expression: 2}
          text: "select 3"

  - name: transaction_syntax_error
    script:
      input: |
        begin read invalid;
        rollback;
      catalog-id: 1
      errors: []

  - name: transaction_set_modes
    script:
      input: |
        set transaction isolation level serializable;
        begin;
        set transaction read only;
        commit;
      catalog-id: 1
      errors: []
      transactions:
        - {begin: 1, end: 3}
