      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "db1.schema1.A", text: "a"}
        - {id: 1, type: colref/unresolved, text: "c"}
      name-scopes:
        - scope-id: 0
