analyzer-snapshots:

  - name: cross_1_entry_explicit
    catalog:
      script:
        input: |-
          create table db1.schema1.A (a int, b int);
          create table db2.schema2.A (c int, d int);
        errors: []
    script:
      input: select * from db1.schema1.A x, db2.schema2.A y where x.a = c;
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "db1.schema1.A x"}
        - {type: name/catalog, catalog-id: "257.65537.1:1", text: "db2.schema2.A y"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "db1.schema1.A x", text: "x.a"}
        - {id: 1, type: colref/catalog, catalog: "257.65537.1:1.0", source: "db2.schema2.A y", text: "c"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: x, text: "db1.schema1.A x"}
            - {type: table, name: y, text: "db2.schema2.A y"}
          columns:
            - {name: a, table-column: "256.65536.1:0.0"}
            - {name: b, table-column: "256.65536.1:0.1"}
            - {name: c, table-column: "257.65537.1:1.0"}
            - {name: d, table-column: "257.65537.1:1.1"}
          text: "select * f..re x.a = c"

  - name: cross_1_entry_implicit
    catalog:
      script:
        input: |-
          create table A (a int, b int);
          create table db2.schema2.A (c int, d int);
        errors: []
    script:
      input: select * from db1.schema1.A x, db2.schema2.A where x.a = c;
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/unresolved, text: "db1.schema1.A x"}
        - {type: name/catalog, catalog-id: "257.65537.1:1", text: "db2.schema2.A"}
      expressions:
        - {id: 0, type: colref/unresolved, text: "x.a"}
        - {id: 1, type: colref/catalog, catalog: "257.65537.1:1.0", source: "db2.schema2.A", text: "c"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: unresolved, name: x, text: "db1.schema1.A x"}
            - {type: table, name: a, text: "db2.schema2.A"}
          columns:
            - {name: c, table-column: "257.65537.1:1.0"}
            - {name: d, table-column: "257.65537.1:1.1"}
          text: "select * f..re x.a = c"
      inferred-tables:
        - name: db1.schema1.a
          confidence: confident
          columns:
            - {name: a, confidence: confident}

  - name: cross_2_entries_implicit
    catalog:
      script:
        input: create table A (a int, b int);
        errors: []
    script:
      input: select * from db1.schema1.A, db2.schema2.B where a = c;
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/unresolved, text: "db1.schema1.A"}
        - {type: name/unresolved, text: "db2.schema2.B"}
      expressions:
        - {id: 0, type: colref/unresolved, text: "a"}
        - {id: 1, type: colref/unresolved, text: "c"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: unresolved, name: a, text: "db1.schema1.A"}
            - {type: unresolved, name: b, text: "db2.schema2.B"}
          text: "select * f..here a = c"
      inferred-tables:
        - name: db1.schema1.a
          confidence: candidate
          columns:
            - {name: a, confidence: candidate, candidates: [db2.schema2.b]}
            - {name: c, confidence: candidate, candidates: [db2.schema2.b]}

