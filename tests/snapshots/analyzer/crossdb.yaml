      inferred-tables:
        - name: db2.schema2.b
          confidence: confident
          columns:
            - {name: c, confidence: confident}

  - name: cross_first_schema_wins
    catalog:
      script:
        input: create table db1.schema1.A (a int, b int);
        errors: []
    script:
      input: |-
        select * from db1.schema1.A where a = 1;
        select * from db1.schema1.A where c = 1;
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", statement-id: 0, text: "db1.schema1.A"}
        - {type: name/catalog, catalog-id: "256.65536.1:0", statement-id: 1, text: "db1.schema1.A"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "db1.schema1.A", statement-id: 0, text: "a"}
        - {id: 1, type: colref/unresolved, statement-id: 1, text: "c"}
        - {id: 2, type: literal/integer, is-const: true, statement-id: 0, text: "1"}
        - {id: 3, type: literal/integer, is-const: true, statement-id: 1, text: "1"}
      constants:
        - {expression: 2, text: "1"}
        - {expression: 3, text: "1"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: a, text: "db1.schema1.A"}
          columns:
            - {name: a, table-column: "256.65536.1:0.0"}
            - {name: b, table-column: "256.65536.1:0.1"}
          text: "select * f..here a = 1"
        - scope-id: 1
          sources:
            - {type: table, name: a, text: "db1.schema1.A"}
          columns:
            - {name: a, table-column: "256.65536.1:0.0"}
            - {name: b, table-column: "256.65536.1:0.1"}
          text: "select * f..here c = 1"
