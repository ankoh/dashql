    catalog:
      script:
        input: create table db1.schema1.A (a int, b int);
        errors: []
    script:
      input: select * from db1.schema1.A, db2.schema2.B where a = c;
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "db1.schema1.A"}
