analyzer-snapshots:

  - name: parameters_scalar_and_table
    script:
      input: select * from :source s where s.amount > :min and s.region = :region
      catalog-id: 1
      errors: []
      expressions:
        - {id: 0, type: colref/unresolved, text: "s.amount"}
        - {id: 1, type: colref/unresolved, text: "s.region"}
      parameters:
        - {kind: table, name: source, text: ":source"}
        - {kind: scalar, name: min, text: ":min"}
        - {kind: scalar, name: region, text: ":region"}

  - name: parameters_forms
    script:
      input: select :a, :"b", :'c', $0, $1, ? from t where x in (?, ?)
      catalog-id: 1
      errors: []
      table-refs:
        - {type: name/unresolved, text: "t"}
      expressions:
        - {id: 0, type: colref/unresolved, text: "x"}
      parameters:
        - {kind: scalar, name: a, text: ":a"}
        - {kind: scalar, name: b, text: ":\"b\""}
        - {kind: scalar, name: c, text: ":'c'"}
        - {kind: scalar, name: 0, text: "$0"}
        - {kind: scalar, name: 1, text: "$1"}
        - {kind: scalar, text: "?"}
        - {kind: scalar, text: "?"}
        - {kind: scalar, text: "?"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: unresolved, name: t, text: "t"}
          columns:
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
          text: "select :a,.. in (?, ?)"
      inferred-tables:
        - name: t
          confidence: confident
          columns:
            - {name: x, confidence: confident}

  - name: parameters_tables
    script:
      input: |-
        insert into :target select * from :source join (select * from $0 where y = :y) o on true;
        delete from $1 where id = ?
      catalog-id: 1
      errors: []
      expressions:
        - {id: 0, type: colref/unresolved, statement-id: 0, text: "y"}
        - {id: 1, type: colref/unresolved, statement-id: 1, text: "id"}
      parameters:
        - {kind: table, name: target, statement-id: 0, text: ":target"}
        - {kind: table, name: source, statement-id: 0, text: ":source"}
        - {kind: table, name: 0, statement-id: 0, text: "$0"}
        - {kind: scalar, name: y, statement-id: 0, text: ":y"}
        - {kind: table, name: 1, statement-id: 1, text: "$1"}
        - {kind: scalar, statement-id: 1, text: "?"}
      name-scopes:
        - scope-id: 1
          sources:
            - {type: subquery, name: o, scope: 0, text: "(select * .. y = :y) o"}
          text: "select * f.. o on true"

  - name: parameters_casts
    script:
      input: |-
        select :a::int, :b::bigint[], :c::timestamp with time zone, cast(:d as text), :e::numeric(10,2),
          :f::varchar(20), :g::date, :h::json, :i::int8, :j::timestamptz, :k::interval day, :l::bool, :m
      catalog-id: 1
      errors: []
      expressions:
        - {id: 0, type: function, known-function: CAST, is-const: true, text: "cast(:d as text)"}
        - {id: 1, type: literal/integer, is-const: true, text: "10"}
        - {id: 2, type: literal/integer, is-const: true, text: "2"}
        - {id: 3, type: literal/integer, is-const: true, text: "20"}
      constants:
        - {expression: 1, text: "10"}
        - {expression: 2, text: "2"}
        - {expression: 3, text: "20"}
      parameters:
        - {kind: scalar, name: a, cast: "integer", text: ":a"}
        - {kind: scalar, name: b, cast: "bigint[]", text: ":b"}
        - {kind: scalar, name: c, cast: "timestamp with time zone", text: ":c"}
        - {kind: scalar, name: d, cast: "text", text: ":d"}
        - {kind: scalar, name: e, cast: "numeric(10,2)", text: ":e"}
        - {kind: scalar, name: f, cast: "varchar(20)", text: ":f"}
        - {kind: scalar, name: g, cast: "date", text: ":g"}
        - {kind: scalar, name: h, cast: "json", text: ":h"}
        - {kind: scalar, name: i, cast: "bigint", text: ":i"}
        - {kind: scalar, name: j, cast: "timestamp with time zone", text: ":j"}
        - {kind: scalar, name: k, cast: "interval day", text: ":k"}
        - {kind: scalar, name: l, cast: "boolean", text: ":l"}
        - {kind: scalar, name: m, text: ":m"}
      name-scopes:
        - scope-id: 0
          columns:
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', expression: 0}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
          text: "select :a:..::bool, :m"

  - name: parameters_param_tags
    script:
      input: |-
        /**
         * @param :min = 10
         * @param :region = 'North America'
         * @param :day
         * @param :span = interval '3' day
         * @param :bad = now()
         * @param broken
         */
        select * from orders where amount > :min and region = :region and day = :day::date and ts > now() - :span;
        /* @param :min = 20
           @param :"foo-2" = date '2024-01-01' */
        select :min, :"foo-2"
      catalog-id: 1
      errors:
        - {type: INVALID_PARAM_TAG, severity: WARNING, message: 'now() is no literal, a literal is a number, a string, true, false, null, or a typed literal like date ''2024-01-01'' or interval ''3'' day', text: "now()"}
        - {type: INVALID_PARAM_TAG, severity: WARNING, message: 'the script already has a value for @param :min, this tag is ignored', text: ":min"}
      table-refs:
        - {type: name/unresolved, statement-id: 0, text: "orders"}
      expressions:
        - {id: 0, type: colref/unresolved, statement-id: 0, text: "amount"}
        - {id: 1, type: colref/unresolved, statement-id: 0, text: "region"}
        - {id: 2, type: colref/unresolved, statement-id: 0, text: "day"}
        - {id: 3, type: colref/unresolved, statement-id: 0, text: "ts"}
        - {id: 4, type: function, name: now, is-const: true, statement-id: 0, text: "now()"}
      parameters:
        - {kind: scalar, name: min, statement-id: 0, text: ":min"}
        - {kind: scalar, name: region, statement-id: 0, text: ":region"}
        - {kind: scalar, name: day, statement-id: 0, cast: "date", text: ":day"}
        - {kind: scalar, name: span, statement-id: 0, text: ":span"}
        - {kind: scalar, name: min, statement-id: 1, text: ":min"}
        - {kind: scalar, name: foo-2, statement-id: 1, text: ":\"foo-2\""}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: unresolved, name: orders, text: "orders"}
          text: "select * f..() - :span"
        - scope-id: 1
          columns:
            - {name: '?', computed: true}
            - {name: '?', computed: true}
          text: "select :mi.., :\"foo-2\""
      param-values:
        - {name: min, value: "10", statement-id: 0}
        - {name: region, value: "'North America'", statement-id: 0}
        - {name: day, statement-id: 0}
        - {name: span, value: "interval '3' day", statement-id: 0}
        - {name: bad, statement-id: 0}
        - {name: foo-2, value: "date '2024-01-01'", statement-id: 1}
      inferred-tables:
        - name: orders
          confidence: confident
          columns:
            - {name: amount, confidence: confident}
            - {name: region, confidence: confident}
            - {name: day, confidence: confident}
            - {name: ts, confidence: confident}

  - name: parameters_javadoc_param
    script:
      input: |-
        /**
         * @param x the value
         */
        select :x
      catalog-id: 1
      errors: []
      parameters:
        - {kind: scalar, name: x, text: ":x"}
      name-scopes:
        - scope-id: 0
          columns:
            - {name: '?', computed: true}
          text: "select :x"
