analyzer-snapshots:

  - name: parameters_scalar_and_table
    script:
      input: select * from :source s where s.amount > :min and s.region = :region
      catalog-id: 1
      errors: []
      expressions:
        - {id: 0, type: colref/unresolved, text: "s.amount"}
        - {id: 1, type: colref/unresolved, text: "s.region"}
      parameters:
        - {kind: table, name: source, text: ":source"}
        - {kind: scalar, name: min, text: ":min"}
        - {kind: scalar, name: region, text: ":region"}

  - name: parameters_forms
    script:
      input: select :a, :"b", :'c', $0, $1, ? from t where x in (?, ?)
      catalog-id: 1
      errors: []
      table-refs:
        - {type: name/unresolved, text: "t"}
      expressions:
        - {id: 0, type: colref/unresolved, text: "x"}
      parameters:
        - {kind: scalar, name: a, text: ":a"}
        - {kind: scalar, name: b, text: ":\"b\""}
        - {kind: scalar, name: c, text: ":'c'"}
        - {kind: scalar, name: 0, text: "$0"}
        - {kind: scalar, name: 1, text: "$1"}
        - {kind: scalar, text: "?"}
        - {kind: scalar, text: "?"}
        - {kind: scalar, text: "?"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: unresolved, name: t, text: "t"}
          columns:
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
          text: "select :a,.. in (?, ?)"
      inferred-tables:
        - name: t
          confidence: confident
          columns:
            - {name: x, confidence: confident}

  - name: parameters_tables
    script:
      input: |-
        insert into :target select * from :source join (select * from $0 where y = :y) o on true;
        delete from $1 where id = ?
      catalog-id: 1
      errors: []
      expressions:
        - {id: 0, type: colref/unresolved, statement-id: 0, text: "y"}
        - {id: 1, type: colref/unresolved, statement-id: 1, text: "id"}
      parameters:
        - {kind: table, name: target, statement-id: 0, text: ":target"}
        - {kind: table, name: source, statement-id: 0, text: ":source"}
        - {kind: table, name: 0, statement-id: 0, text: "$0"}
        - {kind: scalar, name: y, statement-id: 0, text: ":y"}
        - {kind: table, name: 1, statement-id: 1, text: "$1"}
        - {kind: scalar, statement-id: 1, text: "?"}
      name-scopes:
        - scope-id: 1
          sources:
            - {type: subquery, name: o, scope: 0, text: "(select * .. y = :y) o"}
          text: "select * f.. o on true"

  - name: parameters_casts
    script:
      input: |-
        select :a::int, :b::bigint[], :c::timestamp with time zone, cast(:d as text), :e::numeric(10,2),
          :f::varchar(20), :g::date, :h::json, :i::int8, :j::timestamptz, :k::interval day, :l::bool, :m
      catalog-id: 1
      errors: []
      expressions:
        - {id: 0, type: function, known-function: CAST, is-const: true, text: "cast(:d as text)"}
        - {id: 1, type: literal/integer, is-const: true, text: "10"}
        - {id: 2, type: literal/integer, is-const: true, text: "2"}
        - {id: 3, type: literal/integer, is-const: true, text: "20"}
      constants:
        - {expression: 1, text: "10"}
        - {expression: 2, text: "2"}
        - {expression: 3, text: "20"}
      parameters:
        - {kind: scalar, name: a, cast: "integer", text: ":a"}
        - {kind: scalar, name: b, cast: "bigint[]", text: ":b"}
        - {kind: scalar, name: c, cast: "timestamp with time zone", text: ":c"}
        - {kind: scalar, name: d, cast: "text", text: ":d"}
        - {kind: scalar, name: e, cast: "numeric(10,2)", text: ":e"}
        - {kind: scalar, name: f, cast: "varchar(20)", text: ":f"}
        - {kind: scalar, name: g, cast: "date", text: ":g"}
        - {kind: scalar, name: h, cast: "json", text: ":h"}
        - {kind: scalar, name: i, cast: "bigint", text: ":i"}
        - {kind: scalar, name: j, cast: "timestamp with time zone", text: ":j"}
        - {kind: scalar, name: k, cast: "interval day", text: ":k"}
        - {kind: scalar, name: l, cast: "boolean", text: ":l"}
        - {kind: scalar, name: m, text: ":m"}
      name-scopes:
        - scope-id: 0
          columns:
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', expression: 0}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
          text: "select :a:..::bool, :m"

  - name: parameters_param_tags
    script:
      input: |-
        /**
         * @param :min = 10
         * @param :region = 'North America'
         * @param :day
         * @param :span = interval '3' day
         * @param :bad = now()
         * @param broken
         */
        select * from orders where amount > :min and region = :region and day = :day::date and ts > now() - :span;
        /* @param :min = 20
           @param :"foo-2" = date '2024-01-01' */
        select :min, :"foo-2"
      catalog-id: 1
      errors:
        - {type: INVALID_PARAM_TAG, severity: WARNING, message: 'now() is no literal, a literal is a number, a string, true, false, null, or a typed literal like date ''2024-01-01'' or interval ''3'' day', text: "now()"}
        - {type: INVALID_PARAM_TAG, severity: WARNING, message: 'the script already has a value for @param :min, this tag is ignored', text: ":min"}
      table-refs:
        - {type: name/unresolved, statement-id: 0, text: "orders"}
      expressions:
        - {id: 0, type: colref/unresolved, statement-id: 0, text: "amount"}
        - {id: 1, type: colref/unresolved, statement-id: 0, text: "region"}
        - {id: 2, type: colref/unresolved, statement-id: 0, text: "day"}
        - {id: 3, type: colref/unresolved, statement-id: 0, text: "ts"}
        - {id: 4, type: function, name: now, is-const: true, statement-id: 0, text: "now()"}
      parameters:
        - {kind: scalar, name: min, statement-id: 0, text: ":min"}
        - {kind: scalar, name: region, statement-id: 0, text: ":region"}
        - {kind: scalar, name: day, statement-id: 0, cast: "date", text: ":day"}
        - {kind: scalar, name: span, statement-id: 0, text: ":span"}
        - {kind: scalar, name: min, statement-id: 1, text: ":min"}
        - {kind: scalar, name: foo-2, statement-id: 1, text: ":\"foo-2\""}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: unresolved, name: orders, text: "orders"}
          text: "select * f..() - :span"
        - scope-id: 1
          columns:
            - {name: '?', computed: true}
            - {name: '?', computed: true}
          text: "select :mi.., :\"foo-2\""
      param-values:
        - {name: min, value: "10", statement-id: 0}
        - {name: region, value: "'North America'", statement-id: 0}
        - {name: day, statement-id: 0}
        - {name: span, value: "interval '3' day", statement-id: 0}
        - {name: bad, statement-id: 0}
        - {name: foo-2, value: "date '2024-01-01'", statement-id: 1}
      inferred-tables:
        - name: orders
          confidence: confident
          columns:
            - {name: amount, confidence: confident}
            - {name: region, confidence: confident}
            - {name: day, confidence: confident}
            - {name: ts, confidence: confident}

  - name: parameters_javadoc_param
    script:
      input: |-
        /**
         * @param x the value
         */
        select :x
      catalog-id: 1
      errors: []
      parameters:
        - {kind: scalar, name: x, text: ":x"}
      name-scopes:
        - scope-id: 0
          columns:
            - {name: '?', computed: true}
          text: "select :x"

  - name: parameters_in_limit_and_function_args
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: select f(:x), a from t limit :n offset $1
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "t"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", text: "a"}
        - {id: 1, type: function, name: f, text: "f(:x)"}
      parameters:
        - {kind: scalar, name: x, text: ":x"}
        - {kind: scalar, name: n, text: ":n"}
        - {kind: scalar, name: 1, text: "$1"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: t, text: "t"}
          columns:
            - {name: '?', expression: 1}
            - {name: a, expression: 0}
          text: "select f(:.. offset $1"

  - name: parameters_in_cte_and_subquery
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: with c as (select * from :src where k = :k) select * from c where exists (select 1 from $1 p where p.id = c.id)
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/cte, text: "c"}
      expressions:
        - {id: 0, type: colref/unresolved, text: "k"}
        - {id: 1, type: colref/unresolved, text: "p.id"}
        - {id: 2, type: colref/unresolved, text: "c.id"}
        - {id: 3, type: literal/integer, is-const: true, text: "1"}
      constants:
        - {expression: 3, text: "1"}
      parameters:
        - {kind: table, name: src, text: ":src"}
        - {kind: scalar, name: k, text: ":k"}
        - {kind: table, name: 1, text: "$1"}
      name-scopes:
        - scope-id: 1
          parent: 2
          columns:
            - {name: '?', expression: 3}
          text: "(select 1 ..id = c.id)"
        - scope-id: 2
          sources:
            - {type: cte, name: c, scope: 0, text: "c"}
          text: "with c as ..id = c.id)"

  - name: parameters_param_tag_literal_forms
    script:
      input: |-
        /* @param :neg = -5
           @param :ratio = 1.25
           @param :flag = true
           @param :off = false
           @param :nothing = null
           @param :quote = 'it''s'
           @param :ts = timestamp '2024-01-01 10:00:00'
           @param :num = cast('7' as int)
           @param :typed = '2024-01-01'::date
           @param :dollar = $$x$$
           @param :badspan = interval 'abc' day
           @param :expr = 1 + 2 */
        select :neg, :ratio, :flag, :off, :nothing, :quote, :ts, :num, :typed, :dollar, :badspan, :expr
      catalog-id: 1
      errors:
        - {type: INVALID_PARAM_TAG, severity: WARNING, message: 'cast(''7'' as int) is no literal, a literal is a number, a string, true, false, null, or a typed literal like date ''2024-01-01'' or interval ''3'' day', text: "cast('7' as int)"}
        - {type: INVALID_PARAM_TAG, severity: WARNING, message: '''2024-01-01''::date is no literal, a literal is a number, a string, true, false, null, or a typed literal like date ''2024-01-01'' or interval ''3'' day', text: "'2024-01-01'::date"}
        - {type: INVALID_PARAM_TAG, severity: WARNING, message: '$$x$$ is no plain string, a literal is a number, a string, true, false, null, or a typed literal like date ''2024-01-01'' or interval ''3'' day', text: "$$x$$"}
        - {type: INVALID_PARAM_TAG, severity: WARNING, message: 'interval ''abc'' day is no interval literal, an interval is a number and a unit, e.g. interval ''3'' day, a literal is a number, a string, true, false, null, or a typed literal like date ''2024-01-01'' or interval ''3'' day', text: "interval 'abc' day"}
        - {type: INVALID_PARAM_TAG, severity: WARNING, message: '1 + 2 is no literal, a literal is a number, a string, true, false, null, or a typed literal like date ''2024-01-01'' or interval ''3'' day', text: "1 + 2"}
      parameters:
        - {kind: scalar, name: neg, text: ":neg"}
        - {kind: scalar, name: ratio, text: ":ratio"}
        - {kind: scalar, name: flag, text: ":flag"}
        - {kind: scalar, name: off, text: ":off"}
        - {kind: scalar, name: nothing, text: ":nothing"}
        - {kind: scalar, name: quote, text: ":quote"}
        - {kind: scalar, name: ts, text: ":ts"}
        - {kind: scalar, name: num, text: ":num"}
        - {kind: scalar, name: typed, text: ":typed"}
        - {kind: scalar, name: dollar, text: ":dollar"}
        - {kind: scalar, name: badspan, text: ":badspan"}
        - {kind: scalar, name: expr, text: ":expr"}
      name-scopes:
        - scope-id: 0
          columns:
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', computed: true}
          text: "select :ne..pan, :expr"
      param-values:
        - {name: neg, value: "-5", statement-id: 0}
        - {name: ratio, value: "1.25", statement-id: 0}
        - {name: flag, value: "true", statement-id: 0}
        - {name: off, value: "false", statement-id: 0}
        - {name: nothing, value: "null", statement-id: 0}
        - {name: quote, value: "'it''s'", statement-id: 0}
        - {name: ts, value: "timestamp '2024-01-01 10:00:00'", statement-id: 0}
        - {name: num, statement-id: 0}
        - {name: typed, statement-id: 0}
        - {name: dollar, statement-id: 0}
        - {name: badspan, statement-id: 0}
        - {name: expr, statement-id: 0}

  - name: parameters_param_tag_unused_and_quoted_names
    script:
      input: |-
        /* @param :unused = 1
           @param :"Mixed Case" = 'x'
           @param :mixed = 2 */
        select :"Mixed Case", :mixed
      catalog-id: 1
      errors: []
      parameters:
        - {kind: scalar, name: Mixed Case, text: ":\"Mixed Case\""}
        - {kind: scalar, name: mixed, text: ":mixed"}
      name-scopes:
        - scope-id: 0
          columns:
            - {name: '?', computed: true}
            - {name: '?', computed: true}
          text: "select :\"M..e\", :mixed"
      param-values:
        - {name: unused, value: "1", statement-id: 0}
        - {name: Mixed Case, value: "'x'", statement-id: 0}
        - {name: mixed, value: "2", statement-id: 0}

  - name: parameters_param_tag_legacy_end
    script:
      input: |-
        -- @param :year = 2024
        -- @end
        /* @end */
        select :year
      catalog-id: 1
      errors:
        - {type: MALFORMED_COMMENT_TAG, severity: WARNING, message: '@end without an opening tag', text: "@end"}
      parameters:
        - {kind: scalar, name: year, text: ":year"}
      name-scopes:
        - scope-id: 0
          columns:
            - {name: '?', computed: true}
          text: "select :year"
      param-values:
        - {name: year, value: "2024", statement-id: 0}
