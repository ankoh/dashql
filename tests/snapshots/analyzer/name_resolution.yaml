analyzer-snapshots:

  - name: derived_alias
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: select s.a, s.z, z from (select a, b as z from t) s
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "t"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "(select a,.. from t) s", text: "s.a"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:0.1", source: "(select a,.. from t) s", text: "s.z"}
        - {id: 2, type: colref/catalog, catalog: "256.65536.1:0.1", source: "(select a,.. from t) s", text: "z"}
        - {id: 3, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", text: "a"}
        - {id: 4, type: colref/catalog, catalog: "256.65536.1:0.1", source: "t", text: "b"}
      name-scopes:
        - scope-id: 0
          parent: 1
          parent-sources: none
          sources:
            - {type: table, name: t, text: "t"}
          columns:
            - {name: a, expression: 3}
            - {name: z, expression: 4}
          text: "(select a,.. z from t)"
        - scope-id: 1
          sources:
            - {type: subquery, name: s, scope: 0, text: "(select a,.. from t) s"}
          columns:
            - {name: a, expression: 0}
            - {name: z, expression: 1}
            - {name: z, expression: 2}
          text: "select s.a.. from t) s"

