            - {type: cte, name: z, scope: 1, text: "z"}
          columns:
            - {name: a, expression: 1}
            - {name: q, expression: 2}
          text: "with z as .., q from z"
        - scope-id: 3
          sources:
            - {type: table, name: z, text: "z"}
          columns:
            - {name: q, expression: 3}
          text: "select q from z"

