        - {id: 1, type: colref/catalog, catalog: "256.65536.1:0.0", source: "z", statement-id: 1, text: "a"}
        - {id: 2, type: colref/unresolved, statement-id: 1, text: "q"}
        - {id: 3, type: colref/internal, catalog: "256.65536.2:0.0", source: "z", statement-id: 2, text: "q"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: z, text: "z"}
          text: "create tab.. z (q int)"
        - scope-id: 1
          parent: 2
          parent-sources: none
          sources:
            - {type: table, name: t, text: "t"}
          columns:
            - {name: a, expression: 0}
          text: "select a from t"
        - scope-id: 2
