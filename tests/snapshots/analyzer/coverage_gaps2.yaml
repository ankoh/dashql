analyzer-snapshots:

  - name: cte_name_of_write_target
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: |-
        with t as (select 5 as a) insert into t (a) select a from t;
        with u as (select 1 as k) delete from u where c = 1;
        with v as (select 1 as k) update v set x = 2 where id = 1
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/cte, statement-id: 0, text: "t"}
        - {type: name/catalog, catalog-id: "256.65536.1:0", statement-id: 0, role: write, text: "t"}
        - {type: name/catalog, catalog-id: "256.65536.1:1", statement-id: 1, role: write, text: "u"}
        - {type: name/catalog, catalog-id: "256.65536.1:2", statement-id: 2, role: write, text: "v"}
      inserts:
        - statement-id: 0
          target-ref: 1
          source: "select a from t"
          columns:
            - {name: a, resolved: true}
      expressions:
        - {id: 0, type: colref/local, scope: 0, column: 0, source: "t", statement-id: 0, text: "a"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:1.1", source: "u", statement-id: 1, text: "c"}
        - {id: 2, type: colref/catalog, catalog: "256.65536.1:2.0", source: "v", statement-id: 2, text: "id"}
        - {id: 3, type: colref/catalog, catalog: "256.65536.1:2.1", source: "v", statement-id: 2, text: "x"}
        - {id: 4, type: literal/integer, is-const: true, text: "5"}
        - {id: 5, type: literal/integer, is-const: true, text: "1"}
        - {id: 6, type: literal/integer, is-const: true, text: "1"}
        - {id: 7, type: literal/integer, is-const: true, statement-id: 2, text: "1"}
        - {id: 8, type: literal/integer, is-const: true, statement-id: 2, text: "2"}
        - {id: 9, type: literal/integer, is-const: true, statement-id: 2, text: "1"}
      constants:
        - {expression: 4, text: "5"}
        - {expression: 5, text: "1"}
        - {expression: 6, text: "1"}
        - {expression: 7, text: "1"}
        - {expression: 8, text: "2"}
        - {expression: 9, text: "1"}
      name-scopes:
        - scope-id: 0
          parent: 2
          parent-sources: none
          correlation-barrier: true
          columns:
            - {name: a, expression: 4}
          text: "select 5 as a"
        - scope-id: 1
          parent: 2
          correlation-barrier: true
          sources:
            - {type: cte, name: t, scope: 0, text: "t"}
          columns:
            - {name: a, expression: 0}
          text: "select a from t"
        - scope-id: 2
          sources:
            - {type: table, name: t, text: "t"}
          text: "with t as ..t a from t"
        - scope-id: 3
          parent: 4
          parent-sources: none
          correlation-barrier: true
          columns:
            - {name: k, expression: 5}
          text: "select 1 as k"
        - scope-id: 4
          sources:
            - {type: table, name: u, text: "u"}
          text: "with u as ..here c = 1"
        - scope-id: 5
          parent: 6
          parent-sources: none
          correlation-barrier: true
          columns:
            - {name: k, expression: 7}
          text: "select 1 as k"
        - scope-id: 6
          sources:
            - {type: table, name: v, text: "v"}
          text: "with v as ..ere id = 1"

  - name: cte_of_subquery_invisible_outside
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: select (with c as (select a from t) select count(*) from c), (select 1 from c)
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "t"}
        - {type: name/cte, text: "c"}
        - {type: name/unresolved, text: "c"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", text: "a"}
        - {id: 1, type: function, name: count, text: "count(*)"}
        - {id: 2, type: literal/integer, is-const: true, text: "1"}
      constants:
        - {expression: 2, text: "1"}
      name-scopes:
        - scope-id: 0
          parent: 1
          parent-sources: none
          sources:
            - {type: table, name: t, text: "t"}
          columns:
            - {name: a, expression: 0}
          text: "select a from t"
        - scope-id: 1
          parent: 3
          sources:
            - {type: cte, name: c, scope: 0, text: "c"}
          columns:
            - {name: '?', expression: 1}
          text: "(with c as..*) from c)"
        - scope-id: 2
          parent: 3
          sources:
            - {type: unresolved, name: c, text: "c"}
          columns:
            - {name: '?', expression: 2}
          text: "(select 1 from c)"
        - scope-id: 3
          columns:
            - {name: '?', computed: true}
            - {name: '?', computed: true}
          text: "select (wi.. 1 from c)"

  - name: cte_shadows_script_table
