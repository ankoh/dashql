        - {type: name/catalog, catalog-id: "256.65536.1:0", statement-id: 1, text: "t"}
        - {type: name/cte, statement-id: 1, text: "z"}
        - {type: name/internal, catalog-id: "256.65536.2:0", statement-id: 2, text: "z"}
      expressions:
