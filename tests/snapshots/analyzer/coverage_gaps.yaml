          columns:
            - {name: '?', expression: 5}
            - {name: '?', expression: 6}
            - {name: '?', expression: 7}
            - {name: '?', expression: 8}
            - {name: '?', expression: 9}
          text: "select cou.. b) from t"

  - name: func_within_group_filter
    catalog:
      script:
        input: |-
          create table t (a int, b int); create table u (a int, c int);
        errors: []
    script:
