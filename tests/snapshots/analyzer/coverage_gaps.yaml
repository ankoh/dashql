        - {id: 1, type: function, name: count, text: "count(distinct 1)"}
        - {id: 2, type: function, name: sum, text: "sum(1) over ()"}
        - {id: 3, type: function, name: sum, text: "sum(1) over w"}
        - {id: 4, type: literal/integer, is-const: true, text: "1"}
        - {id: 5, type: literal/integer, is-const: true, text: "1"}
        - {id: 6, type: literal/integer, is-const: true, text: "1"}
      constants:
        - {expression: 4, text: "1"}
        - {expression: 5, text: "1"}
        - {expression: 6, text: "1"}
      name-scopes:
