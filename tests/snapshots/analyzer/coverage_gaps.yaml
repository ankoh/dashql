          columns:
            - {name: '?', expression: 0}
            - {name: '?', expression: 1}
            - {name: '?', expression: 2}
            - {name: '?', expression: 3}
          text: "select cou..ow w as ()"

  - name: func_named_arguments
    script:
      input: select f(a => 1, b => 'x'), g(1, name => 2)
      catalog-id: 1
      errors: []
      expressions:
        - {id: 0, type: function, name: f, is-const: true, text: "f(a => 1, b => 'x')"}
        - {id: 1, type: function, name: g, is-const: true, text: "g(1, name => 2)"}
        - {id: 2, type: literal/integer, is-const: true, text: "1"}
        - {id: 3, type: literal/string, is-const: true, text: "'x'"}
        - {id: 4, type: literal/integer, is-const: true, text: "1"}
        - {id: 5, type: literal/integer, is-const: true, text: "2"}
      constants:
        - {expression: 2, text: "1"}
