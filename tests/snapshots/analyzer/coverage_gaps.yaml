  - name: func_variadic_star_all_distinct
    catalog:
      script:
        input: |-
          create table t (a int, b int); create table u (a int, c int);
        errors: []
    script:
      input: select count(*), count(all a), count(distinct a), f(variadic arr), string_agg(a, ',' order by b) from t
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "t"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", text: "a"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", text: "a"}
        - {id: 2, type: colref/unresolved, text: "arr"}
        - {id: 3, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", text: "a"}
        - {id: 4, type: colref/catalog, catalog: "256.65536.1:0.1", source: "t", text: "b"}
        - {id: 5, type: function, name: count, text: "count(*)"}
        - {id: 6, type: function, name: count, text: "count(all a)"}
        - {id: 7, type: function, name: count, text: "count(distinct a)"}
        - {id: 8, type: function, name: f, text: "f(variadic arr)"}
        - {id: 9, type: function, name: string_agg, text: "string_agg..rder by b)"}
        - {id: 10, type: literal/string, is-const: true, text: "','"}
      constants:
