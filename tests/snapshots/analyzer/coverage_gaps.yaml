analyzer-snapshots:

  - name: const_arithmetic
    script:
      input: select 1 + 2, 3 - 1, 2 * 3, 6 / 2, 7 % 3, 5 ^ 2
      catalog-id: 1
      errors: []
      expressions:
        - {id: 0, type: literal/integer, is-const: true, text: "1"}
        - {id: 1, type: literal/integer, is-const: true, text: "2"}
        - {id: 2, type: binary, op: PLUS, arg-left: 0, arg-right: 1, is-const: true, text: "1 + 2"}
        - {id: 3, type: literal/integer, is-const: true, text: "3"}
        - {id: 4, type: literal/integer, is-const: true, text: "1"}
        - {id: 5, type: binary, op: MINUS, arg-left: 3, arg-right: 4, is-const: true, text: "3 - 1"}
        - {id: 6, type: literal/integer, is-const: true, text: "2"}
        - {id: 7, type: literal/integer, is-const: true, text: "3"}
        - {id: 8, type: binary, op: MULTIPLY, arg-left: 6, arg-right: 7, is-const: true, text: "2 * 3"}
        - {id: 9, type: literal/integer, is-const: true, text: "6"}
        - {id: 10, type: literal/integer, is-const: true, text: "2"}
        - {id: 11, type: binary, op: DIVIDE, arg-left: 9, arg-right: 10, is-const: true, text: "6 / 2"}
        - {id: 12, type: literal/integer, is-const: true, text: "7"}
        - {id: 13, type: literal/integer, is-const: true, text: "3"}
        - {id: 14, type: binary, op: MODULUS, arg-left: 12, arg-right: 13, is-const: true, text: "7 % 3"}
        - {id: 15, type: literal/integer, is-const: true, text: "5"}
        - {id: 16, type: literal/integer, is-const: true, text: "2"}
        - {id: 17, type: binary, op: XOR, arg-left: 15, arg-right: 16, is-const: true, text: "5 ^ 2"}
      constants:
        - {expression: 0, text: "1"}
        - {expression: 1, text: "2"}
        - {expression: 2, text: "1 + 2"}
        - {expression: 3, text: "3"}
        - {expression: 4, text: "1"}
        - {expression: 5, text: "3 - 1"}
        - {expression: 6, text: "2"}
        - {expression: 7, text: "3"}
        - {expression: 8, text: "2 * 3"}
        - {expression: 9, text: "6"}
        - {expression: 10, text: "2"}
        - {expression: 11, text: "6 / 2"}
        - {expression: 12, text: "7"}
        - {expression: 13, text: "3"}
        - {expression: 14, text: "7 % 3"}
        - {expression: 15, text: "5"}
        - {expression: 16, text: "2"}
        - {expression: 17, text: "5 ^ 2"}
      name-scopes:
        - scope-id: 0
          columns:
            - {name: '?', expression: 2}
            - {name: '?', expression: 5}
            - {name: '?', expression: 8}
            - {name: '?', expression: 11}
            - {name: '?', expression: 14}
            - {name: '?', expression: 17}
          text: "select 1 +..% 3, 5 ^ 2"

  - name: const_comparisons
    script:
      input: select 1 = 1, 1 <> 2, 1 < 2, 1 <= 2, 3 > 2, 3 >= 2
      catalog-id: 1
      errors: []
      expressions:
        - {id: 0, type: literal/integer, is-const: true, text: "1"}
        - {id: 1, type: literal/integer, is-const: true, text: "1"}
        - {id: 2, type: comparison, op: EQUAL, arg-left: 0, arg-right: 1, is-const: true, text: "1 = 1"}
        - {id: 3, type: literal/integer, is-const: true, text: "1"}
        - {id: 4, type: literal/integer, is-const: true, text: "2"}
        - {id: 5, type: comparison, op: NOT_EQUAL, arg-left: 3, arg-right: 4, is-const: true, text: "1 <> 2"}
        - {id: 6, type: literal/integer, is-const: true, text: "1"}
        - {id: 7, type: literal/integer, is-const: true, text: "2"}
        - {id: 8, type: comparison, op: LESS_THAN, arg-left: 6, arg-right: 7, is-const: true, text: "1 < 2"}
        - {id: 9, type: literal/integer, is-const: true, text: "1"}
        - {id: 10, type: literal/integer, is-const: true, text: "2"}
        - {id: 11, type: comparison, op: LESS_EQUAL, arg-left: 9, arg-right: 10, is-const: true, text: "1 <= 2"}
        - {id: 12, type: literal/integer, is-const: true, text: "3"}
        - {id: 13, type: literal/integer, is-const: true, text: "2"}
        - {id: 14, type: comparison, op: GREATER_THAN, arg-left: 12, arg-right: 13, is-const: true, text: "3 > 2"}
        - {id: 15, type: literal/integer, is-const: true, text: "3"}
        - {id: 16, type: literal/integer, is-const: true, text: "2"}
        - {id: 17, type: comparison, op: GREATER_EQUAL, arg-left: 15, arg-right: 16, is-const: true, text: "3 >= 2"}
      constants:
        - {expression: 0, text: "1"}
        - {expression: 1, text: "1"}
        - {expression: 2, text: "1 = 1"}
        - {expression: 3, text: "1"}
        - {expression: 4, text: "2"}
        - {expression: 5, text: "1 <> 2"}
        - {expression: 6, text: "1"}
        - {expression: 7, text: "2"}
        - {expression: 8, text: "1 < 2"}
        - {expression: 9, text: "1"}
        - {expression: 10, text: "2"}
        - {expression: 11, text: "1 <= 2"}
        - {expression: 12, text: "3"}
        - {expression: 13, text: "2"}
        - {expression: 14, text: "3 > 2"}
        - {expression: 15, text: "3"}
        - {expression: 16, text: "2"}
        - {expression: 17, text: "3 >= 2"}
      name-scopes:
        - scope-id: 0
          columns:
            - {name: '?', expression: 2}
            - {name: '?', expression: 5}
            - {name: '?', expression: 8}
            - {name: '?', expression: 11}
            - {name: '?', expression: 14}
            - {name: '?', expression: 17}
          text: "select 1 =.. 2, 3 >= 2"

  - name: const_mixed_not_constant
    catalog:
      script:
        input: |-
          create table t (a int, b int); create table u (a int, c int);
        errors: []
    script:
      input: select a + 1, 2 * 3, b = 2 from t where a < 5 + 5
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "t"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", text: "a"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:0.1", source: "t", text: "b"}
        - {id: 2, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", text: "a"}
        - {id: 3, type: literal/integer, is-const: true, text: "1"}
        - {id: 4, type: literal/integer, is-const: true, text: "2"}
        - {id: 5, type: literal/integer, is-const: true, text: "3"}
        - {id: 6, type: binary, op: MULTIPLY, arg-left: 4, arg-right: 5, is-const: true, text: "2 * 3"}
        - {id: 7, type: literal/integer, is-const: true, text: "2"}
        - {id: 8, type: literal/integer, is-const: true, text: "5"}
        - {id: 9, type: literal/integer, is-const: true, text: "5"}
        - {id: 10, type: binary, op: PLUS, arg-left: 8, arg-right: 9, is-const: true, text: "5 + 5"}
      constants:
        - {expression: 3, text: "1"}
        - {expression: 4, text: "2"}
        - {expression: 5, text: "3"}
        - {expression: 6, text: "2 * 3"}
        - {expression: 7, text: "2"}
        - {expression: 8, text: "5"}
        - {expression: 9, text: "5"}
        - {expression: 10, text: "5 + 5"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: t, text: "t"}
          columns:
            - {name: '?', computed: true}
            - {name: '?', expression: 6}
            - {name: '?', computed: true}
          text: "select a +.. a < 5 + 5"

  - name: const_unary_and_nested
    script:
      input: select -1, -(2 + 3), (1 + 2) * (3 + 4)
      catalog-id: 1
      errors: []
      expressions:
        - {id: 0, type: literal/integer, is-const: true, text: "1"}
        - {id: 1, type: literal/integer, is-const: true, text: "2"}
        - {id: 2, type: literal/integer, is-const: true, text: "3"}
        - {id: 3, type: binary, op: PLUS, arg-left: 1, arg-right: 2, is-const: true, text: "2 + 3"}
        - {id: 4, type: literal/integer, is-const: true, text: "1"}
        - {id: 5, type: literal/integer, is-const: true, text: "2"}
        - {id: 6, type: literal/integer, is-const: true, text: "3"}
        - {id: 7, type: literal/integer, is-const: true, text: "4"}
        - {id: 8, type: binary, op: PLUS, arg-left: 4, arg-right: 5, is-const: true, text: "1 + 2"}
        - {id: 9, type: binary, op: PLUS, arg-left: 6, arg-right: 7, is-const: true, text: "3 + 4"}
        - {id: 10, type: binary, op: MULTIPLY, arg-left: 8, arg-right: 9, is-const: true, text: "(1 + 2) * (3 + 4)"}
      constants:
        - {expression: 0, text: "1"}
        - {expression: 1, text: "2"}
        - {expression: 2, text: "3"}
        - {expression: 3, text: "2 + 3"}
        - {expression: 4, text: "1"}
        - {expression: 5, text: "2"}
        - {expression: 6, text: "3"}
        - {expression: 7, text: "4"}
        - {expression: 8, text: "1 + 2"}
        - {expression: 9, text: "3 + 4"}
        - {expression: 10, text: "(1 + 2) * (3 + 4)"}
      name-scopes:
        - scope-id: 0
          columns:
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: '?', expression: 10}
          text: "select -1,.. * (3 + 4)"

  - name: const_interval_precision
    script:
      input: select interval '1' day, interval '1 2' day to hour, interval(3) '4' second, interval '1' year to month
      catalog-id: 1
      errors: []
      expressions:
        - {id: 0, type: literal/string, is-const: true, text: "'1'"}
        - {id: 1, type: constcast/interval, is-const: true, text: "interval '1' day"}
        - {id: 2, type: literal/string, is-const: true, text: "'1 2'"}
        - {id: 3, type: constcast/interval, is-const: true, text: "interval '..ay to hour"}
        - {id: 4, type: literal/string, is-const: true, text: "'4'"}
        - {id: 5, type: literal/integer, is-const: true, text: "3"}
        - {id: 6, type: literal/string, is-const: true, text: "'1'"}
        - {id: 7, type: constcast/interval, is-const: true, text: "interval '..r to month"}
      constants:
        - {expression: 1, text: "interval '1' day"}
        - {expression: 3, text: "interval '..ay to hour"}
        - {expression: 7, text: "interval '..r to month"}
      name-scopes:
        - scope-id: 0
          columns:
            - {name: '?', expression: 1}
            - {name: '?', expression: 3}
            - {name: '?', expression: 7}
          text: "select int..r to month"

  - name: const_function_calls
    catalog:
      script:
        input: |-
          create table t (a int, b int); create table u (a int, c int);
        errors: []
    script:
      input: select now(), upper('a'), lower(upper('b')), length(a), coalesce(1, 2) from t
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "t"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", text: "a"}
        - {id: 1, type: function, name: now, is-const: true, text: "now()"}
        - {id: 2, type: function, name: upper, is-const: true, text: "upper('a')"}
        - {id: 3, type: function, name: upper, is-const: true, text: "upper('b')"}
        - {id: 4, type: function, name: lower, is-const: true, text: "lower(upper('b'))"}
        - {id: 5, type: function, name: length, text: "length(a)"}
        - {id: 6, type: function, known-function: COALESCE, is-const: true, text: "coalesce(1, 2)"}
        - {id: 7, type: literal/string, is-const: true, text: "'a'"}
        - {id: 8, type: literal/string, is-const: true, text: "'b'"}
        - {id: 9, type: literal/integer, is-const: true, text: "1"}
        - {id: 10, type: literal/integer, is-const: true, text: "2"}
      constants:
        - {expression: 7, text: "'a'"}
        - {expression: 2, text: "upper('a')"}
        - {expression: 8, text: "'b'"}
        - {expression: 3, text: "upper('b')"}
        - {expression: 4, text: "lower(upper('b'))"}
        - {expression: 9, text: "1"}
        - {expression: 10, text: "2"}
        - {expression: 6, text: "coalesce(1, 2)"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: t, text: "t"}
          columns:
            - {name: '?', expression: 1}
            - {name: '?', expression: 2}
            - {name: '?', expression: 4}
            - {name: '?', expression: 5}
            - {name: '?', expression: 6}
          text: "select now.. 2) from t"

  - name: const_function_modifiers
    catalog:
      script:
        input: |-
          create table t (a int, b int); create table u (a int, c int);
        errors: []
    script:
      input: select count(*), count(distinct 1), sum(1) over (), sum(1) over w from t window w as ()
      catalog-id: 2
      errors: []
      table-refs:
