          text: "select f(a..name => 2)"

  - name: func_qualified_name
    script:
      input: select pg_catalog.length('a'), db.sch.f(1), s.f()
      catalog-id: 1
      errors: []
      expressions:
        - {id: 0, type: function, name: pg_catalog.length, is-const: true, text: "pg_catalog..ength('a')"}
        - {id: 1, type: function, name: db.sch.f, is-const: true, text: "db.sch.f(1)"}
