analyzer-snapshots:

  - name: row_type_columns
    script:
      input: create table orders (id int, product row(name text, quantity int), tags array(row(tag text)))
      catalog-id: 1
      tables:
        - catalog-id: "256.65536.1:0"
          name: orders
          text: "create tab..ag text)))"
          columns:
            - {catalog-id: "256.65536.1:0.0", name: id, text: "id int"}
            - {catalog-id: "256.65536.1:0.1", name: product, text: "product ro..ntity int)"}
            - {catalog-id: "256.65536.1:0.2", name: tags, text: "tags array..tag text))"}
      touched-relations:
        - {statement-id: 0, name: orders}
      errors: []
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: orders, text: "orders"}
          text: "create tab..ag text)))"

  - name: row_field_access
    catalog:
      script:
        input: create table orders (id int, product row(name text, quantity int));
        errors: []
    script:
      input: select (product).name, (o.product).quantity, o.product.name, product.quantity from orders o
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "orders o"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.1", source: "orders o", text: "product"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:0.1", source: "orders o", text: "o.product"}
        - {id: 2, type: colref/catalog, catalog: "256.65536.1:0.1", source: "orders o", text: "o.product.name"}
        - {id: 3, type: colref/catalog, catalog: "256.65536.1:0.1", source: "orders o", text: "product.quantity"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: o, text: "orders o"}
          columns:
            - {name: '?', computed: true}
            - {name: '?', computed: true}
            - {name: name, expression: 2}
            - {name: quantity, expression: 3}
          text: "select (pr..m orders o"

  - name: row_field_access_table_wins
    catalog:
      script:
        input: |-
          create table product (name text);
          create table orders (id int, product row(name text, quantity int));
        errors: []
    script:
      input: select product.name from product, orders
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "product"}
        - {type: name/catalog, catalog-id: "256.65536.1:1", text: "orders"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "product", text: "product.name"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: product, text: "product"}
            - {type: table, name: orders, text: "orders"}
          columns:
            - {name: name, expression: 0}
          text: "select pro..ct, orders"

  - name: row_field_access_correlated
    catalog:
      script:
        input: |-
          create table orders (id int, product row(name text, quantity int));
          create table stock (name text, quantity int);
        errors: []
    script:
      input: select id from orders where exists (select 1 from stock where stock.name = product.name)
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:1", text: "stock"}
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "orders"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "orders", text: "id"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:1.0", source: "stock", text: "stock.name"}
        - {id: 2, type: colref/catalog, catalog: "256.65536.1:0.1", source: "orders", text: "product.name"}
        - {id: 3, type: literal/integer, is-const: true, text: "1"}
      constants:
        - {expression: 3, text: "1"}
      name-scopes:
        - scope-id: 0
          parent: 1
          sources:
            - {type: table, name: stock, text: "stock"}
          columns:
            - {name: '?', expression: 3}
          text: "(select 1 ..duct.name)"
        - scope-id: 1
          sources:
            - {type: table, name: orders, text: "orders"}
          columns:
            - {name: id, expression: 0}
          text: "select id ..duct.name)"

  - name: row_constructor_columns
    catalog:
      script:
        input: create table orders (id int, product row(name text, quantity int));
        errors: []
    script:
      input: select row(id, product.name) from orders where (id, (product).quantity) = (1, 2)
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "orders"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "orders", text: "id"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:0.1", source: "orders", text: "product.name"}
        - {id: 2, type: colref/catalog, catalog: "256.65536.1:0.1", source: "orders", text: "product"}
        - {id: 3, type: colref/catalog, catalog: "256.65536.1:0.0", source: "orders", text: "id"}
        - {id: 4, type: literal/integer, is-const: true, text: "1"}
        - {id: 5, type: literal/integer, is-const: true, text: "2"}
      constants:
        - {expression: 4, text: "1"}
        - {expression: 5, text: "2"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: orders, text: "orders"}
          columns:
            - {name: '?', computed: true}
          text: "select row..) = (1, 2)"

  - name: row_field_access_inferred
    script:
      input: select o.product.name from orders o
      catalog-id: 1
      errors: []
      table-refs:
        - {type: name/unresolved, text: "orders o"}
      expressions:
        - {id: 0, type: colref/unresolved, text: "o.product.name"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: unresolved, name: o, text: "orders o"}
          columns:
            - {name: name, expression: 0}
          text: "select o.p..m orders o"
      inferred-tables:
        - name: orders
          confidence: confident
          columns:
            - {name: product, confidence: confident}

  - name: row_field_access_unresolved
    catalog:
      script:
        input: create table orders (id int, product row(name text, quantity int));
        errors: []
    script:
      input: select s.id, missing.name from (select id from orders) s, orders
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "orders"}
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "orders"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "(select id.. orders) s", text: "s.id"}
        - {id: 1, type: colref/unresolved, text: "missing.name"}
        - {id: 2, type: colref/catalog, catalog: "256.65536.1:0.0", source: "orders", text: "id"}
      name-scopes:
        - scope-id: 0
          parent: 1
          parent-sources: none
          sources:
            - {type: table, name: orders, text: "orders"}
          columns:
            - {name: id, expression: 2}
          text: "(select id..om orders)"
        - scope-id: 1
          sources:
            - {type: subquery, name: s, scope: 0, text: "(select id.. orders) s"}
            - {type: table, name: orders, text: "orders"}
          columns:
            - {name: id, expression: 0}
            - {name: name, expression: 1}
          text: "select s.i.. s, orders"

  - name: row_field_access_hidden_by_join_alias
    catalog:
      script:
        input: create table orders (id int, product row(name text, quantity int)); create table stock (name text, quantity int);
        errors: []
    script:
      input: select (j.product).quantity, j.name from (orders o join stock s on true) as j where o.product.name is null and j.product.name is null
      catalog-id: 2
      errors:
        - {type: INVALID_FROM_CLAUSE_REFERENCE, message: 'invalid reference to FROM-clause entry for table o, use the alias j of its join', text: "o.product.name"}
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "orders o"}
        - {type: name/catalog, catalog-id: "256.65536.1:1", text: "stock s"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.1", source: "orders o", text: "j.product"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:1.0", source: "stock s", text: "j.name"}
        - {id: 2, type: colref/unresolved, text: "o.product.name"}
        - {id: 3, type: colref/catalog, catalog: "256.65536.1:0.1", source: "orders o", text: "j.product.name"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: o, text: "orders o"}
            - {type: table, name: s, text: "stock s"}
          joins:
            - name: j
              columns:
                - {name: id, table-column: "256.65536.1:0.0"}
                - {name: product, table-column: "256.65536.1:0.1"}
                - {name: name, table-column: "256.65536.1:1.0"}
                - {name: quantity, table-column: "256.65536.1:1.1"}
              text: "(orders o ..true) as j"
          clauses:
            - {sources: within, text: "true"}
          columns:
            - {name: '?', computed: true}
            - {name: name, expression: 1}
          text: "select (j...me is null"
