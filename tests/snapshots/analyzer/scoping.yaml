analyzer-snapshots:

  - name: case_unquoted_names_fold
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table "Mixed" ("Col" int, low int);
        errors: []
    script:
      input: select T.A, B from T
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "T"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "T", text: "T.A"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:0.1", source: "T", text: "B"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: t, text: "T"}
          columns:
            - {name: a, expression: 0}
            - {name: b, expression: 1}
          text: "select T.A.., B from T"

  - name: case_quoted_names_keep_case
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table "Mixed" ("Col" int, low int);
        errors: []
    script:
      input: select "Col", col, "LOW", low from "Mixed"
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:2", text: "\"Mixed\""}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:2.0", source: "\"Mixed\"", text: "\"Col\""}
        - {id: 1, type: colref/unresolved, text: "col"}
        - {id: 2, type: colref/unresolved, text: "\"LOW\""}
        - {id: 3, type: colref/catalog, catalog: "256.65536.1:2.1", source: "\"Mixed\"", text: "low"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: table, name: Mixed, text: "\"Mixed\""}
          columns:
            - {name: Col, expression: 0}
            - {name: col, expression: 1}
            - {name: LOW, expression: 2}
            - {name: low, expression: 3}
          text: "select \"Co..om \"Mixed\""

  - name: case_unquoted_does_not_match_quoted_table
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table "Mixed" ("Col" int, low int);
        errors: []
    script:
      input: select low from Mixed
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/unresolved, text: "Mixed"}
      expressions:
        - {id: 0, type: colref/unresolved, text: "low"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: unresolved, name: mixed, text: "Mixed"}
          columns:
            - {name: low, expression: 0}
          text: "select low..from Mixed"
      inferred-tables:
        - name: mixed
          confidence: confident
          columns:
            - {name: low, confidence: confident}

  - name: case_quoted_output_alias
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table "Mixed" ("Col" int, low int);
        errors: []
    script:
      input: select q."K", q.k from (select a as "K" from t) q
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "t"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "(select a .. from t) q", text: "q.\"K\""}
        - {id: 1, type: colref/unresolved, text: "q.k"}
        - {id: 2, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", text: "a"}
      name-scopes:
        - scope-id: 0
          parent: 1
          parent-sources: none
          sources:
            - {type: table, name: t, text: "t"}
          columns:
            - {name: K, expression: 2}
          text: "(select a ..K\" from t)"
        - scope-id: 1
          sources:
            - {type: subquery, name: q, scope: 0, text: "(select a .. from t) q"}
          columns:
            - {name: K, expression: 0}
            - {name: k, expression: 1}
          text: "select q.\".. from t) q"

  - name: case_quoted_cte_name
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table "Mixed" ("Col" int, low int);
        errors: []
    script:
      input: with "C" as (select 1 as x) select x from "C", c
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/cte, text: "\"C\""}
        - {type: name/unresolved, text: "c"}
      expressions:
        - {id: 0, type: colref/local, scope: 0, column: 0, source: "\"C\"", text: "x"}
        - {id: 1, type: literal/integer, is-const: true, text: "1"}
      constants:
        - {expression: 1, text: "1"}
      name-scopes:
        - scope-id: 0
          parent: 1
          parent-sources: none
          columns:
            - {name: x, expression: 1}
          text: "select 1 as x"
        - scope-id: 1
          sources:
            - {type: cte, name: C, scope: 0, text: "\"C\""}
            - {type: unresolved, name: c, text: "c"}
          columns:
            - {name: x, expression: 0}
          text: "with \"C\" a..rom \"C\", c"

  - name: case_quoted_schema_name
    catalog:
      script:
        input: create table t (a int, b int); create table s1.k (a int, b int); create table s2.k (c int); create table db1.s3.n (e int);
        errors: []
    script:
      input: select c from "S2".k, S1.K
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/unresolved, text: "\"S2\".k"}
        - {type: name/catalog, catalog-id: "256.65537.1:1", text: "S1.K"}
      expressions:
        - {id: 0, type: colref/unresolved, text: "c"}
      name-scopes:
        - scope-id: 0
          sources:
            - {type: unresolved, name: k, text: "\"S2\".k"}
            - {type: table, name: k, text: "S1.K"}
          columns:
            - {name: c, expression: 0}
          text: "select c f..2\".k, S1.K"
      inferred-tables:
        - name: S2.k
          confidence: confident
          columns:
            - {name: c, confidence: confident}

  - name: cte_shadows_catalog_table
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: with t as (select c as z from u) select z, a from t
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:1", text: "u"}
        - {type: name/cte, text: "t"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:1.1", source: "u", text: "c"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:1.1", source: "t", text: "z"}
        - {id: 2, type: colref/unresolved, text: "a"}
      name-scopes:
        - scope-id: 0
          parent: 1
          parent-sources: none
          sources:
            - {type: table, name: u, text: "u"}
          columns:
            - {name: z, expression: 0}
          text: "select c a..s z from u"
        - scope-id: 1
          sources:
            - {type: cte, name: t, scope: 0, text: "t"}
          columns:
            - {name: z, expression: 1}
            - {name: a, expression: 2}
          text: "with t as .., a from t"

  - name: cte_shadows_catalog_table_in_subquery
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: with t as (select c as z from u) select * from u where a in (select z from t)
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:1", text: "u"}
        - {type: name/cte, text: "t"}
        - {type: name/catalog, catalog-id: "256.65536.1:1", text: "u"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:1.1", source: "u", text: "c"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:1.1", source: "t", text: "z"}
        - {id: 2, type: colref/catalog, catalog: "256.65536.1:1.0", source: "u", text: "a"}
      name-scopes:
        - scope-id: 0
          parent: 2
          parent-sources: none
          sources:
            - {type: table, name: u, text: "u"}
          columns:
            - {name: z, expression: 0}
          text: "select c a..s z from u"
        - scope-id: 1
          parent: 2
          sources:
            - {type: cte, name: t, scope: 0, text: "t"}
          columns:
            - {name: z, expression: 1}
          text: "(select z from t)"
        - scope-id: 2
          sources:
            - {type: table, name: u, text: "u"}
          columns:
            - {name: a, table-column: "256.65536.1:1.0"}
            - {name: c, table-column: "256.65536.1:1.1"}
          text: "with t as .. z from t)"

  - name: cte_forward_reference
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: with c1 as (select z from c2), c2 as (select 1 as z) select z from c1
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/unresolved, text: "c2"}
        - {type: name/cte, text: "c1"}
      expressions:
        - {id: 0, type: colref/unresolved, text: "z"}
        - {id: 1, type: colref/local, scope: 0, column: 0, source: "c1", text: "z"}
        - {id: 2, type: literal/integer, is-const: true, text: "1"}
      constants:
        - {expression: 2, text: "1"}
      name-scopes:
        - scope-id: 0
          parent: 2
          parent-sources: none
          sources:
            - {type: unresolved, name: c2, text: "c2"}
          columns:
            - {name: z, expression: 0}
          text: "select z from c2"
        - scope-id: 1
          parent: 2
          parent-sources: none
          columns:
            - {name: z, expression: 2}
          text: "select 1 as z"
        - scope-id: 2
          sources:
            - {type: cte, name: c1, scope: 0, text: "c1"}
          columns:
            - {name: z, expression: 1}
          text: "with c1 as.. z from c1"
      inferred-tables:
        - name: c2
          confidence: confident
          columns:
            - {name: z, confidence: confident}

  - name: cte_self_reference_without_recursive
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: with r as (select 1 as n union all select n + 1 from r) select n from r
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/unresolved, text: "r"}
        - {type: name/cte, text: "r"}
      expressions:
        - {id: 0, type: colref/unresolved, text: "n"}
        - {id: 1, type: colref/local, scope: 2, column: 0, source: "r", text: "n"}
        - {id: 2, type: literal/integer, is-const: true, text: "1"}
        - {id: 3, type: literal/integer, is-const: true, text: "1"}
      constants:
        - {expression: 2, text: "1"}
        - {expression: 3, text: "1"}
      name-scopes:
        - scope-id: 0
          parent: 2
          columns:
            - {name: n, expression: 2}
          text: "select 1 as n"
        - scope-id: 1
          parent: 2
          sources:
            - {type: unresolved, name: r, text: "r"}
          columns:
            - {name: '?', computed: true}
          text: "select n + 1 from r"
        - scope-id: 2
          parent: 3
          parent-sources: none
          columns:
            - {name: n, expression: 2}
          text: "select 1 a..+ 1 from r"
        - scope-id: 3
          sources:
            - {type: cte, name: r, scope: 2, text: "r"}
          columns:
            - {name: n, expression: 1}
          text: "with r as ..t n from r"
      inferred-tables:
        - name: r
          confidence: confident
          columns:
            - {name: n, confidence: confident}

  - name: cte_nested_shadows_outer
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: with k as (select a from t) select s.c, s.a from (with k as (select c from u) select * from k) s
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "t"}
        - {type: name/catalog, catalog-id: "256.65536.1:1", text: "u"}
        - {type: name/cte, text: "k"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", text: "a"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:1.1", source: "(with k as.. from k) s", text: "s.c"}
        - {id: 2, type: colref/unresolved, text: "s.a"}
        - {id: 3, type: colref/catalog, catalog: "256.65536.1:1.1", source: "u", text: "c"}
      name-scopes:
        - scope-id: 0
          parent: 3
          parent-sources: none
          sources:
            - {type: table, name: t, text: "t"}
          columns:
            - {name: a, expression: 0}
          text: "select a from t"
        - scope-id: 1
          parent: 2
          parent-sources: none
          sources:
            - {type: table, name: u, text: "u"}
          columns:
            - {name: c, expression: 3}
          text: "select c from u"
        - scope-id: 2
          parent: 3
          parent-sources: none
          sources:
            - {type: cte, name: k, scope: 1, text: "k"}
          columns:
            - {name: c, expression: 3}
          text: "(with k as.. * from k)"
        - scope-id: 3
          sources:
            - {type: subquery, name: s, scope: 2, text: "(with k as.. from k) s"}
          columns:
            - {name: c, expression: 1}
            - {name: a, expression: 2}
          text: "with k as .. from k) s"

  - name: cte_recursive_with_catalog_join
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: with recursive r(n, m) as (select a, b from t union all select r.n, t.b from r join t on t.a = r.m) select n, m from r
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "t"}
        - {type: name/cte, text: "r"}
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "t"}
        - {type: name/cte, text: "r"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", text: "a"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:0.1", source: "t", text: "b"}
        - {id: 2, type: colref/catalog, catalog: "256.65536.1:0.0", source: "r", text: "r.n"}
        - {id: 3, type: colref/catalog, catalog: "256.65536.1:0.1", source: "t", text: "t.b"}
        - {id: 4, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", text: "t.a"}
        - {id: 5, type: colref/catalog, catalog: "256.65536.1:0.1", source: "r", text: "r.m"}
        - {id: 6, type: colref/catalog, catalog: "256.65536.1:0.0", source: "r", text: "n"}
        - {id: 7, type: colref/catalog, catalog: "256.65536.1:0.1", source: "r", text: "m"}
      name-scopes:
        - scope-id: 0
          parent: 2
          sources:
            - {type: table, name: t, text: "t"}
          columns:
            - {name: a, expression: 0}
            - {name: b, expression: 1}
          text: "select a, b from t"
        - scope-id: 1
          parent: 2
          sources:
            - {type: cte, name: r, scope: 2, text: "r"}
            - {type: table, name: t, text: "t"}
          columns:
            - {name: n, expression: 2}
            - {name: b, expression: 3}
          text: "select r.n.. t.a = r.m"
        - scope-id: 2
          parent: 3
          parent-sources: none
          columns:
            - {name: a, expression: 0}
            - {name: b, expression: 1}
          text: "select a, .. t.a = r.m"
        - scope-id: 3
          sources:
            - {type: cte, name: r, scope: 2, text: "r"}
          columns:
            - {name: n, expression: 6}
            - {name: m, expression: 7}
          text: "with recur.., m from r"

  - name: set_op_branches_do_not_share_tables
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: select x.a from t x union all select x.c from u
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "t x"}
        - {type: name/catalog, catalog-id: "256.65536.1:1", text: "u"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t x", text: "x.a"}
        - {id: 1, type: colref/unresolved, text: "x.c"}
      name-scopes:
        - scope-id: 0
          parent: 2
          sources:
            - {type: table, name: x, text: "t x"}
          columns:
            - {name: a, expression: 0}
          text: "select x.a from t x"
        - scope-id: 1
          parent: 2
          sources:
            - {type: table, name: u, text: "u"}
          columns:
            - {name: c, expression: 1}
          text: "select x.c from u"
        - scope-id: 2
          columns:
            - {name: a, expression: 0}
          text: "select x.a..x.c from u"

  - name: set_op_intersect_except
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: select q.a from (select a from t intersect select c from u except select id from v) q
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "t"}
        - {type: name/catalog, catalog-id: "256.65536.1:1", text: "u"}
        - {type: name/catalog, catalog-id: "256.65536.1:2", text: "v"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "(select a .. from v) q", text: "q.a"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", text: "a"}
        - {id: 2, type: colref/catalog, catalog: "256.65536.1:1.1", source: "u", text: "c"}
        - {id: 3, type: colref/catalog, catalog: "256.65536.1:2.0", source: "v", text: "id"}
      name-scopes:
        - scope-id: 0
          parent: 2
          sources:
            - {type: table, name: t, text: "t"}
          columns:
            - {name: a, expression: 1}
          text: "select a from t"
        - scope-id: 1
          parent: 2
          sources:
            - {type: table, name: u, text: "u"}
          columns:
            - {name: c, expression: 2}
          text: "select c from u"
        - scope-id: 2
          parent: 4
          columns:
            - {name: a, expression: 1}
          text: "select a f..t c from u"
        - scope-id: 3
          parent: 4
          sources:
            - {type: table, name: v, text: "v"}
          columns:
            - {name: id, expression: 3}
          text: "select id from v"
        - scope-id: 4
          parent: 5
          parent-sources: none
          columns:
            - {name: a, expression: 1}
          text: "(select a ..id from v)"
        - scope-id: 5
          sources:
            - {type: subquery, name: q, scope: 4, text: "(select a .. from v) q"}
          columns:
            - {name: a, expression: 0}
          text: "select q.a.. from v) q"

  - name: set_op_order_by_right_name
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: select a from t union select c from u order by c
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "t"}
        - {type: name/catalog, catalog-id: "256.65536.1:1", text: "u"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t", text: "a"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:1.1", source: "u", text: "c"}
        - {id: 2, type: colref/unresolved, text: "c"}
      name-scopes:
        - scope-id: 0
          parent: 2
          sources:
            - {type: table, name: t, text: "t"}
          columns:
            - {name: a, expression: 0}
          text: "select a from t"
        - scope-id: 1
          parent: 2
          sources:
            - {type: table, name: u, text: "u"}
          columns:
            - {name: c, expression: 1}
          text: "select c from u"
        - scope-id: 2
          columns:
            - {name: a, expression: 0}
          text: "select a f..order by c"

  - name: self_join_aliases
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int); create table v (id int, x int); create table w (id int, y int);
        errors: []
    script:
      input: select x.a, y.b from t x join t y on x.a = y.b where x.b > y.a
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "t x"}
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "t y"}
      expressions:
        - {id: 0, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t x", text: "x.a"}
        - {id: 1, type: colref/catalog, catalog: "256.65536.1:0.1", source: "t y", text: "y.b"}
        - {id: 2, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t x", text: "x.a"}
        - {id: 3, type: colref/catalog, catalog: "256.65536.1:0.1", source: "t y", text: "y.b"}
        - {id: 4, type: colref/catalog, catalog: "256.65536.1:0.1", source: "t x", text: "x.b"}
        - {id: 5, type: colref/catalog, catalog: "256.65536.1:0.0", source: "t y", text: "y.a"}
