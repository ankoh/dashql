planner-snapshots:

  - name: UnknownScript
    scripts:
      - name: bar
        input: |
          select * from :foo;
    expected:
      valid: false
      scripts:
        - name: bar
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "c49855075db7fc81b583c5fc1263e2ea"
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: bar
          text: ":foo"
          error: true
          message: 'unknown script or attachment :foo'
      checked-references:
        - script: bar
          references:
            - text: ":foo"
              kind: invalid
              errors:
                - 'unknown script or attachment :foo'

  - name: AmbiguousScriptName
    scripts:
      - name: Foo
        input: |
          select 1 as a;
      - name: FOO
        input: |
          select 2 as a;
      - name: bar
        input: |
          select * from :foo;
    expected:
      valid: false
      scripts:
        - name: Foo
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "2b97ce5a40e0e1614e916b5d11e7250e"
        - name: FOO
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "1ce342d7a5a3eb073b6f7151fa0a83d8"
        - name: bar
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "c49855075db7fc81b583c5fc1263e2ea"
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: bar
          text: ":foo"
          error: true
          message: 'the table parameter :foo matches Foo.sql and FOO.sql'
      checked-references:
        - script: bar
          references:
            - text: ":foo"
              kind: invalid
              errors:
                - 'the table parameter :foo matches Foo.sql and FOO.sql'
      collisions:
        - name: Foo
          members: [Foo.sql,FOO.sql]

  - name: PositionalTableParameter
    scripts:
      - name: bar
        input: |
          select * from $1;
          select * from ?;
    expected:
      valid: false
      scripts:
        - name: bar
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 1
          signature: "ad757551d494c25913978d3245f2c0ab"
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: bar
          text: "$1"
          error: true
          message: the positional table parameter $1 cannot reference a script or an attachment
        - script: bar
          text: "?"
          error: true
          message: the positional table parameter ? cannot reference a script or an attachment
      checked-references:
        - script: bar
          references:
            - text: "$1"
              kind: invalid
              errors:
                - the positional table parameter $1 cannot reference a script or an attachment
            - text: "?"
              kind: invalid
              errors:
                - the positional table parameter ? cannot reference a script or an attachment

  - name: WriteTarget
