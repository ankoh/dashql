      - name: foo
        input: |
          select 1 as a;
      - name: bar
        input: |
          insert into :foo values (1);
          delete from :foo;
    expected:
      valid: false
      scripts:
        - name: foo
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "2b97ce5a40e0e1614e916b5d11e7250e"
        - name: bar
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: false
          terminal-statement-id: 1
          signature: "b737e8c7de282d12a059043d6b2e45ca"
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: bar
          text: ":foo"
          error: true
          message: 'the table parameter :foo cannot be written'
        - script: bar
          text: ":foo"
          error: true
          message: 'the table parameter :foo cannot be written'
      checked-references:
        - script: bar
          references:
            - text: ":foo"
              kind: invalid
              errors:
                - 'the table parameter :foo cannot be written'
            - text: ":foo"
              kind: invalid
              errors:
                - 'the table parameter :foo cannot be written'

  - name: ReferenceOutsideOfQuery
    catalog: |
      create table orders (id int);
    scripts:
      - name: foo
        input: |
          select 1 as id;
      - name: bar
        input: |
          delete from orders using :foo f where f.id = orders.id;
    expected:
      valid: false
      scripts:
        - name: foo
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 2
          cacheable: true
          terminal-statement-id: 0
          signature: "d351f41eb4ba48589ac6b7eddf205129"
        - name: bar
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 2
          cacheable: false
          terminal-statement-id: 0
          signature: "f430c9f0d35690672ac32d3a86413b6c"
          references: [foo]
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: bar
          text: ":foo"
          error: true
          message: a table parameter must be part of a query
      checked-references:
        - script: bar
          references:
            - text: ":foo"
              target: foo
              kind: invalid
              errors:
                - a table parameter must be part of a query

  - name: ProducerWithoutQuery
    catalog: |
      create table orders (id int);
    scripts:
      - name: inserts
        input: |
          insert into orders values (1);
      - name: creates
        input: |
          create table t (a int);
      - name: explains
        input: |
          explain select 1;
      - name: empty
        input: |
          -- nothing
      - name: bar
        input: |
          select * from :inserts, :creates, :explains, :empty;
    expected:
      valid: false
      scripts:
        - name: inserts
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 3
          cacheable: false
          terminal-statement-id: 0
          signature: "6e951484ca1929c6aee2e6e42192eba3"
        - name: creates
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 3
          cacheable: false
          terminal-statement-id: 0
          signature: "528960889b61828d8aca92dacac02052"
        - name: explains
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 3
          cacheable: true
          terminal-statement-id: 0
          signature: "88b371787131afba550d3b57efae4e4f"
        - name: empty
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 3
          cacheable: false
          signature: "4ff54522f5e63f49b36512ebe63f35e9"
        - name: bar
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 3
          cacheable: true
          terminal-statement-id: 0
          signature: "88d381589227a020a145df8ed313fc7d"
          references: [inserts,creates,explains,empty]
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: bar
          text: ":inserts"
          error: true
          message: inserts.sql is no single SELECT that bar.sql could read
        - script: bar
          text: ":creates"
          error: true
          message: creates.sql is no single SELECT that bar.sql could read
        - script: bar
          text: ":explains"
          error: true
          message: explains.sql is no single SELECT that bar.sql could read
        - script: bar
          text: ":empty"
          error: true
          message: empty.sql is no single SELECT that bar.sql could read
      checked-references:
        - script: bar
          references:
            - text: ":inserts"
              target: inserts
              kind: invalid
              errors:
                - inserts.sql is no single SELECT that bar.sql could read
            - text: ":creates"
              target: creates
              kind: invalid
              errors:
                - creates.sql is no single SELECT that bar.sql could read
            - text: ":explains"
              target: explains
              kind: invalid
              errors:
                - explains.sql is no single SELECT that bar.sql could read
            - text: ":empty"
              target: empty
              kind: invalid
              errors:
                - empty.sql is no single SELECT that bar.sql could read

  - name: ProducerWithSyntaxErrors
    scripts:
      - name: foo
        input: |
          select from where;
      - name: bar
        input: |
          select * from :foo;
    expected:
      valid: false
      scripts:
        - name: foo
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: false
        - name: bar
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "c49855075db7fc81b583c5fc1263e2ea"
          references: [foo]
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: foo
          error: true
          message: 'parser: expected a table reference after FROM'
        - script: foo
          error: true
          message: 'unsupported SQL: parser produced no statements'
      checked-references:
        - script: bar
          references:
            - text: ":foo"
              target: foo
              kind: invalid
              errors:
                - foo.sql is no single SELECT that bar.sql could read

  - name: SelfReference
    scripts:
      - name: foo
        input: |
          select * from :foo;
    expected:
      valid: false
      scripts:
        - name: foo
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "c49855075db7fc81b583c5fc1263e2ea"
          references: [foo]
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: foo
          text: ":foo"
          error: true
          message: 'cyclic script reference: foo.sql -> foo.sql'
      checked-references:
        - script: foo
          references:
            - text: ":foo"
              target: foo
              kind: invalid
              errors:
                - 'cyclic script reference: foo.sql -> foo.sql'

  - name: Cycles
    scripts:
      - name: a
        input: |
          select * from :b;
      - name: b
        input: |
          select * from :a;
      - name: c
        input: |
          select * from :d;
      - name: d
        input: |
          select * from :e;
      - name: e
        input: |
          select * from :c;
    expected:
      valid: false
      scripts:
        - name: a
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "8dc8fd7c74a6d54c5759e87add9efa85"
          references: [b]
        - name: b
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "d707c1b1e498fdfd02945599120780da"
          references: [a]
        - name: c
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "7674a16d7e61eaa542d008f8de54ae32"
          references: [d]
        - name: d
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "ab038f327115b691e9f893334b71b64e"
          references: [e]
        - name: e
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "7cea0540a80a076ef038f1d72b2a5757"
          references: [c]
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: b
          text: ":a"
          error: true
          message: 'cyclic script reference: a.sql -> b.sql -> a.sql'
        - script: e
          text: ":c"
          error: true
          message: 'cyclic script reference: c.sql -> d.sql -> e.sql -> c.sql'
      checked-references:
        - script: a
          references:
            - text: ":b"
              target: b
              kind: inline
        - script: b
          references:
            - text: ":a"
              target: a
              kind: invalid
              errors:
                - 'cyclic script reference: a.sql -> b.sql -> a.sql'
        - script: c
          references:
            - text: ":d"
              target: d
              kind: inline
        - script: d
          references:
            - text: ":e"
              target: e
              kind: inline
        - script: e
          references:
            - text: ":c"
              target: c
              kind: invalid
              errors:
                - 'cyclic script reference: c.sql -> d.sql -> e.sql -> c.sql'

  - name: ProducerOfSeveralStatements
    scripts:
      - name: foo
        input: |
          create table t (a int);
          select a from t;
      - name: two
        input: |
          select 1 as a;
          select 2 as a;
      - name: bar
        input: |
          select * from :foo, :two;
    expected:
      valid: false
      scripts:
        - name: foo
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 2
