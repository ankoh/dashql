planner-snapshots:

  - name: UnknownScript
    scripts:
      - name: bar
        input: |
          select * from :foo;
    expected:
      valid: false
      scripts:
        - name: bar
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "a47b0a7bbff4fc2c3f2f25de44942c990b4d596bee4c3273f5786145f98400de"
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: bar
          text: ":foo"
          error: true
          message: 'unknown script or attachment :foo'
      checked-references:
        - script: bar
          references:
            - text: ":foo"
              kind: invalid
              errors:
                - 'unknown script or attachment :foo'

  - name: AmbiguousScriptName
    scripts:
      - name: Foo
        input: |
          select 1 as a;
      - name: FOO
        input: |
          select 2 as a;
      - name: bar
        input: |
          select * from :foo;
    expected:
      valid: false
      scripts:
        - name: Foo
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "8b3c7bdf652fc96552d8eb2f33530d1c8687865ed525fe22728a23cda4050625"
        - name: FOO
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "a59c95413432d1231bf4718e6788c5089971307b709fdaa7248ed168fcd5e944"
        - name: bar
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "a47b0a7bbff4fc2c3f2f25de44942c990b4d596bee4c3273f5786145f98400de"
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: bar
          text: ":foo"
          error: true
          message: 'the table parameter :foo matches Foo.sql and FOO.sql'
      checked-references:
        - script: bar
          references:
            - text: ":foo"
              kind: invalid
              errors:
                - 'the table parameter :foo matches Foo.sql and FOO.sql'
      collisions:
        - name: Foo
          members: [Foo.sql,FOO.sql]

  - name: PositionalTableParameter
    scripts:
      - name: bar
        input: |
          select * from $1;
          select * from ?;
    expected:
      valid: false
      scripts:
        - name: bar
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 1
