      - name: foo
        input: |
          select from where;
      - name: bar
        input: |
          select * from :foo;
    expected:
      valid: false
      scripts:
        - name: foo
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: false
        - name: bar
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "a47b0a7bbff4fc2c3f2f25de44942c990b4d596bee4c3273f5786145f98400de"
          references: [foo]
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: foo
          error: true
          message: 'parser: expected a table reference after FROM'
        - script: foo
          error: true
          message: 'unsupported SQL: parser produced no statements'
      checked-references:
        - script: bar
          references:
            - text: ":foo"
              target: foo
              kind: invalid
              errors:
                - foo.sql is no single SELECT that bar.sql could read

