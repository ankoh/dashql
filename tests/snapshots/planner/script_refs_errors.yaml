planner-snapshots:

  - name: UnknownScript
    scripts:
      - name: bar
        input: |
          select * from :foo;
    expected:
      valid: false
      scripts:
        - name: bar
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "e5aa29865d581c7c5bc3ae389f15aced"
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: bar
          text: ":foo"
          error: true
          message: 'unknown script or attachment :foo'
      checked-references:
        - script: bar
          references:
            - text: ":foo"
              kind: invalid
              errors:
                - 'unknown script or attachment :foo'

  - name: AmbiguousScriptName
    scripts:
      - name: Foo
        input: |
          select 1 as a;
      - name: FOO
        input: |
          select 2 as a;
      - name: bar
        input: |
          select * from :foo;
    expected:
      valid: false
      scripts:
        - name: Foo
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "5102107ecd8798ce196f51a3f722854f"
        - name: FOO
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "1556f6d4e439da279b77e220bdf7a310"
        - name: bar
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "e5aa29865d581c7c5bc3ae389f15aced"
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: bar
          text: ":foo"
          error: true
          message: 'the table parameter :foo matches Foo.sql and FOO.sql'
      checked-references:
        - script: bar
          references:
            - text: ":foo"
              kind: invalid
              errors:
                - 'the table parameter :foo matches Foo.sql and FOO.sql'
      collisions:
        - name: Foo
          members: [Foo.sql,FOO.sql]

  - name: PositionalTableParameter
    scripts:
      - name: bar
        input: |
          select * from $1;
          select * from ?;
    expected:
      valid: false
      scripts:
        - name: bar
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 1
          signature: "4bd8d7bf521b14a08bb77e4d98a6e07c"
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: bar
          text: "$1"
          error: true
          message: the positional table parameter $1 cannot reference a script or an attachment
        - script: bar
          text: "?"
          error: true
          message: the positional table parameter ? cannot reference a script or an attachment
      checked-references:
        - script: bar
          references:
            - text: "$1"
              kind: invalid
              errors:
                - the positional table parameter $1 cannot reference a script or an attachment
            - text: "?"
              kind: invalid
              errors:
                - the positional table parameter ? cannot reference a script or an attachment

  - name: WriteTarget
    scripts:
      - name: foo
        input: |
          select 1 as a;
      - name: bar
        input: |
          insert into :foo values (1);
          delete from :foo;
    expected:
      valid: false
      scripts:
        - name: foo
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "5102107ecd8798ce196f51a3f722854f"
        - name: bar
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: false
          terminal-statement-id: 1
          signature: "4b549ce5225d3b72a07c83ef7215099e"
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: bar
          text: ":foo"
          error: true
          message: 'the table parameter :foo cannot be written'
        - script: bar
          text: ":foo"
          error: true
          message: 'the table parameter :foo cannot be written'
      checked-references:
        - script: bar
          references:
            - text: ":foo"
              kind: invalid
              errors:
                - 'the table parameter :foo cannot be written'
            - text: ":foo"
              kind: invalid
              errors:
                - 'the table parameter :foo cannot be written'

  - name: ReferenceOutsideOfQuery
    catalog: |
      create table orders (id int);
    scripts:
      - name: foo
        input: |
          select 1 as id;
      - name: bar
        input: |
          delete from orders using :foo f where f.id = orders.id;
    expected:
      valid: false
      scripts:
        - name: foo
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 2
          cacheable: true
          terminal-statement-id: 0
          signature: "2f44cef39f1b3bb05cecc93f4fb46591"
        - name: bar
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 2
          cacheable: false
          terminal-statement-id: 0
          signature: "2a2a53787e1fd04765fd18ff111838e0"
          references: [foo]
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: bar
          text: ":foo"
          error: true
          message: a table parameter must be part of a query
      checked-references:
        - script: bar
          references:
            - text: ":foo"
              target: foo
              kind: invalid
              errors:
                - a table parameter must be part of a query

  - name: ProducerWithoutQuery
    catalog: |
      create table orders (id int);
    scripts:
      - name: inserts
        input: |
          insert into orders values (1);
      - name: creates
        input: |
          create table t (a int);
      - name: explains
        input: |
          explain select 1;
      - name: empty
        input: |
          -- nothing
      - name: bar
        input: |
          select * from :inserts, :creates, :explains, :empty;
    expected:
      valid: false
      scripts:
        - name: inserts
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 3
          cacheable: false
          terminal-statement-id: 0
          signature: "bfc312555722470ab2ac1f970d3c364b"
        - name: creates
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 3
          cacheable: false
          terminal-statement-id: 0
          signature: "d5b516a8db7c8355697b0c90a1fbc11e"
        - name: explains
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 3
          cacheable: true
          terminal-statement-id: 0
          signature: "d7286521cdf5078a0ce8ea0c44e6722f"
        - name: empty
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 3
          cacheable: false
          signature: "5ca4284d7335a9ac761ff51ebc5e2566"
        - name: bar
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 3
          cacheable: true
          terminal-statement-id: 0
          signature: "e989c89a6f8774ce1834605c5a8bed03"
          references: [inserts,creates,explains,empty]
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: bar
          text: ":inserts"
          error: true
          message: inserts.sql is no single SELECT that bar.sql could read
        - script: bar
          text: ":creates"
          error: true
          message: creates.sql is no single SELECT that bar.sql could read
        - script: bar
          text: ":explains"
          error: true
          message: explains.sql is no single SELECT that bar.sql could read
        - script: bar
          text: ":empty"
          error: true
          message: empty.sql is no single SELECT that bar.sql could read
      checked-references:
        - script: bar
          references:
            - text: ":inserts"
              target: inserts
              kind: invalid
              errors:
                - inserts.sql is no single SELECT that bar.sql could read
            - text: ":creates"
              target: creates
              kind: invalid
              errors:
                - creates.sql is no single SELECT that bar.sql could read
            - text: ":explains"
              target: explains
              kind: invalid
              errors:
                - explains.sql is no single SELECT that bar.sql could read
            - text: ":empty"
              target: empty
              kind: invalid
              errors:
                - empty.sql is no single SELECT that bar.sql could read

  - name: ProducerWithSyntaxErrors
    scripts:
      - name: foo
        input: |
          select from where;
      - name: bar
        input: |
          select * from :foo;
    expected:
      valid: false
      scripts:
        - name: foo
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: false
        - name: bar
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "e5aa29865d581c7c5bc3ae389f15aced"
          references: [foo]
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: foo
          error: true
          message: 'parser: expected a table reference after FROM'
        - script: foo
          error: true
          message: 'unsupported SQL: parser produced no statements'
      checked-references:
        - script: bar
          references:
            - text: ":foo"
              target: foo
              kind: invalid
              errors:
                - foo.sql is no single SELECT that bar.sql could read

  - name: SelfReference
    scripts:
      - name: foo
        input: |
          select * from :foo;
    expected:
      valid: false
      scripts:
        - name: foo
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "e5aa29865d581c7c5bc3ae389f15aced"
          references: [foo]
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: foo
          text: ":foo"
          error: true
          message: 'cyclic script reference: foo.sql -> foo.sql'
      checked-references:
        - script: foo
          references:
            - text: ":foo"
              target: foo
              kind: invalid
              errors:
                - 'cyclic script reference: foo.sql -> foo.sql'

  - name: Cycles
    scripts:
      - name: a
        input: |
          select * from :b;
      - name: b
        input: |
          select * from :a;
      - name: c
        input: |
          select * from :d;
      - name: d
        input: |
          select * from :e;
      - name: e
        input: |
          select * from :c;
    expected:
      valid: false
      scripts:
        - name: a
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "edc8e50baba7a5c4bf2c3ad7877a8091"
          references: [b]
        - name: b
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "23451ec3f5516377f1bd481c2501b7e0"
          references: [a]
        - name: c
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "02b9e6ffcc4bea0bfacc8bc2ec455bec"
          references: [d]
        - name: d
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "29f2e01de6f56ccd5410548f84208f8e"
          references: [e]
        - name: e
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          cacheable: true
          terminal-statement-id: 0
          signature: "9abf1c1aa1eee16822820484fd9e6d69"
          references: [c]
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: b
          text: ":a"
          error: true
          message: 'cyclic script reference: a.sql -> b.sql -> a.sql'
        - script: e
          text: ":c"
          error: true
          message: 'cyclic script reference: c.sql -> d.sql -> e.sql -> c.sql'
      checked-references:
        - script: a
          references:
            - text: ":b"
              target: b
              kind: inline
        - script: b
          references:
            - text: ":a"
              target: a
              kind: invalid
              errors:
                - 'cyclic script reference: a.sql -> b.sql -> a.sql'
        - script: c
          references:
            - text: ":d"
              target: d
              kind: inline
        - script: d
          references:
            - text: ":e"
              target: e
              kind: inline
        - script: e
          references:
            - text: ":c"
              target: c
              kind: invalid
              errors:
                - 'cyclic script reference: c.sql -> d.sql -> e.sql -> c.sql'

  - name: ProducerOfSeveralStatements
    scripts:
      - name: foo
        input: |
          create table t (a int);
          select a from t;
      - name: two
        input: |
          select 1 as a;
          select 2 as a;
      - name: bar
        input: |
          select * from :foo, :two;
    expected:
      valid: false
      scripts:
        - name: foo
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 2
          cacheable: false
          terminal-statement-id: 1
          signature: "cdb9ce83783931175dba8727e2a35ec1"
        - name: two
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 2
          cacheable: true
          terminal-statement-id: 1
          signature: "309db407905b0d11a2f3e744f99d6453"
        - name: bar
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 2
          cacheable: true
          terminal-statement-id: 0
          signature: "17f2365ebabca889e7f6fb46dc6f8d22"
          references: [foo,two]
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: bar
          text: ":foo"
          error: true
          message: foo.sql is no single SELECT that bar.sql could read
        - script: bar
          text: ":two"
          error: true
          message: two.sql is no single SELECT that bar.sql could read
      checked-references:
        - script: bar
          references:
            - text: ":foo"
              target: foo
              kind: invalid
              errors:
                - foo.sql is no single SELECT that bar.sql could read
            - text: ":two"
              target: two
              kind: invalid
              errors:
                - two.sql is no single SELECT that bar.sql could read
