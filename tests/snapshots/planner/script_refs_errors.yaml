  - name: ReferenceOutsideOfQuery
    catalog: |
      create table orders (id int);
    scripts:
      - name: foo
        input: |
          select 1 as id;
      - name: bar
        input: |
          delete from orders using :foo f where f.id = orders.id;
    expected:
      valid: false
      scripts:
        - name: foo
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 2
          cacheable: true
          terminal-statement-id: 0
          signature: "374d193f63e23244ced8352c64546ead61442167383db49dc645386515afb8ec"
        - name: bar
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 2
          cacheable: false
          terminal-statement-id: 0
          signature: "97a8b55718fb7485a1fae86c57fe185808a42c431f767a31d83a8f95c732ff3d"
          references: [foo]
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: bar
          text: ":foo"
          error: true
          message: a table parameter must be part of a query
      checked-references:
        - script: bar
          references:
            - text: ":foo"
              target: foo
              kind: invalid
              errors:
                - a table parameter must be part of a query

