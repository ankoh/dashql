planner-snapshots:
  # A query reads the result of a script of the same connection as common table expression
  - name: InlinePlain
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id, amount from orders where amount > 10;
      - name: bar
        input: |
          select count(*) from :foo;

  # The alias of the table parameter names the common table expression
  - name: InlineAlias
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id, amount from orders;
      - name: bar
        input: |
          select f.id from :foo f where f.amount > 1;

  # Without alias, columns are qualified with the script name
  - name: InlineQualifiedColumns
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id, amount from orders;
      - name: bar
        input: |
          select foo.id from :foo where foo.amount > 1;

  # The script goes before the common table expressions of the statement
  - name: InlineIntoWith
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id, amount from orders;
      - name: bar
        input: |
          with big as (select * from :foo where amount > 10) select count(*) from big;

  # A recursive WITH takes the script as first, non-recursive common table expression
  - name: InlineIntoWithRecursive
    scripts:
      - name: seeds
        input: |
          select 1 as n;
      - name: bar
        input: |
          with recursive r(n) as (select n from :seeds union all select n + 1 from r where n < 3) select * from r;

  # INSERT ... SELECT takes the common table expression in its query
  - name: InlineInsertSelect
    catalog: |
      create table orders (id int, amount int);
      create table archive (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id, amount from orders;
      - name: bar
        input: |
          insert into archive select * from :foo;

  # CREATE TABLE AS takes the common table expression in its query
  - name: InlineCreateTableAs
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id, amount from orders;
      - name: bar
        input: |
          create table snapshot as select * from :foo;

  # SELECT INTO takes the common table expression in front of the statement. Hyper rejects SELECT INTO as deprecated.
  - name: InlineSelectInto
    hyper: skip
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id, amount from orders;
      - name: bar
        input: |
          select * into snapshot from :foo;

  # EXPLAIN takes the common table expression in its query
  - name: InlineExplain
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id, amount from orders;
      - name: bar
        input: |
          explain select * from :foo;

  # References in subqueries take the common table expression in the outermost query
  - name: InlineSubqueries
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id from orders where amount > 10;
      - name: bar
        input: |
          select * from orders where id in (select id from :foo) and exists (select 1 from :foo f where f.id = orders.id) and (select count(*) from :foo) > 0;

  # A reference in a subquery of a DELETE takes the common table expression in the subquery
  - name: InlineDeleteSubquery
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id from orders where amount > 10;
      - name: bar
        input: |
          delete from orders where id in (select id from :foo);

  # Two statements with references have a common table expression each
  - name: InlineTwoStatements
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id, amount from orders;
      - name: bar
        input: |
          select count(*) from :foo;
          select sum(amount) from :foo;

  # A chain: the references of an inlined query become common table expressions of the statement
  - name: InlineChain
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: a
        input: |
          select id, amount from orders;
      - name: b
        input: |
          select * from :a where amount > 1;
      - name: c
        input: |
          select count(*) from :b;

  # A diamond: every script is one common table expression, after the scripts it references
  - name: InlineDiamond
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: base
        input: |
          select id, amount from orders;
      - name: small
        input: |
          select * from :base where amount < 10;
      - name: large
        input: |
          select * from :base where amount >= 10;
      - name: report
        input: |
          select (select count(*) from :small) as s, (select count(*) from :large) as l;

  # A script with its own common table expressions stays one query
  - name: InlineProducerWithCtes
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          with o as (select * from orders) select id from o;
      - name: bar
        input: |
          select * from :foo;

  # A line comment at the end of the referenced query does not swallow the closing parenthesis
  - name: InlineProducerTrailingComment
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id from orders -- the large ones
          where amount > 10;
      - name: bar
        input: |
          select * from :foo;

  # The statement reads the relations of the inlined query, it runs after the script that writes them
  - name: InlineProducerOfTable
    scripts:
      - name: setup
        input: |
          create table t (a int);
          insert into t values (1);
      - name: foo
        input: |
          select a from t;
      - name: bar
        input: |
          select * from :foo;

  # A query of a script below its reference is inlined all the same
  - name: InlineProducerBelow
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: bar
        input: |
          select count(*) from :foo;
      - name: foo
        input: |
          select id from orders;

  # Script names that are no plain identifiers are quoted
  - name: InlineQuotedNames
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: brave_otter-2
        input: |
          select id from orders;
      - name: Mixed Case
        input: |
          select id from orders;
      - name: bar
        input: |
          select * from :"brave_otter-2" a, :"Mixed Case" b where a.id = b.id;

  # A name that differs in case only references the script
  - name: InlineCaseInsensitiveName
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: Foo
        input: |
          select id from orders;
      - name: bar
        input: |
          select * from :foo f;

  # A relation or common table expression of the same name is not shadowed, the script gets another name
  - name: InlineNameCollisions
    catalog: |
      create table foo (id int);
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id from orders;
      - name: bar
        input: |
          select * from :foo f join foo using (id);
      - name: baz
        input: |
          with foo_2 as (select 1 as id) select * from :foo f join foo_2 using (id);
      - name: qux
        input: |
          select * from :foo;

  # A renamed common table expression keeps no alias that the statement reads as relation
  - name: InlineRenamedWithoutAlias
    catalog: |
      create table foo (id int);
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id from orders;
      - name: bar
        input: |
          select * from :foo join foo using (id);

  # A relation of an inlined query must not resolve to a common table expression that the statement defines there
  - name: InlineShadowedByCte
    catalog: |
      create table orders (id int, amount int);
      create table t (id int);
    scripts:
      - name: foo
        input: |
          select id from orders;
      # A WITH that is not recursive comes after the inlined query, the inlined query reads the table
      - name: plain
        input: |
          with orders as (select 1 as id) select * from orders, :foo f;
      # The inlined query would see a recursive common table expression of the same name
      - name: recursive
        input: |
          with recursive orders(id) as (select 1 union all select id + 1 from orders where id < 3) select * from orders, :foo f;
      # The inlined query would see the common table expressions of an INSERT around it
      - name: inserts
        input: |
          with orders as (select 1 as id) insert into t select id from :foo;

  # A query with @vis tags keeps its visualization
  - name: InlineVisualization
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id, amount from orders;
      - name: bar
        input: |
          /* @vis table */
          select * from :foo;

  # The statement reads the relations of the inlined query, it runs after their writers
  - name: InlineAccesses
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: load
        input: |
          insert into orders values (1, 10);
      - name: foo
        input: |
          select id, amount from orders;
      - name: bar
        input: |
          select count(*) from :foo;

  # A scalar parameter is no script reference, it is an input, without a value it fails the plan
  - name: ScalarParameter
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id from orders;
      - name: bar
        input: |
          select * from orders where amount > :foo;

  # References in subqueries of an UPDATE take the common table expressions in the subqueries
  - name: InlineUpdateSubquery
    catalog: |
      create table t (a int, b int);
    scripts:
      - name: foo
        input: |
          select a, b from t where b > 1;
      - name: bar
        input: |
          update t set b = (select max(b) from :foo) where a in (select a from :foo);

  # A reference in the source query of a MERGE takes the common table expression in the query
  - name: InlineMergeSourceSubquery
    hyper: skip
    catalog: |
      create table t (a int, b int);
      create table u (a int, c int);
    scripts:
      - name: foo
        input: |
          select a, c from u where c > 0;
      - name: bar
        input: |
          merge into t using (select * from :foo) s on s.a = t.a when matched then update set b = s.c;

  # The branches of a set operation share the common table expressions before it
  - name: InlineUnion
    catalog: |
      create table t (a int);
    scripts:
      - name: foo
        input: |
          select a from t where a > 1;
      - name: bar
        input: |
          select a from t where a < 0;
      - name: both
        input: |
          select a from :foo union all select a from :bar;

  # A reference in a LATERAL subquery goes into the outermost SELECT
  - name: InlineLateral
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id, amount from orders where amount > 10;
      - name: bar
        input: |
          select o.id, x.amount from orders o, lateral (select f.amount from :foo f where f.id = o.id) x;

  # Two references to one script are one common table expression
  - name: InlineSameScriptTwice
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id, amount from orders;
      - name: bar
        input: |
          select * from :foo a join :foo b using (id);

  # A CREATE VIEW inlines the query, the view reads the relations of the query
  - name: InlineIntoView
    hyper: skip
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id, amount from orders;
      - name: bar
        input: |
          create view big as select * from :foo where amount > 10;
          select * from big;

  # An INSERT that reads its own target through an inlined query has one WRITE access and no self edge
  - name: InlineIntoInsertOwnTarget
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id + 100 as id, amount from orders;
      - name: bar
        input: |
          insert into orders select * from :foo;
          select count(*) from orders;

  # The inherited reads of two consumers take part in the timeline: one before a write and one after it
  - name: InlinedReadsAroundWriter
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id, amount from orders;
      - name: early
        input: |
          select count(*) from :foo;
      - name: load
        input: |
          insert into orders values (1, 10);
      - name: late
        input: |
          select count(*) from :foo;

  # A view that the inlined query reads is a READ of the consumer but no barrier of it
  - name: InlinedReadOfView
    hyper: skip
    catalog: |
      create table base (id int);
      create view v as select * from base;
    scripts:
      - name: foo
        input: |
          select id from v;
      - name: bar
        input: |
          select count(*) from :foo;

  # A dropped table that the inlined query reads is not diagnosed in the consumer
  - name: InlinedReadOfDroppedTable
    hyper: skip
    catalog: |
      create table t (id int);
    scripts:
      - name: foo
        input: |
          select id from t;
      - name: dropper
        input: |
          drop table t;
      - name: bar
        input: |
          select count(*) from :foo;

  # A table function of the inlined query is no access of the consumer
  - name: InlinedTableFunction
    scripts:
      - name: foo
        input: |
          select * from generate_series(1, 3) s(x);
      - name: bar
        input: |
          select count(*) from :foo;

  # An unresolved relation of the inlined query makes the consumer a barrier
  - name: InlinedUnresolvedRelation
    hyper: skip
    scripts:
      - name: foo
        input: |
          select * from missing;
      - name: bar
        input: |
          select 1;
          select count(*) from :foo;
          select 2;

  # An inlined query below its consumer reads a table that a script between them creates: the consumer reads it
  # before the CREATE, without a diagnostic
  - name: InlinedReadOfLaterProducer
    hyper: skip
    scripts:
      - name: bar
        input: |
          select count(*) from :foo;
      - name: baz
        input: |
          create table t (x int);
      - name: foo
        input: |
          select * from t;

  # A VALUES statement is a query that a reference inlines
  - name: InlineValuesProducer
    scripts:
      - name: foo
        input: |
          values (1), (2);
      - name: bar
        input: |
          select * from :foo;

  # Empty statements don't count, the referenced script is a single SELECT
  - name: ProducerWithEmptyStatements
    scripts:
      - name: foo
        input: |
          ;
          select 1 as a;;
      - name: bar
        input: |
          select * from :foo;

  # References in the select list of a query without FROM take the common table expression at the statement start
  - name: InlineSelectWithoutFrom
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id from orders;
      - name: bar
        input: |
          select (select count(*) from :foo) as n, (select max(id) from :foo) as m;

  # References in a subquery of a JOIN condition and of HAVING go into the outermost SELECT
  - name: InlineInJoinConditionAndHaving
    catalog: |
      create table orders (id int, amount int);
      create table regions (rid int, name text);
    scripts:
      - name: foo
        input: |
          select id from orders where amount > 10;
      - name: bar
        input: |
          select r.name, count(*) from orders o join regions r on r.rid = o.id and o.id in (select id from :foo) group by r.name having count(*) < (select count(*) from :foo);

  # A reference in the WITH of a subquery goes into the outermost SELECT, the WITH of the subquery reads it
  - name: InlineInWithOfSubquery
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id from orders;
      - name: bar
        input: |
          select * from (with y as (select * from :foo) select * from y) z;

  # INSERT ... VALUES takes the common table expression before VALUES. Hyper rejects subqueries in VALUES.
  - name: InlineInsertValues
    hyper: skip
    catalog: |
      create table orders (id int, amount int);
      create table counts (n bigint);
    scripts:
      - name: foo
        input: |
          select id from orders;
      - name: bar
        input: |
          insert into counts values ((select count(*) from :foo));

  # An INSERT with a WITH of its own keeps it, the common table expression goes into the query of the INSERT
  - name: InlineInsertWithOwnWith
    catalog: |
      create table orders (id int, amount int);
      create table ids (id int);
    scripts:
      - name: foo
        input: |
          select id from orders;
      - name: bar
        input: |
          with w as (select 1 as id) insert into ids select id from :foo union all select id from w;

  # CREATE TABLE AS with a WITH of its own: the script goes before the common table expressions of the query
  - name: InlineCreateTableAsWithOwnWith
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id from orders;
      - name: bar
        input: |
          create table t as with w as (select 1 as id) select f.id from :foo f, w where f.id = w.id;

  # A set operation of parenthesized queries takes the common table expressions before its first parenthesis
  - name: InlineParenthesizedSetOperation
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          select id from orders;
      - name: baz
        input: |
          select amount as id from orders;
      - name: bar
        input: |
          (select id from :foo) union all (select id from :baz);

  # A chain of inline references into an INSERT of the table that the chain reads: one WRITE access, the reads of the
  # chain are ordered before it, a later reader of the chain after it
  - name: InlineChainIntoWriteOfItsTable
    catalog: |
      create table t (a int);
    scripts:
      - name: base
        input: |
          select a from t;
      - name: mid
        input: |
          select a + 1 as a from :base;
      - name: write
        input: |
          insert into t select a from :mid;
      - name: read
        input: |
          select count(*) from :mid;
