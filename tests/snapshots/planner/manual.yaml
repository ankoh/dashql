  - name: ManualAcrossConnections
    connections:
      - name: trino
        kind: REMOTE
        catalog: |
          create table orders (id int, region text, amount int);
      - name: local
        kind: LOCAL
    scripts:
      - name: orders_all
        connection: trino
        input: |
          /* @manual */
          select id, region, amount from orders;
      - name: west
        connection: local
        input: |
          select sum(amount) from :orders_all where region = 'west';
    targets: [west]
    expected:
      valid: false
      connections:
        - name: trino
          kind: REMOTE
        - name: local
          kind: LOCAL
      scripts:
        - name: orders_all
          connection: trino
          text-version: 1
          analyzed-text-version: 1
          analyzed-catalog-revision: 2
          target: false
          cacheable: true
          terminal-statement-id: 0
          signature: "dcae810a1955b0bbc2e23e7fb8682ae423ac2f702377003d6a8f206d0c5f86dd"
        - name: west
          connection: local
