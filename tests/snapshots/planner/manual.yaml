          analyzed-text-version: 1
          analyzed-catalog-revision: 1
          target: true
          cacheable: true
          terminal-statement-id: 0
          signature: "07e7f98d45ede5a24a677be5e31881bc9be51db5bfbd39a9276dd62077a4fb0f"
          references: [orders_all]
      entities: []
      unresolved-references: []
      nodes: []
      edges: []
      diagnostics:
        - script: west
          text: ":orders_all"
          error: true
          message: 'orders_all.sql runs only on request (@manual), the scripts of the connection trino inline it but west.sql of the connection local cannot read it'
      checked-references:
