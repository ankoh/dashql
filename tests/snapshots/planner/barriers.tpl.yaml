planner-snapshots:
  # An analyzer error in a statement is a barrier
  - name: AnalyzerErrorBarrier
    catalog: |
      create table t (a int, b int);
      create table u (a int, c int);
    scripts:
      - name: queries
        input: |
          select 1;
          select a from t, u;
          select b from t;

  # A table function is not a supported table source
  - name: TableFunctionSource
    scripts:
      - name: queries
        input: |
          select * from generate_series(1, 3);
          select 1;

  # A table name that resolves in two schemas is ambiguous
  - name: AmbiguousRelation
    catalog: |
      create table s1.t (a int);
      create table s2.t (a int);
    scripts:
      - name: queries
        input: |
          select * from t;
          select 1;

  # A DROP of a name that resolves to two tables is ambiguous
  - name: AmbiguousDropTarget
    catalog: |
      create table s1.t (a int);
      create table s2.t (a int);
    scripts:
      - name: queries
        input: |
          drop table t;
          select 1;

  # Reading a relation after it was dropped without a producer cannot be reordered
  - name: ReadAfterDrop
    catalog: |
      create table a (id int);
    scripts:
      - name: queries
        input: |
          drop table a;
          select * from a;

  # Table aliases and derived tables
  - name: AliasesAndDerivedTables
    catalog: |
      create table a (id int);
      create table b (id int);
    scripts:
      - name: queries
        input: |
          select x.id from a x join b y on x.id = y.id;
          select s.id from (select id from a) s;
          select * from a, a as a2;

  # The same name as table in one script and as view in another
  - name: TableAndViewKinds
    catalog: |
      create table base (id int);
    scripts:
      - name: table_producer
        input: create table shared as select * from base;
      - name: view_producer
        input: create view shared as select * from base;
      - name: consumer
        input: select * from shared;

  # Queries with @vis tags of every renderer
  - name: VisualizationRenderers
    catalog: |
      create table sales (category text, revenue int);
    scripts:
      - name: queries
        input: |
          /* @vis vegalite {"mark": "bar", "encoding": {"x": {"field": "category"}, "y": {"field": "revenue"}}} */
          select category, revenue from sales;
          /* @vis table
             @board row=0 column=0 width=6 height=2 */
          select category, revenue from sales;
          /* @vis markdown {{category}} */
          select category from sales;

  # EXPLAIN without a body
  - name: ExplainWithoutBody
    scripts:
      - name: queries
        input: |
          explain;
          select 1;

  # EXPLAIN of expressions and options
  - name: ExplainOptions
    catalog: |
      create table a (id int);
    scripts:
      - name: queries
        input: |
          explain (analyze, verbose) select * from a;
          explain (costs off) select 1;
          explain select * from a where id = 1;

  # EXPLAIN ANALYZE without parentheses and FORMAT ANALYZE run their statement like EXPLAIN (ANALYZE)
  - name: ExplainAnalyzeKeyword
    catalog: |
      create table a (id int);
    scripts:
      - name: queries
        input: |
          explain analyze insert into a values (1);
          explain (analyze) insert into a values (2);
          explain (format analyze) create table x as select 1;

  # DDL statements on unresolved targets
  - name: DdlOnUnresolvedTargets
    scripts:
      - name: queries
        input: |
          create table x (a int);
          create view y as select * from x;
          drop view y;
          drop table x;
          select 1;

  # INSERT, DELETE and CTAS in the same script
  - name: WriteSequence
    catalog: |
      create table a (id int);
      create table b (id int);
    scripts:
      - name: writes
        input: |
          insert into a values (1);
          insert into b select * from a;
          delete from a where id = 1;
          create table c as select * from b;
          select * from c;

  # Several scripts reading and writing the same table
  - name: CrossScriptWriters
    catalog: |
      create table a (id int);
    scripts:
      - name: first
        input: |
          insert into a values (1);
      - name: second
        input: |
          select * from a;
      - name: third
        input: |
          insert into a values (2);
      - name: fourth
        input: |
          select * from a;

  # The same unresolved relation referenced repeatedly in several scripts
  - name: RepeatedUnresolvedReference
    scripts:
      - name: first
        input: |
          select * from missing;
          select * from missing;
      - name: second
        input: |
          select * from missing;
          select * from db.sch.missing;
          select * from db.sch.missing;

  # CTE references with and without aliases
  - name: CteAliases
    catalog: |
      create table a (id int);
    scripts:
      - name: queries
        input: |
          with c as (select * from a) select * from c x;
          with c as (select * from a), d as (select * from c) select * from d, c as y;

  # Graph queries are barriers, a plan of the session runs them in session order
  - name: GraphQueries
    catalog: |
      create table people (id int, name text);
      create table knows (src int, dst int);
    scripts:
      - name: load
        input: |
          insert into people values (1, 'a'), (2, 'b');
          insert into knows values (1, 2);
      - name: friends
        input: |
          with pg as property graph (
            vertex tables (people key (id))
            edge tables (knows key (src, dst) source key (src) references people (id) destination key (dst) references people (id))
          )
          select * from graph_table(pg match (a)-[e]->(b) columns (a.name as from_name, b.name as to_name)) gt;
      - name: count
        input: select count(*) from people;

  # The statements of a transaction are barriers: they run in order, nothing else of the connection runs in between.
  # The statements after the transaction are ordered by their accesses again.
  - name: TransactionBlock
    catalog: |
      create table items (id int);
      create table other (id int);
    scripts:
      - name: before
        input: |
          select * from other;
      - name: load
        input: |
          begin;
          insert into items values (1);
          delete from items where id = 2;
          commit;
          select * from other;
      - name: after
        input: |
          select * from items;

  # A transaction that the script doesn't end lasts until its end, the analyzer error is a warning of the plan
  - name: TransactionNotEnded
    catalog: |
      create table items (id int);
    scripts:
      - name: load
        input: |
          begin;
          insert into items values (1);
          select * from items;

  # ALTER, schema and index statements are barriers without accesses
  - name: SchemaStatements
    catalog: |
      create table t (a int);
    scripts:
      - name: s
        input: |
          select * from t;
          alter table t add column b int;
          create schema s2;
          create index i on t (a);
          select * from t;

  # Row locking and a foreign key of the table are barriers, once per statement
  - name: LockingAndForeignKey
    catalog: |
      create table t (a int primary key);
    scripts:
      - name: s
        input: |
          select * from t;
          select * from t for update;
          create table u (a int, foreign key (a) references t (a));
          select * from t;

  # A temporary view is a barrier like a temporary table
  - name: TemporaryView
    catalog: |
      create table base (x int);
    scripts:
      - name: s
        input: |
          create temp view v as select x from base;
          select 1;

  # Two transactions of one script, ended by COMMIT and ROLLBACK: the statements between them are ordered by their
  # accesses again
  - name: TwoTransactions
    catalog: |
      create table t (a int);
      create table u (a int);
    scripts:
      - name: s
        input: |
          begin;
          insert into t values (1);
          commit;
          select * from u;
          select * from t;
          start transaction;
          delete from u;
          rollback;
          select * from u;

  # A transaction begins and ends in one script: the analyzer errors are warnings, the BEGIN holds the rest of its
  # script, the COMMIT of the other script is a barrier alone
  - name: TransactionAcrossScripts
    catalog: |
      create table t (a int);
    scripts:
      - name: open
        input: |
          begin;
          insert into t values (1);
      - name: close
        input: |
          insert into t values (2);
          commit;

  # A plan of targets chains the statements of a transaction like the others and keeps the barriers
  - name: TransactionTarget
    catalog: |
      create table t (a int);
      create table u (a int);
    targets: [s]
    scripts:
      - name: s
        input: |
          select * from u;
          begin;
          insert into t values (1);
          commit;
          select * from t;
          select * from u;

  # A foreign key is a constraint effect, as a table constraint and as a column constraint
  - name: ReferencesConstraints
    catalog: |
      create table t (a int primary key);
    scripts:
      - name: s
        input: |
          create table u (a int, foreign key (a) references t (a));
          create table v (a int references t (a));

  # TRUNCATE writes the relation that it names, it is an unsupported statement and a barrier
  - name: TruncateWritesItsRelation
    catalog: |
      create table t (a int);
    scripts:
      - name: s
        input: |
          select * from t;
          truncate t;
          select * from t;
