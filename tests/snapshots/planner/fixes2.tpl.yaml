planner-snapshots:
  # A referenced script with a data-modifying WITH writes whenever it runs, no script reads it
  - name: ReferenceToDataModifyingWith
    catalog: |
      create table t (a int);
    scripts:
      - name: gone
        input: |
          with g as (delete from t returning a) select * from g;
      - name: bar
        input: |
          select count(*) from :gone;
      - name: after
        input: |
          select * from t;

  # The editor check of a reference to a data-modifying WITH reports the error too
  - name: ReferenceToDataModifyingWithTolerant
    scope: tolerant
    catalog: |
      create table t (a int);
    scripts:
      - name: gone
        input: |
          with g as (delete from t returning a) select * from g;
      - name: bar
        input: |
          select count(*) from :gone;

  # COPY FROM writes its table, COPY TO reads it, both are barriers
  - name: CopyFromWritesCopyToReads
    catalog: |
      create table t (a int);
    scripts:
      - name: load
        input: |
          copy t from '/tmp/t.csv';
      - name: read
        input: |
          select * from t;
      - name: unload
        input: |
          copy t to '/tmp/t2.csv';
      - name: query
        input: |
          copy (select * from t) to '/tmp/t3.csv';
