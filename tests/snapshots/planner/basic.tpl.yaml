planner-snapshots:
  - name: IndependentQueries
    catalog: |
      create table a (id int);
      create table b (id int);
    scripts:
      - name: first
        input: |
          -- Query descriptions are not backend SQL.
          select * from a;
          select * from a;
          select * from b;
      - name: second
        input: |
          select 1;
          select * from b;

  - name: CrossScriptCtasDiamond
    catalog: |
      create table source (id int);
    scripts:
      - name: root
        input: create table base as select * from source;
      - name: left
        input: create table left_branch as select * from base;
      - name: right
        input: create table right_branch as select * from base;
      - name: sink
        input: select * from left_branch join right_branch using (id);

  - name: CrossScriptViewDiamond
    catalog: |
      create table source (id int);
    scripts:
      - name: root
        input: create view base as select * from source;
      - name: left
        input: create view left_branch as select * from base;
      - name: right
        input: create view right_branch as select * from base;
      - name: sink
        input: select * from left_branch join right_branch using (id);

  - name: MutationHazards
    catalog: |
      create table a (id int);
      create table b (id int);
    scripts:
      - name: first
        input: |
          select * from a;
          select * from a;
          insert into a values (1);
          insert into b values (9);
      - name: second
        input: |
          select * from a;
          insert into a values (2) returning id;
          insert into a values (3);
          select * from b;

  - name: InsertSelfReadAndMultipleEntities
    catalog: |
      create table a (id int);
      create table b (id int);
      create table c (id int);
    scripts:
      - name: mutations
        input: |
          select * from a;
          insert into a select * from a returning id;
          insert into c select a.id from a join b using (id);
          insert into b values (2);
          select * from c;

  - name: CtePhysicalEntities
    catalog: create table source (id int);
    scripts:
      - name: queries
        input: |
          with c as (select * from source), d as (select * from c) select * from d;
          insert into source select * from source;

  - name: DropRecreate
    scripts:
      - name: producer
        input: create table db.s.a (id int);
      - name: lifetime
        input: |
          select * from a;
          drop table a;
          create table db.s.a (id int);
          select * from a;

  - name: SameScriptDropRecreate
    scripts:
      - name: lifetime
        input: |
          create table a (id int);
          select * from a;
          drop table a;
          create table a (id int);
          select * from a;

  - name: ExternalDropRecreate
    catalog: create table db.s.a (id int);
    scripts:
      - name: lifetime
        input: |
          select * from a;
          drop table a;
          create table db.s.a (id int);
          select * from a;

  - name: LaterProducerWithinScript
    scripts:
      - name: forward
        input: |
          select * from later;
          create table later (id int);

  - name: ProducerThenConsumer
    scripts:
      - name: producer
        input: create table relation (id int);
      - name: consumer
        input: select * from relation;

  - name: ReversedProducerConsumer
    scripts:
      - name: consumer
        input: select * from relation;
      - name: producer
        input: create table relation (id int);

  - name: UnresolvedBarrier
    scripts:
      - name: queries
        input: |
          select 1;
          select * from missing;
          select 2;
          select 3;

  - name: UnsupportedSet
    scripts:
      - name: session
        input: |
          select 1;
          set foo = 1;
          select 2;

  - name: UnresolvedDrop
    scripts:
      - name: queries
        input: |
          select * from db.s.missing;
          drop table missing;
          select 1;

  - name: ExplainOutputs
    catalog: |
      create table a (id int);
      create table b (id int);
    scripts:
      - name: explain
        input: |
          explain select 1;
          explain select * from a;
          explain insert into a select * from b;
          explain delete from a returning id;
          explain expressions (1 + 2);
          insert into a values (1);
          explain insert into a values (2);

  - name: ExplainDeclarationsAreNotProducers
    catalog: create table source (id int);
    scripts:
      - name: explain
        input: |
          explain create table plain (id int);
          explain create table copied as select * from source;
          explain create view v as select * from source;
          explain select * into destination from source;
      - name: consumer
        input: select * from copied;

  - name: ExecutionEnabledExplainMutation
    catalog: create table a (id int);
    scripts:
      - name: explain
        input: |
          explain (analyze) insert into a values (1);
          explain (analyse true) delete from a returning id;
          explain (format 'analyze') insert into a values (2);
          explain (analyze) create table copied as select * from a;

  - name: ExplainAnalyzeQueriesAndDisabledMutation
    catalog: create table a (id int);
    scripts:
      - name: explain
        input: |
          explain (analyze) select * from a;
          explain (analyse true) expressions (1 + 2);
          explain (analyze false) insert into a values (1);
          explain (analyse false) delete from a;

  - name: VisualizationSourceOutputs
    catalog: create table a (id int);
    scripts:
      - name: queries
        input: |
          -- Description is not part of the source query.
          /* @vis table */
          select 1 as id;
          /* @vis table */
          with c as (select * from a) select * from c;
          insert into a values (1) returning id;
          /* @vis table */
          select * from a;
          explain select * from a;

  - name: DeleteHazardsAndReturning
    catalog: |
      create table a (id int);
      create table b (id int);
    scripts:
      - name: mutations
        input: |
          select * from a;
          delete from a where id in (select id from b) returning id;
          select * from a;
          insert into b values (1);
          delete from a;
          insert into a values (2) returning id;

  - name: UnsupportedTemporaryTable
    scripts:
      - name: session
        input: create temp table t (id int);

  - name: MalformedParser
    scripts:
      - name: valid
        input: select 1;
      - name: malformed
        input: select from;

  - name: MalformedScanner
    scripts:
      - name: malformed
        input: select 'unterminated

  - name: StaleAnalysis
    scripts:
      - name: valid
        input: select 2;
      - name: stale
        input: select 1;
        stale-prepend: " "

  - name: NormalizedIdentifiers
    catalog: |
      create table Db.S.Mixed (id int);
      create table "Mixed" (id int);
    scripts:
      - name: queries
        input: |
          select * from DB.s.MIXED;
          insert into db.S.mixed values (1);
          select * from "Mixed";

  - name: SelectInto
    catalog: create table source (id int);
    scripts:
      - name: producer
        input: select * into copied from source;
      - name: consumer
        input: select * from copied;

  - name: ObfuscatedLiterals
    catalog: create table source (id int);
    scripts:
      - name: query
        input: select * from source where id = /*Integer(FCD0)*/;

  - name: QualifiedIdentifierComponents
    catalog: |
      create table "Db.Dot"."s""quote"."Mixed.Name" (id int);
      create table "select" (id int);
    scripts:
      - name: queries
        input: |
          select * from "Db.Dot"."s""quote"."Mixed.Name";
          insert into "Db.Dot"."s""quote"."Mixed.Name" values (1);
          select * from "select";
          select * from "missing.db"."missing""schema"."Missing.Name";

  - name: PublishedViewBarrier
    catalog: create view v as select 1 as id;
    scripts:
      - name: queries
        input: |
          select 1;
          select * from v;
          select 2;

  - name: EmptyScript
    scripts:
      - name: trivia
        input: |
          -- only trivia
          /* comment */

  - name: ViewWriteBaseRead
    catalog: |
      create table base (id int);
      create view v as select * from base;
    scripts:
      - name: writer
        input: insert into v values (1);
      - name: reader
        input: select * from base;

  - name: ViewWriteBaseWrite
    catalog: |
      create table base (id int);
      create view v as select * from base;
    scripts:
      - name: view_writer
        input: insert into v values (1);
      - name: base_writer
        input: insert into base values (2);

  - name: QualifiedCteCollision
    catalog: create table s.unrelated (id int);
    scripts:
      - name: collision
        input: with c as (select 1 as id) select * from s.c;

  - name: DropBeforeFutureQualifiedProducer
    catalog: create table s.unrelated (id int);
    scripts:
      - name: earlier
        input: |
          create table a (id int);
          select * from a;
      - name: later
        input: |
          drop table a;
          create table s.a (id int);

  - name: EmptyInputs
    scripts: []

  - name: DropViewBeforeBaseDrop
    catalog: |
      create table base (id int);
      create view v as select * from base;
    scripts:
      - name: drops
        input: |
          select 1;
          drop view v;
          drop table base;

  - name: DropTableTargetingViewBeforeBaseDrop
    catalog: |
      create table base (id int);
      create view v as select * from base;
    scripts:
      - name: drops
        input: |
          select 1;
          drop table v;
          drop table base;

  # An UPDATE writes its target after its readers and reads the table of its FROM
  - name: UpdateFromReadsSource
    catalog: |
      create table t (a int, b int);
      create table u (a int, c int);
    scripts:
      - name: before
        input: |
          select * from t;
      - name: bump
        input: |
          update t set b = u.c from u where t.a = u.a;
      - name: after
        input: |
          select * from t;
          insert into u values (1, 1);

  # An UPDATE produces output with RETURNING only
  - name: UpdateReturning
    catalog: |
      create table t (a int, b int);
    scripts:
      - name: bump
        input: |
          update t set b = b + 1 returning a, b;
      - name: quiet
        input: |
          update t set b = 0 where a < 0;

  # A MERGE writes its target, reads its source and produces output with RETURNING
  - name: MergeReturning
    catalog: |
      create table t (a int, b int);
      create table u (a int, c int);
    scripts:
      - name: sync
        input: |
          merge into t using u on t.a = u.a
          when matched then update set b = u.c
          when not matched then insert (a, b) values (u.a, u.c)
          returning t.a;

  # A write waits for the readers since the last write only, earlier readers are ordered through that write
  - name: ReadersThenWritersTimeline
    catalog: |
      create table t (a int);
    scripts:
      - name: r1
        input: select * from t;
      - name: r2
        input: select count(*) from t;
      - name: w1
        input: insert into t values (1);
      - name: r3
        input: select max(a) from t;
      - name: r4
        input: select min(a) from t;
      - name: w2
        input: delete from t where a = 1;
      - name: w3
        input: insert into t values (2);
      - name: r5
        input: select * from t;

  # Every CREATE of a name is an identity of its own, also without a DROP between, the read takes the last one
  - name: SameScriptCreateTwice
    catalog: |
      create table t (a int);
    scripts:
      - name: s
        input: |
          create table if not exists t (a int);
          create table u (a int);
          create table u (b int);
          select * from u;

  # A DROP IF EXISTS of a missing table is an unresolved barrier, the CREATE after it shares its name timeline
  - name: DropIfExistsThenCreate
    scripts:
      - name: s
        input: |
          drop table if exists missing;
          create table missing (x int);
          select * from missing;

  # A view that is created twice: two DDL accesses of one name, the read of the view is a barrier
  - name: CreateOrReplaceView
    catalog: |
      create table base (x int);
    scripts:
      - name: s
        input: |
          create or replace view v as select x from base;
          create or replace view v as select x + 1 as x from base;
          select * from v;

  # Plain EXPLAIN reads the targets of UPDATE and MERGE, an execution-enabled EXPLAIN of an UPDATE writes it and is a
  # barrier
  - name: ExplainUpdateAndMerge
    catalog: |
      create table t (a int, b int);
      create table u (a int, c int);
    scripts:
      - name: plain
        input: |
          select * from t;
          explain update t set b = 1;
          explain merge into t using u on t.a = u.a when matched then update set b = u.c;
      - name: analyzed
        input: |
          explain (analyze) update t set b = 2 returning a;
          select * from t;

  # A DROP of several tables drops every one of them, the reads of each are ordered before it
  - name: DropSeveralTables
    catalog: |
      create table a (x int);
      create table b (x int);
    scripts:
      - name: s
        input: |
          select * from b;
          drop table a, b;
          select 1;
      - name: t
        input: |
          select * from b;

  # A query that writes runs every time, its script is not cacheable: a data-modifying WITH and an EXPLAIN that runs a
  # statement that writes. An EXPLAIN that does not run its statement writes nothing.
  - name: WritingQueriesAreNotCacheable
    catalog: |
      create table t (a int);
    scripts:
      - name: deleted
        input: |
          with gone as (delete from t returning a) select * from gone;
      - name: updated
        input: |
          explain (analyze) update t set a = 1;
      - name: planned
        input: |
          explain update t set a = 2;

  # The lifetime of a table across scripts: the CREATE, a write, an ALTER that is a barrier, a read and the DROP
  - name: DdlLifecycleAcrossScripts
    scripts:
      - name: create
        input: |
          create table t (a int);
      - name: fill
        input: |
          insert into t values (1);
      - name: alter
        input: |
          alter table t add column b int;
      - name: read
        input: |
          select * from t;
      - name: drop
        input: |
          drop table t;

  # A rename is a barrier, the planner does not follow it: the new name is unresolved, the old one still resolves
  - name: RenameIsABarrier
    catalog: |
      create table t (a int);
    scripts:
      - name: rename
        input: |
          alter table t rename to u;
      - name: read
        input: |
          select * from u;
      - name: old
        input: |
          select * from t;

  # A DROP of a table and of a missing one: a DDL access of each, the missing one makes it a barrier
  - name: DropResolvedAndMissing
    catalog: |
      create table a (x int);
    scripts:
      - name: read
        input: |
          select * from a;
      - name: drop
        input: |
          drop table if exists a, missing;
      - name: after
        input: |
          select 1;

  # A DROP of two tables of one name in two schemas: two timelines, each read is ordered before the DROP
  - name: DropQualifiedSameName
    catalog: |
      create table s1.t (x int);
      create table s2.t (x int);
    scripts:
      - name: r1
        input: |
          select * from s1.t;
      - name: r2
        input: |
          select * from s2.t;
      - name: drop
        input: |
          drop table s1.t, s2.t;

  # A DROP of two tables that the session created, one of them is created again. Another script that reads the name
  # of two declarations reads an ambiguous relation, the script of the new declaration reads its own.
  - name: DropSeveralSessionTables
    scripts:
      - name: setup
        input: |
          create table a (x int);
          create table b (x int);
      - name: readers
        input: |
          select * from a;
          select * from b;
      - name: drop
        input: |
          drop table a, b;
      - name: recreate
        input: |
          create table b (y int);
          select * from b;

  # The statements of one script are ordered by their accesses only in a plan of the session, independent writes and
  # reads run side by side
  - name: ParallelStatementsOfOneScript
    catalog: |
      create table a (x int);
      create table b (x int);
    scripts:
      - name: s
        input: |
          insert into a values (1);
          insert into b values (1);
          select * from a;
          select * from b;
          select * from a, b;

  # An UPDATE and a MERGE that read their target under an alias have one WRITE access and no self edge
  - name: WriteTargetReadByAlias
    catalog: |
      create table t (a int, b int);
    scripts:
      - name: updated
        input: |
          update t set b = t2.b from t t2 where t.a = t2.a;
      - name: merged
        input: |
          merge into t using t s on s.a = t.a when matched then update set b = s.b;
      - name: read
        input: |
          select * from t;

  # A data-modifying WITH writes a second table, a reader of both reads after the statement
  - name: DataModifyingWithWritesTwoTables
    catalog: |
      create table a (x int);
      create table b (x int);
    scripts:
      - name: move
        input: |
          with moved as (delete from a returning x) insert into b select x from moved;
      - name: read
        input: |
          select * from a, b;

  # Scripts of queries are cacheable, also with row locking, several queries, VALUES, an executed EXPLAIN of a query or
  # a visualization. A transaction, SELECT INTO, SET and a script without statements are not.
  - name: CacheabilityOfStatementKinds
    catalog: |
      create table t (a int);
    scripts:
      - name: locking
        input: |
          select * from t for update;
      - name: transaction
        input: |
          begin;
          select * from t;
          commit;
      - name: two_queries
        input: |
          select 1;
          select * from t;
      - name: values
        input: |
          values (1), (2);
      - name: select_into
        input: |
          select a into u from t;
      - name: set
        input: |
          set search_path = public;
          select 1;
      - name: explain_analyze
        input: |
          explain analyze select * from t;
      - name: vis
        input: |
          /** @vis table */
          select a from t;
      - name: comment
        input: |
          /* nothing */
