planner-snapshots:
  # The literals of the inputs, in the Hyper dialect
  - name: InputLiterals
    catalog: |
      create table orders (id int, amount int, region text, open boolean, day date, ts timestamp);
    scripts:
      - name: foo
        input: |
          /** @param :min = 10
           * @param :region = 'EU'
           * @param :open = true
           * @param :delta = -2
           * @param :day = date '2024-01-01'
           * @param :span = interval '3' day */
          select id from orders where amount > :min + :delta and region = :region and open = :open
            and day >= :day and ts > timestamp '2024-02-01' - :span;

  # A cast of the parameter reads the literal
  - name: InputCast
    catalog: |
      create table orders (id int, amount int, day date);
    scripts:
      - name: foo
        input: |
          /* @param :min = '10'
             @param :day = '2024-01-01' */
          select id from orders where amount > :min::int and day >= cast(:day as date);

  # An input without a value and a value that is no literal fail the plan
  - name: InputWithoutValue
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          /* @param :min = now() */
          select id from orders where amount > :min and id > :max;

  # A script without a tag binds the value of the first tag in session order, a script with one binds its own
  - name: InputSessionValue
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: a
        input: |
          /* @param :min = 10 */
          select id from orders where amount > :min;
      - name: b
        input: |
          select id from orders where amount > :min;
      - name: c
        input: |
          /* @param :min = 30 */
          select id from orders where amount > :min;

  # An inlined query binds the inputs of its script
  - name: InputInlined
    catalog: |
      create table orders (id int, amount int);
    scripts:
      - name: foo
        input: |
          /* @param :min = 10
             @param :span = interval '3' day
             @param :day = date '2024-02-01' */
          select id, amount from orders where amount > :min and :day - :span < date '2024-03-01';
      - name: bar
        input: |
          /* @param :limit = 5 */
          select count(*) from :foo where id < :limit;

  # A Trino connection reads the literals in its dialect
  - name: InputTrino
    hyper: skip
    connections:
      - name: trino
        kind: REMOTE
        dialect: trino
        catalog: |
          create table events (id int, ts timestamp, day date);
    scripts:
      - name: foo
        connection: trino
        input: |
          /* @param :span = interval '26' hour
             @param :day = date '2024-01-01'
             @param :name = 'it''s' */
          select id from events where ts > now() - :span and day = :day and :name <> '';

  # Interval text is no literal, an interval is a number and a unit: the input has no value
  - name: InputIntervalText
    hyper: skip
    connections:
      - name: trino
        kind: REMOTE
        dialect: trino
        catalog: |
          create table events (id int, ts timestamp);
    scripts:
      - name: foo
        connection: trino
        input: |
          /* @param :span = interval '1 day 2 hours' */
          select id from events where ts > now() - :span;

  # Inputs in LIMIT, VALUES, CREATE TABLE AS, DELETE and UPDATE
  - name: InputPositions
    catalog: |
      create table t (a int, b text);
    scripts:
      - name: s
        input: |
          /* @param :n = 3
             @param :name = 'x' */
          select a from t order by a limit :n;
          insert into t values (:n, :name);
          create table u as select :n as a, :name as b;
          delete from t where b = :name;
          update t set a = :n where b = :name;

  # NULL, a quote in a string, a big integer and a float
  - name: InputNullAndQuotes
    catalog: |
      create table t (a int, b text);
    scripts:
      - name: s
        input: |
          /* @param :none = null
             @param :quoted = 'it''s'
             @param :big = 12345678901234
             @param :ratio = 1.5e3 */
          select * from t where b = :quoted or a = :none or a < :big or a < :ratio;

  # An inlined query binds the value of its own script, the consumer the value of its own tag or the first one
  - name: InputInlinedOwnValue
    catalog: |
      create table t (a int);
    scripts:
      - name: foo
        input: |
          /* @param :min = 10 */
          select a from t where a > :min;
      - name: bar
        input: |
          /* @param :min = 20 */
          select count(*) from :foo where a > :min;
      - name: baz
        input: |
          select count(*) from :foo where a > :min;
