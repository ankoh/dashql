visualize-snapshots:
  - name: vis_markdown_code_blocks
    script:
      input: |
        /* @vis markdown
           ```sql extra
           select {{author}};
           ```

               indented code

           ---

           done
        */
        SELECT 'Ada' AS author;

  - name: vis_markdown_lists
    script:
      input: |
        /* @vis markdown
           - tight {{author}}
           - items
             - nested

           3. loose

           4. {{n}}

           * star
        */
        SELECT 'Ada' AS author, 3 AS n;

  - name: vis_markdown_inline
    script:
      input: |
        /* @vis markdown
           Some *emphasis*, **strong**, _under_ and ![image](https://example.com/a.png "Title") by {{author}}.\
           Hard break and <b>inline html</b> and <https://example.com> and <me@example.com>.

           [relative](/docs) [mail](mailto:a@example.com) [field title](https://example.com "{{author}}")
        */
        SELECT 'Ada' AS author;

  - name: vis_markdown_headings_quotes
    script:
      input: |
        /* @vis markdown
           # One

           ## Two {{author}}

           ###### Six

           Setext
           ======

           > quote
           > > nested {{author}}
        */
        SELECT 'Ada' AS author;

  - name: vis_markdown_only_fields
    script:
      input: |
        /* @vis markdown
           {{author}}{{n}}{{missing}}
        */
        SELECT 'Ada' AS author, 1 AS n;

  # Link destinations: http, https, mailto and relative URLs are links, other schemes become spans,
  # also in other cases or with control characters
  - name: vis_markdown_link_schemes
    script:
      input: |
        /* @vis markdown
           [a](HTTPS://example.com) [b](./rel?x=1) [c](#anchor) [d](//host/path) [e](a/b:c)
           [f](JaVaScRiPt:alert(1)) [g](data:text/html,x) [h](vbscript:x) [i](ftp://host) [j](<java script:x>)
        */
        SELECT 1 AS a;

  # Images and reference links follow the same rules, a field in the URL makes a span
  - name: vis_markdown_images_references
    script:
      input: |
        /* @vis markdown
           ![logo](https://example.com/{{a}}.png) ![bad](javascript:x "t")

           [ok][r1] [bad][r2]

           [r1]: https://example.com "Ref"
           [r2]: javascript:alert(1)
        */
        SELECT 1 AS a;

  # A raw HTML block is dropped with the placeholders in it, the paragraph after it stays
  - name: vis_markdown_html_block
    script:
      input: |
        /* @vis markdown
           <div class="x">
           {{a}}
           </div>

           <!-- note -->

           after {{a}}
        */
        SELECT 1 AS a;

  # Ordered lists keep their start, also 0 and the ) delimiter
  - name: vis_markdown_list_starts
    script:
      input: |
        /* @vis markdown
           7. seven
           8. eight

           0) zero
        */
        SELECT 1 AS a;

  # The CommonMark extensions are not enabled: tables, strikethrough and task lists stay text, and a footnote is a
  # reference link to the URL of its definition
  - name: vis_markdown_extensions_disabled
    script:
      input: |
        /* @vis markdown
           | name | value |
           | ---- | ----- |
           | {{a}} | 1 |

           ~~gone~~ - [ ] todo [^1]

           [^1]: note
        */
        SELECT 1 AS a;

  # A field in the alt text of an image and inside inline HTML, which is dropped around it
  - name: vis_markdown_field_in_alt_and_html
    script:
      input: |
        /* @vis markdown
           ![{{a}} logo](https://example.com/a.png) <span class="x">{{b}}</span>
        */
        SELECT 1 AS a, 2 AS b;

  # A field in the info string of a code fence leaves the block without a language, like a field in a link title.
  # Heading attributes are not enabled, `{#{{id}}}` stays text around the field
  - name: vis_markdown_field_in_code_info
    script:
      input: |
        /* @vis markdown
           # Title {#{{id}}}

           ```{{lang}} rest
           code {{a}}
           ```
        */
        SELECT 1 AS a, 'sql' AS lang, 'x' AS id;

  # Autolinks follow the rules of links: unsafe schemes become spans, an email address gets mailto
  - name: vis_markdown_autolinks
    script:
      input: |
        /* @vis markdown
           <HTTP://EXAMPLE.COM/x> <javascript:alert(1)> <ftp://host/x> <a.b@example.com>
        */
        SELECT 1 AS a;

  # An image inside a link: a field in the URL of the link makes it a span, the image inside stays
  - name: vis_markdown_image_in_link
    script:
      input: |
        /* @vis markdown
           [![{{a}}](https://example.com/a.png)](https://example.com/{{b}})
           [![logo](https://example.com/b.png "Logo")](https://example.com)
        */
        SELECT 1 AS a, 2 AS b;

  # A Setext heading of level two, and thematic breaks of stars and underscores
  - name: vis_markdown_setext_h2_and_rules
    script:
      input: |
        /* @vis markdown
           Title {{a}}
           ---

           ***

           ___
        */
        SELECT 1 AS a;

  # A field inside an indented code block, and a list inside a block quote
  - name: vis_markdown_indented_code_and_quoted_list
    script:
      input: |
        /* @vis markdown
           Code:

               let x = {{a}};

           > - {{b}}
           > - two
        */
        SELECT 1 AS a, 2 AS b;
