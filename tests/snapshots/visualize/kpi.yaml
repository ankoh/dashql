visualize-snapshots:

  - name: kpi_default_size
    catalog:
      script:
        input: |-
          create table sales (day date, revenue decimal);
        errors: []
    script:
      input: |
        /**
         * Revenue
         *
         * @vis kpi value=revenue x=day
         */
        SELECT day, sum(revenue) AS revenue FROM sales GROUP BY day ORDER BY day;
    dashboard:
      width: 3
      height: 3
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT day, sum(revenue) AS revenue FROM sales GROUP BY day ORDER BY day"
        }
      }

  - name: kpi_board_width_only
    script:
      input: |
        /* @vis kpi value="Total Revenue" delta=first
           @board row=0 width=6 */
        SELECT 1 AS "Total Revenue";
    dashboard:
      row: 0
      width: 6
      height: 3
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT 1 AS \"Total Revenue\""
        }
      }

  - name: kpi_invalid_args
