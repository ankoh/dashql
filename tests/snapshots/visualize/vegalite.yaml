visualize-snapshots:

  - name: vis_encoding
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp);
        errors: []
    script:
      input: |
        /* @vis vegalite
           {
             "mark": {"type": "line", "point": true},
             "encoding": {
               "x": {"field": "date", "type": "temporal", "timeUnit": "month"},
               "y": {"field": "revenue", "type": "quantitative", "aggregate": "sum"},
               "color": {"field": "category", "type": "nominal"}
             }
           }
        */
        SELECT category, revenue, date FROM sales WHERE revenue > 0;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT category, revenue, date FROM sales WHERE revenue > 0"
        },
        "mark": {
          "type": "line",
          "point": true
        },
        "encoding": {
          "x": {
            "field": "date",
            "type": "temporal",
            "timeUnit": "month"
          },
          "y": {
            "field": "revenue",
            "type": "quantitative",
            "aggregate": "sum"
          },
          "color": {
            "field": "category",
            "type": "nominal"
          }
        }
      }

  - name: vis_layers_and_transforms
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp);
        errors: []
    script:
      input: |
        /* @vis vegalite
           {
             "title": "Revenue",
             "transform": [{"calculate": "datum.revenue * 2", "as": "double"}],
             "layer": [
               {"mark": "bar", "encoding": {"x": {"field": "category"}, "y": {"field": "double"}}},
               {"mark": {"type": "rule", "color": "red"}, "encoding": {"y": {"aggregate": "mean", "field": "double"}}}
             ],
             "resolve": {"scale": {"y": "independent"}},
             "config": {"view": {"stroke": null}}
           }
        */
        SELECT category, revenue FROM sales;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT category, revenue FROM sales"
        },
        "title": "Revenue",
        "transform": [
          {
            "calculate": "datum.revenue * 2",
            "as": "double"
          }
        ],
        "layer": [
          {
            "mark": "bar",
            "encoding": {
              "x": {
                "field": "category"
              },
              "y": {
                "field": "double"
              }
            }
          },
          {
            "mark": {
              "type": "rule",
              "color": "red"
            },
            "encoding": {
              "y": {
                "aggregate": "mean",
                "field": "double"
              }
            }
          }
        ],
        "resolve": {
          "scale": {
            "y": "independent"
          }
        },
        "config": {
          "view": {
            "stroke": null
          }
        }
      }

  - name: vis_data_replaced
    script:
      input: |
        /* @vis vegalite {"data": {"values": [{"a": 1}]}, "mark": "point"} */
        SELECT 1 AS a;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT 1 AS a"
        },
        "mark": "point"
      }

  - name: vis_board
    script:
      input: |
        /* @vis vegalite {"mark": "bar"}
           @board row=1 width=12 height=4 */
        SELECT 1 AS a;
    dashboard:
      row: 1
      width: 12
      height: 4
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT 1 AS a"
        },
        "mark": "bar"
      }

  - name: vis_unknown_field_passed_through
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp);
        errors: []
    script:
      input: |
        /* @vis vegalite {"mark": "bar", "encoding": {"x": {"field": "region"}, "y": {"field": "revenue"}}} */
        SELECT category, revenue FROM sales;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT category, revenue FROM sales"
        },
        "mark": "bar",
        "encoding": {
          "x": {
            "field": "region"
          },
          "y": {
            "field": "revenue"
          }
        }
      }

  - name: vis_no_type_inference
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp);
        errors: []
    script:
      input: |
        /* @vis vegalite {"mark": "line", "encoding": {"x": {"field": "date"}, "y": {"field": "revenue"}, "color": {"field": "category"}}} */
        SELECT date, revenue, category FROM sales;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT date, revenue, category FROM sales"
        },
        "mark": "line",
        "encoding": {
          "x": {
            "field": "date"
          },
          "y": {
            "field": "revenue"
          },
          "color": {
            "field": "category"
          }
        }
      }

  - name: vis_nested_and_defined_fields
    script:
      input: |
        /* @vis vegalite
           {
             "transform": [
               {"fold": ["a", "b"], "as": ["key", "value"]},
               {"calculate": "datum.a * 2", "as": "twice"}
             ],
             "mark": "bar",
             "encoding": {
               "x": {"field": "key"},
               "y": {"field": "value"},
               "color": {"field": "info.kind"},
               "detail": {"field": "items[0]"},
               "size": {"field": "twice"}
             }
           }
        */
        SELECT 1 AS a, 2 AS b, 3 AS info, 4 AS items;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT 1 AS a, 2 AS b, 3 AS info, 4 AS items"
        },
        "transform": [
          {
            "fold": [
              "a",
              "b"
            ],
            "as": [
              "key",
              "value"
            ]
          },
          {
            "calculate": "datum.a * 2",
            "as": "twice"
          }
        ],
        "mark": "bar",
        "encoding": {
          "x": {
            "field": "key"
          },
          "y": {
            "field": "value"
          },
          "color": {
            "field": "info.kind"
          },
          "detail": {
            "field": "items[0]"
          },
          "size": {
            "field": "twice"
          }
        }
      }

  - name: vis_empty_object
    script:
      input: |
        /* @vis vegalite {} */
        SELECT 1 AS a;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT 1 AS a"
        }
      }

  - name: vis_schema_override
    script:
      input: |
        /* @vis vegalite {"$schema": "https://vega.github.io/schema/vega-lite/v4.json", "mark": "tick"} */
        SELECT 1 AS a;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v4.json",
        "data": {
          "$sql": "SELECT 1 AS a"
        },
        "mark": "tick"
      }

  - name: vis_json_values_reprinted
    script:
      input: |
        /* @vis vegalite
           {
             "title": "Umsatz \u20ac and café /\u002a total *\/",
             "description": "tab\there \"quoted\"",
             "mark": {"type": "bar", "opacity": 0.50, "size": 1e2, "cornerRadius": -0},
             "width": 400,
             "autosize": null,
             "config": {"axis": {"grid": false, "labelAngle": -45}}
           }
        */
        SELECT 1 AS a;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT 1 AS a"
        },
        "title": "Umsatz € and café /* total */",
        "description": "tab\there \"quoted\"",
        "mark": {
          "type": "bar",
          "opacity": 0.5,
          "size": 100.0,
          "cornerRadius": -0.0
        },
        "width": 400,
        "autosize": null,
        "config": {
          "axis": {
            "grid": false,
            "labelAngle": -45
          }
        }
      }

  - name: vis_sql_text_multiline
    script:
      input: |
        /* @vis vegalite {"mark": "bar"} */
        SELECT category, /* the measure */ sum(revenue) AS revenue
          FROM sales
         GROUP BY category;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT category, /* the measure */ sum(revenue) AS revenue\n  FROM sales\n GROUP BY category"
        },
        "mark": "bar"
      }

  - name: vis_with_cte
    script:
      input: |
        /* @vis vegalite {"mark": "bar", "encoding": {"x": {"field": "k"}, "y": {"field": "n"}}} */
        WITH counts AS (SELECT 1 AS k, 2 AS n)
        SELECT k, n FROM counts;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "WITH counts AS (SELECT 1 AS k, 2 AS n)\nSELECT k, n FROM counts"
        },
        "mark": "bar",
        "encoding": {
          "x": {
            "field": "k"
          },
          "y": {
            "field": "n"
          }
        }
      }

  - name: vis_union
    script:
      input: |
        /* @vis vegalite {"mark": "point", "encoding": {"x": {"field": "x"}}} */
        SELECT 1 AS x UNION ALL SELECT 2;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT 1 AS x UNION ALL SELECT 2"
        },
        "mark": "point",
        "encoding": {
          "x": {
            "field": "x"
          }
        }
      }

  - name: vis_star_unknown_table
    script:
      input: |
        /* @vis vegalite {"mark": "bar", "encoding": {"x": {"field": "anything"}}} */
        SELECT * FROM unknown_table;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT * FROM unknown_table"
        },
        "mark": "bar",
        "encoding": {
          "x": {
            "field": "anything"
          }
        }
      }

  - name: vis_sql_text_escaped
    script:
      input: |
        /* @vis vegalite {"mark": "text"} */
        SELECT 'say "hi"' AS "Quoted Name", 'C:\temp	x' AS path, 'Grüße 日本' AS t;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT 'say \"hi\"' AS \"Quoted Name\", 'C:\\temp\tx' AS path, 'Grüße 日本' AS t"
        },
        "mark": "text"
      }

  - name: vis_sql_text_trailing_line_comment
    script:
      input: |
        /* @vis vegalite {"mark": "bar"} */
        SELECT 1 AS a -- the measure
        ;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT 1 AS a"
        },
        "mark": "bar"
      }

  - name: vis_duplicate_json_keys
    script:
      input: |
        /* @vis vegalite {"mark": "bar", "width": 100, "mark": "line"} */
        SELECT 1 AS a;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT 1 AS a"
        },
        "mark": "line",
        "width": 100
      }

  - name: vis_data_only
    script:
      input: |
        /* @vis vegalite {"data": {"url": "https://example.com/data.csv"}} */
        SELECT 1 AS a;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT 1 AS a"
        }
      }

  - name: vis_nested_data_kept
    script:
      input: |
        /* @vis vegalite {"layer": [{"mark": "bar"}, {"data": {"values": [{"y": 1}]}, "mark": "rule"}]} */
        SELECT 1 AS a;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT 1 AS a"
        },
        "layer": [
          {
            "mark": "bar"
          },
          {
            "data": {
              "values": [
                {
                  "y": 1
                }
              ]
            },
            "mark": "rule"
          }
        ]
      }

  - name: vis_field_object_kept
    script:
      input: |
        /* @vis vegalite {"repeat": ["a", "b"], "spec": {"mark": "bar", "encoding": {"x": {"field": {"repeat": "repeat"}}}}} */
        SELECT 1 AS a, 2 AS b;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT 1 AS a, 2 AS b"
        },
        "repeat": [
          "a",
          "b"
        ],
        "spec": {
          "mark": "bar",
          "encoding": {
            "x": {
              "field": {
                "repeat": "repeat"
              }
            }
          }
        }
      }

  - name: vis_block_comment_end_in_line_comment
    script:
      input: |
        -- @vis vegalite {"title": "a */ b", "mark": "bar"}
        SELECT 1 AS a;
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT 1 AS a"
        },
        "title": "a */ b",
        "mark": "bar"
      }
