visualize-snapshots:
  # The spec of the tag is passed through, the statement is its data
  - name: vis_encoding
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp);
    script:
      input: |
        /* @vis vegalite
           {
             "mark": {"type": "line", "point": true},
             "encoding": {
               "x": {"field": "date", "type": "temporal", "timeUnit": "month"},
               "y": {"field": "revenue", "type": "quantitative", "aggregate": "sum"},
               "color": {"field": "category", "type": "nominal"}
             }
           }
        */
        SELECT category, revenue, date FROM sales WHERE revenue > 0;

  # Every Vega-Lite property is kept, also those DashQL does not know
  - name: vis_layers_and_transforms
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp);
    script:
      input: |
        /* @vis vegalite
           {
             "title": "Revenue",
             "transform": [{"calculate": "datum.revenue * 2", "as": "double"}],
             "layer": [
               {"mark": "bar", "encoding": {"x": {"field": "category"}, "y": {"field": "double"}}},
               {"mark": {"type": "rule", "color": "red"}, "encoding": {"y": {"aggregate": "mean", "field": "double"}}}
             ],
             "resolve": {"scale": {"y": "independent"}},
             "config": {"view": {"stroke": null}}
           }
        */
        SELECT category, revenue FROM sales;

  # The data of the tag is replaced by the statement
  - name: vis_data_replaced
    script:
      input: |
        /* @vis vegalite {"data": {"values": [{"a": 1}]}, "mark": "point"} */
        SELECT 1 AS a;

  # The board tag places the chart
  - name: vis_board
    script:
      input: |
        /* @vis vegalite {"mark": "bar"}
           @board row=1 width=12 height=4 */
        SELECT 1 AS a;
    dashboard:
      row: 1
      width: 12
      height: 4

  # A field that is no output column is a warning, the spec is passed through unchanged
  - name: vis_unknown_field_passed_through
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp);
    script:
      input: |
        /* @vis vegalite {"mark": "bar", "encoding": {"x": {"field": "region"}, "y": {"field": "revenue"}}} */
        SELECT category, revenue FROM sales;

  # The column types do not shape the spec: no encoding is inferred from a timestamp, a number or a text column
  - name: vis_no_type_inference
    catalog:
      script:
        input: |-
          create table sales (category text, revenue int, date timestamp);
    script:
      input: |
        /* @vis vegalite {"mark": "line", "encoding": {"x": {"field": "date"}, "y": {"field": "revenue"}, "color": {"field": "category"}}} */
        SELECT date, revenue, category FROM sales;

  # Nested fields, fields with an index and names that the spec defines itself are kept as written
  - name: vis_nested_and_defined_fields
    script:
      input: |
        /* @vis vegalite
           {
             "transform": [
               {"fold": ["a", "b"], "as": ["key", "value"]},
               {"calculate": "datum.a * 2", "as": "twice"}
             ],
             "mark": "bar",
             "encoding": {
               "x": {"field": "key"},
               "y": {"field": "value"},
               "color": {"field": "info.kind"},
               "detail": {"field": "items[0]"},
               "size": {"field": "twice"}
             }
           }
        */
        SELECT 1 AS a, 2 AS b, 3 AS info, 4 AS items;

  # An empty object is a valid spec
  - name: vis_empty_object
    script:
      input: |
        /* @vis vegalite {} */
        SELECT 1 AS a;

  # A $schema of the spec replaces the default one in its place
  - name: vis_schema_override
    script:
      input: |
        /* @vis vegalite {"$schema": "https://vega.github.io/schema/vega-lite/v4.json", "mark": "tick"} */
        SELECT 1 AS a;

  # JSON values are printed anew: escapes resolve, numbers are normalized, non-ASCII text is kept
  - name: vis_json_values_reprinted
    script:
      input: |
        /* @vis vegalite
           {
             "title": "Umsatz \u20ac and café /\u002a total *\/",
             "description": "tab\there \"quoted\"",
             "mark": {"type": "bar", "opacity": 0.50, "size": 1e2, "cornerRadius": -0},
             "width": 400,
             "autosize": null,
             "config": {"axis": {"grid": false, "labelAngle": -45}}
           }
        */
        SELECT 1 AS a;

  # The data is the statement as written: a multi-line query with an inner comment, without the semicolon
  - name: vis_sql_text_multiline
    script:
      input: |
        /* @vis vegalite {"mark": "bar"} */
        SELECT category, /* the measure */ sum(revenue) AS revenue
          FROM sales
         GROUP BY category;

  # A query with a CTE is visualized as a whole
  - name: vis_with_cte
    script:
      input: |
        /* @vis vegalite {"mark": "bar", "encoding": {"x": {"field": "k"}, "y": {"field": "n"}}} */
        WITH counts AS (SELECT 1 AS k, 2 AS n)
        SELECT k, n FROM counts;

  # A set operation exposes the columns of its left input
  - name: vis_union
    script:
      input: |
        /* @vis vegalite {"mark": "point", "encoding": {"x": {"field": "x"}}} */
        SELECT 1 AS x UNION ALL SELECT 2;

  # A star over an unknown table hides the columns, any field is fine
  - name: vis_star_unknown_table
    script:
      input: |
        /* @vis vegalite {"mark": "bar", "encoding": {"x": {"field": "anything"}}} */
        SELECT * FROM unknown_table;

  # The data is JSON-escaped: quotes, a quoted name, a backslash, a tab and non-ASCII text
  - name: vis_sql_text_escaped
    script:
      input: |
        /* @vis vegalite {"mark": "text"} */
        SELECT 'say "hi"' AS "Quoted Name", 'C:\temp	x' AS path, 'Grüße 日本' AS t;

  # A line comment at the end of the query is not part of its text
  - name: vis_sql_text_trailing_line_comment
    script:
      input: |
        /* @vis vegalite {"mark": "bar"} */
        SELECT 1 AS a -- the measure
        ;

  # A key written twice: the last value wins, in the place of the first key
  - name: vis_duplicate_json_keys
    script:
      input: |
        /* @vis vegalite {"mark": "bar", "width": 100, "mark": "line"} */
        SELECT 1 AS a;

  # A spec that only has data is the empty spec after the data is dropped
  - name: vis_data_only
    script:
      input: |
        /* @vis vegalite {"data": {"url": "https://example.com/data.csv"}} */
        SELECT 1 AS a;

  # Only the data at the top of the spec is replaced, the data of a layer is kept
  - name: vis_nested_data_kept
    script:
      input: |
        /* @vis vegalite {"layer": [{"mark": "bar"}, {"data": {"values": [{"y": 1}]}, "mark": "rule"}]} */
        SELECT 1 AS a;

  # A field that is no string (a repeat reference) is kept as written
  - name: vis_field_object_kept
    script:
      input: |
        /* @vis vegalite {"repeat": ["a", "b"], "spec": {"mark": "bar", "encoding": {"x": {"field": {"repeat": "repeat"}}}}} */
        SELECT 1 AS a, 2 AS b;

  # In line comments, the end of a block comment inside a JSON string is text
  - name: vis_block_comment_end_in_line_comment
    script:
      input: |
        -- @vis vegalite {"title": "a */ b", "mark": "bar"}
        SELECT 1 AS a;
