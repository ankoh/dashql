visualize-snapshots:

  - name: board_default
    script:
      input: |
        /* @vis vegalite {"mark": "bar"} */
        SELECT 1 AS a;
    dashboard:
      width: 6
      height: 6
    vegalite: |-
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {
          "$sql": "SELECT 1 AS a"
        },
        "mark": "bar"
      }

