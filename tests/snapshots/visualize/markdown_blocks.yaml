visualize-snapshots:

  - name: vis_markdown_code_blocks
    script:
      input: |
        /* @vis markdown
           ```sql extra
           select {{author}};
           ```

               indented code

           ---

           done
        */
        SELECT 'Ada' AS author;
    markdown:
      template: |-
        ```sql extra
        select {{author}};
        ```

            indented code

        ---

        done
      fields:
        - author
      document:
        type: document
        children:
          - type: codeBlock
            language: sql
            children:
              - type: text
                value: "select "
              - type: field
                field: author
              - type: text
                value: ";\n"
          - type: codeBlock
            children:
              - type: text
                value: "indented code\n"
          - type: thematicBreak
          - type: paragraph
            children:
              - type: text
                value: done

  - name: vis_markdown_lists
    script:
      input: |
        /* @vis markdown
           - tight {{author}}
           - items
             - nested

           3. loose

           4. {{n}}

           * star
        */
        SELECT 'Ada' AS author, 3 AS n;
    markdown:
      template: |-
        - tight {{author}}
        - items
          - nested

        3. loose

        4. {{n}}

        * star
      fields:
        - author
        - n
      document:
        type: document
        children:
          - type: list
            ordered: false
            tight: true
            children:
              - type: listItem
                children:
                  - type: text
                    value: "tight "
                  - type: field
                    field: author
              - type: listItem
                children:
                  - type: text
                    value: items
                  - type: list
                    ordered: false
                    tight: true
                    children:
                      - type: listItem
                        children:
                          - type: text
                            value: nested
          - type: list
            ordered: true
            tight: false
            start: 3
            children:
              - type: listItem
                children:
                  - type: paragraph
                    children:
                      - type: text
                        value: loose
              - type: listItem
                children:
                  - type: paragraph
                    children:
                      - type: field
                        field: n
          - type: list
            ordered: false
            tight: true
            children:
              - type: listItem
                children:
                  - type: text
                    value: star

  - name: vis_markdown_inline
    script:
      input: |
        /* @vis markdown
           Some *emphasis*, **strong**, _under_ and ![image](https://example.com/a.png "Title") by {{author}}.\
           Hard break and <b>inline html</b> and <https://example.com> and <me@example.com>.

           [relative](/docs) [mail](mailto:a@example.com) [field title](https://example.com "{{author}}")
        */
        SELECT 'Ada' AS author;
    markdown:
      template: |-
        Some *emphasis*, **strong**, _under_ and ![image](https://example.com/a.png "Title") by {{author}}.\
        Hard break and <b>inline html</b> and <https://example.com> and <me@example.com>.

        [relative](/docs) [mail](mailto:a@example.com) [field title](https://example.com "{{author}}")
      fields:
        - author
      document:
        type: document
        children:
          - type: paragraph
            children:
              - type: text
                value: "Some "
              - type: emphasis
                children:
                  - type: text
                    value: emphasis
              - type: text
                value: ", "
              - type: strong
                children:
                  - type: text
                    value: strong
              - type: text
                value: ", "
              - type: emphasis
                children:
                  - type: text
                    value: under
              - type: text
                value: " and "
              - type: image
                url: 'https://example.com/a.png'
                title: Title
                children:
                  - type: text
                    value: image
              - type: text
                value: " by "
              - type: field
                field: author
              - type: text
                value: .
              - type: hardBreak
              - type: text
                value: "Hard break and inline html and "
              - type: link
                url: 'https://example.com'
                children:
                  - type: text
                    value: 'https://example.com'
              - type: text
                value: " and "
              - type: link
                url: 'mailto:me@example.com'
                children:
                  - type: text
                    value: me@example.com
              - type: text
                value: .
          - type: paragraph
            children:
              - type: link
                url: /docs
                children:
                  - type: text
                    value: relative
              - type: text
                value: " "
              - type: link
                url: 'mailto:a@example.com'
                children:
                  - type: text
                    value: mail
              - type: text
                value: " "
              - type: link
                url: 'https://example.com'
                children:
                  - type: text
                    value: field title

  - name: vis_markdown_headings_quotes
    script:
      input: |
        /* @vis markdown
           # One

           ## Two {{author}}

           ###### Six

           Setext
           ======

           > quote
           > > nested {{author}}
        */
        SELECT 'Ada' AS author;
    markdown:
      template: |-
        # One

        ## Two {{author}}

        ###### Six

        Setext
        ======

        > quote
        > > nested {{author}}
      fields:
        - author
      document:
        type: document
        children:
          - type: heading
            level: 1
            children:
              - type: text
                value: One
          - type: heading
            level: 2
            children:
              - type: text
                value: "Two "
              - type: field
                field: author
          - type: heading
            level: 6
            children:
              - type: text
                value: Six
          - type: heading
            level: 1
            children:
              - type: text
                value: Setext
          - type: blockquote
            children:
              - type: paragraph
                children:
                  - type: text
                    value: quote
              - type: blockquote
                children:
                  - type: paragraph
                    children:
                      - type: text
                        value: "nested "
                      - type: field
                        field: author

  - name: vis_markdown_only_fields
    script:
      input: |
        /* @vis markdown
           {{author}}{{n}}{{missing}}
        */
        SELECT 'Ada' AS author, 1 AS n;
    markdown:
      template: '{{author}}{{n}}{{missing}}'
      fields:
        - author
        - n
        - missing
      document:
        type: document
        children:
          - type: paragraph
            children:
              - type: field
                field: author
              - type: field
                field: n
              - type: field
                field: missing

  - name: vis_markdown_link_schemes
    script:
      input: |
        /* @vis markdown
           [a](HTTPS://example.com) [b](./rel?x=1) [c](#anchor) [d](//host/path) [e](a/b:c)
           [f](JaVaScRiPt:alert(1)) [g](data:text/html,x) [h](vbscript:x) [i](ftp://host) [j](<java script:x>)
        */
        SELECT 1 AS a;
    markdown:
      template: |-
        [a](HTTPS://example.com) [b](./rel?x=1) [c](#anchor) [d](//host/path) [e](a/b:c)
        [f](JaVaScRiPt:alert(1)) [g](data:text/html,x) [h](vbscript:x) [i](ftp://host) [j](<java script:x>)
      fields: []
      document:
        type: document
        children:
          - type: paragraph
            children:
              - type: link
                url: 'HTTPS://example.com'
                children:
                  - type: text
                    value: a
              - type: text
                value: " "
              - type: link
                url: ./rel?x=1
                children:
                  - type: text
                    value: b
              - type: text
                value: " "
              - type: link
                url: '#anchor'
                children:
                  - type: text
                    value: c
              - type: text
                value: " "
              - type: link
                url: //host/path
                children:
                  - type: text
                    value: d
              - type: text
                value: " "
              - type: link
                url: 'a/b:c'
                children:
                  - type: text
                    value: e
              - type: text
                value: "\n"
              - type: span
                children:
                  - type: text
                    value: f
              - type: text
                value: " "
              - type: span
                children:
                  - type: text
                    value: g
              - type: text
                value: " "
              - type: span
                children:
                  - type: text
                    value: h
              - type: text
                value: " "
              - type: span
                children:
                  - type: text
                    value: i
              - type: text
                value: " "
              - type: span
                children:
                  - type: text
                    value: j

  - name: vis_markdown_images_references
    script:
      input: |
        /* @vis markdown
           ![logo](https://example.com/{{a}}.png) ![bad](javascript:x "t")

           [ok][r1] [bad][r2]

           [r1]: https://example.com "Ref"
           [r2]: javascript:alert(1)
        */
        SELECT 1 AS a;
    markdown:
      template: |-
        ![logo](https://example.com/{{a}}.png) ![bad](javascript:x "t")

        [ok][r1] [bad][r2]

        [r1]: https://example.com "Ref"
        [r2]: javascript:alert(1)
      fields:
        - a
      document:
        type: document
        children:
          - type: paragraph
            children:
              - type: span
                children:
                  - type: text
                    value: logo
              - type: text
                value: " "
              - type: span
                children:
                  - type: text
                    value: bad
          - type: paragraph
            children:
              - type: link
                url: 'https://example.com'
                title: Ref
                children:
                  - type: text
                    value: ok
              - type: text
                value: " "
              - type: span
                children:
                  - type: text
                    value: bad

  - name: vis_markdown_html_block
    script:
      input: |
        /* @vis markdown
           <div class="x">
           {{a}}
           </div>

           <!-- note -->

           after {{a}}
        */
        SELECT 1 AS a;
    markdown:
      template: |-
        <div class="x">
        {{a}}
        </div>

        <!-- note -->

        after {{a}}
      fields:
        - a
      document:
        type: document
        children:
          - type: paragraph
            children:
              - type: text
                value: "after "
              - type: field
                field: a

  - name: vis_markdown_list_starts
    script:
      input: |
        /* @vis markdown
           7. seven
           8. eight

           0) zero
        */
        SELECT 1 AS a;
    markdown:
      template: |-
        7. seven
        8. eight

        0) zero
      fields: []
      document:
        type: document
        children:
          - type: list
            ordered: true
            tight: true
            start: 7
            children:
              - type: listItem
                children:
                  - type: text
                    value: seven
              - type: listItem
                children:
                  - type: text
                    value: eight
          - type: list
            ordered: true
            tight: true
            start: 0
            children:
              - type: listItem
                children:
                  - type: text
                    value: zero

  - name: vis_markdown_extensions_disabled
    script:
      input: |
        /* @vis markdown
           | name | value |
           | ---- | ----- |
           | {{a}} | 1 |

           ~~gone~~ - [ ] todo [^1]

           [^1]: note
        */
        SELECT 1 AS a;
    markdown:
      template: |-
        | name | value |
        | ---- | ----- |
        | {{a}} | 1 |

        ~~gone~~ - [ ] todo [^1]

        [^1]: note
      fields:
        - a
      document:
        type: document
        children:
          - type: paragraph
            children:
              - type: text
                value: "| name | value |\n| ---- | ----- |\n| "
              - type: field
                field: a
              - type: text
                value: " | 1 |"
          - type: paragraph
            children:
              - type: text
                value: "~~gone~~ - [ ] todo "
              - type: link
                url: note
                children:
                  - type: text
                    value: ^1

  - name: vis_markdown_field_in_alt_and_html
    script:
      input: |
        /* @vis markdown
           ![{{a}} logo](https://example.com/a.png) <span class="x">{{b}}</span>
        */
        SELECT 1 AS a, 2 AS b;
    markdown:
      template: '![{{a}} logo](https://example.com/a.png) <span class="x">{{b}}</span>'
      fields:
        - a
        - b
      document:
        type: document
        children:
          - type: paragraph
            children:
              - type: image
                url: 'https://example.com/a.png'
                children:
                  - type: field
                    field: a
                  - type: text
                    value: " logo"
              - type: text
                value: " "
              - type: field
                field: b

  - name: vis_markdown_field_in_code_info
    script:
      input: |
        /* @vis markdown
           # Title {#{{id}}}

           ```{{lang}} rest
           code {{a}}
           ```
        */
        SELECT 1 AS a, 'sql' AS lang, 'x' AS id;
    markdown:
      template: |-
        # Title {#{{id}}}

        ```{{lang}} rest
        code {{a}}
        ```
      fields:
        - id
        - lang
        - a
      document:
        type: document
        children:
          - type: heading
            level: 1
            children:
              - type: text
                value: 'Title {#'
              - type: field
                field: id
              - type: text
                value: '}'
          - type: codeBlock
            children:
              - type: text
                value: "code "
              - type: field
                field: a
              - type: text
                value: "\n"

  - name: vis_markdown_autolinks
    script:
      input: |
        /* @vis markdown
           <HTTP://EXAMPLE.COM/x> <javascript:alert(1)> <ftp://host/x> <a.b@example.com>
        */
        SELECT 1 AS a;
    markdown:
      template: '<HTTP://EXAMPLE.COM/x> <javascript:alert(1)> <ftp://host/x> <a.b@example.com>'
      fields: []
      document:
        type: document
        children:
          - type: paragraph
            children:
              - type: link
                url: 'HTTP://EXAMPLE.COM/x'
                children:
                  - type: text
                    value: 'HTTP://EXAMPLE.COM/x'
              - type: text
                value: " "
              - type: span
                children:
                  - type: text
                    value: 'javascript:alert(1)'
              - type: text
                value: " "
              - type: span
                children:
                  - type: text
                    value: 'ftp://host/x'
              - type: text
                value: " "
              - type: link
                url: 'mailto:a.b@example.com'
                children:
                  - type: text
                    value: a.b@example.com

  - name: vis_markdown_image_in_link
    script:
      input: |
        /* @vis markdown
           [![{{a}}](https://example.com/a.png)](https://example.com/{{b}})
           [![logo](https://example.com/b.png "Logo")](https://example.com)
        */
        SELECT 1 AS a, 2 AS b;
    markdown:
      template: |-
        [![{{a}}](https://example.com/a.png)](https://example.com/{{b}})
        [![logo](https://example.com/b.png "Logo")](https://example.com)
      fields:
        - a
        - b
      document:
        type: document
        children:
          - type: paragraph
            children:
              - type: span
                children:
                  - type: image
                    url: 'https://example.com/a.png'
                    children:
                      - type: field
                        field: a
              - type: text
                value: "\n"
              - type: link
                url: 'https://example.com'
                children:
                  - type: image
                    url: 'https://example.com/b.png'
                    title: Logo
                    children:
                      - type: text
                        value: logo

  - name: vis_markdown_setext_h2_and_rules
    script:
      input: |
        /* @vis markdown
           Title {{a}}
           ---

           ***

           ___
        */
        SELECT 1 AS a;
    markdown:
      template: |-
        Title {{a}}
        ---

        ***

        ___
      fields:
        - a
      document:
        type: document
        children:
          - type: heading
            level: 2
            children:
              - type: text
                value: "Title "
              - type: field
                field: a
          - type: thematicBreak
          - type: thematicBreak

  - name: vis_markdown_indented_code_and_quoted_list
    script:
      input: |
        /* @vis markdown
           Code:

               let x = {{a}};

           > - {{b}}
           > - two
        */
        SELECT 1 AS a, 2 AS b;
    markdown:
      template: |-
        Code:

            let x = {{a}};

        > - {{b}}
        > - two
      fields:
        - a
        - b
      document:
        type: document
        children:
          - type: paragraph
            children:
              - type: text
                value: 'Code:'
          - type: codeBlock
            children:
              - type: text
                value: "let x = "
              - type: field
                field: a
              - type: text
                value: ";\n"
          - type: blockquote
            children:
              - type: list
                ordered: false
                tight: true
                children:
                  - type: listItem
                    children:
                      - type: field
                        field: b
                  - type: listItem
                    children:
                      - type: text
                        value: two
