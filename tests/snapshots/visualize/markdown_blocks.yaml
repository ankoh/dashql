visualize-snapshots:

  - name: vis_markdown_code_blocks
    script:
      input: |
        /* @vis markdown
           ```sql extra
           select {{author}};
           ```

               indented code

           ---

           done
        */
        SELECT 'Ada' AS author;
    markdown:
      template: |-
        ```sql extra
        select {{author}};
        ```

            indented code

        ---

        done
      fields:
        - author
      document:
        type: document
        children:
          - type: codeBlock
            language: sql
            children:
              - type: text
                value: "select "
              - type: field
                field: author
              - type: text
                value: ";\n"
          - type: codeBlock
            children:
              - type: text
                value: "indented code\n"
          - type: thematicBreak
          - type: paragraph
            children:
              - type: text
                value: done

  - name: vis_markdown_lists
    script:
      input: |
        /* @vis markdown
           - tight {{author}}
           - items
             - nested

           3. loose

           4. {{n}}

           * star
        */
        SELECT 'Ada' AS author, 3 AS n;
    markdown:
      template: |-
        - tight {{author}}
        - items
          - nested

        3. loose

        4. {{n}}

        * star
      fields:
        - author
        - n
      document:
        type: document
        children:
          - type: list
            ordered: false
            tight: true
            children:
              - type: listItem
                children:
                  - type: text
                    value: "tight "
                  - type: field
                    field: author
              - type: listItem
                children:
                  - type: text
                    value: items
                  - type: list
                    ordered: false
                    tight: true
                    children:
                      - type: listItem
                        children:
                          - type: text
                            value: nested
          - type: list
            ordered: true
            tight: false
            start: 3
            children:
              - type: listItem
                children:
                  - type: paragraph
                    children:
                      - type: text
                        value: loose
              - type: listItem
                children:
                  - type: paragraph
                    children:
                      - type: field
                        field: n
          - type: list
            ordered: false
            tight: true
            children:
              - type: listItem
                children:
                  - type: text
                    value: star

  - name: vis_markdown_inline
    script:
      input: |
        /* @vis markdown
           Some *emphasis*, **strong**, _under_ and ![image](https://example.com/a.png "Title") by {{author}}.\
           Hard break and <b>inline html</b> and <https://example.com> and <me@example.com>.

           [relative](/docs) [mail](mailto:a@example.com) [field title](https://example.com "{{author}}")
        */
        SELECT 'Ada' AS author;
    markdown:
      template: |-
        Some *emphasis*, **strong**, _under_ and ![image](https://example.com/a.png "Title") by {{author}}.\
        Hard break and <b>inline html</b> and <https://example.com> and <me@example.com>.

        [relative](/docs) [mail](mailto:a@example.com) [field title](https://example.com "{{author}}")
      fields:
        - author
      document:
        type: document
        children:
          - type: paragraph
            children:
              - type: text
                value: "Some "
              - type: emphasis
                children:
                  - type: text
                    value: emphasis
              - type: text
                value: ", "
              - type: strong
                children:
                  - type: text
                    value: strong
              - type: text
                value: ", "
              - type: emphasis
                children:
                  - type: text
                    value: under
              - type: text
                value: " and "
              - type: image
                url: 'https://example.com/a.png'
                title: Title
                children:
                  - type: text
                    value: image
              - type: text
                value: " by "
              - type: field
                field: author
              - type: text
                value: .
              - type: hardBreak
              - type: text
                value: "Hard break and inline html and "
              - type: link
                url: 'https://example.com'
                children:
                  - type: text
                    value: 'https://example.com'
              - type: text
                value: " and "
              - type: link
                url: 'mailto:me@example.com'
                children:
                  - type: text
                    value: me@example.com
              - type: text
                value: .
          - type: paragraph
            children:
              - type: link
                url: /docs
                children:
                  - type: text
                    value: relative
              - type: text
                value: " "
              - type: link
                url: 'mailto:a@example.com'
                children:
                  - type: text
                    value: mail
              - type: text
                value: " "
              - type: link
                url: 'https://example.com'
                children:
                  - type: text
                    value: field title

  - name: vis_markdown_headings_quotes
    script:
      input: |
        /* @vis markdown
           # One

           ## Two {{author}}

           ###### Six

           Setext
           ======

           > quote
           > > nested {{author}}
        */
        SELECT 'Ada' AS author;
    markdown:
      template: |-
        # One

        ## Two {{author}}

        ###### Six

        Setext
        ======

        > quote
        > > nested {{author}}
      fields:
        - author
      document:
        type: document
        children:
          - type: heading
            level: 1
            children:
              - type: text
                value: One
          - type: heading
            level: 2
            children:
              - type: text
                value: "Two "
              - type: field
                field: author
          - type: heading
            level: 6
            children:
              - type: text
                value: Six
          - type: heading
            level: 1
            children:
              - type: text
                value: Setext
          - type: blockquote
            children:
              - type: paragraph
                children:
                  - type: text
                    value: quote
              - type: blockquote
                children:
                  - type: paragraph
                    children:
                      - type: text
                        value: "nested "
                      - type: field
                        field: author

  - name: vis_markdown_only_fields
    script:
      input: |
        /* @vis markdown
           {{author}}{{n}}{{missing}}
        */
        SELECT 'Ada' AS author, 1 AS n;
    markdown:
      template: '{{author}}{{n}}{{missing}}'
      fields:
        - author
        - n
        - missing
      document:
        type: document
        children:
          - type: paragraph
            children:
              - type: field
                field: author
              - type: field
                field: n
              - type: field
                field: missing

  - name: vis_markdown_link_schemes
    script:
      input: |
        /* @vis markdown
           [a](HTTPS://example.com) [b](./rel?x=1) [c](#anchor) [d](//host/path) [e](a/b:c)
           [f](JaVaScRiPt:alert(1)) [g](data:text/html,x) [h](vbscript:x) [i](ftp://host) [j](<java script:x>)
        */
        SELECT 1 AS a;
    markdown:
      template: |-
        [a](HTTPS://example.com) [b](./rel?x=1) [c](#anchor) [d](//host/path) [e](a/b:c)
        [f](JaVaScRiPt:alert(1)) [g](data:text/html,x) [h](vbscript:x) [i](ftp://host) [j](<java script:x>)
      fields: []
      document:
        type: document
        children:
          - type: paragraph
            children:
              - type: link
                url: 'HTTPS://example.com'
                children:
                  - type: text
                    value: a
              - type: text
                value: " "
              - type: link
                url: ./rel?x=1
                children:
                  - type: text
                    value: b
              - type: text
                value: " "
              - type: link
                url: '#anchor'
                children:
                  - type: text
                    value: c
              - type: text
                value: " "
              - type: link
                url: //host/path
                children:
                  - type: text
                    value: d
              - type: text
                value: " "
              - type: link
                url: 'a/b:c'
                children:
                  - type: text
                    value: e
              - type: text
                value: "\n"
              - type: span
                children:
                  - type: text
                    value: f
              - type: text
                value: " "
              - type: span
                children:
                  - type: text
                    value: g
              - type: text
                value: " "
              - type: span
                children:
                  - type: text
                    value: h
              - type: text
                value: " "
              - type: span
                children:
                  - type: text
                    value: i
              - type: text
                value: " "
              - type: span
                children:
                  - type: text
                    value: j

  - name: vis_markdown_images_references
    script:
      input: |
        /* @vis markdown
           ![logo](https://example.com/{{a}}.png) ![bad](javascript:x "t")

           [ok][r1] [bad][r2]

           [r1]: https://example.com "Ref"
           [r2]: javascript:alert(1)
        */
        SELECT 1 AS a;
    markdown:
      template: |-
        ![logo](https://example.com/{{a}}.png) ![bad](javascript:x "t")

        [ok][r1] [bad][r2]

        [r1]: https://example.com "Ref"
        [r2]: javascript:alert(1)
      fields:
        - a
      document:
        type: document
        children:
          - type: paragraph
            children:
              - type: span
                children:
                  - type: text
                    value: logo
              - type: text
                value: " "
              - type: span
                children:
                  - type: text
                    value: bad
          - type: paragraph
            children:
              - type: link
                url: 'https://example.com'
                title: Ref
                children:
                  - type: text
                    value: ok
              - type: text
                value: " "
              - type: span
                children:
                  - type: text
                    value: bad

  - name: vis_markdown_html_block
    script:
      input: |
        /* @vis markdown
           <div class="x">
           {{a}}
           </div>

           <!-- note -->

           after {{a}}
        */
        SELECT 1 AS a;
    markdown:
      template: |-
        <div class="x">
        {{a}}
        </div>

        <!-- note -->

        after {{a}}
      fields:
        - a
      document:
        type: document
        children:
          - type: paragraph
            children:
              - type: text
                value: "after "
              - type: field
                field: a

  - name: vis_markdown_list_starts
    script:
      input: |
        /* @vis markdown
           7. seven
           8. eight

           0) zero
        */
        SELECT 1 AS a;
    markdown:
      template: |-
        7. seven
        8. eight

        0) zero
      fields: []
      document:
        type: document
        children:
          - type: list
            ordered: true
            tight: true
            start: 7
            children:
              - type: listItem
                children:
                  - type: text
                    value: seven
              - type: listItem
                children:
                  - type: text
                    value: eight
          - type: list
            ordered: true
            tight: true
            start: 0
            children:
              - type: listItem
                children:
                  - type: text
                    value: zero
