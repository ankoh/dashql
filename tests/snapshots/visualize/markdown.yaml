visualize-snapshots:

  - name: vis_markdown_rows
    catalog:
      script:
        input: |-
          create table product_summary (product text, revenue decimal, growth float);
        catalog-id: 1
        tables:
          - catalog-id: "256.65536.4294967296"
            name: product_summary
            text: "create tab..wth float)"
            columns:
              - catalog-id: "256.65536.4294967296.0"
                name: product
                text: "product text"
              - catalog-id: "256.65536.4294967296.1"
                name: revenue
                text: "revenue decimal"
              - catalog-id: "256.65536.4294967296.2"
                name: growth
                text: "growth float"
        touched-relations:
          - statement-id: 0
            name: product_summary
        errors: []
    script:
      input: |
        /* @vis markdown
           ## {{product}}

           **Revenue:** {{revenue}}

           **Growth:** {{growth}}
        */
        SELECT product, revenue, growth FROM product_summary;
    markdown:
      template: |-
        ## {{product}}

        **Revenue:** {{revenue}}

        **Growth:** {{growth}}
      fields:
        - product
        - revenue
        - growth
      document:
        type: document
        children:
          - type: heading
            level: 2
            children:
              - type: field
                field: product
          - type: paragraph
            children:
              - type: strong
                children:
                  - type: text
                    value: 'Revenue:'
              - type: text
                value: " "
              - type: field
                field: revenue
          - type: paragraph
            children:
              - type: strong
                children:
                  - type: text
                    value: 'Growth:'
              - type: text
                value: " "
              - type: field
                field: growth

  - name: vis_markdown_escaping
    script:
      input: |
        /* @vis markdown
           It's by {{ author }}. Repeated: {{author}}. Literal: {value}.
        */
        SELECT 'Ada' AS author;
    markdown:
      template: 'It''s by {{ author }}. Repeated: {{author}}. Literal: {value}.'
      fields:
        - author
      document:
        type: document
        children:
          - type: paragraph
            children:
              - type: text
                value: "It's by "
              - type: field
                field: author
              - type: text
                value: ". Repeated: "
              - type: field
                field: author
              - type: text
                value: '. Literal: {value}.'

  - name: vis_markdown_safe_ast
    script:
      input: |
        /* @vis markdown
           # Report

           > **Author:** {{author}}

           1. [Safe](https://example.com "Details")
           2. [Unsafe](javascript:alert(1))
           3. [Dynamic]({{author}})

           `{{author}}`

           <script>bad()</script>
        */
        SELECT 'Ada' AS author;
    markdown:
      template: |-
        # Report

        > **Author:** {{author}}

        1. [Safe](https://example.com "Details")
        2. [Unsafe](javascript:alert(1))
        3. [Dynamic]({{author}})

        `{{author}}`

        <script>bad()</script>
      fields:
        - author
      document:
        type: document
        children:
          - type: heading
            level: 1
            children:
              - type: text
                value: Report
          - type: blockquote
            children:
              - type: paragraph
                children:
                  - type: strong
                    children:
                      - type: text
                        value: 'Author:'
                  - type: text
                    value: " "
                  - type: field
                    field: author
          - type: list
            ordered: true
            tight: true
            start: 1
            children:
              - type: listItem
                children:
                  - type: link
                    url: 'https://example.com'
                    title: Details
                    children:
                      - type: text
                        value: Safe
              - type: listItem
                children:
                  - type: span
                    children:
                      - type: text
                        value: Unsafe
              - type: listItem
                children:
                  - type: span
                    children:
                      - type: text
                        value: Dynamic
          - type: paragraph
            children:
              - type: inlineCode
                children:
                  - type: field
                    field: author

  - name: vis_markdown_javadoc_gutter
    script:
      input: |
        /**
         * Metrics.
         *
         * @vis markdown
         * ### {{metric}}
         *
         * * first {{value}}
         * * second
         */
        SELECT 'm' AS metric, 1 AS value;
    markdown:
      template: |-
        ### {{metric}}

        * first {{value}}
        * second
      fields:
        - metric
        - value
      document:
        type: document
        children:
          - type: heading
            level: 3
            children:
              - type: field
                field: metric
          - type: list
            ordered: false
            tight: true
            children:
              - type: listItem
                children:
                  - type: text
                    value: "first "
                  - type: field
                    field: value
              - type: listItem
                children:
                  - type: text
                    value: second

  - name: vis_markdown_line_comments
    script:
      input: |
        -- @vis markdown
        -- # {{title}}
        -- body with */ inside
        SELECT 'x' AS title;
    markdown:
      template: |-
        # {{title}}
        body with */ inside
      fields:
        - title
      document:
        type: document
        children:
          - type: heading
            level: 1
            children:
              - type: field
                field: title
          - type: paragraph
            children:
              - type: text
                value: body with */ inside

  - name: vis_markdown_same_line
    script:
      input: |
        /* @vis markdown **{{a}}** of {{b}} */
        SELECT 1 AS a, 2 AS b;
    markdown:
      template: '**{{a}}** of {{b}}'
      fields:
        - a
        - b
      document:
        type: document
        children:
          - type: paragraph
            children:
              - type: strong
                children:
                  - type: field
                    field: a
              - type: text
                value: " of "
              - type: field
                field: b

  - name: vis_markdown_field_names
    script:
      input: |
        /* @vis markdown
           {{Author}} {{ Total Revenue }} {{info.kind}} {{missing}} {{
           split }}
        */
        SELECT 'Ada' AS author;
    markdown:
      template: |-
        {{Author}} {{ Total Revenue }} {{info.kind}} {{missing}} {{
        split }}
      fields:
        - Author
        - Total Revenue
        - info.kind
        - missing
        - split
      document:
        type: document
        children:
          - type: paragraph
            children:
              - type: field
                field: Author
              - type: text
                value: " "
              - type: field
                field: Total Revenue
              - type: text
                value: " "
              - type: field
                field: info.kind
              - type: text
                value: " "
              - type: field
                field: missing
              - type: text
                value: " "
              - type: field
                field: split

  - name: vis_markdown_brace_edges
    script:
      input: |
        /* @vis markdown
           Empty {{}} and {{  }}, single {a}, close }} first, {{a}} then unclosed {{a
        */
        SELECT 1 AS a;
    markdown:
      template: 'Empty {{}} and {{  }}, single {a}, close }} first, {{a}} then unclosed {{a'
      fields:
        - a
      document:
        type: document
        children:
          - type: paragraph
            children:
              - type: text
                value: "Empty {{}} and {{  }}, single {a}, close }} first, "
              - type: field
                field: a
              - type: text
                value: " then unclosed {{a"

  - name: vis_markdown_escapes_entities
    script:
      input: |
        /* @vis markdown
           \*not emphasis\* \# \[x\] &amp; &copy; &#35; &lt;b&gt; {{a}}&amp;
        */
        SELECT 1 AS a;
    markdown:
      template: '\*not emphasis\* \# \[x\] &amp; &copy; &#35; &lt;b&gt; {{a}}&amp;'
      fields:
        - a
      document:
        type: document
        children:
          - type: paragraph
            children:
              - type: text
                value: "*not emphasis* # [x] & © # <b> "
              - type: field
                field: a
              - type: text
                value: '&'

  - name: vis_markdown_fields_inline
    script:
      input: |
        /* @vis markdown
           # {{a}} and {{b}}

           *{{a}}* [see {{b}}](https://example.com/b)
        */
        SELECT 1 AS a, 2 AS b;
    markdown:
      template: |-
        # {{a}} and {{b}}

        *{{a}}* [see {{b}}](https://example.com/b)
      fields:
        - a
        - b
      document:
        type: document
        children:
          - type: heading
            level: 1
            children:
              - type: field
                field: a
              - type: text
                value: " and "
              - type: field
                field: b
          - type: paragraph
            children:
              - type: emphasis
                children:
                  - type: field
                    field: a
              - type: text
                value: " "
              - type: link
                url: 'https://example.com/b'
                children:
                  - type: text
                    value: "see "
                  - type: field
                    field: b
