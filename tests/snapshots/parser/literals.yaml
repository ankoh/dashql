parser-snapshots:

  - name: numeric_literal_forms
    input: |-
      select .5, 5., 1.5e10, 1E-3, 2e+2, 9223372036854775807, 9223372036854775808, 0.0
    expected:
      statements:
        - type: SELECT
          ast-begin: 0
          ast-size: 18
          description:
            text: "select .5,..75808, 0.0"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select .5,..75808, 0.0"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: ".5, 5., 1...75808, 0.0"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: ".5"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_FLOAT
                        text: ".5"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "5."
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_FLOAT
                        text: "5."
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "1.5e10"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_FLOAT
                        text: "1.5e10"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "1E-3"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_FLOAT
                        text: "1E-3"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "2e+2"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_FLOAT
                        text: "2e+2"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "9223372036854775807"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_INTEGER
                        text: "9223372036854775807"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "9223372036854775808"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_FLOAT
                        text: "9223372036854775808"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "0.0"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_FLOAT
                        text: "0.0"
      scanner-errors: []
      parser-errors: []
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []

  - name: numeric_literal_fails
    input: |-
      select 1e;
      select 1..2;
    expected:
      statements:
        - type: SELECT
          ast-begin: 0
          ast-size: 5
          description:
            text: "select 1e;"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select 1e"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "1e"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "1e"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_INTEGER
                        text: "1"
                      - key: SQL_RESULT_TARGET_NAME
                        type: NAME
                        text: "e"
      scanner-errors: []
      parser-errors:
        - message: 'syntax error, unexpected ".."'
          text: ".."
      line-breaks:
        - text: [10,11]
      comments: []
      comment-blocks: []
      comment-warnings: []

  - name: string_continuation
    input: |-
      select 'foo'
        'bar';
      select 'a' 'b';
    expected:
      statements:
        - type: SELECT
          ast-begin: 0
          ast-size: 4
          description:
            text: "select 'fo..'\n  'bar';"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select 'fo..o'\n  'bar'"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "'foo'\n  'bar'"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "'foo'\n  'bar'"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_STRING
                        text: "'foo'\n  'bar'"
      scanner-errors: []
      parser-errors:
        - message: 'syntax error, unexpected string ''b'''
          text: "'b'"
          hint: string literals cannot be used as identifiers here; use a double-quoted identifier instead
      line-breaks:
        - text: [12,13]
        - text: [21,22]
      comments: []
      comment-blocks: []
      comment-warnings: []

  - name: string_prefixes
    input: |-
      select E'a\tb', N'national', U&"d\0061t"
    expected:
      statements:
        - type: SELECT
          ast-begin: 0
          ast-size: 16
          description:
            text: "select E'a..&\"d\\0061t\""
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select E'a..&\"d\\0061t\""
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "E'a\\tb', N..&\"d\\0061t\""
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "E'a\\tb'"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: OBJECT_SQL_CONST_FUNCTION_CAST
                        text: "E'a\\tb'"
                        children:
                          - key: SQL_CONST_CAST_FUNC_NAME
                            type: ARRAY
                            text: "E"
                            children:
                              - type: NAME
                                text: "E"
                          - key: SQL_CONST_CAST_VALUE
                            type: LITERAL_STRING
                            text: "'a\\tb'"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "N'national'"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: OBJECT_SQL_CONST_FUNCTION_CAST
                        text: "N'national'"
                        children:
                          - key: SQL_CONST_CAST_FUNC_NAME
                            type: ARRAY
                            text: "N"
                            children:
                              - type: NAME
                                text: "N"
                          - key: SQL_CONST_CAST_VALUE
                            type: LITERAL_STRING
                            text: "'national'"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "U&\"d\\0061t\""
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: OBJECT_SQL_COLUMN_REF
                        text: "U&\"d\\0061t\""
                        children:
                          - key: SQL_COLUMN_REF_PATH
                            type: ARRAY
                            text: "U&\"d\\0061t\""
                            children:
                              - type: NAME
                                text: "U&\"d\\0061t\""
      scanner-errors: []
      parser-errors: []
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []

  - name: dollar_quoted_strings
    input: |-
      select $$it's$$, $fn$ a $$ b $fn$, $_x1$$_x1$, $ä$ü$ä$
    expected:
      statements:
        - type: SELECT
          ast-begin: 0
          ast-size: 10
          description:
            text: "select $$i..$ä$ü$ä$"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select $$i..$ä$ü$ä$"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "$$it's$$, ..$ä$ü$ä$"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "$$it's$$"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_STRING
                        text: "$$it's$$"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "$fn$ a $$ b $fn$"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_STRING
                        text: "$fn$ a $$ b $fn$"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "$_x1$$_x1$"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_STRING
                        text: "$_x1$$_x1$"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "$ä$ü$ä$"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_STRING
                        text: "$ä$ü$ä$"
      scanner-errors: []
      parser-errors: []
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []

  - name: obfuscated_literals
    input: |-
      select /*String(00A1)*/, /*Float(0B2C)*/, /*HexString(0003)*/, /*BitString(FFFF)*/, /*string(0001)*/ 1
    expected:
      statements:
        - type: SELECT
          ast-begin: 0
          ast-size: 12
          description:
            text: "select /*S..(0001)*/ 1"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select /*S..(0001)*/ 1"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "/*String(0..(0001)*/ 1"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "/*String(00A1)*/"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_STRING
                        text: "/*String(00A1)*/"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "/*Float(0B2C)*/"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_FLOAT
                        text: "/*Float(0B2C)*/"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "/*HexString(0003)*/"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_STRING
                        text: "/*HexString(0003)*/"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "/*BitString(FFFF)*/"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_STRING
                        text: "/*BitString(FFFF)*/"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "1"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_INTEGER
                        text: "1"
      scanner-errors: []
      parser-errors: []
      line-breaks: []
      comments:
        - text: "/*string(0001)*/"
      comment-blocks:
        - type: COMMENT
          text: "/*string(0001)*/"
          comments: [0,1]
          lines:
            - "string(0001)"
      comment-warnings: []

  - name: interval_literal_forms
    input: |-
      select interval '1' day to second, interval '1-2' year to month, interval 5 minute
    expected:
      statements:
        - type: SELECT
          ast-begin: 0
          ast-size: 17
          description:
            text: "select int..l 5 minute"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select int..l 5 minute"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "interval '..l 5 minute"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "interval '.. to second"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: OBJECT_SQL_CONST_INTERVAL_CAST
                        text: "interval '.. to second"
                        children:
                          - key: SQL_CONST_CAST_VALUE
                            type: LITERAL_STRING
                            text: "'1'"
                          - key: SQL_CONST_CAST_INTERVAL
                            type: OBJECT_SQL_INTERVAL_TYPE
                            text: "day to second"
                            children:
                              - key: SQL_INTERVAL_TYPE
                                type: ENUM_SQL_INTERVAL_TYPE
                                value: DAY_TO_SECOND
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "interval '..r to month"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: OBJECT_SQL_CONST_INTERVAL_CAST
                        text: "interval '..r to month"
                        children:
                          - key: SQL_CONST_CAST_VALUE
                            type: LITERAL_STRING
                            text: "'1-2'"
                          - key: SQL_CONST_CAST_INTERVAL
                            type: OBJECT_SQL_INTERVAL_TYPE
                            text: "year to month"
                            children:
                              - key: SQL_INTERVAL_TYPE
                                type: ENUM_SQL_INTERVAL_TYPE
                                value: YEAR_TO_MONTH
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "interval 5 minute"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: OBJECT_SQL_CONST_INTERVAL_CAST
                        text: "interval 5 minute"
                        children:
                          - key: SQL_CONST_CAST_VALUE
                            type: LITERAL_INTEGER
                            text: "5"
                          - key: SQL_CONST_CAST_INTERVAL
                            type: OBJECT_SQL_INTERVAL_TYPE
                            text: "minute"
                            children:
                              - key: SQL_INTERVAL_TYPE
                                type: ENUM_SQL_INTERVAL_TYPE
                                value: MINUTE
      scanner-errors: []
      parser-errors: []
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []
