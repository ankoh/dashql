parser-snapshots:
  # INSERT with DEFAULT VALUES
  - name: insert_default_values
    input: |
      insert into t default values
  # INSERT with a column list, VALUES and RETURNING
  - name: insert_values_returning
    input: |
      insert into s.t (a, b) values (1, 2), (3, 4) returning a, a * 2 as c
  # INSERT after a WITH clause
  - name: insert_with_cte
    input: |
      with src as (select 1 as a) insert into t (a) select a from src
  # DELETE with an alias, USING and RETURNING
  - name: delete_using_returning
    input: |
      delete from only t as x using u, v w where x.a = u.a and u.b = w.b returning *
  # Data-modifying statements as CTEs
  - name: cte_data_modifying
    input: |
      with d as (delete from t where a < 0 returning a),
           i as (insert into u select a from d returning a)
      select count(*) from i
  # INSERT ... ON CONFLICT DO NOTHING without a conflict target
  - name: insert_on_conflict_do_nothing
    input: |
      insert into t values (1, 2) on conflict do nothing
  # ON CONFLICT with index columns, an index predicate and DO UPDATE with a condition
  - name: insert_on_conflict_do_update
    input: |
      insert into t (a, b) values (1, 2)
      on conflict (a, b collate "C" desc) where a > 0
      do update set b = excluded.b + t.b, (c, d) = (excluded.c, 1) where t.b < excluded.b
      returning *
  # DO UPDATE with an explicit row, `(c) = (1)` would set no single column in PostgreSQL
  - name: insert_on_conflict_explicit_row
    input: |
      insert into t values (1, 2) on conflict (a) do update set (c) = row(excluded.c), (a, b) = row(default, 2)
  # ON CONFLICT with a constraint after a SELECT source and a WITH clause
  - name: insert_on_conflict_on_constraint
    input: |
      with src as (select 1 as a) insert into t select a from src join u on src.a = u.a on conflict on constraint t_pkey do nothing
  # UPDATE of an aliased table with FROM and WHERE
  - name: update_from_where
    input: |
      update t as x set a = u.a, b = default from u, v where x.id = u.id and u.id = v.id returning x.a
  # MERGE with conditions on the WHEN clauses, DO NOTHING and RETURNING
  - name: merge_conditions_do_nothing_returning
    input: |
      merge into t as x using u on x.id = u.id when matched and u.deleted then delete when matched then do nothing when not matched by source and x.a > 0 then update set a = 0 when not matched by target and u.a is not null then insert (a) values (u.a) when not matched then do nothing returning *
  # INSERT into a target with an alias
  - name: insert_target_alias
    input: |
      insert into t as x (a) values (1) on conflict (a) do update set a = x.a + 1 returning x.a
