parser-snapshots:

  - name: call_no_args
    input: |-
      CALL foo();
    expected:
      statements:
        - type: CALL
          ast-begin: 0
          ast-size: 3
          description:
            text: "CALL foo();"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_CALL
            text: "CALL foo()"
            children:
              - key: SQL_CALL_NAME
                type: ARRAY
                text: "foo"
                children:
                  - type: NAME
                    text: "foo"
      scanner-errors: []
      parser-errors: []
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []

  - name: call_positional_args
    input: |-
      CALL s.f('hello', 1, :param, (select 1));
    expected:
      statements:
        - type: CALL
          ast-begin: 0
          ast-size: 20
          description:
            text: "CALL s.f('..elect 1));"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_CALL
            text: "CALL s.f('..select 1))"
            children:
              - key: SQL_CALL_NAME
                type: ARRAY
                text: "s.f"
                children:
                  - type: NAME
                    text: "s"
                  - type: NAME
                    text: "f"
              - key: SQL_CALL_ARGS
                type: ARRAY
                text: "('hello', ..select 1))"
                children:
                  - type: OBJECT_SQL_FUNCTION_ARG
                    text: "'hello'"
                    children:
                      - key: SQL_FUNCTION_ARG_VALUE
                        type: LITERAL_STRING
                        text: "'hello'"
                  - type: OBJECT_SQL_FUNCTION_ARG
                    text: "1"
                    children:
                      - key: SQL_FUNCTION_ARG_VALUE
                        type: LITERAL_INTEGER
                        text: "1"
                  - type: OBJECT_SQL_FUNCTION_ARG
                    text: ":param"
                    children:
                      - key: SQL_FUNCTION_ARG_VALUE
                        type: OBJECT_SQL_PARAMETER_REF
                        text: ":param"
                        children:
                          - key: SQL_PARAMETER_PREFIX
                            type: OPERATOR
                            text: ":"
                          - key: SQL_PARAMETER_NAME
                            type: ARRAY
                            text: "param"
                            children:
                              - type: NAME
                                text: "param"
                  - type: OBJECT_SQL_FUNCTION_ARG
                    text: "(select 1)"
                    children:
                      - key: SQL_FUNCTION_ARG_VALUE
                        type: OBJECT_SQL_SELECT_EXPRESSION
                        text: "(select 1)"
                        children:
                          - key: SQL_SELECT_EXPRESSION_STATEMENT
                            type: OBJECT_SQL_SELECT
                            text: "(select 1)"
                            children:
                              - key: SQL_SELECT_TARGETS
                                type: ARRAY
                                text: "1"
                                children:
                                  - type: OBJECT_SQL_RESULT_TARGET
                                    text: "1"
                                    children:
                                      - key: SQL_RESULT_TARGET_VALUE
                                        type: LITERAL_INTEGER
                                        text: "1"
      scanner-errors: []
      parser-errors: []
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []

  - name: call_named_args
    input: |-
      CALL s.f(a => 1, b := 'x');
    expected:
      statements:
        - type: CALL
          ast-begin: 0
          ast-size: 11
          description:
            text: "CALL s.f(a..b := 'x');"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_CALL
            text: "CALL s.f(a.. b := 'x')"
            children:
              - key: SQL_CALL_NAME
                type: ARRAY
                text: "s.f"
                children:
                  - type: NAME
                    text: "s"
                  - type: NAME
                    text: "f"
              - key: SQL_CALL_ARGS
                type: ARRAY
                text: "(a => 1, b := 'x')"
                children:
                  - type: OBJECT_SQL_FUNCTION_ARG
                    text: "a => 1"
                    children:
                      - key: SQL_FUNCTION_ARG_NAME
                        type: NAME
                        text: "a"
                      - key: SQL_FUNCTION_ARG_VALUE
                        type: LITERAL_INTEGER
                        text: "1"
                  - type: OBJECT_SQL_FUNCTION_ARG
                    text: "b := 'x'"
                    children:
                      - key: SQL_FUNCTION_ARG_NAME
                        type: NAME
                        text: "b"
                      - key: SQL_FUNCTION_ARG_VALUE
                        type: LITERAL_STRING
                        text: "'x'"
      scanner-errors: []
      parser-errors: []
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []
