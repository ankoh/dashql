parser-snapshots:

  - name: create_table_as_select_1
    input: |-
      create view foo as select 1
    expected:
      statements:
        - type: CREATE_VIEW
          ast-begin: 0
          ast-size: 7
          description:
            text: "create vie..s select 1"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_VIEW
            text: "create vie..s select 1"
            children:
              - key: SQL_VIEW_NAME
                type: ARRAY
                text: "foo"
                children:
                  - type: NAME
                    text: "foo"
              - key: SQL_VIEW_STATEMENT
                type: OBJECT_SQL_SELECT
                text: "select 1"
                children:
                  - key: SQL_SELECT_TARGETS
                    type: ARRAY
                    text: "1"
                    children:
                      - type: OBJECT_SQL_RESULT_TARGET
                        text: "1"
                        children:
                          - key: SQL_RESULT_TARGET_VALUE
                            type: LITERAL_INTEGER
                            text: "1"
      scanner-errors: []
      parser-errors: []
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []

