parser-snapshots:

  - name: dot_test_space_ident
    input: |-
      select * from dbname. foo
    expected:
      statements:
        - type: SELECT
          ast-begin: 0
          ast-size: 9
          description:
            text: "select * f..bname. foo"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select * f..bname. foo"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "*"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "*"
                    children:
                      - key: SQL_RESULT_TARGET_STAR
                        type: BOOL
                        value: 1
              - key: SQL_SELECT_FROM
                type: ARRAY
                text: "from dbname. foo"
                children:
                  - type: OBJECT_SQL_TABLEREF
                    text: "dbname. foo"
                    children:
                      - key: SQL_TABLEREF_NAME
                        type: ARRAY
                        text: "dbname. foo"
                        children:
                          - type: NAME
                            text: "dbname"
                          - type: NAME
                            text: "foo"
      scanner-errors: []
      parser-errors: []
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []

  - name: dot_test_space_keyword
    input: |-
      select * from dbname.  where
    expected:
      statements:
        - type: SELECT
          ast-begin: 0
          ast-size: 9
          description:
            text: "select * f..me.  where"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select * f..me.  where"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "*"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "*"
                    children:
                      - key: SQL_RESULT_TARGET_STAR
                        type: BOOL
                        value: 1
              - key: SQL_SELECT_FROM
                type: ARRAY
                text: "from dbname.  where"
                children:
                  - type: OBJECT_SQL_TABLEREF
                    text: "dbname.  where"
                    children:
                      - key: SQL_TABLEREF_NAME
                        type: ARRAY
                        text: "dbname.  where"
                        children:
                          - type: NAME
                            text: "dbname"
                          - type: NAME
                            text: "where"
      scanner-errors: []
      parser-errors: []
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []

  - name: dot_test_eof
    input: |-
      select * from dbname.
    expected:
      statements:
        - type: SELECT
          ast-begin: 0
          ast-size: 9
          description:
            text: "select * f..om dbname."
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select * f..om dbname."
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "*"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "*"
                    children:
                      - key: SQL_RESULT_TARGET_STAR
                        type: BOOL
                        value: 1
              - key: SQL_SELECT_FROM
                type: ARRAY
                text: "from dbname."
                children:
                  - type: OBJECT_SQL_TABLEREF
                    text: "dbname."
                    children:
                      - key: SQL_TABLEREF_NAME
                        type: ARRAY
                        text: "dbname."
                        children:
                          - type: NAME
                            text: "dbname"
                          - type: OBJECT_EXT_TRAILING_DOT
                            text: "."
                            children: []
      scanner-errors: []
      parser-errors:
        - message: name has a trailing dot
          text: "."
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []

  - name: dot_where_recovery
    input: |-
      select * from dbname. where a = b
    expected:
      statements:
        - type: SELECT
          ast-begin: 0
          ast-size: 7
          description:
            text: "select * f..here a = b"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select * f..here a = b"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "* from dbn..here a = b"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "* from dbn..here a = b"
                    children:
                      - key: SQL_RESULT_TARGET_NAME
                        type: NAME
                        text: "b"
      scanner-errors: []
      parser-errors:
        - message: 'syntax error, unexpected EQUALS'
          text: "="
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []
