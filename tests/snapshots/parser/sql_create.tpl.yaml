parser-snapshots:
  # Parse CREATE TABLE ... AS SELECT
  - name: create_table_as_select_1
    input: |
      create table foo as select 1
  # Parse CREATE TABLE with single column
  - name: create_table_1
    input: |
      create table foo (a integer)
  # Parse CREATE TABLE with integer and tinyint columns
  - name: create_table_2
    input: |
      create table foo (a integer, b tinyint)
  # Parse CREATE TABLE with integer and varchar columns
  - name: create_table_3
    input: |
      create table foo (a integer, b varchar)
  # Parse CREATE TABLE IF NOT EXISTS
  - name: create_table_4
    input: |
      create table if not exists foo (a integer, b varchar)
  # Parse CREATE TABLE with two columns
  - name: create_table_5
    input: |
      create table foo (a integer, b varchar)
  # Parse CREATE TABLE with DEFERRABLE constraint
  - name: create_table_6
    input: |
      create table foo (a integer deferrable)
  # Parse CREATE TABLE with COLLATE on column
  - name: create_table_7
    input: |
      create table foo (a integer collate "de_DE")
  # Parse CREATE TEMPORARY TABLE
  - name: create_table_8
    input: |
      create temporary table foo (a integer)
  # Parse CREATE TABLE with column OPTIONS
  - name: create_table_9
    input: |
      create table foo (a integer options (ident 'thing2'))
  # Parse CREATE TABLE with named NOT NULL constraint
  - name: create_table_10
    input: |
      create table foo (a integer constraint a not null)
  # Parse CREATE TABLE with PRIMARY KEY
  - name: create_table_11
    input: |
      create table foo (a integer primary key)
  # Parse CREATE TABLE with NOT NULL DEFAULT
  - name: create_table_12
    input: |
      create table foo (a integer not null default 42)
  # Normalize the target of CREATE TABLE AS
  - name: create_table_as_qualified_target
    input: |
      create table analytics.results as select 1
  # Parse CREATE TABLE with constraints on existing indexes
  - name: create_table_constraints_using_index
    input: |
      create table foo (a integer, b integer, primary key using index foo_pkey, unique using index foo_b_key)
  # Parse the GLOBAL, LOCAL and UNLOGGED table kinds
  - name: create_table_temp_kinds
    input: |
      create global temporary table g (a int);
      create local temp table l (a int);
      create unlogged table u (a int);
  # Parse column constraints NULL, CHECK, UNIQUE and a negative default
  - name: create_table_column_constraints
    input: |
      create table t (a int null unique check (a > 0), b int default -1 not null)
  # Parse CREATE TABLE IF NOT EXISTS ... AS with a column list and WITH NO DATA
  - name: create_table_as_columns_no_data
    input: |
      create table if not exists t (a, b) as select 1, 2 with no data;
      create temp table u as select 1 with data;
  # Parse column REFERENCES with MATCH and key actions
  - name: create_table_column_references
    input: |
      create table t (a integer references u, b integer references u (x) match full on update cascade on delete set null, c integer references u match simple on delete restrict)
  # Parse a table FOREIGN KEY with constraint attributes, MATCH and key actions
  - name: create_table_foreign_key_attributes_match_actions
    input: |
      create table t (a integer, foreign key (a) references u (x) deferrable initially deferred match full on delete cascade on update no action)
  # Parse LIKE table elements with options
  - name: create_table_like
    input: |
      create table t (like u including defaults excluding constraints including all, a integer, like v)
  # Parse CREATE TABLE without elements
  - name: create_table_empty
    input: |
      create table t ()
