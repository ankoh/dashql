parser-snapshots:
  # Parse SET variable = value
  - name: set_1
    input: |
      SET variable = 'value';
  # Parse SET with nested map and array value
  - name: set_2
    input: |
      SET variable = (
        'some' = 42,
        'complex' = 'configuration',
        'with' = (
          'nesting' = true
        ),
        'andarrays' = [43, 44]
      );
  # Parse SET with function call in value
  - name: set_3
    input: |
      SET variable = (
        'some' = 42,
        'func' = somefunction(:someparam),
      );
  # SET with TO, with several values, and SET LOCAL and SET SESSION
  - name: set_to_values
    input: |
      SET search_path TO public, 'other';
      SET a.b = 'x', 2;
      SET LOCAL timezone TO 'UTC';
      SET SESSION enable_x TO on;
      SET ratio TO -1.5;
      SET a = b, 2;
  # SET to the default and from the current value
  - name: set_default_and_current
    input: |
      SET x TO DEFAULT;
      SET LOCAL y = DEFAULT;
      SET z FROM CURRENT;
  # SET TIME ZONE with every kind of zone value
  - name: set_time_zone
    input: |
      SET TIME ZONE 'Europe/Berlin';
      SET TIME ZONE utc;
      SET TIME ZONE INTERVAL '+02:00' HOUR TO MINUTE;
      SET TIME ZONE INTERVAL(3) '1:00';
      SET TIME ZONE -7;
      SET TIME ZONE DEFAULT;
      SET LOCAL TIME ZONE LOCAL;
  # SET of the session parameters with a syntax of their own
  - name: set_session_parameters
    input: |
      SET CATALOG 'c';
      SET SCHEMA 's';
      SET NAMES 'UTF8';
      SET NAMES DEFAULT;
      SET ROLE admin;
      SET SESSION AUTHORIZATION 'someone';
      SET SESSION AUTHORIZATION DEFAULT;
      SET TRANSACTION SNAPSHOT '00000003-0000001B-1';
  # SET TRANSACTION and SET SESSION CHARACTERISTICS
  - name: set_transaction
    input: |
      SET TRANSACTION ISOLATION LEVEL SERIALIZABLE, READ ONLY;
      SET SESSION CHARACTERISTICS AS TRANSACTION READ WRITE, NOT DEFERRABLE;
      SET LOCAL TRANSACTION DEFERRABLE;
  # RESET of a variable and of the session parameters
  - name: reset
    input: |
      RESET search_path;
      RESET a.b;
      RESET ALL;
      RESET ALL GLOBAL;
      RESET TIME ZONE;
      RESET TRANSACTION ISOLATION LEVEL;
      RESET SESSION AUTHORIZATION;
