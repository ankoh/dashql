          description:
            text: "insert int..ult values"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_INSERT
            text: "insert int..ult values"
            children:
              - key: SQL_INSERT_DEFAULT_VALUES
                type: BOOL
                value: 1
              - key: SQL_INSERT_TARGET
                type: OBJECT_SQL_TABLEREF
                text: "t"
