  - name: insert_values_returning
    input: |-
      insert into s.t (a, b) values (1, 2), (3, 4) returning a, a * 2 as c
    expected:
      statements:
        - type: INSERT
          ast-begin: 0
          ast-size: 30
          description:
            text: "insert int..a * 2 as c"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_INSERT
            text: "insert int..a * 2 as c"
            children:
              - key: SQL_INSERT_COLUMNS
                type: ARRAY
                text: "(a, b)"
                children:
                  - type: NAME
                    text: "a"
                  - type: NAME
                    text: "b"
              - key: SQL_INSERT_SOURCE
                type: OBJECT_SQL_SELECT
                text: "values (1,..2), (3, 4)"
                children:
                  - key: SQL_SELECT_VALUES
                    type: ARRAY
                    text: "values (1,..2), (3, 4)"
                    children:
                      - type: ARRAY
                        text: "1, 2"
                        children:
                          - type: LITERAL_INTEGER
                            text: "1"
                          - type: LITERAL_INTEGER
                            text: "2"
                      - type: ARRAY
                        text: "3, 4"
                        children:
                          - type: LITERAL_INTEGER
                            text: "3"
                          - type: LITERAL_INTEGER
                            text: "4"
              - key: SQL_INSERT_TARGET
                type: OBJECT_SQL_TABLEREF
                text: "s.t"
                children:
                  - key: SQL_TABLEREF_NAME
                    type: ARRAY
                    text: "s.t"
                    children:
                      - type: NAME
                        text: "s"
                      - type: NAME
                        text: "t"
              - key: SQL_INSERT_RETURNING
                type: ARRAY
                text: "a, a * 2 as c"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "a"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: OBJECT_SQL_COLUMN_REF
                        text: "a"
                        children:
                          - key: SQL_COLUMN_REF_PATH
                            type: ARRAY
                            text: "a"
                            children:
                              - type: NAME
                                text: "a"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "a * 2 as c"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: OBJECT_SQL_NARY_EXPRESSION
                        text: "a * 2"
                        children:
                          - key: SQL_EXPRESSION_OPERATOR
                            type: ENUM_SQL_EXPRESSION_OPERATOR
                            value: MULTIPLY
                          - key: SQL_EXPRESSION_ARGS
                            type: ARRAY
                            text: "a * 2"
                            children:
                              - type: OBJECT_SQL_COLUMN_REF
                                text: "a"
                                children:
                                  - key: SQL_COLUMN_REF_PATH
                                    type: ARRAY
                                    text: "a"
                                    children:
                                      - type: NAME
                                        text: "a"
                              - type: LITERAL_INTEGER
                                text: "2"
                      - key: SQL_RESULT_TARGET_NAME
                        type: NAME
                        text: "c"
      scanner-errors: []
      parser-errors: []
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []

