  - name: delete_using_returning
    input: |-
      delete from only t as x using u, v w where x.a = u.a and u.b = w.b returning *
    expected:
      statements:
        - type: DELETE
          ast-begin: 0
          ast-size: 42
          description:
            text: "delete fro..eturning *"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_DELETE
            text: "delete fro..eturning *"
            children:
              - key: SQL_DELETE_TARGET
                type: OBJECT_SQL_TABLEREF
                text: "only t as x"
                children:
                  - key: SQL_TABLEREF_NAME
                    type: ARRAY
                    text: "t"
                    children:
                      - type: NAME
                        text: "t"
                  - key: SQL_TABLEREF_ONLY
                    type: BOOL
                    value: 1
                  - key: SQL_TABLEREF_ALIAS
                    type: NAME
                    text: "x"
              - key: SQL_DELETE_USING
                type: ARRAY
                text: "u, v w"
                children:
                  - type: OBJECT_SQL_TABLEREF
                    text: "u"
                    children:
                      - key: SQL_TABLEREF_NAME
                        type: ARRAY
                        text: "u"
                        children:
                          - type: NAME
                            text: "u"
                  - type: OBJECT_SQL_TABLEREF
                    text: "v w"
                    children:
                      - key: SQL_TABLEREF_NAME
                        type: ARRAY
                        text: "v"
                        children:
                          - type: NAME
                            text: "v"
                      - key: SQL_TABLEREF_ALIAS
                        type: NAME
                        text: "w"
              - key: SQL_DELETE_WHERE
                type: OBJECT_SQL_NARY_EXPRESSION
                text: "x.a = u.a .. u.b = w.b"
                children:
                  - key: SQL_EXPRESSION_OPERATOR
                    type: ENUM_SQL_EXPRESSION_OPERATOR
                    value: AND
                  - key: SQL_EXPRESSION_ARGS
                    type: ARRAY
                    text: "x.a = u.a .. u.b = w.b"
                    children:
                      - type: OBJECT_SQL_NARY_EXPRESSION
                        text: "x.a = u.a"
                        children:
                          - key: SQL_EXPRESSION_OPERATOR
                            type: ENUM_SQL_EXPRESSION_OPERATOR
                            value: EQUAL
                          - key: SQL_EXPRESSION_ARGS
                            type: ARRAY
                            text: "x.a = u.a"
                            children:
                              - type: OBJECT_SQL_COLUMN_REF
                                text: "x.a"
                                children:
                                  - key: SQL_COLUMN_REF_PATH
                                    type: ARRAY
                                    text: "x.a"
                                    children:
                                      - type: NAME
                                        text: "x"
                                      - type: NAME
                                        text: "a"
                              - type: OBJECT_SQL_COLUMN_REF
                                text: "u.a"
                                children:
                                  - key: SQL_COLUMN_REF_PATH
                                    type: ARRAY
                                    text: "u.a"
                                    children:
                                      - type: NAME
                                        text: "u"
                                      - type: NAME
                                        text: "a"
                      - type: OBJECT_SQL_NARY_EXPRESSION
                        text: "u.b = w.b"
                        children:
                          - key: SQL_EXPRESSION_OPERATOR
                            type: ENUM_SQL_EXPRESSION_OPERATOR
                            value: EQUAL
                          - key: SQL_EXPRESSION_ARGS
                            type: ARRAY
                            text: "u.b = w.b"
                            children:
                              - type: OBJECT_SQL_COLUMN_REF
                                text: "u.b"
                                children:
