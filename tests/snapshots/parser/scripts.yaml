parser-snapshots:

  - name: empty_script
    input: |-
    expected:
      statements: []
      scanner-errors: []
      parser-errors: []
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []

  - name: whitespace_only_script
    input: |2-
      		
    expected:
      statements: []
      scanner-errors: []
      parser-errors: []
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []

  - name: comments_only_script
    input: |-
      /* a */
      -- b
    expected:
      statements: []
      scanner-errors: []
      parser-errors: []
      line-breaks:
        - text: [7,8]
      comments:
        - text: "/* a */"
        - text: "-- b"
      comment-blocks:
        - type: COMMENT
          text: "/* a */"
          comments: [0,1]
          lines:
            - "a"
        - type: COMMENT
          text: "-- b"
          comments: [1,1]
          lines:
            - "b"
      comment-warnings: []

  - name: empty_statements_and_comments
    input: |-
      ;/* x */;select 1;; -- y
      ;select 2
    expected:
      statements:
        - type: SELECT
          ast-begin: 0
          ast-size: 4
          description:
            text: "select 1;; -- y"
            description-begin: 0
            description-count: 1
            description-blocks: [0,1]
          ast:
            type: OBJECT_SQL_SELECT
            text: "select 1"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "1"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "1"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_INTEGER
                        text: "1"
        - type: SELECT
          ast-begin: 4
          ast-size: 4
          description:
            text: "select 2"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select 2"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "2"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "2"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_INTEGER
                        text: "2"
      scanner-errors: []
      parser-errors: []
      line-breaks:
        - text: [24,25]
      comments:
        - text: "/* x */"
        - text: "-- y"
      comment-blocks:
        - type: COMMENT
          text: "/* x */"
          comments: [0,1]
          lines:
            - "x"
        - type: COMMENT
          text: "-- y"
          comments: [1,1]
          lines:
            - "y"
      comment-warnings: []

  - name: unicode_whitespace
    input: |-
      ﻿select 1,　2 from t​x
    expected:
      statements:
        - type: SELECT
          ast-begin: 0
          ast-size: 11
          description:
            text: "select 1,..rom t​x"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select 1,..rom t​x"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "1,　2"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "1"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_INTEGER
                        text: "1"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "2"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: LITERAL_INTEGER
                        text: "2"
              - key: SQL_SELECT_FROM
                type: ARRAY
                text: "from t​x"
                children:
                  - type: OBJECT_SQL_TABLEREF
                    text: "t​x"
                    children:
                      - key: SQL_TABLEREF_NAME
                        type: ARRAY
                        text: "t"
                        children:
                          - type: NAME
                            text: "t"
                      - key: SQL_TABLEREF_ALIAS
                        type: NAME
                        text: "x"
      scanner-errors: []
      parser-errors: []
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []

  - name: unicode_identifiers
    input: |-
      select abc, def, größe, Größe, "Größe", 名前, _x1$, xyz_column from tabelle_ü as alias_name
    expected:
      statements:
        - type: SELECT
          ast-begin: 0
          ast-size: 39
          description:
            text: "select abc..alias_name"
            description-begin: 0
            description-count: 0
          ast:
            type: OBJECT_SQL_SELECT
            text: "select abc..alias_name"
            children:
              - key: SQL_SELECT_TARGETS
                type: ARRAY
                text: "abc, def, ..xyz_column"
                children:
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "abc"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: OBJECT_SQL_COLUMN_REF
                        text: "abc"
                        children:
                          - key: SQL_COLUMN_REF_PATH
                            type: ARRAY
                            text: "abc"
                            children:
                              - type: NAME
                                text: "abc"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "def"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: OBJECT_SQL_COLUMN_REF
                        text: "def"
                        children:
                          - key: SQL_COLUMN_REF_PATH
                            type: ARRAY
                            text: "def"
                            children:
                              - type: NAME
                                text: "def"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "größe"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: OBJECT_SQL_COLUMN_REF
                        text: "größe"
                        children:
                          - key: SQL_COLUMN_REF_PATH
                            type: ARRAY
                            text: "größe"
                            children:
                              - type: NAME
                                text: "größe"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "Größe"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: OBJECT_SQL_COLUMN_REF
                        text: "Größe"
                        children:
                          - key: SQL_COLUMN_REF_PATH
                            type: ARRAY
                            text: "Größe"
                            children:
                              - type: NAME
                                text: "Größe"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "\"Größe\""
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: OBJECT_SQL_COLUMN_REF
                        text: "\"Größe\""
                        children:
                          - key: SQL_COLUMN_REF_PATH
                            type: ARRAY
                            text: "\"Größe\""
                            children:
                              - type: NAME
                                text: "\"Größe\""
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "名前"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: OBJECT_SQL_COLUMN_REF
                        text: "名前"
                        children:
                          - key: SQL_COLUMN_REF_PATH
                            type: ARRAY
                            text: "名前"
                            children:
                              - type: NAME
                                text: "名前"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "_x1$"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: OBJECT_SQL_COLUMN_REF
                        text: "_x1$"
                        children:
                          - key: SQL_COLUMN_REF_PATH
                            type: ARRAY
                            text: "_x1$"
                            children:
                              - type: NAME
                                text: "_x1$"
                  - type: OBJECT_SQL_RESULT_TARGET
                    text: "xyz_column"
                    children:
                      - key: SQL_RESULT_TARGET_VALUE
                        type: OBJECT_SQL_COLUMN_REF
                        text: "xyz_column"
                        children:
                          - key: SQL_COLUMN_REF_PATH
                            type: ARRAY
                            text: "xyz_column"
                            children:
                              - type: NAME
                                text: "xyz_column"
              - key: SQL_SELECT_FROM
                type: ARRAY
                text: "from tabel..alias_name"
                children:
                  - type: OBJECT_SQL_TABLEREF
                    text: "tabelle_ü..alias_name"
                    children:
                      - key: SQL_TABLEREF_NAME
                        type: ARRAY
                        text: "tabelle_ü"
                        children:
                          - type: NAME
                            text: "tabelle_ü"
                      - key: SQL_TABLEREF_ALIAS
                        type: NAME
                        text: "alias_name"
      scanner-errors: []
      parser-errors: []
      line-breaks: []
      comments: []
      comment-blocks: []
      comment-warnings: []
