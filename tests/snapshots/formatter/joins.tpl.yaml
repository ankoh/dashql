formatter-snapshots:

  # Natural joins
  - name: join_natural
    input: select * from a natural join b
    dialects:
      hyper:
        validation:
          setup: |-
            create table a(x int);
            create table b(x int);

  - name: join_natural_left
    input: select * from a natural left join b
    dialects:
      hyper:
        validation:
          setup: |-
            create table a(x int);
            create table b(x int);

  - name: join_natural_right
    input: select * from a natural right join b
    dialects:
      hyper:
        validation:
          setup: |-
            create table a(x int);
            create table b(x int);

  - name: join_natural_full
    input: select * from a natural full join b
    dialects:
      hyper:
        validation:
          setup: |-
            create table a(x int);
            create table b(x int);

  - name: join_natural_left_outer
    input: select * from a natural left outer join b
    dialects:
      hyper:
        validation:
          setup: |-
            create table a(x int);
            create table b(x int);

  - name: join_natural_right_outer
    input: select * from a natural right outer join b
    dialects:
      hyper:
        validation:
          setup: |-
            create table a(x int);
            create table b(x int);

  - name: join_natural_full_outer
    input: select * from a natural full outer join b
    dialects:
      hyper:
        validation:
          setup: |-
            create table a(x int);
            create table b(x int);

  # Semi and anti joins
  - name: join_semi
    input: select * from a semi join b on a.x = b.x
    dialects:
      hyper:

  - name: join_anti
    input: select * from a anti join b on a.x = b.x
    dialects:
      hyper:

  # Join with a using list
  - name: join_using
    input: select * from a join b using (x)
    dialects:
      hyper:
        validation:
          setup: |-
            create table a(x int);
            create table b(x int);

  # Chained joins nest to the left
  - name: join_chain
    input: select * from a natural join b cross join c left join d on d.x = c.x
    dialects:
      hyper:
        validation:
          setup: |-
            create table a(x int);
            create table b(x int);
            create table c(x int);
            create table d(x int);

  # Joined subqueries
  - name: join_subquery
    input: select * from (select x from a) s join (select x from b) u on s.x = u.x
    dialects:
      hyper:
        validation:
          setup: |-
            create table a(x int);
            create table b(x int);

  # Long join conditions, the joins break before the condition does
  - name: join_long_conditions
    input: select * from orders o join order_items i on i.order_id = o.order_id and i.tenant_id = o.tenant_id and i.deleted_at is null left join products p on p.product_id = i.product_id and p.tenant_id = i.tenant_id
    dialects:
      hyper:
        validation:
          setup: |-
            create table orders(order_id int, tenant_id int);
            create table order_items(order_id int, tenant_id int, product_id int, deleted_at date);
            create table products(product_id int, tenant_id int);

  # A parenthesized join as the right side of a join is written without its parentheses, its ON binds first
  - name: join_parenthesized_right_side
    input: select * from a join (b join c on b.x = c.x) on a.x = b.x left join (d cross join e) on d.y = a.y
    dialects:
      hyper:
        validation:
          setup: |-
            create table a(x int, y int);
            create table b(x int);
            create table c(x int);
            create table d(y int);
            create table e(z int);

  # Lateral subqueries and functions in a join chain
  - name: join_lateral_chain
    input: select * from customers c cross join lateral (select * from orders o where o.customer_id = c.id order by o.created_at desc limit 3) recent left join lateral unnest(c.tags) tag on true
    dialects:
      hyper:
