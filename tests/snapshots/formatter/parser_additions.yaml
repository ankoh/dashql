formatter-snapshots:

  - name: coverage_order_by_using
    input: |-
      select * from t order by a using <, b using > nulls first, c using operator(pg_catalog.<)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select * from t order by a using <, b using > nulls first, c using operator(pg_catalog.<);
          - mode: compact
            width: 40
            expected: |-
              select *
              from t
              order by a using <,
                b using > nulls first,
                c using operator(pg_catalog.<);
          - mode: pretty
            expected: |-
              select *
              from t
              order by a using <, b using > nulls first, c using operator(pg_catalog.<);

  - name: coverage_cte_materialized
    input: |-
      with a as materialized (select 1), b(x) as not materialized (select 2) select * from a, b
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with a as materialized (select 1), b (x) as not materialized (select 2) select * from a, b;
          - mode: compact
            expected: |-
              with a as materialized (select 1), b (x) as not materialized (select 2) select * from a, b;
          - mode: pretty
            expected: |-
              with a as materialized (
                select 1
              ), b (x) as not materialized (
                select 2
              )
              select *
              from a, b;

