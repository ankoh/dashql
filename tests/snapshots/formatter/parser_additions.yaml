formatter-snapshots:

  - name: coverage_order_by_using
    input: |-
      select * from t order by a using <, b using > nulls first, c using operator(pg_catalog.<)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select * from t order by a using <, b using > nulls first, c using operator(pg_catalog.<);
          - mode: compact
            width: 40
            expected: |-
              select *
              from t
              order by a using <,
                b using > nulls first,
                c using operator(pg_catalog.<);
          - mode: pretty
            expected: |-
              select *
              from t
              order by a using <, b using > nulls first, c using operator(pg_catalog.<);

  - name: coverage_cte_materialized
    input: |-
      with a as materialized (select 1), b(x) as not materialized (select 2) select * from a, b
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with a as materialized (select 1), b (x) as not materialized (select 2) select * from a, b;
          - mode: compact
            expected: |-
              with a as materialized (select 1), b (x) as not materialized (select 2) select * from a, b;
          - mode: pretty
            expected: |-
              with a as materialized (
                select 1
              ), b (x) as not materialized (
                select 2
              )
              select *
              from a, b;

  - name: coverage_insert_target_alias
    input: |-
      insert into t as x (a) values (1) returning x.a
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              insert into t as x(a) values (1) returning x.a;
          - mode: compact
            expected: |-
              insert into t as x(a) values (1) returning x.a;
          - mode: pretty
            expected: |-
              insert into t as x(a)
              values
                (1)
              returning x.a;

  - name: coverage_explain_analyze_keyword
    input: |-
      explain analyze verbose select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              explain (analyze, verbose) select 1;
          - mode: compact
            expected: |-
              explain (analyze, verbose)
              select 1;
          - mode: pretty
            expected: |-
              explain (analyze, verbose)
              select 1;

  - name: coverage_explain_format_analyze
    input: |-
      explain (format analyze) create table x as select 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              explain (format analyze) create table x as select 1;
          - mode: compact
            expected: |-
              explain (format analyze)
              create table x as select 1;
          - mode: pretty
            expected: |-
              explain (format analyze)
              create table x as select 1;

  - name: coverage_default_is_of
    input: |-
      create table t (a boolean default 1 is of (integer), b boolean default 1 is not of (text))
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              create table t (a boolean default 1 is of (integer), b boolean default 1 is not of (text));
          - mode: compact
            expected: |-
              create table t (a boolean default 1 is of (integer), b boolean default 1 is not of (text));
          - mode: pretty
            expected: |-
              create table t (a boolean default 1 is of (integer), b boolean default 1 is not of (text));

