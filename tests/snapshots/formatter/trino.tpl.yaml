formatter-snapshots:
  # The same array type should be rendered in the selected output dialect.
  - name: coverage_trino_array_json_cast
    input: select cast(json_parse(payload) as array(json)) as items from events
    dialects:
      trino:
      hyper:

  - name: coverage_trino_nested_array_cast
    input: select cast(payload as array(array(integer))) from events
    dialects:
      trino:
      hyper:

  - name: coverage_trino_bracket_array_cast
    input: select cast(payload as integer[]) from events
    dialects:
      trino:
      hyper:

  # Trino reads the time zone of a timestamp or time literal from its text, the zoned type names lose their zone
  - name: trino_zoned_time_literals
    input: select timestamp with time zone '2024-01-01 10:00:00 UTC', time with time zone '10:00:00+01:00', timestamp '2024-01-01 10:00:00'
    dialects:
      trino:
      hyper:

  - name: trino_zoned_time_literal_type_names
    input: select timestamptz '2024-01-01 10:00:00+01', timetz '10:00:00+01'
    dialects:
      trino:
      hyper:

  # Trino has no bounded array types, Hyper keeps the bound
  - name: trino_bounded_array_cast
    input: select cast(payload as integer[3]) from events
    dialects:
      trino:
      hyper:

  # Trino reads the zone and the precision of a timestamp or time literal from its text
  - name: coverage_trino_zoned_time_literals_with_precision
    input: select timestamptz(3) '2024-01-01 10:00:00.123 UTC', timetz(3) '10:00:00.123 UTC', timestamp(3) with time zone '2024-01-01 10:00 UTC'
    dialects:
      trino:
      hyper:
