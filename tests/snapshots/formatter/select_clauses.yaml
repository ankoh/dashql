  - name: coverage_group_by_all
    input: |-
      select a, count(*) from source group by all; select a from source group by all a, b; select a from source group by distinct rollup(a, b)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select a, count(*) from source group by all;

              select a from source group by all a, b;

              select a from source group by distinct rollup(a, b);
          - mode: compact
            expected: |-
              select a, count(*) from source group by all;

              select a from source group by all a, b;

              select a from source group by distinct rollup(a, b);
          - mode: pretty
            expected: |-
              select a, count(*)
              from source
              group by all;

              select a
              from source
              group by all a, b;

              select a
              from source
              group by distinct rollup(a, b);

