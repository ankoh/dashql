              select * from source order by a fetch first row with ties;
          - mode: compact
            expected: |-
              select * from source order by a fetch first 2 rows with ties;

              select * from source order by a fetch first row with ties;
          - mode: pretty
            expected: |-
              select *
              from source
              order by a
              fetch first 2 rows with ties;

              select *
              from source
              order by a
              fetch first row with ties;

  - name: coverage_null_treatment
    input: |-
      select first_value(a) ignore nulls over (order by b), last_value(a) respect nulls over w, nth_value(a, 2) from last ignore nulls over w from source window w as (order by b)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select first_value(a) ignore nulls over (order by b), last_value(a) respect nulls over w, nth_value(a, 2) from last ignore nulls over w from source window w as (order by b);
          - mode: compact
            expected: |-
              select first_value(a) ignore nulls over (order by b), last_value(a) respect nulls over w,
                nth_value(a, 2) from last ignore nulls over w
              from source
              window w as (order by b);
          - mode: pretty
            expected: |-
              select first_value(a) ignore nulls over (order by b),
                last_value(a) respect nulls over w,
                nth_value(a, 2) from last ignore nulls over w
              from source
              window w as (order by b);

