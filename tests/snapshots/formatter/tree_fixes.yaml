formatter-snapshots:

  - name: coverage_time_types_without_time_zone
    input: |-
      select cast(a as timestamp without time zone), cast(b as time without time zone), cast(c as timestamp with time zone), cast(d as time) from t
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select cast(a as timestamp without time zone), cast(b as time without time zone), cast(c as timestamp with time zone), cast(d as time) from t;
          - mode: compact
            expected: |-
              select cast(a as timestamp without time zone), cast(b as time without time zone), cast(c as timestamp with time zone),
                cast(d as time)
              from t;
          - mode: pretty
            expected: |-
              select cast(a as timestamp without time zone),
                cast(b as time without time zone),
                cast(c as timestamp with time zone),
                cast(d as time)
              from t;
        validation:
          setup: |-
            create table t(a timestamp, b time, c timestamptz, d time);
      trino:
        formatted:
          - mode: inline
            expected: |-
              select cast(a as timestamp without time zone), cast(b as time without time zone), cast(c as timestamp with time zone), cast(d as time) from t;
          - mode: compact
            expected: |-
              select cast(a as timestamp without time zone), cast(b as time without time zone), cast(c as timestamp with time zone),
                cast(d as time)
              from t;
          - mode: pretty
            expected: |-
              select cast(a as timestamp without time zone),
                cast(b as time without time zone),
                cast(c as timestamp with time zone),
                cast(d as time)
              from t;

  - name: coverage_time_literal_without_time_zone
    input: |-
      select cast(b as time(3) without time zone), cast(c as timestamp(6) with time zone), timestamp without time zone '2024-01-01 10:00', time with time zone '10:00:00+01' from t
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select cast(b as time(3) without time zone), cast(c as timestamp(6) with time zone), timestamp without time zone '2024-01-01 10:00', time with time zone '10:00:00+01' from t;
          - mode: compact
            expected: |-
              select cast(b as time(3) without time zone), cast(c as timestamp(6) with time zone),
                timestamp without time zone '2024-01-01 10:00', time with time zone '10:00:00+01'
              from t;
          - mode: pretty
            expected: |-
              select cast(b as time(3) without time zone),
                cast(c as timestamp(6) with time zone),
                timestamp without time zone '2024-01-01 10:00',
                time with time zone '10:00:00+01'
              from t;
      trino:
        formatted:
          - mode: inline
            expected: |-
              select cast(b as time(3) without time zone), cast(c as timestamp(6) with time zone), timestamp '2024-01-01 10:00', time '10:00:00+01' from t;
          - mode: compact
            expected: |-
              select cast(b as time(3) without time zone), cast(c as timestamp(6) with time zone), timestamp '2024-01-01 10:00',
                time '10:00:00+01'
              from t;
          - mode: pretty
            expected: |-
              select cast(b as time(3) without time zone),
                cast(c as timestamp(6) with time zone),
                timestamp '2024-01-01 10:00',
                time '10:00:00+01'
              from t;

  - name: coverage_special_functions_empty_parentheses
    input: |-
      select current_date(), current_schema(), extract(), position(), substring() from t
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select current_date, current_schema(), extract(), position(), substring() from t;
          - mode: compact
            expected: |-
              select current_date, current_schema(), extract(), position(), substring() from t;
          - mode: pretty
            expected: |-
              select current_date, current_schema(), extract(), position(), substring()
              from t;

  - name: coverage_joined_table_alias
    input: |-
      select * from (a join b using (id)) as j (x, y), (c cross join d) e
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select * from (a join b using (id)) j(x, y), (c cross join d) e;
          - mode: compact
            expected: |-
              select * from (a join b using (id)) j(x, y), (c cross join d) e;
          - mode: pretty
            expected: |-
              select *
              from (
                  a
                    join b using (id)
                ) j(x, y),
                (
                  c
                    cross join d
                ) e;
        validation:
          setup: |-
            create table a(id int, p int);
            create table b(id int, q int);
            create table c(m int);
            create table d(n int);

  - name: coverage_right_nested_joins
    input: |-
      select * from a cross join (b join c on b.x = c.x), d natural join (e left join f using (x)), g join (h cross join i) on g.x = h.x
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select * from a cross join (b join c on b.x = c.x), d natural join (e left join f using (x)), g join (h cross join i) on g.x = h.x;
          - mode: compact
            expected: |-
              select *
              from a cross join (b join c on b.x = c.x), d natural join (e left join f using (x)),
                g join (h cross join i) on g.x = h.x;
          - mode: pretty
            expected: |-
              select *
              from a
                  cross join (
                    b
                      join c on b.x = c.x
                  ),
                d
                  natural join (
                    e
                      left join f using (x)
                  ),
                g
                  join (
                      h
                        cross join i
                    ) on g.x = h.x;
        validation:
          setup: |-
            create table a(x int);
            create table b(x int);
            create table c(x int);
            create table d(x int);
            create table e(x int);
            create table f(x int);
            create table g(x int);
            create table h(x int);
            create table i(y int);

  - name: coverage_fetch_first_row_without_count
    input: |-
      select * from t offset 5 rows fetch first rows only; select * from t order by a fetch next row with ties; select * from t limit 1
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select * from t fetch first row only offset 5;

              select * from t order by a fetch first row with ties;

              select * from t limit 1;
          - mode: compact
            expected: |-
              select * from t fetch first row only offset 5;

              select * from t order by a fetch first row with ties;

              select * from t limit 1;
          - mode: pretty
            expected: |-
              select *
              from t
              fetch first row only
              offset 5;

              select *
              from t
              order by a
              fetch first row with ties;

              select *
              from t
              limit 1;
        validation:
          setup: |-
            create table t(a int);
