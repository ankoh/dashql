formatter-snapshots:

  - name: coverage_insert_values
    input: INSERT INTO insert_target VALUES(1,'one'),(2,'two')
    dialects:
      hyper:
        validation:
          setup: create table insert_target(id int, label text);

  - name: coverage_insert_columns_default
    input: INSERT INTO insert_target(id,label) VALUES(DEFAULT,'generated')
    dialects:
      hyper:
        validation:
          setup: create table insert_target(id int default 42, label text);

  - name: coverage_insert_select
    input: INSERT INTO insert_target(id,label) SELECT id,label FROM insert_source WHERE active
    dialects:
      hyper:
        validation:
          setup: |-
            create table insert_target(id int, label text);
            create table insert_source(id int, label text, active boolean);

  - name: coverage_insert_table
    input: INSERT INTO insert_target TABLE insert_source
    dialects:
      hyper:
        validation:
          setup: |-
            create table insert_target(id int);
            create table insert_source(id int);

  - name: coverage_insert_default_values
    input: INSERT INTO insert_target DEFAULT VALUES
    dialects:
      hyper:
        validation:
          setup: create table insert_target(id int default 42);

  - name: coverage_insert_with
    input: WITH source AS(SELECT id,label FROM insert_source) INSERT INTO insert_target(id,label) SELECT id,label FROM source
    dialects:
      hyper:
        validation:
          setup: |-
            create table insert_target(id int, label text);
            create table insert_source(id int, label text);

  - name: coverage_insert_with_options
    input: WITH source AS(SELECT id,label FROM insert_source) OPTIONS(identifier_resolution 'case_insensitive') INSERT INTO insert_target(id,label) SELECT id,label FROM SOURCE
    dialects:
      hyper: {}

  - name: coverage_insert_returning
    input: INSERT INTO insert_target(id,label) VALUES(1,'one') RETURNING id,label AS inserted_label
    dialects:
      hyper:
        validation:
          setup: create table insert_target(id int, label text);

  - name: coverage_insert_qualified_target_returning_star
    input: INSERT INTO insert_schema.insert_target DEFAULT VALUES RETURNING *
    dialects:
      hyper:
        validation:
          setup: |-
            create schema insert_schema;
            create table insert_schema.insert_target(id int default 42);

  - name: coverage_explain_insert
    input: EXPLAIN INSERT INTO insert_target VALUES(1)
    dialects:
      hyper:
        validation:
          setup: create table insert_target(id int);

  - name: coverage_insert_bulk
    input: INSERT BULK INTO insert_target(id,label) SELECT id,label FROM insert_source
    dialects:
      hyper:
        validation:
          setup: |-
            create table insert_target(id int, label text);
            create table insert_source(id int, label text);

  # Hyper doesn't support ON CONFLICT, the cases have no validation
  - name: coverage_insert_on_conflict_do_nothing
    input: INSERT INTO insert_target VALUES(1,'one') ON CONFLICT DO NOTHING
    dialects:
      hyper: {}

  - name: coverage_insert_on_conflict_target_do_nothing
    input: INSERT INTO insert_target(id,label) SELECT id,label FROM insert_source ON CONFLICT(id) DO NOTHING
    dialects:
      hyper: {}

  - name: coverage_insert_on_conflict_do_update
    input: INSERT INTO insert_target(id,label) VALUES(1,'one') ON CONFLICT(id) DO UPDATE SET label=excluded.label||insert_target.label WHERE insert_target.label<>excluded.label RETURNING id
    dialects:
      hyper: {}

  - name: coverage_insert_on_conflict_index_predicate
    input: INSERT INTO insert_target(id,label) VALUES(1,'one') ON CONFLICT(id COLLATE "C" DESC NULLS LAST,label text_pattern_ops) WHERE id>0 DO UPDATE SET(id,label)=(excluded.id,DEFAULT),label=(SELECT max(label) FROM insert_source)
    dialects:
      hyper: {}

  # `(id) = (1)` sets no single column in PostgreSQL, an explicit row stays one
  - name: coverage_insert_on_conflict_explicit_row
    input: INSERT INTO insert_target(id,label) VALUES(1,'one') ON CONFLICT(id) DO UPDATE SET(id)=ROW(excluded.id),(id,label)=ROW(DEFAULT,'two')
    dialects:
      hyper: {}

  - name: coverage_insert_on_conflict_on_constraint
    input: WITH source AS(SELECT 1 AS id) INSERT INTO insert_target(id) SELECT id FROM source ON CONFLICT ON CONSTRAINT insert_target_pkey DO NOTHING
    dialects:
      hyper: {}

  - name: insert_on_conflict_narrow
    input: INSERT INTO insert_target(id,label,amount) VALUES(1,'one',10) ON CONFLICT(id,label) DO UPDATE SET amount=insert_target.amount+excluded.amount,label=excluded.label WHERE insert_target.amount<excluded.amount
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 60
          - mode: pretty
            width: 60
