formatter-snapshots:

  # Basic create table
  - name: create_table_basic
    input: create table t (a int, b int)
    dialects:
      hyper:

  # Create table with IF NOT EXISTS
  - name: create_table_if_not_exists
    input: create table if not exists schema_1.t_1 (a int)
    dialects:
      hyper:

  # Create table with many elements to test wrapping and indentation
  - name: create_table_many_elements_long_wrap
    input: create table t_many (first_really_long_column_name int, second_really_long_column_name int, third_really_long_column_name int, fourth_really_long_column_name int, fifth_really_long_column_name int)
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 70
          - mode: pretty
            width: 70

  # Create table with many elements to test wrapping and indentation
  - name: create_table_many_elements_short_wrap
    input: create table t_many (a int, b int, c int, d int, e int, f int, g int, h int, i int, j int)
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 30
          - mode: pretty
            width: 30

  # Create table with table constraints
  - name: create_table_with_table_constraints
    input: create table t (a int, b int, constraint t_pk primary key (a, b), constraint t_u unique (b), constraint t_ck check (a > 0))
    dialects:
      hyper:

  # Create table with foreign key table constraint options
  - name: create_table_with_foreign_key_table_constraint
    input: create table t (ref_id int, constraint t_fk foreign key (ref_id) references ref_t (id) match full on update cascade on delete set null)
    dialects:
      hyper:

  # Table elements that copy the columns of another table
  - name: coverage_create_table_like
    input: create table t (like u including defaults excluding constraints including all, a int, like v)
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 60

  # Create table without elements
  - name: coverage_create_table_empty
    input: create table t ()
    dialects:
      hyper:

  # Long defaults and checks, every column on its own line. Hyper has no check constraints
  - name: create_table_long_defaults_and_checks
    input: create table accounts (account_id bigint not null primary key, balance numeric(18, 2) not null default 0 check (balance >= 0 and balance < 1000000000), status text not null default 'active' check (status in ('active', 'frozen', 'closed')), created_at timestamp default current_timestamp)
    dialects:
      hyper:
