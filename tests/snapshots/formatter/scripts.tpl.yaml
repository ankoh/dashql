formatter-snapshots:

  # Statements are separated by one blank line, however many the input has
  - name: script_blank_lines_normalized
    input: |-
      select 1;select 2;



      select 3;
      select 4
    dialects:
      hyper:
        validation:
          setup: ""

  # Whitespace and empty statements at the end of a script
  - name: script_trailing_semicolons_and_whitespace
    input: "select 1;   \n\n;;  \n\t\n"
    dialects:
      hyper:

  # Statements of different kinds in one script
  - name: script_mixed_statements
    input: create temp table t(a int, b text); insert into t values (1, 'x'), (2, 'y'); select a, b from t where a > 1 order by a; drop table t
    dialects:
      hyper:
        formatted:
          - mode: pretty
            width: 40
        validation:
          setup: ""

  # Comments between keywords and inside an expression go in front of the node after them, a line comment at the end
  # of a line stays there
  - name: comment_between_keywords
    input: |-
      select /* targets */ a, -- the first column
        b + /* plus */ c from /* source */ t where a /* compared */ = 1
    dialects:
      hyper:
        validation:
          setup: create table t(a int, b int, c int);

  # A line comment as the last text of the script, without a semicolon
  - name: comment_trailing_last_statement_no_semicolon
    input: |-
      select 1 -- the answer
    dialects:
      hyper:
        validation:
          setup: ""

  # Comments after the last statement follow it directly, the blank line before them goes
  - name: comment_trailing_after_last_statement
    input: |-
      select 1;

      /* end of the script */
      -- really the end
    dialects:
      hyper:
        validation:
          setup: ""

  # A comment inside a CTE body
  - name: comment_inside_cte
    input: |-
      with base as (
        -- only the positive amounts
        select a from t where a > 0 /* strictly */
      )
      select * from base
    dialects:
      hyper:
        validation:
          setup: create table t(a int);

  # A comment before a statement that is broken in pretty mode keeps its distance to the statement
  - name: comment_before_pretty_statement
    input: |-
      select 1;

      -- Orders of a customer
      select id, amount from orders where customer_id = 1 order by id
    dialects:
      hyper:
        validation:
          setup: create table orders(id int, amount int, customer_id int);

  # The output of comment_between_keywords formats to itself, the comments stay with their nodes
  - name: comment_between_keywords_idempotent
    input: |-
      select /* targets */ a, -- the first column
        b + /* plus */ c
      from /* source */ t
      where a = /* compared */ 1;
    dialects:
      hyper:
        validation:
          setup: create table t(a int, b int, c int);

  # Line comments at the ends of lines stay there, the joins around them break; a line comment on a line of its own
  # stays on a line of its own before its node
  - name: comment_inside_line_comments
    input: |-
      select a, -- the a
        b, c -- the c
      from t
      -- only the positive ones
      where a > 0 -- strictly
        and coalesce(b, -- the b
          c) < 1;
      select 2
    dialects:
      hyper:
        validation:
          setup: create table t(a int, b int, c int);

  # Comments after the last node of a statement follow it, or go on lines of their own before the semicolon
  - name: comment_inside_after_last_node
    input: |-
      select (a /* a */) -- b
      from t;
      select (1 -- one
        -- two
      );
      select 3
    dialects:
      hyper:

  # A comment after a semicolon on a line of its own stays on the line of the semicolon
  - name: comment_after_separator_line
    input: |-
      select 2
      ; -- two
      select 3
    dialects:
      hyper:

  # A tag after a statement stays on its line, on a line of its own the next statement would read it as its annotation
  - name: comment_tag_after_statement
    input: |-
      select 1; -- @vis bar x=a
      select 2 /* @vis table */;
      select 3
    dialects:
      hyper:

  # A comment goes in front of a qualified name, after the dot the scanner would read no name before a reserved keyword
  - name: comment_inside_qualified_name
    input: |-
      select t /* c */ .from, a.b
        -- d
        .c from t;
      call d360/* e */ .select (limit => 1)
    dialects:
      hyper:
