  - name: width_one
    input: |-
      select a + b, f(c, d) from t where a = 1 and b in (1, 2)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select a + b, f(c, d) from t where a = 1 and b in (1, 2);
          - mode: compact
            width: 1
            expected: |-
              select a +
                  b,
                f(
                  c,
                    d
                )
              from t
              where a =
                  1
                and b in (
                  1,
                    2
                );
          - mode: pretty
            width: 1
            expected: |-
              select a +
                  b,
                f(
                  c,
                    d
                )
              from t
              where a =
                  1
                and b in (
                  1,
                    2
                );

  - name: nested_subqueries_three_levels
    input: |-
      select o.id, (select max(p.amount) from payments p where p.order_id = o.id and p.amount > (select avg(amount) from payments where status = 'ok')) as top_payment
      from (select id, customer_id from orders where customer_id in (select id from customers where region in (select region from regions where active))) o
      where exists (select 1 from shipments s where s.order_id = o.id and s.carrier_id = any (select id from carriers where rating > (select avg(rating) from carriers)))
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select o.id, (select max(p.amount) from payments p where p.order_id = o.id and p.amount > (select avg(amount) from payments where status = 'ok')) as top_payment from (select id, customer_id from orders where customer_id in (select id from customers where region in (select region from regions where active))) o where exists (select 1 from shipments s where s.order_id = o.id and s.carrier_id = any (select id from carriers where rating > (select avg(rating) from carriers)));
          - mode: compact
            width: 80
            expected: |-
              select o.id,
                (
                  select max(p.amount)
                  from payments p
                  where p.order_id = o.id
                    and p.amount > (select avg(amount) from payments where status = 'ok')
                ) as top_payment
              from (
                select id, customer_id
                from orders
                where customer_id in (
                  select id
                  from customers
                  where region in (select region from regions where active)
                )
              ) o
              where exists (
                select 1
                from shipments s
                where s.order_id = o.id
                  and s.carrier_id = any (
                    select id
                    from carriers
                    where rating > (select avg(rating) from carriers)
                  )
              );
          - mode: pretty
            width: 80
            expected: |-
              select o.id,
                (
                  select max(p.amount)
                  from payments p
                  where p.order_id = o.id
                    and p.amount > (
                        select avg(amount)
                        from payments
                        where status = 'ok'
                      )
                ) as top_payment
              from (
                select id, customer_id
                from orders
                where customer_id in (
                  select id
                  from customers
                  where region in (
                    select region
                    from regions
                    where active
                  )
                )
              ) o
              where exists (
                select 1
                from shipments s
                where s.order_id = o.id
                  and s.carrier_id = any (
                    select id
                    from carriers
                    where rating > (
                        select avg(rating)
                        from carriers
                      )
                  )
              );
        validation:
          setup: |-
            create table payments(order_id int, amount int, status text);
            create table orders(id int, customer_id int);
            create table customers(id int, region text);
            create table regions(region text, active bool);
            create table shipments(order_id int, carrier_id int);
            create table carriers(id int, rating int);

  - name: nested_case_expressions
    input: |-
      select case when status = 'open' then case when priority > 2 then 'urgent' when priority > 1 then 'normal' else 'low' end
      when status = 'closed' then coalesce(case resolution when 'fixed' then 'done' when 'wontfix' then 'rejected' end, 'unknown')
      else case when assignee is null then 'unassigned' else 'waiting' end end as state from tickets
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select case when status = 'open' then case when priority > 2 then 'urgent' when priority > 1 then 'normal' else 'low' end when status = 'closed' then coalesce(case resolution when 'fixed' then 'done' when 'wontfix' then 'rejected' end, 'unknown') else case when assignee is null then 'unassigned' else 'waiting' end end as state from tickets;
          - mode: compact
            width: 80
            expected: |-
              select case
                when status = 'open' then case when priority > 2 then 'urgent'
                  when priority > 1 then 'normal' else 'low' end
                when status = 'closed' then coalesce(
                  case resolution when 'fixed' then 'done' when 'wontfix' then 'rejected'
                      end, 'unknown'
                ) else case when assignee is null then 'unassigned' else 'waiting' end
                end as state
              from tickets;
          - mode: pretty
            width: 60
            expected: |-
              select case
                when status = 'open' then case
                  when priority > 2 then 'urgent'
                  when priority > 1 then 'normal'
                  else 'low'
                end
                when status = 'closed' then coalesce(
                  case resolution
                      when 'fixed' then 'done'
                      when 'wontfix' then 'rejected'
                    end, 'unknown'
                )
                else case
                  when assignee is null then 'unassigned'
                  else 'waiting'
                end
              end as state
              from tickets;
        validation:
          setup: |-
            create table tickets(status text, priority int, resolution text, assignee text);

  - name: case_in_condition_and_arithmetic
    input: |-
      select sum(case when kind = 'credit' then amount else -amount end) * 100 / nullif(count(*), 0) from ledger where case when kind = 'credit' then amount > 0 else true end group by account
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select sum(case when kind = 'credit' then amount else -amount end) * 100 / nullif(count(*), 0) from ledger where case when kind = 'credit' then amount > 0 else true end group by account;
          - mode: compact
            width: 70
            expected: |-
              select sum(case when kind = 'credit' then amount else -amount end) *
                  100 / nullif(count(*), 0)
              from ledger
              where case when kind = 'credit' then amount > 0 else true end
              group by account;
          - mode: pretty
            width: 70
            expected: |-
              select sum(
                    case
                      when kind = 'credit' then amount
                      else -amount
                    end
                  ) * 100 / nullif(count(*), 0)
              from ledger
              where case
                when kind = 'credit' then amount > 0
                else true
              end
              group by account;
        validation:
          setup: |-
            create table ledger(account int, kind text, amount int);

