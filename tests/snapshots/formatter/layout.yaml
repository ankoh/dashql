  - name: cte_chain
    input: |-
      with base(id, amount) as (select id, amount from payments where amount > 0),
      daily(id, total) as (select id, sum(amount) from base group by id),
      ranked as (select id, total, rank() over (order by total desc) as r from daily),
      top as (select * from ranked where r <= 10)
      select * from top order by r
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with base (id, amount) as (select id, amount from payments where amount > 0), daily (id, total) as (select id, sum(amount) from base group by id), ranked as (select id, total, rank() over (order by total desc) as r from daily), top as (select * from ranked where r <= 10) select * from top order by r;
          - mode: compact
            width: 80
            expected: |-
              with base (id, amount) as (
                select id, amount from payments where amount > 0
              ), daily (id, total) as (
                select id, sum(amount) from base group by id
              ), ranked as (
                select id, total, rank() over (order by total desc) as r from daily
              ), top as (select * from ranked where r <= 10)
              select * from top order by r;
          - mode: pretty
            width: 80
            expected: |-
              with base (id, amount) as (
                select id, amount
                from payments
                where amount > 0
              ), daily (id, total) as (
                select id, sum(amount)
                from base
                group by id
              ), ranked as (
                select id, total, rank() over (order by total desc) as r
                from daily
              ), top as (
                select *
                from ranked
                where r <= 10
              )
              select *
              from top
              order by r;
        validation:
          setup: |-
            create table payments(id int, amount int);

  - name: cte_recursive_column_list
    input: |-
      with recursive numbers(n, total) as (select 1, 1 union all select n + 1, total + n + 1 from numbers where n < 10) select n, total from numbers order by n desc limit 3
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with recursive numbers (n, total) as (select 1, 1 union all select n + 1, total + n + 1 from numbers where n < 10) select n, total from numbers order by n desc limit 3;
          - mode: compact
            width: 60
            expected: |-
              with recursive numbers (n, total) as (
                select 1, 1
                union all
                select n + 1, total + n + 1 from numbers where n < 10
              )
              select n, total from numbers order by n desc limit 3;
          - mode: pretty
            width: 60
            expected: |-
              with recursive numbers (n, total) as (
                select 1, 1
                union all
                select n + 1, total + n + 1
                from numbers
                where n < 10
              )
              select n, total
              from numbers
              order by n desc
              limit 3;
        validation:
          setup: |-

  - name: cte_in_subquery
    input: |-
      select * from (with inner_cte as (select 1 as x) select x from inner_cte) s where s.x in (with other as (select 1 as y) select y from other)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select * from (with inner_cte as (select 1 as x) select x from inner_cte) s where s.x in (with other as (select 1 as y) select y from other);
          - mode: compact
            expected: |-
              select *
              from (with inner_cte as (select 1 as x) select x from inner_cte) s
              where s.x in (with other as (select 1 as y) select y from other);
          - mode: pretty
            width: 60
            expected: |-
              select *
              from (
                with inner_cte as (
                  select 1 as x
                )
                select x
                from inner_cte
              ) s
              where s.x in (
                with other as (
                  select 1 as y
                )
                select y
                from other
              );
        validation:
          setup: |-

  - name: set_operation_long_order_limit
    input: |-
      select customer_id, amount from online_orders where amount > 100 union all select customer_id, amount from store_orders where amount > 100 except select customer_id, amount from refunds order by amount desc, customer_id limit 10 offset 5
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select customer_id, amount from online_orders where amount > 100 union all select customer_id, amount from store_orders where amount > 100 except select customer_id, amount from refunds order by amount desc, customer_id limit 10 offset 5;
          - mode: compact
            width: 80
            expected: |-
              select customer_id, amount from online_orders where amount > 100
              union all
              select customer_id, amount from store_orders where amount > 100
              except
              select customer_id, amount from refunds
              order by amount desc, customer_id
              limit 10
              offset 5;
          - mode: pretty
            width: 80
            expected: |-
              select customer_id, amount
              from online_orders
              where amount > 100
              union all
              select customer_id, amount
              from store_orders
              where amount > 100
              except
              select customer_id, amount
              from refunds
              order by amount desc, customer_id
              limit 10
              offset 5;
        validation:
          setup: |-
            create table online_orders(customer_id int, amount int);
            create table store_orders(customer_id int, amount int);
            create table refunds(customer_id int, amount int);

  - name: set_operation_in_cte_and_subquery
    input: |-
      with ids as (select id from a union select id from b) select * from c where id in (select id from ids intersect select id from d)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with ids as (select id from a union select id from b) select * from c where id in (select id from ids intersect select id from d);
          - mode: compact
            expected: |-
              with ids as (select id from a union select id from b)
              select * from c where id in (select id from ids intersect select id from d);
          - mode: pretty
            width: 60
            expected: |-
              with ids as (
                select id
                from a
                union
                select id
                from b
              )
              select *
              from c
              where id in (
                select id
                from ids
                intersect
                select id
                from d
              );
        validation:
          setup: |-
            create table a(id int);
            create table b(id int);
            create table c(id int);
            create table d(id int);

  - name: having_clause
    input: |-
      select category, count(*) from products group by category having count(*) > 1 and sum(price) < 1000 order by 2 desc; select count(*) from products having count(*) > 0
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select category, count(*) from products group by category having count(*) > 1 and sum(price) < 1000 order by 2 desc;

              select count(*) from products having count(*) > 0;
          - mode: compact
            expected: |-
              select category, count(*) from products group by category having count(*) > 1 and sum(price) < 1000 order by 2 desc;

              select count(*) from products having count(*) > 0;
          - mode: pretty
            expected: |-
              select category, count(*)
              from products
              group by category
              having count(*) > 1 and sum(price) < 1000
              order by 2 desc;

              select count(*)
              from products
              having count(*) > 0;
        validation:
          setup: |-
            create table products(category text, price int);

