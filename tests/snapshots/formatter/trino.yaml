          - mode: compact
            expected: |-
              select cast(payload as '<OBJECT_SQL_TYPENAME>') from events;
          - mode: pretty
            expected: |-
              select cast(payload as '<OBJECT_SQL_TYPENAME>')
              from events;
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select cast(payload as integer[3]) from events;
          - mode: compact
            expected: |-
              select cast(payload as integer[3]) from events;
          - mode: pretty
            expected: |-
              select cast(payload as integer[3])
              from events;

  - name: coverage_trino_zoned_time_literals_with_precision
    input: |-
      select timestamptz(3) '2024-01-01 10:00:00.123 UTC', timetz(3) '10:00:00.123 UTC', timestamp(3) with time zone '2024-01-01 10:00 UTC'
    dialects:
      trino:
        formatted:
          - mode: inline
            expected: |-
              select timestamp '2024-01-01 10:00:00.123 UTC', time '10:00:00.123 UTC', timestamp '2024-01-01 10:00 UTC';
          - mode: compact
            expected: |-
              select timestamp '2024-01-01 10:00:00.123 UTC', time '10:00:00.123 UTC', timestamp '2024-01-01 10:00 UTC';
          - mode: pretty
            expected: |-
              select timestamp '2024-01-01 10:00:00.123 UTC', time '10:00:00.123 UTC', timestamp '2024-01-01 10:00 UTC';
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select timestamptz(3) '2024-01-01 10:00:00.123 UTC', timetz(3) '10:00:00.123 UTC', timestamp(3) with time zone '2024-01-01 10:00 UTC';
          - mode: compact
            expected: |-
              select timestamptz(3) '2024-01-01 10:00:00.123 UTC', timetz(3) '10:00:00.123 UTC',
                timestamp(3) with time zone '2024-01-01 10:00 UTC';
          - mode: pretty
            expected: |-
              select timestamptz(3) '2024-01-01 10:00:00.123 UTC',
                timetz(3) '10:00:00.123 UTC',
                timestamp(3) with time zone '2024-01-01 10:00 UTC';

  - name: coverage_trino_array_keyword_form
    input: |-
      select cast(a as int array), cast(b as row(x int)[]), cast(c as array(varchar)) from t
    dialects:
      trino:
        formatted:
          - mode: inline
            expected: |-
              select cast(a as array(integer)), cast(b as array(row(x integer))), cast(c as array(varchar)) from t;
          - mode: compact
            expected: |-
              select cast(a as array(integer)), cast(b as array(row(x integer))), cast(c as array(varchar)) from t;
          - mode: pretty
            expected: |-
              select cast(a as array(integer)), cast(b as array(row(x integer))), cast(c as array(varchar))
              from t;
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select cast(a as integer[]), cast(b as array(row(x integer))), cast(c as varchar[]) from t;
          - mode: compact
            expected: |-
              select cast(a as integer[]), cast(b as array(row(x integer))), cast(c as varchar[]) from t;
          - mode: pretty
            expected: |-
              select cast(a as integer[]), cast(b as array(row(x integer))), cast(c as varchar[])
              from t;

  - name: coverage_trino_create_table_arrays
    input: |-
      create table t (a int[], b array(row(x int, y text)), c varchar(10) array, d row(e int[]))
    dialects:
      trino:
        formatted:
          - mode: inline
            expected: |-
              create table t (a array(integer), b array(row(x integer, y text)), c array(varchar(10)), d row(e array(integer)));
          - mode: compact
            expected: |-
              create table t (a array(integer), b array(row(x integer, y text)), c array(varchar(10)), d row(e array(integer)));
          - mode: pretty
            expected: |-
              create table t (a array(integer), b array(row(x integer, y text)), c array(varchar(10)), d row(e array(integer)));
      hyper:
        formatted:
          - mode: inline
            expected: |-
              create table t (a integer[], b array(row(x integer, y text)), c varchar(10)[], d row(e integer[]));
          - mode: compact
            expected: |-
              create table t (a integer[], b array(row(x integer, y text)), c varchar(10)[], d row(e integer[]));
          - mode: pretty
            expected: |-
              create table t (a integer[], b array(row(x integer, y text)), c varchar(10)[], d row(e integer[]));

  - name: coverage_trino_time_types
    input: |-
      select cast(a as timestamp with time zone), cast(a as time with time zone), timestamp without time zone '2024-01-01', time '10:00', cast(a as timestamp(6) with time zone) from t
    dialects:
      trino:
        formatted:
          - mode: inline
            expected: |-
              select cast(a as timestamp with time zone), cast(a as time with time zone), timestamp '2024-01-01', time '10:00', cast(a as timestamp(6) with time zone) from t;
          - mode: compact
            expected: |-
              select cast(a as timestamp with time zone), cast(a as time with time zone), timestamp '2024-01-01', time '10:00',
                cast(a as timestamp(6) with time zone)
              from t;
          - mode: pretty
            expected: |-
              select cast(a as timestamp with time zone),
                cast(a as time with time zone),
                timestamp '2024-01-01',
                time '10:00',
                cast(a as timestamp(6) with time zone)
              from t;
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select cast(a as timestamp with time zone), cast(a as time with time zone), timestamp '2024-01-01', time '10:00', cast(a as timestamp(6) with time zone) from t;
          - mode: compact
            expected: |-
              select cast(a as timestamp with time zone), cast(a as time with time zone), timestamp '2024-01-01', time '10:00',
                cast(a as timestamp(6) with time zone)
              from t;
          - mode: pretty
            expected: |-
              select cast(a as timestamp with time zone),
                cast(a as time with time zone),
                timestamp '2024-01-01',
                time '10:00',
                cast(a as timestamp(6) with time zone)
              from t;
