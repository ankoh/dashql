formatter-snapshots:

  - name: coverage_multiple_statements
    input: select 1; select 2
    dialects:
      hyper:
        validation:
          setup: ""

  - name: coverage_create_table_as
    input: create table if not exists analytics.result as select 1 as value
    dialects:
      hyper:
        validation:
          setup: create schema memory.analytics;

  - name: coverage_create_table_as_modifiers
    input: create temporary table if not exists result (value) on commit preserve rows as select 1 with no data
    dialects:
      hyper:

  - name: coverage_create_table_as_global_with_data
    input: create global temporary table result as select 1 with data
    dialects:
      hyper:

  # The query starts on its own line once the statement does not fit on one
  - name: create_table_as_query_on_own_line
    input: |-
      create table if not exists region as select * from external('https://data.dashql.app/tpch-0.001/v1/region.parquet', format => 'parquet')
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 80
            indent: 4
          - mode: pretty
            width: 80
            indent: 4

  - name: create_table_as_with_no_data_on_own_line
    input: create temporary table if not exists result (value) as select some_long_column_name from some_long_table_name with no data
    dialects:
      hyper:
        formatted:
          - mode: pretty
            width: 80
            indent: 4

  - name: coverage_create_view
    input: create view analytics.result (value) as select 1
    dialects:
      hyper:

  - name: coverage_create_temporary_view
    input: create temporary view result as select 1
    dialects:
      hyper:

  - name: coverage_create_or_replace_temporary_view
    input: create or replace temp view result as select 1
    dialects:
      hyper:

  - name: coverage_create_or_replace_view_wrap_after_as
    input: create or replace view analytics.result as select * from analytics.source
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 65

  - name: coverage_create_function
    input: create function analytics.render(value int, label varchar) returns varchar
    dialects:
      hyper:

  - name: coverage_create_aggregate
    input: create aggregate analytics.total(value int) returns int
    dialects:
      hyper:

  - name: coverage_create_or_replace_temp_function
    input: create or replace temp function analytics.render(value int) returns varchar not null
    dialects:
      hyper:

  - name: coverage_create_function_parameter_modes_and_defaults
    input: create function f(out a int, in out b int, variadic c int[], d int not null default 1, e varchar = 'x', int) returns int
    dialects:
      hyper:

  - name: coverage_create_function_returns_setof
    input: create function f(a t.x%type) returns setof int; create function g() returns setof t.y%type
    dialects:
      hyper:

  - name: coverage_create_function_returns_table
    input: |-
      create function f() returns table(a int not null, b varchar) pass through with set semantics prune when empty;
      create function g() returns table no pass through with row semantics;
      create function h() returns only pass throughs
    dialects:
      hyper:

  - name: coverage_create_function_options
    input: |-
      create function f(x int) returns int language sql immutable strict as 'select x';
      create function g(x int) returns int called on null input stable security definer leakproof cost 10 rows 5 as 'a', 'b';
      create function h() returns int returns null on null input external security invoker not leakproof window set search_path = 'public' language 'plpgsql'
    dialects:
      hyper:

  - name: coverage_create_function_without_returns
    input: create or replace function f(out x int) language sql as 'select 1' with (isstrict = true, cost = 1.5)
    dialects:
      hyper:

  - name: coverage_create_aggregate_signatures
    input: create temp aggregate a(*) returns bigint; create aggregate b(order by x int) returns int; create aggregate c(x float8 order by y float8) returns float8
    dialects:
      hyper:

  # The clauses of a function go on lines of their own once the statement does not fit on one
  - name: create_function_clauses_on_own_lines
    input: create or replace function analytics.render(value int, label varchar default 'none') returns varchar not null language sql immutable strict as 'select label || value'
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 80
          - mode: pretty
            width: 80

  - name: coverage_set_scalar
    input: SET variable = 'value'
    dialects:
      hyper:

  - name: coverage_set_local
    input: SET LOCAL variable = 'value'; SET SESSION variable = 'value'
    dialects:
      hyper:

  - name: coverage_set_nested
    input: SET variable = ('some' = 42, 'nested' = ('enabled' = true), 'values' = [43, 44])
    dialects:
      hyper:

  # A key path names a field of a field, in the variable and in the fields of a value
  - name: coverage_set_key_path
    input: SET global.experimental_sequences = on; SET global.parallel = -1; SET a.b.c = ('d'.e = 1, f = (g.h = [2]))
    dialects:
      hyper:

  # The values of a variable follow `to`, `=` only for a single value and for values that `to` does not take
  - name: coverage_set_to_values
    input: SET search_path TO public, 'other'; SET a.b = 'x', 2; SET LOCAL timezone = 'UTC'; SET SESSION enable_x TO on; SET ratio TO -1.5; SET a = b, 2
    dialects:
      hyper:

  - name: coverage_set_default_and_current
    input: SET x = DEFAULT; SET LOCAL y TO DEFAULT; SET z FROM CURRENT
    dialects:
      hyper:

  - name: coverage_set_time_zone
    input: SET TIME ZONE 'Europe/Berlin'; SET TIME ZONE utc; SET TIME ZONE INTERVAL '+02:00' HOUR TO MINUTE; SET TIME ZONE INTERVAL(3) '1:00'; SET TIME ZONE -7; SET TIME ZONE DEFAULT; SET LOCAL TIME ZONE LOCAL
    dialects:
      hyper:

  - name: coverage_set_session_parameters
    input: SET CATALOG 'c'; SET SCHEMA 's'; SET NAMES 'UTF8'; SET NAMES; SET ROLE admin; SET SESSION AUTHORIZATION 'someone'; SET SESSION AUTHORIZATION DEFAULT; SET TRANSACTION SNAPSHOT '00000003-0000001B-1'
    dialects:
      hyper:

  - name: coverage_set_transaction
    input: SET TRANSACTION ISOLATION LEVEL SERIALIZABLE, READ ONLY; SET SESSION CHARACTERISTICS AS TRANSACTION READ WRITE, NOT DEFERRABLE; SET LOCAL TRANSACTION DEFERRABLE
    dialects:
      hyper:

  - name: coverage_reset
    input: RESET search_path; RESET a.b; RESET ALL; RESET ALL GLOBAL; RESET TIME ZONE; RESET TRANSACTION ISOLATION LEVEL; RESET SESSION AUTHORIZATION
    dialects:
      hyper:

  - name: coverage_create_function_set_reset_options
    input: create function f() returns int set search_path to public, 'other' set x from current reset work_mem reset all as 'select 1'
    dialects:
      hyper:

  # Long value lists break like other lists
  - name: set_to_long_values
    input: SET search_path TO first_schema_name, second_schema_name, third_schema_name, fourth_schema_name
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 60
          - mode: pretty
            width: 60

  - name: coverage_create_table_modifiers
    input: create unlogged table result (value int) on commit drop
    dialects:
      hyper:

  - name: coverage_create_table_delete_rows
    input: create temporary table result (value int) on commit delete rows
    dialects:
      hyper:
  - name: coverage_drop_table
    input: DROP TABLE IF EXISTS analytics.result
    dialects:
      hyper:

  - name: coverage_drop_view
    input: DROP VIEW analytics.result
    dialects:
      hyper:

  - name: coverage_attach_database
    input: ATTACH DATABASE "path/to/source.hyper" AS source
    dialects:
      hyper:

  - name: coverage_attach_local_database_options
    input: ATTACH LOCAL DATABASE local_source AS attached WITH (access_mode='readonly', encryption_key=DEFAULT)
    dialects:
      hyper:

  - name: coverage_create_recursive_view
    input: create recursive view numbers (n) as select 1
    dialects:
      hyper:

  - name: coverage_create_view_with_options
    input: create view result with (security_barrier = true, check_option = local) as select * from analytics.source
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 65

  # `with cascaded check option` is written `with check option`, the default
  - name: coverage_create_view_check_option
    input: create view a as select x from t where x > 0 with check option; create view b as select x from t with cascaded check option; create or replace temporary view c as select x from t with local check option
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 40

  # The query of a long view starts on its own line
  - name: create_view_long_query
    input: create or replace view daily_revenue as select order_date, region, sum(amount) as revenue, count(distinct customer_id) as customers from orders where status = 'complete' group by order_date, region
    dialects:
      hyper:

  # Long column and value lists of an INSERT
  - name: insert_long_columns_and_values
    input: insert into customer_profiles (customer_id, first_name, last_name, email_address, phone_number, created_at, updated_at) values (1, 'Ada', 'Lovelace', 'ada@example.com', '+44 20 7946 0000', current_timestamp, current_timestamp)
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 80
          - mode: pretty
            width: 80
        validation:
          setup: create table customer_profiles(customer_id int, first_name text, last_name text, email_address text, phone_number text, created_at timestamp, updated_at timestamp);
