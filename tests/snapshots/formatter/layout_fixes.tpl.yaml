formatter-snapshots:

  # ALTER TABLE breaks between the table and its action, not inside the qualified name or the short column lists
  - name: alter_table_breaks_before_action
    input: alter table only some_schema.some_table add constraint some_table_fk foreign key (first_id, second_id) references other_table (id, other_id) on delete cascade
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 50
          - mode: pretty
            width: 50

  # The same at a width where it fits
  - name: alter_table_breaks_before_action_wide
    input: alter table only some_schema.some_table add constraint some_table_fk foreign key (first_id, second_id) references other_table (id, other_id) on delete cascade
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 160
          - mode: pretty
            width: 160

  # ALTER TABLE with several actions that do not fit
  - name: alter_table_breaks_between_actions
    input: alter table some_schema.some_table add column first_column integer not null default 0, drop column second_column cascade, alter column third_column type bigint using third_column::bigint
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 50
          - mode: pretty
            width: 50

  # The same at a width where it fits
  - name: alter_table_breaks_between_actions_wide
    input: alter table some_schema.some_table add column first_column integer not null default 0, drop column second_column cascade, alter column third_column type bigint using third_column::bigint
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 160
          - mode: pretty
            width: 160

  # DROP moves the names to an indented list instead of breaking at a dot
  - name: drop_names_on_indented_list
    input: drop table if exists some_schema.first_table, some_schema.second_table, some_schema.third_table cascade
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 40
          - mode: pretty
            width: 40
        validation:
          setup: create schema some_schema;

  # The same at a width where it fits
  - name: drop_names_on_indented_list_wide
    input: drop table if exists some_schema.first_table, some_schema.second_table, some_schema.third_table cascade
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 120
          - mode: pretty
            width: 120
        validation:
          setup: create schema some_schema;

  # A window frame breaks between its bounds
  - name: window_frame_breaks_between_bounds
    input: select sum(amount) over (w range between interval '7 days' preceding and interval '1 day' following) from t
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 50
          - mode: pretty
            width: 50

  # The same at a width where it fits
  - name: window_frame_breaks_between_bounds_wide
    input: select sum(amount) over (w range between interval '7 days' preceding and interval '1 day' following) from t
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 120
          - mode: pretty
            width: 120

  # A window frame with an exclusion that does not fit
  - name: window_frame_breaks_before_exclusion
    input: select sum(amount) over (partition by customer_id order by created_at rows between unbounded preceding and current row exclude current row) from orders
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 50
          - mode: pretty
            width: 50

  # The same at a width where it fits
  - name: window_frame_breaks_before_exclusion_wide
    input: select sum(amount) over (partition by customer_id order by created_at rows between unbounded preceding and current row exclude current row) from orders
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 160
          - mode: pretty
            width: 160

  # The items of a list in parentheses that break are aligned, also the first one
  - name: list_in_broken_parentheses_aligned
    input: select name from products where category in ('electronics', 'household appliances', 'garden furniture', 'sporting goods') and price > 10
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 50
          - mode: pretty
            width: 50
        validation:
          setup: create table products(name text, category text, price int);

  # The arguments of a call that breaks are aligned
  - name: call_arguments_in_broken_parentheses_aligned
    input: select some_function(first_argument_value, second_argument_value, third_argument_value, fourth_argument_value) from t
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 50
          - mode: pretty
            width: 50

  # A qualified name that fits on its line stays whole, the text after it breaks
  - name: qualified_name_breaks_last
    input: grant select, insert, update on table some_schema.some_table to some_user, other_user
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 40
          - mode: pretty
            width: 40

  # A qualified name that is longer than the line breaks at its dots
  - name: qualified_name_longer_than_line
    input: select * from some_database_name.some_schema_name.some_table_name
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 30
          - mode: pretty
            width: 30

  # TRUNCATE moves the relations to an indented list like DROP
  - name: truncate_relations_on_indented_list
    input: truncate some_schema.first_table_name, some_schema.second_table_name restart identity cascade
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 40
          - mode: pretty
            width: 40

  # DROP of other objects and of functions moves the names to an indented list too
  - name: drop_objects_on_indented_list
    input: drop materialized view some_schema.some_view_name, some_schema.other_view_name; drop function if exists some_schema.some_function_name(integer, text) cascade
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 40
          - mode: pretty
            width: 40
