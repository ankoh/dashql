            expected: |-
              create or replace function analytics.render(value integer, label varchar default 'none') returns varchar not null language sql immutable strict as 'select label || value';
          - mode: compact
            width: 80
            expected: |-
              create or replace function analytics.render(
                value integer, label varchar default 'none'
