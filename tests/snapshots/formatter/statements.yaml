formatter-snapshots:

  - name: coverage_multiple_statements
    input: |-
      select 1; select 2
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select 1;

              select 2;
          - mode: compact
            expected: |-
              select 1;

              select 2;
          - mode: pretty
            expected: |-
              select 1;

              select 2;
        validation:
          setup: |-

  - name: coverage_create_table_as
    input: |-
      create table if not exists analytics.result as select 1 as value
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              create table if not exists analytics.result as select 1 as value;
          - mode: compact
            expected: |-
              create table if not exists analytics.result as select 1 as value;
          - mode: pretty
            expected: |-
              create table if not exists analytics.result as select 1 as value;
        validation:
          setup: |-
            create schema memory.analytics;

  - name: coverage_create_table_as_modifiers
    input: |-
      create temporary table if not exists result (value) on commit preserve rows as select 1 with no data
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              create temporary table if not exists result(value) on commit preserve rows as select 1 with no data;
          - mode: compact
            expected: |-
              create temporary table if not exists result(value) on commit preserve rows as select 1 with no data;
          - mode: pretty
            expected: |-
              create temporary table if not exists result(value) on commit preserve rows as select 1 with no data;

  - name: coverage_create_table_as_global_with_data
    input: |-
      create global temporary table result as select 1 with data
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              create global temporary table result as select 1 with data;
          - mode: compact
            expected: |-
              create global temporary table result as select 1 with data;
          - mode: pretty
            expected: |-
              create global temporary table result as select 1 with data;

  - name: create_table_as_query_on_own_line
    input: |-
      create table if not exists region as select * from external('https://data.dashql.app/tpch-0.001/v1/region.parquet', format => 'parquet')
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              create table if not exists region as select * from external('https://data.dashql.app/tpch-0.001/v1/region.parquet', format => 'parquet');
          - mode: compact
            indent: 4
            width: 80
            expected: |-
              create table if not exists region as
              select *
              from external(
                  'https://data.dashql.app/tpch-0.001/v1/region.parquet',
                      format => 'parquet'
              );
          - mode: pretty
            indent: 4
            width: 80
            expected: |-
              create table if not exists region as
              select *
              from external(
                  'https://data.dashql.app/tpch-0.001/v1/region.parquet',
                      format => 'parquet'
              );

  - name: create_table_as_with_no_data_on_own_line
    input: |-
      create temporary table if not exists result (value) as select some_long_column_name from some_long_table_name with no data
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              create temporary table if not exists result(value) as select some_long_column_name from some_long_table_name with no data;
          - mode: compact
            expected: |-
              create temporary table if not exists result(value) as
              select some_long_column_name from some_long_table_name with no data;
          - mode: pretty
            indent: 4
            width: 80
            expected: |-
              create temporary table if not exists result(value) as
              select some_long_column_name
              from some_long_table_name with no data;

