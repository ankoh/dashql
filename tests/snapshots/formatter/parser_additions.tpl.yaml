formatter-snapshots:
  # ORDER BY with the sort operators of USING, the null rule follows the operator
  - name: coverage_order_by_using
    input: select * from t order by a using <, b using > nulls first, c using operator(pg_catalog.<)
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 40
  # MATERIALIZED and NOT MATERIALIZED common table expressions
  - name: coverage_cte_materialized
    input: with a as materialized (select 1), b(x) as not materialized (select 2) select * from a, b
    dialects:
      hyper:
  # The target of an INSERT with an alias keeps its AS
  - name: coverage_insert_target_alias
    input: insert into t as x (a) values (1) returning x.a
    dialects:
      hyper:
  # The options of EXPLAIN without parentheses are written in the parenthesized list
  - name: coverage_explain_analyze_keyword
    input: explain analyze verbose select 1
    dialects:
      hyper:
  # FORMAT ANALYZE as an option value
  - name: coverage_explain_format_analyze
    input: explain (format analyze) create table x as select 1
    dialects:
      hyper:
  # IS OF in a column default
  - name: coverage_default_is_of
    input: create table t (a boolean default 1 is of (integer), b boolean default 1 is not of (text))
    dialects:
      hyper:
