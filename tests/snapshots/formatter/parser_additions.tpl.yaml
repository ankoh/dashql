formatter-snapshots:
  # ORDER BY with the sort operators of USING, the null rule follows the operator
  - name: coverage_order_by_using
    input: select * from t order by a using <, b using > nulls first, c using operator(pg_catalog.<)
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 40
  # MATERIALIZED and NOT MATERIALIZED common table expressions
  - name: coverage_cte_materialized
    input: with a as materialized (select 1), b(x) as not materialized (select 2) select * from a, b
    dialects:
      hyper:
