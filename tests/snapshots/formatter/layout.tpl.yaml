formatter-snapshots:

  # Line width boundaries. The statement is 37 characters, 38 with the semicolon. The renderer keeps a safety
  # buffer of two characters, so the clauses stay on one line from width 39 on.
  - name: width_fits_with_buffer
    input: select first_col, second_col from tbl
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 39
        validation:
          setup: create table tbl(first_col int, second_col int);

  # The line with the semicolon is exactly as long as the width
  - name: width_exact_line
    input: select first_col, second_col from tbl
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 38
        validation:
          setup: create table tbl(first_col int, second_col int);

  # One character over the width
  - name: width_one_over
    input: select first_col, second_col from tbl
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 37
        validation:
          setup: create table tbl(first_col int, second_col int);

  # The arguments of a call at the boundary: the call fits in the first width, not in the second
  - name: width_call_arguments_fit
    input: select f(argument_one, argument_two, argument_three) from t
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 61
          - mode: pretty
            width: 55

  - name: width_call_arguments_one_over
    input: select f(argument_one, argument_two, argument_three) from t
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 60
          - mode: pretty
            width: 54

  # Words that are longer than the width stay whole, every break is taken
  - name: width_narrower_than_words
    input: select 'a string literal that is longer than the width' as long_alias_name, "Quoted Identifier Longer Than Width" from some_schema.some_table_name where some_column = 'another long literal value'
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 10
          - mode: pretty
            width: 10

  # A width of one breaks wherever it can
  - name: width_one
    input: select a + b, f(c, d) from t where a = 1 and b in (1, 2)
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 1
          - mode: pretty
            width: 1

  # Subqueries nested three levels deep, in FROM, WHERE and the select list
  - name: nested_subqueries_three_levels
    input: |-
      select o.id, (select max(p.amount) from payments p where p.order_id = o.id and p.amount > (select avg(amount) from payments where status = 'ok')) as top_payment
      from (select id, customer_id from orders where customer_id in (select id from customers where region in (select region from regions where active))) o
      where exists (select 1 from shipments s where s.order_id = o.id and s.carrier_id = any (select id from carriers where rating > (select avg(rating) from carriers)))
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 80
          - mode: pretty
            width: 80
        validation:
          setup: |-
            create table payments(order_id int, amount int, status text);
            create table orders(id int, customer_id int);
            create table customers(id int, region text);
            create table regions(region text, active bool);
            create table shipments(order_id int, carrier_id int);
            create table carriers(id int, rating int);

  # CASE nested in the THEN and ELSE branches of another CASE and in a function argument
  - name: nested_case_expressions
    input: |-
      select case when status = 'open' then case when priority > 2 then 'urgent' when priority > 1 then 'normal' else 'low' end
      when status = 'closed' then coalesce(case resolution when 'fixed' then 'done' when 'wontfix' then 'rejected' end, 'unknown')
      else case when assignee is null then 'unassigned' else 'waiting' end end as state from tickets
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 80
          - mode: pretty
            width: 60
        validation:
          setup: create table tickets(status text, priority int, resolution text, assignee text);

  # A CASE as a condition and in arithmetic
  - name: case_in_condition_and_arithmetic
    input: select sum(case when kind = 'credit' then amount else -amount end) * 100 / nullif(count(*), 0) from ledger where case when kind = 'credit' then amount > 0 else true end group by account
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 70
          - mode: pretty
            width: 70
        validation:
          setup: create table ledger(account int, kind text, amount int);

  # A long NOT IN list of strings next to another condition
  - name: long_not_in_list_strings
    input: select name from products where category not in ('electronics', 'household appliances', 'garden furniture', 'sporting goods', 'office supplies') and price > 10
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 60
          - mode: pretty
            width: 60
        validation:
          setup: create table products(name text, category text, price int);

  # A chain of CTEs with column lists, each one reading the one before
  - name: cte_chain
    input: |-
      with base(id, amount) as (select id, amount from payments where amount > 0),
      daily(id, total) as (select id, sum(amount) from base group by id),
      ranked as (select id, total, rank() over (order by total desc) as r from daily),
      top as (select * from ranked where r <= 10)
      select * from top order by r
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 80
          - mode: pretty
            width: 80
        validation:
          setup: create table payments(id int, amount int);

  # A recursive CTE with a column list and a set operation in its body
  - name: cte_recursive_column_list
    input: with recursive numbers(n, total) as (select 1, 1 union all select n + 1, total + n + 1 from numbers where n < 10) select n, total from numbers order by n desc limit 3
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 60
          - mode: pretty
            width: 60
        validation:
          setup: ""

  # A CTE in a subquery
  - name: cte_in_subquery
    input: select * from (with inner_cte as (select 1 as x) select x from inner_cte) s where s.x in (with other as (select 1 as y) select y from other)
    dialects:
      hyper:
        formatted:
          - mode: pretty
            width: 60
        validation:
          setup: ""

  # A set operation that does not fit, with ORDER BY, LIMIT and OFFSET of the whole combination
  - name: set_operation_long_order_limit
    input: select customer_id, amount from online_orders where amount > 100 union all select customer_id, amount from store_orders where amount > 100 except select customer_id, amount from refunds order by amount desc, customer_id limit 10 offset 5
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 80
          - mode: pretty
            width: 80
        validation:
          setup: |-
            create table online_orders(customer_id int, amount int);
            create table store_orders(customer_id int, amount int);
            create table refunds(customer_id int, amount int);

  # A set operation in a CTE and in an IN subquery
  - name: set_operation_in_cte_and_subquery
    input: with ids as (select id from a union select id from b) select * from c where id in (select id from ids intersect select id from d)
    dialects:
      hyper:
        formatted:
          - mode: pretty
            width: 60
        validation:
          setup: |-
            create table a(id int);
            create table b(id int);
            create table c(id int);
            create table d(id int);

  # HAVING with and without GROUP BY
  - name: having_clause
    input: select category, count(*) from products group by category having count(*) > 1 and sum(price) < 1000 order by 2 desc; select count(*) from products having count(*) > 0
    dialects:
      hyper:
        validation:
          setup: create table products(category text, price int);

  # Several named windows that do not fit
  - name: window_clause_long
    input: select sum(amount) over running, avg(amount) over moving, rank() over by_amount from payments window running as (partition by customer_id order by paid_at), moving as (running rows between 3 preceding and current row), by_amount as (order by amount desc)
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 80
          - mode: pretty
            width: 80
        validation:
          setup: create table payments(customer_id int, paid_at date, amount int);

  # VALUES as a statement, with ORDER BY and LIMIT
  - name: values_statement
    input: values (1, 'one'), (2, 'two'), (3, 'three') order by 1 desc limit 2
    dialects:
      hyper:
        validation:
          setup: ""

  # Many VALUES rows that do not fit
  - name: values_long
    input: select * from (values (1, 'alpha', true), (2, 'beta', false), (3, 'gamma', true), (4, 'delta', false), (5, 'epsilon', true)) as v(id, name, flag)
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 60
          - mode: pretty
            width: 60
        validation:
          setup: ""

  # Keywords in mixed case are printed lower case, identifiers, quoted names and literals keep their case
  - name: mixed_case_keywords
    input: SeLeCt Region, "MixedCase", COUNT(*) AS Total FrOm Sales WHERE Region In ('North', 'SOUTH') AND "MixedCase" Is NoT NuLl GROUP By Region, "MixedCase" ORDER BY Total DESC NULLS LAST
    dialects:
      hyper:
        validation:
          setup: create table sales(region text, "MixedCase" int);

  # The pretty output of nested_subqueries_three_levels formats to itself
  - name: idempotent_nested_subqueries_pretty
    input: |-
      select o.id,
        (
          select max(p.amount)
          from payments p
          where p.order_id = o.id
            and p.amount > (
                select avg(amount)
                from payments
                where status = 'ok'
              )
        ) as top_payment
      from (
        select id, customer_id
        from orders
        where customer_id in (
          select id
          from customers
          where region in (
            select region
            from regions
            where active
          )
        )
      ) o
      where exists (
        select 1
        from shipments s
        where s.order_id = o.id
          and s.carrier_id = any (
            select id
            from carriers
            where rating > (
                select avg(rating)
                from carriers
              )
          )
      );
    dialects:
      hyper:
        formatted:
          - mode: pretty
            width: 80
        validation:
          setup: |-
            create table payments(order_id int, amount int, status text);
            create table orders(id int, customer_id int);
            create table customers(id int, region text);
            create table regions(region text, active bool);
            create table shipments(order_id int, carrier_id int);
            create table carriers(id int, rating int);

  # The compact output of nested_case_expressions formats to itself
  - name: idempotent_nested_case_compact
    input: |-
      select case
        when status = 'open' then case when priority > 2 then 'urgent'
          when priority > 1 then 'normal' else 'low' end
        when status = 'closed' then coalesce(
          case resolution when 'fixed' then 'done' when 'wontfix' then 'rejected'
              end, 'unknown'
        ) else case when assignee is null then 'unassigned' else 'waiting' end
        end as state
      from tickets;
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 80
        validation:
          setup: create table tickets(status text, priority int, resolution text, assignee text);

  # The compact output of values_long, with a row broken within its parentheses, formats to itself
  - name: idempotent_values_long_compact
    input: |-
      select *
      from (
        values (1, 'alpha', true), (2, 'beta', false), (
            3, 'gamma', true
          ), (4, 'delta', false), (5, 'epsilon', true)
      ) v(id, name, flag);
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 60
        validation:
          setup: ""

  # A long IN subquery breaks within its parentheses, the AND after it continues the condition
  - name: long_in_subquery
    input: select * from orders where customer_id not in (select customer_id from blocked_customers where blocked_at > current_date - 30 and reason <> 'test') and amount > 0
    dialects:
      hyper:
        validation:
          setup: |-
            create table orders(customer_id int, amount int);
            create table blocked_customers(customer_id int, blocked_at date, reason text);

  # Nested calls break at the outermost call first
  - name: long_nested_calls
    input: select coalesce(nullif(trim(lower(first_name_of_the_person)), ''), nullif(trim(lower(last_name_of_the_person)), ''), 'unknown_person_name') as display_name from people
    dialects:
      hyper:
        validation:
          setup: create table people(first_name_of_the_person text, last_name_of_the_person text);

  # A long WHEN condition breaks before its ANDs
  - name: long_case_condition
    input: select case when order_status = 'shipped' and shipped_at is not null and delivered_at is null and carrier_name <> 'internal' then 'in transit' when order_status = 'cancelled' or refund_amount > 0 then 'void' else 'other' end as state from orders
    dialects:
      hyper:
        validation:
          setup: create table orders(order_status text, shipped_at date, delivered_at date, carrier_name text, refund_amount int);

  # A long window specification breaks within its parentheses
  - name: long_window_specification
    input: select sum(order_amount) over (partition by customer_region, customer_segment, order_channel order by order_date desc nulls last, order_id rows between unbounded preceding and current row) as running_total from orders
    dialects:
      hyper:
        validation:
          setup: create table orders(order_amount int, customer_region text, customer_segment text, order_channel text, order_date date, order_id int);

  # FILTER and OVER after an aggregate, the window breaks first
  - name: long_aggregate_filter_over
    input: select count(distinct customer_id) filter (where order_status = 'complete' and amount > 100) over (partition by region order by order_date) as complete_customers from orders
    dialects:
      hyper:

  # A select with all clauses, the CTE breaks only in pretty mode
  - name: long_select_all_clauses
    input: with recent as (select * from orders where order_date > current_date - 7) select distinct customer_id, count(*) as order_count, sum(amount) as total from recent where amount > 0 and status <> 'void' group by customer_id having count(*) > 2 window w as (partition by customer_id) order by total desc, customer_id limit 10 offset 5
    dialects:
      hyper:
        validation:
          setup: create table orders(customer_id int, order_date date, amount int, status text);

  # A long arithmetic expression breaks after an operator of the outermost sum
  - name: long_arithmetic_mixed
    input: select (unit_price * quantity_ordered - discount_amount) / nullif(total_quantity_sold, 0) * 100 + adjustment_factor_value - (shipping_cost + handling_fee) as margin from sales
    dialects:
      hyper:
        validation:
          setup: create table sales(unit_price int, quantity_ordered int, discount_amount int, total_quantity_sold int, adjustment_factor_value int, shipping_cost int, handling_fee int);

  # Nested parentheses at a narrow width
  - name: deep_arithmetic_narrow
    input: select ((a + b) * (c - d)) / ((e + f) * (g - h)) - (((i))) from t
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 20
          - mode: pretty
            width: 20
        validation:
          setup: create table t(a int, b int, c int, d int, e int, f int, g int, h int, i int);

  # EXISTS and NOT EXISTS in an AND chain
  - name: long_exists_chain
    input: select * from customers c where exists (select 1 from orders o where o.customer_id = c.id) and not exists (select 1 from refunds r where r.customer_id = c.id) and c.active
    dialects:
      hyper:
        validation:
          setup: |-
            create table customers(id int, active bool);
            create table orders(customer_id int);
            create table refunds(customer_id int);

  # A scalar subquery as the right side of a comparison in an OR
  - name: long_scalar_subquery_comparison
    input: select * from products p where p.price > (select avg(price) * 1.5 from products q where q.category_id = p.category_id and q.discontinued = false) or p.featured
    dialects:
      hyper:
        validation:
          setup: create table products(price int, category_id int, discontinued bool, featured bool);

  # Scalar subqueries as arguments, pretty mode breaks them
  - name: scalar_subquery_arguments
    input: select coalesce((select max(a) from t), 0), greatest((select 1), (select 2)) + 1, abs((select 1) + 1) from t
    dialects:
      hyper:
        validation:
          setup: create table t(a int);

  # A long list of tables in FROM
  - name: long_from_list
    input: select count(*) from customer_accounts ca, customer_addresses cad, customer_orders co, order_line_items oli where ca.id = cad.account_id
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 60
          - mode: pretty
            width: 60
        validation:
          setup: |-
            create table customer_accounts(id int);
            create table customer_addresses(account_id int);
            create table customer_orders(id int);
            create table order_line_items(id int);

  # An indentation of four spaces
  - name: indent_four_nested
    input: select a from (select a from (select a from t where a > 1 and b < 2) s where a in (select c from u)) r where r.a = 1
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 40
            indent: 4
          - mode: pretty
            width: 40
            indent: 4
        validation:
          setup: |-
            create table t(a int, b int);
            create table u(c int);

  # No indentation
  - name: indent_zero
    input: select a, b from (select a, b from t where a > 1) s where a in (select c from u) order by a
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 30
            indent: 0
          - mode: pretty
            width: 30
            indent: 0
        validation:
          setup: |-
            create table t(a int, b int);
            create table u(c int);
