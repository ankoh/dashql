formatter-snapshots:

  - name: coverage_grant_privileges
    input: |-
      grant select (a, b), references, create, usage on table t, s.u to bob, group public with grant option
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              grant select (a, b), references, create, usage on table t, s.u to bob, public with grant option;
          - mode: compact
            expected: |-
              grant select (a, b), references, create, usage on table t, s.u to bob, public with grant option;
          - mode: pretty
            expected: |-
              grant select (a, b), references, create, usage on table t, s.u to bob, public with grant option;

  - name: coverage_grant_privileges_narrow
    input: |-
      grant select (a, b), references, create, usage on table t, s.u to bob, group public with grant option
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              grant select (a, b), references, create, usage on table t, s.u to bob, public with grant option;
          - mode: compact
            width: 40
            expected: |-
              grant select (a, b), references,
                create, usage
                on table t, s.u
                to bob, public
                with grant option;
          - mode: pretty
            width: 40
            expected: |-
              grant select (a, b),
                references,
                create,
                usage
                on table t, s.u
                to bob, public
                with grant option;

  - name: coverage_grant_all
    input: |-
      grant all privileges on all tables in schema s1, s2 to bob; grant all (a) on t to bob
