            expected: |-
              grant all on all tables in schema s1, s2 to bob;

              grant all (a) on table t to bob;
          - mode: compact
            expected: |-
              grant all on all tables in schema s1, s2 to bob;

              grant all (a) on table t to bob;
          - mode: pretty
            expected: |-
              grant all on all tables in schema s1, s2 to bob;

              grant all (a) on table t to bob;

