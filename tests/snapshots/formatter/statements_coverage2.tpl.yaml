formatter-snapshots:
  # Validation runs the output of every mode in one database, so what it runs undoes itself

  # UPDATE with common table expressions, ONLY and descendant tables
  - name: coverage_update_recursive_cte
    input: with recursive r(n) as (select 1 union all select n + 1 from r where n < 3) update t set a = r.n from r where t.id = r.n
    dialects:
      hyper:

  - name: coverage_update_only_star
    input: update only t set a = 1; update t * set a = 2
    dialects:
      hyper:

  # UPDATE and DELETE as common table expressions, the body of the CTE breaks like the statement
  - name: coverage_update_in_cte
    input: with u as (update t set a = 1 returning a) select * from u
    dialects:
      hyper:

  - name: coverage_data_modifying_ctes
    input: with d as (delete from t where a < 0 returning *), i as (insert into u select * from d returning id) update v set n = n + 1 where id in (select id from i)
    dialects:
      hyper:

  # The assignments of UPDATE break after their commas, a subquery as a value within its parentheses
  - name: coverage_update_assignments_narrow
    input: update some_table set first_column = first_column + 1, second_column = 'some text value', third_column = null where id = 42
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 40
          - mode: pretty
            width: 40

  - name: coverage_update_row_assignment_narrow
    input: update some_table set (first_column, second_column) = (select other_first, other_second from other_table where other_table.id = some_table.id) where some_table.id > 0
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 50
          - mode: pretty
            width: 50

  - name: coverage_update_from_join_narrow
    input: update update_j as t set amount = o.amount + p.amount from update_o as o join update_p as p on o.id = p.other_id where t.id = o.id and p.kind = 'x'
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 50
          - mode: pretty
            width: 50
        validation:
          setup: |-
            create table update_j(id int, amount int);
            create table update_o(id int, amount int);
            create table update_p(other_id int, amount int, kind text);

  - name: coverage_update_where_exists_narrow
    input: update update_e set flag = true where exists (select 1 from update_f where update_f.id = update_e.id and update_f.kind in ('a', 'b'))
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 50
          - mode: pretty
            width: 50
        validation:
          setup: |-
            create table update_e(id int, flag bool);
            create table update_f(id int, kind text);

  # The UPDATE is 42 characters, 43 with the semicolon, it fits on one line in compact mode from width 44 on
  - name: coverage_update_width_fits
    input: update t set a = 1 where b = 2 returning c
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 44
          - mode: pretty
            width: 44

  - name: coverage_update_width_one_over
    input: update t set a = 1 where b = 2 returning c
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 43
          - mode: pretty
            width: 43

  - name: coverage_update_indent_zero
    input: update some_table set first_column = 1, second_column = (select max(x) from other_table) where id = 1
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 40
            indent: 0
          - mode: pretty
            width: 40
            indent: 0

  # A block comment after the target goes in front of the first assignment, SET is printed by the statement; a block
  # comment at the end of the assignments goes in front of the condition
  - name: coverage_update_comments
    input: |-
      update t /* target */ set a = 1, -- the a
        b = 2 /* the b */
      -- only some rows
      where id = 1 -- the id
    dialects:
      hyper:

  - name: coverage_update_validated
    input: update update_v set (a, b) = (b, a), c = (select max(id) from update_v) where id in (1, 2) returning a, b, c
    dialects:
      hyper:
        validation:
          setup: create table update_v(id int, a int, b int, c int);

  # The parentheses of the values and of RETURNING stay where they are needed
  - name: coverage_update_precedence
    input: update update_q set a = (b + c) * a, b = b - (c - a), c = -(-c), d = not (a = b or c = a) returning (a + b) * c, a + b * c
    dialects:
      hyper:
        validation:
          setup: create table update_q(a int, b int, c int, d bool);

  - name: coverage_update_quoted_names
    input: update "Some Table" as "select" set "from" = 1, "Mixed" = "select"."where" where "select"."group" is null
    dialects:
      hyper:

  # MERGE with a CTE, a subquery, a join and VALUES as the source
  - name: coverage_merge_subquery_source_cte
    input: with s as (select 1 as id, 2 as a) merge into t using (select id, a from s where a > 0) as src on t.id = src.id when matched then update set a = src.a, b = src.a * 2 when not matched then insert (id, a) values (src.id, src.a)
    dialects:
      hyper:

  - name: coverage_merge_recursive_returning
    input: with recursive r as (select 1 as id) merge into t using r on t.id = r.id when not matched by source then update set a = default returning merge_action(), t.*
    dialects:
      hyper:

  - name: coverage_merge_source_join
    input: merge into t using (u join v on u.id = v.id) on t.id = u.id when matched then update set a = v.a
    dialects:
      hyper:

  - name: coverage_merge_source_values
    input: merge into t using (values (1, 'a'), (2, 'b')) as v(id, name) on t.id = v.id when not matched then insert (id, name) values (v.id, v.name)
    dialects:
      hyper:

  # A long WHEN condition breaks before its ANDs, the action goes on an indented line
  - name: coverage_merge_long_when_condition
    input: merge into target_table as t using source_table as s on t.id = s.id when matched and s.deleted and t.version < s.version and t.locked is false then delete when matched then update set version = s.version, payload = s.payload, updated_at = now()
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 50
          - mode: pretty
            width: 50

  # The pretty output of coverage_merge_long_when_condition formats to itself
  - name: coverage_merge_long_when_condition_idempotent
    input: |-
      merge into target_table t
      using source_table s
      on t.id = s.id
      when matched and s.deleted
          and t.version < s.version
          and t.locked is false then
        delete
      when matched then
        update set version = s.version,
          payload = s.payload,
          updated_at = now();
    dialects:
      hyper:
        formatted:
          - mode: pretty
            width: 50

  # The values of an INSERT action break within their parentheses
  - name: coverage_merge_insert_values_narrow
    input: merge into target_table as t using source_table as s on t.id = s.id and t.version < s.version when matched and s.deleted then delete when not matched then insert (id, version) values (s.id, s.version)
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 34
          - mode: pretty
            width: 34

  - name: coverage_merge_indent_four
    input: with s as (select 1 as id) merge into t using s on t.id = s.id when matched and t.a > 0 then update set a = t.a + 1, b = 2 when not matched then insert (id) values (s.id)
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 40
            indent: 4
          - mode: pretty
            width: 40
            indent: 4

  - name: coverage_merge_comments
    input: |-
      merge into t -- the target
      using u on t.id = u.id
      /* delete */ when matched then delete
      when not matched then -- insert
        insert values (u.id)
    dialects:
      hyper:

  # PREPARE of MERGE, DELETE and INSERT, the statement follows on a line of its own if it does not fit
  - name: coverage_prepare_merge_delete_insert
    input: prepare pm(int) as merge into t using u on t.id = $1 when matched then delete; prepare pd as delete from t where id = 1; prepare pi(text) as insert into t values ($1)
    dialects:
      hyper:

  - name: coverage_prepare_query_narrow
    input: prepare some_statement(integer, text) as select some_column, other_column from some_table where some_column = $1 and other_column = $2
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 50
          - mode: pretty
            width: 50

  - name: coverage_execute_arguments_narrow
    input: execute some_statement(1 + 2, 'some text argument', first_name => 'value', second_name := now())
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 40
          - mode: pretty
            width: 40

  - name: coverage_execute_comments
    input: |-
      execute p( -- the arguments
        1, /* second */ 'x',
        y => 2 -- named
      )
    dialects:
      hyper:

  # EXPLAIN of UPDATE and MERGE, with options the statement goes on a line of its own
  - name: coverage_explain_update_merge
    input: explain update t set a = 1 where b = 2; explain (analyze, verbose) merge into t using u on t.id = u.id when matched then delete
    dialects:
      hyper:

  # The types of the parameters of PREPARE and of casts in UPDATE and MERGE in the dialects
  - name: coverage_dialect_types_in_statements
    input: prepare p(integer[], varchar(10)[]) as update t set a = cast($1 as text[]), b = $2 returning cast(a as int[][]); merge into t using u on t.id = u.id when matched then update set a = cast(u.a as int[])
    dialects:
      hyper:
      trino:

  # GRANT is 48 characters, 49 with the semicolon, it fits on one line from width 50 on
  - name: coverage_grant_width_fits
    input: grant select on table t to bob with grant option
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 50
          - mode: pretty
            width: 50

  - name: coverage_grant_width_one_over
    input: grant select on table t to bob with grant option
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 49
          - mode: pretty
            width: 49

  # The column list of a privilege breaks, a qualified name that is longer than the line breaks at its dot
  - name: coverage_grant_very_narrow
    input: grant select (first_column, second_column, third_column), insert, update on table some_schema.some_table to some_user, other_user
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 30
          - mode: pretty
            width: 30

  # A block comment in front of ON goes in front of the target, ON is printed by the statement
  - name: coverage_grant_revoke_comments
    input: |-
      grant select, -- reading
        insert /* writing */ on table t to bob;
      revoke /* all of it */ all on t from bob -- bob leaves
    dialects:
      hyper:

  - name: coverage_create_role_comments
    input: |-
      create role r with login -- may log in
        password 'pw' /* secret */ connection limit 5
    dialects:
      hyper:

  # A comment in front of the drop behavior follows the statement, the behavior has no node of its own
  - name: coverage_drop_comments
    input: |-
      drop table t1, -- the first
        t2 /* the second */ cascade
    dialects:
      hyper:

  - name: coverage_create_schema_comments
    input: |-
      create schema s
        -- a table
        create table t (a int)
        /* a view */ create view v as select a from t
    dialects:
      hyper:

  # Comments in cursors and COPY
  - name: coverage_declare_cursor_comments
    input: |-
      declare c -- the cursor
        scroll cursor with hold for /* the query */ select a from t
    dialects:
      hyper:

  - name: coverage_fetch_comments
    input: |-
      fetch /* direction */ forward 5 -- count
        from c
    dialects:
      hyper:

  - name: coverage_copy_comments
    input: |-
      copy t (a, -- the a
        b) from 'data.csv' with (format csv, /* a header */ header)
    dialects:
      hyper:

  - name: coverage_copy_to_comments
    input: |-
      copy (select a from t) -- the query
      to 'out.csv' /* the file */ with (format => 'csv')
    dialects:
      hyper:

  - name: coverage_copy_query_cte_narrow
    input: copy (with x as (select some_column from some_table where some_column > 0) select some_column from x) to 'out.csv' with (format => 'csv', header => true)
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 50
          - mode: pretty
            width: 50

  # Parameter modes, options and table semantics of functions and LIKE options of tables that no other case has
  - name: coverage_function_inout_constref_volatile
    input: create function f(inout a int, in out b int, constref c int) returns table(x int) with set semantics keep when empty volatile language sql as 'select 1'
    dialects:
      hyper:

  - name: coverage_table_like_storage_indexes
    input: create table t (like u including storage excluding indexes including comments)
    dialects:
      hyper:
