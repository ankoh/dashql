  - name: drop_names_on_indented_list
    input: |-
      drop table if exists some_schema.first_table, some_schema.second_table, some_schema.third_table cascade
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              drop table if exists some_schema.first_table, some_schema.second_table, some_schema.third_table cascade;
          - mode: compact
            width: 40
            expected: |-
              drop table if exists
                some_schema.first_table,
                some_schema.second_table,
                some_schema.third_table
                cascade;
          - mode: pretty
            width: 40
            expected: |-
              drop table if exists
                some_schema.first_table,
                some_schema.second_table,
                some_schema.third_table
                cascade;
        validation:
          setup: |-
            create schema some_schema;

