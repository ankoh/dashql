              select sum(amount) over (
                partition by customer_id order by created_at
                  rows between unbounded preceding
                    and current row exclude current row
              )
              from orders;
          - mode: pretty
            width: 50
            expected: |-
              select sum(amount) over (
                partition by customer_id order by created_at
                  rows between unbounded preceding
                    and current row exclude current row
              )
              from orders;

