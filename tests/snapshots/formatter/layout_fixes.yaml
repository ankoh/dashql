  - name: list_in_broken_parentheses_aligned
    input: |-
      select name from products where category in ('electronics', 'household appliances', 'garden furniture', 'sporting goods') and price > 10
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select name from products where category in ('electronics', 'household appliances', 'garden furniture', 'sporting goods') and price > 10;
          - mode: compact
            width: 50
            expected: |-
              select name
              from products
              where category in (
                  'electronics', 'household appliances',
                  'garden furniture', 'sporting goods'
                ) and price > 10;
          - mode: pretty
            width: 50
            expected: |-
              select name
              from products
              where category in (
                  'electronics',
                  'household appliances',
                  'garden furniture',
                  'sporting goods'
                )
                and price > 10;
        validation:
          setup: |-
            create table products(name text, category text, price int);

