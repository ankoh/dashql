formatter-snapshots:

  - name: alter_table_breaks_before_action
    input: |-
      alter table only some_schema.some_table add constraint some_table_fk foreign key (first_id, second_id) references other_table (id, other_id) on delete cascade
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              alter table only some_schema.some_table add constraint some_table_fk foreign key (first_id, second_id) references other_table (id, other_id) on delete cascade;
          - mode: compact
            width: 50
            expected: |-
              alter table only some_schema.some_table
                add constraint some_table_fk foreign key (
                  first_id, second_id
                ) references other_table (
                  id, other_id
                ) on delete cascade;
          - mode: pretty
            width: 50
            expected: |-
              alter table only some_schema.some_table
                add constraint some_table_fk foreign key (
                  first_id, second_id
                ) references other_table (
                  id, other_id
                ) on delete cascade;

  - name: alter_table_breaks_before_action_wide
    input: |-
      alter table only some_schema.some_table add constraint some_table_fk foreign key (first_id, second_id) references other_table (id, other_id) on delete cascade
    dialects:
