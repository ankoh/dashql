  - name: window_frame_breaks_between_bounds
    input: |-
      select sum(amount) over (w range between interval '7 days' preceding and interval '1 day' following) from t
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select sum(amount) over (w range between interval '7 days' preceding and interval '1 day' following) from t;
          - mode: compact
            width: 50
            expected: |-
              select sum(amount) over (
                w
                  range between interval '7 days' preceding
                    and interval '1 day' following
              )
              from t;
          - mode: pretty
            width: 50
            expected: |-
              select sum(amount) over (
                w
                  range between interval '7 days' preceding
                    and interval '1 day' following
              )
              from t;

