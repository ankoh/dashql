  - name: alter_table_breaks_between_actions
    input: |-
      alter table some_schema.some_table add column first_column integer not null default 0, drop column second_column cascade, alter column third_column type bigint using third_column::bigint
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              alter table some_schema.some_table add column first_column integer not null default 0, drop column second_column cascade, alter column third_column set data type bigint using third_column::bigint;
          - mode: compact
            width: 50
            expected: |-
              alter table some_schema.some_table
                add column first_column integer not null
                  default 0, drop column second_column cascade,
                alter column third_column set data type bigint
                  using third_column::bigint;
          - mode: pretty
            width: 50
            expected: |-
              alter table some_schema.some_table
                add column first_column integer not null
                  default 0,
                drop column second_column cascade,
                alter column third_column set data type bigint
                  using third_column::bigint;

