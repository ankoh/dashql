  - name: lambda_parameters_stay_together
    input: |-
      select f(lambda first_value, second_value: first_value * 2 + second_value) from t
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select f(lambda first_value, second_value: first_value * 2 + second_value) from t;
          - mode: compact
            width: 50
            expected: |-
              select f(
                lambda first_value, second_value:
                  first_value * 2 + second_value
              )
              from t;
          - mode: pretty
            width: 50
            expected: |-
              select f(
                lambda first_value, second_value:
                  first_value * 2 + second_value
              )
              from t;

