formatter-snapshots:
  # Single plus: no parens needed
  - name: prec_plus
    input: select 1+2
    dialects:
      hyper:

  # Multiply higher than plus: 1+2*3 = 1+(2*3)
  - name: prec_plus_mul_1
    input: select 1+2*3
    dialects:
      hyper:

  # Explicit parens: (1+2)*3
  - name: prec_plus_mul_2
    input: select (1+2)*3
    dialects:
      hyper:

  # 1*2+3: mul binds first, output (1*2)+3
  - name: prec_plus_mul_3
    input: select 1*2+3
    dialects:
      hyper:

  # AND has higher precedence than OR
  - name: prec_and_or_1
    input: select 1 or 2 and 3
    dialects:
      hyper:

  # Explicit parens: (1 or 2) and 3
  - name: prec_and_or_2
    input: select (1 or 2) and 3
    dialects:
      hyper:

  # Left-associative minus
  - name: prec_minus_left
    input: select 1-2-3
    dialects:
      hyper:

  # Parens preserve grouping: 10-(2-3) formats as 10-(2-3) (right operand of left-assoc needs parens)
  - name: prec_minus_paren
    input: select 10-(2-3)
    dialects:
      hyper:

  # Unary minus: operand gets parens (n==1)
  - name: prec_unary_minus_1
    input: select -1+2
    dialects:
      hyper:

  # Unary minus applied to parenthesized expression: -(1+2)
  - name: prec_unary_minus_2
    input: select -(1+2)
    dialects:
      hyper:

  # Comparison higher than AND: parens around comparison when under AND
  - name: prec_compare_and
    input: select 1>2 and 3=3
    dialects:
      hyper:

  # Division and multiply same precedence (left-assoc)
  - name: prec_div_mul
    input: select 12/3*2
    dialects:
      hyper:

  # Explicit (12/3)*2: same as div_mul, parens preserved
  - name: prec_mul_div
    input: select (12/3)*2
    dialects:
      hyper:

  # NOT higher than AND: not 1=1 and 2=2 = (not 1=1) and 2=2
  - name: prec_not_and_1
    input: select not 1=1 and 2=2
    dialects:
      hyper:

  # Comparison higher than OR: parens around each comparison
  - name: prec_not_and_2
    input: select not (1=1 and 2=2)
    dialects:
      hyper:

  # Left-assoc plus: 1+2+3 = (1+2)+3
  - name: prec_compare_or
    input: select 1=1 or 2=2
    dialects:
      hyper:

  # Plus/minus same precedence left-assoc: 10-2+3 = (10-2)+3
  - name: prec_plus_plus
    input: select 1+2+3
    dialects:
      hyper:

  # Modulo and multiply same precedence left-assoc
  - name: prec_minus_plus
    input: select 10-2+3
    dialects:
      hyper:

  # Modulo higher than plus
  - name: prec_mod_mul
    input: select 10%3*2
    dialects:
      hyper:

  # Unary minus higher than multiply: -2*3 = (-2)*3
  - name: prec_mod_plus
    input: select 10%3+1
    dialects:
      hyper:

  # NOT lower than comparison: not 1>2 = not (1>2)
  - name: prec_unary_minus_mul
    input: select -2*3
    dialects:
      hyper:

  # Left-assoc AND: 1 and 2 and 3 = (1 and 2) and 3
  - name: prec_not_compare
    input: select not 1>2
    dialects:
      hyper:

  # Left-assoc OR: 1 or 2 or 3 = (1 or 2) or 3
  - name: prec_and_and
    input: select 1 and 2 and 3
    dialects:
      hyper:

  # Div and modulo same precedence left-assoc
  - name: prec_or_or
    input: select 1 or 2 or 3
    dialects:
      hyper:

  - name: prec_div_mod
    input: select 10/2%3
    dialects:
      hyper:


  # `^` is left-associative, the parentheses of a right operand stay, unary minus binds tighter than `^`
  - name: prec_pow_assoc
    input: select 2^3^2, (2^3)^2, 2^(3^2), -2^2, (-2)^2
    dialects:
      hyper:
        validation: {}

  # A minus before a minus gets parentheses, `--` would start a comment
  - name: prec_double_negation
    input: select - -1, -(-a), - (-a), a - -b, -(a*b), (-a)*b, a- - -b, - - - a from t
    dialects:
      hyper:
        validation:
          setup: create table t(a int, b int);

  # The parentheses of right operands of the same precedence stay
  - name: prec_right_operands
    input: select a / (b * c), a / b * c, a - (b + c), a * (b / c), a % (b % c), a / (b / c), a - (b - c) - d, ((a + b)) * ((c)), (((a))) from t
    dialects:
      hyper:
        validation:
          setup: create table t(a int, b int, c int, d int);

  # Comparisons as operands of comparisons and tests
  - name: prec_comparison_nesting
    input: select (a = b) = p, p = (a = b), (a < b) is true, not (a is null), (not p) = q, (a = b) is null, ((a = 1)) and ((b = 2)) from t
    dialects:
      hyper:
        validation:
          setup: create table t(a int, b int, p bool, q bool);

  # NOT gets parentheses around a comparison, the parentheses of an OR inside an AND stay
  - name: prec_not_variations
    input: select not not a, not (a and b) or c, not a = b, a and not b or not c, not (a or (b and not (c or d))) from t
    dialects:
      hyper:
        validation:
          setup: create table t(a bool, b bool, c bool, d bool);

  # `||` binds tighter than LIKE, LIKE tighter than `=`
  - name: prec_concat_like
    input: select a || b like c || d, (a like b) = true, a || (b || c), (a || b) || c, a like (b || c), a not like (b) from t
    dialects:
      hyper:
        validation:
          setup: create table t(a text, b text, c text, d text);

  # BETWEEN binds tighter than AND outside of it, a boolean bound keeps its parentheses
  - name: prec_between_operands
    input: select a between b + 1 and c * 2, (a between 1 and 2) = true, a between (select 1) and 2, (a in (1, 2)) = false, a + 1 in (2, 3), (a between b and c) and p, p between (p and q) and q, p between q and (p and q) from t
    dialects:
      hyper:
        validation:
          setup: create table t(a int, b int, c int, p bool, q bool);

  # IN, LIKE and IS with operands of lower precedence
  - name: prec_in_like_is_operands
    input: select (p or q) in (true), p in (q or r, true), (a + 1) not in (1, 2), - a in (1), (p or q)::text like 'x', (p and q) is true, p and q is true, (p or q) is null, (a = 1) is not distinct from (b = 2), p is distinct from a = b from t
    dialects:
      hyper:
        validation:
          setup: create table t(a int, b int, p bool, q bool, r bool);

  # ISNULL and NOTNULL are written as IS NULL and IS NOT NULL
  - name: prec_isnull_notnull
    input: select a isnull, a notnull, a + 1 isnull, not a notnull from t
    dialects:
      hyper:
        validation:
          setup: create table t(a int);

  # Casts bind tighter than unary minus, operands of lower precedence keep their parentheses
  - name: prec_typecast_operands
    input: select (-1)::text, (-a)::text, -(a::int), (not p)::text, (a is null)::text, (a = b)::text, (a between 1 and 2)::text, array[1, 2]::text[], (array[1] || array[2])::bigint[] from t
    dialects:
      hyper:
        validation:
          setup: create table t(a int, b int, p bool);

  # CASE needs no parentheses as an operand
  - name: prec_case_operands
    input: select (case when p then 1 end) + 1, case when p then 1 end = 1, -(case when p then 1 end), (case when p then b end)::text, not (case when p then true end) from t
    dialects:
      hyper:
        validation:
          setup: create table t(b int, p bool);

  # Subqueries and EXISTS as operands
  - name: prec_subquery_operands
    input: select -(select 1), (select 1) * 2, a in (select 1 union select 2), (select 1 union select 1) = 1, exists (select 1) = true, not exists (select 1) or p from t
    dialects:
      hyper:
        validation:
          setup: create table t(a int, p bool);

  # COLLATE and AT TIME ZONE bind tighter than the arithmetic, AT TIME ZONE is left-associative
  - name: prec_collate_at_time_zone
    input: select (a || b) collate "C", a || b collate "C", (ts at time zone 'UTC') at time zone 'CET', (ts + interval '1 day') at time zone 'UTC', ts at time zone (a || 'x'), f(ts) at time zone a, ts at time zone 'UTC' + interval '1' hour from t
    dialects:
      hyper:
