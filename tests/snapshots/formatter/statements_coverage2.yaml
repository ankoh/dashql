  - name: coverage_merge_subquery_source_cte
    input: |-
      with s as (select 1 as id, 2 as a) merge into t using (select id, a from s where a > 0) as src on t.id = src.id when matched then update set a = src.a, b = src.a * 2 when not matched then insert (id, a) values (src.id, src.a)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with s as (select 1 as id, 2 as a) merge into t using (select id, a from s where a > 0) src on t.id = src.id when matched then update set a = src.a, b = src.a * 2 when not matched then insert (id, a) values (src.id, src.a);
          - mode: compact
            expected: |-
              with s as (select 1 as id, 2 as a)
              merge into t
              using (select id, a from s where a > 0) src
              on t.id = src.id
              when matched then update set a = src.a, b = src.a * 2
              when not matched then insert (id, a) values (src.id, src.a);
          - mode: pretty
            expected: |-
              with s as (
                select 1 as id, 2 as a
              )
              merge into t
              using (
                select id, a
                from s
                where a > 0
              ) src
              on t.id = src.id
              when matched then update set a = src.a, b = src.a * 2
              when not matched then insert (id, a) values (src.id, src.a);

