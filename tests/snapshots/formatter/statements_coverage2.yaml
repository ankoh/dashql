  - name: coverage_update_from_join_narrow
    input: |-
      update update_j as t set amount = o.amount + p.amount from update_o as o join update_p as p on o.id = p.other_id where t.id = o.id and p.kind = 'x'
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              update update_j t set amount = o.amount + p.amount from update_o o join update_p p on o.id = p.other_id where t.id = o.id and p.kind = 'x';
          - mode: compact
            width: 50
            expected: |-
              update update_j t
              set amount = o.amount + p.amount
              from update_o o
                join update_p p on o.id = p.other_id
              where t.id = o.id and p.kind = 'x';
          - mode: pretty
            width: 50
            expected: |-
              update update_j t
              set amount = o.amount + p.amount
              from update_o o
                join update_p p on o.id = p.other_id
              where t.id = o.id and p.kind = 'x';
        validation:
          setup: |-
            create table update_j(id int, amount int);
            create table update_o(id int, amount int);
            create table update_p(other_id int, amount int, kind text);

