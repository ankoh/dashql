            expected: |-
              update some_table set (first_column, second_column) = (select other_first, other_second from other_table where other_table.id = some_table.id) where some_table.id > 0;
          - mode: compact
            width: 50
            expected: |-
              update some_table
              set (first_column, second_column) = (
                select other_first, other_second
                from other_table
                where other_table.id = some_table.id
              )
              where some_table.id > 0;
          - mode: pretty
            width: 50
            expected: |-
              update some_table
              set (first_column, second_column) = (
                select other_first, other_second
                from other_table
                where other_table.id = some_table.id
