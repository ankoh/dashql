  - name: coverage_update_precedence
    input: |-
      update update_q set a = (b + c) * a, b = b - (c - a), c = -(-c), d = not (a = b or c = a) returning (a + b) * c, a + b * c
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              update update_q set a = (b + c) * a, b = b - (c - a), c = -(-c), d = not (a = b or c = a) returning (a + b) * c, a + b * c;
          - mode: compact
            expected: |-
              update update_q
              set a = (b + c) * a, b = b - (c - a), c = -(-c), d = not (a = b or c = a)
              returning (a + b) * c, a + b * c;
          - mode: pretty
            expected: |-
              update update_q
              set a = (b + c) * a, b = b - (c - a), c = -(-c), d = not (a = b or c = a)
              returning (a + b) * c, a + b * c;
        validation:
          setup: |-
            create table update_q(a int, b int, c int, d bool);

