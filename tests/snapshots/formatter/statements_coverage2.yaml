formatter-snapshots:

  - name: coverage_update_recursive_cte
    input: |-
      with recursive r(n) as (select 1 union all select n + 1 from r where n < 3) update t set a = r.n from r where t.id = r.n
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with recursive r (n) as (select 1 union all select n + 1 from r where n < 3) update t set a = r.n from r where t.id = r.n;
          - mode: compact
            expected: |-
              with recursive r (n) as (select 1 union all select n + 1 from r where n < 3)
              update t
              set a = r.n
              from r
              where t.id = r.n;
          - mode: pretty
            expected: |-
              with recursive r (n) as (
                select 1
                union all
                select n + 1
                from r
                where n < 3
              )
              update t
              set a = r.n
              from r
              where t.id = r.n;

  - name: coverage_update_only_star
    input: |-
      update only t set a = 1; update t * set a = 2
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              update only t set a = 1;

              update t * set a = 2;
          - mode: compact
            expected: |-
              update only t set a = 1;

              update t * set a = 2;
          - mode: pretty
            expected: |-
              update only t
              set a = 1;

              update t *
              set a = 2;

  - name: coverage_update_in_cte
    input: |-
      with u as (update t set a = 1 returning a) select * from u
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with u as (update t set a = 1 returning a) select * from u;
          - mode: compact
            expected: |-
              with u as (update t set a = 1 returning a) select * from u;
          - mode: pretty
            expected: |-
              with u as (
                update t
                set a = 1
                returning a
              )
              select *
              from u;

  - name: coverage_data_modifying_ctes
    input: |-
      with d as (delete from t where a < 0 returning *), i as (insert into u select * from d returning id) update v set n = n + 1 where id in (select id from i)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              with d as (delete from t where a < 0 returning *), i as (insert into u select * from d returning id) update v set n = n + 1 where id in (select id from i);
          - mode: compact
            expected: |-
              with d as (delete from t where a < 0 returning *), i as (insert into u select * from d returning id)
              update v
              set n = n + 1
              where id in (select id from i);
          - mode: pretty
            expected: |-
              with d as (
                  delete from t
                  where a < 0
                  returning *
                ),
                i as (
                  insert into u
                  select *
                  from d
                  returning id
                )
              update v
              set n = n + 1
              where id in (
                select id
                from i
              );

