formatter-snapshots:

  - name: coverage_call_no_args
    input: |-
      CALL  foo( )
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              call foo ();
          - mode: compact
            expected: |-
              call foo ();
          - mode: pretty
            expected: |-
              call foo ();

  - name: coverage_call_args
    input: |-
      CALL s.f('hello',1, b => -1.5,c=>TRUE)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              call s.f ('hello', 1, b => -1.5, c => TRUE);
          - mode: compact
            expected: |-
              call s.f ('hello', 1, b => -1.5, c => TRUE);
          - mode: pretty
            expected: |-
              call s.f ('hello', 1, b => -1.5, c => TRUE);

  - name: coverage_call_long
    input: |-
      call s.long_procedure_name ('first argument that is long', 'second argument that is long', named_argument => 'third argument');
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              call s.long_procedure_name ('first argument that is long', 'second argument that is long', named_argument => 'third argument');
          - mode: compact
            expected: |-
              call s.long_procedure_name (
                'first argument that is long', 'second argument that is long', named_argument => 'third argument'
              );
          - mode: pretty
            expected: |-
              call s.long_procedure_name (
                'first argument that is long',
                'second argument that is long',
                named_argument => 'third argument'
              );

  - name: call_description_blank_line
    input: |-
      /**
       * The description.
       */

      call f (1);
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              call f (1);
          - mode: compact
            expected: |-
              /**
               * The description.
               */

              call f (1);
          - mode: pretty
            expected: |-
              /**
               * The description.
               */

              call f (1);
