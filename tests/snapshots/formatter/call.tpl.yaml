formatter-snapshots:
  # A call without arguments
  - name: coverage_call_no_args
    input: CALL  foo( )
    dialects:
      hyper:
  # Positional and named arguments
  - name: coverage_call_args
    input: CALL s.f('hello',1, b => -1.5,c=>TRUE)
    dialects:
      hyper:
  # A long call breaks
  - name: coverage_call_long
    input: |
      call s.long_procedure_name ('first argument that is long', 'second argument that is long', named_argument => 'third argument');
    dialects:
      hyper:
  # The blank line after a description stays
  - name: call_description_blank_line
    input: |
      /**
       * The description.
       */

      call f (1);
    dialects:
      hyper:
