formatter-snapshots:

  - name: coverage_json_parse
    input: |-
      select json('[1]'), json_scalar(1)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select json('[1]'), json_scalar(1);
          - mode: compact
            expected: |-
              select json('[1]'), json_scalar(1);
          - mode: pretty
            expected: |-
              select json('[1]'), json_scalar(1);
        validation:
          setup: |-
            select 1;

  - name: coverage_json_object
    input: |-
      select json_object('a': 1, 'b': null::integer absent on null), json_object('c': true), json_object()
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select json_object('a': 1, 'b': null::integer absent on null), json_object('c': true), json_object();
          - mode: compact
            expected: |-
              select json_object('a': 1, 'b': null::integer absent on null), json_object('c': true), json_object();
          - mode: pretty
            expected: |-
              select json_object('a': 1, 'b': null::integer absent on null), json_object('c': true), json_object();
        validation:
          setup: |-
            select 1;

  - name: coverage_json_array
    input: |-
      select json_array(1, null::integer null on null), json_array('[1]' format json), json_array()
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select json_array(1, null::integer null on null), json_array('[1]' format json), json_array();
          - mode: compact
            expected: |-
              select json_array(1, null::integer null on null), json_array('[1]' format json), json_array();
          - mode: pretty
            expected: |-
              select json_array(1, null::integer null on null), json_array('[1]' format json), json_array();
        validation:
          setup: |-
            select 1;

  - name: coverage_json_unique_keys
    input: |-
      select json('{"a":1}' with unique keys), json('[1]' without unique keys), json_object('a': 1 null on null with unique keys)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select json('{"a":1}' with unique keys), json('[1]' without unique keys), json_object('a': 1 null on null with unique keys);
          - mode: compact
            expected: |-
              select json('{"a":1}' with unique keys), json('[1]' without unique keys),
                json_object('a': 1 null on null with unique keys);
          - mode: pretty
            expected: |-
              select json('{"a":1}' with unique keys),
                json('[1]' without unique keys),
                json_object('a': 1 null on null with unique keys);

  - name: coverage_json_query
    input: |-
      select json_query('[1,2]', '$' with array wrapper), json_query('[1]', '$' with conditional wrapper omit quotes empty array on empty error on error), json_query('{"a":[1]}', '$.a' without wrapper keep quotes)
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select json_query('[1,2]', '$' with unconditional wrapper), json_query('[1]', '$' with conditional wrapper omit quotes empty array on empty error on error), json_query('{"a":[1]}', '$.a' without wrapper keep quotes);
          - mode: compact
            expected: |-
              select json_query('[1,2]', '$' with unconditional wrapper),
                json_query('[1]', '$' with conditional wrapper omit quotes empty array on empty error on error),
                json_query('{"a":[1]}', '$.a' without wrapper keep quotes);
          - mode: pretty
            expected: |-
              select json_query('[1,2]', '$' with unconditional wrapper),
                json_query('[1]', '$' with conditional wrapper omit quotes empty array on empty error on error),
                json_query('{"a":[1]}', '$.a' without wrapper keep quotes);

  - name: coverage_json_value
    input: |-
      select json_value('{"a":1}', '$.a' returning integer default 0 on empty error on error), json_value('{"a":1}', '$.a' passing 1 as x returning integer null on empty), json_value('{"a":"x"}', '$.a')
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select json_value('{"a":1}', '$.a' returning integer default 0 on empty error on error), json_value('{"a":1}', '$.a' passing 1 as x returning integer null on empty), json_value('{"a":"x"}', '$.a');
          - mode: compact
            expected: |-
              select json_value('{"a":1}', '$.a' returning integer default 0 on empty error on error),
                json_value('{"a":1}', '$.a' passing 1 as x returning integer null on empty), json_value('{"a":"x"}', '$.a');
          - mode: pretty
            expected: |-
              select json_value('{"a":1}', '$.a' returning integer default 0 on empty error on error),
                json_value('{"a":1}', '$.a' passing 1 as x returning integer null on empty),
                json_value('{"a":"x"}', '$.a');

  - name: coverage_json_exists
    input: |-
      select json_exists('{"a":1}', '$.a' false on error), json_exists('{"a":1}', '$.b')
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select json_exists('{"a":1}', '$.a' false on error), json_exists('{"a":1}', '$.b');
          - mode: compact
            expected: |-
              select json_exists('{"a":1}', '$.a' false on error), json_exists('{"a":1}', '$.b');
          - mode: pretty
            expected: |-
              select json_exists('{"a":1}', '$.a' false on error), json_exists('{"a":1}', '$.b');

  - name: json_query_narrow
    input: |-
      select json_query(document, '$.items' passing 1 as first_item returning text with conditional wrapper omit quotes empty array on empty error on error) from documents
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select json_query(document, '$.items' passing 1 as first_item returning text with conditional wrapper omit quotes empty array on empty error on error) from documents;
          - mode: compact
            width: 60
            expected: |-
              select json_query(
                document, '$.items' passing 1 as first_item
                  returning text with conditional wrapper omit quotes
                  empty array on empty error on error
              )
              from documents;
          - mode: pretty
            width: 60
            expected: |-
              select json_query(
                document, '$.items' passing 1 as first_item
                  returning text with conditional wrapper omit quotes
                  empty array on empty error on error
              )
              from documents;

  - name: coverage_external_stream
    input: |-
      select * from external stream events (with (cardinality 100)), external stream s.other with cardinality 5 as o, external stream third
    dialects:
      hyper:
        formatted:
          - mode: inline
            expected: |-
              select * from external stream events (with (cardinality 100)), external stream s.other (with (cardinality 5)) o, external stream third;
          - mode: compact
            expected: |-
              select *
              from external stream events (with (cardinality 100)), external stream s.other (with (cardinality 5)) o,
                external stream third;
          - mode: pretty
            expected: |-
              select *
              from external stream events (with (cardinality 100)),
                external stream s.other (with (cardinality 5)) o,
                external stream third;
