formatter-snapshots:

  - name: group_by_expression
    input: select a from test group by a
    dialects:
      hyper:
        validation:
          setup: |-
            create table test (a int);

  - name: group_by_empty
    input: select 1 from test group by ()
    dialects:
      hyper:

  - name: group_by_cube
    input: select a from test group by cube(a, b)
    dialects:
      hyper:

  - name: group_by_rollup
    input: select a from test group by rollup(a, b)
    dialects:
      hyper:

  - name: group_by_grouping_sets
    input: select a from test group by grouping sets(a, b)
    dialects:
      hyper:

  - name: group_by_multiple
    input: select a, b, c from test group by a, b, c
    dialects:
      hyper:
        validation:
          setup: |-
            create table test (a int, b int, c int);

  - name: group_by_incomplete
    input: select * from "Region" where "r_Name" = 'EUROPE' group by
    dialects:
      hyper:

  # Grouping sets with nested sets, CUBE, ROLLUP and the empty set; a set with one element loses its parentheses
  - name: group_by_grouping_sets_nested
    input: select region, segment, channel, sum(amount) from sales group by grouping sets ((region, segment, channel), (region, segment), (region), cube (channel, segment), rollup (region, channel), ())
    dialects:
      hyper:
        formatted:
          - mode: compact
            width: 80
          - mode: pretty
            width: 80
        validation:
          setup: create table sales(region text, segment text, channel text, amount int);
