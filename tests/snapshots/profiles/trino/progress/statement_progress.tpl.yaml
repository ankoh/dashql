trino-progress-snapshots:
  # The recordings are written by `bazel run //tests/trino:trino_recorder`
  - name: select_one
    recording: select_one
  - name: aggregate_lineitem_sf1
    recording: aggregate_lineitem_sf1
  - name: tpch_q3_sf1
    recording: tpch_q3_sf1
  - name: cancelled_sf10
    recording: cancelled_sf10
  - name: failed_cast
    recording: failed_cast
  # Hand-written recordings (handwritten_*.json) for the edge cases of the statement adapter.
  # Queued and planning polls, then stages that fail, abort, get cancelled or report a state the adapter does not know
  - name: handwritten_stage_states
    recording: handwritten_stage_states
  # Polls without stats or with empty stats, counters that shrink or are no unsigned integers, a poll that arrives
  # with an older time, a stage that moves below another one, a stage without id, a poll without time
  - name: handwritten_irregular_polls
    recording: handwritten_irregular_polls
  # Stages without statistics: a stage that is PENDING after RUNNING has done its work and succeeded, before the
  # query finishes
  - name: handwritten_operator_summaries
    recording: handwritten_operator_summaries
  # A recording without statement polls: no fragments and no updates
  - name: handwritten_plan_shapes_without_polls
    recording: handwritten_plan_shapes
