profile-snapshots:
  # Hand-written Hyper plans for the edge cases of the parser and the layout (the other files are recorded plans)

  # Documents without operators
  - name: empty_object
    input: '{}'
  - name: empty_array
    input: '[]'
  - name: scalar_document
    input: '42'
  # An operator member that is no string does not make an operator, the operator below it becomes the root
  - name: operator_member_not_a_string
    input: '{"operator":42,"input":{"operator":"tablescan","operatorId":7}}'

  # Single operators
  - name: single_operator
    input: '{"operator":"tablescan","operatorId":1}'
  - name: single_execution_target
    input: '{"operator":"executiontarget","operatorId":1}'
  - name: single_federate
    input: '{"operator":"federate","operatorId":1}'

  # Several root operators in a top-level array, placed in reverse plan order and packed left to right
  - name: root_operators_in_array
    input: '[{"operator":"tablescan","operatorId":1},{"operator":"map","operatorId":2,"input":{"operator":"tablescan","operatorId":3}},{"operator":"select","operatorId":4}]'
  # Two execution targets at the root: two hidden root fragments
  - name: two_execution_targets
    input: '[{"operator":"executiontarget","operatorId":1,"input":{"operator":"tablescan","operatorId":2}},{"operator":"executiontarget","operatorId":3,"input":{"operator":"tablescan","operatorId":4}}]'
  # An execution target below another operator is no root fragment
  - name: nested_execution_target
    input: '{"operator":"map","operatorId":1,"input":{"operator":"executiontarget","operatorId":2,"input":{"operator":"tablescan","operatorId":3}}}'
  # Sibling federates below a join: two child fragments of the hidden root fragment
  - name: sibling_federates
    input: '{"operator":"executiontarget","operatorId":1,"input":{"operator":"join","operatorId":2,"left":{"operator":"federate","operatorId":3,"inputs":[{"operator":"tablescan","operatorId":4}]},"right":{"operator":"federate","operatorId":5,"inputs":[{"operator":"tablescan","operatorId":6}]}}}'

  # Operator kinds: unknown types keep no kind, the kind ignores case and dashes
  - name: unknown_operator_types
    input: '{"operator":"executiontarget","operatorId":1,"input":{"operator":"fancynewoperator","operatorId":2,"input":{"operator":"earlyprobe","operatorId":3,"builder":4,"input":{"operator":"leftsinglejoin","operatorId":4,"left":{"operator":"tablescan","operatorId":5},"right":{"operator":"","operatorId":6}}}}}'
  - name: operator_kind_spellings
    input: '{"operator":"Union","operatorId":1,"inputs":[{"operator":"Left-Outer-Join","operatorId":2,"left":{"operator":"PARQUET-SCAN","operatorId":3},"right":{"operator":"parquetscan","operatorId":4}},{"operator":"intersect","operatorId":5,"inputs":[{"operator":"virtualtable","operatorId":6},{"operator":"tableconstruction","operatorId":7}]},{"operator":"except","operatorId":8,"inputs":[{"operator":"tablefunction","operatorId":9},{"operator":"explicit-scan","operatorId":10,"input":9}]}]}'
  - name: join_kinds
    input: '{"operator":"fullouterjoin","operatorId":1,"left":{"operator":"rightmarkjoin","operatorId":2,"left":{"operator":"scan","operatorId":3},"right":{"operator":"scan","operatorId":4}},"right":{"operator":"rightsemijoin","operatorId":5,"left":{"operator":"scan","operatorId":6},"right":{"operator":"scan","operatorId":7}}}'

  # Paths: operators nested in members and arrays that are no operators
  - name: operator_below_wrapper_objects
    input: '{"operator":"join","operatorId":1,"left":{"wrapper":{"items":[{"note":"no operator"},{"operator":"tablescan","operatorId":2}]}},"right":[[{"operator":"tablescan","operatorId":3}]]}'
  # Operator ids: both spellings, ids that are no unsigned integers give no engine id
  - name: operator_id_spellings
    input: '{"operator":"unionall","operator-id":1,"inputs":[{"operator":"tablescan","operatorId":"2"},{"operator":"tablescan","operatorId":-3},{"operator":"tablescan","operatorId":4.5},{"operator":"tablescan","operatorId":5}]}'

  # Labels: debug names in both spellings, debug names without a string value, labels longer than the cap
  - name: debug_name_labels
    input: '{"operator":"unionall","operatorId":1,"inputs":[{"operator":"tablescan","operatorId":2,"debugName":{"classification":"nonsensitive","value":"orders"}},{"operator":"tablescan","operatorId":3,"debug-name":{"value":"a_very_long_relation_name_beyond_the_cap"}},{"operator":"tablescan","operatorId":4,"debugName":{"value":7}},{"operator":"tablescan","operatorId":5,"debugName":"plain"}]}'
  # A blank debug name is no label: the operator shows its type, a scan the relation of its attributes. A debug name is
  # trimmed
  - name: debug_name_blank
    input: '{"operator":"unionall","operatorId":1,"inputs":[{"operator":"tablescan","operatorId":2,"debugName":{"value":""}},{"operator":"tablescan","operatorId":3,"debugName":{"value":"  "}},{"operator":"scan","operatorId":4,"debugName":{"value":""},"attributes":[{"defines":{"id":"part.p_partkey"}}]},{"operator":"tablescan","operatorId":5,"debugName":{"value":" orders "}}]}'
  # A scan without a debug name takes the relation of the attributes it defines, if they agree on one
  - name: scan_label_from_attributes
    input: '{"operator":"unionall","operatorId":1,"inputs":[{"operator":"scan","operatorId":2,"attributes":[{"defines":{"id":"lineitem.l_orderkey"}},{"defines":{"id":"lineitem.l_partkey"}}]},{"operator":"scan","operatorId":3,"attributes":[{"defines":{"id":"orders.o_orderkey"}},{"defines":{"id":"customer.c_custkey"}}]},{"operator":"scan","operatorId":4,"attributes":[{"defines":{"id":"nodot"}},{"defines":{"id":".leading"}}]},{"operator":"tablescan","operatorId":5,"attributes":[{"defines":{"id":"part.p_partkey"}}]},{"operator":"scan","operatorId":6,"debugName":{"value":"explicit"},"attributes":[{"defines":{"id":"part.p_partkey"}}]}]}'

  # Source locations: the first range wins, a reversed range has no length, a range without end is skipped
  - name: sqlpos_variants
    input: '{"operator":"unionall","operatorId":1,"sqlpos":[[10,20],[30,40]],"inputs":[{"operator":"tablescan","operatorId":2,"sqlpos":[[50,45]]},{"operator":"tablescan","operatorId":3,"sqlpos":[]},{"operator":"tablescan","operatorId":4,"sqlpos":[[7]]},{"operator":"tablescan","operatorId":5,"sqlpos":[[0,1]]}]}'
  # Source locations: a range with an offset that is no number (a string, null, negative, beyond 32 bits) is skipped,
  # the next range counts
  - name: sqlpos_not_numbers
    input: '{"operator":"unionall","operatorId":1,"sqlpos":[["a",9]],"inputs":[{"operator":"tablescan","operatorId":2,"sqlpos":[["a",9],[3,5]]},{"operator":"tablescan","operatorId":3,"sqlpos":[[1,null]]},{"operator":"tablescan","operatorId":4,"sqlpos":[[-1,4],[7],[8,12]]},{"operator":"tablescan","operatorId":5,"sqlpos":[[0,4294967296]]}]}'

  # Estimates: all spellings, nested in the statistics, zero, fractional, and no estimate at all. The first spelling
  # that exists wins even if it is no number (core_quirks.md)
  - name: estimate_spellings
    input: '{"operator":"unionall","operatorId":1,"cardinality":0,"inputs":[{"operator":"tablescan","operatorId":2,"estimated-rows":12.5},{"operator":"tablescan","operatorId":3,"estimatedRows":3},{"operator":"tablescan","operatorId":4,"statistics":{"estimated-rows":4.8375}},{"operator":"tablescan","operatorId":5,"cardinality":"many"},{"operator":"tablescan","operatorId":6},{"operator":"tablescan","operatorId":7,"estimated-rows":"x","cardinality":5}]}'

  # Layout of wide and deep trees
  - name: wide_union
    input: '{"operator":"executiontarget","operatorId":1,"input":{"operator":"unionall","operatorId":2,"inputs":[{"operator":"tablescan","operatorId":3},{"operator":"tablescan","operatorId":4},{"operator":"tablescan","operatorId":5},{"operator":"tablescan","operatorId":6},{"operator":"tablescan","operatorId":7},{"operator":"tablescan","operatorId":8},{"operator":"tablescan","operatorId":9},{"operator":"tablescan","operatorId":10},{"operator":"tablescan","operatorId":11},{"operator":"tablescan","operatorId":12}]}}'
  - name: deep_chain
    input: '{"operator":"executiontarget","operatorId":1,"input":{"operator":"sort","operatorId":2,"input":{"operator":"map","operatorId":3,"input":{"operator":"select","operatorId":4,"input":{"operator":"groupby","operatorId":5,"input":{"operator":"map","operatorId":6,"input":{"operator":"select","operatorId":7,"input":{"operator":"window","operatorId":8,"input":{"operator":"map","operatorId":9,"input":{"operator":"select","operatorId":10,"input":{"operator":"map","operatorId":11,"input":{"operator":"select","operatorId":12,"input":{"operator":"tablescan","operatorId":13}}}}}}}}}}}}}'
  # Deep subtrees on both sides of a leaf: the contours of the outer subtrees meet below the leaf
  - name: unbalanced_subtrees
    input: '{"operator":"unionall","operatorId":1,"inputs":[{"operator":"join","operatorId":2,"left":{"operator":"join","operatorId":3,"left":{"operator":"tablescan","operatorId":4},"right":{"operator":"join","operatorId":5,"left":{"operator":"tablescan","operatorId":6},"right":{"operator":"tablescan","operatorId":7}}},"right":{"operator":"tablescan","operatorId":8}},{"operator":"tablescan","operatorId":9},{"operator":"join","operatorId":10,"left":{"operator":"tablescan","operatorId":11},"right":{"operator":"join","operatorId":12,"left":{"operator":"join","operatorId":13,"left":{"operator":"tablescan","operatorId":14},"right":{"operator":"tablescan","operatorId":15}},"right":{"operator":"tablescan","operatorId":16}}}]}'

  # Pipelines: unknown operator ids are skipped, a pipeline without known operators has no slots, a member listed
  # twice keeps its first role, a pipeline without id has no engine id
  - name: pipeline_edge_cases
    input: '{"operator":"executiontarget","operatorId":1,"input":{"operator":"join","operatorId":2,"left":{"operator":"tablescan","operatorId":3},"right":{"operator":"tablescan","operatorId":4}},"pipelines":[{"pipelineId":1,"operators":[3,99,2]},{"pipelineId":2,"operators":[4,2,4,1]},{"operators":[1]},{"pipelineId":3,"operators":[]},{"pipelineId":4},"not a pipeline"]}'
  # Pipelines without fragments (no execution target) and a pipeline member listed before its child
  - name: pipelines_without_fragments
    input: '{"operator":"map","operatorId":1,"input":{"operator":"tablescan","operatorId":2},"pipelines":[{"pipelineId":7,"operators":[1,2]}]}'
  # Pipelines that are no array are ignored
  - name: pipelines_not_an_array
    input: '{"operator":"executiontarget","operatorId":1,"input":{"operator":"tablescan","operatorId":2},"pipelines":{"pipelineId":1,"operators":[2,1]}}'
  # Two operators with the same id: the pipeline takes the first one in flattened order
  - name: duplicate_operator_ids
    input: '{"operator":"executiontarget","operatorId":1,"input":{"operator":"join","operatorId":2,"left":{"operator":"tablescan","operatorId":3},"right":{"operator":"tablescan","operatorId":3}},"pipelines":[{"pipelineId":1,"operators":[3,2,1]}]}'

  # Analyzed plans (EXPLAIN ANALYZE): the runtime counters become the execution state
  - name: analyzed_single_operator
    input: '{"operator":"tablescan","operatorId":1,"statistics":{"processed-rows":100,"output-rows":40,"memory-bytes":2048}}'
  # Zero counters are reported values, not unknown ones
  - name: analyzed_zero_counters
    input: '{"operator":"executiontarget","operatorId":1,"statistics":{"output-rows":0},"input":{"operator":"select","operatorId":2,"statistics":{"processed-rows":0,"output-rows":0,"memory-bytes":0},"input":{"operator":"tablescan","operatorId":3,"statistics":{"processed-rows":0,"output-rows":0}}}}'
  # Some operators without counters, the camelCase spellings, counters on the operator itself without statistics
  - name: analyzed_partial_counters
    input: '{"operator":"executiontarget","operatorId":1,"input":{"operator":"join","operatorId":2,"statistics":{"processedRows":30,"outputRows":12,"memoryBytes":512},"left":{"operator":"tablescan","operatorId":3,"output-rows":10},"right":{"operator":"tablescan","operatorId":4}}}'
  # A statistics object hides the counters on the operator itself
  - name: analyzed_statistics_object_wins
    input: '{"operator":"tablescan","operatorId":1,"output-rows":99,"statistics":{"processed-rows":5}}'
  # Counters that are no unsigned integers are not reported
  - name: analyzed_invalid_counters
    input: '{"operator":"executiontarget","operatorId":1,"statistics":{"output-rows":-1},"input":{"operator":"tablescan","operatorId":2,"statistics":{"processed-rows":2.5,"output-rows":"3","memory-bytes":null}}}'
  # Counters roll up per fragment: the federate counts its own operators, the root fragment the rest
  - name: analyzed_with_federate
    input: '{"operator":"executiontarget","operatorId":1,"statistics":{"output-rows":5},"input":{"operator":"groupby","operatorId":2,"statistics":{"processed-rows":50,"output-rows":5,"memory-bytes":1024},"input":{"operator":"federate","operatorId":3,"statistics":{"output-rows":50},"inputs":[{"operator":"tablescan","operatorId":4,"statistics":{"processed-rows":200,"output-rows":50,"memory-bytes":64}}]}}}'
  # Operator counters with pipelines: the pipelines know no counters, the fragment takes them from its operators
  - name: analyzed_with_pipelines
    input: '{"operator":"executiontarget","operatorId":1,"statistics":{"output-rows":8},"input":{"operator":"join","operatorId":2,"statistics":{"processed-rows":120,"output-rows":8,"memory-bytes":4096},"left":{"operator":"tablescan","operatorId":3,"statistics":{"output-rows":100}},"right":{"operator":"tablescan","operatorId":4,"statistics":{"output-rows":20}}},"pipelines":[{"pipelineId":1,"operators":[3,2]},{"pipelineId":2,"operators":[4,2,1]}]}'
