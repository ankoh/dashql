diff-snapshots:
  # The same broken statement on both sides next to a kept statement
  - name: broken_statement_both_sides
    source: |
      select a from t;
      select (;

    target: |
      select a from t;
      select (;

  # A broken statement in the middle is fixed
  - name: broken_statement_fixed
    source: |
      select a from t;
      select b, c from u where;
      select d from w;

    target: |
      select a from t;
      select b, c from u where x = 1;
      select d from w;

  # Only broken statements on both sides
  - name: only_broken_statements
    source: |
      select (;

    target: |
      select );

  # A statement cut off at the end of the script, without a semicolon
  - name: truncated_last_statement
    source: |
      select a from t;
      select b from u;

    target: |
      select a from t;
      select b from

  # Empty statements between semicolons don't count as statements
  - name: empty_statements
    source: |
      select a from t;

    target: |
      ;;
      select a from t;
      ;

  # A statement that parses with an error is still a statement: the clause it lost is no change of the target
  - name: statement_becomes_broken
    source: |
      select a, b, c, d, e, f from t where x = 1;
      select k from kept;

    target: |
      select a, b, c, d, e, f from t where;
      select k from kept;

  # The semicolon between two statements is removed: the two statements become one broken statement
  - name: statements_merged_by_missing_semicolon
    source: |
      select a from t;
      select b from u;
      select c from w;

    target: |
      select a from t
      select b from u;
      select c from w;

  # A string that is not terminated swallows the rest of the target script
  - name: unterminated_string_swallows_rest
    source: |
      select a from t where x = 'a';
      select b from u;

    target: |
      select a from t where x = 'a;
      select b from u;

  # A block comment that is not terminated hides the statements after it
  - name: unterminated_comment_hides_rest
    source: |
      select a from t;
      select b from u;
      select c from w;

    target: |
      select a from t;
      /* select b from u;
      select c from w;
