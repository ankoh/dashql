diff-snapshots:

  - name: broken_statement_both_sides
    source: |-
      select a from t;
      select (;
    target: |-
      select a from t;
      select (;
    expected:
      ops:
        - code: KEEP
          source-statement: 0
          target-statement: 0
          target-span: "select a from t"

  - name: broken_statement_fixed
    source: |-
      select a from t;
      select b, c from u where;
      select d from w;
    target: |-
      select a from t;
      select b, c from u where x = 1;
      select d from w;
    expected:
      ops:
        - code: KEEP
          source-statement: 0
          target-statement: 0
          target-span: "select a from t"
        - code: DELETE
          source-statement: 1
          source-span: "select b, ..om u where"
        - code: INSERT
          target-statement: 1
          target-span: "select b, ..here x = 1"
        - code: KEEP
          source-statement: 2
          target-statement: 2
          target-span: "select d from w"

  - name: only_broken_statements
    source: |-
      select (;
    target: |-
      select );
    expected:
      ops: []

  - name: truncated_last_statement
    source: |-
      select a from t;
      select b from u;
    target: |-
      select a from t;
      select b from
    expected:
      ops:
        - code: KEEP
          source-statement: 0
          target-statement: 0
          target-span: "select a from t"
        - code: DELETE
          source-statement: 1
          source-span: "select b from u"
        - code: INSERT
          target-statement: 1
          target-span: "select b from"

  - name: empty_statements
    source: |-
      select a from t;
    target: |-
      ;;
      select a from t;
      ;
    expected:
      ops:
        - code: KEEP
          source-statement: 0
          target-statement: 0
          target-span: "select a from t"

  - name: statement_becomes_broken
    source: |-
      select a, b, c, d, e, f from t where x = 1;
      select k from kept;
    target: |-
      select a, b, c, d, e, f from t where;
      select k from kept;
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes: []
        - code: KEEP
          source-statement: 1
          target-statement: 1
          target-span: "select k from kept"

  - name: statements_merged_by_missing_semicolon
    source: |-
      select a from t;
      select b from u;
      select c from w;
    target: |-
      select a from t
      select b from u;
      select c from w;
    expected:
      ops:
        - code: DELETE
          source-statement: 0
          source-span: "select a from t"
        - code: DELETE
          source-statement: 1
          source-span: "select b from u"
        - code: INSERT
          target-statement: 0
          target-span: "select a f..t b from u"
        - code: KEEP
          source-statement: 2
          target-statement: 1
          target-span: "select c from w"

  - name: unterminated_string_swallows_rest
    source: |-
      select a from t where x = 'a';
      select b from u;
    target: |-
      select a from t where x = 'a;
      select b from u;
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes:
            - text: "'a;\nselect.. b from u;"
        - code: DELETE
          source-statement: 1
          source-span: "select b from u"

  - name: unterminated_comment_hides_rest
    source: |-
      select a from t;
      select b from u;
      select c from w;
    target: |-
      select a from t;
      /* select b from u;
      select c from w;
    expected:
      ops:
        - code: KEEP
          source-statement: 0
          target-statement: 0
          target-span: "select a from t"
        - code: DELETE
          source-statement: 1
          source-span: "select b from u"
        - code: DELETE
          source-statement: 2
          source-span: "select c from w"
