diff-snapshots:
  # A new statement before all others: the old statements are kept, the new one is inserted
  - name: insert_at_start
    source: |
      select a from t;
      select b from u;

    target: |
      select x from v;
      select a from t;
      select b from u;

  # A new statement between two kept statements
  - name: insert_in_middle
    source: |
      select a from t;
      select b from u;
      select c from w;

    target: |
      select a from t;
      select x from v;
      select b from u;
      select c from w;

  # Several new statements in one place are inserted in target order
  - name: insert_block_in_middle
    source: |
      select a from t;
      select b from u;

    target: |
      select a from t;
      select x from v;
      select y from v;
      select z from v;
      select b from u;

  # Dropping the first statement
  - name: delete_first
    source: |
      select a from t;
      select b from u;
      select c from w;

    target: |
      select b from u;
      select c from w;

  # Dropping a statement between two kept statements
  - name: delete_middle
    source: |
      select a from t;
      select b from u;
      select c from w;

    target: |
      select a from t;
      select c from w;

  # A statement replaced by a completely different one in the same place: DELETE + INSERT
  - name: replace_middle_completely
    source: |
      select a from t;
      select b, c, d, e from u where x = 1;
      select c from w;

    target: |
      select a from t;
      create table z (id int);
      select c from w;

  # A statement changed slightly in the same place: UPDATE between two kept statements
  - name: update_middle_slightly
    source: |
      select a from t;
      select b, c, d, e, f from u where x = 1;
      select c from w;

    target: |
      select a from t;
      select b, c, d, e, f from u where x = 2;
      select c from w;

  # The first statement moves to the end: the longest common subsequence keeps the others
  - name: rotate_first_to_end
    source: |
      select a from t;
      select b from u;
      select c from w;

    target: |
      select b from u;
      select c from w;
      select a from t;

  # Reversing three statements keeps one and moves the other two
  - name: reverse_three
    source: |
      select a from t;
      select b from u;
      select c from w;

    target: |
      select c from w;
      select b from u;
      select a from t;

  # A statement moves and a new statement is inserted where it was
  - name: move_and_insert
    source: |
      select a from t;
      select b from u;
      select c from w;

    target: |
      select b from u;
      select x from v;
      select c from w;
      select a from t;

  # The last statement moves to the start: one MOVE, like a move to the end
  - name: rotate_last_to_start
    source: |
      select a from t;
      select b from u;
      select c from w;

    target: |
      select c from w;
      select a from t;
      select b from u;

  # The first and the last statement swap: both move
  - name: swap_first_and_last
    source: |
      select a from t;
      select b from u;
      select c from w;
      select d from x;

    target: |
      select d from x;
      select b from u;
      select c from w;
      select a from t;

  # An update stays in its section: the changed statement updates the similar statement between the same kept
  # statements, although a statement after the kept one is more similar
  - name: update_prefers_same_section
    source: |
      select a, b, c, d, e, f, g, h from t where x = 1 and y = 2;
      select k from kept;

    target: |
      select a, b, c, d, e, f, g, h from t where x = 9 and y = 9;
      select k from kept;
      select a, b, c, d, e, f, g, h from t where x = 1 and y = 3;

  # A table renamed in every statement that names it: one UPDATE per statement, the new name is the change
  - name: rename_table_everywhere
    source: |
      create table t (a int);
      insert into t values (1);
      select a from t;

    target: |
      create table orders (a int);
      insert into orders values (1);
      select a from orders;

  # Statements of different kinds swap places: both move
  - name: swap_ddl_and_query
    source: |
      create table t (a int);
      insert into t values (1);
      select a from t;

    target: |
      insert into t values (1);
      create table t (a int);
      select a from t;
