diff-snapshots:

  - name: update_column_removed
    source: |-
      select a, b, c, d, e, f from t;
    target: |-
      select a, b, c, d, e from t;
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes: []

  - name: update_operator_changed
    source: |-
      select a, b, c, d, e, f from t where x > 1;
    target: |-
      select a, b, c, d, e, f from t where x >= 1;
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes:
            - text: ">="

  - name: update_string_whitespace
    source: |-
      select a, b, c, d, e, f from t where x = 'a b';
    target: |-
      select a, b, c, d, e, f from t where x = 'a  b';
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes:
            - text: "'a  b'"

  - name: update_unicode_literal
    source: |-
      select a, b, c, d, e, f from t where city = 'München';
    target: |-
      select a, b, c, d, e, f from t where city = 'Zürich';
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes:
            - text: "'Zürich'"

  - name: update_join_added
    source: |-
      select a, b, c, d, e, f, g, h from t where x = 1;
    target: |-
      select a, b, c, d, e, f, g, h from t join u on t.id = u.id where x = 1;
    expected:
      ops:
        - code: DELETE
          source-statement: 0
          source-span: "select a, ..here x = 1"
        - code: INSERT
          target-statement: 0
          target-span: "select a, ..here x = 1"

  - name: update_in_subquery
    source: |-
      select a, b, c, d from t where x in (select y from u where z = 1);
    target: |-
      select a, b, c, d from t where x in (select y from u where z = 2);
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes:
            - text: "2"

  - name: select_to_create_table_as
    source: |-
      select a, b, c, d, e, f from t;
    target: |-
      create table s as select a, b, c, d, e, f from t;
    expected:
      ops:
        - code: DELETE
          source-statement: 0
          source-span: "select a, .., f from t"
        - code: INSERT
          target-statement: 0
          target-span: "create tab.., f from t"

  - name: update_distinct_added
    source: |-
      select a, b, c, d, e, f from t where x = 1;
    target: |-
      select distinct a, b, c, d, e, f from t where x = 1;
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes:
            - text: "distinct"

  - name: update_adjacent_changes_coalesced
    source: |-
      select a, b, c, d, e, f from t where x>1;
    target: |-
      select a, b, c, d, e, f from t where y<1;
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes:
            - text: "y<"

  - name: update_order_direction_changed
    source: |-
      select a, b, c, d, e, f from t order by a asc;
    target: |-
      select a, b, c, d, e, f from t order by a desc;
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes:
            - text: "desc"

  - name: update_join_type_changed
    source: |-
      select a, b, c, d, e, f, g, h from t join u on t.id = u.id;
    target: |-
      select a, b, c, d, e, f, g, h from t left join u on t.id = u.id;
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes:
            - text: "left join"

  - name: update_table_renamed
    source: |-
      select a, b, c, d, e, f from orders where x = 1;
    target: |-
      select a, b, c, d, e, f from orders_v2 where x = 1;
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes:
            - text: "orders_v2"

  - name: update_alias_renamed
    source: |-
      select a, b, c, d, e, sum(x) as total from t group by a, b, c, d, e;
    target: |-
      select a, b, c, d, e, sum(x) as revenue from t group by a, b, c, d, e;
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes:
            - text: "revenue"

  - name: update_float_literal_rescaled
    source: |-
      select a, b, c, d, e, f from t where x = 1.0;
    target: |-
      select a, b, c, d, e, f from t where x = 1.00;
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes:
            - text: "1.00"

  - name: update_interval_literal
    source: |-
      select a, b, c, d, e, f from t where ts > now() - interval '1 day';
    target: |-
      select a, b, c, d, e, f from t where ts > now() - interval '7 days';
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes:
            - text: "'7 days'"

  - name: update_boolean_literal
    source: |-
      select a, b, c, d, e, f from t where active = true;
    target: |-
      select a, b, c, d, e, f from t where active = false;
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes:
            - text: "false"

  - name: update_after_multibyte_text
    source: |-
      select 'Grüße', 'naïve', '日本', a, b, c from t where x = 1;
    target: |-
      select 'Grüße', 'naïve', '日本', a, b, c from t where x = 2;
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes:
            - text: "2"

  - name: update_nested_function_argument
    source: |-
      select a, b, c, round(avg(price * (1 - discount)), 2) from t group by a, b, c;
    target: |-
      select a, b, c, round(avg(price * (1 - tax)), 2) from t group by a, b, c;
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes:
            - text: "tax"

  - name: update_case_branch
    source: |-
      select a, b, c, d, case when x > 0 then 'pos' else 'neg' end from t;
    target: |-
      select a, b, c, d, case when x > 0 then 'pos' else 'zero' end from t;
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes:
            - text: "'zero'"

  - name: update_column_inserted_in_middle
    source: |-
      select a, b, c, d, e, f, g, h from t where x = 1 and y = 2 and z = 3;
    target: |-
      select a, n, b, c, d, e, f, g, h from t where x = 1 and y = 2 and z = 3;
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes:
            - text: "n"
            - text: "b"
            - text: "c"
            - text: "d"
            - text: "e"
            - text: "f"
            - text: "g"
            - text: "h"

  - name: update_union_all
    source: |-
      select a, b, c, d from t union select a, b, c, d from u;
    target: |-
      select a, b, c, d from t union all select a, b, c, d from u;
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes:
            - text: "all"
