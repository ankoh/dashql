diff-snapshots:

  - name: duplicate_inserted_after_original
    source: |-
      select a from t;
      select b from u;
    target: |-
      select a from t;
      select a from t;
      select b from u;
    expected:
      ops:
        - code: MOVE
          source-statement: 0
          target-statement: 0
          target-span: "select a from t"
        - code: INSERT
          target-statement: 1
          target-span: "select a from t"
        - code: KEEP
          source-statement: 1
          target-statement: 2
          target-span: "select b from u"

  - name: duplicate_inserted_at_end
    source: |-
      select a from t;
      select b from u;
    target: |-
      select a from t;
      select b from u;
      select a from t;
    expected:
      ops:
        - code: MOVE
          source-statement: 0
          target-statement: 0
          target-span: "select a from t"
        - code: KEEP
          source-statement: 1
          target-statement: 1
          target-span: "select b from u"
        - code: INSERT
          target-statement: 2
          target-span: "select a from t"

  - name: duplicate_removed_across_unique
    source: |-
      select a from t;
      select b from u;
      select a from t;
    target: |-
      select b from u;
      select a from t;
    expected:
      ops:
        - code: MOVE
          source-statement: 0
          target-statement: 1
          target-span: "select a from t"
        - code: KEEP
          source-statement: 1
          target-statement: 0
          target-span: "select b from u"
        - code: DELETE
          source-statement: 2
          source-span: "select a from t"

  - name: one_of_two_copies_changed
    source: |-
      select a, b, c, d, e, f from t where x = 1;
      select a, b, c, d, e, f from t where x = 1;
    target: |-
      select a, b, c, d, e, f from t where x = 1;
      select a, b, c, d, e, f from t where x = 2;
    expected:
      ops:
        - code: MOVE
          source-statement: 0
          target-statement: 0
          target-span: "select a, ..here x = 1"
        - code: UPDATE
          source-statement: 1
          target-statement: 1
          target-changes:
            - text: "2"

  - name: update_two_sources_tie
    source: |-
      select a, b, c, d, e, f from t where x = 1;
      select a, b, c, d, e, f from t where x = 2;
    target: |-
      select a, b, c, d, e, f from t where x = 3;
    expected:
      ops:
        - code: UPDATE
          source-statement: 0
          target-statement: 0
          target-changes:
            - text: "3"
        - code: DELETE
          source-statement: 1
          source-span: "select a, ..here x = 2"
