completion-snapshots:
  # Complete schema after "from dbname."
  - name: dots_catalog_complete_trailing_dot
    catalog:
      script:
        input: create table dbname.schemaname.foo(a int);
    editor:
      input: select * from dbname.
    cursor:
      search:
        text: dbname.
        index: 7
    completions:
      limit: 3

  # Complete at dot: .sch (schema)
  - name: dots_catalog_complete_at_dot
    catalog:
      script:
        input: create table dbname.schemaname.foo(a int);
    editor:
      input: select * from dbname.sch
    cursor:
      search:
        text: .sch
        index: 0
    completions:
      limit: 3

  # Complete previous dot: .sch index 1
  - name: dots_catalog_complete_previous_dot
    catalog:
      script:
        input: create table dbname.schemaname.foo(a int);
    editor:
      input: select * from dbname.sch
    cursor:
      search:
        text: .sch
        index: 1
    completions:
      limit: 3

  # Complete with quoted schema name
  - name: dots_catalog_complete_previous_dot_quotes
    catalog:
      script:
        input: create table dbname.schemaname.foo(a int);
    editor:
      input: select * from dbname."sch"
    cursor:
      search:
        text: name.
        index: 5
    completions:
      limit: 3

  # Same script: complete schema after dbname.
  - name: dots_catalog_same_script_complete_schema
    catalog: {}
    editor:
      input: |-
        create table dbname.schemaname.foo(a int);
        select * from dbname.
    cursor:
      search:
        text: from dbname.
        index: 12
    completions:
      limit: 3

  # A schema of the default database and a database with a table and a schema of the same name merge into one candidate
  - name: dots_catalog_schema_and_database_share_a_name
    catalog:
      script:
        input: create table x.foo(a int); create table x.foo.bar(b int);
    editor:
      input: select * from x.
    cursor:
      search:
        text: x.
        index: 2
    completions:
      limit: 3

  # An aliased join names the join: the alias completes the columns of the join, a USING column once
  - name: dots_catalog_join_alias
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int);
    editor:
      input: select j. from (t join u using (a)) as j
    cursor:
      search:
        text: j.
        index: 2
    completions:
      limit: 5

  # The column aliases of an aliased join rename its leading columns
  - name: dots_catalog_join_alias_column_aliases
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int);
    editor:
      input: select j.x from (t join u using (a)) as j(x, y)
    cursor:
      search:
        text: j.x
        index: 2
    completions:
      limit: 5

  # Outside of an aliased join, the alias hides the names of the FROM items inside it
  - name: dots_catalog_join_alias_hides_inner_names
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int);
    editor:
      input: select t. from (t join u using (a)) as j
    cursor:
      search:
        text: t.
        index: 2
    completions:
      limit: 5

  # Inside of an aliased join, its condition sees the names of the FROM items
  - name: dots_catalog_join_alias_condition_sees_inner_names
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int);
    editor:
      input: select 1 from (t join u on t. = u.a) as j
    cursor:
      search:
        text: t. =
        index: 2
    completions:
      limit: 5

  # A FROM item outside of an aliased join can take a name of the join, inside of the join the name is the inner one
  - name: dots_catalog_join_alias_condition_shadows_outer_name
    catalog:
      script:
        input: create table t (a int, b int); create table u (a int, c int);
    editor:
      input: select 1 from u as t, (t join u on t. = u.a) as j
    cursor:
      search:
        text: t. =
        index: 2
    completions:
      limit: 5
