completion-snapshots:
  # A dot after the source alias of a MERGE before its WHEN clauses, at the end of the input
  - name: fix_merge_on_dot_at_eof
    catalog:
      script:
        input: |-
          create table t (a int, b int, name text); create table u (a int, c int);
    editor:
      input: |-
        merge into t x using u y on x.a = y.
    cursor:
      search:
        text: 'y.'
        index: 2
    completions:
      limit: 5

  # A column after the source alias of a MERGE before its WHEN clauses, at the end of the input
  - name: fix_merge_on_dot_column_at_eof
    catalog:
      script:
        input: |-
          create table t (a int, b int, name text); create table u (a int, c int);
    editor:
      input: |-
        merge into t x using u y on x.a = y.c
    cursor:
      search:
        text: 'y.c'
        index: 3
    completions:
      limit: 5

  # A column in the ON condition of a MERGE before its WHEN clauses, at the end of the input
  - name: fix_merge_on_column_at_eof
    catalog:
      script:
        input: |-
          create table t (a int, b int, name text); create table u (a int, c int);
    editor:
      input: |-
        merge into t x using u y on x.a = c
    cursor:
      search:
        text: '= c'
        index: 3
    completions:
      limit: 5

  # The continuations of NOT after an expression, NULL and the NOT_LA forms
  - name: fix_not_after_expression
    catalog:
      script:
        input: |-
          create table t (a int, b int, name text); create table u (a int, c int);
    editor:
      input: "select * from t where a not "
    cursor:
      search:
        text: 'not '
        index: 4
    completions:
      limit: 10

  # NOT typed partially after an expression
  - name: fix_not_typed_after_expression
    catalog:
      script:
        input: |-
          create table t (a int, b int, name text); create table u (a int, c int);
    editor:
      input: |-
        select * from t where a no
    cursor:
      search:
        text: 'a no'
        index: 4
    completions:
      limit: 5

  # A NOT_LA form typed after NOT
  - name: fix_not_between_typed
    catalog:
      script:
        input: |-
          create table t (a int, b int, name text); create table u (a int, c int);
    editor:
      input: |-
        select * from t where a not bet
    cursor:
      search:
        text: 'bet'
        index: 3
    completions:
      limit: 5

  # A column of a view of the catalog
  - name: fix_catalog_view_column
    catalog:
      script:
        input: |-
          create table t (a int, b int, name text); create view myv as select a as mycol from t;
    editor:
      input: |-
        select myc from myv
    cursor:
      search:
        text: 'myc'
        index: 3
    completions:
      limit: 5

  # A column of a view of the script
  - name: fix_script_view_column
    catalog:
      script:
        input: |-
          create table t (a int, b int, name text);
    editor:
      input: |-
        create view myv as select a as mycol from t; select myc from myv
    cursor:
      search:
        text: 'select myc'
        index: 10
    completions:
      limit: 5