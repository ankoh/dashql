completion-snapshots:
  # A column in ORDER BY
  - name: clause_order_by_column
    catalog:
      script:
        input: |-
          create table t (a int, b int, name text); create table u (a int, c int);
    editor:
      input: |-
        select a from t order by na
    cursor:
      search:
        text: 'by na'
        index: 5
    completions:
      limit: 5

