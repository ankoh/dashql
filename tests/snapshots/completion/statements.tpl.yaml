completion-snapshots:
  # UNION after the FROM item of the first branch, it outranks the alias
  - name: stmt_union_keyword
    catalog:
      script:
        input: |-
          create table t (a int, b int, name text); create table u (a int, c int);
    editor:
      input: |-
        select a from t uni
    cursor:
      search:
        text: 'uni'
        index: 3
    completions:
      limit: 5

  # After UNION the hints are SELECT and the set quantifiers
  - name: stmt_union_passive
    catalog:
      script:
        input: |-
          create table t (a int, b int, name text); create table u (a int, c int);
    editor:
      input: 'select a from t union '
    cursor:
      search:
        text: 'union '
        index: 6
    completions:
      limit: 5

  # The second branch of a UNION sees only its own FROM items, the columns of the first are no columns in scope
  - name: stmt_union_branch_scope
    catalog:
      script:
        input: |-
          create table t (a int, b int, name text); create table u (a int, c int);
    editor:
      input: |-
        select a from t union all select na from u
    cursor:
      search:
        text: 'select na'
        index: 9
    completions:
      limit: 5

  # ELSE in a CASE after a THEN result, END follows
