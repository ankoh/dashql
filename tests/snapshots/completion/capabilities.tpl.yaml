completion-snapshots:
  # Only the tags of the offered capabilities are completed, `@` lists board and flow but no vis, param or manual
  - name: capabilities_tag_names
    capabilities: [board, flow]
    catalog: {}
    editor:
      input: |
        /* @ */
        select 1
    cursor:
      search:
        text: '@'
        index: 1
    completions:
      limit: 10
  # The content of a disabled tag is not completed
  - name: capabilities_disabled_vis_kind
    capabilities: []
    catalog: {}
    editor:
      input: |
        /* @vis  */
        select 1
    cursor:
      search:
        text: '@vis '
        index: 5
    completions:
      limit: 3
  # The `@vis board` of older scripts belongs to the board capability, like the analyzer reads it: without it, the
  # args are not completed even though `@vis` is offered
  - name: capabilities_legacy_board_without_board
    capabilities: [vis]
    catalog: {}
    editor:
      input: |
        /* @vis board ro */
        select 1
    cursor:
      search:
        text: '@vis board ro'
        index: 13
    completions:
      limit: 5
  # With the board capability, the args of `@vis board` are completed even though `@vis` is not offered
  - name: capabilities_legacy_board_without_vis
    capabilities: [board]
    catalog: {}
    editor:
      input: |
        /* @vis board ro */
        select 1
    cursor:
      search:
        text: '@vis board ro'
        index: 13
    completions:
      limit: 5
