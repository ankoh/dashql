completion-snapshots:
  # A column in RETURNING of INSERT
  - name: clause_returning_insert
    catalog:
      script:
        input: |-
          create table t (a int, b int, name text); create table u (a int, c int);
    editor:
      input: |-
        insert into t values (1) returning na
    cursor:
      search:
        text: 'returning na'
        index: 12
    completions:
      limit: 5

