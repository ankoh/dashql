completion-snapshots:
  # A namespace in upper case completes its functions
  - name: call_namespace_upper_case
    catalog:
      client_functions: tickets
    editor:
      input: |-
        CALL TICKETS.
    cursor:
      search:
        text: 'TICKETS.'
        index: 8
    completions:
      limit: 3

  # A quoted namespace completes its functions
  - name: call_namespace_quoted
    catalog:
      client_functions: tickets
    editor:
      input: |-
        call "tickets".
    cursor:
      search:
        text: '".'
        index: 2
    completions:
      limit: 3

  # The namespaces right after CALL
  - name: call_namespace_passive
    catalog:
      client_functions: tickets
    editor:
      input: 'call '
    cursor:
      search:
        text: 'call '
        index: 5
    completions:
      limit: 3

  # A function that the spec doesn't have takes no options
  - name: call_unknown_function
    catalog:
      client_functions: tickets
    editor:
      input: |-
        call tickets.nofn (
    cursor:
      search:
        text: '('
        index: 1
    completions:
      limit: 3

  # The cursor in the middle of a function name, the text before it filters
  - name: call_function_name_mid
    catalog:
      client_functions: tickets
    editor:
      input: |-
        call tickets.ticket_list (project => 'a')
    cursor:
      search:
        text: 'ticket_'
        index: 7
    completions:
      limit: 3

  # The cursor in the middle of an option name, the text before it filters
  - name: call_option_name_mid
    catalog:
      client_functions: tickets
    editor:
      input: |-
        call tickets.ticket_list (page_size => 1)
    cursor:
      search:
        text: 'page_'
        index: 5
    completions:
      limit: 3

  # The cursor in the string value of an option completes nothing
  - name: call_option_value_string
    catalog:
      client_functions: tickets
    editor:
      input: |-
        call tickets.ticket_list (project => 'ab')
    cursor:
      search:
        text: '''a'
        index: 2
    completions:
      limit: 3

  # The arguments of a function in an option value complete nothing
  - name: call_option_value_function_args
    catalog:
      client_functions: tickets
    editor:
      input: |-
        call tickets.ticket_list (project => lower(
    cursor:
      search:
        text: 'lower('
        index: 6
    completions:
      limit: 3

  # After the closing parenthesis of a call nothing is completed
  - name: call_after_closing_paren
    catalog:
      client_functions: tickets
    editor:
      input: 'call tickets.ticket_list (project => ''a'') '
    cursor:
      search:
        text: ') '
        index: 2
    completions:
      limit: 3

  # A call in the second statement completes its functions
  - name: call_second_statement
    catalog:
      client_functions: tickets
    editor:
      input: |-
        select 1; call tickets.
    cursor:
      search:
        text: 'tickets.'
        index: 8
    completions:
      limit: 3
