  # A database and a schema before a dot, the typed text filters the tables
  - name: depth_table_ref_database_schema_prefix
    catalog:
      script:
        input: |-
          create table sch.t (a int, b int, name text); create table db.sch.v (x int, y int, xy int); create table db.sch.w (z int);
    editor:
      input: |-
        select * from db.sch.v
    cursor:
      search:
        text: 'sch.v'
        index: 5
    completions:
      limit: 5

