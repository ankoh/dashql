      script:
        input: |-
          create table t (name int, id int);
          create table u (na int, nb int);
        errors: []
    editor:
      input: select * from t, (select na from u) s
      catalog-id: 2
      errors: []
      table-refs:
        - {type: name/catalog, catalog-id: "256.65536.1:1", text: "u"}
        - {type: name/catalog, catalog-id: "256.65536.1:0", text: "t"}
      expressions:
