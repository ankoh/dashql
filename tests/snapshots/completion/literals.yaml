      constants:
        - {expression: 0, text: "10"}
    cursor:
      search:
        text: limit 10
        index: 8
    completions:
      limit: 3
      strategy: DEFAULT
      symbol: LITERAL_INTEGER
      relative: END_OF_SYMBOL
      entries: []
      text: "10"
