completion-snapshots:
  # Passive hint after "select * " → should suggest FROM
  - name: select_star
    catalog: {}
    editor:
      input: "select * "
    cursor:
      search:
        text: "* "
        index: 2
    completions:
      limit: 3

  # Passive hint after "select foo " → should suggest FROM
  - name: select_foo
    catalog: {}
    editor:
      input: "select foo "
    cursor:
      search:
        text: "foo "
        index: 4
    completions:
      limit: 3

  # Suppressed after "from " → user types table name
  - name: suppress_after_from
    catalog: {}
    editor:
      input: "select * from "
    cursor:
      search:
        text: "from "
        index: 5
    completions:
      limit: 3

  # Suppressed after "join " → user types table name
  - name: suppress_after_join
    catalog: {}
    editor:
      input: "select * from foo join "
    cursor:
      search:
        text: "join "
        index: 5
    completions:
      limit: 3

  # Suppressed after "where " → user types expression
  - name: suppress_after_where
    catalog: {}
    editor:
      input: "select * from foo where "
    cursor:
      search:
        text: "where "
        index: 6
    completions:
      limit: 3

  # Suppressed after "on " → user types join condition
  - name: suppress_after_on
    catalog: {}
    editor:
      input: "select * from foo join bar on "
    cursor:
      search:
        text: "on "
        index: 3
    completions:
      limit: 3

  # Suppressed after "and " → user types expression
  - name: suppress_after_and
    catalog: {}
    editor:
      input: "select * from foo where x = 1 and "
    cursor:
      search:
        text: "and "
        index: 4
    completions:
      limit: 3

  # Suppressed after "or " → user types expression
  - name: suppress_after_or
    catalog: {}
    editor:
      input: "select * from foo where x = 1 or "
    cursor:
      search:
        text: "or "
        index: 3
    completions:
      limit: 3

  # Passive hint after "from foo " → should suggest WHERE
  - name: after_from_table
    catalog: {}
    editor:
      input: "select * from foo "
    cursor:
      search:
        text: "foo "
        index: 4
    completions:
      limit: 3

  # Passive hint after "group " → should suggest BY
  - name: after_group
    catalog: {}
    editor:
      input: "select * from foo group "
    cursor:
      search:
        text: "group "
        index: 6
    completions:
      limit: 3

  # Passive hint after "order " → should suggest BY
  - name: after_order
    catalog: {}
    editor:
      input: "select * from foo order "
    cursor:
      search:
        text: "order "
        index: 6
    completions:
      limit: 3

  # After a comparison only keywords that begin an expression, no unreserved keyword that would be a column name like BY or SET
  - name: passive_after_equals
    catalog:
      script:
        input: |-
          create table t (a int, b int, name text); create table u (a int, c int);
    editor:
      input: 'select * from t where a = '
    cursor:
      search:
        text: '= '
        index: 2
    completions:
      limit: 5

  # After an arithmetic operator only keywords that begin an expression
  - name: passive_after_plus
    catalog:
      script:
        input: |-
          create table t (a int, b int, name text); create table u (a int, c int);
    editor:
      input: 'select a + '
    cursor:
      search:
        text: '+ '
        index: 2
    completions:
      limit: 5

  # SET after the table of an UPDATE stays a hint, although it could also be an alias
  - name: passive_after_update_table
    catalog:
      script:
        input: |-
          create table t (a int, b int, name text); create table u (a int, c int);
    editor:
      input: 'update t '
    cursor:
      search:
        text: 't '
        index: 2
    completions:
      limit: 5

  # After an ORDER BY column the directions and NULLS
  - name: passive_after_order_by_column
    catalog:
      script:
        input: |-
          create table t (a int, b int, name text); create table u (a int, c int);
    editor:
      input: 'select a from t order by a '
    cursor:
      search:
        text: 'by a '
        index: 5
    completions:
      limit: 5
