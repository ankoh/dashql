packages:
  - 'packages/*'
onlyBuiltDependencies:
  - '@parcel/watcher'
  - electron
  - electron-winstaller
minimumReleaseAgeExclude:
  - hyperdb-wasm@0.0.27499-dev.wasm.g2c696bfb || 0.0.27500-dev.wasm.g04a478aa
allowBuilds:
  '@parcel/watcher': true
  electron: true
  electron-winstaller: true
  protobufjs: false
packageExtensions:
  # astro2tsx pins @emnapi/core 1.x but takes @emnapi/runtime as a peer of @napi-rs/wasm-runtime. Without its own
  # runtime the peer resolves to the 2.0 beta of the wasm binding of rolldown, and the mix fails at load.
  '@astrojs/astro2tsx':
    dependencies:
      '@emnapi/runtime': 1.11.3
