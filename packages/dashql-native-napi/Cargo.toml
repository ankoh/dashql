[package]
name = "dashql-native-napi"
version = "0.0.2-dev.17"
description = "Node-API bindings for DashQL native proxies"
edition = "2021"
rust-version = "1.70"

[lib]
crate-type = ["cdylib"]

[dependencies]
http = "1.4.2"
napi = { version = "3.12.2", features = ["async", "napi8", "tokio_rt"] }
napi-derive = "3.6.3"
