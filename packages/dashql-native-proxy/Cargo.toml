[package]
name = "dashql-native-proxy"
version = "0.0.2-dev.17"
description = "Host-neutral HTTP, gRPC, and Docker proxies for DashQL desktop"
edition = "2021"
rust-version = "1.70"

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
byteorder = "1.5.0"
bytes = "1"
http = "1"
http-body-util = "0.1.5"
hyper = "1"
hyper-util = "0.1.20"
lazy_static = "1.5.0"
log = "0.4.34"
mime = "0.3.17"
once_cell = "1"
regex-automata = "0.4"
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "http2", "json", "native-tls", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14.6", features = ["tls-native-roots", "tls-ring"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
