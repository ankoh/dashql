<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'unsafe-inline' 'wasm-unsafe-eval' 'self'; script-src 'unsafe-inline' 'wasm-unsafe-eval' 'self' https://static.cloudflareinsights.com; style-src 'unsafe-inline' 'self'; connect-src app: data: dashql-native: ws: wss: http: https:; worker-src blob: 'self'" />

        <link rel="apple-touch-icon" href="/static/favicons/dashql/apple-touch-icon.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/static/favicons/dashql/apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/static/favicons/dashql/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/static/favicons/dashql/favicon-16x16.png" />
        <link rel="manifest" href="/static/favicons/dashql/site.webmanifest" />
        <link rel="mask-icon" href="/static/favicons/dashql/safari-pinned-tab.svg" />
        <link rel="shortcut icon" href="/static/favicons/dashql/favicon.ico" />
        <meta name="apple-mobile-web-app-title" content="DashQL" />
        <meta name="msapplication-config" content="/static/favicons/dashql/browserconfig.xml" />
        <meta property="og:image" content="/static/favicons/dashql/sharing-dashql.png" />

        <title>DashQL</title>

        <script>
            // Drop the static DashQL branding before the first paint when the url requests another flavor.
            // The module script brands the page with the flavor, but would only replace the DashQL favicons and title once it loaded.
            (function () {
                var flavor = new URLSearchParams(window.location.search).get('flavor');
                if (flavor == null || flavor === 'dashql') {
                    return;
                }
                document.documentElement.dataset.flavor = flavor;
                document.title = '';
                document.querySelectorAll('link[rel~="icon"], link[rel="apple-touch-icon"], link[rel="mask-icon"]').forEach(function (link) {
                    link.remove();
                });
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/app/app.tsx"></script>
    </body>
</html>
