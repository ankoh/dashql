# The Slack app of the stable channel. Paste into api.slack.com/apps → the app → App Manifest, after the Worker
# dashql-slack-stable is deployed with its secrets: Slack checks the request URL when the manifest is saved.
display_information:
  name: DashQL Stable
  description: Data files, workbooks and Hyper scripts of stable.dashql.app as Work Objects
features:
  bot_user:
    display_name: DashQL Stable
    always_online: false
  unfurl_domains:
    - stable.dashql.app
  rich_previews:
    is_active: true
    entity_types:
      - slack#/entities/file
      - slack#/entities/content_item
      - slack#/entities/item
    domain_allowlist:
      - stable.dashql.app
    allow_same_origin: true
oauth_config:
  scopes:
    bot:
      - links:read
      - links:write
settings:
  event_subscriptions:
    request_url: https://slack.dashql.app/stable/events
    bot_events:
      - link_shared
      - entity_details_requested
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
