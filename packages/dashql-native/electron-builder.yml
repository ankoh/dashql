appId: app.dashql
productName: DashQL
electronVersion: 38.8.6
asar: true
asarUnpack:
  - resources/dashql_native_napi.node
files:
  - dist/**
  - NOTICE
  - preload.cjs
  - package.json
extraResources:
  - from: renderer
    to: renderer
  - from: dashql_native_napi.node
    to: dashql_native_napi.node
  # The dashql command that the agents call, docs/design/agent_integration.md
  - from: bin/dashql
    to: bin/dashql
# The app runs no Node of its own outside the utility process: ELECTRON_RUN_AS_NODE does not turn the signed app into
# a Node for whoever starts it
electronFuses:
  runAsNode: false
mac:
  artifactName: DashQL-${version}-${arch}.${ext}
  category: public.app-category.developer-tools
  entitlements: Entitlements.plist
  entitlementsInherit: Entitlements.plist
  extendInfo:
    CFBundleURLTypes:
      - CFBundleURLName: app.dashql
        CFBundleURLSchemes:
          - dashql
  hardenedRuntime: true
  icon: icon.icns
  target:
    - dmg
    - zip
dmg:
  sign: false
publish:
  provider: generic
  url: https://get.dashql.app/channels/stable/macos/${arch}
