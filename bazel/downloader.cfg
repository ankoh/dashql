# Bazel downloader config (--downloader_config in .bazelrc).
# ftp.gnu.org times out regularly on CI runners, and gawk (via aspect_bazel_lib) is fetched from there
# by its BCR source. Try the kernel.org mirror first and fall back to ftp.gnu.org. The archives are
# pinned by integrity, so a mirror cannot change them.
rewrite ftp.gnu.org/gnu/(.*) mirrors.kernel.org/gnu/$1
rewrite ftp.gnu.org/gnu/(.*) ftp.gnu.org/gnu/$1
