title: Private Network Routes
description: |
  A private network route (PNR) connects a Data 360 tenant to a data source without sending traffic over the public internet. The feature is [Private Connect for Data 360](https://developer.salesforce.com/docs/data/data-cloud-int/guide/c360-a-private-connect-considerations.md), a different product from Salesforce Private Connect. A route is network plumbing only: connections and data streams use it, and it carries no data itself.

  The order is: prepare the endpoint on the cloud side, create the route, finish the cloud-side approval, wait for `Ready`, then create the connection that uses the route.

  The gotchas that matter most:

  - MSK, Redshift and self-managed Azure routes need Salesforce's Principal ID allowed on your endpoint service. The guides read it from the Setup page, and the spec's output schemas have no attribute for it.
  - The [guides](https://developer.salesforce.com/docs/data/data-cloud-int/guide/c360-a-private-connect-integrations.md) cover BigQuery and Salesforce-managed Azure routes, but the spec's enums and inputs don't show how to create them.
  - A URL can have only one route per functional domain, so a repeated create can return 409.
  - The API has no update call.
  - Salesforce's `sf-pi` calls this family [feature gated](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/endpoint-families.md), and says it can return internal errors when the org has no routes.

  ```sql
  CALL cdp.private_network_route_create (
    name => 'Snowflake_Prod',
    label => 'Snowflake Prod',
    description => 'PrivateLink route to the prod Snowflake account',
    route => (type = 'Snowflake', service_name = 'com.amazonaws.vpce.us-west-2.vpce-svc-0123456789abcdef0', account_url = 'https://my-account.snowflakecomputing.com')
  );
  CALL cdp.private_network_route_get (route_id_or_name => 'Snowflake_Prod'); /* repeat until cloud_provider.status is Ready, then update the Snowflake network policy */
  CALL cdp.connection_create (
    connector_type => 'SNOWFLAKE',
    label => 'Snowflake prod',
    name => 'snowflake_prod',
    method => 'Ingress',
    credentials => [
      (param_name = 'authenticationOption', value = 'KeyPair'),
      (param_name = 'user', value = :snowflake_user),
      (param_name = 'privateKey', value = :snowflake_private_key)
    ],
    parameters => [
      (param_name = 'region', value = 'us-west-2'),
      (param_name = 'warehouse', value = 'LOAD_WH'),
      (param_name = 'hasPrivateNetworkRoute', value = 'true'),
      (param_name = 'outboundnetworkconnection', value = '...') /* id from the route */
    ]
  );
  ```

functions:
  - name: private_network_route_delete
    method: DELETE
    host: connect
    path: /ssot/private-network-routes/{routeIdOrName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Private-Network-Routes/paths/~1ssot~1private-network-routes~1%7BrouteIdOrName%7D/delete
    description: Delete a Private Network Route. Since v65.0.
    example: CALL cdp.private_network_route_delete (route_id_or_name => 'Redshift_Prod');
    options:
      - {name: route_id_or_name, api_name: routeIdOrName, in: path, type: string, required: true, description: "ID or name of the Private Network Route. Since v65.0."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 200). One row with only the standard columns.
    notes: |
      **Notes:** - The [guide](https://developer.salesforce.com/docs/data/data-cloud-int/guide/c360-a-delete-private-connect-network-route.md) says to delete only a route no data stream uses, and to move any such stream to a different route first. No source says what the API returns for a route in use.
      - The spec's 409 text for this call is the duplicate-URL message from create, which looks copied.
      - The guide says deleting the route also deletes the endpoint connections entry from your VPC endpoint service.
      - The status enum includes `TeardownInProgress`, but no source says whether teardown ends before this call returns.

  - name: private_network_route_list
    method: GET
    host: connect
    path: /ssot/private-network-routes
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Private-Network-Routes/paths/~1ssot~1private-network-routes/get
    description: Get a paginated list of Private Network Routes. Since v65.0.
    example: CALL cdp.private_network_route_list ();
    options:
      - {name: limit, in: query, type: integer, description: "Maximum number of rows to return from `1` through `1000`. By default, the endpoint returns `100` rows. Since v65.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. By default, the endpoint skips `0` rows. Since v65.0."}
    rows: /routes
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: cloud_provider, api_name: cloudProvider, type: JSON, schema: CloudProviderDetailsRepresentation, description: "Details about the cloud provider for the Private Network Route. Since v65.0."}
      - {name: route, type: JSON, description: "Provider details for the Private Network Route. The endpoint returns the details output object that corresponds to the type of Private Network Route. For example, the Amazon MSK Route Details Output is returned for the `AmazonMsk` type. Since v65.0."}
      - {name: storage_route, api_name: storageRoute, type: JSON, schema: RouteDetailsRepresentation, description: "Storage details for a route, for example, the URL and service name, for a storage/internal stage in the case of customer-managed and Salesforce-managed solutions. Since v66.0."}
    paging: {kind: url, from: /nextPageUrl}
    effect: read
    evidence: O
    result_description: "One row per item of `/routes` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`. Schema `PrivateNetworkRouteRepresentation`."
    notes: |
      **Paging:** `next_page_url`.

      **Notes:** [`sf-pi`](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/endpoint-families.md) says the list and detail calls are feature gated and can return internal errors when the org has no routes, so an error here doesn't prove a problem with the request.

