title: Segments
description: |
  A segment is a named audience built on a data model object (DMO), such as every individual with an order over 5000. Activations then send it to external systems. It depends on the DMO, its relationships, and any calculated insights it filters on, which [must be `ACTIVE`](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/SegmentTools.java) first.

  The usual order is create, wait for `segment_status`, publish, then read members. Publishing is what [calculates membership](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/runtime/FamilyCatalog.java).

  What matters most:

  - **Name or id.** Update, delete, count and members take `api_name`. `segment_publish` takes `market_segment_id` (`1sg...`). Get and deactivate take either, so each has a `_by_id` form.
  - **Double nesting.** SQL goes in `include_dbt => (models = (models = [...]))`, not the flat array the spec's schema shows. See [`segment_create`](#segment_create).
  - **Segment SQL is its own dialect.** Aliases, `EXISTS` and most other shapes are rejected. Read [Segment SQL](api_notes.md#segment-sql) before writing any.
  - **Spelling depends on direction.** You send `Dbt` and `NoRefresh`, and read back `DBT` and `NO_REFRESH`.
  - **Publishing is asynchronous.** Sources disagree on the finished `publish_status`. See [`segment_publish`](#segment_publish).

  ```sql
  CALL cdp.segment_create (
    developer_name => 'Robots', display_name => 'Robots', description => 'Individuals named Robot',
    segment_on_api_name => 'Individuals__dlm', segment_type => 'Dbt', publish_schedule => 'NoRefresh',
    include_dbt => (models = (models = [(name = 'robots', sql = (
      SELECT Individuals__dlm.IndividualId__c, Individuals__dlm.KQ_IndividualId__c
      FROM Individuals__dlm
      WHERE Individuals__dlm.FirstName__c = 'Robot'
        AND trim(cast(Individuals__dlm.IndividualId__c as varchar(255))) <> ''
    ))])));
  /* Wait for segment_status = 'ACTIVE' and copy market_segment_id */
  CALL cdp.segment_get (segment_api_name => 'Robots');
  CALL cdp.segment_publish (segment_id => '1sgxx00000000PpAAI');
  /* After publishing finishes */
  CALL cdp.segment_member_list (segment_api_name => 'Robots', limit => 100);
  ```

functions:
  - name: segment_delete
    method: DELETE
    host: connect
    path: /ssot/segments/{segmentApiName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Segments/paths/~1ssot~1segments~1%7BsegmentApiName%7D/delete
    tools: [d360_segment_delete]
    description: Delete a segment in Data 360. Since v56.0.
    example: CALL cdp.segment_delete (segment_api_name => 'High_Value_Order_Buyers');
    options:
      - {name: segment_api_name, api_name: segmentApiName, in: path, type: string, required: true, description: "The segment's `api_name`, not its `1sg` id."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 204). One row with only the standard columns.
    notes: "**Notes:** Takes `api_name`, not the id. [Irreversible](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/SegmentTools.java). It [returns 204 even while the segment is `PROCESSING`](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/data-shapes.md). The [MCP tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/SegmentTools.java) also sends a `dataspace` query parameter, which the spec doesn't list for this call."

  - name: segment_list
    method: GET
    host: core
    path: /ssot/segments
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Segments/paths/~1ssot~1segments/get
    tools: [d360_segment_list]
    description: Get the segments of a data space, one row each. Use it to find API names and check status. Since v55.0.
    example: CALL cdp.segment_list (dataspace => 'default', batch_size => 100, offset => 0, filters => 'SegmentStatus eq Active AND MarketSegmentType eq Dbt', order_by => 'Name ASC');
    options:
      - {name: batch_size, api_name: batchSize, in: query, type: integer, description: "Number of segments to return at one time. Values are from `1` through `200`. If unspecified, the default value is `20`. Since v56.0."}
      - {name: dataspace, in: query, type: string, description: "Name of the data space in which to perform the action. User must have permission to this data space. Valid when bulk-listing segments. If unspecified, the `default` data space is used. Since v58.0."}
      - {name: filters, in: query, type: string, description: "Filter the result set to a more narrow scope based on segment attributes. Specify a maximum of 10 filters. Separate each filter by an AND logical operator. If unspecified, no filters are applied. These values are supported: - `LastPublishedEndDateTime` - Not present in the output type. Indicates the end date and time when the segment was last published. Use only the `!=` operator with this value. - `MarketSegmentType` - Matches field `segment_type`. - `Name` - Matches field `display_name`. - `SegmentOn` - Matches field `segment_on_api_name`. - `SegmentStatus` - Matches field `segment_status`. These operators are supported: - `contains` - Search operator for identifying strings or substrings within a field. - `eq` - Equality operator for identifying values that match exactly. - `in` - Comparison operator for determining whether a field matches one or more specified values. - `!=` - Inequality operator for determining values that don't match. These are examples of filter parameter specifications: - `filters=Name != NULL AND Name In Seg 01,seg 02 AND Name contains seg AND Name eq seg 01` - `filters=SegmentStatus != NULL AND SegmentStatus In Processing,Active AND SegmentStatus contains ive AND SegmentStatus eq active` - `filters=MarketSegmentType != NULL AND MarketSegmentType In UI,Dbt AND MarketSegmentType contains i AND MarketSegmentType eq UI` - `filters=SegmentOn != NULL AND SegmentOn In individual,account AND SegmentOn contains ual AND SegmentOn eq Account` - `filters=SegmentOn != NULL AND SegmentOn In individual,account AND SegmentOn contains nt AND SegmentOn eq Account` - `filters=LastPublishedEndDateTime != NULL` Since v65.0."}
      - {name: offset, in: query, type: integer, description: "Number of segments to skip before returning results. If unspecified, no segments are skipped. Since v56.0."}
      - {name: order_by, api_name: orderby, in: query, type: string, description: "Sort order for the result set. Specify a field value followed by an optional sort order, `ASC` or `DESC`. For example, `Name ASC` sorts results by `Name` in ascending order, and `MarketSegmentType DESC` sorts results by `MarketSegmentType` in descending order. If unspecified, items are returned by ID in ascending order. Since v56.0."}
      - {name: segment_creation_flow, api_name: segmentCreationFlow, in: query, type: string, description: "-"}
    rows: /segments
    columns:
      - {name: api_name, api_name: apiName, type: VARCHAR, description: "API name of the segment. Since v56.0."}
      - {name: dataspace, api_name: dataSpace, type: VARCHAR, description: "Segment data space. In API version 59.0 and later, this property is not available. Use the `dataspace` request parameter instead. Since v57.0."}
      - {name: description, type: VARCHAR, description: "Segment description. Since v55.0."}
      - {name: developer_name, api_name: developerName, type: VARCHAR, description: "Segment developer name. Since v55.0."}
      - {name: display_name, api_name: displayName, type: VARCHAR, description: "Segment display name. Since v57.0."}
      - {name: exclude_criteria, api_name: excludeCriteria, type: VARCHAR, description: "Segment exclude criteria. Since v57.0."}
      - {name: include_criteria, api_name: includeCriteria, type: VARCHAR, description: "Segment include criteria. Since v57.0."}
      - {name: include_dbt, api_name: includeDbt, type: JSON, schema: CdpSegmentDbtPipelineOutputRepresentation, description: "Segment DBT pipeline. Since v55.0."}
      - {name: last_published_end_date_time, api_name: lastPublishedEndDateTime, type: VARCHAR, description: "Segment last published end-date time. Since v63.0."}
      - {name: last_segment_member_count, api_name: lastSegmentMemberCount, type: BIGINT, description: "Last segment member count. Since v63.0."}
      - {name: lookalike_criteria, api_name: lookalikeCriteria, type: JSON, schema: CdpSegmentLookalikeOutputRepresentation, description: "Lookalike criteria for the segment. Since v56.0."}
      - {name: lookback_period, api_name: lookbackPeriod, type: VARCHAR, description: "Lookback period of the segment. Since v62.0."}
      - {name: market_segment_definition_id, api_name: marketSegmentDefinitionId, type: VARCHAR, description: "ID of the market segment definition. Since v55.0."}
      - {name: market_segment_id, api_name: marketSegmentId, type: VARCHAR, description: "ID of the market segment. Since v56.0."}
      - {name: next_publish_date_time, api_name: nextPublishDateTime, type: VARCHAR, description: "Date and time of the next segment publish. Since v57.0."}
      - {name: parameters, type: JSON, array: 1, schema: ParameterRepresentation, description: "Metadata for dynamic segment parameters. Since v63.0."}
      - {name: publish_interval, api_name: publishInterval, type: VARCHAR, description: "Segment publish interval. Since v55.0."}
      - {name: publish_schedule_end_date, api_name: publishScheduleEndDate, type: VARCHAR, description: "Publish schedule end date. Since v55.0."}
      - {name: publish_schedule_end_date_time, api_name: publishScheduleEndDateTime, type: VARCHAR, description: "Publish schedule end-date time. Since v62.0."}
      - {name: publish_schedule_info, api_name: publishScheduleInfo, type: JSON, description: "Additional information about the publish schedule. The endpoint returns the schedule output object that corresponds to the publish frequency: `Daily`, `Hourly`, `Minutely`, `Monthly`, `Monthly Relative`, `Weekly`, or `None`. For example, the Daily Schedule Output is returned for the `Daily` publish frequency. Since v63.0."}
      - {name: publish_schedule_start_date_time, api_name: publishScheduleStartDateTime, type: VARCHAR, description: "Publish schedule start date time. Since v55.0."}
      - {name: publish_status, api_name: publishStatus, type: VARCHAR, description: "Segment publish status. Since v55.0."}
      - {name: segment_membership_dmo, api_name: segmentMembershipDmo, type: JSON, schema: CdpSegmentMembershipTableOutputRepresentation, description: "Segment membership tables. Since v58.0."}
      - {name: segment_membership_table, api_name: segmentMembershipTable, type: VARCHAR, description: "Name of the segment membership table. Since v56.0."}
      - {name: segment_on_api_name, api_name: segmentOnApiName, type: VARCHAR, description: "API name of the SegmentOn entity. Since v56.0."}
      - {name: segment_on_data_graph, api_name: segmentOnDataGraph, type: VARCHAR, description: "Data graph ID of the SegmentOn entity. Since v58.0."}
      - {name: segment_on_id, api_name: segmentOnId, type: VARCHAR, description: "ID of the DMO segment. Since v55.0."}
      - {name: segment_status, api_name: segmentStatus, type: VARCHAR, description: "Segment status. Since v55.0."}
      - {name: segment_type, api_name: segmentType, type: VARCHAR, description: "Type of segment. Since v56.0."}
    paging: {kind: offset, option: offset, size: batch_size, start: 0}
    effect: read
    evidence: O
    result_description: "One row per item of `/segments` in the response. Other response fields go to `_meta`: `batchSize`, `offset`, `orderByExpression`. Schema `CdpSegmentOutputRepresentation`."
    notes: |
      **Paging:** `batch_size`, `offset` from 0 ([community](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md)).

      **Token:** Core Salesforce token, not the Data 360 token. The spec says so for this call and `segment_create` only. See [Hosts and tokens](api_notes.md#hosts-and-tokens) for the wider source conflict.

      **Notes:** **Ids:** rows have `api_name` for name-keyed calls. The [Retail kit](https://github.com/salesforce-misc/Data360AgentforceSolutionKitRetail/blob/main/.claude/skills/refresh-data-cloud-components/SKILL.md) warns that a row's `id` is null and that only the single GET has `market_segment_id` (one org), yet the spec's list example and the [hosted docs](https://developer.salesforce.com/docs/platform/hosted-mcp-servers/references/reference/data360-mcp.md) show `market_segment_id` on list rows.

      **Filter and sort names aren't column names.** They use names such as `Name` and `MarketSegmentType`. Filter values in the spec are mixed-case (`Processing,Active`), while the column returns `PROCESSING` and `ACTIVE`.

      **Spelling:** the spec's option is `orderby`, and the [MCP tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/SegmentTools.java) sends `orderBy`.

      **Result:** the spec's list example, the [hosted docs](https://developer.salesforce.com/docs/platform/hosted-mcp-servers/references/reference/data360-mcp.md) and a [community note](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md) all show a `total_size` field that the spec's schema lacks. The schema says `dataspace` is gone from v59, yet the hosted docs' sample still returns it. `segment_status` values seen in the spec's examples are `ACTIVE`, `PROCESSING` and `COUNTING`. A [community note](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md) says page sizes aren't always honored across this API, so detect repeats.

