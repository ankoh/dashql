    options:
      - {name: segment_api_name, api_name: segmentApiName, in: path, type: string, required: true, description: "The segment's `api_name`, not its `1sg` id."}
      - {name: fields, in: query, array: 1, type: string, description: "Comma-separated list of field names that you want to include in the result. If unspecified, `Id__c` is returned. Supported fields are: - `Delta_Type__c` - `Id__c` - `KQ_Id__c` - `Parent_Segment_Id__c` - `Segment_Id__c` - `Snapshot_Type__c` - `Timestamp__c` - `Version_Stamp__c` Since v58.0."}
      - {name: filters, in: query, type: string, description: "Filter the result set to a more narrow scope or specific type, for example, `Delta_Type__c IN ('New','Existing')`. When you filter for `Delta_Type__c`, we recommend that you also filter for `Timestamp__c`, for example, `Delta_Type__c IN ('New','Existing') AND Timestamp__c IN 2025-04-09T14:12:41.111Z`. Otherwise, the getSegmentMembers record is returned for the latest publish date; if the segment is not published, an empty result is returned. Since v58.0."}
      - {name: limit, in: query, type: integer, description: "Maximum number of rows to return from `1` through `1000`. If unspecified, the default number of rows is `100`. Since v58.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. If unspecified, no rows are skipped. Since v58.0."}
      - {name: order_by, api_name: orderBy, in: query, type: string, description: "Sort order for the result set, such as `Segment_Id__c ASC` or `Timestamp__c DESC`. If unspecified, items are returned by ID in ascending order. Supported fields for sorting are: - `Delta_Type__c` - `Id__c` - `KQ_Id__c` - `Parent_Segment_Id__c` - `Segment_Id__c` - `Snapshot_Type__c` - `Timestamp__c` - `Version_Stamp__c` Since v58.0."}
    rows: /data
    columns:
      - {name: delta_type, api_name: deltaType, type: VARCHAR, description: "Delta type, for example, `new`, `existing`, or `removed`. Since v58.0."}
      - {name: id, type: VARCHAR, description: "Segment member ID. Since v58.0."}
      - {name: kq_id, api_name: kqId, type: VARCHAR, description: "Fully qualified key ID. Since v58.0."}
      - {name: snapshot_type, api_name: snapshotType, type: VARCHAR, description: "Type of snapshot. Valid value: `full`. Since v58.0."}
      - {name: timestamp, type: VARCHAR, description: "Timestamp. Since v58.0."}
