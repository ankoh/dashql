      - {name: definition_name, api_name: definitionName, type: string, description: "Name of the schedule definition. Since v63.0."}
      - {name: frequency, type: string, enum: [Daily, Hourly, "None"], required: true, description: "Frequency on which the schedule is run. `None` removes the schedule and is the default. Since v58.0."}
      - {name: should_force_specified_minutes, api_name: shouldForceSpecifiedMinutes, type: boolean, description: "Only applicable to data transforms. If `true`, the consumer's schedule is used. If `false`, the transform is distributed over an hour to avoid hourly hotspots. Set to `true` only when the schedule is critical. If unspecified, the default value is `false`. Since v64.0."}
      - {name: time, schema: CdpTimeInputRepresentation, required: true, description: "When to run the schedule. Since v58.0."}

  CdpSegmentDbtInputRepresentation:
    description: Represents the input for a DBT segment.
    attributes:
      - {name: models, schema: CdpSegmentDbtModelInputRepresentation, array: 1, description: "List of models. The spec types this as an array, but the API needs a wrapper: `models = (models = [...])`. See [`segment_create`](#segment_create)."}

  CdpSegmentDbtModelInputRepresentation:
    description: Represents the input for a single DBT model.
    attributes:
      - {name: name, type: string, description: "Name of the DBT model. Since v55.0."}
      - {name: sql, type: string, description: "SQL for the DBT model. Since v55.0."}
