title: Profiles, Insights and Metadata
description: |
  These calls read what exists in an org and fetch single records, without SQL. There are four groups: metadata (which objects and fields exist), profile reads, calculated insight reads and ID lookups. The docs [recommend these over custom SQL](https://developer.salesforce.com/docs/data/data-cloud-query-guide/guide/obj-specific-apis.md) where one fits. For joins, aggregates or engagement data, use a `SELECT` over the connection.

  **Order:** find a name with `metadata_search` or `metadata_entities`, describe it with `metadata`, then read records. Every read takes an API name such as `ssot__Individual__dlm`.

  **Connect or `direct_*`:** the `/ssot` calls are the Connect API, which Salesforce calls its [preferred platform](https://developer.salesforce.com/docs/data/connectapi/guide/get-started.md). The `direct_*` calls are the `/api/v1` routes on the tenant host, and always need the token exchange. Start with Connect. It also has `dataspace` on metadata. Use `direct_*` for what only its reference documents, such as `fields` and `filters` on `direct_datagraph_lookup`. The twins aren't drop-in: `batch_size` becomes `limit`, `searchKey` becomes `searchkey`, and `order_by` on profile reads changes syntax.

  The gotchas that matter most:

  - `metadata` returns only the DMOs in use, while [`dmo_list`](data_model_objects.md#dmo_list) returns the whole catalog (community, one org).
  - Pass `entity_name` to `metadata`, because unfiltered responses are large.
  - Profile reads take Profile category DMOs only, and filters are equality joined by AND.
  - Most record reads return one row, with the records in a `data` JSON column.

  ```sql
  /* Inventory, without fields */
  CALL cdp.metadata_entities (entity_type => 'DataModelObject', entity_category => 'Profile');
  /* Fields, keys and relationships of one object */
  CALL cdp.metadata (entity_name => 'ssot__Individual__dlm');
  /* Records */
  CALL cdp.profile_query (data_model_name => 'ssot__Individual__dlm', filters => '[ssot__FirstName__c=Jean]', fields => 'ssot__Id__c,ssot__LastName__c');
  ```

functions:
  - name: insights_query
    method: GET
    host: connect
    path: /ssot/insight/calculated-insights/{ciName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Insights/paths/~1ssot~1insight~1calculated-insights~1%7BciName%7D/get
    tools: [d360_insights_query]
    description: Query a Calculated Insight object in Data 360. Since v52.0.
    example: CALL cdp.insights_query (ci_name => 'Avg_Spends__cio', dimensions => 'Id__c,FirstName__c', measures => 'Avg_Spend__c', batch_size => 100);
    options:
      - {name: ci_name, api_name: ciName, in: path, type: string, required: true, description: "API name of the insight, such as `Avg_Spends__cio`."}
      - {name: batch_size, api_name: batchSize, in: query, type: integer, description: "Number of items to return. Values are from `1` through `4999`. If unspecified, the default value is `4999`. Since v52.0."}
      - {name: dimensions, in: query, type: string, description: "Comma-separated list of up to 10 dimensions, such as `GenderId__c`, to project. If unspecified, this parameter includes all of the available dimensions. Since v52.0."}
      - {name: filters, in: query, type: string, description: "Filter the result set to a more narrow scope or specific type, such as `[GenderId__c=Male,FirstName__c=Angel]`. Since v52.0."}
      - {name: measures, in: query, type: string, description: "Comma-separated list of up to five measures, such as `TotalSales__c,` to project. If unspecified, this parameter includes all of the available measures. Since v52.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. If unspecified, no rows are skipped. Since v52.0."}
      - {name: order_by, api_name: orderby, in: query, type: string, description: "Sort order for the result set, such as `GenderId__c ASC,Occupation__c DESC`. If unspecified, items are returned in the order they are retrieved. Since v52.0."}
      - {name: time_granularity, api_name: timeGranularity, in: query, type: string, description: "Time range for the measures. Values are `HOUR`, `DAY`, `MONTH`, `QUARTER`, or `YEAR`. If unspecified, no time range is applied. Since v54.0."}
    columns:
      - {name: data, type: JSON, description: "Result data set. Since v52.0."}
      - {name: done, type: BOOLEAN, description: "Specifies whether the query is done (`true`) or not (`false`). Since v52.0."}
      - {name: end_time, api_name: endTime, type: VARCHAR, description: "Query end time. Not returned for data graphs. Since v52.0."}
      - {name: metadata, type: JSON, description: "Result metadata set. Not returned for data graphs. Since v52.0."}
      - {name: query_id, api_name: queryId, type: VARCHAR, description: "Query ID. Not returned for data graphs. Since v52.0."}
      - {name: row_count, api_name: rowCount, type: BIGINT, description: "Number of rows in the result data set. Not returned for data graphs. Since v52.0."}
      - {name: start_time, api_name: startTime, type: VARCHAR, description: "Query start time. Not returned for data graphs. Since v52.0."}
    paging: {kind: offset, option: offset, size: batch_size, start: 0}
    effect: read
    evidence: O
    result_description: One row. Schema `CdpQueryOutputRepresentation`.
    notes: |
      **Paging:** `batch_size`, `offset`.

      **Notes:** Get the dimension and measure names from [`insights_metadata`](#insights_metadata). A query returns at most [4,999 rows](https://developer.salesforce.com/docs/data/data-cloud-query-guide/references/data-cloud-query-api-reference/c360a-api-ci-call-overview.md), so page with `offset` for more. The [tenant host page](https://developer.salesforce.com/docs/data/data-cloud-query-guide/references/data-cloud-query-api-reference/c360a-api-insights-ci-ci-name.md) says filter values are case-sensitive. The spec has no `dataspace` here, while [Salesforce's tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/CalculatedInsightTools.java) accepts one. One community run saw an [eventual-consistency race](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/docs/API_COVERAGE.md) on an insight read (community).

  - name: insights_metadata
    method: GET
    host: connect
    path: /ssot/insight/metadata
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Insights/paths/~1ssot~1insight~1metadata/get
    tools: [d360_insights_metadata]
    description: Get Insight metadata, including Calculated Insight objects, their dimensions, and their measures in Data 360. Since v52.0.
    example: CALL cdp.insights_metadata ();
    columns:
      - {name: metadata, type: JSON, description: "Result metadata set. Since v52.0."}
    effect: read
    evidence: O
    result_description: One row. Schema `CdpQueryMetadataOutputRepresentation`.
    notes: "**Notes:** This is how you discover insight names. The result is one row, with every insight in the `metadata` array. Each has `name`, `display_name`, `dimensions`, `measures`, `relationships` and `partition_by`, as shown on the [tenant host page](https://developer.salesforce.com/docs/data/data-cloud-query-guide/references/data-cloud-query-api-reference/c360a-api-v1-insight-metadata.md). The spec has no `dataspace` here."

  - name: insights_metadata_get
    method: GET
    host: connect
    path: /ssot/insight/metadata/{ciName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Insights/paths/~1ssot~1insight~1metadata~1%7BciName%7D/get
    description: Get metadata for a Calculated Insight object in Data 360. Metadata includes dimensions and measures. Since v52.0.
    example: CALL cdp.insights_metadata_get (ci_name => 'Avg_Spends__cio');
    options:
      - {name: ci_name, api_name: ciName, in: path, type: string, required: true, description: "API name of the insight, such as `Avg_Spends__cio`."}
    columns:
      - {name: metadata, type: JSON, description: "Result metadata set. Since v52.0."}
    effect: read
    evidence: O
    result_description: One row. Schema `CdpQueryMetadataOutputRepresentation`.

  - name: metadata
    method: GET
    host: connect
    path: /ssot/metadata
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Metadata/paths/~1ssot~1metadata/get
    tools: [d360_metadata]
    description: Get all metadata, including Calculated Insights, Engagement, Profile, and other objects, as well as their relationships to other objects in Data 360. Since v52.0.
    example: CALL cdp.metadata (entity_name => 'ssot__Individual__dlm');
    options:
      - {name: dataspace, in: query, type: string, description: "Name of the data space. If unspecified, the `default` data space is used. Since v55.0."}
      - {name: entity_category, api_name: entityCategory, in: query, type: string, description: "Category of the metadata entity. Valid values are `Profile`, `Engagement`, and `Related`. If unspecified, all category entities are returned. Since v54.0."}
      - {name: entity_name, api_name: entityName, in: query, type: string, description: "Metadata name of the entity, for example `UnifiedIndividual__dlm`. If unspecified, a complete list of entities is returned. Since v54.0."}
      - {name: entity_type, api_name: entityType, in: query, type: string, description: "Type of metadata entity requested. Valid values are `DataLakeObject`, `DataModelObject`, and `CalculatedInsight`. If unspecified, all types are returned. Since v54.0."}
    columns:
      - {name: metadata, type: JSON, description: "Result metadata set. Since v52.0."}
    effect: read
    evidence: O
    result_description: One row. Schema `CdpQueryMetadataOutputRepresentation`.
    notes: |
      **Notes:** **`metadata` or [`dmo_list`](data_model_objects.md#dmo_list)?** Use this one for the model the org actually uses.

      | | `metadata` | `dmo_list` |
      |---|---|---|
      | DMOs | Only those in use | The whole catalog, over 1,000 |
      | Cost | One fast call | 20 to 40 s per page of 200 |
      | Relationships | Active only, each listed twice, once at each end | Separate call, [`dmo_relationship_list`](data_model_objects.md#dmo_relationship_list), which also returns inactive ones |

      These rows come from [one test on a Developer Edition org](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md) (community, one org). A DMO missing here can still exist in the catalog. This call also covers DLOs and insights.

      **Always filter.** [Salesforce's tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/MetadataTools.java) treats `entity_name` as required "to avoid massive responses", although the spec makes it optional.

      **The result is one row**, with every entity in the `metadata` array. DMOs and DLOs have `fields`, `indexes`, `category`, `relationships` and `primary_keys`. Insights have `dimensions`, `measures` and `partition_by`. A field's `keyQualifier` names its key qualifier field.

      **`entity_category` values disagree.** The spec says `Profile`, `Engagement` and `Related`. [Salesforce's tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/MetadataTools.java) says `Profile`, `Engagement`, `Other` and `DirectoryTable`. The [tenant host page](https://developer.salesforce.com/docs/data/data-cloud-query-guide/references/data-cloud-query-api-reference/c360a-api-metadata-api.md) says the filter doesn't apply to insights.

      **Data graphs add system DMOs** here under `Profile` or `Related`, so a category filter doesn't remove them. One graph with 12 nodes [added 18 DMOs](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md) (community, one org).

  - name: metadata_entities
    method: GET
    host: connect
    path: /ssot/metadata-entities
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Metadata/paths/~1ssot~1metadata-entities/get
    tools: [d360_metadata_entities]
    description: Get a list of metadata entities. This endpoint provides a high-performance way to retrieve metadata for Data 360 entities. By returning only essential fields like name, type, and category, it allows you to efficiently view entities at scale. Request detailed field and relationship data only for the specific objects you need. Since v66.0.
    example: CALL cdp.metadata_entities (entity_type => 'DataModelObject', entity_category => 'Profile');
    options:
      - {name: dataspace, in: query, type: string, description: "Name of the data space in which the metadata is requested. Since v66.0."}
      - {name: entity_category, api_name: entityCategory, in: query, type: string, description: "Category of the metadata entity. If unspecified, all categories are returned. Supported values are: - `Activation_Audience` - `CG_Audience` - `Content` - `Directory_Table` - `Engagement` - `Profile` - `Related` - `Segment_Membership` - `Vector_Embedding` Since v66.0."}
      - {name: entity_type, api_name: entityType, in: query, type: string, description: "Type of metadata entity. If unspecified, all types are returned. Supported values are: - `CalculatedInsight` - `DataLakeObject` - `DataModelObject` Since v66.0."}
    rows: /metadata
    columns:
      - {name: category, type: VARCHAR, description: "Category of the metadata entity. Supported values are: - `Activation_Audience` - `CG_Audience` - `Content` - `Directory_Table` - `Engagement` - `Profile` - `Related` - `Segment_Membership` - `Vector_Embedding` Since v66.0."}
      - {name: display_name, api_name: displayName, type: VARCHAR, description: "Display name of the entity. Since v66.0."}
      - {name: name, type: VARCHAR, description: "Name of the entity. Since v66.0."}
      - {name: type, type: VARCHAR, description: "Type of metadata entity. Supported values are: - `CalculatedInsight` - `DataLakeObject` - `DataModelObject` Since v66.0."}
    effect: read
    evidence: O
    result_description: "One row per item of `/metadata` in the response. Other response fields go to `_meta`: `done`, `nextBatchId`. Schema `CdpQueryMetadataEntityOutputRepresentation`."
    notes: |
      **Paging:** `nextBatchId`, but the spec has no way to send it, so this function can only read the first batch. [Salesforce's tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/MetadataTools.java) fetches the next one from `GET /ssot/metadata-entities/{nextBatchId}`, a path the spec doesn't list.

      **Notes:** Use this for an inventory: it returns names, types and categories, without fields. Then call [`metadata`](#metadata) with `entity_name` for details.

      The spec makes `entity_type` optional, while the [catalog](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/runtime/FamilyCatalog.java) says "entity_type required". [Salesforce's tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/MetadataTools.java) sends the call without it.

      Category names vary. The spec has `Directory_Table`, and [the tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/MetadataTools.java) says `DirectoryTable` and `Other`. In [one test](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md) this call used `Segment_Membership_Category` and `Activation_Audience_Category` (community, one org).

  - name: profile_query
    method: GET
    host: connect
    path: /ssot/profile/{dataModelName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Profile/paths/~1ssot~1profile~1%7BdataModelName%7D/get
    tools: [d360_profile_query]
    description: Query a profile data model object using filters in Data 360. Since v52.0.
    example: CALL cdp.profile_query (data_model_name => 'ssot__Individual__dlm', filters => '[ssot__FirstName__c=Jean]', fields => 'ssot__Id__c,ssot__LastName__c', batch_size => 100);
    options:
      - {name: data_model_name, api_name: dataModelName, in: path, type: string, required: true, description: "Name of the data model object. Since v52.0."}
      - {name: batch_size, api_name: batchSize, in: query, type: integer, description: "Number of items to return. Values are from `1` through `4999`. If unspecified, the default value is `100`. Since v52.0."}
      - {name: fields, in: query, type: string, description: "Comma-separated list of up to 50 field names that you want to include in the result, for example, `Id__c,FirstName__c`, `GenderId__c,Occupation__c`. If unspecified, `Id__c` is returned. Since v52.0."}
      - {name: filters, in: query, type: string, required: true, description: "Comma-separated list of equality expressions within square brackets, for example, `[FirstName__c=DON]`. Since v52.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. If unspecified, no rows are skipped. Since v52.0."}
      - {name: order_by, api_name: orderby, in: query, type: string, description: "Sort order for the result set, such as `GenderId__c ASC,Occupation__c DESC`. If unspecified, items are returned in the order they are retrieved. Since v52.0."}
    columns:
      - {name: data, type: JSON, description: "Result data set. Since v52.0."}
      - {name: done, type: BOOLEAN, description: "Specifies whether the query is done (`true`) or not (`false`). Since v52.0."}
      - {name: end_time, api_name: endTime, type: VARCHAR, description: "Query end time. Not returned for data graphs. Since v52.0."}
      - {name: metadata, type: JSON, description: "Result metadata set. Not returned for data graphs. Since v52.0."}
      - {name: query_id, api_name: queryId, type: VARCHAR, description: "Query ID. Not returned for data graphs. Since v52.0."}
      - {name: row_count, api_name: rowCount, type: BIGINT, description: "Number of rows in the result data set. Not returned for data graphs. Since v52.0."}
      - {name: start_time, api_name: startTime, type: VARCHAR, description: "Query start time. Not returned for data graphs. Since v52.0."}
    paging: {kind: offset, option: offset, size: batch_size, start: 0}
    effect: read
    evidence: O
    result_description: One row. Schema `CdpQueryOutputRepresentation`.
    notes: |
      **Paging:** `batch_size`, `offset`.

      **Notes:** From the [Profile API overview](https://developer.salesforce.com/docs/data/data-cloud-query-guide/references/data-cloud-query-api-reference/c360a-api-profile-call-overview.md): this reads Profile category DMOs only, and Engagement DMOs aren't supported. Filters are equality only, joined by AND, with no limit on their number. Date and time values use `YYYY-MM-DD HH:MM:SS`. Unified objects filtered on an index column respond faster, and [`profile_metadata_get`](#profile_metadata_get) lists the indexes.

      `data_model_name` is the [full API name with `__dlm`](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/endpoint-families.md), although [Salesforce's tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/QueryTools.java) gives `Individual` and `Account` as examples. The spec has no `dataspace` here, while the tool accepts one.

      Records are in the `data` column as JSON.

  - name: profile_get
    method: GET
    host: connect
    path: /ssot/profile/{dataModelName}/{id}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Profile/paths/~1ssot~1profile~1%7BdataModelName%7D~1%7Bid%7D/get
    description: Get profile records by the value of a key. Without `search_key`, `id` matches the primary key. With it, `id` matches that field.
    example: CALL cdp.profile_get (data_model_name => 'ssot__Individual__dlm', id => 'Jean', search_key => 'ssot__FirstName__c', fields => 'ssot__Id__c,ssot__LastName__c');
    options:
      - {name: data_model_name, api_name: dataModelName, in: path, type: string, required: true, description: "API name of the DMO, with the `__dlm` suffix, such as `ssot__Individual__dlm`."}
      - {name: id, in: path, type: string, required: true, description: "Value to match: the primary key, or the field named in `search_key` if set."}
      - {name: batch_size, api_name: batchSize, in: query, type: integer, description: "Number of items to return. Values are from `1` through `4999`. If unspecified, the default value is `100`. Since v52.."}
      - {name: fields, in: query, type: string, description: "Comma-separated list of up to 50 field names that you want to include in the result, for example, `Id__c,FirstName__c`, `GenderId__c,Occupation__c`. If unspecified, `Id__c` is returned. Since v52.0."}
      - {name: filters, in: query, type: string, description: "Comma-separated list of equality expressions within square brackets, for example, `[FirstName__c=DON]`. Since v52.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. If unspecified, no rows are skipped. Since v52.0."}
      - {name: order_by, api_name: orderby, in: query, type: string, description: "Sort order for the result set, such as `GenderId__c ASC,Occupation__c DESC`. If unspecified, items are returned in the order they are retrieved. Since v52.0."}
      - {name: search_key, api_name: searchKey, in: query, type: string, description: "If a field other than the primary key is used, name of the key field, for example, `FirstName__c`. Parameter is required for secondary key. Since v52.0."}
    columns:
      - {name: data, type: JSON, description: "Result data set. Since v52.0."}
      - {name: done, type: BOOLEAN, description: "Specifies whether the query is done (`true`) or not (`false`). Since v52.0."}
      - {name: end_time, api_name: endTime, type: VARCHAR, description: "Query end time. Not returned for data graphs. Since v52.0."}
      - {name: metadata, type: JSON, description: "Result metadata set. Not returned for data graphs. Since v52.0."}
      - {name: query_id, api_name: queryId, type: VARCHAR, description: "Query ID. Not returned for data graphs. Since v52.0."}
      - {name: row_count, api_name: rowCount, type: BIGINT, description: "Number of rows in the result data set. Not returned for data graphs. Since v52.0."}
      - {name: start_time, api_name: startTime, type: VARCHAR, description: "Query start time. Not returned for data graphs. Since v52.0."}
    paging: {kind: offset, option: offset, size: batch_size, start: 0}
    effect: read
    evidence: O
    result_description: One row. Schema `CdpQueryOutputRepresentation`.
    notes: |
      **Paging:** `batch_size`, `offset`.

      **Notes:** `offset` [needs `order_by`](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/endpoint-families.md) on this route.

  - name: profile_child
    method: GET
    host: connect
    path: /ssot/profile/{dataModelName}/{id}/{childDataModelName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Profile/paths/~1ssot~1profile~1%7BdataModelName%7D~1%7Bid%7D~1%7BchildDataModelName%7D/get
    description: Get the child records of a profile record, such as an Individual's email addresses. `filters` applies to the parent only, and `fields` to the child only.
    example: CALL cdp.profile_child (data_model_name => 'ssot__Individual__dlm', id => '100005', child_data_model_name => 'ContactPointEmail__dlm');
    options:
      - {name: child_data_model_name, api_name: childDataModelName, in: path, type: string, required: true, description: "API name of the child DMO, such as `ContactPointEmail__dlm`."}
      - {name: data_model_name, api_name: dataModelName, in: path, type: string, required: true, description: "API name of the parent DMO, with the `__dlm` suffix, such as `ssot__Individual__dlm`."}
      - {name: id, in: path, type: string, required: true, description: "Value to match on the parent: the primary key, or the field named in `search_key` if set."}
      - {name: batch_size, api_name: batchSize, in: query, type: integer, description: "Number of items to return. Values are from `1` through `4999`. If unspecified, the default value is `100`. Since v52.0."}
      - {name: fields, in: query, type: string, description: "Comma-separated list of child object field names that you want to include in the result, for example, `Id__c,EmailAddress__c`. If unspecified, the first 10 alphabetically sorted fields are returned. Since v52.0."}
      - {name: filters, in: query, type: string, description: "Comma-separated list of equality expressions within square brackets, for example, `[FirstName__c=DON]`. Filters are applied to the parent object only. Since v52.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. If unspecified, no rows are skipped. Since v52.0."}
      - {name: order_by, api_name: orderby, in: query, type: string, description: "Sort order for the result set, such as `GenderId__c ASC,Occupation__c DESC`. If unspecified, items are returned in the order they are retrieved. Since v52.0."}
      - {name: search_key, api_name: searchKey, in: query, type: string, description: "If a field other than the primary key is used, name of the key field, for example, `FirstName__c`. Parameter is required for secondary key. Since v52.0."}
    columns:
      - {name: data, type: JSON, description: "Result data set. Since v52.0."}
      - {name: done, type: BOOLEAN, description: "Specifies whether the query is done (`true`) or not (`false`). Since v52.0."}
      - {name: end_time, api_name: endTime, type: VARCHAR, description: "Query end time. Not returned for data graphs. Since v52.0."}
      - {name: metadata, type: JSON, description: "Result metadata set. Not returned for data graphs. Since v52.0."}
      - {name: query_id, api_name: queryId, type: VARCHAR, description: "Query ID. Not returned for data graphs. Since v52.0."}
