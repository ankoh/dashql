    method: POST
    host: connect
    path: /connect/search/metadata/results
    tools: [d360_metadata_search]
    description: Search metadata in natural language, without listing every entity. Each result's `api_name` is what `metadata` takes as `entity_name`.
    example: CALL cdp.metadata_search (query => 'AI Agent Interaction', pagination => (limit = 5), filters => [(field = 'metadataType', values = ['DataModelObject'])]);
    options:
