title: Activation Platforms
description: |
  An activation platform defines a destination: its output format, attributes, identifiers and connector. An [activation target](activation_targets.md) is a configured use of a platform in a data space, and an [activation](activations.md) sends a segment to a target. So the order is platform, target, activation.

  Packaged partner platforms, such as Google Ads and Meta, carry the prefix `cdpactvstrgptnr` in the spec's examples. You read those and point a target at them. You create a platform only for your own destination, such as an S3 bucket.

  Things to watch:

  - **Three read views.** `activation_external_platform_list` (since v64) returns destination attributes. `activation_platform_list` (since v67) returns summaries. [`activation_platform_metadata_list`](activation_targets.md#activation_platform_metadata_list) also covers built-in destinations such as Commerce Cloud. Everything else here needs v67, and DashQL calls v64 today.
  - **Three name forms.** For Meta's platform, the spec's examples show `name` `Meta_Conversions_API`, `key_prefix_name` `cdpactvstrgptnr`, and the path form `cdpactvstrgptnr__Meta_Conversions_API`. A target's `platform_name` holds the label, such as `Google Ads Platform`.
  - **Enum case differs.** The external family returns `ACTIVE` and `ADVERTISING`; `activation_platform_*` returns `Active` and `Advertising`.
  - **Feature gating.** A disabled org can return 403 ([one org](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/registry/connect-openapi-overrides.json)).

  ```sql
  /* A packaged platform: find it, then point a target at it. */
  CALL cdp.activation_external_platform_list ();
  CALL cdp.activation_target_create (name => 'google_ads_target', dataspace_name => 'default', platform_type => 'ExternalPlatform', connector => (name = 'PremiumPartnerGoogle', key_prefix_name = 'cdpactvstrgptnr'));

  /* Your own platform, after activation_platform_create: */
  CALL cdp.activation_platform_get (id_or_name => 'abc_user_identifiers');
  CALL cdp.activation_platform_publish (id_or_name => 'abc_user_identifiers');
  ```

functions:
  - name: activation_platform_delete
    method: DELETE
    host: connect
    path: /ssot/activation-platforms/{idOrName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Activation-Platforms/paths/~1ssot~1activation-platforms~1%7BidOrName%7D/delete
    description: Deletes an activation platform. Returns a 412 error if the platform is referenced by activation targets or market segment activations. Since v67.0.
    example: CALL cdp.activation_platform_delete (id_or_name => 'abc_user_identifiers');
    options:
      - {name: id_or_name, api_name: idOrName, in: path, type: string, required: true, description: "Record ID or API name of the activation platform."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 200). One row with only the standard columns.
    notes: "**Notes:** The spec's description gives the 412, but its response list doesn't include it. To find blockers first, filter `activation_target_list` by `platform_name`. That column holds the platform's label, not its API name (for example `filters => 'platformName in Google Ads Platform'`)."

  - name: activation_external_platform_list
    method: GET
    host: connect
    path: /ssot/activation-external-platforms
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Activation-External-Platforms/paths/~1ssot~1activation-external-platforms/get
    description: Lists the org's activation external platforms with their status, type, namespace prefix and destination attributes. Use it to find the name and prefix that a target's connector needs.
    example: CALL cdp.activation_external_platform_list ();
    options:
      - {name: batch_size, api_name: batchSize, in: query, type: integer, description: "Number of external platforms to return. Values are from `1` through `20`. If unspecified, the default value is `20`. Since v64.0."}
      - {name: limit, in: query, type: integer, description: "Maximum number of external platforms to return. If unspecified, the default value is `20`. Since v64.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. Must be greater than or equal to `0`. If unspecified, no rows are skipped. Since v64.0."}
      - {name: order_by, api_name: orderBy, in: query, type: string, description: "Order in which to sort the results based on the `created_date` field. Specify the field name followed by `asc` for ascending order or `desc` for descending order. If you specify only the field name or omit the parameter, results are sorted in ascending order. For example, `created_date asc` and `created_date` yield the same results. Since v64.0."}
    rows: /platforms
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: attribute_config, api_name: attributeConfig, type: JSON, schema: ActivationExternalPlatformAttributeConfigRepresentation, description: "Configuration of the external platform attributes. Since v64.0."}
      - {name: creation_type, api_name: creationType, type: VARCHAR, description: "Creation type for the external platform. Since v64.0."}
      - {name: key_prefix_name, api_name: keyPrefixName, type: VARCHAR, description: "Namespace prefix of the external platform. Since v64.0."}
      - {name: privacy_type, api_name: privacyType, type: VARCHAR, description: "Privacy type for the external platform. Since v64.0."}
      - {name: status, type: VARCHAR, description: "Status of the external platform. Since v64.0."}
      - {name: type, type: VARCHAR, description: "Platform type for the external platform. Since v64.0."}
    paging: {kind: url, from: {body: /nextPageUrl}}
    effect: read
    evidence: O
    result_description: "One row per item of `/platforms` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`. Schema `ActivationExternalPlatformRepresentation`."
    notes: |
      **Paging:** `next_page_url`.

      **Notes:** Values are uppercase here: the spec's examples show `status` `ACTIVE`, `type` `ADVERTISING`, `privacy_type` `THIRDPARTY` and `creation_type` `MANUAL` or `JSON`. Salesforce's sf-pi repo [relaxed its schema](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/registry/connect-openapi-overrides.json) because live responses used uppercase values outside the published enum (one org).

      The spec's list example has no `id` in its items, so key on `name` and `key_prefix_name`. `creation_type` is absent on the packaged platform in that example, and `privacy_type` is absent on the two others. `order_by` sorts on `created_date` only.

      A community guide reads the error text `CdpActivationExternalPlatform` as [the feature being gated](https://github.com/Jaganpro/sf-skills/blob/main/skills/sf-datacloud/references/feature-readiness.md) for the org or user, and advises against [retrying blindly](https://github.com/Jaganpro/sf-skills/blob/main/skills/sf-datacloud-act/SKILL.md) (community). Platform connections have a [Setup page](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-browser/docs/data-cloud-destinations.md) at `/lightning/setup/ExternalActivationPlatform/home`.

      A target's `connector` takes `name` and `key_prefix_name`, and `field_config` for platform fields. These appear in the spec's target examples and in the [MCP server's request class](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/model/request/activation/ConnectorInput.java), but `key_prefix_name` and `field_config` are missing from the spec's connector schema.

  - name: activation_external_platform_get
    method: GET
    host: connect
    path: /ssot/activation-external-platforms/{idOrName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Activation-External-Platforms/paths/~1ssot~1activation-external-platforms~1%7BidOrName%7D/get
    description: Returns one external platform with its attribute configuration. Pass an event name and action source to scope the attributes to that event.
    example: CALL cdp.activation_external_platform_get (id_or_name => '1sqxx0000000087AAA', event_name => 'Purchase', action_source => 'Website');
    options:
      - {name: id_or_name, api_name: idOrName, in: path, type: string, required: true, description: "Unique identifier of a specific activation external platform, such as the ID or developer name. Since v67.0."}
      - {name: action_source, api_name: actionSource, in: query, type: string, description: "Action source used, together with `event_name`, to scope the returned attribute configuration. Since v67.0."}
      - {name: event_name, api_name: eventName, in: query, type: string, description: "Standard event name used, together with `action_source`, to scope the returned attribute configuration. For example, the platform's standard event. Since v67.0."}
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: attribute_config, api_name: attributeConfig, type: JSON, schema: ActivationExternalPlatformAttributeConfigRepresentation, description: "Configuration of the external platform attributes. Since v64.0."}
      - {name: creation_type, api_name: creationType, type: VARCHAR, description: "Creation type for the external platform. Since v64.0."}
      - {name: key_prefix_name, api_name: keyPrefixName, type: VARCHAR, description: "Namespace prefix of the external platform. Since v64.0."}
      - {name: privacy_type, api_name: privacyType, type: VARCHAR, description: "Privacy type for the external platform. Since v64.0."}
      - {name: status, type: VARCHAR, description: "Status of the external platform. Since v64.0."}
      - {name: type, type: VARCHAR, description: "Platform type for the external platform. Since v64.0."}
    effect: read
    evidence: O
    result_description: One row. Schema `ActivationExternalPlatformRepresentation`.
    notes: |
      **Notes:** This is since v67, while the list is since v64. In an org with this detail disabled it [returned 403 with an error array](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/registry/connect-openapi-overrides.json), which the spec doesn't declare (one org).

      `attribute_config.attributes[].destinationName` is what an activation's `external_platform_attribute_name` refers to, going by that option's description. The scoped example also carries `valueSource` (`CONSTANT` with `values`, or `MAPPED`), which the attribute schema omits.

      **Event spelling is unclear.** The scoped example shows `event_name` `AddToCart` and `action_source` `website`, while `activation_platform_event_list` returns `Add to Cart` and `activation_platform_action_source_list` returns `Website`. No source says which spelling `event_name` and `action_source` expect. The spec's `activation_platform_action_source_list` example uses `Purchase`, which avoids the question.

