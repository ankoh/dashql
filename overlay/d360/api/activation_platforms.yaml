    host: connect
    path: /ssot/activation-platforms/{idOrName}/actions/set-privacy-type
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Activation-Platforms/paths/~1ssot~1activation-platforms~1%7BidOrName%7D~1actions~1set-privacy-type/post
    description: Sets the privacy type classification for an activation platform. Since v67.0.
    example: CALL cdp.activation_platform_privacy_type_set (id_or_name => 'abc_user_identifiers', privacy_type => 'NotApplicable');
    options:
      - {name: id_or_name, api_name: idOrName, in: path, type: string, required: true, description: "18-character ID or API name of the activation platform. Since v67.0."}
      - {name: privacy_type, api_name: privacyType, in: body, type: string, enum: [ThirdParty, ServiceProvider, UpdateFailed, NotApplicable], required: true, description: "Privacy type classification for the platform. Since v67.0."}
    columns:
      - {name: message, type: VARCHAR, description: "Human-readable status or warning message. Can be null on success. Since v67.0."}
      - {name: success, type: BOOLEAN, description: "Indicates whether the action completed successfully (`true`) or not (`false`). Since v67.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `ActionResultRepresentation`.
    notes: "**Notes:** A target's `platform_privacy_type` is derived from this value (spec). `UpdateFailed` is in the accepted enum, and no source says what setting it means. The external family returns the same concept in uppercase (`THIRDPARTY`)."

schemas:
  ActivationEventParameterHierarchyCombinationInputRepresentation:
    description: Represents the input for a key-values pair within a hierarchy combination.
    attributes:
      - {name: key, type: string, required: true, description: "Parameter value key, such as `Purchase`. Since v67.0."}
      - {name: values, array: 1, type: string, description: "Valid child parameter values for the key. Since v67.0."}

  ActivationEventParameterHierarchyInputRepresentation:
    description: Represents the input for a hierarchy combination.
    attributes:
      - {name: hierarchy_combination, api_name: hierarchyCombination, type: string, required: true, description: "Combination key, such as `Event__ActionSource`. Since v67.0."}
      - {name: hierarchy_combination_data, api_name: hierarchyCombinationData, schema: ActivationEventParameterHierarchyCombinationInputRepresentation, array: 1, description: "Valid value pairings for the combination. Since v67.0."}

  ActivationEventParameterInputRepresentation:
    description: Represents the input for an event parameter reference.
    attributes:
      - {name: name, type: string, required: true, description: "Parameter value name, such as `Purchase` or `Website`. Since v67.0."}
      - {name: sub_event_parameter, api_name: subEventParameter, schema: ActivationEventParameterInputRepresentation, description: "Nested event parameter reference for the next level in the hierarchy. Since v67.0."}
      - {name: type, type: string, enum: [ActionSource, Event], required: true, description: "Type of event parameter. Since v67.0."}

  ActivationEventParameterValuesInputRepresentation:
    description: Represents the input for an event parameter definition.
    attributes:
      - {name: hierarchy, type: integer, description: "Hierarchy level, starting at 1. Since v67.0."}
      - {name: name, type: string, required: true, description: "Parameter name, such as `Event` or `Action Source`. Since v67.0."}
      - {name: type, type: string, enum: [ActionSource, Event], required: true, description: "Type of event parameter. Since v67.0."}
      - {name: values, array: 1, type: string, description: "Allowed values for the parameter. Since v67.0."}

  ActivationMappingSchemaInputRepresentation:
    description: Represents the input for a mapping schema.
    attributes:
      - {name: description, type: string, description: "Description of the mapping schema. Since v67.0."}
      - {name: icon, type: string, description: "Icon identifier. Since v67.0."}
      - {name: is_default, api_name: isDefault, type: boolean, description: "Indicates whether the schema is the default mapping schema (`true`) or not (`false`). Since v67.0."}
      - {name: name, type: string, required: true, description: "Name of the mapping schema. Since v67.0."}
      - {name: title, type: string, description: "Display title. Since v67.0."}

  ActivationPlatformAdditionalMetadataInputRepresentation:
    description: Represents the input for additional platform metadata, such as event configuration, mappings, and output properties.
    attributes:
      - {name: activation_platform_event_metadata, api_name: activationPlatformEventMetadata, schema: ActivationPlatformEventMetadataInputRepresentation, description: "Event metadata configuration. Since v67.0."}
      - {name: custom_attribute_prefix, api_name: customAttributePrefix, type: string, description: "Prefix for custom attributes, such as `custom__`. Since v67.0."}
      - {name: customer_file_sources, api_name: customerFileSources, array: 1, type: string, description: "Customer file source types, such as `FirstParty`, `ThirdParty`, or `FirstPartyAndThirdParty`. Since v67.0."}
      - {name: hash_method, api_name: hashMethod, type: string, description: "Hash method applied to identifiers. Since v67.0."}
      - {name: mapping_schemas, api_name: mappingSchemas, schema: ActivationMappingSchemaInputRepresentation, array: 1, description: "Available mapping schemas for the platform. Since v67.0."}
      - {name: output_properties, api_name: outputProperties, schema: ActivationPlatformOutputPropertiesInputRepresentation, description: "File output configuration properties. Since v67.0."}
      - {name: partner_supported_ids, api_name: partnerSupportedIds, schema: ActivationPlatformPartnerSupportedIdInputRepresentation, array: 1, description: "Partner-supported identifier types per destination. Since v67.0."}

  ActivationPlatformAttributeInputRepresentation:
    description: Represents the input for an activation attribute.
    attributes:
      - {name: apply_hash, api_name: applyHash, type: boolean, description: "Indicates whether hashing is applied to the attribute (`true`) or not (`false`). Since v67.0."}
      - {name: destination_name, api_name: destinationName, type: string, description: "Destination name for the attribute. Since v67.0."}
      - {name: field_name, api_name: fieldName, type: string, description: "Source field name. Since v67.0."}
      - {name: is_identifier, api_name: isIdentifier, type: boolean, description: "Indicates whether the attribute is an identifier (`true`) or not (`false`). Since v67.0."}
      - {name: is_required, api_name: isRequired, type: boolean, required: true, description: "Indicates whether the attribute is required (`true`) or not (`false`). Since v67.0."}
      - {name: label, type: string, description: "Attribute display label. Since v67.0."}
      - {name: name, type: string, required: true, description: "Attribute name. Since v67.0."}
      - {name: object_name, api_name: objectName, type: string, description: "Source object name. Since v67.0."}
      - {name: value, type: string, description: "Constant value for the attribute. Since v67.0."}

  ActivationPlatformAttributeSystemMapCriteriaInputRepresentation:
    description: Represents the input for system-mapped attribute criteria.
    attributes:
      - {name: data_type, api_name: dataType, type: string, required: true, description: "Data type of the mapped field. Since v67.0."}
      - {name: destination_name, api_name: destinationName, type: string, required: true, description: "Destination attribute name. Since v67.0."}
      - {name: source_mapping_field, api_name: sourceMappingField, type: string, required: true, description: "Source field to auto-map from, such as `commit_timestamp`. Since v67.0."}
      - {name: supported_dmo_types, api_name: supportedDMOTypes, array: 1, type: string, description: "Data model object (DMO) types that support the system mapping, such as `Profile`. Since v67.0."}

  ActivationPlatformCustomEventInputRepresentation:
    description: Represents the input for custom event details.
    attributes:
      - {name: attribute_mapping_info, api_name: attributeMappingInfo, schema: ActivationPlatformEventAttributeMappingInputRepresentation, array: 1, description: "Attribute mapping rules for custom events. Since v67.0."}
      - {name: attributes_override, api_name: attributesOverride, schema: ActivationPlatformEventAttributeOverrideInputRepresentation, description: "Attribute override categorization for custom events. Since v67.0."}

  ActivationPlatformCustomMetadataInputRepresentation:
    description: Represents the connector credentials for toolkit-created activation platforms. The required fields depend on the connector type. For example, S3 requires `access_key` and `secret_key`.
    attributes:
      - {name: access_key, api_name: accessKey, type: string, description: "Access key for the connector. Required for S3. Since v67.0."}
      - {name: connector_type, api_name: connectorType, type: string, required: true, description: "Connector type, such as `S3`, `Sftp`, or `AzureBlob`. Since v67.0."}
      - {name: secret_key, api_name: secretKey, type: string, description: "Secret key for the connector. Required for S3. Since v67.0."}

  ActivationPlatformEventAttributeInputRepresentation:
    description: Represents the input for a destination attribute with an optional constant value.
    attributes:
      - {name: destination_name, api_name: destinationName, type: string, required: true, description: "Destination attribute name. Since v67.0."}
      - {name: value, type: string, description: "Constant value. Null if mapped dynamically. Since v67.0."}

  ActivationPlatformEventAttributeMappingInputRepresentation:
    description: Represents the input for an attribute mapping rule.
    attributes:
      - {name: attributes_override, api_name: attributesOverride, schema: ActivationPlatformEventAttributeOverrideInputRepresentation, description: "Attribute override categorization for the mapping. Since v67.0."}
      - {name: event_parameter, api_name: eventParameter, schema: ActivationEventParameterInputRepresentation, description: "Event parameter reference for the mapping. Since v67.0."}
      - {name: key, type: string, required: true, description: "Mapping key, such as `Purchase__Website` or `Global`. Since v67.0."}
      - {name: reference_attributes, api_name: referenceAttributes, array: 1, type: string, description: "Keys of parent mappings whose attributes are inherited. Since v67.0."}

  ActivationPlatformEventAttributeOverrideInputRepresentation:
    description: Represents the input for attribute override categorization.
    attributes:
      - {name: exclude, schema: ActivationPlatformEventAttributeInputRepresentation, array: 1, description: "Excluded attributes for this context. Since v67.0."}
      - {name: identifiers, schema: ActivationPlatformEventAttributeInputRepresentation, array: 1, description: "Identifier attributes for this context. Since v67.0."}
      - {name: optional, schema: ActivationPlatformEventAttributeInputRepresentation, array: 1, description: "Optional attributes for this context. Since v67.0."}
      - {name: required, schema: ActivationPlatformEventAttributeInputRepresentation, array: 1, description: "Required attributes for this context. Since v67.0."}
      - {name: system_mapping_attributes, api_name: systemMappingAttributes, schema: ActivationPlatformAttributeSystemMapCriteriaInputRepresentation, array: 1, description: "System-mapped attributes with auto-population criteria. Since v67.0."}

  ActivationPlatformEventMetadataInputRepresentation:
    description: Represents the input for event metadata configuration.
    attributes:
      - {name: custom_event_details, api_name: customEventDetails, schema: ActivationPlatformCustomEventInputRepresentation, description: "Custom event details with attribute overrides. Since v67.0."}
      - {name: show_event_source_annotations, api_name: showEventSourceAnnotations, type: boolean, description: "Indicates whether event source annotations are shown in the UI (`true`) or not (`false`). Since v67.0."}
      - {name: standard_event_details, api_name: standardEventDetails, schema: ActivationPlatformStandardEventInputRepresentation, description: "Standard event details, including event parameters, hierarchy, and attribute mapping info. Since v67.0."}
      - {name: supported_event_types, api_name: supportedEventTypes, array: 1, type: string, description: "Supported event types, such as `Standard` and `Custom`. Since v67.0."}

  ActivationPlatformFieldInputRepresentation:
    description: Represents the input for a configuration field.
    attributes:
      - {name: help_text, api_name: helpText, type: string, description: "Help text for the field. Since v67.0."}
      - {name: is_hidden, api_name: isHidden, type: boolean, description: "Indicates whether the field is hidden in the UI (`true`) or not (`false`). Since v67.0."}
      - {name: is_required, api_name: isRequired, type: boolean, required: true, description: "Indicates whether the field is required (`true`) or not (`false`). Since v67.0."}
      - {name: label, type: string, description: "Field display label. Since v67.0."}
      - {name: name, type: string, required: true, description: "Field API name. Since v67.0."}
      - {name: type, type: string, enum: [Date, Number, Text], required: true, description: "Data type of the field. Since v67.0."}
      - {name: values, schema: ActivationPlatformFieldValueInputRepresentation, array: 1, description: "Allowed values for picklist fields. The spec's output schema says exactly one value must have `is_default` set to `true`. Since v67.0."}

  ActivationPlatformFieldValueInputRepresentation:
    description: Represents the input for a field picklist value.
    attributes:
      - {name: is_default, api_name: isDefault, type: boolean, description: "Indicates whether the value is the default value (`true`) or not (`false`). Since v67.0."}
      - {name: value, type: string, description: "Picklist value. Since v67.0."}

  ActivationPlatformIdentifierInputRepresentation:
    description: Represents the input for a platform audience identifier.
    attributes:
      - {name: identifier_hash_method, api_name: identifierHashMethod, type: string, enum: [Md5, "None", Sha1, Sha256], description: "Hash method applied to the identifier. Since v67.0."}
      - {name: identifier_type, api_name: identifierType, type: string, enum: [Email, Maid, Ott, Phone], description: "Type of audience identifier. Since v67.0."}

  ActivationPlatformOutputPropertiesInputRepresentation:
    description: Represents the input for file output configuration properties.
    attributes:
      - {name: compression, type: string, enum: [Bzip2, Gzip, "None"], description: "Compression method applied to output files. Since v67.0."}
      - {name: delimiter, type: string, enum: [BrokenPipe, Caret, Colon, Comma, Hash, Pipe, Semicolon, Slash, Tab, Tilde, Underscore], description: "Field delimiter used in output files. Since v67.0."}
      - {name: max_file_size_in_mb, api_name: maxFileSizeInMB, type: integer, description: "Maximum file size in megabytes. Since v67.0."}
      - {name: max_records_per_file, api_name: maxRecordsPerFile, type: number, format: int64, description: "Maximum records per output file. Since v67.0."}
      - {name: min_records_per_file, api_name: minRecordsPerFile, type: number, format: int64, description: "Minimum records per output file. Since v67.0."}
      - {name: output_format, api_name: outputFormat, type: string, enum: [Csv, Json, Parquet], description: "Format of the output files. Since v67.0."}
      - {name: output_partitions, api_name: outputPartitions, type: number, format: int64, description: "Number of output partitions. Since v67.0."}

  ActivationPlatformPartnerSupportedIdInputRepresentation:
    description: Represents the input for partner-supported identifier types.
    attributes:
      - {name: destination_name, api_name: destinationName, type: string, required: true, description: "Destination attribute that accepts these ID types. Since v67.0."}
      - {name: supported_id_types, api_name: supportedIdTypes, array: 1, type: string, description: "Supported identifier type values. Since v67.0."}

  ActivationPlatformStandardEventInputRepresentation:
    description: Represents the input for standard event details.
    attributes:
      - {name: attribute_mapping_info, api_name: attributeMappingInfo, schema: ActivationPlatformEventAttributeMappingInputRepresentation, array: 1, description: "Attribute mapping rules per event/action-source combination. Since v67.0."}
      - {name: event_parameter_hierarchy, api_name: eventParameterHierarchy, schema: ActivationEventParameterHierarchyInputRepresentation, array: 1, description: "Hierarchy combinations defining valid parameter value pairings. Since v67.0."}
      - {name: event_parameters, api_name: eventParameters, schema: ActivationEventParameterValuesInputRepresentation, array: 1, description: "Event parameter definitions with hierarchy and allowed values. Since v67.0."}

  RefreshSettingsInputRepresentation:
    description: Represents the refresh configuration input for creating or updating an activation platform.
    attributes:
      - {name: frequency, type: string, enum: [FourHours, TwelveHours, TwentyFourHours], description: "How often the activation platform refreshes. Since v67.0."}
      - {name: mode, type: string, enum: [Full, Incremental], description: "Refresh mode for the activation platform. Since v67.0."}
      - {name: periodic_full_refresh, api_name: periodicFullRefresh, type: string, enum: [Every30Days, Every60Days], description: "How often a periodic full refresh runs. Applies [with incremental refresh mode](https://developer.salesforce.com/docs/atlas.en-us.api_meta.meta/api_meta/meta_activationplatform.htm). Since v67.0."}
