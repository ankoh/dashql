title: Semantic Models
description: |
  A semantic model (SDM) is a named layer over existing DMOs, DLOs and calculated insights. It gives their columns business names and adds joins, formulas and metrics, so a query names fields and the engine writes the SQL. This family is separate from the Connect spec, and its [own guide](https://developer.salesforce.com/docs/data/semantic-layer/guide/get-started.md) calls it Tableau Semantics.

  Build in this order: the source objects must exist, then [`sdm_create`](#sdm_create), [`sdm_data_object_create`](#sdm_data_object_create) per object, [`sdm_relationship_create`](#sdm_relationship_create), [`sdm_calc_dim_create`](#sdm_calc_dim_create) and [`sdm_calc_measure_create`](#sdm_calc_measure_create), [`sdm_metric_create`](#sdm_metric_create), [`sdm_validate`](#sdm_validate), and [`sdm_query`](#sdm_query). [`sdm_create`](#sdm_create) can also take everything in one body.

  What matters most:

  - **Names.** Authoring and queries use semantic `api_name` values, not `__dlm` or `__c` names. If you send only a label, the server generates the name, so read it back.
  - **Formulas** are Tableau-style (the guide calls the dialect Tua), in `$$ ... $$`: `[Object].[Field]`, `IF ... END`. A measurement whose formula aggregates needs `aggregation_type => 'UserAgg'`.
  - **Queries.** Sources conflict on naming the model by ID or API name.
  - **Deletes.** Deleting a data object or relationship breaks what joins through it. Check each definition's `dependencies`.

  ```sql
  CALL cdp.sdm_create (api_name => 'AccountRevenue', label => 'Account Revenue', dataspace => 'default');
  CALL cdp.sdm_data_object_create (model_api_name_or_id => 'AccountRevenue', data_object_name => 'ssot__Account__dlm', data_object_type => 'Dmo', api_name => 'Account', label => 'Account', should_include_all_fields => true);
  CALL cdp.sdm_calc_measure_create (model_api_name_or_id => 'AccountRevenue', label => 'Total Revenue', api_name => 'Total_Revenue', data_type => 'Number', aggregation_type => 'UserAgg', expression => $$SUM([Account].[AnnualRevenue])$$);
  CALL cdp.sdm_validate (model_api_name_or_id => 'AccountRevenue');
  CALL cdp.sdm_query (semantic_model_api_name => 'AccountRevenue', structured_semantic_query => (fields = [(expression = (semantic_field = (name = 'Total_Revenue')), alias = 'revenue', semantic_aggregation_method = 'SEMANTIC_AGGREGATION_METHOD_USER_AGG')]));
  ```

functions:
  - name: sdm_list
    method: GET
    host: connect
    path: /ssot/semantic/models
    tools: [d360_sdm_list]
    description: List the semantic models in the org, optionally filtered by data space, label or API names. Use it to find a model's `api_name`.
    example: CALL cdp.sdm_list (dataspace => 'default', limit => 100, order_by => 'apiName ASC');
    options:
      - {name: dataspace, in: query, type: string, description: "Dataspace name"}
      - {name: app, in: query, type: string, description: "App filter"}
      - {name: category, in: query, type: string, description: "Category filter (Marketing, Commerce, Sales, Service, Other)"}
      - {name: label, in: query, type: string, description: "Label filter"}
      - {name: limit, in: query, type: integer, description: "Max number of results"}
      - {name: offset, in: query, type: integer, description: "Offset for pagination"}
      - {name: order_by, api_name: orderBy, in: query, type: string, description: "Sort clause. A [community fixture](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/test/fixtures/semantic/models.json) shows `api_name ASC`."}
      - {name: search_term, api_name: searchTerm, in: query, type: string, description: "Search term"}
      - {name: semantic_model_api_names, api_name: semanticModelApiNames, in: query, type: string, description: "Comma-separated semantic model api names"}
      - {name: source_creation, api_name: sourceCreation, in: query, type: string, description: "Source-creation filter. Sources disagree on the values, see [`sdm_create`](#sdm_create)."}
      - {name: source_creation_name, api_name: sourceCreationName, in: query, type: string, description: "Source-creation-name filter"}
    rows: /items
    columns:
      - {name: id, type: VARCHAR}
      - {name: api_name, api_name: apiName, type: VARCHAR, description: "Use this in the path of other calls."}
      - {name: label, type: VARCHAR}
      - {name: description, type: VARCHAR}
      - {name: dataspace, type: VARCHAR}
      - {name: app, type: VARCHAR}
      - {name: categories, type: JSON}
      - {name: last_modified_date, api_name: lastModifiedDate, type: TIMESTAMPTZ}
    paging: {kind: url, from: /nextPageUrl}
    effect: read
    unknown: warning
    evidence: S
    result_description: "One row per item of `/items` in the response. Other response fields go to `_meta`: `count`, `total`, `currentPageUrl`, `nextPageUrl`, `previousPageUrl`. The key is from [sf-pi](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/data-shapes.md), the other response fields from a [community fixture](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/test/fixtures/semantic/models.json) with no items, so the item columns come from the model schema and haven't been seen in a list response."
    notes: "**Paging:** `limit`, `offset`. The response has `next_page_url`, null on the last page (community)."

  - name: sdm_get
    method: GET
    host: connect
    path: /ssot/semantic/models/{id}
    tools: [d360_sdm_get]
    description: Read a whole model, with its data objects, relationships, calculated fields and metrics inline. Use it to read the generated API names and the `id` a query may need.
    example: CALL cdp.sdm_get (model_api_name_or_id => 'AccountRevenue', include_table_keys => true);
    options:
      - {name: model_api_name_or_id, api_name: id, in: path, type: string, required: true, description: "Model API name or ID"}
      - {name: abac_filtering_mode, api_name: abacFilteringMode, in: query, type: boolean, description: "ABAC filtering mode"}
      - {name: allow_unmapped, api_name: allowUnmapped, in: query, type: boolean, description: "Include unmapped definitions in the response."}
      - {name: field_name, api_name: fieldName, in: query, type: string, description: "Return only fields whose labels contain this text."}
      - {name: fine_grain_security, api_name: fineGrainSecurity, in: query, type: boolean, description: "Apply fine-grained security rules and return a partial model."}
      - {name: include_model_content, api_name: includeModelContent, in: query, type: boolean, description: "Add the model's full content to the response."}
      - {name: include_table_keys, api_name: includeTableKeys, in: query, type: boolean, description: "Add key qualifiers and primary key indicators."}
    columns:
      - {name: id, type: VARCHAR, description: "Record ID, prefix `2SM` in the official examples. `semantic_model_id` of [`sdm_query`](#sdm_query) takes this."}
      - {name: api_name, api_name: apiName, type: VARCHAR}
      - {name: label, type: VARCHAR}
      - {name: description, type: VARCHAR}
      - {name: dataspace, type: VARCHAR}
      - {name: app, type: VARCHAR}
      - {name: categories, type: JSON, description: "Marketing, Commerce, Sales, Service, Other."}
      - {name: currency, type: JSON, description: "Model default currency."}
      - {name: source_creation, api_name: sourceCreation, type: VARCHAR}
      - {name: source_creation_name, api_name: sourceCreationName, type: VARCHAR}
      - {name: version_state, api_name: versionState, type: VARCHAR, description: "`Draft`, `Published` or `PublishedWithDraft`."}
      - {name: is_locked, api_name: isLocked, type: BOOLEAN, description: "Locked for edit or delete."}
      - {name: locked_actions, api_name: lockedActions, type: JSON, description: "Maps an action such as `edit`, `delete` or `clone` to the reasons it is restricted."}
      - {name: is_upsertable, api_name: isUpsertable, type: BOOLEAN, description: "Whether the model can be edited. False when it contains non-queryable entities."}
      - {name: has_unmapped, api_name: hasUnmapped, type: BOOLEAN, description: "The model contains unmapped definitions."}
      - {name: is_partial_sdm, api_name: isPartialSdm, type: BOOLEAN, description: "The model is partial because of data governance."}
      - {name: agent_enabled, api_name: agentEnabled, type: BOOLEAN}
      - {name: business_preferences, api_name: businessPreferences, type: VARCHAR}
      - {name: semantic_model_info, api_name: semanticModelInfo, type: JSON, description: "`definitionsCount`, `maxDefinitionCount`, `modelHierarchyDepth`."}
      - {name: base_models, api_name: baseModels, type: JSON, description: "Models this one extends."}
      - {name: semantic_data_objects, api_name: semanticDataObjects, type: JSON}
      - {name: semantic_relationships, api_name: semanticRelationships, type: JSON}
      - {name: semantic_calculated_dimensions, api_name: semanticCalculatedDimensions, type: JSON}
      - {name: semantic_calculated_measurements, api_name: semanticCalculatedMeasurements, type: JSON}
      - {name: semantic_metrics, api_name: semanticMetrics, type: JSON}
      - {name: semantic_parameters, api_name: semanticParameters, type: JSON}
      - {name: semantic_logical_views, api_name: semanticLogicalViews, type: JSON}
      - {name: semantic_groupings, api_name: semanticGroupings, type: JSON}
      - {name: created_by, api_name: createdBy, type: VARCHAR}
      - {name: created_date, api_name: createdDate, type: TIMESTAMPTZ}
      - {name: last_modified_by, api_name: lastModifiedBy, type: VARCHAR}
      - {name: last_modified_date, api_name: lastModifiedDate, type: TIMESTAMPTZ}
    effect: read
    unknown: warning
    evidence: S
    result_description: One row. Other response fields go to `_meta`, including the `semantic...Url` links. Fields are from the official [model schema](https://developer.salesforce.com/docs/data/semantic-layer/guide/salesforce-semantic-model-schema.md).
    notes: "**Notes:** Option meanings are from the [v65 Semantics OpenAPI file](https://github.com/javrrr/tableau-semantics-sdk/blob/main/src/generated/sources/authoring.yaml), a copy of the published file in a community repo. `abac_filtering_mode` appears only in [the tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/SdmTools.java), with no explanation. A model holds a limited number of definitions: `semantic_model_info.maxDefinitionCount` is 5000 in the [official example](https://developer.salesforce.com/docs/data/semantic-layer/guide/connect-api-in-depth-examples.md)."

  - name: sdm_create
    method: POST
    host: connect
    path: /ssot/semantic/models
    tools: [d360_sdm_create]
    description: "Create a semantic model. The first step of every build: either an empty shell that later calls fill in, or the whole model in one call."
    example: CALL cdp.sdm_create (api_name => 'AccountRevenue', label => 'Account Revenue Model', description => 'Accounts and revenue', dataspace => 'default');
    options:
      - {name: api_name, api_name: apiName, in: body, type: string, required: true, description: "API name of the model."}
      - {name: label, in: body, type: string, required: true, description: "Display name."}
      - {name: dataspace, in: body, type: string, required: true, description: "Data space that holds the model."}
      - {name: description, in: body, type: string, description: "Free text."}
      - {name: app, in: body, type: string, description: "App the model belongs to."}
      - {name: categories, in: body, array: 1, type: string, description: "Marketing, Commerce, Sales, Service, Other."}
      - {name: currency, in: body, schema: SemanticModelCurrency, description: "Model default currency."}
      - {name: source_creation, api_name: sourceCreation, in: body, type: string, description: "Where the model came from. Sources disagree on the values, see Notes."}
      - {name: query_unrelated_data_objects, api_name: queryUnrelatedDataObjects, in: body, type: string, description: "What a query does across data objects with no relationship. Sources disagree on the name and the values, see Notes."}
      - {name: agent_enabled, api_name: agentEnabled, in: body, type: boolean, description: "Enable agent features for the model."}
      - {name: business_preferences, api_name: businessPreferences, in: body, type: string, description: "Business-specific preferences or context from analysts."}
      - {name: base_models, api_name: baseModels, in: body, type: any, description: "Models this one extends: `api_name`, `label`."}
      - {name: external_connections, api_name: externalConnections, in: body, type: any, description: "External connections of the model."}
      - {name: fields_overrides, api_name: fieldsOverrides, in: body, type: any, description: "Field overrides."}
      - {name: semantic_data_objects, api_name: semanticDataObjects, in: body, schema: SemanticDataObject, array: 1, description: "Data objects, for the one-call build."}
      - {name: semantic_relationships, api_name: semanticRelationships, in: body, schema: SemanticRelationship, array: 1, description: "Relationships, for the one-call build."}
      - {name: semantic_calculated_dimensions, api_name: semanticCalculatedDimensions, in: body, schema: SemanticCalculatedDimension, array: 1, description: "Calculated dimensions, for the one-call build."}
      - {name: semantic_calculated_measurements, api_name: semanticCalculatedMeasurements, in: body, schema: SemanticCalculatedMeasurement, array: 1, description: "Calculated measurements, for the one-call build."}
      - {name: semantic_metrics, api_name: semanticMetrics, in: body, schema: SemanticMetricDefinition, array: 1, description: "Metrics, for the one-call build."}
      - {name: semantic_parameters, api_name: semanticParameters, in: body, type: any, description: "Parameters that formulas and filters can reference. There is no separate function for these here."}
      - {name: semantic_logical_views, api_name: semanticLogicalViews, in: body, type: any, description: "Join, union or custom SQL views. There is no separate function for these here."}
      - {name: semantic_groupings, api_name: semanticGroupings, in: body, type: any, description: "Groupings. There is no separate function for these here."}
      - {name: allow_external_definitions, api_name: allowExternalDefinitions, in: query, type: boolean, description: "Flag to allow external definitions"}
      - {name: allow_unmapped, api_name: allowUnmapped, in: query, type: boolean, description: "Flag to allow unmapped fields"}
      - {name: inherit_dc_relationship, api_name: inheritDcRelationship, in: query, type: boolean, description: "Flag to inherit data cloud relationships"}
    columns:
      - {name: id, type: VARCHAR, description: "Record ID, prefix `2SM` in the official examples. `semantic_model_id` of [`sdm_query`](#sdm_query) takes this."}
      - {name: api_name, api_name: apiName, type: VARCHAR}
      - {name: label, type: VARCHAR}
      - {name: description, type: VARCHAR}
      - {name: dataspace, type: VARCHAR}
      - {name: app, type: VARCHAR}
      - {name: categories, type: JSON, description: "Marketing, Commerce, Sales, Service, Other."}
      - {name: currency, type: JSON, description: "Model default currency."}
      - {name: source_creation, api_name: sourceCreation, type: VARCHAR}
      - {name: source_creation_name, api_name: sourceCreationName, type: VARCHAR}
      - {name: version_state, api_name: versionState, type: VARCHAR, description: "`Draft`, `Published` or `PublishedWithDraft`."}
      - {name: is_locked, api_name: isLocked, type: BOOLEAN, description: "Locked for edit or delete."}
      - {name: locked_actions, api_name: lockedActions, type: JSON, description: "Maps an action such as `edit`, `delete` or `clone` to the reasons it is restricted."}
      - {name: is_upsertable, api_name: isUpsertable, type: BOOLEAN, description: "Whether the model can be edited. False when it contains non-queryable entities."}
      - {name: has_unmapped, api_name: hasUnmapped, type: BOOLEAN, description: "The model contains unmapped definitions."}
      - {name: is_partial_sdm, api_name: isPartialSdm, type: BOOLEAN, description: "The model is partial because of data governance."}
      - {name: agent_enabled, api_name: agentEnabled, type: BOOLEAN}
      - {name: business_preferences, api_name: businessPreferences, type: VARCHAR}
      - {name: semantic_model_info, api_name: semanticModelInfo, type: JSON, description: "`definitionsCount`, `maxDefinitionCount`, `modelHierarchyDepth`."}
      - {name: base_models, api_name: baseModels, type: JSON, description: "Models this one extends."}
      - {name: semantic_data_objects, api_name: semanticDataObjects, type: JSON}
      - {name: semantic_relationships, api_name: semanticRelationships, type: JSON}
      - {name: semantic_calculated_dimensions, api_name: semanticCalculatedDimensions, type: JSON}
      - {name: semantic_calculated_measurements, api_name: semanticCalculatedMeasurements, type: JSON}
      - {name: semantic_metrics, api_name: semanticMetrics, type: JSON}
      - {name: semantic_parameters, api_name: semanticParameters, type: JSON}
      - {name: semantic_logical_views, api_name: semanticLogicalViews, type: JSON}
      - {name: semantic_groupings, api_name: semanticGroupings, type: JSON}
      - {name: created_by, api_name: createdBy, type: VARCHAR}
      - {name: created_date, api_name: createdDate, type: TIMESTAMPTZ}
      - {name: last_modified_by, api_name: lastModifiedBy, type: VARCHAR}
      - {name: last_modified_date, api_name: lastModifiedDate, type: TIMESTAMPTZ}
    effect: write
    unknown: warning
    evidence: S
    result_description: One row. Other response fields go to `_meta`, including the `semantic...Url` links. Fields are from the official [model schema](https://developer.salesforce.com/docs/data/semantic-layer/guide/salesforce-semantic-model-schema.md).
    notes: |
      **Notes:** **Prerequisite.** All DMOs and calculated insights the model will use must already exist ([tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/SdmTools.java)).

      **One call or several.** [Salesforce's catalog](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/runtime/FamilyCatalog.java) says "Create empty model. Add objects separately", and [sf-pi](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/data-shapes.md) describes the same. The [official example](https://developer.salesforce.com/docs/data/semantic-layer/guide/connect-api-in-depth-examples.md) posts a whole model in one body. [A community tool](https://github.com/javrrr/afd360/blob/main/src/resources/semantic-model.ts) moved to the one-body form at v65 (one org). Its reason: a failure part way through several calls leaves a half-built shell, and posting the same `api_name` again gives a 409 (community).

      **Required body fields.** The tool's request class has only `api_name`, `label`, `description` and `dataspace`. The other body rows come from the [official examples](https://developer.salesforce.com/docs/data/semantic-layer/guide/connect-api-in-depth-examples.md) and the [v65 file](https://github.com/javrrr/tableau-semantics-sdk/blob/main/src/generated/sources/authoring.yaml). Omitting `dataspace` gives a 400, `missing a mandatory dataspace value` ([community, one org](https://github.com/javrrr/tableau-semantics-sdk/blob/main/src/resources/semantic-models.ts)).

      **Conflicting enums.** The v65 file gives `source_creation` as `Manual`, `Import` and `query_unrelated_data_objects` as `Allow`, `Disallow`. [One community SDK](https://github.com/javrrr/tableau-semantics-sdk/blob/main/src/resources/semantic-models.ts) found both rejected, and `DataCloud` and `Union` accepted (one org). The [entities page](https://developer.salesforce.com/docs/data/semantic-layer/guide/connect-api-in-depth-entities.md) names the second one `UnrelatedDataObjectsQueryBehavior`, with `Exception` and `Union`.

      **Imported relationships.** Relationships that already exist between Data 360 objects are [imported automatically](https://developer.salesforce.com/docs/data/semantic-layer/guide/query-api-in-depth-relationships.md) at creation. The sources don't explain how `inherit_dc_relationship` interacts with that.

      **Order.** In the several-call build, calculated fields follow the data objects because their formulas name data object fields ([community](https://github.com/javrrr/afd360/blob/main/src/resources/semantic-model.ts)).

