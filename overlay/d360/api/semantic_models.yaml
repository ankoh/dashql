  - name: sdm_data_object_create
    method: POST
    host: connect
    path: /ssot/semantic/models/{id}/data-objects
    tools: [d360_sdm_data_object_create]
    description: Add an existing DMO, DLO or calculated insight to a model. This is the second build step, and the source object must already exist.
    example: CALL cdp.sdm_data_object_create (model_api_name_or_id => 'AccountRevenue', data_object_name => 'ssot__Account__dlm', data_object_type => 'Dmo', api_name => 'Account', label => 'Account', should_include_all_fields => true);
    options:
      - {name: model_api_name_or_id, api_name: id, in: path, type: string, required: true, description: "Model API name or ID"}
      - {name: data_object_name, api_name: dataObjectName, in: body, type: string, required: true, description: "The source object, such as `Account__dlm`."}
      - {name: label, in: body, type: string, required: true, description: "Display name."}
      - {name: data_object_type, api_name: dataObjectType, in: body, type: string, required: true, description: "`Dmo`, `Dlo` or `Cio` (a calculated insight). Not `CalculatedInsight`."}
      - {name: should_include_all_fields, api_name: shouldIncludeAllFields, in: body, type: boolean, required: true, description: "True adds every source field as a dimension or measurement. The entities page and tool text require it, the request class marks it optional."}
      - {name: api_name, api_name: apiName, in: body, type: string, description: "Semantic name of the object. If omitted, the server generates one, see Notes."}
      - {name: description, in: body, type: string, description: "Free text."}
      - {name: table_type, api_name: tableType, in: body, type: string, description: "`Standard`, `Dimension` or `Fact`."}
      - {name: semantic_dimensions, api_name: semanticDimensions, in: body, schema: SemanticDimension, array: 1, description: "Fields to expose as dimensions, when not including all."}
      - {name: semantic_measurements, api_name: semanticMeasurements, in: body, schema: SemanticMeasurement, array: 1, description: "Fields to expose as measurements, when not including all."}
      - {name: filters, in: body, schema: SemanticFilter, array: 1, description: "Restrict the rows this object contributes."}
      - {name: filter_logic, api_name: filterLogic, in: body, type: string, description: "Combines `filters` by 1-based index, such as `1 AND 2`."}
      - {name: allow_unmapped, api_name: allowUnmapped, in: query, type: boolean, description: "Flag to allow unmapped fields"}
    columns:
      - {name: id, type: VARCHAR}
      - {name: api_name, api_name: apiName, type: VARCHAR, description: "Semantic name. Relationships, formulas and queries use this."}
      - {name: label, type: VARCHAR}
      - {name: description, type: VARCHAR}
      - {name: data_object_name, api_name: dataObjectName, type: VARCHAR, description: "The source object, such as `ssot__Account__dlm`."}
      - {name: data_object_type, api_name: dataObjectType, type: VARCHAR}
      - {name: should_include_all_fields, api_name: shouldIncludeAllFields, type: BOOLEAN}
      - {name: table_type, api_name: tableType, type: VARCHAR, description: "`Standard`, `Dimension` or `Fact`."}
      - {name: semantic_dimensions, api_name: semanticDimensions, type: JSON, description: "Items have the attributes of [SemanticDimension](#semanticdimension) plus `id` and audit fields."}
      - {name: semantic_measurements, api_name: semanticMeasurements, type: JSON, description: "Items have the attributes of [SemanticMeasurement](#semanticmeasurement) plus `id` and audit fields."}
      - {name: filters, type: JSON}
      - {name: filter_logic, api_name: filterLogic, type: VARCHAR}
      - {name: is_queryable, api_name: isQueryable, type: VARCHAR, description: "Whether the query engine can read it. `Queryable` or `NotQueryable` in the model schema, `NonQueryable` in the v65 file."}
      - {name: dependencies, type: JSON, description: "Other definitions and fields this one depends on: `dependentDefinitionApiName`, `dependentFieldApiName`."}
      - {name: created_by, api_name: createdBy, type: VARCHAR}
      - {name: created_date, api_name: createdDate, type: TIMESTAMPTZ}
      - {name: last_modified_by, api_name: lastModifiedBy, type: VARCHAR}
      - {name: last_modified_date, api_name: lastModifiedDate, type: TIMESTAMPTZ}
    effect: write
    unknown: warning
    evidence: S
    result_description: One row. Other response fields go to `_meta`. See the official [create example](https://developer.salesforce.com/docs/data/semantic-layer/guide/connect-api-in-depth-examples.md) and [model schema](https://developer.salesforce.com/docs/data/semantic-layer/guide/salesforce-semantic-model-schema.md).
    notes: |
      **Notes:** **Read the names back.** Later steps use the semantic names from the response, not `__dlm` or `__c` names. Without an `api_name` the server makes them up: the [official example](https://developer.salesforce.com/docs/data/semantic-layer/guide/connect-api-in-depth-examples.md) sends label `Name0601_do` and gets `Name0601_do19`, and a field labelled `name__c` becomes `name_c`. [sf-pi](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/data-shapes.md) sends `api_name` on this call. The tool's request class has only `data_object_name`, `label`, `data_object_type` and `should_include_all_fields`. The other rows come from the official examples and schema.

      **`data_object_type` spellings.** The [tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/SdmTools.java) and [query guide](https://developer.salesforce.com/docs/data/semantic-layer/guide/query-api-in-depth-data-objects.md) say `Dmo`, `Dlo`, `Cio`. The [official example](https://developer.salesforce.com/docs/data/semantic-layer/guide/connect-api-in-depth-examples.md) sends `DMO` and gets `Dmo` back. The [model schema](https://developer.salesforce.com/docs/data/semantic-layer/guide/salesforce-semantic-model-schema.md) lists only `Dlo` and `Query`.

      **Calculated insights.** An `Active` insight isn't usable until its first compute lands. Until then this returns `SEMANTIC_ENTITY_NOT_EXIST`, and a retry can take minutes ([community, one org](https://github.com/javrrr/afd360/blob/main/src/resources/semantic-model.ts)).

      **Other limits, all [community, one org](https://github.com/javrrr/afd360/blob/main/src/resources/semantic-model.ts).** A field `api_name` with a space gives a 500, not a 400. A `Currency` measure needs a dimension on `cdp_sys_record_currency__c` with `semantic_data_type => 'RecordCurrency'`. A filter on a raw column is rejected with `Invalid calculated Field`, and filters can't be changed after creation.

      **Path.** The [quick start](https://developer.salesforce.com/docs/data/semantic-layer/guide/quick-start-connect-api.md) shows `/tables/`. The examples and the tool use `/data-objects`.

