  - name: sdm_query
    method: POST
    host: connect
    path: /semantic-engine/gateway
    tools: [d360_sdm_query]
    description: Run a query against a semantic model. You name fields, filters and groupings, and the engine works out the joins and SQL, then returns rows. This is the read side of the family.
    example: |
