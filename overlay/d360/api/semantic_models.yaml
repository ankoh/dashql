    unknown: warning
    evidence: S
    result_description: One row. Other response fields go to `_meta`, including the `semantic...Url` links. Fields are from the official [model schema](https://developer.salesforce.com/docs/data/semantic-layer/guide/salesforce-semantic-model-schema.md).
    notes: "**Notes:** Model changes can affect semantic queries, dashboards and RAG retrievers ([sf-pi](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/registry/operations.json)). A locked model reports the reason in `locked_actions`. The [v65 file](https://github.com/javrrr/tableau-semantics-sdk/blob/main/src/generated/sources/authoring.yaml) also has `PUT` on this path, which replaces the whole model including relationships. No function here maps to it, and it can't create: on a missing `api_name` it returns 404 ([community, one org](https://github.com/javrrr/tableau-semantics-sdk/blob/main/src/resources/semantic-models.ts))."

  - name: sdm_delete
    method: DELETE
    host: connect
    path: /ssot/semantic/models/{id}
    tools: [d360_sdm_delete]
    description: Permanently delete a model and everything in it.
    example: CALL cdp.sdm_delete (model_api_name_or_id => 'AccountRevenue');
    options:
      - {name: model_api_name_or_id, api_name: id, in: path, type: string, required: true, description: "Model API name or ID"}
    effect: write
    unknown: warning
    evidence: S
    result_description: The [v65 file](https://github.com/javrrr/tableau-semantics-sdk/blob/main/src/generated/sources/authoring.yaml) gives HTTP 200 with no body, [sf-pi](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/data-shapes.md) gives 204. One row with only the standard columns.
    notes: |
      **Notes:** **What goes.** The data objects, relationships, calculated fields and metrics inside it ([catalog](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/runtime/FamilyCatalog.java)). It can't be undone ([v65 file](https://github.com/javrrr/tableau-semantics-sdk/blob/main/src/generated/sources/authoring.yaml)). Afterwards `sdm_get` returns `SEMANTIC_ENTITY_NOT_EXIST` ([sf-pi](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/data-shapes.md)).

      **What breaks.** Queries that name the model. [sf-pi](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/registry/operations.json) also lists dashboards and RAG retrievers as consumers of model metadata. Check `sdm_dependencies` first, and `is_locked` and `locked_actions` on `sdm_get`.

      **The other direction.** A model blocks deleting a calculated insight it references, with a 400 `DELETE_FAILED`. So delete the model first ([community, one org](https://github.com/javrrr/afd360/blob/main/src/resources/semantic-model.ts)).

