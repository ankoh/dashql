      - {name: definition_type, api_name: definitionType, in: body, type: string, enum: [CALCULATED_METRIC, EXTERNAL_METRIC, STREAMING_METRIC], description: "Definition type of the calculated insight. Required for POST. Optional for PATCH. Since v57.0."}
      - {name: description, in: body, type: string, description: "Calculated insight description. Since v57.0."}
      - {name: display_name, api_name: displayName, in: body, type: string, description: "Calculated insight display name. Required for POST. Optional for PATCH. **Available Version:*** 57.0"}
      - {name: draft, in: body, type: boolean, description: "Specifies whether to save the calculated insight as draft (`true`) or not (`false`). Since v57.0."}
      - {name: expression, in: body, type: string, description: "Calculated insight ANSI SQL expression. Required for POST. Optional for PATCH. Since v57.0."}
