      - {name: last_run_status, api_name: lastRunStatus, type: VARCHAR, description: "Last run status of the calculated insight. Since v57.0."}
      - {name: last_run_status_date_time, api_name: lastRunStatusDateTime, type: VARCHAR, description: "Last run status date and time of the calculated insight. Since v57.0."}
      - {name: last_run_status_error_code, api_name: lastRunStatusErrorCode, type: VARCHAR, description: "Last run status error code of the calculated insight. Since v57.0."}
      - {name: measures, type: JSON, array: 1, schema: CdpCalculatedInsightMeasureRepresentation, description: "Measures of the calculated insight. Since v57.0."}
      - {name: publish_schedule_end_date, api_name: publishScheduleEndDate, type: JSON, description: "Not in the spec schema: from the spec's examples."}
      - {name: publish_schedule_interval, api_name: publishScheduleInterval, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
      - {name: publish_schedule_start_date_time, api_name: publishScheduleStartDateTime, type: JSON, description: "Not in the spec schema: from the spec's examples."}
    paging: {kind: token, from: {body: /collection/nextPageToken}, option: page_token}
    effect: read
    evidence: O
    result_description: One row per item of `/collection/items` in the response. Schema `CdpCalculatedInsightRepresentation`.
    notes: |
      **Paging:** `page_token`, taken from `collection.nextPageToken`, which is null on the last page. `offset` is still required.

      **Notes:** - Without `definition_type` the list returned 0 items although insights existed, so one project [calls once per type](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md) (community, one org). The spec doesn't mention this.
      - The spec requires `offset`, while the [tool source](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/CalculatedInsightTools.java) treats it as optional. A community project [found it still required](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md) alongside `page_token`. Pass `0`.
      - Items are under `collection.items`, each with the full definition including `expression`, `dimensions` and `measures`. You don't need a `ci_get` per item.
      - Field data types are only in [`metadata`](profiles_and_metadata.md#metadata) with `entity_type => 'CalculatedInsight'` ([community](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md)).
      - Spelling varies: the filter is `dataspace`, the response field `dataSpace`, the create option `dataspace_name`.

  - name: ci_get
    method: GET
    host: connect
    path: /ssot/calculated-insights/{apiName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Calculated-Insights/paths/~1ssot~1calculated-insights~1%7BapiName%7D/get
    tools: [d360_ci_get]
    description: Get a calculated insight in Data 360. Since v57.0.
    example: CALL cdp.ci_get (api_name => 'Customer_Order_Summary__cio');
    options:
      - {name: api_name, api_name: apiName, in: path, type: string, required: true, description: "API name of the insight, ending in `__cio`."}
    columns:
      - {name: api_name, api_name: apiName, type: VARCHAR, description: "API name of the calculated insight. Since v57.0."}
      - {name: calculated_insight_status, api_name: calculatedInsightStatus, type: VARCHAR, description: "Status of the calculated insight. Since v57.0."}
      - {name: creation_type, api_name: creationType, type: VARCHAR, description: "Creation type of the calculated insight. Since v57.0."}
      - {name: dataspace, api_name: dataSpace, type: VARCHAR, description: "Data space of the calculated insight. Since v57.0."}
      - {name: definition_status, api_name: definitionStatus, type: VARCHAR, description: "Definition status of the calculated insight. Since v57.0."}
      - {name: definition_type, api_name: definitionType, type: VARCHAR, description: "Definition type of the calculated insight. Since v57.0."}
      - {name: description, type: VARCHAR, description: "Description of the calculated insight. Since v57.0."}
      - {name: dimensions, type: JSON, array: 1, schema: CdpCalculatedInsightDimensionRepresentation, description: "Dimensions of the calculated insight. Since v57.0."}
      - {name: display_name, api_name: displayName, type: VARCHAR, description: "Display name of the calculated insight. Since v57.0."}
      - {name: expression, type: VARCHAR, description: "Expression of the calculated insight. Since v57.0."}
      - {name: is_enabled, api_name: isEnabled, type: BOOLEAN, description: "Specifies whether the calculated insight is enabled (`true`) or not (`false`). Since v57.0."}
      - {name: last_calc_insight_status_date_time, api_name: lastCalcInsightStatusDateTime, type: VARCHAR, description: "Last calculated insight status date and time. Since v57.0."}
      - {name: last_calc_insight_status_error_code, api_name: lastCalcInsightStatusErrorCode, type: VARCHAR, description: "Last calculated insight status error code. Since v57.0."}
      - {name: last_run_date_time, api_name: lastRunDateTime, type: VARCHAR, description: "Last run date and time of the calculated insight. Since v57.0."}
      - {name: last_run_status, api_name: lastRunStatus, type: VARCHAR, description: "Last run status of the calculated insight. Since v57.0."}
      - {name: last_run_status_date_time, api_name: lastRunStatusDateTime, type: VARCHAR, description: "Last run status date and time of the calculated insight. Since v57.0."}
      - {name: last_run_status_error_code, api_name: lastRunStatusErrorCode, type: VARCHAR, description: "Last run status error code of the calculated insight. Since v57.0."}
      - {name: measures, type: JSON, array: 1, schema: CdpCalculatedInsightMeasureRepresentation, description: "Measures of the calculated insight. Since v57.0."}
      - {name: publish_schedule_end_date, api_name: publishScheduleEndDate, type: JSON, description: "Not in the spec schema: from the spec's examples."}
      - {name: publish_schedule_interval, api_name: publishScheduleInterval, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
      - {name: publish_schedule_start_date_time, api_name: publishScheduleStartDateTime, type: JSON, description: "Not in the spec schema: from the spec's examples."}
    effect: read
    evidence: O
    result_description: One row. Schema `CdpCalculatedInsightRepresentation`.
    notes: |
      **Notes:** The two statuses answer different questions:

      - `calculated_insight_status` says whether the definition is usable. Values seen: `PROCESSING`, `ACTIVE`, `DELETING` ([sf-pi](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/data-shapes.md)), and `FAILED` when the SQL doesn't compile ([community](https://github.com/javrrr/afd360/blob/main/src/resources/calculated-insight.ts)). The spec lists no values. [Segments need `ACTIVE`](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/SegmentTools.java).
      - `last_run_status` says how the last run went. Values: `PENDING`, `PROCESSING`, `SUCCESS`, `FAILED` ([kit](https://github.com/salesforce-misc/Data360AgentforceSolutionKitRetail/blob/main/.claude/skills/refresh-data-cloud-components/SKILL.md), one org), and null before the first run (spec example). The kit warns that Title Case comparisons never match in that org.

      Also:

      - `ACTIVE` doesn't mean data exists. A semantic model created on a just-`ACTIVE` insight failed with `SEMANTIC_ENTITY_NOT_EXIST` until the first compute finished ([community](https://github.com/javrrr/afd360/blob/main/src/client/retry.ts)).
      - `last_calc_insight_status_error_code` holds the reason for a `FAILED` definition ([community](https://github.com/javrrr/afd360/blob/main/src/resources/calculated-insight.ts)).
      - A name without the suffix fails with [`api_name must end in __cio`](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/troubleshooting.md).
      - The spec's schema has no schedule fields, yet its list example returns `publish_schedule_interval`, `publish_schedule_start_date_time` and `publish_schedule_end_date`. There the interval reads `SIX` or `NOT_SCHEDULED`, not the input spelling. The same example shows `definition_status` = `IN_USE` and `creation_type` = `Custom`.

  - name: ci_update
    method: PATCH
    host: connect
    path: /ssot/calculated-insights/{apiName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Calculated-Insights/paths/~1ssot~1calculated-insights~1%7BapiName%7D/patch
    tools: [d360_ci_update]
    description: Update a calculated insight in Data 360. Since v57.0. **Root XML tag:** `<cdpCalculatedInsightInput>`
    example: |
      CALL cdp.ci_update (
          api_name => 'Customer_Order_Summary__cio',
          description => 'Total order amount per customer, refreshed twice a day.',
          publish_schedule_interval => 'Twelve',
          publish_schedule_start_date_time => '2027-01-01T06:00'
      );
    options:
      - {name: api_name, api_name: apiName, in: path, type: string, required: true, description: "API name of the insight, ending in `__cio`."}
      - {name: body_api_name, api_name: apiName, in: body, type: string, description: "API name of the calculated insight with suffix __cio. Required for POST. Optional for PATCH. Since v57.0."}
      - {name: created_from_package, api_name: createdFromPackage, in: body, type: boolean, description: "Specifies whether the calculated insight was created from an installed package (`true`) or not (`false`). Since v57.0."}
