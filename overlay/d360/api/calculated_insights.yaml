      - {name: publish_schedule_interval, api_name: publishScheduleInterval, in: body, type: string, enum: [ExternallyManaged, NotScheduled, One, Six, Streaming, SystemManaged, Twelve, TwentyFour], required: true, description: "Indicates how frequently the calculated insight is processed. Required for calculated insights. Don't use with streaming insights. Since v62.0."}
      - {name: publish_schedule_start_date_time, api_name: publishScheduleStartDateTime, in: body, type: string, required: true, description: "The date and time when the calculated insight is evaluated to be run. - Use the format `yyyy-mm-dd`. - The specified date and time must be in the future. - Required if `publish_schedule_interval` is any value other than `No Schedule`. - Don't use with streaming insights. Since v62.0."}
      - {name: history_publish_schedule_interval, api_name: historyPublishScheduleInterval, in: body, type: string, description: "Not in the spec schema: from the MCP server's request class."}
      - {name: history_publish_time, api_name: historyPublishTime, in: body, type: string, description: "Not in the spec schema: from the MCP server's request class."}
      - {name: source_developer_name, api_name: sourceDeveloperName, in: body, type: string, description: "Not in the spec schema: from the MCP server's request class."}
    columns:
      - {name: api_name, api_name: apiName, type: VARCHAR, description: "API name of the calculated insight. Since v57.0."}
      - {name: calculated_insight_status, api_name: calculatedInsightStatus, type: VARCHAR, description: "Status of the calculated insight. Since v57.0."}
      - {name: creation_type, api_name: creationType, type: VARCHAR, description: "Creation type of the calculated insight. Since v57.0."}
      - {name: dataspace, api_name: dataSpace, type: VARCHAR, description: "Data space of the calculated insight. Since v57.0."}
      - {name: definition_status, api_name: definitionStatus, type: VARCHAR, description: "Definition status of the calculated insight. Since v57.0."}
      - {name: definition_type, api_name: definitionType, type: VARCHAR, description: "Definition type of the calculated insight. Since v57.0."}
      - {name: description, type: VARCHAR, description: "Description of the calculated insight. Since v57.0."}
      - {name: dimensions, type: JSON, array: 1, schema: CdpCalculatedInsightDimensionRepresentation, description: "Dimensions of the calculated insight. Since v57.0."}
      - {name: display_name, api_name: displayName, type: VARCHAR, description: "Display name of the calculated insight. Since v57.0."}
      - {name: expression, type: VARCHAR, description: "Expression of the calculated insight. Since v57.0."}
      - {name: is_enabled, api_name: isEnabled, type: BOOLEAN, description: "Specifies whether the calculated insight is enabled (`true`) or not (`false`). Since v57.0."}
      - {name: last_calc_insight_status_date_time, api_name: lastCalcInsightStatusDateTime, type: VARCHAR, description: "Last calculated insight status date and time. Since v57.0."}
      - {name: last_calc_insight_status_error_code, api_name: lastCalcInsightStatusErrorCode, type: VARCHAR, description: "Last calculated insight status error code. Since v57.0."}
      - {name: last_run_date_time, api_name: lastRunDateTime, type: VARCHAR, description: "Last run date and time of the calculated insight. Since v57.0."}
      - {name: last_run_status, api_name: lastRunStatus, type: VARCHAR, description: "Last run status of the calculated insight. Since v57.0."}
      - {name: last_run_status_date_time, api_name: lastRunStatusDateTime, type: VARCHAR, description: "Last run status date and time of the calculated insight. Since v57.0."}
      - {name: last_run_status_error_code, api_name: lastRunStatusErrorCode, type: VARCHAR, description: "Last run status error code of the calculated insight. Since v57.0."}
      - {name: measures, type: JSON, array: 1, schema: CdpCalculatedInsightMeasureRepresentation, description: "Measures of the calculated insight. Since v57.0."}
      - {name: publish_schedule_end_date, api_name: publishScheduleEndDate, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
      - {name: publish_schedule_interval, api_name: publishScheduleInterval, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
      - {name: publish_schedule_start_date_time, api_name: publishScheduleStartDateTime, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
    effect: write
    evidence: O
    result_description: One row. Schema `CdpCalculatedInsightRepresentation`.
    notes: |
      **Notes:** Expression, name and schedule rules are the same as for [`ci_create`](#ci_create).

      - The catalog says an update ["triggers recompilation"](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/runtime/FamilyCatalog.java). No source gives a duration or status sequence.
      - The spec shares one input schema with create, so it marks `publish_schedule_interval` and `publish_schedule_start_date_time` as required here. The [tool source](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/CalculatedInsightTools.java) calls PATCH partial ("Only include fields you want to change"), and its [request class](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/model/request/calculatedinsight/CalculatedInsightUpdateRequest.java) makes every field optional.
      - `body_api_name` is the `api_name` body field. No source says whether changing it renames the insight.
      - [afd360](https://github.com/javrrr/afd360/blob/main/src/resources/calculated-insight.ts) doesn't use PATCH and deletes and recreates on any change, because `expression` and `definition_type` are coupled (community).

  - name: ci_create
    method: POST
    host: connect
    path: /ssot/calculated-insights
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Calculated-Insights/paths/~1ssot~1calculated-insights/post
    tools: [d360_ci_create]
    description: Create a calculated insight in Data 360. Since v57.0. **Root XML tag:** `<cdpCalculatedInsightInput>`
    example: |
      CALL cdp.ci_create (
          api_name => 'Customer_Order_Summary__cio',
          display_name => 'Customer Order Summary',
          description => 'Total order amount per customer.',
          definition_type => 'CALCULATED_METRIC',
          dataspace_name => 'default',
          publish_schedule_interval => 'Six',
          publish_schedule_start_date_time => '2027-01-01T06:00',
          expression => $$
              SELECT Order__dlm.CustomerId__c AS customer_id__c, SUM(Order__dlm.Total__c) AS total__c
              FROM Order__dlm
              GROUP BY Order__dlm.CustomerId__c
          $$
