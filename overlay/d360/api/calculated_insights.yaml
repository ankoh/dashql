    path: /ssot/calculated-insights
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Calculated-Insights/paths/~1ssot~1calculated-insights/get
    tools: [d360_ci_list]
    description: Get calculated insights in Data 360. Since v57.0.
    example: CALL cdp.ci_list (offset => 0, definition_type => 'CALCULATED_METRIC', batch_size => 100);
    options:
      - {name: batch_size, api_name: batchSize, in: query, type: integer, description: "Number of items to return. Values are from `1` through `200`. If unspecified, the default value is `25`. Since v57.0."}
      - {name: dataspace, in: query, type: string, description: "Name of the data space. Since v57.0."}
      - {name: definition_type, api_name: definitionType, in: query, type: string, description: "Definition type of the calculated insight. Values are: - `CALCULATED_METRIC` - `EXTERNAL_METRIC` - `STREAMING_METRIC` Since v57.0."}
      - {name: offset, in: query, type: integer, required: true, description: "Number of rows to skip before returning results. If unspecified, no rows are skipped. Since v57.0."}
