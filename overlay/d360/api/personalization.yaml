  - name: p13n_experience_config_create
    method: POST
    host: connect
    path: /personalization/external-apps/{id}/personalization-experience-configs
    tools: [d360_p13n_experience_config_create]
    description: "Creates an experience config on a data connector: what content to show (`data_provider`), where to show it (`source_matchers`) and how to render it (`transformation_config`). The connector, transformer and point must exist."
    example: |
      CALL cdp.p13n_experience_config_create (
          id_or_app_source_id_or_name => 'my_website_connector',
          name => 'homepage_hero_banner',
          label => 'Homepage Hero Banner Personalization',
          is_enabled => true,
          data_provider => (
              type = 'PersonalizationPoint',
              reference_type = 'ApiName',
              value = 'hero_banner_recommendations',
              dataspace_reference_type = 'ApiName',
              dataspace_value = 'default',
              group_by_type = 'DataGraph',
              group_by_reference_type = 'ApiName',
              group_by_value = 'user_profile_graph'
          ),
          source_matchers => [(type = 'PageUrlMatcher', value = '/home'), (type = 'ContentZone', value = 'hero_section')],
          transformation_config => (
              render_if_empty = false,
              when = 'Immediately',
              method = 'ReplaceContentZoneContent',
              engagement_destination = 'banner_click_destination',
              transformations = [(
                  transformer_name = 'promo_banner_transformer',
                  substitutions = (bannerTitle = '{{data.title}}', bannerImage = '{{data.image}}', ctaText = 'Learn More')
              )]
          ),
          display_url => '/home'
      );
    options:
      - {name: id_or_app_source_id_or_name, api_name: id, in: path, type: string, required: true, description: "Unique id, appSourceId or name of Streaming App Data Connector"}
      - {name: name, in: body, type: string, description: "Unique name of the config. Other calls address it by this name through `name_param`."}
      - {name: label, in: body, type: string, description: "-"}
      - {name: description, in: body, type: string, description: "-"}
      - {name: data_provider, api_name: dataProvider, in: body, schema: PersonalizationDataProvider, description: "What is supplying the data for this experience."}
      - {name: source_matchers, api_name: sourceMatchers, in: body, schema: PersonalizationSourceMatcher, array: 1, description: "How to find where this personalization occurs. For web, which pages."}
      - {name: transformation_config, api_name: transformationConfig, in: body, schema: PersonalizationTransformationConfig, description: "How the provider's data is transformed and when."}
      - {name: is_enabled, api_name: isEnabled, in: body, type: boolean, description: "Whether this configuration is enabled."}
      - {name: display_url, api_name: displayUrl, in: body, type: string, description: "When editing this configuration on the website, which page to display it on if not the current page."}
      - {name: disable_related_experiences, api_name: disableRelatedExperiences, in: query, type: boolean, description: "Disable other experiences in the same content zone (default false)"}
    effect: write
    unknown: warning
    evidence: S
    result_description: The public sources don't document this response. One row, with the response in `_raw`.
    notes: |
      **Notes:** No source says which attributes the server enforces, so none is marked required. The [tool text](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/PersonalizationTools.java) names `name`, `label`, `data_provider`, `source_matchers` and `transformation_config`. The [request class](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/model/request/personalization/PersonalizationExperienceConfigInputRepresentation.java) also has `id`, `published_date`, `created_by_id`, `created_date`, `last_modified_by_id` and `last_modified_date`, marked read-only and ignored on input, so they aren't options.

      The [payload example](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/resources/metadata/payload-examples.json) mixes a URL matcher and a content zone in one `source_matchers` list, and no source says whether they combine as AND or OR. It also writes substitution values as `{{data.title}}`, while the transformer example uses `{{recommendation.title}}`, and no source defines either root. Web content zones are defined in the [Interactions SDK Sitemap](https://developer.salesforce.com/docs/marketing/einstein-personalization/guide/set-up-content-zones.md).

