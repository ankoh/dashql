    notes: "**Notes:** The [low-code mobile guide](https://developer.salesforce.com/docs/marketing/einstein-personalization/guide/personalize-mobile-experiences-lowcode.md) says live previews need a custom URL schema configured in the app. [sf-pi](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/registry/overrides.json) requires confirmation for this call until it's verified as ephemeral."

