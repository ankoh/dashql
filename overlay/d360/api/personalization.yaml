    options:
      - {name: id_or_name, api_name: idOrName, in: path, type: string, required: true, description: "Unique id or name of Personalization Point to update"}
      - {name: name, in: body, type: string, required: true, description: "API name. It can't change after creation, but the payload example still sends it."}
      - {name: label, in: body, type: string, required: true, description: "-"}
      - {name: description, in: body, type: string, description: "-"}
      - {name: dataspace_name, api_name: dataSpaceName, in: body, type: string, required: true, description: "API name of the data space."}
      - {name: profile_data_graph_name, api_name: profileDataGraphName, in: body, type: string, required: true, description: "Profile data graph the point targets. It must exist."}
      - {name: source, in: body, type: string, enum: [BlockBuilder, ExperienceBuilder, FlowBuilder, PersonalizationApp], required: true, description: "Where the point is defined: Email Builder blocks, Digital Experiences, Flow decisions or the Personalization app."}
      - {name: is_authentication_required, api_name: isAuthenticationRequired, in: body, type: boolean, required: true, description: "Whether API calls require user authentication."}
      - {name: schema_name, api_name: schemaName, in: body, type: string, description: "A custom schema. Use `schema_enum` for a standard one."}
      - {name: schema_enum, api_name: schemaEnum, in: body, type: string, enum: [DecisionDefined, ExperienceVariation, FlowPath], description: "A standard schema, in place of `schema_name`."}
      - {name: max_items_count, api_name: maxItemsCount, in: body, type: integer, description: "The maximum number of items for this point."}
      - {name: decisions, in: body, schema: PersonalizationDecision, array: 1, required: true, description: "Prioritized rules with criteria and attribute values."}
    effect: write
    unknown: warning
    evidence: S
    result_description: The public sources don't document this response. One row, with the response in `_raw`.
    notes: "**Notes:** The [tool text](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/PersonalizationTools.java) says changes take effect immediately for runtime execution, while the [Point DMO](https://developer.salesforce.com/docs/data/data-cloud-dmo-mapping/guide/c360dm-si-personalizationpointdmo-dmo.md) describes a status for pipeline processing. No source connects the two, so read `p13n_point_get.status` afterwards. See [`p13n_point_create`](#p13n_point_create) for where the attributes come from and for the decision order conflict."

  - name: p13n_point_delete
    method: DELETE
    host: connect
    path: /personalization/personalization-points/{idOrName}
    tools: [d360_p13n_point_delete]
    description: Deletes a point, which immediately stops personalization at that point in experience or flow execution. References from experiments or batch decisions break, and this can't be undone.
    example: CALL cdp.p13n_point_delete (id_or_name => 'home_page_experience');
    options:
      - {name: id_or_name, api_name: idOrName, in: path, type: string, required: true, description: "Unique id or name of Personalization Point to delete"}
    effect: write
    unknown: warning
    evidence: S
    result_description: The public sources don't document this response. One row, with the response in `_raw`.
    notes: "**Notes:** Experience configs that use the point can be found with [`p13n_experience_config_list`](#p13n_experience_config_list) and `personalization_point_name_or_id`, once per connector. The [MCP tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/PersonalizationTools.java) drops the HTTP response and returns its own `status` JSON, so that shape isn't the API's."

schemas:
