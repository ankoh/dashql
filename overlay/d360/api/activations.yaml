    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Activations/paths/~1ssot~1activations~1%7BactivationId%7D~1data/get
    description: Query activation data. Get a list of all activation records from Audience data model objects (DMOs). Since v61.0.
    example: CALL cdp.activation_record_list ("X-Chatter-Entity-Encoding" => 'false', activation_id => '85RVF000000CEf72AG', filters => 'delta_type__c in ''A''', batch_size => 1000);
    options:
      - {name: X-Chatter-Entity-Encoding, in: header, type: string, required: true, description: "Required. Value must be `false`."}
      - {name: activation_id, api_name: activationId, in: path, type: string, required: true, description: "Spec: the ID or developer name. A community live test got 400 or 404 for names, so use the ID ([quirk T1](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md), one org)."}
      - {name: batch_size, api_name: batchSize, in: query, type: integer, description: "Number of results to return. Values are from `1` through `4999`. If unspecified, the default value is `10000`. Since v61.0."}
      - {name: filters, in: query, type: string, description: "Filter the result set to a more narrow scope or specific type. This filter is supported: - `delta_type__c` (field name: delta_type; type: string; description: delta type of activation records) **Example request with filter:** - GET `https://{dne_cdpInstanceUrl}/services/data/v61.0/ssot/activations/{activationId}/data?filters = delta_type__c in 'A'` Since v61.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. Must be greater than or equal to `0`. If unspecified, no rows are skipped. Maximum value is 10 million. Since v61.0."}
    rows: /data
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: activated_entity_fqk, api_name: activatedEntityFqk, type: VARCHAR, description: "Fully Qualified Key (FQK) of the activated entity. Since v61.0."}
      - {name: activated_on_id, api_name: activatedOnId, type: VARCHAR, description: "ActivateOn entity ID, such as Individual.Id or Unified Individual.Id. Since v61.0."}
      - {name: activation_record, api_name: activationRecord, type: VARCHAR, description: "Activated attributes payload as JSON BLOB Since v61.0."}
      - {name: delta_type, api_name: deltaType, type: VARCHAR, description: "Activation delta type Since v61.0."}
      - {name: publish_date, api_name: publishDate, type: VARCHAR, description: "Date that the activation was published. Since v61.0."}
      - {name: segment_id, api_name: segmentId, type: VARCHAR, description: "Unique ID for each segment. Since v61.0."}
      - {name: segment_on_id, api_name: segmentOnId, type: VARCHAR, description: "Key identifier based on the SegmentOn entity. Same as Activated-entity-id when ActivateOn = SegmentOn. Since v61.0."}
      - {name: segmented_entity_fqk, api_name: segmentedEntityFqk, type: VARCHAR, description: "Fully Qualified Key of the segmented entity. Since v61.0."}
    paging: {kind: offset, option: offset, size: batch_size, start: 0}
    effect: read
    evidence: O
    result_description: "One row per item of `/data` in the response. Other response fields go to `_meta`: `batchSize`, `offset`. Schema `ActivationDataRepresentation`."
    notes: |
      **Paging:** `batch_size`, `offset`.

      **Notes:** The spec says `batch_size` runs from 1 to 4999 but defaults to 10000, so set it. `activation_record` is a JSON string. `id` isn't a row key: in the sample every row repeats the activation's ID. `activated_on_id` differs per row.

      The only documented `delta_type` value is `A`, in the samples. The [removed official skill](https://github.com/forcedotcom/sf-skills/blob/2476476dda1b671762c6e963b9d10c4a7056f1c4/skills/data360-activate/SKILL.md) uses this call to verify delivery setup.

  - name: activation_history_list
    method: GET
    host: connect
    path: /ssot/activations/{activationId}/history
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Activations/paths/~1ssot~1activations~1%7BactivationId%7D~1history/get
    description: Returns a paginated list of publish-history records. With a market segment activation ID, returns the history for that single activation. With a market segment ID, returns the history for all activations under that segment. Routing is determined automatically based on the record ID. For paginated results, set `offset` to `0` in the initial request, then follow the `next_page_url` value in each response to retrieve subsequent pages. Since v67.0.
    example: CALL cdp.activation_history_list (activation_id => '1sgVF000000LfbFYAS', limit => 50);
    options:
      - {name: activation_id, api_name: activationId, in: path, type: string, required: true, description: "Record ID (15- or 18-character) of a market segment activation or a market segment. Routing to single-activation or segment-wide history is determined automatically based on the record ID. Since v67.0."}
      - {name: limit, in: query, type: integer, description: "Maximum number of history records to return. Values are `1` through `200`. If unspecified, the default value is `20`. Since v67.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. If unspecified, no rows are skipped. Since v67.0."}
      - {name: order_by, api_name: orderBy, in: query, type: string, description: "Sort expression. If unspecified, the default value is `publishEndTime desc`. Since v67.0."}
      - {name: page_token, api_name: pageToken, in: query, type: string, description: "Snapshot anchor for consistent pagination. Omit this value on the first request. The response's `next_page_url` includes the `page_token` for subsequent pages, which keeps the result set stable as new activations are published. Follow `next_page_url` rather than constructing this value. Since v67.0."}
    columns:
      - {name: current_page_url, api_name: currentPageUrl, type: VARCHAR, description: "URL of the current page request, suitable for re-fetching the same page. Since v67.0."}
      - {name: next_page_url, api_name: nextPageUrl, type: VARCHAR, description: "URL of the next page when more records are available. Absent on the last page. Since v67.0."}
      - {name: records, type: JSON, array: 1, schema: ActivationHistoryRecordRepresentation, description: "Publish-history records in the page. Most-recent-first by default. Since v67.0."}
      - {name: total_pages, api_name: totalPages, type: BIGINT, description: "Total number of pages available for the query at the current page size. A next page exists while the current page index, derived from offset and limit, is below this value. Since v67.0."}
      - {name: total_size, api_name: totalSize, type: BIGINT, description: "Number of publish-history records returned in the page. Because a grand total record count isn't returned, this value reflects the current page only. Use `total_pages` for the full pagination extent, and follow `next_page_url` to page through results. Since v67.0."}
    paging: {kind: url, from: /nextPageUrl}
    effect: read
    evidence: O
    result_description: One row. Schema `ActivationHistoryCollectionRepresentation`.
    notes: |
      **Paging:** Follow `next_page_url`, which carries `page_token`, until it's absent. Start with `offset` 0.

      **Notes:** `activation_id` can also be a segment ID (`1sg...`), which returns the history of every activation on that segment. `records[].publishStatus` is `Created`, `Pending`, `Queued`, `Started`, `Running`, `Restarting`, `PartnerProcessing`, `Completed`, `Error`, `PartnerError`, `SegmentError` or `Skipped`, which differs from `last_publish_status`. `publishType` is `Manual` or `Scheduled`. Each record also has population counts and error fields.

      `total_size` counts the current page only. The spec's sample `next_page_url` spells the page size `page_size`, while the option is `limit`, which is one more reason not to build the URL yourself.

