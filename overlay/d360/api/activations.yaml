    method: POST
    host: connect
    path: /ssot/activations/actions/{activationId}/enable
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Activations/paths/~1ssot~1activations~1actions~1%7BactivationId%7D~1enable/post
    description: Enables a market segment activation. Since v67.0.
    example: CALL cdp.activation_enable (activation_id => '85RVF000000CEf72AG');
    options:
      - {name: activation_id, api_name: activationId, in: path, type: string, required: true, description: "Record ID (18-character) of the activation to enable. Since v67.0."}
      - {name: dataspace, api_name: dataSpace, in: query, type: string, description: "Name of the data space to use as context for the request. Since v67.0."}
    columns:
      - {name: message, type: VARCHAR, description: "Human-readable status or warning message. Can be null on success. Since v67.0."}
      - {name: success, type: BOOLEAN, description: "Indicates whether the action completed successfully (`true`) or not (`false`). Since v67.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `ActionResultRepresentation`.
    notes: "**Notes:** The spec describes this for market segment activations and doesn't cover DMO activations."

  - name: activation_full_refresh_run
    method: POST
    host: connect
    path: /ssot/activations/actions/{activationId}/full-refresh
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Activations/paths/~1ssot~1activations~1actions~1%7BactivationId%7D~1full-refresh/post
    description: Triggers a full-refresh publish for an activation. Since v67.0.
    example: CALL cdp.activation_full_refresh_run (activation_id => '85RVF000000CEf72AG');
    options:
      - {name: activation_id, api_name: activationId, in: path, type: string, required: true, description: "Record ID (15- or 18-character) of the market segment activation. Since v67.0."}
    columns:
      - {name: message, type: VARCHAR, description: "Human-readable status or warning message. Can be null on success. Since v67.0."}
      - {name: success, type: BOOLEAN, description: "Indicates whether the action completed successfully (`true`) or not (`false`). Since v67.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `ActionResultRepresentation`.
    notes: |
      **Done when:** The spec documents no status for this call. `activation_get.last_publish_status` and `activation_history_list` are the available signals.

      **Notes:** For market segment activations. DMO activations use `activation_publish` with `full_refresh`. `success` is about the action; the spec gives no job ID.

  - name: activation_sync_retry
    method: POST
    host: connect
    path: /ssot/activations/actions/{activationId}/retry-sync
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Activations/paths/~1ssot~1activations~1actions~1%7BactivationId%7D~1retry-sync/post
    description: Retries the sync for an activation. Since v67.0.
    example: CALL cdp.activation_sync_retry (activation_id => '85RVF000000CEf72AG');
    options:
      - {name: activation_id, api_name: activationId, in: path, type: string, required: true, description: "Record ID (15- or 18-character) of the market segment activation. Since v67.0."}
    columns:
      - {name: message, type: VARCHAR, description: "Human-readable status or warning message. Can be null on success. Since v67.0."}
      - {name: success, type: BOOLEAN, description: "Indicates whether the action completed successfully (`true`) or not (`false`). Since v67.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `ActionResultRepresentation`.
    notes: |
      **Done when:** The spec documents no status for this call. `activation_get.last_publish_status` and `activation_history_list` are the available signals.

      **Notes:** No source says what a retry resends or which states allow it.

  - name: activation_update
    method: PUT
    host: connect
    path: /ssot/activations/{activationId}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Activations/paths/~1ssot~1activations~1%7BactivationId%7D/put
    tools: [d360_activation_update]
    description: Update a specific activation by ID. Since v60.0.
    example: CALL cdp.activation_update (activation_id => '85RVF000000CEf72AG', refresh_type => 'INCREMENTAL', should_exclude_deletes => true, should_exclude_updates => true, static_data_config => (static_data = [(name = 'Test_1', value = 'TestValue_1')]));
    options:
      - {name: activation_id, api_name: activationId, in: path, type: string, required: true, description: "Spec: the ID or developer name. A community live test got 400 or 404 for names, so use the ID ([quirk T1](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md), one org)."}
      - {name: id, in: body, type: string, description: "ID of the asset. Since v58.0."}
      - {name: name, in: body, type: string, description: "Name of the asset. Since v58.0."}
      - {name: namespace, in: body, type: string, description: "Namespace of the asset. Since v58.0."}
      - {name: activation_mapping_schema, api_name: activationMappingSchema, in: body, type: string, description: "Type of identifier to use for activation audience matching, such as `PII` or `ANON`. Since v65.0."}
      - {name: activation_target_name, api_name: activationTargetName, in: body, type: string, description: "Name for the activation target. Either activation_target_name or data_export_definition_id must be present. Since v60.0."}
      - {name: activation_target_subject_config, api_name: activationTargetSubjectConfig, in: body, schema: ActivationTargetSubjectConfigInputRepresentation, description: "Subject configuration for the activation target. Since v60.0."}
      - {name: activation_type, api_name: activationType, in: body, type: string, enum: [ApiTriggered, Dmo, Segment], description: "Type of activation. If unspecified, defaults to `Segment`. Since v66.0."}
      - {name: attribute_limiting_expression_config, api_name: attributeLimitingExpressionConfig, in: body, schema: AttributeLimitingExpressionInputConfigRepresentation, description: "Limiting expression configuration for the activation. Since v63.0."}
      - {name: attributes_config, api_name: attributesConfig, in: body, schema: AttributesConfigInputRepresentation, array: 1, description: "Additional attributes for the activation. The `activate_on` attribute must be present. Since v60.0."}
      - {name: contact_points_config, api_name: contactPointsConfig, in: body, schema: ContactPointConfigInputRepresentation, array: 1, description: "Contact points configuration for the activation target. Since v60.0."}
      - {name: curated_entity, api_name: curatedEntity, in: body, schema: CuratedEntityInputRepresentation, description: "Curated entity details for the activation. Since v63.0."}
      - {name: customer_file_source, api_name: customerFileSource, in: body, type: string, enum: [FirstAndThirdParty, FirstParty, ThirdParty], description: "Customer file source for the activation target. Since v60.0."}
      - {name: data_export_definition_id, api_name: dataExportDefinitionId, in: body, type: string, description: "Activation target ID for the activation. Either activation_target_name or data_export_definition_id must be present. Since v60.0."}
      - {name: data_sources_config, api_name: dataSourcesConfig, in: body, schema: ActivationDataSourceConfigInputRepresentation, array: 1, description: "Data source configuration for the activation. Since v63.0."}
      - {name: dataspace_name, api_name: dataSpaceName, in: body, type: string, description: "Name of the data space for the activation. Since v60.0."}
      - {name: description, in: body, type: string, description: "Description of the activation. Since v60.0."}
      - {name: developer_name, api_name: developerName, in: body, type: string, description: "Developer name of the activation. Must be unique. The request fails if an activation with the same developer name already exists. Since v67.0."}
      - {name: direct_dmo_filters_config, api_name: directDmoFiltersConfig, in: body, schema: DMOFilterConfigInputRepresentation, array: 1, description: "Direct DMO filters. Since v60.0."}
      - {name: limit_value, api_name: limitValue, in: body, type: integer, description: "Audience limit value for the activation. Since v63.0."}
      - {name: market_segment_id, api_name: marketSegmentId, in: body, type: string, description: "Segment ID of the segment the activation needs to be created against. Either market_segment_id or segment_api_name must be present. Exclude this property for `ApiTriggered` activation types. Since v60.0."}
      - {name: processing_type, api_name: processingType, in: body, type: string, enum: [Batch], description: "Processing type for DMO activations. Required when activation_type is `DMO`. Since v67.0."}
      - {name: refresh_type, api_name: refreshType, in: body, type: string, required: true, description: "Indicates the refresh type for the activation, (`Full` or `Incremental`). Since v60.0."}
      - {name: related_dmo_filters_config, api_name: relatedDmoFiltersConfig, in: body, schema: DMOFilterConfigInputRepresentation, array: 1, description: "DMO filters on related attributes for the activation. Since v60.0."}
      - {name: segment_api_name, api_name: segmentApiName, in: body, type: string, description: "Developer name of the segment. Either market_segment_id or segment_api_name must be present. Exclude this property for `ApiTriggered` activation types. Since v60.0."}
      - {name: should_exclude_deletes, api_name: shouldExcludeDeletes, in: body, type: boolean, description: "Indicates whether to exclude records removed since the last refresh (`true`) or not (`false`). Since v60.0."}
      - {name: should_exclude_updates, api_name: shouldExcludeUpdates, in: body, type: boolean, description: "Indicates whether to exclude records modified since the last refresh (`true`) or not (`false`). Since v60.0."}
      - {name: source_dmo_name, api_name: sourceDmoName, in: body, type: string, description: "Developer name of the source DMO. Required for `ApiTriggered` activation types. Exclude this property for `Segment` activation types. Since v66.0."}
      - {name: static_data_config, api_name: staticDataConfig, in: body, schema: StaticDataConfigInputRepresentation, array: 1, description: "Configuration of campaign data attributes for an activation, which are name-value pairs including standard attributes (system-defined) and custom attributes (user-defined). Standard attributes are resolved by the system at activation run time and added as separate columns in the activation output. The available standard attributes are Activation Name, Activation ID, Segment Name, Segment ID, Activation Publish Start Time, and Activation Run ID. Standard attributes improve traceability, reconciliation, auditability, time-based processing, and disambiguation when multiple activations write to overlapping destinations. To use a standard attribute, select the exact standard attribute name and its corresponding value in the name-value pair. Since v60.0."}
      - {name: waterfall_selected_child_segments_config, api_name: waterfallSelectedChildSegmentsConfig, in: body, schema: WaterfallSelectedChildSegmentsConfigInputRepresentation, description: "Details about the selected Waterfall child segments. Required when segment_api_name references a Waterfall segment type; must not be present otherwise. Since v67.0."}
      - {name: activation_template_id, api_name: activationTemplateId, in: body, type: string, description: "Not in the spec schema: from the MCP server's request class."}
      - {name: platform_name, api_name: platformName, in: body, type: string, description: "Not in the spec schema: from the MCP server's request class."}
      - {name: identity_provider_config, api_name: identityProviderConfig, in: body, array: 1, description: "Not in the spec schema: from the MCP server's request class."}
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: activation_definition_id, api_name: activationDefinitionId, type: VARCHAR, description: "ID of the activation definition. Since v60.0."}
      - {name: activation_mapping_schema, api_name: activationMappingSchema, type: VARCHAR, description: "Type of identifier to use for activation audience matching, such as `PII` or `ANON`. Since v63.0."}
      - {name: activation_record_schema, api_name: activationRecordSchema, type: VARCHAR, description: "JSON schema representing the activation JSON payload in the activation_record field of the AudienceDMO. Since v62.0."}
      - {name: activation_target, api_name: activationTarget, type: JSON, schema: ActivationTargetRepresentation, description: "Activation target details. Since v60.0."}
      - {name: activation_target_subject_config, api_name: activationTargetSubjectConfig, type: JSON, schema: ActivationTargetSubjectRepresentation, description: "Activation target subject for the activation. Since v60.0."}
      - {name: activation_type, api_name: activationType, type: VARCHAR, description: "Type of activation. Since v66.0."}
      - {name: attribute_limiting_expression_config, api_name: attributeLimitingExpressionConfig, type: JSON, schema: AttributeLimitingExpressionConfigRepresentation, description: "Limiting expression configuration for the activation. Since v63.0."}
      - {name: attributes_config, api_name: attributesConfig, type: JSON, schema: ActivationAttributesConfigRepresentation, description: "Attributes for the activation. Since v60.0."}
      - {name: contact_points_config, api_name: contactPointsConfig, type: JSON, schema: ContactPointsConfigRepresentation, description: "Contact points for the activation. Since v60.0."}
      - {name: curated_entity, api_name: curatedEntity, type: JSON, schema: CdpAssetReferenceRepresentation, description: "Curated entity object details for the activation. Since v63.0."}
      - {name: customer_file_source, api_name: customerFileSource, type: VARCHAR, description: "Customer file source of the activation platform. Since v60.0."}
      - {name: data_sources_config, api_name: dataSourcesConfig, type: JSON, schema: ActivationDataSourcesRepresentation, description: "Data sources for the activation. Since v60.0."}
      - {name: dataspace_name, api_name: dataSpaceName, type: VARCHAR, description: "Data space name for the activation. Since v60.0."}
      - {name: description, type: VARCHAR, description: "Description of the activation. Since v60.0."}
      - {name: developer_name, api_name: developerName, type: VARCHAR, description: "Developer name for the activation. Since v60.0."}
      - {name: direct_dmo_filters_config, api_name: directDmoFiltersConfig, type: JSON, schema: DmoFiltersConfigRepresentation, description: "Direct DMO filters for the activation. Since v60.0."}
      - {name: enabled, type: BOOLEAN, description: "Indicates whether the activation is enabled (`true`) or not (`false`). Since v60.0."}
      - {name: history_audience_dmo_api_name, api_name: historyAudienceDmoApiName, type: VARCHAR, description: "API name for the history audience DMO. Since v60.0."}
      - {name: history_audience_dmo_label, api_name: historyAudienceDmoLabel, type: VARCHAR, description: "Name of the history audience DMO. Since v60.0."}
      - {name: is_enabled, api_name: isEnabled, type: BOOLEAN, description: "Indicates whether the activation is enabled (`true`) or not (`false`). Since v60.0."}
      - {name: last_publish_date, api_name: lastPublishDate, type: VARCHAR, description: "Last publish timestamp of the activation. Use the format `yyyy-mm-dd`. Since v60.0."}
      - {name: last_publish_status, api_name: lastPublishStatus, type: VARCHAR, description: "Last publish status of the activation. Since v60.0."}
      - {name: last_publish_status_error_msg, api_name: lastPublishStatusErrorMsg, type: VARCHAR, description: "Error message encountered during last publish. Since v60.0."}
      - {name: latest_audience_dmo_api_name, api_name: latestAudienceDmoApiName, type: VARCHAR, description: "API name for the latest audience DMO. Since v62.0."}
      - {name: latest_audience_dmo_label, api_name: latestAudienceDmoLabel, type: VARCHAR, description: "Name for the latest audience DMO. Since v62.0."}
      - {name: latest_audience_dmo_last_run_timestamp, api_name: latestAudienceDmoLastRunTimestamp, type: VARCHAR, description: "Timestamp of the last run for the latest audience DMO. Use the format `yyyy-mm-dd`. Since v62.0."}
      - {name: limit_value, api_name: limitValue, type: BIGINT, description: "Audience limit value for the activation. Since v63.0."}
      - {name: market_segment_id, api_name: marketSegmentId, type: VARCHAR, description: "Segment ID of the activation. Returned for `Segment` type activations. Since v60.0."}
      - {name: membership_name, api_name: membershipName, type: VARCHAR, description: "Membership name of the activation. Since v60.0."}
      - {name: processing_type, api_name: processingType, type: VARCHAR, description: "Processing type for DMO activations. Since v67.0."}
      - {name: query_path_config, api_name: queryPathConfig, type: JSON, schema: QueryPathConfigListRepresentation, description: "Query path for the activation target. Since v63.0."}
      - {name: refresh_type, api_name: refreshType, type: VARCHAR, description: "Refresh type of the activation. Since v60.0."}
      - {name: related_dmo_filters_config, api_name: relatedDmoFiltersConfig, type: JSON, schema: DmoFiltersConfigRepresentation, description: "DMO filters on related attributes for the activation. Since v60.0."}
      - {name: segment_api_name, api_name: segmentApiName, type: VARCHAR, description: "Segment API name. Returned for `Segment` type activations. Since v60.0."}
      - {name: segment_id, api_name: segmentId, type: VARCHAR, description: "Segment ID of the activation. Returned for `Segment` type activations. Since v60.0."}
      - {name: should_exclude_deletes, api_name: shouldExcludeDeletes, type: BOOLEAN, description: "Indicates whether to exclude records removed since the last refresh (`true`) or not (`false`). Since v60.0."}
      - {name: should_exclude_updates, api_name: shouldExcludeUpdates, type: BOOLEAN, description: "Indicates whether to exclude records modified since the last refresh (`true`) or not (`false`). Since v60.0."}
      - {name: source_dmo_name, api_name: sourceDmoName, type: VARCHAR, description: "Developer name of the source DMO. Since v66.0."}
      - {name: static_data_config, api_name: staticDataConfig, type: JSON, schema: StaticDataConfigRepresentation, description: "Campaign data attributes configuration for an activation, which includes both standard attributes (system-defined) and custom attributes (user-defined). Since v60.0."}
      - {name: status, type: VARCHAR, description: "Status of the activation. Since v60.0."}
      - {name: waterfall_selected_child_segments_config, api_name: waterfallSelectedChildSegmentsConfig, type: JSON, schema: WaterfallSelectedChildSegmentsConfigRepresentation, description: "Details about the selected Waterfall child segments. Required when segment_api_name references a Waterfall segment type; must not be present otherwise. Since v67.0."}
      - {name: activation_target_id, api_name: activationTargetId, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
      - {name: activation_target_name, api_name: activationTargetName, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
    effect: write
    evidence: O
    result_description: One row. Schema `ActivationRepresentation`.
    notes: |
      **Notes:** This is a `PUT`, and the spec still requires `refresh_type`. The spec's example sends only a few fields, and the [MCP class](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/model/request/activation/ActivationUpdateRequest.java) says "populate only what you want to change". No source says whether omitted fields keep their values, so compare with `activation_get` afterwards. The enum and shape conflicts under `activation_create` apply here too, and the output of `activation_get` can't be sent back as input.

      No source lists the fields that can't change.

schemas:
  ActivationAdditionalAttributesConfigInputRepresentation:
    description: Represents the additional attributes configuration for the market segment activation input.
    attributes:
      - {name: activation_platform_attr_id, api_name: activationPlatformAttrId, type: string, description: "Activation platform attribute ID. Since v60.0."}
      - {name: data_source_type, api_name: dataSourceType, type: string, description: "Type of the data source. Since v60.0."}
      - {name: entity_name, api_name: entityName, type: string, description: "List of records in an Audience DMO. Since v60.0."}
      - {name: external_platform_attribute_name, api_name: externalPlatformAttributeName, type: string, description: "Attribute destination name for an external platform. Since v64.0."}
      - {name: filter_expression, api_name: filterExpression, schema: AttributeFilterExpressionInputRepresentation, description: "Attribute filter expression. Since v60.0."}
      - {name: is_rolluppable, api_name: isRolluppable, type: boolean, description: "Indicates whether the attribute can roll up (`true`) or not (`false`). Since v60.0."}
      - {name: label, type: string, description: "Label of the attribute. Since v60.0."}
      - {name: name, type: string, description: "Name of the attribute. Since v60.0."}
      - {name: preferred_name, api_name: preferredName, type: string, description: "Preferred name of the attribute. Since v60.0."}
      - {name: query_path_config, api_name: queryPathConfig, schema: QueryPathConfigListInputRepresentation, array: 1, description: "Query path from the `activate_on` entity to the additional attribute entity. Since v60.0."}
      - {name: reference_attribute_name, api_name: referenceAttributeName, type: string, description: "Developer name of the reference attribute. Since v60.0."}
      - {name: source, type: string, enum: [Direct, Related], description: "Data export source type. Since v60.0."}
      - {name: type, type: string, enum: [Computed_Dimension, Computed_Measure, Model, Model_Related, Non_Aggregatable_Computed_Measure], description: "Data export attribute type. Since v60.0."}

  ActivationContactPointInputRepresentation:
    description: Represents the activation contact point input.
    attributes:
      - {name: attributes_config, api_name: attributesConfig, schema: ContactPointAttributesConfigInputRepresentation, array: 1, required: true, description: "Attributes for the contact point. Since v60.0."}
      - {name: entity_name, api_name: entityName, type: string, required: true, description: "Entity name for the contact point. Since v60.0."}
      - {name: external_platform_hash_method, api_name: externalPlatformHashMethod, type: string, description: "The spec marks this required, but the example here leaves it out. External platform hash method for the contact point. Since v60.0."}
      - {name: filter_expression, api_name: filterExpression, schema: ContactPointFilterExpressionInputRepresentation, array: 1, description: "The spec marks this required, but the example here leaves it out. Filter expression for the contact point. Since v60.0."}
      - {name: query_path_config, api_name: queryPathConfig, schema: QueryPathConfigListInputRepresentation, array: 1, required: true, description: "Query path configuration list. Since v63.0."}
      - {name: sources_config, api_name: sourcesConfig, schema: ContactPointSourcesConfigInputRepresentation, array: 1, required: true, description: "Source configurations for the contact point. Since v60.0."}
      - {name: type, type: string, enum: [Email, Maid, Ott, Phone, Push, SubscriberKeyEmail, SubscriberKeyPhone, WhatsApp], required: true, description: "Type of contact point. Since v60.0."}

  ActivationDataSourceConfigInputRepresentation:
    description: Represents the configuration input for an activation data source.
    attributes:
      - {name: data_sources, api_name: dataSources, schema: DataSourceNameConfigInputRepresentation, array: 1, required: true, description: "List of data sources for the activation. Since v63.0."}

  ActivationTargetSubjectConfigInputRepresentation:
    description: Represents the activation target subject configuration input.
    attributes:
      - {name: id, type: string, description: "ID of the asset. Since v58.0."}
      - {name: name, type: string, description: "Name of the asset. Since v58.0."}
      - {name: namespace, type: string, description: "Namespace of the asset. Since v58.0."}
      - {name: developer_name, api_name: developerName, type: string, description: "Developer name of activation target subject configuration. Since v60.0."}
      - {name: query_path_config, api_name: queryPathConfig, schema: QueryPathConfigListInputRepresentation, array: 1, description: "Path of the activation target subject configuration. Since v60.0."}

  AttributeFilterExpressionInputRepresentation:
    description: Represents the attribute filter expression input.
    attributes:
      - {name: id, type: string, description: "ID of the asset. Since v58.0."}
      - {name: name, type: string, description: "Name of the asset. Since v58.0."}
      - {name: namespace, type: string, description: "Namespace of the asset. Since v58.0."}
      - {name: conjunction, type: string, enum: [FilterConjunctionAnd, FilterConjunctionOr], description: "Filter conjunction. Since v60.0."}
      - {name: filters, schema: AttributeFilterInputRepresentation, array: 1, description: "Attribute filters. Since v60.0."}

  AttributeFilterInputRepresentation:
    description: Represents the attribute filter input.
    attributes:
      - {name: id, type: string, description: "ID of the asset. Since v58.0."}
      - {name: name, type: string, description: "Name of the asset. Since v58.0."}
      - {name: namespace, type: string, description: "Namespace of the asset. Since v58.0."}
      - {name: attribute_id, api_name: attributeId, type: string, description: "ID of the attribute. Since v60.0."}
      - {name: attribute_name, api_name: attributeName, type: string, description: "Name of the attribute. Since v60.0."}
      - {name: date_units, api_name: dateUnits, type: string, enum: [Days, Months, Years], description: "Date unit filter. Since v60.0."}
      - {name: operator, type: string, description: "Operator of the attribute. Since v60.0."}
      - {name: type, type: string, enum: [FilterOperatorDataTypeBoolean, FilterOperatorDataTypeDate, FilterOperatorDataTypeDateOnly, FilterOperatorDataTypeExactlyRelativeDate, FilterOperatorDataTypeNumber, FilterOperatorDataTypeRelateToNowDate, FilterOperatorDataTypeText], description: "Filter operator type. Since v60.0."}
      - {name: value, schema: FilterValuesInputRepresentation, array: 1, description: "Filter values. Since v60.0."}

  AttributeLimitingExpressionInputConfigRepresentation:
    description: Represents the limiting expression configuration input for an activation.
    attributes:
