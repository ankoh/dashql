      - {name: batch_size, api_name: batchSize, in: query, type: integer, description: "Number of results to return. Values are from `1` through `200`. If unspecified, the default value is `20`. Since v60.0."}
      - {name: filters, in: query, type: string, description: "Filter the result set to a more narrow scope or specific type. These filters are supported: - name (field name: name; description: name of the activation) - market_segment_id (field name: segment_id; description: segment ID of the activation) - activation_target_id (field name: activation_target.id; description: activation target ID of the activation) - activationRefreshType (field name: refresh_type; description: refresh type of the activation; example: incremental) - activation_status (field name: status; description: status of the activation, which accepts only the values in the `status` response field; example: active). **Example requests with filters:** - GET `https://{dne_cdpInstanceUrl}/services/data/v60.0/ssot/activations?filters = name in Activation001` - GET `https://{dne_cdpInstanceUrl}/services/data/v60.0/ssot/activations?filters = marketsegmentid in 00sgxx0001AAA` - GET `https//{dne_cdpInstanceUrl}/services/data/v60.0/ssot/activations?filters = activationRefreshType in incremental` - GET `https//{dne_cdpInstanceUrl}/services/data/v60.0/ssot/activations?filters = activationrefreshtype in incremental AND activationstatus in active` - GET `https//{dne_cdpInstanceUrl}/services/data/v60.0/ssot/activations?filters = activationtargetid in 85Uxx0000004CKKEA2 AND activationstatus in active&orderby = createddate desc&offset=0&batchsize=20` Since v60.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. Must be greater than or equal to `0`. If unspecified, no rows are skipped. Since v60.0."}
