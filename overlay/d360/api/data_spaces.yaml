title: Data Spaces
description: |
  A data space is an [isolated workspace](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/runtime/FamilyCatalog.java) inside one org. Create a space, add data lake objects (DLOs) as members, wait for member `status`, then name the space on later calls. Most calls that accept a space fall back to `default` when you omit it.

  **Members are DLOs, not users.** User access comes from `dataspaceScopes` on a permission set, [deployed as metadata](https://github.com/forcedotcom/sf-skills/blob/main/skills/platform-dataspace-access-configure/SKILL.md). No function here grants it.

  **Scoping has no single rule.** The option's name and position vary per call in the spec:

  | Where | Calls |
  |---|---|
  | `dataspace` query | `metadata`, mappings, DMO relationships, `segment_list`, `segment_create`, the calculated insight list, data graphs, data actions |
  | `dataspace` query | Activation and target enable, disable and metadata lookups |
  | `dataspace_name` or `dataspace_id` query | Object access grants; capping dimensions |
  | Body field | `dataspace_name` on `dmo_create`, `activation_create`; `dataspace_info` on `dlo_create`, `datastream_create` |
  | None | `dlo_list`, `dmo_list`, `datastream_list`, `activation_list`, target and identity resolution lists |

  For the last row, [filter the response yourself (community, one org with one space)](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md). That source also found `dlo_list` filters by space after paging, so short pages don't mean the end.

  This family's own calls take `id_or_name`. Salesforce's [MCP tools](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/DataSpaceTools.java) call it `dataSpaceNameOrId`, and `dataSpaceNameOrID` on the member list only. Those are Java parameter names, not API names.

  ```sql
  CALL cdp.dataspace_create (label => 'nonDefault', prefix => 'ndf', description => 'Custom data space.');
  CALL cdp.dataspace_member_add (id_or_name => 'nonDefault', members => (members = [(member_name = 'Orders__dll', filter = (conjunctive_operator = 'NoneOperator', conditions = (conditions = [])))]));
  CALL cdp.dataspace_member_get (id_or_name => 'nonDefault', dataspace_member_object_name => 'Orders__dll'); /* repeat until status is ACTIVE */
  CALL cdp.segment_list (dataspace => 'nonDefault');
  ```

functions:
  - name: dataspace_delete
    method: DELETE
    host: connect
    path: /ssot/data-spaces/{idOrName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Spaces/paths/~1ssot~1data-spaces~1%7BidOrName%7D/delete
    description: Deletes a data space by ID or API name.
    example: CALL cdp.dataspace_delete (id_or_name => 'nonDefault');
    options:
      - {name: id_or_name, api_name: idOrName, in: path, type: string, required: true, description: "ID (`0vhSB000001bqwjYAA`) or API name (`nonDefault`) of the data space."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 204). One row with only the standard columns.
    notes: "**Notes:** Only the newer spec has this call. It's absent from the older v68 copy, from the MCP tools and from the [community CLI](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/src/resources/dataSpace.ts). The spec lists 204, 403, 404 and 412 with no explanation of 412. No source says what happens to the members, or whether `default` can be deleted."

  - name: dataspace_member_remove
    method: DELETE
    host: connect
    path: /ssot/data-spaces/{idOrName}/members
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Spaces/paths/~1ssot~1data-spaces~1%7BidOrName%7D~1members/delete
    tools: [d360_dataspace_member_remove]
    description: Delete the specified data lake objects (DLOs) from a data space. Since v66.0.
    example: CALL cdp.dataspace_member_remove (id_or_name => 'nonDefault', member_names => 'Orders__dll,Returns__dll');
    options:
      - {name: id_or_name, api_name: idOrName, in: path, type: string, required: true, description: "ID or API name of the data space. Since v66.0."}
      - {name: member_names, api_name: memberNames, in: query, type: string, required: true, description: "DLO names separated by commas, for example, `DataSpaceMember1__dll,DataSpaceMember2__dll`. Maximum 10 members per request. Since v66.0."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 200). One row with only the standard columns.
    notes: "**Notes:** A 200 doesn't mean the members were removed. The older spec copy says individual items may fail, each with a `success` boolean and an `errors` object holding `REFERENTIAL_INTEGRITY_VIOLATION` (dependencies found), `NOT_FOUND` or `NO_ACCESS`. Neither copy has a response schema, so the entries have no columns here. Confirm with `dataspace_member_list`."

  - name: dataspace_list
    method: GET
    host: connect
    path: /ssot/data-spaces
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Spaces/paths/~1ssot~1data-spaces/get
    tools: [d360_dataspace_list]
    description: Get a collection of all data spaces that a user is assigned to. Since v62.0.
    example: CALL cdp.dataspace_list ();
    options:
      - {name: limit, in: query, type: integer, description: "The maximum number of items to return in each response. Values are from `1` through `4999`. The default value is `50` if unspecified. Since v62.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. Must be an integer greater than zero. If unspecified, no rows are skipped. Since v62.0."}
      - {name: order_by, api_name: orderBy, in: query, type: string, description: "Sort order for the result set: `ASC` for ascending or `DESC` for descending. If unspecified, results are returned in ascending order. Since v62.0."}
    rows: /dataSpaces
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: description, type: VARCHAR, description: "Description of the data space. Since v62.0."}
      - {name: prefix, type: VARCHAR, description: "Three-character prefix of the data space. Since v62.0."}
      - {name: status, type: VARCHAR, description: "Status of the data space. Since v62.0."}
    paging: {kind: url, from: {body: /nextPageUrl}}
    effect: read
    evidence: O
    result_description: "One row per item of `/dataSpaces` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`. Schema `DataSpaceInfoRepresentation`."
    notes: |
      **Paging:** `next_page_url`.

      **Notes:** This returns only the spaces the caller is assigned to, so a missing space may still exist. The [MCP tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/DataSpaceTools.java) sends `batch_size` and describes `order_by` as a field name. The spec says `limit`, and `ASC` or `DESC`. A [community skill](https://github.com/Jaganpro/sf-skills/blob/main/skills/sf-datacloud/references/feature-readiness.md) ties this call to the `CdpDataSpace` feature being provisioned (community).

