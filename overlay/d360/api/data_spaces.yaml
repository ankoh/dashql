  - name: dataspace_member_list
    method: GET
    host: connect
    path: /ssot/data-spaces/{idOrName}/members
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Spaces/paths/~1ssot~1data-spaces~1%7BidOrName%7D~1members/get
    tools: [d360_dataspace_member_list]
    description: Get information about the objects that can access a data space. Currently, only data lake objects (DLOs) are supported. Since v61.0.
    example: CALL cdp.dataspace_member_list (id_or_name => 'default', batch_size => 200);
    options:
      - {name: id_or_name, api_name: idOrName, in: path, type: string, required: true, description: "ID or API name of the data space."}
      - {name: batch_size, api_name: batchSize, in: query, type: integer, description: "The maximum number of items to return in each response. Values are from `1` through `2000`. The default value is `50` if unspecified. Since v61.0."}
      - {name: continuation_token, api_name: continuationToken, in: query, type: string, description: "Token used to retrieve the next set of data space members. Returned when more results are available than can be returned in a single request. - **First request:** Omit the parameter or pass `null` to retrieve the first page. - **Subsequent requests:** Pass the token from the previous response to retrieve the next page. - **Expired tokens:** Tokens can expire after a period of time. If a token expires, restart pagination from the firstpage. - **Last page:** When the response returns no `continuation_token`, you've reached the last page. Since v67.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. Values are from `1` through '2000' If unspecified, no rows are skipped. Since v61.0."}
      - {name: order_by, api_name: orderBy, in: query, type: string, description: "Sort order for the result set: `ASC` for ascending or `DESC` for descending. If unspecified, results are returned in ascending order. Since v61.0."}
    rows: /members
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: filter, type: JSON, schema: DataSpaceFilterRepresentation, description: "Filter on the object used for creating the data space member. Since v61.0."}
      - {name: member_name, api_name: memberName, type: VARCHAR, description: "Developer name of the data space member. Since v62.0."}
      - {name: status, type: VARCHAR, description: "Status of the off-core sync of the data space member. Since v62.0."}
    paging: {kind: token, from: {body: /continuationToken}, option: continuation_token}
    effect: read
    evidence: O
    result_description: "One row per item of `/members` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`, `continuationToken`. Schema `DataSpaceMemberRepresentation`."
    notes: |
      **Paging:** `continuationToken` in `_meta`, since v67. No token means the last page. Tokens can expire, then restart from the first page. The schema also has `next_page_url`, but the spec's example response doesn't return it.

      **Notes:** Rows are DLOs. The [MCP tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/DataSpaceTools.java) comments say "who has access", and its test uses users with roles, which contradicts the spec. That tool also doesn't send `continuation_token`. `offset` stops at 2000 in the spec, so use the token beyond that.

      `status` is `Active`, `Error` or `Processing` in the spec's enum, but its examples show `ACTIVE`. [sf-pi](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/registry/connect-openapi-overrides.json) records uppercase from a live response, so compare without case.

  - name: dataspace_member_get
