    notes: |
      **Done when:** `dataspace_get.status` is `Active`. `Processing` means still running, `Error` means failed. The spec's example returns `Active` from the create itself.

      **Notes:** The spec contradicts itself on the body. Its schema lists `id`, `name`, `namespace` and `filter`, which is what the table shows. Its example and the [Postman collection](https://github.com/supanmaniar/salesforce-mcn-d360-agent/blob/main/catalog/endpoints.json) send `label`, `prefix` and `description`, so the example above uses options the table lacks. The [MCP request class](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/model/request/dataspace/DataSpaceCreateRequest.java) sends `name`, `label` and `description`.

      In the spec's example no `name` is sent, and the response's `name` equals `label`. The response schema calls `prefix` three characters. The spec also lists a 409 without describing it.

  - name: dataspace_sync
    method: POST
    host: connect
    path: /ssot/data-spaces/{idOrName}/actions/retry
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Spaces/paths/~1ssot~1data-spaces~1%7BidOrName%7D~1actions~1retry/post
    description: Retries the sync of a data space. The spec gives only the summary "Sync data space" and the path `actions/retry`.
    example: CALL cdp.dataspace_sync (id_or_name => 'nonDefault');
    options:
      - {name: id_or_name, api_name: idOrName, in: path, type: string, required: true, description: "ID or API name of the data space."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 204). One row with only the standard columns.
    notes: |
      **Done when:** No source documents this. `dataspace_get.status` is the only progress field in the spec.

      **Notes:** Only the newer spec has this call. It's absent from the older v68 copy and the MCP tools, and no source says when to call it. The spec lists 204 and 404.

  - name: dataspace_member_sync
    method: POST
    host: connect
    path: /ssot/data-spaces/{idOrName}/members/{dataSpaceMemberObjectName}/actions/retry
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Spaces/paths/~1ssot~1data-spaces~1%7BidOrName%7D~1members~1%7BdataSpaceMemberObjectName%7D~1actions~1retry/post
    description: Retries the sync of one data space member. The spec gives only the summary "Sync data space member" and the path `actions/retry`.
    example: CALL cdp.dataspace_member_sync (dataspace_member_object_name => 'Orders__dll', id_or_name => 'nonDefault');
    options:
      - {name: dataspace_member_object_name, api_name: dataSpaceMemberObjectName, in: path, type: string, required: true, description: "Developer name of the DLO that is the member, as in `member_name`."}
      - {name: id_or_name, api_name: idOrName, in: path, type: string, required: true, description: "ID or API name of the data space."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 204). One row with only the standard columns.
    notes: |
      **Done when:** No source documents this. The member's `status`, from `dataspace_member_get`, is described as the status of its off-core sync.

      **Notes:** Only the newer spec has this call. It's absent from the older v68 copy and the MCP tools, and no source says when to call it. The spec lists 204 and 404.

  - name: dataspace_member_add
    method: PUT
    host: connect
    path: /ssot/data-spaces/{idOrName}/members
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Spaces/paths/~1ssot~1data-spaces~1%7BidOrName%7D~1members/put
    tools: [d360_dataspace_member_add]
    description: Add members to a data space or update existing data space filters. Currently, only data lake objects (DLOs) are supported. Both create and update are acceptable methods. Since v61.0.
    example: CALL cdp.dataspace_member_add (id_or_name => 'nonDefault', members => (members = [(member_name = 'Orders__dll', filter = (conjunctive_operator = 'OrOperator', condition_groups = [], conditions = (conditions = [(field_name = 'Region__c', filter_value = 'EMEA', operator = 'EqualsOperator', table_name = 'Orders__dll')])))]));
    options:
      - {name: id_or_name, api_name: idOrName, in: path, type: string, required: true, description: "ID or API name of the data space."}
      - {name: members, in: body, schema: DataSpaceMemberInputListRepresentation, array: 1, required: true, description: "A list of members to either create or update in the data space. Since v62.0."}
    columns:
      - {name: dataspace_members, api_name: dataSpaceMembers, type: JSON, schema: DataSpaceMemberCollectionRepresentation, description: "Details of the data space members that have been successfully created or updated. Since v62.0."}
      - {name: errors, type: JSON, array: 1, schema: DataSpaceMemberErrorRepresentation, description: "Details of the data space members that have been ignored or failed during the operation. Since v62.0."}
      - {name: success, type: VARCHAR, description: "Status of the operation (`true` or `false`). Value is `true` if some or all members have been created or updated. Value is `false` only if all members have failed to be created or updated. Since v62.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `DataSpaceMemberPutCollectionRepresentation`.
    notes: |
      **Done when:** `dataspace_member_get.status` or `dataspace_member_list.status` is `ACTIVE`. `PROCESSING` means still running, `ERROR` means failed. The spec's example returns `PROCESSING` from this call. Compare without case.

      **Notes:** The sources give three body shapes:

      - **Spec schema, shown in the tables:** `members` is an array of `(members = [...])`, `filter` is an array, and `conditions` is an array of `(conditions = [...])`.
      - **Spec example, [Postman collection](https://github.com/supanmaniar/salesforce-mcn-d360-agent/blob/main/catalog/endpoints.json) and [community CLI](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/src/commands/data360/data-space/member/set.ts):** `members`, `filter` and `conditions` are each a single object. The example above uses this. The CLI's [coverage doc](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/docs/API_COVERAGE.md) claims live evidence for it (community).
      - **[MCP classes](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/model/request/dataspace/DataSpaceMemberRequest.java):** `members` is a flat array of members, and `filter` is an array.

      The input enum says `Equals`, while the output enum and every example say `EqualsOperator`. `filter` is required. For no filter, the community CLI sends `conjunctive_operator = 'NoneOperator'` with empty conditions (community).

      The MCP tool comments describe granting access to a user with a role, and its test passes `user-456`. The spec allows only DLOs. Sending an existing `member_name` updates its filter. `DataLakeObjectInput` also has `dataspace_info`, so `dlo_create` and `datastream_create` can name spaces at creation.

schemas:
  DataSpaceMemberInputListRepresentation:
    description: Represents a list of data space members.
    attributes:
      - {name: members, schema: DataSpaceMemberInputRepresentation, array: 1, required: true, description: "Members of a data space. Since v62.0."}

  DataSpaceMemberInputRepresentation:
    description: Represents the member details for updating a data space.
    attributes:
      - {name: filter, schema: DataSpaceFilterInputRepresentation, array: 1, required: true, description: "Filter applied on the data space member. Since v62.0."}
      - {name: member_name, api_name: memberName, type: string, required: true, description: "Developer name of the data space member. Since v62.0."}
