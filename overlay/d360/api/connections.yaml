    notes: |
      **Notes:** This takes the same per-type options as [`connection_create`](#connection_create), which the table omits. Data connections must resend `credentials`, because the input requires them and reads return them masked.

      Everything not in the request is replaced, so read the connection first and copy its settings. Salesforce's MCP server has no tool for this call. Its [tool text](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/MetadataTools.java) says to delete and recreate non-Marketing Cloud connections, which breaks dependent streams, and a [community tool](https://github.com/javrrr/afd360/blob/main/src/resources/connection.ts) does the same. No source I read reports using `PUT` on a live data connection.

  - name: connection_schema_upsert
    method: PUT
    host: connect
    path: /ssot/connections/{connectionId}/schema
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Connections/paths/~1ssot~1connections~1%7BconnectionId%7D~1schema/put
    description: Create or update a schema model for a connection. Since v60.0.
    example: |
      CALL cdp.connection_schema_upsert (
        connection_id => '9cgaj0000012O5hAAE',
        schemas => [(
          name = 'Orders',
          label = 'Orders',
          schema_type = 'IngestApi',
          fields = [
            (name = 'Id', label = 'Id', data_type = 'Text'),
            (name = 'Amount', label = 'Amount', data_type = 'Number'),
            (name = 'OrderedAt', label = 'OrderedAt', data_type = 'DateTime')
          ]
        )]
      );
    options:
      - {name: connection_id, api_name: connectionId, in: path, type: string, required: true, description: "Record id of the connection, from `connection_list`."}
      - {name: schemas, in: body, schema: ConnectionSchemaInputRepresentation, array: 1, required: true, description: "List of connection schemas. Use the connection schema input object that corresponds to the schema type. For example, use the Connectors Framework Connection Schema Input for the `DataConnectionEvent` schema type. Since v60.0."}
    rows: /schemas
    columns:
      - {name: availability_status, api_name: availabilityStatus, type: VARCHAR}
      - {name: fields, type: JSON, array: 1, schema: ConnectorsFrameworkConnectionSchemaFieldRepresentation}
      - {name: category, type: VARCHAR}
      - {name: label, type: VARCHAR, description: "Label of the connector. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Developer name of the connector. Since v60.0."}
      - {name: schema_type, api_name: schemaType, type: VARCHAR, description: "Schema of the connector. Since v60.0."}
    effect: write
    evidence: O
    result_description: One row per item of `/schemas` in the response. Schema `ConnectionSchemaRepresentation`.
    notes: |
      **Notes:** `ConnectionSchemaInput` omits what its subtypes add. All have `fields`, a list of `(name = ..., label = ..., data_type = ...)`, where `data_type` is `Boolean`, `Currency`, `Date`, `DateOnly`, `DateTime`, `Email`, `Number`, `Percent`, `Phone`, `Text` or `Url`. By `schema_type`:

      | `schema_type` | Schema attributes | Field attributes |
      |---|---|---|
      | `IngestApi`, `DataConnectionEvent` | None | `currency_iso_code` |
      | `StreamingApp` | `availability_status` (`Available`, `InUse`), `category` (`Engagement`, `Other`, `Profile`) | `isDataRequired`, `primaryIndexOrder` |

      An Ingestion API connection is incomplete until this has run ([skill](https://github.com/Jaganpro/sf-skills/blob/main/skills/sf-datacloud-connect/SKILL.md), community). The [official guide](https://developer.salesforce.com/docs/data/data-cloud-int/guide/c360-a-connect-an-ingestion-source.md) does the same step by uploading an OpenAPI YAML file.

      From a [community recipe](https://github.com/javrrr/afd360/blob/main/skills/afd360/references/connector-ingestapi.md): always send field `label`, because the server fails without it. The schema is effectively immutable, so adding a field means a new schema, stream and mapping. A stream's source object must match the schema `name`. [Web and mobile setup](https://developer.salesforce.com/docs/data/data-cloud-int/guide/c360-a-mobile-web-app-connector.md) calls this event definitions.

  - name: connection_sitemap_upsert
    method: PUT
    host: connect
    path: /ssot/connections/{connectionId}/sitemap
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Connections/paths/~1ssot~1connections~1%7BconnectionId%7D~1sitemap/put
    description: Create or update the sitemap for a Streaming App connection. Since v60.0.
    example: |
      CALL cdp.connection_sitemap_upsert (
        connection_id => '9cgaj0000012O5hAAE',
        sitemap => $$
          SalesforceInteractions.init().then(() => {
            SalesforceInteractions.initSitemap({ global: {}, pageTypeDefault: {}, pageTypes: [] });
          });
        $$
      );
    options:
      - {name: connection_id, api_name: connectionId, in: path, type: string, required: true, description: "Record id of a `StreamingApp` connection."}
      - {name: sitemap, in: body, type: string, required: true, description: "JavaScript text of the [Web SDK sitemap](https://developer.salesforce.com/docs/data/salesforce-interactions-sdk/guide/c360a-api-sitemap.md), best written as `$$...$$`. Since v60.0."}
    columns:
      - {name: sitemap, type: VARCHAR, description: "Sitemap of the Streaming App connector. Since v60.0."}
      - {name: sitemap_path, api_name: sitemapPath, type: VARCHAR, description: "Path to the sitemap of the Streaming App connector. Since v60.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `ConnectionSitemapRepresentation`.
    notes: "**Notes:** The [SDK docs](https://developer.salesforce.com/docs/data/salesforce-interactions-sdk/guide/c360a-api-sitemap.md) show the sitemap as JavaScript, while the [upload guide](https://developer.salesforce.com/docs/data/data-cloud-int/guide/c360-a-upload-a-sitemap-file.md) calls it a \"custom sitemap JSON file\". The spec only says \"Contents of the sitemap file\". The example has the SDK's general pattern with empty sections."

schemas:
  ConnectionModuleConfigInputRepresentation:
    description: Input representation for Streaming App module configuration for a patch request.
    attributes:
      - {name: configuration, type: string, description: "Stringified JSON object for the custom configuration of the Streaming App module. The default is `null`. Since v63.0."}
      - {name: is_enabled, api_name: isEnabled, type: boolean, description: "Indicates whether the Streaming App module is enabled (`true`) or not (`false`). The default value is `false`. Since v63.0."}
      - {name: name, type: string, required: true, description: "Name of the Streaming App module. Since v63.0."}
      - {name: path, type: string, description: "URL for the Amazon S3 location where the Streaming App module's minified JavaScript file is hosted. The default is `null`. Since v63.0."}

  ConnectionSchemaInputRepresentation:
    description: Input representation for a connection schema.
    attributes:
      - {name: fields, schema: ConnectorsFrameworkConnectionSchemaFieldInputRepresentation, array: 1, description: "-"}
      - {name: availability_status, api_name: availabilityStatus, type: string, enum: [Available, InUse], description: "-"}
      - {name: category, type: string, enum: [Engagement, Other, Profile], description: "-"}
      - {name: label, type: string, required: true, description: "Label of the connector. Since v60.0."}
      - {name: name, type: string, required: true, description: "Developer name of the connector. Since v60.0."}
      - {name: schema_type, api_name: schemaType, type: string, enum: [DataConnectionEvent, IngestApi, StreamingApp], required: true, description: "Schema of the connector. Since v60.0."}

  ConnectorsFrameworkConnectionSchemaFieldInputRepresentation:
    description: Represents the input for connectors framework field types.
    attributes:
      - {name: label, type: string, description: "Label of the schema field. Since v60.0."}
      - {name: name, type: string, description: "Developer name of the schema field. Since v60.0."}
      - {name: currency_iso_code, api_name: currencyIsoCode, type: boolean, description: "Indicates whether the field is a currency ISO code (`true`) or not (`false`). Since v64.0."}
      - {name: data_type, api_name: dataType, type: string, enum: [Boolean, Currency, Date, DateOnly, DateTime, Email, Number, Percent, Phone, Text, Url], description: "Data type of the field. Since v64.0."}

  DataConnectionParameterInputRepresentation:
    description: Key-value pair for credentials and parameters of a data connection.
    attributes:
      - {name: param_name, api_name: paramName, type: string, required: true, description: "Name of the parameter, from the `connection_attributes` of `connector_metadata`. Names vary by connector and aren't checked here. Since v61.0."}
      - {name: value, type: string, required: true, description: "Value of the parameter, always a string. Since v61.0."}
      - {name: client_secret, api_name: clientSecret, type: string, description: "Not in the spec schema: from the MCP server's payload example."}
      - {name: environment, type: string, description: "Not in the spec schema: from the MCP server's payload example."}
      - {name: client_id, api_name: clientId, type: string, description: "Not in the spec schema: from the MCP server's payload example."}
      - {name: username, type: string, description: "Not in the spec schema: from the MCP server's payload example."}
      - {name: attributes, schema: DataConnectionParameterInput_attributes, array: 1, description: "Not in the spec schema: from the spec's examples."}
      - {name: parameters, schema: DataConnectionParameterInput_parameters, description: "Not in the spec schema: from the spec's examples."}

  DataConnectionParameterInput_attributes:
    unknown: warning
    attributes:
      - {name: name, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: value, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}

  DataConnectionParameterInput_parameters:
    unknown: warning
    attributes:
      - {name: attributes, schema: DataConnectionParameterInput_parameters_attributes, array: 1, description: "Seen in examples: the spec types the parent as a free-form object."}

  DataConnectionParameterInput_parameters_attributes:
    unknown: warning
    attributes:
      - {name: name, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: value, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}

  McBuToDataSpaceInputRepresentation:
    description: Input representation for Marketing Cloud business-unit-to-data-space mappings for a patch request.
    attributes:
      - {name: id, type: string, description: "ID of the asset. Since v58.0."}
      - {name: name, type: string, description: "Name of the asset. Since v58.0."}
      - {name: namespace, type: string, description: "Namespace of the asset. Since v58.0."}
      - {name: dataspace_name, api_name: dataspaceName, type: string, required: true, description: "Name of the data space. Since v63.0."}
      - {name: mid, type: string, required: true, description: "Member ID (MID) of the Marketing Cloud business unit. Specify a business unit already configured for ingestion or one passed for addition in the payload of the request. Since v63.0."}

  ResourceFilterByPropertyInputRepresentation:
    description: Input representation to filter fields and objects for a connection by property.
    attributes:
      - {name: filter_operator, api_name: filterOperator, type: string, enum: [EqualsOp, LikeOp, SubstrOp], required: true, description: "Filter operation to perform on the `name` and `values`. Since v62.0."}
      - {name: name, type: string, description: "Name of the property to filter against the `values` based on the `filter_group`. Since v60.0."}
      - {name: values, array: 1, type: string, required: true, description: "List of values on which to filter the `name` based on the `filter_operator`. Since v62.0."}
      - {name: operator, type: string, description: "Not in the spec schema: from the spec's examples."}

  ResourceFiltersInputRepresentation:
    description: Input representation for resource filters for a connection.
    attributes:
      - {name: filters_by_property, api_name: filtersByProperty, schema: ResourceFilterByPropertyInputRepresentation, array: 1, required: true, description: "List of filters that return only a specific subset of fields and objects for a connection. Since v63.0."}

