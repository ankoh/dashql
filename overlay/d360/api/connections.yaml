  - name: connection_test
    method: POST
    host: connect
    path: /ssot/connections/actions/test
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Connections/paths/~1ssot~1connections~1actions~1test/post
    tools: [d360_connection_test]
    description: Test a connection without creating it. Since v62.0.
    example: |
