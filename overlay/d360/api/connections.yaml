title: Connections
description: |
  A connection is the stored link between Data 360 and one outside system, such as Snowflake, S3, a CRM org or a website. A connector is the type, and a connection is one configured instance of it. Data streams read through a connection, so it comes first in any pipeline.

  The usual order is `connector_list` for the type token, `connector_metadata` for the attributes that type takes, `connection_test` to try them without saving, then `connection_create`. After that, the discovery calls show what a data stream could read: databases, schemas, objects, fields and a data preview.

  What matters most:

  - `connection_list` requires `connector_type`. There is no list-all call, and the token's casing varies by connector (`IngestApi`, `SNOWFLAKE`).
  - The option tables for `connection_create`, `connection_replace` and `connection_update` show only the fields common to all types. Their notes list the rest.
  - `credentials` is a list of `(param_name = ..., value = ...)` pairs.
  - `advanced_attributes` keys vary by connector, and sources disagree on names and form.
  - `connection_databases_list`, `connection_db_schemas_list`, `connection_preview_get` and the test calls work only for JDBC-shaped connectors, according to Salesforce's own [troubleshooting notes](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/troubleshooting.md).

  ```sql
  CALL cdp.connector_list (filters => 'name=SNOWFLAKE');

  CALL cdp.connector_metadata (connector_type => 'SNOWFLAKE');

  CALL cdp.connection_list (connector_type => 'SNOWFLAKE');

  CALL cdp.connection_objects_list (
    connection_id => '9cgaj0000012O5hAAE',
    advanced_attributes => (database = 'SNOWFLAKE_SAMPLE_DATA', schema = 'TPCH_SF1')
  );
  ```

functions:
  - name: connection_delete
    method: DELETE
    host: connect
    path: /ssot/connections/{connectionId}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Connections/paths/~1ssot~1connections~1%7BconnectionId%7D/delete
    tools: [d360_connection_delete]
    description: Delete a Data 360 connector. Since v60.0.
    example: CALL cdp.connection_delete (connection_id => '9cgaj0000012O5hAAE');
    options:
      - {name: connection_id, api_name: connectionId, in: path, type: string, required: true, description: "Record id of the connection, from `connection_list`."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 204). One row with only the standard columns.
    notes: |
      **Notes:** Dependent data streams break, per the [catalog](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/runtime/FamilyCatalog.java). The official [web and mobile guide](https://developer.salesforce.com/docs/data/data-cloud-int/guide/c360-a-mobile-web-app-connector-delete.md) says streams must be deleted first for those connectors, and a live test saw `DEPENDENCY_EXISTS` from others ([afd360](https://github.com/javrrr/afd360/blob/main/src/resources/connection.ts), community, one org).

      The same test saw a first attempt fail with `500 UNKNOWN_EXCEPTION` and a retry about 10 s later succeed. `DEPENDENCY_EXISTS` can also linger for seconds after the streams are gone (community, one org). Data connections have a `deletable` field in `connection_get`. The built-in `Salesforce_Home` connection is shared and shouldn't be deleted ([afd360](https://github.com/javrrr/afd360/blob/main/src/resources/connection.ts), community).

  - name: connection_list
    method: GET
    host: connect
    path: /ssot/connections
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Connections/paths/~1ssot~1connections/get
    tools: [d360_connection_list, d360_snowflake_connection_list]
    description: Get a paginated list of Data 360 connections that exist in an org by connector type. Since v60.0.
    example: CALL cdp.connection_list (connector_type => 'SNOWFLAKE', order_by => 'label', limit => 50);
    options:
      - {name: connector_type, api_name: connectorType, in: query, type: string, required: true, description: "Type of the connector. For example, `AwsRdsPostgres`, `AzureBlob`, `Databricks`, `Gcs`, `IngestApi`, `SalesforceDotCom`, `SalesforceMarketingCloud`, `Sftp`, `StreamingApp`, and so forth. Since v62.0."}
      - {name: dev_name, api_name: devName, in: query, type: string, description: "Developer name of the connector. Since v62.0."}
      - {name: label, in: query, type: string, description: "Label or public-facing name to filter on. Since v62.0."}
      - {name: limit, in: query, type: integer, description: "Maximum number of connections to return. Since v62.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. Must be greater than or equal to `0`. If unspecified, no rows are skipped. Since v62.0."}
      - {name: order_by, api_name: orderBy, in: query, type: string, description: "Sort connectors by field names. Supported field names are `label`, `created_date`, and `last_modified_date`. Since v62.0."}
      - {name: organization_id, api_name: organizationId, in: query, type: string, description: "Organization ID to filter on. Since v62.0."}
    rows: /connections
    columns:
      - {name: status, type: VARCHAR}
      - {name: tenant_specific_endpoint, api_name: tenantSpecificEndpoint, type: VARCHAR}
      - {name: alias, type: VARCHAR}
      - {name: connection_status, api_name: connectionStatus, type: VARCHAR}
      - {name: data_source, api_name: dataSource, type: VARCHAR}
      - {name: organization_id, api_name: organizationId, type: VARCHAR}
      - {name: activation_business_units, api_name: activationBusinessUnits, type: JSON, array: 1, schema: MarketingCloudConnectionBusinessUnitRepresentation}
      - {name: business_units_to_dataspaces, api_name: businessUnitsToDataSpaces, type: JSON, array: 1, schema: McBuToDataSpaceRepresentation}
      - {name: create_profile_bu_mappings, api_name: createProfileBuMappings, type: BOOLEAN}
      - {name: eid, type: VARCHAR}
      - {name: ingestion_business_units, api_name: ingestionBusinessUnits, type: JSON, array: 1, schema: MarketingCloudConnectionBusinessUnitRepresentation}
      - {name: modules, type: JSON, array: 1, schema: ConnectionModuleConfigRepresentation}
      - {name: source_id, api_name: sourceId, type: VARCHAR}
      - {name: streaming_app_sub_type, api_name: streamingAppSubType, type: VARCHAR}
      - {name: streaming_app_type, api_name: streamingAppType, type: VARCHAR}
      - {name: connector_label, api_name: connectorLabel, type: VARCHAR}
      - {name: credentials, type: JSON, array: 1, schema: DataConnectionParameterRepresentation}
      - {name: deletable, type: BOOLEAN}
      - {name: editable, type: BOOLEAN}
      - {name: icon_url, api_name: iconUrl, type: VARCHAR}
      - {name: last_data_change_error_code, api_name: lastDataChangeErrorCode, type: VARCHAR}
      - {name: last_sync_date, api_name: lastSyncDate, type: VARCHAR}
      - {name: method, type: VARCHAR}
      - {name: params, type: JSON, array: 1, schema: DataConnectionParameterRepresentation}
      - {name: sync_status, api_name: syncStatus, type: VARCHAR}
      - {name: connector_type, api_name: connectorType, type: VARCHAR, description: "The type of the Data Connector Framework (DCF) connector. The endpoint returns the connection output object that corresponds to the connector type: - `AccountEngagement`: Account Engagement Connection Output - `IngestApi`: Ingest API Connection Output - `SalesforceDotCom`: CRM Connection Output - `SalesforceMarketingCloud`: Marketing Cloud Connection Output - `StreamingApp`: Streaming App Connection Output - All others: Data Connection Output Since v60.0."}
      - {name: id, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
      - {name: label, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
      - {name: name, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
    paging: {kind: url, from: /nextPageUrl}
    effect: read
    evidence: O
    result_description: "One row per item of `/connections` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`. Schema `ConnectionRepresentation`."
    notes: |
      **Paging:** `next_page_url`.

      **Notes:** There's no list-all mode. The spec marks `connector_type` required, as do Salesforce's [catalog](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/runtime/FamilyCatalog.java) and a [one-org test](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md), although the [tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/MetadataTools.java) code treats it as optional. To see everything, run this once per `name` from `connector_list`.

      **Casing** is set per connector, with no rule. `IngestApi`, `SalesforceDotCom`, `AwsS3`, `AzureBlob` and `Databricks` are mixed case, and `SNOWFLAKE`, `BIGQUERY`, `GCS` and `SFTP` are upper case. A wrong token returns `400 ILLEGAL_QUERY_PARAMETER_VALUE`, such as `ConnectorType [Snowflake] is not supported` ([SDK](https://github.com/javrrr/data-360-sdk/blob/main/src/resources/connections.ts), community). The spec's description shows `Gcs` and `Sftp`, and its catalog example has lower case `hubspot`.

      The columns stop at `connectorType`, so `id`, `name` and `label` land in `_raw`. See [`connection_get`](#connection_get). An empty result usually means the feature is on and nothing is configured ([skill](https://github.com/Jaganpro/sf-skills/blob/main/skills/sf-datacloud-connect/SKILL.md), community). The [tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/MetadataTools.java) also passes `filter_group`, which the spec doesn't list here.

  - name: connection_get
    method: GET
    host: connect
    path: /ssot/connections/{connectionId}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Connections/paths/~1ssot~1connections~1%7BconnectionId%7D/get
    tools: [d360_connection_get]
    description: Get information about a Data 360 connection. Different connector types return different response payloads. For example, the response for a `StreamingApp` connector is different from the response for a `SalesforceMarketingCloud` connector. Since v60.0.
    example: CALL cdp.connection_get (connection_id => '9cgaj0000012O5hAAE');
    options:
      - {name: connection_id, api_name: connectionId, in: path, type: string, required: true, description: "Record id of the connection, from `connection_list`."}
    columns:
      - {name: status, type: VARCHAR}
      - {name: tenant_specific_endpoint, api_name: tenantSpecificEndpoint, type: VARCHAR}
      - {name: alias, type: VARCHAR}
      - {name: connection_status, api_name: connectionStatus, type: VARCHAR}
      - {name: data_source, api_name: dataSource, type: VARCHAR}
      - {name: organization_id, api_name: organizationId, type: VARCHAR}
      - {name: activation_business_units, api_name: activationBusinessUnits, type: JSON, array: 1, schema: MarketingCloudConnectionBusinessUnitRepresentation}
      - {name: business_units_to_dataspaces, api_name: businessUnitsToDataSpaces, type: JSON, array: 1, schema: McBuToDataSpaceRepresentation}
      - {name: create_profile_bu_mappings, api_name: createProfileBuMappings, type: BOOLEAN}
      - {name: eid, type: VARCHAR}
      - {name: ingestion_business_units, api_name: ingestionBusinessUnits, type: JSON, array: 1, schema: MarketingCloudConnectionBusinessUnitRepresentation}
      - {name: modules, type: JSON, array: 1, schema: ConnectionModuleConfigRepresentation}
      - {name: source_id, api_name: sourceId, type: VARCHAR}
      - {name: streaming_app_sub_type, api_name: streamingAppSubType, type: VARCHAR}
      - {name: streaming_app_type, api_name: streamingAppType, type: VARCHAR}
      - {name: connector_label, api_name: connectorLabel, type: VARCHAR}
      - {name: credentials, type: JSON, array: 1, schema: DataConnectionParameterRepresentation}
      - {name: deletable, type: BOOLEAN}
      - {name: editable, type: BOOLEAN}
      - {name: icon_url, api_name: iconUrl, type: VARCHAR}
      - {name: last_data_change_error_code, api_name: lastDataChangeErrorCode, type: VARCHAR}
      - {name: last_sync_date, api_name: lastSyncDate, type: VARCHAR}
      - {name: method, type: VARCHAR}
      - {name: params, type: JSON, array: 1, schema: DataConnectionParameterRepresentation}
      - {name: sync_status, api_name: syncStatus, type: VARCHAR}
      - {name: connector_type, api_name: connectorType, type: VARCHAR, description: "The type of the Data Connector Framework (DCF) connector. The endpoint returns the connection output object that corresponds to the connector type: - `AccountEngagement`: Account Engagement Connection Output - `IngestApi`: Ingest API Connection Output - `SalesforceDotCom`: CRM Connection Output - `SalesforceMarketingCloud`: Marketing Cloud Connection Output - `StreamingApp`: Streaming App Connection Output - All others: Data Connection Output Since v60.0."}
      - {name: id, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
      - {name: label, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
      - {name: name, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
    effect: read
    evidence: O
    result_description: One row. Schema `ConnectionRepresentation`.
    notes: |
      **Notes:** The spec's `ConnectionRepresentation` declares only `connector_type`. `id`, `name` and `label` are in no schema, although the spec's examples return them. All of these, and everything below, land in `_raw`:

      | `connector_type` | Spec schema | Fields |
      |---|---|---|
      | `AccountEngagement` | `AccountEngagementConnectionRepresentation` | `modules`, `source_id`, `tenant_specific_endpoint` |
      | `IngestApi` | `IngestApiConnectionRepresentation` | `status`, `tenant_specific_endpoint` |
      | `SalesforceDotCom` | `CrmConnectionRepresentation` | `alias`, `connection_status`, `data_source`, `organization_id` |
      | `SalesforceMarketingCloud` | `MarketingCloudConnectionRepresentation` | `activation_business_units`, `business_units_to_dataspaces`, `create_profile_bu_mappings`, `eid`, `ingestion_business_units` |
      | `StreamingApp` | `StreamingAppConnectionRepresentation` | `modules`, `source_id`, `status`, `streaming_app_sub_type`, `streaming_app_type`, `tenant_specific_endpoint` |
      | All others | `DataConnectionRepresentation` | `connector_label`, `credentials`, `deletable`, `editable`, `icon_url`, `last_data_change_error_code`, `last_sync_date`, `method`, `params`, `status`, `sync_status` |

      Data connections return settings as `params`, while create takes `parameters`. Credential values are masked, according to the spec and [afd360](https://github.com/javrrr/afd360/blob/main/src/resources/connection.ts) (community), so a read can't be used to copy a connection.

      `status` is `Connected`, `Disconnected`, `Failed` or `NeedsReAuth`. CRM `connection_status` is `Active`, `Deleting`, `Error`, `InActive`, `Processing` or `SchemaRequired`, yet a spec example shows `Connected`. A community tool saw `Processing`, `Active` and `Error` on data connections ([afd360](https://github.com/javrrr/afd360/blob/main/src/resources/connection.ts)).

      The [catalog](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/runtime/FamilyCatalog.java) text says "connector_type REQUIRED" here, but neither the spec nor the [tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/MetadataTools.java) has that option. The tool also passes `filter_group`, which the spec doesn't list on this call.

  - name: connection_endpoint_list
    method: GET
    host: connect
    path: /ssot/connections/{connectionId}/endpoints
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Connections/paths/~1ssot~1connections~1%7BconnectionId%7D~1endpoints/get
    description: Get the endpoints of an Ingestion API connector as a binary stream. The stream contains a YAML file that includes the OpenAPI definitions of the endpoints for the connector. You can push the returned data to a data lake object (DLO). Since v61.0.
    example: CALL cdp.connection_endpoint_list (connection_id => '9cgaj0000012O5hAAE');
    options:
      - {name: connection_id, api_name: connectionId, in: path, type: string, required: true, description: "Record id of an `IngestApi` connection."}
    effect: read
    evidence: O
    result_description: No response body (HTTP 200). One row with only the standard columns.
    notes: "**Notes:** The response is a binary YAML file, not an empty body as the result section implies, because the spec declares no response schema. The file has to reach `_raw` or it's lost. Other connectors return `INTERNAL_SERVER_ERROR` when they have no OpenAPI definition ([sf-pi](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/troubleshooting.md))."

  - name: connection_schema_list
    method: GET
    host: connect
    path: /ssot/connections/{connectionId}/schema
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Connections/paths/~1ssot~1connections~1%7BconnectionId%7D~1schema/get
    description: Get the schema model for a connection. Since v60.0.
    example: CALL cdp.connection_schema_list (connection_id => '9cgaj0000012O5hAAE');
    options:
      - {name: connection_id, api_name: connectionId, in: path, type: string, required: true, description: "Record id of the connection."}
    rows: /schemas
    columns:
      - {name: availability_status, api_name: availabilityStatus, type: VARCHAR}
      - {name: fields, type: JSON, array: 1, schema: ConnectorsFrameworkConnectionSchemaFieldRepresentation}
      - {name: category, type: VARCHAR}
      - {name: label, type: VARCHAR, description: "Label of the connector. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Developer name of the connector. Since v60.0."}
      - {name: schema_type, api_name: schemaType, type: VARCHAR, description: "Schema of the connector. Since v60.0."}
    effect: read
    evidence: O
    result_description: One row per item of `/schemas` in the response. Schema `ConnectionSchemaRepresentation`.
    notes: "**Notes:** Only some connector types work. The spec's `schema_type` allows `DataConnectionEvent`, `IngestApi` and `StreamingApp`. A community test found `AwsS3`, `Databricks` and `SalesforceDotCom` rejected with `400 ILLEGAL_QUERY_PARAMETER_VALUE`, `No enum constant ConnectionSchemaTypeEnum.<type>` ([SDK](https://github.com/javrrr/data-360-sdk/blob/main/src/resources/connections.ts)). [sf-pi](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/troubleshooting.md) calls this call web-connector specific, which doesn't match `IngestApi` being accepted. Each schema also has `fields`, in `_raw`."

  - name: connection_sitemap_get
    method: GET
    host: connect
    path: /ssot/connections/{connectionId}/sitemap
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Connections/paths/~1ssot~1connections~1%7BconnectionId%7D~1sitemap/get
    description: Get the sitemap for a Streaming App connection. Since v60.0.
    example: CALL cdp.connection_sitemap_get (connection_id => '9cgaj0000012O5hAAE');
    options:
      - {name: connection_id, api_name: connectionId, in: path, type: string, required: true, description: "Record id of a `StreamingApp` connection."}
    columns:
      - {name: sitemap, type: VARCHAR, description: "Sitemap of the Streaming App connector. Since v60.0."}
      - {name: sitemap_path, api_name: sitemapPath, type: VARCHAR, description: "Path to the sitemap of the Streaming App connector. Since v60.0."}
    effect: read
    evidence: O
    result_description: One row. Schema `ConnectionSitemapRepresentation`.
    notes: "**Notes:** This is the [Web SDK sitemap](https://developer.salesforce.com/docs/data/salesforce-interactions-sdk/guide/c360a-api-sitemap.md), which holds a website's data capture rules. It isn't the sitemap of the [Web Content connector](https://developer.salesforce.com/docs/data/data-cloud-int/guide/c360-a-web-content-sitemap-connector.md). Other connector kinds return enum or parameter errors ([sf-pi](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/troubleshooting.md))."

  - name: connector_list
    method: GET
    host: connect
    path: /ssot/connectors
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Connections/paths/~1ssot~1connectors/get
    tools: [d360_connector_list]
    description: Get a paginated list of Data 360 connectors, including high-level information and attributes for each connector. Since v62.0.
    example: CALL cdp.connector_list (field_group => 'BIG', order_by => 'label ASC');
    options:
      - {name: field_group, api_name: fieldGroup, in: query, type: string, description: "Number of fields to include in the results. Specify one of these values: - `SMALL` returns the fewest number of fields, including `name`, `label`, and a few others. - `MEDIUM` returns a greater number of fields. - `BIG` returns all fields. The default is `SMALL`. Since v62.0."}
      - {name: filters, in: query, type: string, description: "Field names by which to filter results. Specify a comma-separated list of values of the form `field=value`. For example, `name=AwsRdsPostgres` returns connectors whose name matches `AwsRdsPostgres`. By default, no filter is applied. Since v62.0."}
      - {name: order_by, api_name: orderBy, in: query, type: string, description: "Sort order for the results. You can order results by the field name `label` or `name`; by default, results are ordered by name. You can also list results in ascending (`ASC`) or descending (`DESC`) order; by default, results are listed in ascending order. For example, specify `label` or `label ASC` to list results by the `label` field and in ascending order. Omit both a field name and sort order to list results by connector name and in ascending order by default. Since v62.0."}
    rows: /connectorInfoList
    columns:
      - {name: description, type: VARCHAR, description: "Description of the connector. Since v62.0."}
      - {name: features, type: JSON, array: 1, schema: ConnectorFeatureRepresentation, description: "List of features of the connector. Since v62.0."}
      - {name: icon_url, api_name: iconUrl, type: VARCHAR, description: "URL for the icon of the connector. Since v62.0."}
      - {name: label, type: VARCHAR, description: "Label of the connector. Since v62.0."}
      - {name: name, type: VARCHAR, description: "Name of the connector. Since v62.0."}
      - {name: release_level, api_name: releaseLevel, type: VARCHAR, description: "Release level of the connector. Since v63.0."}
    paging: {kind: url, from: /nextPageUrl}
    effect: read
    evidence: O
    result_description: "One row per item of `/connectorInfoList` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`. Schema `ConnectorInfoRepresentation`."
    notes: |
      **Paging:** `next_page_url`.

      **Notes:** `name` is the token to pass to `connector_metadata`. For `connection_list`, a [community SDK](https://github.com/javrrr/data-360-sdk/blob/main/src/resources/connectors.ts) says it's also the exact `connector_type`, but [sf-pi](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/troubleshooting.md) gives a counterexample: CRM connections have `connector_type` `SalesforceDotCom`, while the catalog name is `SalesforceCRM`.

      `features` entries look like `{"featureType": "IncrementalUpdate", "config": {"deleteSupport": "true"}}`, with `Ingress`, `ObjectBased` and `Batch` also in the spec's example.

  - name: connector_metadata
    method: GET
    host: connect
    path: /ssot/connectors/{connectorType}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Connections/paths/~1ssot~1connectors~1%7BconnectorType%7D/get
    tools: [d360_connector_metadata]
    description: Get metadata about a Data 360 connector. Since v59.0.
    example: CALL cdp.connector_metadata (connector_type => 'AwsRdsSqlServer');
    options:
      - {name: connector_type, api_name: connectorType, in: path, type: string, required: true, description: "Type of the connector for which to return metadata. For example, possible connector types are `AccountEngagement`, `AwsRdsPostgres`, `Databricks`, `IngestApi`, `SalesforceDotCom`, `SalesforceMarketingCloud`, `StreamingApp`, and so forth. Since v62.0."}
    columns:
      - {name: advanced_attributes, api_name: advancedAttributes, type: JSON, description: "List of advanced attributes supported by the connector, which can include extract attributes and parser settings where applicable. The list of attributes is returned in the form `List<Map<String, Object>>`. Since v62.0."}
      - {name: connection_attributes, api_name: connectionAttributes, type: JSON, description: "List of connection attributes supported by the connector. The list of attributes is returned in the form `List<Map<String, Object>>`. Since v62.0."}
      - {name: description, type: VARCHAR, description: "Description of the connector. Since v62.0."}
      - {name: features, type: JSON, array: 1, schema: ConnectorFeatureRepresentation, description: "List of features of the connector. Since v62.0."}
      - {name: icon_url, api_name: iconUrl, type: VARCHAR, description: "URL for the icon of the connector. Since v62.0."}
      - {name: label, type: VARCHAR, description: "Label of the connector. Since v62.0."}
      - {name: name, type: VARCHAR, description: "Name of the connector. Since v62.0."}
      - {name: ingress_description, api_name: ingressDescription, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
      - {name: release_level, api_name: releaseLevel, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
      - {name: custom_error_labels, api_name: customErrorLabels, type: JSON, description: "Not in the spec schema: from the spec's examples."}
    effect: read
    evidence: O
    result_description: One row. Schema `ConnectorMetadataRepresentation`.
    notes: |
      **Notes:** Pass the catalog `name` from `connector_list`, not a connection's `connector_type`, or expect `NOT_FOUND`. For CRM it's `SalesforceCRM`, not `SalesforceDotCom` ([sf-pi](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/troubleshooting.md)).

      This is the only API source for a connector's attribute names. Entries of `connection_attributes` in the spec's example have `name`, `label`, `type`, `data_type`, `required`, `editable`, `ingress`, `placeholder`, `pattern`, `minLength`, `maxLength` and **`secure`**. There, `username` and `password` have `secure: true`: write those with `:name`. A live response used scalar and nullable attribute fields where the spec declares nested objects ([sf-pi](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/registry/connect-openapi-overrides.json)).

      `required` isn't the whole story: Snowflake's `region` and `unloadData` are marked optional but streams need them ([recipe](https://github.com/javrrr/afd360/blob/main/skills/afd360/references/connector-snowflake.md), community). The spec's example also returns `ingressDescription` and `releaseLevel`, which land in `_raw`.

