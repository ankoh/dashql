      - {name: credentials, in: body, schema: DataConnectionParameterInputRepresentation, array: 1, description: "List of `(param_name = ..., value = ...)` pairs, see [`connection_create`](#connection_create). Since v62.0."}
      - {name: method, in: body, type: string, enum: [Egress, Ingress], description: "Type of the data connection. The spec marks this optional, but [sf-pi](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/references/troubleshooting.md) says the test requires it. Since v62.0."}
