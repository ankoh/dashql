    notes: "**Notes:** This is the readiness check after [`dataaction_target_create`](#dataaction_target_create). The shape of `config` depends on `type`: a `WebHook` target returns `target_endpoint`, and a `Core` target returns `label` and `org_id`. Note `label` here, where the request says `org_label`. A community implementation found that a `Core` target [doesn't store `target_endpoint`](https://github.com/javrrr/afd360/blob/main/src/resources/data-action-target.ts), so don't diff it against what you sent (community). The output schema has no signing key field."

