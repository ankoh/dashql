    tools: [d360_dataaction_target_list]
    description: Get a paginated list of data action targets. Since v58.0.
    example: CALL cdp.dataaction_target_list ();
    options:
      - {name: batch_size, api_name: batchSize, in: query, type: integer, description: "Number of items returned. Since v58.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. If unspecified, no rows are skipped. Since v58.0."}
      - {name: order_by, api_name: orderby, in: query, type: string, description: "Sort order for the result set, such as `GenderId__c ASC,\\u200BOccupation__c DESC`. If unspecified, items are returned in the order they are retrieved. Since v58.0."}
    rows: /dataActionTargets
    columns:
      - {name: api_name, api_name: apiName, type: VARCHAR, description: "Developer name of the data action target. Since v62.0."}
      - {name: config, type: JSON, description: "Configuration for the data action target. The endpoint returns the config output object that corresponds to the type of data action target. For example, the Data Action Target Core Config Output is returned for the `Core` type. Since v62.0."}
      - {name: external_record_identifier, api_name: externalRecordIdentifier, type: VARCHAR, description: "External record ID. Since v62.0."}
      - {name: label, type: VARCHAR, description: "Data action target name. Since v62.0."}
      - {name: status, type: VARCHAR, description: "Status Since v62.0."}
      - {name: status_error_code, api_name: statusErrorCode, type: VARCHAR, description: "Status error code. Since v62.0."}
      - {name: sub_type, api_name: subType, type: VARCHAR, description: "Sub type Since v62.0."}
      - {name: type, type: VARCHAR, description: "Data action target type. Since v62.0."}
    paging: {kind: url, from: {body: /nextPageUrl}}
    effect: read
    evidence: O
    result_description: "One row per item of `/dataActionTargets` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`. Schema `CdpDataActionTargetOutputRepresentation`."
    notes: |
      **Paging:** `next_page_url`.

      **Notes:** Returns data action targets only, not activation targets. Spec examples return `type` and `status` in upper case (`WEBHOOK`, `ACTIVE`), while the spec's enums say `WebHook` and `Active`. Compare them case-insensitively. A community implementation [saw both spellings of `status`](https://github.com/javrrr/afd360/blob/main/src/resources/data-action-target.ts) (community).

