      - {name: config, in: body, schema: dataaction_create_config, description: "Not in the spec schema: from the MCP server's payload example."}
      - {name: data_action_status, api_name: dataActionStatus, in: body, type: string, description: "Not in the spec schema: from the MCP server's request class."}
      - {name: search_config, api_name: searchConfig, in: body, type: object, description: "Not in the spec schema: from the MCP server's request class."}
    columns:
      - {name: action_condition_expression, api_name: actionConditionExpression, type: VARCHAR, description: "The action's condition expression. Since v62.0."}
      - {name: action_conditions, api_name: actionConditions, type: JSON, array: 1, schema: DataActionConditionOutputRepresentation, description: "The action conditions. Since v62.0."}
      - {name: data_action_enrichment_properties, api_name: dataActionEnrichmentProperties, type: JSON, array: 1, schema: DataActionEnrichmentOutputRepresentation, description: "The data action enrichment properties. Since v62.0."}
      - {name: data_action_name, api_name: dataActionName, type: VARCHAR, description: "Data action's name. Since v62.0."}
      - {name: data_action_projected_fields, api_name: dataActionProjectedFields, type: JSON, array: 1, schema: DataActionProjectedFieldOutputRepresentation, description: "The data action's projected fields. Since v62.0."}
      - {name: data_action_sources, api_name: dataActionSources, type: JSON, array: 1, schema: DataActionSourceOutputRepresentation, description: "Data action sources. Since v62.0."}
      - {name: data_action_status, api_name: dataActionStatus, type: VARCHAR, description: "Data action's status. Since v62.0."}
      - {name: data_action_targets, api_name: dataActionTargets, type: JSON, description: "Data action targets. Since v62.0."}
      - {name: dataspace_dev_name, api_name: dataSpaceDevName, type: VARCHAR, description: "Developer name of the data space. Since v62.0."}
      - {name: description, type: VARCHAR, description: "Description of the data action. Since v62.0."}
      - {name: developer_name, api_name: developerName, type: VARCHAR, description: "Developer name of the data action. Since v62.0."}
      - {name: event_trigger_condition, api_name: eventTriggerCondition, type: VARCHAR, description: "Event trigger condition for the data action. Since v62.0."}
      - {name: external_record_identifier, api_name: externalRecordIdentifier, type: VARCHAR, description: "Data action's external record identifier. Since v62.0."}
      - {name: is_real_time_action, api_name: isRealTimeAction, type: BOOLEAN, description: "Indicates whether the data action is a real-time action (`true`) or not (`false`). Since v62.0."}
      - {name: last_action_status_date_time, api_name: lastActionStatusDateTime, type: VARCHAR, description: "Date and time that the most recent data action status was set. Since v62.0."}
      - {name: last_action_status_error_code, api_name: lastActionStatusErrorCode, type: VARCHAR, description: "Status of the data action's error code. Since v62.0."}
      - {name: master_label, api_name: masterLabel, type: VARCHAR, description: "Data action's master label. Since v62.0."}
      - {name: should_trigger_event_only_first_time, api_name: shouldTriggerEventOnlyFirstTime, type: BOOLEAN, description: "If `true`, the related event is triggered only the first time that the data action is used. If `false`, the event is triggered each time the data action is used. Since v62.0."}
      - {name: subscriber_key, api_name: subscriberKey, type: VARCHAR, description: "Data action subscriber key. Since v62.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `CdpDataActionOutputRepresentation`.
    notes: |
      **Done when:** `dataaction_list.data_action_status` is `Active` for the row with this `developer_name`. `Error` is terminal, with the reason in `last_action_status_error_code`. The create response itself shows `PROCESSING`. Compare case-insensitively.

      **Notes:** Salesforce's catalog says it [must have a target configured](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/runtime/FamilyCatalog.java). afd360 [waits for the target to reach `Active`](https://github.com/javrrr/afd360/blob/main/docs/resources.md) first (community).

      - **Nested attributes:** the spec types the four arrays as plain `object`. Their attributes come from the MCP request classes and spec examples: [DataActionSource](#dataactionsource), [DataActionCondition](#dataactioncondition), [DataActionProjectedField](#dataactionprojectedfield), [DataActionEnrichment](#dataactionenrichment).
      - **Required flags disagree:** the spec requires all four arrays, `action_condition_expression`, `description` and `master_label`. The MCP class has `description` and `master_label` optional. afd360's [body omits most of these](https://github.com/javrrr/afd360/blob/main/src/resources/data-action.ts) and reports it works (community). Sending them empty, as the spec example does, satisfies both.
      - **Two data spaces:** `dataspace` is the query parameter and `body_dataspace` the body attribute. afd360 says [create needs both](https://github.com/javrrr/afd360/blob/main/docs/resources.md) (community).
      - **Conditions:** in the spec examples `action_condition_expression` is `(1 AND 2)`, where the numbers refer to each condition's `order`. afd360 documents a filter such as `Score__c != null` instead (community).
      - **Timing:** projected fields exist only once the source DMO's fact table has materialized, up to about 90 seconds after the mapping. afd360 [retries on that error](https://github.com/javrrr/afd360/blob/main/src/resources/data-action.ts) (community).
      - **Attributes outside the spec:** the [MCP class](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/model/request/dataaction/DataActionCreateRequest.java) also has `data_action_status` and `search_config`, which the spec lacks.
      - **Limits:** [200 actions per tenant](https://help.salesforce.com/s/articleView?language=en_US&id=sf.c360_a_limits_and_guidelines.htm), and an [older page](https://help.salesforce.com/s/articleView?language=en_US&id=sf.c360_a_limits_and_guidelines_cdp.htm&type=5) says 10. The UI allows [up to 10 related attributes](https://developer.salesforce.com/blogs/2024/01/unleashing-the-power-of-data-actions-using-a-webhook-as-a-target) for enrichment (2024 blog).
      - **Calculated insights:** the same blog says the UI accepts them as a source. No source gives the `source_type` value.

  - name: dataaction_get
    method: GET
    host: connect
    path: /ssot/data-actions/{id}
    tools: [d360_dataaction_get]
    description: Reads one data action by developer name, to inspect its conditions, sources and targets.
    example: CALL cdp.dataaction_get (action_developer_name => 'High_Rate', dataspace => 'default');
    options:
      - {name: action_developer_name, api_name: id, in: path, type: string, required: true, description: "The data action developer name"}
      - {name: dataspace, in: query, type: string, description: "Dataspace name"}
    effect: read
    unknown: warning
    evidence: S
    result_description: The public sources don't document this response. One row, with the response in `_raw`.
    notes: "**Notes:** This path isn't in the spec. It comes from [Salesforce's MCP source](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/DataActionTools.java), which puts the developer name in the path despite the `{id}` placeholder in its annotation. The list and create calls return `CdpDataActionOutputRepresentation`, but no source says this one does. afd360 [avoids this call](https://github.com/javrrr/afd360/blob/main/src/resources/data-action.ts) and pages [`dataaction_list`](#dataaction_list) instead (community)."

  - name: dataaction_target_update
    method: PATCH
    host: connect
    path: /ssot/data-action-targets/{id}
    tools: [d360_dataaction_target_update]
    description: Changes an existing data action target, such as its endpoint URL. All body attributes are optional.
    example: CALL cdp.dataaction_target_update (target_api_name => 'contact_webhook', config => (target_endpoint = 'https://hooks.example.com/data360/v2'));
    options:
      - {name: target_api_name, api_name: id, in: path, type: string, required: true, description: "Developer name of the target to change."}
      - {name: api_name, api_name: apiName, in: body, type: string, description: "API name of the target."}
      - {name: label, in: body, type: string, description: "Display name of the target."}
      - {name: type, in: body, type: string, enum: [Core, Internal_WebHook, MarketingCloud, WebHook], description: "Target type."}
      - {name: sub_type, api_name: subType, in: body, type: string, enum: [Grpc, Rest], description: "Target sub type."}
      - {name: external_record_identifier, api_name: externalRecordIdentifier, in: body, type: string, description: "External record ID."}
      - {name: config, in: body, schema: DataActionTargetConfig, description: "Target configuration. Set only the attributes that apply to `type`."}
    effect: write
    unknown: warning
    evidence: S
    result_description: The public sources don't document this response. One row, with the response in `_raw`.
    notes: "**Notes:** The spec has no `PATCH` at this path, and neither does the Postman catalog. The only source is [Salesforce's MCP source](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/DataActionTools.java), whose [request class](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/model/request/dataaction/DataActionTargetUpdateRequest.java) gives these attributes. Its description also mentions credentials, but the class has no credential attribute. afd360 [deletes and recreates instead](https://github.com/javrrr/afd360/blob/main/src/resources/data-action-target.ts), because a `PATCH` on a target that an action references could leave a half-rebound endpoint (community)."

  - name: dataaction_update
    method: PATCH
    host: connect
    path: /ssot/data-actions/{name}
    description: Meant to change an existing data action. No public source documents this call or its body, so it has no body options here.
    example: CALL cdp.dataaction_update (action_developer_name => 'High_Rate');
    options:
      - {name: action_developer_name, api_name: name, in: path, type: string, required: true, description: "Developer name of the data action."}
    effect: write
    unknown: warning
    evidence: C
    result_description: The public sources don't document this response. One row, with the response in `_raw`.
    notes: "**Notes:** No source found supports this call. It isn't in the spec, the Postman catalog, Salesforce's MCP source or the community SDK and CLI plugin. afd360 [doesn't implement it and deletes and recreates instead](https://github.com/javrrr/afd360/blob/main/src/resources/data-action.ts) (community). Use [`dataaction_delete`](#dataaction_delete) and [`dataaction_create`](#dataaction_create) if the delete path works in your org."

  - name: dataaction_delete
    method: DELETE
    host: connect
    path: /ssot/data-actions/{name}
    description: Deletes a data action by developer name. Use it before deleting the action's target, or to recreate an action with new settings.
    example: CALL cdp.dataaction_delete (action_developer_name => 'High_Rate', dataspace => 'default');
    options:
      - {name: action_developer_name, api_name: name, in: path, type: string, required: true, description: "Developer name of the data action."}
      - {name: dataspace, in: query, type: string, description: "Data space that holds the action. The community source always sends it."}
    effect: write
    unknown: warning
    evidence: C
    result_description: The public sources don't document this response. One row, with the response in `_raw`.
    notes: "**Notes:** This path isn't in the spec. The only source is [afd360](https://github.com/javrrr/afd360/blob/main/src/resources/data-action.ts), which calls `DELETE /ssot/data-actions/{developerName}?dataspace=...` and treats a 404 as already deleted (community)."

schemas:
  CdpDataActionInput_dataActionSources:
    unknown: warning
    attributes:
      - {name: source_name, api_name: sourceName, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: source_type, api_name: sourceType, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: source_cdc_subscriptions, api_name: sourceCdcSubscriptions, array: 1, description: "Seen in examples: the spec types the parent as a free-form object."}

  CdpDataActionTargetCRMConfig:
    description: Represents the config input for CRM data action targets.
    attributes:
      - {name: api_contract, api_name: apiContract, type: string, description: "API contract for the data action target. Since v58.0."}
      - {name: target_endpoint, api_name: targetEndpoint, type: string, description: "Target endpoint. Since v58.0."}
      - {name: org_id, api_name: orgId, type: string, description: "ID for the target CRM org. Since v58.0."}
      - {name: org_label, api_name: orgLabel, type: string, description: "Label for the target CRM org. Since v58.0."}

  CdpDataActionTargetInternalWebConfig:
    description: Represents the config input for internal web data action targets.
    attributes:
      - {name: api_contract, api_name: apiContract, type: string, description: "API contract for the data action target. Since v58.0."}
      - {name: target_endpoint, api_name: targetEndpoint, type: string, description: "Target endpoint. Since v58.0."}

  CdpDataActionTargetMCConfig:
    description: Represents the config input for Marketing Cloud data action targets.
    attributes:
      - {name: api_contract, api_name: apiContract, type: string, description: "API contract for the data action target. Since v58.0."}
      - {name: target_endpoint, api_name: targetEndpoint, type: string, description: "Target endpoint. Since v58.0."}
      - {name: content_key, api_name: contentKey, type: string, description: "Content key for Marketing Cloud. Since v58.0."}
      - {name: content_template, api_name: contentTemplate, type: string, description: "Content template. Since v58.0."}

  CdpDataActionTargetWebConfig:
    description: Represents the config input for web data hook action targets.
    attributes:
      - {name: api_contract, api_name: apiContract, type: string, description: "API contract for the data action target. Since v58.0."}
      - {name: target_endpoint, api_name: targetEndpoint, type: string, description: "Target endpoint. Since v58.0."}

  DataActionCondition:
    attributes:
      - {name: object_name, api_name: objectName, type: string, description: "Object the condition reads, such as a `__dlm` name."}
      - {name: field_name, api_name: fieldName, type: string, description: "Field the condition reads."}
      - {name: operator, type: string, description: "Spec examples show `Equal`, `GreaterThan` and `LessThanOrEqualTo`. No source gives the full list."}
      - {name: value, type: string, description: "Value to compare against, as a string."}
      - {name: order, type: string, description: "Sequence number of the rule, as a string. `action_condition_expression` refers to it, as in `(1 AND 2)`."}
      - {name: condition_source_type, api_name: conditionSourceType, type: string, description: "Condition source type. The sources give no values."}
      - {name: condition_type, api_name: conditionType, type: string, description: "Separates regular conditions from additional ones."}
      - {name: data_graph_name, api_name: dataGraphName, type: string, description: "Data graph name, for conditions on a data graph."}
      - {name: object_data_graph_name, api_name: objectDataGraphName, type: string, description: "Unique object name in the data graph."}

  DataActionEnrichment:
    attributes:
      - {name: enrichment_name, api_name: enrichmentName, type: string, description: "Enrichment name."}
      - {name: data_graph_api_name, api_name: dataGraphApiName, type: string, description: "API name of the data graph."}
      - {name: data_action_projected_fields, api_name: dataActionProjectedFields, schema: DataActionProjectedField, array: 1, description: "Fields the enrichment adds to the event."}
      - {name: data_action_relationship_edges, api_name: dataActionRelationshipEdges, schema: DataActionRelationshipEdge, array: 1, description: "How the related object joins to the source."}

  DataActionProjectedField:
    attributes:
      - {name: object_api_name, api_name: objectApiName, type: string, description: "Object the field belongs to."}
      - {name: field_api_name, api_name: fieldApiName, type: string, description: "Source field to carry onto the event."}
      - {name: field_alias_name, api_name: fieldAliasName, type: string, description: "Field name on the event. afd360 uses it as the Platform Event field name (community)."}
      - {name: object_data_graph_name, api_name: objectDataGraphName, type: string, description: "Object name in the data graph."}

  DataActionRelationshipEdge:
    attributes:
      - {name: source_object_api_name, api_name: sourceObjectApiName, type: string, description: "Object on the source side."}
      - {name: source_field_api_name, api_name: sourceFieldApiName, type: string, description: "Join field on the source side."}
      - {name: target_object_api_name, api_name: targetObjectApiName, type: string, description: "Object on the target side."}
      - {name: target_field_api_name, api_name: targetFieldApiName, type: string, description: "Join field on the target side."}
      - {name: target_object_data_graph_name, api_name: targetObjectDataGraphName, type: string, description: "Target object's name in the data graph."}

  DataActionSource:
    attributes:
      - {name: source_name, api_name: sourceName, type: string, description: "Source object. A `DataModelEntity` source is the full DMO name ending in `__dlm` (community). Returned as `objectDevName`."}
      - {name: source_type, api_name: sourceType, type: string, description: "`DataModelEntity` for a DMO in the spec example. afd360 also names `DataGraph` (community). Returned as `objectType`."}
      - {name: source_cdc_subscriptions, api_name: sourceCdcSubscriptions, array: 1, type: string, description: "Changes that fire the action. The spec example uses `CREATE`, `UPDATE`, `DELETE`. The MCP class and afd360 use `Create`, `Update`, `Delete`. Returned as `subscriptionModes`."}
      - {name: actions_source_object, api_name: actionsSourceObject, type: string, description: "Source object for the action. For `DataGraph` sources only (community)."}
      - {name: actions_source_object_path, api_name: actionsSourceObjectPath, type: string, description: "Path to the source object. For `DataGraph` sources only (community)."}
      - {name: actions_source_object_type, api_name: actionsSourceObjectType, type: string, description: "Source object type. For `DataGraph` sources only (community)."}

  DataActionTargetConfig:
    unknown: warning
    attributes:
      - {name: target_endpoint, api_name: targetEndpoint, type: string, description: "`WebHook`: the URL that receives events. `MarketingCloud`: the events endpoint in the spec example. `Core`: see the source conflict under [`dataaction_target_create`](#dataaction_target_create)."}
      - {name: api_contract, api_name: apiContract, type: string, description: "API contract for the target."}
      - {name: org_id, api_name: orgId, type: string, description: "`Core` only. ID of the target CRM org."}
      - {name: org_label, api_name: orgLabel, type: string, description: "`Core` only. Label of the target CRM org. Returned as `label`."}
      - {name: content_key, api_name: contentKey, type: string, description: "`MarketingCloud` only. Content key."}
      - {name: content_template, api_name: contentTemplate, type: string, description: "`MarketingCloud` only. Content template. The spec example passes an API event name."}
      - {name: data_action_destination_type, api_name: dataActionDestinationType, type: string, description: "`MarketingCloud`. Appears only in the spec example, with the value `API_EVENT`."}
      - {name: service_name, api_name: serviceName, type: string, description: "`WebHook` with `sub_type` `Grpc` only. Name of the gRPC service (MCP source only)."}
      - {name: method_name, api_name: methodName, type: string, description: "`WebHook` with `sub_type` `Grpc` only. gRPC method to invoke (MCP source only)."}
      - {name: proto_buffer_content, api_name: protoBufferContent, type: string, description: "`WebHook` with `sub_type` `Grpc` only. Contents of the proto definition (MCP source only)."}
      - {name: mapping_config, api_name: mappingConfig, schema: DataActionTargetGrpcMappingConfig, description: "`WebHook` with `sub_type` `Grpc` only. Maps the event payload to the gRPC message (MCP source only)."}
      - {name: custom_metadata, api_name: customMetadata, type: object, description: "`WebHook` with `sub_type` `Grpc` only. String map of metadata sent with the gRPC request (MCP source only)."}

  DataActionTargetGrpcMappingConfig:
    unknown: warning
    attributes:
      - {name: array_field, api_name: arrayField, type: string, description: "Array field. The MCP source says no more."}
      - {name: event_mappings, api_name: eventMappings, type: object, description: "String map of the event payload mapping."}

  dataaction_create_config:
    unknown: warning
    attributes:
      - {name: type, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: template, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: target_audience, api_name: targetAudience, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: recipient_field, api_name: recipientField, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: personalization_fields, api_name: personalizationFields, array: 1, description: "Seen in examples: the spec types the parent as a free-form object."}

  dataaction_target_create.config:
    variants: [CdpDataActionTargetCRMConfig, CdpDataActionTargetInternalWebConfig, CdpDataActionTargetMCConfig, CdpDataActionTargetWebConfig]
