title: Identity Resolutions
description: |
  Identity resolution merges records of the same person or account from different sources into one unified profile. A ruleset has two parts. Match rules decide which records belong together. Reconciliation rules decide which value wins on the unified profile.

  Rulesets sit between mappings and everything that reads unified data. [Mapping must be complete before you create one](https://developer.salesforce.com/blogs/2024/10/data-cloud-and-identity-resolution), and [calculated insights and segments refresh after it](https://github.com/salesforce-misc/Data360AgentforceSolutionKitRetail/blob/main/.claude/skills/refresh-data-cloud-components/SKILL.md). The order is: map DLOs to DMOs, `ir_create`, `ir_run`, then poll `ir_get`.

  The traps:

  - `ruleset_id` [can't be changed](https://trailhead.salesforce.com/content/learn/modules/data-and-identity-in-salesforce-cdp/configure-identity-resolution-rules) and shapes the names of the generated DMOs, so choose it before creating.
  - Wait on `last_job_status`, not `ruleset_status`. Ignore `last_job_completed` while a run is active, because it still shows the previous run.
  - `ir_run` can return HTTP 200 without starting anything. Read `result_code`.
  - A run took [about 15 minutes in one org](https://github.com/salesforce-misc/Data360AgentforceSolutionKitRetail/blob/main/.claude/skills/refresh-data-cloud-components/SKILL.md), and a community CLI warns that runs cost credits (community).
  - The sources disagree on enum casing. See [`ir_create`](#ir_create).

  ```sql
  CALL cdp.ir_create (label => 'Email Match', configuration_type => 'Individual', ruleset_id => 'mail',
    match_rules => [(label = 'Normalized Email', criteria = [(entity_name = 'ssot__ContactPointEmail__dlm', field_name = 'ssot__EmailAddress__c', match_method_type = 'exactnormalized', should_match_on_blank = false)])],
    reconciliation_rules => [(entity_name = 'ssot__Individual__dlm', rule_type = 'lastupdated', should_ignore_empty_value = true)]);
  CALL cdp.ir_run (identity_resolution => '1irfj000000IWhWAAW');
  CALL cdp.ir_get (identity_resolution => '1irfj000000IWhWAAW');
  ```

functions:
  - name: ir_delete
    method: DELETE
    host: connect
    path: /ssot/identity-resolutions/{identityResolution}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Identity-Resolutions/paths/~1ssot~1identity-resolutions~1%7BidentityResolution%7D/delete
    tools: [d360_ir_delete]
    description: Delete an identity resolution ruleset in Data 360. Since v57.0.
    example: CALL cdp.ir_delete (identity_resolution => '1irfj000000IWhWAAW');
    options:
      - {name: identity_resolution, api_name: identityResolution, in: path, type: string, required: true, description: "Developer name or ID of the ruleset (spec). Use `id`: see [`ir_get`](#ir_get)."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 204). One row with only the standard columns.
    notes: "**Notes:** Use the `id` from `ir_list`: see [`ir_get`](#ir_get). `ruleset_status` has `DELETING` and `DELETE_FAILED`, which suggests a 204 may not mean the delete finished, but no source describes it. The [MCP server](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/IdentityResolutionTools.java) only warns that \"active resolutions may be affected\". Nothing lists what happens to the generated DMOs or to the insights and segments that read them, so check those first."

  - name: ir_list
    method: GET
    host: connect
    path: /ssot/identity-resolutions
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Identity-Resolutions/paths/~1ssot~1identity-resolutions/get
    tools: [d360_ir_list]
    description: Get identity resolution rulesets in Data 360. Since v57.0.
    example: CALL cdp.ir_list ();
    rows: /identityResolutions
    columns:
      - {name: anonymous_unified_profiles, api_name: anonymousUnifiedProfiles, type: BIGINT, description: "Count of anonymous unified profiles created by running the identity resolution ruleset. Since v57.0."}
      - {name: configuration_type, api_name: configurationType, type: VARCHAR, description: "Source object for an identity resolution. Since v57.0."}
      - {name: consolidation_rate, api_name: consolidationRate, type: DOUBLE, description: "Consolidation rate resulting from the run of an identity resolution ruleset. Since v57.0."}
      - {name: dataspace_name, api_name: dataSpaceName, type: VARCHAR, description: "Data space used as source data for an identity resolution ruleset. Since v57.0."}
      - {name: description, type: VARCHAR, description: "Description of the identity resolution ruleset. Since v57.0."}
      - {name: does_run_automatically, api_name: doesRunAutomatically, type: BOOLEAN, description: "Specifies whether automatic job run scheduling is enabled for the ruleset (`true`) or not (`false`). If unspecified, defaults to `false`. Since v57.0."}
      - {name: id, type: VARCHAR, description: "Identity resolution ruleset's ID. This is not the identity resolution's extended ruleset ID (`ruleset_id`). Since v57.0."}
      - {name: known_unified_profiles, api_name: knownUnifiedProfiles, type: BIGINT, description: "Count of known unified profiles created by running the identity resolution ruleset. Since v57.0."}
      - {name: label, type: VARCHAR, description: "User friendly name of the identity resolution ruleset. Since v57.0."}
      - {name: last_job_completed, api_name: lastJobCompleted, type: VARCHAR, description: "Date and time the last job completed. Since v57.0."}
      - {name: last_job_status, api_name: lastJobStatus, type: VARCHAR, description: "Last job's status. Possible values are: - `SUCCESS` - `IN_PROGRESS` - `FAIL` - `SCHEDULED` - `SKIPPED` Since v57.0."}
      - {name: match_rules, api_name: matchRules, type: JSON, array: 1, schema: CdpIdentityResolutionMatchRuleOutput, description: "List of match rules. Since v57.0."}
      - {name: matched_source_profiles, api_name: matchedSourceProfiles, type: BIGINT, description: "Count of matched source profiles identified by running the identity resolution ruleset. Since v57.0."}
      - {name: object_api_name, api_name: objectApiName, type: VARCHAR, description: "Object name of the identity resolution ruleset. Since v57.0."}
      - {name: reconciliation_rules, api_name: reconciliationRules, type: JSON, array: 1, schema: CdpIdentityResolutionReconciliationRuleOutput, description: "List of reconciliation rules. Since v57.0."}
      - {name: ruleset_id, api_name: rulesetId, type: VARCHAR, description: "Extension ID of a ruleset. The ruleset ID must be unique and no longer than 4 characters. This ID is not the identifying ID for the ruleset. Since v57.0."}
      - {name: ruleset_status, api_name: rulesetStatus, type: VARCHAR, description: "Status of a ruleset job. Possible values are: - `NEW` - `PUBLISHING` - `PUBLISHED` - `ERROR` - `DELETING` - `DELETE_FAILED` Since v57.0."}
      - {name: source_profiles, api_name: sourceProfiles, type: BIGINT, description: "Count of source profiles that were processed by a ruleset job. Since v57.0."}
      - {name: total_unified_profiles, api_name: totalUnifiedProfiles, type: BIGINT, description: "Count of unified profiles created by running the identity resolution ruleset. Since v57.0."}
      - {name: secondary_dmo, api_name: secondaryDmo, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
    effect: read
    evidence: O
    result_description: One row per item of `/identityResolutions` in the response. Schema `CdpIdentityResolutionOutputRepresentation`.
    notes: "**Notes:** Each row has the full rules, [so one call is enough](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md) (community). There's no data space filter, so [filter on `dataspace_name` yourself](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md) (community). Rulesets [have no developer name](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md) (community), so find one by `label` and use its `id`. The [MCP tool](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/IdentityResolutionTools.java) sends an optional `filter_group` query parameter that the spec doesn't list."

  - name: ir_get
    method: GET
    host: connect
    path: /ssot/identity-resolutions/{identityResolution}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Identity-Resolutions/paths/~1ssot~1identity-resolutions~1%7BidentityResolution%7D/get
    tools: [d360_ir_get]
    description: Get an identity resolution ruleset in Data 360. Since v57.0.
    example: CALL cdp.ir_get (identity_resolution => '1irfj000000IWhWAAW');
    options:
      - {name: identity_resolution, api_name: identityResolution, in: path, type: string, required: true, description: "Developer name or ID of the ruleset (spec). Use `id`, see the notes."}
    columns:
      - {name: anonymous_unified_profiles, api_name: anonymousUnifiedProfiles, type: BIGINT, description: "Count of anonymous unified profiles created by running the identity resolution ruleset. Since v57.0."}
      - {name: configuration_type, api_name: configurationType, type: VARCHAR, description: "Source object for an identity resolution. Since v57.0."}
      - {name: consolidation_rate, api_name: consolidationRate, type: DOUBLE, description: "Consolidation rate resulting from the run of an identity resolution ruleset. Since v57.0."}
      - {name: dataspace_name, api_name: dataSpaceName, type: VARCHAR, description: "Data space used as source data for an identity resolution ruleset. Since v57.0."}
      - {name: description, type: VARCHAR, description: "Description of the identity resolution ruleset. Since v57.0."}
      - {name: does_run_automatically, api_name: doesRunAutomatically, type: BOOLEAN, description: "Specifies whether automatic job run scheduling is enabled for the ruleset (`true`) or not (`false`). If unspecified, defaults to `false`. Since v57.0."}
      - {name: id, type: VARCHAR, description: "Identity resolution ruleset's ID. This is not the identity resolution's extended ruleset ID (`ruleset_id`). Since v57.0."}
      - {name: known_unified_profiles, api_name: knownUnifiedProfiles, type: BIGINT, description: "Count of known unified profiles created by running the identity resolution ruleset. Since v57.0."}
      - {name: label, type: VARCHAR, description: "User friendly name of the identity resolution ruleset. Since v57.0."}
      - {name: last_job_completed, api_name: lastJobCompleted, type: VARCHAR, description: "Date and time the last job completed. Since v57.0."}
      - {name: last_job_status, api_name: lastJobStatus, type: VARCHAR, description: "Last job's status. Possible values are: - `SUCCESS` - `IN_PROGRESS` - `FAIL` - `SCHEDULED` - `SKIPPED` Since v57.0."}
      - {name: match_rules, api_name: matchRules, type: JSON, array: 1, schema: CdpIdentityResolutionMatchRuleOutput, description: "List of match rules. Since v57.0."}
      - {name: matched_source_profiles, api_name: matchedSourceProfiles, type: BIGINT, description: "Count of matched source profiles identified by running the identity resolution ruleset. Since v57.0."}
      - {name: object_api_name, api_name: objectApiName, type: VARCHAR, description: "Object name of the identity resolution ruleset. Since v57.0."}
      - {name: reconciliation_rules, api_name: reconciliationRules, type: JSON, array: 1, schema: CdpIdentityResolutionReconciliationRuleOutput, description: "List of reconciliation rules. Since v57.0."}
      - {name: ruleset_id, api_name: rulesetId, type: VARCHAR, description: "Extension ID of a ruleset. The ruleset ID must be unique and no longer than 4 characters. This ID is not the identifying ID for the ruleset. Since v57.0."}
      - {name: ruleset_status, api_name: rulesetStatus, type: VARCHAR, description: "Status of a ruleset job. Possible values are: - `NEW` - `PUBLISHING` - `PUBLISHED` - `ERROR` - `DELETING` - `DELETE_FAILED` Since v57.0."}
      - {name: source_profiles, api_name: sourceProfiles, type: BIGINT, description: "Count of source profiles that were processed by a ruleset job. Since v57.0."}
      - {name: total_unified_profiles, api_name: totalUnifiedProfiles, type: BIGINT, description: "Count of unified profiles created by running the identity resolution ruleset. Since v57.0."}
      - {name: secondary_dmo, api_name: secondaryDmo, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
    effect: read
    evidence: O
    result_description: One row. Schema `CdpIdentityResolutionOutputRepresentation`.
    notes: |
      **Notes:** **Which field to read.** The [retail kit](https://github.com/salesforce-misc/Data360AgentforceSolutionKitRetail/blob/main/.claude/skills/refresh-data-cloud-components/SKILL.md) checked these against one org on 2026-06-10:

      | Field | Use it for | Trap |
      |---|---|---|
      | `last_job_status` | Whether the current run finished. The only field to wait on. | The spec lists `FAIL`, and the kit observed `FAILED` (one org). Treat both as failure. Values are uppercase there, and Title Case comparisons "will silently never match". |
      | `ruleset_status` | Whether the definition is published | The spec calls it the "status of a ruleset job", but the kit says it's "NOT a per-run status". |
      | `last_job_completed` | When an earlier run ended | Stale during a run: it "reflects the PREVIOUS completed run". Don't compare it to now. |

      **Generated DMOs:** `reconciliation_rules[].unifiedDmoName` and `linkDmoName` are the real table names to query. See [`ir_create`](#ir_create).

      **Id or name:** the spec says the path takes the "developer name or ID", and the [Marketing Cloud guide](https://developer.salesforce.com/docs/marketing/marketing-cloud-growth/guide/mc-manage-identity-resolution-run-now.md) calls it the ruleset name. But responses [have no developer name](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md) (community), and an SDK says [every item call needs the `id`](https://github.com/javrrr/data-360-sdk/blob/main/src/resources/identity-resolutions.ts) (community). Use `id` from `ir_list`, for example `1irfj000000IWhWAAW`. It isn't `ruleset_id`.

      **Fields beyond the spec:** `ruleset_id` is missing from the spec's `ir_get` example and a [live fixture](https://github.com/dsouza-anush/sf-plugin-data360/blob/main/test/fixtures/live/identity-resolution-get.json) (community), so expect `NULL`. That fixture also returns `secondaryDmo`, `filters` and `isCaseSensitive`, which the spec's schema doesn't list, so they land in `_raw`. It shows `consolidation_rate` 75 with 8 source profiles and 2 unified profiles, so the value looks like a percentage (community, one org). `object_api_name` is [the name without a suffix](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md), such as `Individual` (community).

