title: Activation Targets
description: |
  An activation target is a destination for segment data: a file drop such as Amazon S3 or SFTP, Marketing Cloud, Data 360 itself, or an ad platform. You set it up once, then [`activation_create`](activations.md#activation_create) sends a segment to it by `activation_target_name`. So the order is: find the platform, create the target, check that it's active, and only then create the activation.

  The gotchas that matter most:

  - **The spec undersells `connector`.** Its schema lists only `name` and `output_format`, while its own examples send more per platform. [`activation_target_create`](#activation_target_create) has the table.
  - **Enum spelling isn't stable.** The schema says `Active`, examples show `ACTIVE`, and filters use `active`. Compare without case.
  - **Id or name depends on the call.** Enable and disable take an 18-character id. Get, update and delete claim both, but [one org](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md) found id only (community).
  - **Availability is uneven.** Enable, disable, retry, ad accounts and the `metadata` lists are `Since v67.0`, and ad connectors such as Google Ads need an [add-on license](https://developer.salesforce.com/docs/data/data-cloud-int/guide/c360-a-googleadsadaudiences-connector.md).
  - **Gated orgs.** `CdpActivationTarget` or `CdpActivationExternalPlatform` means the surface is [gated for this org or user](https://github.com/forcedotcom/sf-skills/blob/2476476dda1b671762c6e963b9d10c4a7056f1c4/skills/data360-activate/SKILL.md), so don't retry blindly.

  ```sql
  CALL cdp.activation_platform_metadata_list (platform_type => 'Sftp');

  CALL cdp.activation_target_create (
    name => 'sftp_exports',
    dataspace_name => 'default',
    platform_type => 'Sftp',
    connector => (name = 'sftpTargetConnector'),
    egress_properties => (predetermined_filename = 'SegmentActivation', filename_date_suffix_format = 'yyyy-MM-dd-HH-mm-ss', output_delimiter = 'Comma', output_compression_format = 'Gzip', output_max_file_size_mega_bytes = 500, output_format = 'CSV')
  );

  /* Wait for status Active, using the id from the create result */
  CALL cdp.activation_target_get (activation_target_id => '85USB000004ADXx2AO');
  ```

functions:
  - name: activation_target_delete
    method: DELETE
    host: connect
    path: /ssot/activation-targets/{activationTargetId}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Activation-Targets/paths/~1ssot~1activation-targets~1%7BactivationTargetId%7D/delete
    description: Delete an activation target by ID or developer name. Since v60.0.
    example: CALL cdp.activation_target_delete (activation_target_id => '85UVF000000Dr4v2AC');
    options:
      - {name: activation_target_id, api_name: activationTargetId, in: path, type: string, required: true, description: "ID or developer name, per the spec. See the conflict noted on `activation_target_get`."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 200). One row with only the standard columns.
    notes: "**Notes:** The spec doesn't say what happens to activations that still use the target. [`activation_platform_delete`](activation_platforms.md#activation_platform_delete) documents a 412 when a platform is referenced, but no such rule is documented here. For id versus name, see [`activation_target_get`](#activation_target_get)."

  - name: activation_target_list
    method: GET
    host: connect
    path: /ssot/activation-targets
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Activation-Targets/paths/~1ssot~1activation-targets/get
    tools: [d360_activation_target_list]
    description: Get a list of activation targets with selected filters. Since v60.0.
    example: CALL cdp.activation_target_list (filters => 'targetStatus in active AND platformName in Amazon S3', order_by => 'createdDate desc', batch_size => 50);
    options:
      - {name: batch_size, api_name: batchSize, in: query, type: integer, description: "Number of results to return. Values are from `1` through `200`. If unspecified, the default value is `20`. Since v60.0."}
      - {name: filters, in: query, type: string, description: "Filter expression using `in`, joined with `AND`. Fields: `master_label` (target name), `targetStatus` (such as `active`), `connectionType` (a `platform_type` value) and `platform_name`. Spec examples: `targetStatus in active AND platform_name in Amazon S3`, `MasterLabel in Target002`. Since v60.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. Must be greater than or equal to `0`. If unspecified, no rows are skipped. Since v60.0."}
      - {name: order_by, api_name: orderBy, in: query, type: string, description: "Sort order for the result set by `created_date`. If unspecified, items are returned by ID in ascending order. Since v60.0."}
    rows: /activationTargets
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: connector, type: JSON, schema: DataConnectorRepresentation, description: "Details about the connector that is used for the activation target. Since v60.0."}
      - {name: dataspace_name, api_name: dataSpaceName, type: VARCHAR, description: "Data space name for this activation target. Since v60.0."}
      - {name: description, type: VARCHAR, description: "Description of the activation target. Since v60.0."}
      - {name: egress_properties, api_name: egressProperties, type: JSON, schema: EgressPropertiesRepresentation, description: "Egress properties for the activation target, which are applicable only for file-based activation targets. Since v63.0."}
      - {name: history_audience_dmo_api_name, api_name: historyAudienceDmoApiName, type: VARCHAR, description: "API name for the history audience DMO. Since v60.0."}
      - {name: history_audience_dmo_label, api_name: historyAudienceDmoLabel, type: VARCHAR, description: "Name of the history audience DMO. Since v60.0."}
      - {name: is_capping_enabled, api_name: isCappingEnabled, type: BOOLEAN, description: "Indicates whether communication capping is enabled for the activation (`true`) or not (`false`). Since v60.0."}
      - {name: is_enabled, api_name: isEnabled, type: BOOLEAN, description: "Indicates whether the activation target is enabled (`true`) or not (`false`). Since v60.0."}
      - {name: latest_audience_dmo_api_name, api_name: latestAudienceDmoApiName, type: VARCHAR, description: "API name for the latest audience DMO. Since v62.0."}
      - {name: latest_audience_dmo_label, api_name: latestAudienceDmoLabel, type: VARCHAR, description: "Name of the latest audience DMO. Since v62.0."}
      - {name: organization_id, api_name: organizationId, type: VARCHAR, description: "Organization ID of the activation target. Since v60.0."}
      - {name: platform_name, api_name: platformName, type: VARCHAR, description: "Platform name for the activation target. Since v60.0."}
      - {name: platform_privacy_type, api_name: platformPrivacyType, type: VARCHAR, description: "Platform privacy type for the activation target. Derived from Activation Platform. Since v60.0."}
      - {name: platform_type, api_name: platformType, type: VARCHAR, description: "Platform type for the activation target. Since v60.0."}
      - {name: status, type: VARCHAR, description: "Target status of the activation target. Since v60.0."}
    paging: {kind: offset, option: offset, size: batch_size, start: 0}
    effect: read
    evidence: O
    result_description: "One row per item of `/activationTargets` in the response. Other response fields go to `_meta`: `batchSize`, `offset`, `orderByExpression`. Schema `ActivationTargetRepresentation`."
    notes: |
      **Paging:** `batch_size`, `offset` from 0 ([community, one org](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md)). The response has no `total_size`.

      **Notes:** There's no data space option, and [one org](https://github.com/szymonlewandowski/config-snapshot-data360/blob/main/docs/api-quirks.md) found the endpoint doesn't support one, so filter on `dataspace_name` yourself (community). `status` can arrive in spellings the schema doesn't declare: [`sf-pi` accepts this as a known exception](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/registry/connect-openapi-overrides.json) based on a live response, and the spec's own example shows `ACTIVE` against a declared `Active`. The spec's list example leaves out `connector`, `egress_properties` and `is_enabled`, so use `activation_target_get` when you need those. The `filters` language here (`in`) differs from the `eq` and `contains` language of the `metadata` lists in this section.

