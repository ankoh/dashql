    host: connect
    path: /ssot/activation-targets/actions/{activationTargetId}/disable
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Activation-Targets/paths/~1ssot~1activation-targets~1actions~1%7BactivationTargetId%7D~1disable/post
    description: Disables an activation target. Since v67.0.
    example: CALL cdp.activation_target_disable (activation_target_id => '85UVF000000Dr4v2AC', dataspace => 'default');
    options:
      - {name: activation_target_id, api_name: activationTargetId, in: path, type: string, required: true, description: "Record ID (18-character) of the activation target to disable. Since v67.0."}
      - {name: dataspace, api_name: dataSpace, in: query, type: string, description: "Name of the data space to use as context for the request. Since v67.0."}
    columns:
      - {name: message, type: VARCHAR, description: "Human-readable status or warning message. Can be null on success. Since v67.0."}
      - {name: success, type: BOOLEAN, description: "Indicates whether the action completed successfully (`true`) or not (`false`). Since v67.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `ActionResultRepresentation`.
    notes: "**Notes:** The spec asks for the 18-character record id, not the name. It doesn't say what happens to activations that use the target. Read `success`, as the spec doesn't say whether a failure can return 200."

  - name: activation_target_enable
    method: POST
    host: connect
    path: /ssot/activation-targets/actions/{activationTargetId}/enable
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Activation-Targets/paths/~1ssot~1activation-targets~1actions~1%7BactivationTargetId%7D~1enable/post
    description: Enables an activation target. Since v67.0.
    example: CALL cdp.activation_target_enable (activation_target_id => '85UVF000000Dr4v2AC', dataspace => 'default');
    options:
      - {name: activation_target_id, api_name: activationTargetId, in: path, type: string, required: true, description: "Record ID (18-character) of the activation target to enable. Since v67.0."}
      - {name: dataspace, api_name: dataSpace, in: query, type: string, description: "Name of the data space to use as context for the request. Since v67.0."}
    columns:
      - {name: message, type: VARCHAR, description: "Human-readable status or warning message. Can be null on success. Since v67.0."}
      - {name: success, type: BOOLEAN, description: "Indicates whether the action completed successfully (`true`) or not (`false`). Since v67.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `ActionResultRepresentation`.
    notes: "**Notes:** The spec asks for the 18-character record id, not the name. The [Google Ads setup](https://developer.salesforce.com/docs/data/data-cloud-int/guide/c360-a-googleadsadaudiences-setup.md) ends with an Enable click after OAuth, and no source says whether this call replaces that step. Read `success`, as the spec doesn't say whether a failure can return 200."

  - name: activation_target_sync_retry
    method: POST
    host: connect
    path: /ssot/activation-targets/actions/{activationTargetId}/retry-sync
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Activation-Targets/paths/~1ssot~1activation-targets~1actions~1%7BactivationTargetId%7D~1retry-sync/post
    description: Retries the sync for an activation target. Since v67.0.
    example: CALL cdp.activation_target_sync_retry (activation_target_id => '85USB000004LBZF2A4');
    options:
      - {name: activation_target_id, api_name: activationTargetId, in: path, type: string, required: true, description: "Record ID (15- or 18-character) of the activation target. Since v67.0."}
    columns:
      - {name: message, type: VARCHAR, description: "Human-readable status or warning message. Can be null on success. Since v67.0."}
      - {name: success, type: BOOLEAN, description: "Indicates whether the action completed successfully (`true`) or not (`false`). Since v67.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `ActionResultRepresentation`.
    notes: "**Notes:** The spec doesn't say which states this applies to, or how to tell that the sync finished. `status` on [`activation_target_get`](#activation_target_get) is the only visible signal. It accepts a 15- or 18-character id, unlike enable and disable."

schemas:
  DataConnectorInputRepresentation:
    description: Represents the data connector details input.
    attributes:
      - {name: name, type: string, description: "Developer name of the connector ([MCP server](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/model/request/activation/ConnectorInput.java)). The spec's text says \"Name of the activation target\", but its examples use a connector name here."}
      - {name: output_format, api_name: outputFormat, type: string, description: "Output file format. The MCP server lists this as S3 only, and the S3 example uses `CSV`."}
      - {name: bucket_name, api_name: bucketName, type: string, description: "Not in the spec schema: from the spec's examples."}
      - {name: folder_name, api_name: folderName, type: string, description: "Not in the spec schema: from the spec's examples."}
      - {name: access_key, api_name: accessKey, type: string, description: "Not in the spec schema: from the spec's examples."}
      - {name: secret_key, api_name: secretKey, type: string, description: "Not in the spec schema: from the spec's examples."}
      - {name: target_sub_type, api_name: targetSubType, type: string, description: "Not in the spec schema: from the spec's examples."}
      - {name: business_unit_config, api_name: businessUnitConfig, schema: DataConnectorInput_businessUnitConfig, description: "Not in the spec schema: from the spec's examples."}
      - {name: key_prefix_name, api_name: keyPrefixName, type: string, description: "Not in the spec schema: from the spec's examples."}
      - {name: field_config, api_name: fieldConfig, schema: DataConnectorInput_fieldConfig, description: "Not in the spec schema: from the spec's examples."}

  DataConnectorInput_businessUnitConfig:
    unknown: warning
    attributes:
      - {name: business_units, api_name: businessUnits, array: 1, description: "Seen in examples: the spec types the parent as a free-form object."}

  DataConnectorInput_fieldConfig:
    unknown: warning
    attributes:
      - {name: fields, schema: DataConnectorInput_fieldConfig_fields, array: 1, description: "Seen in examples: the spec types the parent as a free-form object."}

  DataConnectorInput_fieldConfig_fields:
    unknown: warning
    attributes:
      - {name: name, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: value, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}

  EgressPropertiesInputRepresentation:
    description: Represents the input details for egress properties of the activation target.
    attributes:
      - {name: child_folder, api_name: childFolder, type: string, description: "Path of the child folder. The child folder is created in the parent directory for copying activation files. Since v63.0."}
      - {name: custom_filename, api_name: customFilename, type: string, description: "Custom name of the output file. Either `custom_filename` or `predetermined_filename` must be present. Since v63.0."}
      - {name: filename_date_suffix_format, api_name: filenameDateSuffixFormat, type: string, required: true, description: "Date suffix format for the output file name. Use the format `yyyy-MM-dd-HH-mm-ss` or `yyyy-MM-dd-HH-mm-ss-SSS`. Since v63.0."}
      - {name: is_subfolder_creation_enabled, api_name: isSubfolderCreationEnabled, type: boolean, description: "Indicates whether subfolder creation is enabled (`true`) or not (`false`). If `true`, a custom subfolder is created. The default is `false`. Since v63.0."}
      - {name: output_compression_format, api_name: outputCompressionFormat, type: string, enum: [Bzip2, Gzip, "None"], required: true, description: "Compression format for the output file. Since v63.0."}
      - {name: output_delimiter, api_name: outputDelimiter, type: string, enum: [BrokenPipe, Caret, Colon, Comma, Hash, Pipe, Semicolon, Slash, Tab, Tilde, Underscore], required: true, description: "Field delimiter to use in output files. Since v63.0."}
      - {name: output_format, api_name: outputFormat, type: string, required: true, description: "Output format for the activation target. Since v63.0."}
      - {name: output_max_file_size_mega_bytes, api_name: outputMaxFileSizeMegaBytes, type: integer, required: true, description: "Maximum size of the output file in megabytes from `1` through `500`. Since v63.0."}
      - {name: output_max_records_per_file, api_name: outputMaxRecordsPerFile, type: integer, description: "Maximum number of records in the output file from `1` through `100000`. Since v63.0."}
      - {name: predetermined_filename, api_name: predeterminedFilename, type: string, enum: [Activation, Segment, SegmentActivation], description: "Predetermined name of the output file. Either `custom_filename` or `predetermined_filename` must be present. Since v63.0."}

  activation_target_create_config:
    unknown: warning
    attributes:
      - {name: object, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: identifier_field, api_name: identifierField, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: field_mapping, api_name: fieldMapping, schema: activation_target_create_config_fieldMapping, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: upsert_behavior, api_name: upsertBehavior, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}

