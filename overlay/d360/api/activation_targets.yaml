  - name: activation_target_ad_account_list
    method: GET
    host: connect
    path: /ssot/activation-targets/{activationTargetId}/available-ad-accounts
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Activation-Targets/paths/~1ssot~1activation-targets~1%7BactivationTargetId%7D~1available-ad-accounts/get
    description: Returns the ad accounts that aren't already assigned in the specified data space. Since v67.0.
    example: CALL cdp.activation_target_ad_account_list (activation_target_id => '85UVF000000NaQz2AK', dataspace => 'default', platform_id_or_name => 'cdpactvstrgptnr__PremiumPartnerGoogle');
    options:
      - {name: activation_target_id, api_name: activationTargetId, in: path, type: string, required: true, description: "Record ID (15- or 18-character) of the activation target. Since v67.0."}
      - {name: dataspace, api_name: dataSpace, in: query, type: string, required: true, description: "Name of the data space used to filter out already-assigned accounts. Since v67.0."}
      - {name: platform_id_or_name, api_name: platformIdOrName, in: query, type: string, required: true, description: "Record ID (15- or 18-character) or API name of the activation platform. Since v67.0."}
    rows: /adAccounts
    columns:
      - {name: account_name, api_name: accountName, type: VARCHAR, description: "Display name of the ad account. Since v67.0."}
      - {name: account_number, api_name: accountNumber, type: VARCHAR, description: "Ad account number on the partner platform. Since v67.0."}
      - {name: active, type: BOOLEAN, description: "Indicates whether the ad account is currently active (`true`) or not (`false`). Since v67.0."}
      - {name: errors, type: JSON, array: 1, schema: CdpErrorRepresentation, description: "Validation errors for the account. Since v67.0."}
      - {name: has_error, api_name: hasError, type: BOOLEAN, description: "Indicates whether validation errors exist for the account (`true`) or not (`false`). Since v67.0."}
      - {name: manager_account_id, api_name: managerAccountId, type: VARCHAR, description: "Manager account ID, if the account is managed by another account. Since v67.0."}
    effect: read
    evidence: O
    result_description: One row per item of `/adAccounts` in the response. Schema `AdAccountRepresentation`.
    notes: "**Notes:** The target must exist first, because its id is in the path. Accounts already assigned in `dataspace` are left out, so an empty result can mean they're all taken. `platform_id_or_name` takes `api_name` from [`activation_platform_metadata_list`](#activation_platform_metadata_list). Check `has_error` and `errors` before assigning an account."

  - name: activation_target_partner_object_list
    method: GET
    host: connect
    path: /ssot/activation-targets/{activationTargetId}/partner-objects
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Activation-Targets/paths/~1ssot~1activation-targets~1%7BactivationTargetId%7D~1partner-objects/get
    description: "Returns partner-platform objects of the specified type. Results are cursor-paginated: follow `next_page_url` to retrieve each subsequent page instead of supplying an offset. Since v67.0."
    example: CALL cdp.activation_target_partner_object_list (activation_target_id => '85UVF000000NaQz2AK', partner_object_type => 'ConversionRule');
    options:
      - {name: activation_target_id, api_name: activationTargetId, in: path, type: string, required: true, description: "Record ID (15- or 18-character) of the activation target. Since v67.0."}
      - {name: page_token, api_name: pageToken, in: query, type: string, description: "Cursor for the next page of results. Omit this value on the first request. The response's `next_page_url` includes the `page_token` to fetch the next page, so follow `next_page_url` rather than constructing this value. Since v67.0."}
      - {name: partner_object_type, api_name: partnerObjectType, in: query, type: string, enum: [App, ConversionRule, CrmEventSet, MobileApp, OfflineEventSet, Pixel], required: true, description: "Type of partner object to retrieve. Since v67.0."}
    rows: /partnerObjects
    columns:
      - {name: name, type: VARCHAR, description: "Display name on the external platform. Since v67.0."}
      - {name: partner_object_id, api_name: partnerObjectId, type: VARCHAR, description: "Identifier on the external platform. Since v67.0."}
      - {name: status, type: VARCHAR, description: "Status of the partner object. Since v67.0."}
      - {name: type, type: VARCHAR, description: "Partner-object type identifier. Since v67.0."}
    paging: {kind: url, from: /nextPageUrl}
    effect: read
    evidence: O
    result_description: "One row per item of `/partnerObjects` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`. Schema `PartnerObjectRepresentation`."
    notes: |
      **Paging:** `next_page_url`.

      **Notes:** To see which types a platform has, use [`activation_platform_partner_object_type_list`](activation_platforms.md#activation_platform_partner_object_type_list). The spec's example returns LinkedIn conversion rules with `status` null, so don't filter on `status`.

  - name: activation_platform_metadata_list
    method: GET
    host: connect
    path: /ssot/activation-targets/metadata/activation-platforms
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Activation-Targets/paths/~1ssot~1activation-targets~1metadata~1activation-platforms/get
    description: Lists the platforms you can create a target on, including their `api_name`, category and whether they process in batch or streaming. Use it first when setting up a destination. Since v67.0.
    example: CALL cdp.activation_platform_metadata_list (platform_type => 'Strategic', order_by => 'name asc');
    options:
      - {name: batch_size, api_name: batchSize, in: query, type: integer, description: "Maximum number of results to return. Values are `1` through `200`. If unspecified, the default value is `20`. Since v67.0."}
      - {name: dataspace, api_name: dataSpace, in: query, type: string, description: "Name of the data space to scope the lookup. If unspecified, the request's data space context is used. Since v67.0."}
      - {name: filters, in: query, type: string, description: "Filter expression used to narrow results, such as `field eq value AND name contains foo`. Supported operators are `eq`, `!=`, `contains`, `in`, `>`, `<`, `>=`, and `<=`. Since v67.0."}
      - {name: name, in: query, type: string, description: "Filter results by activation platform name. Must be an exact match. Since v67.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. If unspecified, no rows are skipped. Since v67.0."}
      - {name: order_by, api_name: orderBy, in: query, type: string, description: "Sort expression in the form `field [asc|desc][, field [asc|desc]]*`. Since v67.0."}
      - {name: platform_type, api_name: platformType, in: query, type: string, enum: [AzureBlob, DataCloud, External, GoogleCloudStorage, InteractionStudio, S3, S3V2, SfApp, Sfcc, Sfmc, Sftp, Strategic, StreamingFlow], description: "Filter results by platform type, such as `Sfmc`, `Sftp`, `External`, or `Strategic`. Since v67.0."}
    rows: /activationTargetPlatforms
    columns:
      - {name: api_name, api_name: apiName, type: VARCHAR, description: "Stable identifier for the activation platform. Since v67.0."}
      - {name: category, type: VARCHAR, description: "Category of the activation platform. Since v67.0."}
      - {name: description, type: VARCHAR, description: "Description of the activation platform. Since v67.0."}
      - {name: external_provider, api_name: externalProvider, type: VARCHAR, description: "External partner provider for the activation platform. Since v67.0."}
      - {name: name, type: VARCHAR, description: "Display name of the activation platform. Since v67.0."}
      - {name: platform_type, api_name: platformType, type: VARCHAR, description: "Type of the activation platform. Since v67.0."}
      - {name: processing_type, api_name: processingType, type: VARCHAR, description: "How the platform processes activations. Since v67.0."}
      - {name: sort_order, api_name: sortOrder, type: BIGINT, description: "Sort order used to display platforms in pickers. Lower values appear first. Since v67.0."}
    paging: {kind: url, from: /nextPageUrl}
    effect: read
    evidence: O
    result_description: "One row per item of `/activationTargetPlatforms` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`. Schema `ActivationTargetPlatformRepresentation`."
    notes: |
      **Paging:** `next_page_url`.

      **Notes:** **`platform_type` here isn't the target's `platform_type`.** This list uses `Sfmc`, `S3`, `External`, `Strategic` and so on, while `activation_target_create` uses `SalesforceMarketingCloud`, `AmazonS3`, `ExternalPlatform`. In the spec's examples, a `Strategic` platform such as Google Ads is created with `platform_type => 'ExternalPlatform'`. In those examples, `api_name` splits into two connector attributes: `cdpactvstrgptnr__PremiumPartnerGoogle` appears at create as `key_prefix_name = 'cdpactvstrgptnr'`, `name = 'PremiumPartnerGoogle'`. To administer platforms rather than pick one, see [Activation Platforms](activation_platforms.md).

