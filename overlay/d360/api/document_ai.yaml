title: Document AI
description: |
  Document AI uses an LLM to read documents such as PDFs and images, and returns structured data that follows a JSON schema you define. The [architect guide](https://architect.salesforce.com/docs/architect/fundamentals/guide/data360-document-ai) calls Agentforce a hard prerequisite: all Document AI APIs are unavailable until it is active, and they stop if it or the chosen model is disabled.

  There are two ways to use it:

  - **Ad hoc:** `document_ai_data_extract` answers synchronously with JSON and stores nothing. Pass `ml_model` and `schema_config`, or name a saved configuration.
  - **Batch:** a configuration bound to an unstructured DMO. `document_ai_process_run` starts it, and the results land in DLOs.

  The usual order is to read the valid models and file types with `document_ai_global_configuration_get`, draft a schema with `document_ai_schema_generate`, test it with an extract, and save it with `document_ai_configuration_create`. `document_ai_schema_detect` picks among saved configurations when the document type is unknown.

  The gotchas that matter most, per the guide: 10 MB per file, 50 extraction calls per minute per tenant, and credits spent on processing. Fields not found come back as null, and content past the model's context is dropped silently. The spec's schemas and examples also disagree in several places, noted per function.

  ```sql
  CALL cdp.document_ai_global_configuration_get ();
  CALL cdp.document_ai_schema_generate (ml_model => 'llmgateway__VertexAIGemini25Flash001', files => [(file_id = '068xxxxxxxxxxxxxxx')]);
  CALL cdp.document_ai_data_extract (idp_configuration_id_or_name => 'Vendor_Invoice', files => [(file_id = '068xxxxxxxxxxxxxxx')]);
  ```

functions:
  - name: document_ai_configuration_delete
    method: DELETE
    host: connect
    path: /ssot/document-processing/configurations/{idOrApiName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Document-AI/paths/~1ssot~1document-processing~1configurations~1%7BidOrApiName%7D/delete
    description: Delete a Document AI configuration. Since v63.0.
    example: CALL cdp.document_ai_configuration_delete (id_or_api_name => 'Vendor_Invoice');
    options:
      - {name: id_or_api_name, api_name: idOrApiName, in: path, type: string, required: true, description: "ID or API name of the configuration. Since v63.0."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 200). One row with only the standard columns.
    notes: "**Notes:** The sources don't say whether the DLOs in `extracted_dlos` go with the configuration, so check them afterwards. Extract calls that still name it should fail: the [architect guide](https://architect.salesforce.com/docs/architect/fundamentals/guide/data360-document-ai) maps \"schema ID not found\" to HTTP 400."

  - name: document_ai_configuration_list
    method: GET
    host: connect
    path: /ssot/document-processing/configurations
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Document-AI/paths/~1ssot~1document-processing~1configurations/get
    description: Get all Document AI configurations. Since v63.0.
    example: CALL cdp.document_ai_configuration_list (activation_status => 'Activated', order_by => 'Label DESC', limit => 25);
    options:
      - {name: activation_status, api_name: activationStatus, in: query, type: string, description: "Filter by activation status, either `Activated` or `Deactivated`. Since v63.0."}
      - {name: limit, in: query, type: integer, description: "Maximum number of records to return. Since v63.0."}
      - {name: offset, in: query, type: integer, description: "Number of records to skip. Since v63.0."}
      - {name: order_by, api_name: orderBy, in: query, type: string, description: "Return record sorted by a given field. Sort order is DESC by default. (for example, \"Label DESC\"). Since v63.0."}
      - {name: search, in: query, type: string, description: "Return only records that contain a specific search term. Since v63.0."}
    rows: /configurations
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: activation_status, api_name: activationStatus, type: VARCHAR, description: "The configuration activation status. Since v63.0."}
      - {name: config_metadata, api_name: configMetadata, type: JSON, description: "A collection of custom key-value pairs. Since v63.0."}
      - {name: dataspace, type: JSON, schema: CdpAssetReferenceRepresentation, description: "Data space of the configuration. Since v63.0."}
      - {name: description, type: VARCHAR, description: "Description of the configuration. Since v63.0."}
      - {name: last_run_on, api_name: lastRunOn, type: VARCHAR, description: "The last unstructured data-extraction job run. Since v63.0."}
      - {name: ml_model, api_name: mlModel, type: VARCHAR, description: "The ML model used to extract the unstructured data. Since v63.0."}
      - {name: runtime_status, api_name: runtimeStatus, type: VARCHAR, description: "The status of the last off-core unstructured data-extraction job run. Since v63.0."}
      - {name: source_dmo, api_name: sourceDmo, type: JSON, schema: CdpAssetReferenceRepresentation, description: "The unstructured DMO used as the input for the data extraction process. Since v63.0."}
      - {name: status, type: VARCHAR, description: "The status of the latest configuration version that's been synced off-core. Since v63.0."}
      - {name: version, type: VARCHAR, description: "The current version of the configuration. This is incremented automatically with each edit. Since v63.0."}
    paging: {kind: url, from: /nextPageUrl}
    effect: read
    evidence: O
    result_description: "One row per item of `/configurations` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`. Schema `IdpConfigurationRepresentation`."
    notes: |
      **Paging:** `next_page_url`.

      **Notes:** Empty collections return `current_page_url` and `next_page_url` as null, unlike the spec's declared string type ([sf-pi override](https://github.com/salesforce/sf-pi/blob/main/extensions/sf-data360/registry/connect-openapi-overrides.json), from a live test). Items have no `schema_config`: use `document_ai_configuration_get` for that.

  - name: document_ai_configuration_get
