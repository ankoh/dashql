    rows: /queryJobs
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: completed_date, api_name: completedDate, type: VARCHAR, description: "Date and time the query run job was completed. Since v63.0."}
      - {name: error_code, api_name: errorCode, type: VARCHAR, description: "Error code (if any) caused by a query failure. Since v63.0."}
      - {name: error_message, api_name: errorMessage, type: VARCHAR, description: "Error message (if any) that specifies the query failure reason. Since v63.0."}
      - {name: executed_by, api_name: executedBy, type: VARCHAR, description: "Name of the user who executed the query job. Since v63.0."}
      - {name: output_dmo_name, api_name: outputDMOName, type: VARCHAR, description: "Developer name of the resulting data model object (DMO) for Activation use cases. For other use cases, this value is the name of the resulting report. Since v63.0."}
      - {name: query_param, api_name: queryParam, type: JSON, description: "Map of query parameters and their values. Since v63.0."}
      - {name: report_id, api_name: reportId, type: VARCHAR, description: "ID of the report associated with the output DMO. Since v63.0."}
      - {name: report_name, api_name: reportName, type: VARCHAR, description: "Name of the report associated with the output DMO. Since v63.0."}
      - {name: segment_names, api_name: segmentNames, type: JSON, description: "List of segment names. Since v63.0."}
      - {name: status, type: VARCHAR, description: "Status of the query job. Since v63.0."}
      - {name: triggered_date, api_name: triggeredDate, type: VARCHAR, description: "Date and time the query run job was started. Since v63.0."}
    paging: {kind: url, from: {body: /nextPageUrl}}
    effect: read
    evidence: O
    result_description: "One row per item of `/queryJobs` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`, `limit`, `offset`. Schema `DataCleanRoomQueryJobRepresentation`."
    notes: |
      **Paging:** `next_page_url`.

      **Notes:** The spec has no call that gets one job, so this list is the only way to poll. `id` is a UUID in the spec's examples, not the 18-character ID the column description says.

      The schema's `status` values are `Created`, `Running`, `Success` and `Failed`. Examples show them in uppercase.

      A job can fail on setup rather than on its query. The spec's example shows `FAILED` with `error_code` `DCR_INVALID_STATE_ERROR` and `CONSUMER member 1TPSB0000000VYU has no specification ID`.

      An unknown collaboration may not give a clean error. The spec lists both a 400 (`Failed to find clean room with idOrDevName`) and a 500 (`Cannot invoke ... because dataCleanRoom is null`).

