      **Notes:** `label` is the only attribute the schema requires, but the spec's listed 400s add more: `description` can't be empty, and a Salesforce template type needs a use case type or template names. The spec also lists `Unrecognized field template_type` as a 400, although `template_type` is in the schema.

      The spec has three request examples:

      - **AWS:** `source` `AWS`, `template_type` `CUSTOM`, `template_json`, and `source_configuration` with `account_id` and `supported_regions`.
      - **Extensible:** `source` `DATA_CLOUD`, `template_type` `CUSTOM`, `template_json`, and `source_configuration` with `data_cloud_org_id`, `domain_url` and `off_core_tenant_id`.
      - **Native:** `source` `DATA_CLOUD`, `template_type` `SALESFORCE`, `use_case_type_config => (use_case_types = ['Overlap'])`, and the same `source_configuration`.

      These examples conflict with the schema, and the example above follows them. `tables`, `queries`, `query_parameters` and `use_case_type_config` are declared as arrays but sent as single objects, and `use_case_type_config` also comes back as one object. `template_type` is declared `Custom` or `Salesforce` but sent uppercase.

      The response has a generated `name`, such as `X00Dxx00QA6JqfVUEMZ_package_AWS1765305467896`. The spec has no update or delete for providers, and documents no idempotency, so check `clean_room_provider_list` before retrying.

  - name: clean_room_specification_create
    method: POST
    host: connect
    path: /ssot/data-clean-room/specifications
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Clean-Rooms/paths/~1ssot~1data-clean-room~1specifications/post
    description: Maps a template's attributes to one member's DMO fields. A member needs a specification to create or accept a collaboration. Since v63.0.
    example: |
      CALL cdp.clean_room_specification_create (
        name => 'sampleMapping',
        label => 'sampleMapping',
        dataspace_name => 'default',
        member_type => 'CONSUMER',
        owner_org_id => '00Dxx00QA6JqfVUEMZ',
        template_name => 'Overlap',
        template_version_id => '1TTxx0000004Cc4GAE',
        template_type => 'SALESFORCE',
        use_case_type => 'Overlap',
        data_mapping => (
          collaboration_entity = 'ssot__ContactPointEmail__dlm',
          attributes = [
            (attribute_id = 'SegmentId', alias = 'SegmentId', subject_attribute = (object_name = 'ssot__ContactPointEmail__dlm', object_label = 'Contact Point Email', field_name = 'ssot__InternalOrganizationId__c', field_label = 'Internal Organization')),
            (attribute_id = 'HashedEmailAddress', alias = 'HashedEmailAddress', subject_attribute = (object_name = 'ssot__ContactPointEmail__dlm', object_label = 'Contact Point Email', field_name = 'ssot__DataSourceId__c', field_label = 'Data Source'))
          ]
        )
      );
    options:
      - {name: dataspace_name, api_name: dataSpaceName, in: body, type: string, description: "Name of the data space where the specification is to be created. Since v63.0. Sources also spell it `dataspaceName`: quote that name to send that spelling."}
      - {name: description, in: body, type: string, description: "Description of the mapping. Since v63.0."}
      - {name: label, in: body, type: string, required: true, description: "Label of the clean room specification. Since v63.0."}
      - {name: name, in: body, type: string, description: "API name of the specification. The spec's example sets it, and it comes back unchanged as `name`. Since v59.0."}
      - {name: data_mapping, api_name: dataMapping, in: body, schema: UseCaseTemplateMappingRepresentation, array: 1, required: true, description: "Data mapping details for a clean room member. Since v63.0."}
      - {name: member_type, api_name: memberType, in: body, type: string, required: true, description: "Type of clean room member, `Provider` or `Consumer`. Since v63.0."}
      - {name: owner_org_id, api_name: ownerOrgId, in: body, type: string, required: true, description: "Data 360 org ID where the mapping is to be created. Since v63.0."}
      - {name: template_name, api_name: templateName, in: body, type: string, required: true, description: "Name of the use case template for which the mapping is provided. Since v63.0."}
      - {name: template_type, api_name: templateType, in: body, type: string, enum: [Custom, Salesforce], required: true, description: "Type of template. Since v63.0."}
      - {name: template_version_id, api_name: templateVersionId, in: body, type: string, required: true, description: "Template version ID that is to be used for mapping. Since v63.0."}
      - {name: use_case_type, api_name: useCaseType, in: body, type: string, enum: [Custom, Overlap], required: true, description: "Type of use case template. Since v63.0."}
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: data_mapping, api_name: dataMapping, type: JSON, schema: UseCaseTemplateMappingRepresentation, description: "Data mapping details for a clean room member in JSON format. Since v63.0."}
      - {name: dataspace, api_name: dataSpace, type: JSON, schema: DataSpaceRepresentation, description: "Data space details for the clean room. Since v66.0."}
      - {name: description, type: VARCHAR, description: "Description of the specification. Since v63.0."}
      - {name: member_type, api_name: memberType, type: VARCHAR, description: "Type of clean room member. Since v63.0."}
      - {name: owner_org_id, api_name: ownerOrgId, type: VARCHAR, description: "Data 360 org ID where the mapping is created. Since v63.0."}
      - {name: status, type: VARCHAR, description: "Status of the specification. Since v63.0."}
      - {name: template_version, api_name: templateVersion, type: JSON, schema: DataCleanRoomTemplateRepresentation, description: "Details of the use case template version for which the mapping is provided. Since v63.0."}
      - {name: dataspace_name, api_name: dataSpaceName, type: VARCHAR, description: "Not in the spec schema: from the spec's examples."}
    effect: write
    evidence: O
    result_description: One row. Schema `DataCleanRoomDataSpecificationRepresentation`.
    notes: |
      **Notes:** `attribute_id` takes an `id` from the template's `configuration.memberConfigs[].attributeConfigs`. `collaboration_entity` is the central DMO for the mapping.

      The spec's example conflicts with its schema, and the example above follows the example's shape. `data_mapping` is declared as an array, but the example sends one object and the response returns one object. `template_type` and `member_type` are sent uppercase, and the declared values are Title Case. The spec's example also sends `dataspaceName`, which isn't an attribute; the option is `dataSpaceName`, and the spec lists `Unrecognized field` as a 400.

      `data_mapping` reuses a response schema, so its attribute list includes read-only fields such as `created_by`. The spec's example sends only `collaboration_entity` and `attributes`, with `attribute_id`, `alias` and `subject_attribute` on each attribute.

      Attributes with an empty `subject_attribute` may vanish. The spec's example sends five attributes, two with `subject_attribute = ()`, and those two are missing from its response.

      The schema's `status` has `Processing` and `Error`, while the spec's example returns `ACTIVE` at once. Check `status` before using the specification. The spec has no update for specifications.

  - name: clean_room_connection_test
    method: POST
    host: connect
    path: /ssot/data-clean-room/test-connection
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Clean-Rooms/paths/~1ssot~1data-clean-room~1test-connection/post
    description: Test the connection between the clean room and the provider's external storage. Since v66.0.
    example: CALL cdp.clean_room_connection_test (consumer_org_id => '00D000000000001', connector_type => 'CleanroomAwsS3', connection_attributes => (authenticationOption = 'idp', bucketName = 'cleanroom-data-bucket', parentDirectory = '/shared-data/', iamRoleName = 'arn:aws:iam::123456789012:role/CleanroomDataAccessRole', externalId = 'app:DE809C7E:A1B2C3D4'));
    options:
      - {name: connection_attributes, api_name: connectionAttributes, in: body, map: true, type: string, description: "Map of connection attributes. Since v66.0."}
      - {name: connector_type, api_name: connectorType, in: body, type: string, enum: [CleanroomAwsS3, CleanroomSnowflake], description: "Type of connector. Since v66.0."}
      - {name: consumer_org_id, api_name: consumerOrgId, in: body, type: string, description: "18-character org ID of the target consumer. Since v66.0."}
    columns:
      - {name: details, type: JSON, description: "Additional information including error details passed by the DCF service's test connection. Since v66.0."}
      - {name: error_code, api_name: errorCode, type: VARCHAR, description: "Error code, if any. Since v66.0."}
      - {name: message, type: VARCHAR, description: "Message that provides additional context about the connection test result. Since v66.0."}
      - {name: success, type: BOOLEAN, description: "Indicates whether the connection test was successful (`true`) or not (`false`). Since v66.0."}
    effect: read
    evidence: O
    result_description: One row. Schema `CleanRoomTestConnectionRepresentation`.
    notes: |
      **Notes:** A failed test is still HTTP 200, so check `success`. The spec's failure example has `error_code` `CONNECTORS_FRAMEWORK_TEST_FAILED` and `details` with `subErrorCode` `INVALID_IAM_ROLE`.

      `connection_attributes` keys are documented only by that one S3 example: `authenticationOption`, `bucket_name`, `parentDirectory`, `iamRoleName` and `external_id`. They differ from the `role_arn` and `s3_url` that `clean_room_invitation_accept` takes for the same connector. The spec gives no Snowflake keys for this call.

      `consumer_org_id` is described as 18 characters, but the spec's example has 15.

  - name: clean_room_collaboration_metadata_refresh
    method: PUT
    host: connect
    path: /ssot/data-clean-room/collaborations/{collaborationIdOrApiName}/actions/refresh-metadata
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Clean-Rooms/paths/~1ssot~1data-clean-room~1collaborations~1%7BcollaborationIdOrApiName%7D~1actions~1refresh-metadata/put
    description: Refresh metadata for a clean room collaboration. Since v66.0.
    example: CALL cdp.clean_room_collaboration_metadata_refresh (collaboration_id_or_api_name => 'collab21_00DSB00000eMue3');
    options:
      - {name: collaboration_id_or_api_name, api_name: collaborationIdOrApiName, in: path, type: string, required: true, description: "ID or developer name of the clean room collaboration. Since v66.0."}
    columns:
      - {name: errors, type: JSON, array: 1, schema: CdpErrorRepresentation, description: "List of errors that resulted from the action. Since v57.0."}
      - {name: success, type: BOOLEAN, description: "Indicates whether the action was initiated successfully (`true`) or not (`false`). Since v57.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `DataCleanRoomGenericResponseRepresentation`.
    notes: |
      **Done when:** The spec documents no completion signal. `success` = `true` only means the refresh was initiated.

      **Notes:** The spec doesn't say what metadata is refreshed or when you'd need this.

      Don't treat `errors` as a failure signal. The spec's success example has `success` `true` with `errors` holding one entry of empty strings.

