    host: connect
    path: /ssot/data-clean-room/collaborations
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Clean-Rooms/paths/~1ssot~1data-clean-room~1collaborations/get
    description: Get a list of clean room collaborations. Since v63.0.
    example: CALL cdp.clean_room_collaboration_list (order_by => 'createdDate DESC', limit => 20);
    options:
      - {name: filters, in: query, type: string, description: "Field names by which to filter results. Specify a comma-separated list of equality expressions, such as `developer_name eq extensiblepackage0123456789012`. By default, no filter is applied. Since v63.0."}
      - {name: limit, in: query, type: integer, description: "Maximum number of clean room collaborations to return from `1` through `20`. By default, `20` collaborations are returned. Since v63.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. If unspecified, no rows are skipped. Since v63.0."}
      - {name: order_by, api_name: orderBy, in: query, type: string, description: "Sort order for the result set. Specify a field and an order, ascending (`ASC`) or descending (`DESC`). For example, `created_date DESC`. By default, items are returned in the order they are retrieved. Since v63.0."}
    rows: /collaborations
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: api_key, api_name: apiKey, type: VARCHAR, description: "API key of the clean room. Since v63.0."}
      - {name: dataspace, api_name: dataSpace, type: JSON, schema: DataSpaceRepresentation, description: "Data space details for the clean room. Since v66.0."}
      - {name: description, type: VARCHAR, description: "Description of the collaboration. Since v63.0."}
      - {name: members, type: JSON, array: 1, schema: DataCleanRoomMemberRepresentation, description: "List of the collaboration members. Since v63.0."}
      - {name: status, type: VARCHAR, description: "Status of the collaboration. Since v63.0."}
      - {name: template_version, api_name: templateVersion, type: JSON, schema: DataCleanRoomTemplateRepresentation, description: "Information about the template version that the collaboration supports. Since v63.0."}
    paging: {kind: url, from: {body: /nextPageUrl}}
    effect: read
    evidence: O
    result_description: "One row per item of `/collaborations` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`, `limit`, `offset`. Schema `DataCleanRoomCollaborationRepresentation`."
    notes: |
      **Paging:** `next_page_url`.

      **Notes:** This is where you find an invitation: the ID is `members[].invitationId`. In the spec's example the provider member shows `invitation_status` `RECEIVED` and the consumer shows `SENT`. The collaboration's `name` carries the consumer's org prefix, which suggests the consumer created it.

      Schema enums: `status` is `Active`, `Disabled`, `Error` or `Inactive`. `members[].memberStatus` is `Active`, `Inactive` or `Mapping_Incomplete`. `members[].invitationStatus` is `Pending`, `Sent`, `Send_Error`, `Received`, `Accept_Initiated`, `Accepted`, `Accept_Error`, `Reject_Initiated`, `Rejected` or `Reject_Error`. Examples show these in uppercase.

      The spec lists no filterable fields. Its `filters` example uses `developer_name`, which isn't a result column; `name` holds the developer name.

