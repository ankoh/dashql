    description: Creates a capping configuration, which ties dimensions to data spaces and holds the rules. Create the dimensions first, because the configuration refers to their ids.
    example: CALL cdp.communication_capping_configuration_create (name => 'Marketing caps', description => 'Caps for marketing sends', data_comm_cap_dataspaces => [(dataspace_id = 'DATA_SPACE_ID')], data_comm_cap_related_dims => [(api_name = 'Channel', data_comm_cap_dim_id = 'DIMENSION_ID')]);
    options:
      - {name: data_comm_cap_dataspaces, api_name: dataCommCapDataSpaces, in: body, schema: CommunicationCappingDataSpaceInputRepresentation, array: 1, description: "Data spaces to associate with the configuration."}
      - {name: data_comm_cap_related_dims, api_name: dataCommCapRelatedDims, in: body, schema: CommunicationCappingRelatedDimInputRepresentation, array: 1, description: "Dimensions related to the configuration."}
      - {name: data_communication_cap_def_id, api_name: dataCommunicationCapDefId, in: body, type: string, description: "Capping definition id. Per the [reference](https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping), it's null on create and set only on update."}
      - {name: description, in: body, type: string, description: "-"}
      - {name: id, in: body, type: string, description: "Instance id of the configuration."}
      - {name: name, in: body, type: string, description: "-"}
    columns:
      - {name: data_comm_cap_dataspaces, api_name: dataCommCapDataSpaces, type: JSON, array: 1, schema: CommunicationCappingDataSpaceRepresentation}
      - {name: data_comm_cap_related_dims, api_name: dataCommCapRelatedDims, type: JSON, array: 1, schema: CommunicationCappingRelatedDimRepresentation}
      - {name: data_communication_cap_def_id, api_name: dataCommunicationCapDefId, type: VARCHAR}
      - {name: data_communication_cap_status, api_name: dataCommunicationCapStatus, type: VARCHAR}
      - {name: description, type: VARCHAR}
      - {name: id, type: VARCHAR}
      - {name: last_status_date_time, api_name: lastStatusDateTime, type: TIMESTAMPTZ}
      - {name: last_status_error_code, api_name: lastStatusErrorCode, type: VARCHAR}
      - {name: name, type: VARCHAR}
    effect: write
    evidence: O
    result_description: One row. Schema `CommunicationCappingEntityRepresentation`.
    notes: |
      **Done when:** No source documents the lifecycle, but the [reference's sample](https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping) returns `data_communication_cap_status` = `PROCESSING`. Poll `communication_capping_configuration_get.status` until it changes. The reference's samples also show `ACTIVE`; no source gives the full list. `last_status_error_code` is the field for failures.

      **Notes:** Keep the returned `id`: the spec has no call that lists configurations. The reference appears to mark `data_comm_cap_dataspaces` required, while the spec marks nothing required. Salesforce documents no idempotency for this POST, so don't retry it blindly. Trailhead says [Channels is a required parameter](https://trailhead.salesforce.com/content/learn/modules/communication-capping-in-data-cloud-quick-look/get-to-know-communication-capping), and up to two user-defined parameters can be added. A vendor blog reports a limit of [3 hierarchical dimensions](https://deselect.com/blog/smart-communication-capping/) when it was written (community, from a competing product).

  - name: communication_capping_disable
    method: POST
    host: connect
    path: /ssot/communication-capping/{id}/actions/disable
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping/paths/~1ssot~1communication-capping~1%7Bid%7D~1actions~1disable/post
    description: Turns off a capping configuration.
    example: CALL cdp.communication_capping_disable (id => 'CONFIGURATION_ID');
    options:
      - {name: id, in: path, type: string, required: true, description: "Configuration id, the `id` that `communication_capping_configuration_create` returns."}
    columns:
      - {name: errors, type: JSON}
      - {name: success, type: BOOLEAN}
    effect: write
    evidence: O
    result_description: One row. Schema `CommunicationCappingActionResponseRepresentation`.
    notes: "**Notes:** The response has its own `success` and `errors`, so check `success`, not only the HTTP status. The sources don't say what happens to segments activated through its targets while it's off."

  - name: communication_capping_enable
    method: POST
    host: connect
    path: /ssot/communication-capping/{id}/actions/enable
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping/paths/~1ssot~1communication-capping~1%7Bid%7D~1actions~1enable/post
    description: Turns on a capping configuration.
    example: CALL cdp.communication_capping_enable (id => 'CONFIGURATION_ID');
    options:
      - {name: id, in: path, type: string, required: true, description: "Configuration id, the `id` that `communication_capping_configuration_create` returns."}
    columns:
      - {name: errors, type: JSON}
      - {name: success, type: BOOLEAN}
    effect: write
    evidence: O
    result_description: One row. Schema `CommunicationCappingActionResponseRepresentation`.
    notes: "**Notes:** The response has its own `success` and `errors`, so check `success`, not only the HTTP status. This is separate from `is_capping_enabled` on [`activation_target_update`](activation_targets.md#activation_target_update), which is per target. No source says at which step to call it. Trailhead only requires [parameters, rule and target](https://trailhead.salesforce.com/content/learn/modules/communication-capping-in-data-cloud-quick-look/get-to-know-communication-capping) before activating segments."

  - name: communication_capping_rule_create
    method: POST
    host: connect
    path: /ssot/communication-capping/{id}/rules
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping/paths/~1ssot~1communication-capping~1%7Bid%7D~1rules/post
    description: "Adds a rule to a configuration: a maximum message count for a combination of dimension values, valid over a date window."
    example: CALL cdp.communication_capping_rule_create (id => 'CONFIGURATION_ID', api_name => 'Sms_daily_hnw', limits => 10, start_date => '2027-05-01T00:00:00Z', end_date => '2027-05-31T00:00:00Z', data_comm_cap_rule_dim => [(dim_id = 'DIMENSION_ID', dim_value_ids = ['DIMENSION_VALUE_ID'])]);
    options:
      - {name: id, in: path, type: string, required: true, description: "Configuration id, the `id` that `communication_capping_configuration_create` returns."}
      - {name: api_name, api_name: apiName, in: body, type: string, description: "-"}
      - {name: data_comm_cap_rule_dim, api_name: dataCommCapRuleDim, in: body, schema: CommunicationCappingRuleDimInputRepresentation, array: 1, description: "Dimension associations for the rule."}
      - {name: end_date, api_name: endDate, in: body, type: string, format: date-time, description: "End of the window when the rule is valid."}
      - {name: limits, in: body, type: integer, description: "Capping limit value: the [maximum number of messages](https://trailhead.salesforce.com/content/learn/modules/communication-capping-in-data-cloud-quick-look/get-to-know-communication-capping)."}
      - {name: start_date, api_name: startDate, in: body, type: string, format: date-time, description: "Start of the window when the rule is valid."}
    columns:
      - {name: api_name, api_name: apiName, type: VARCHAR}
      - {name: data_comm_cap_rule_dim, api_name: dataCommCapRuleDim, type: JSON, array: 1, schema: CommunicationCappingRuleDimRepresentation}
      - {name: data_communication_cap_def_id, api_name: dataCommunicationCapDefId, type: VARCHAR}
      - {name: end_date, api_name: endDate, type: TIMESTAMPTZ}
      - {name: id, type: VARCHAR}
      - {name: limits, type: BIGINT}
      - {name: source, type: VARCHAR}
      - {name: start_date, api_name: startDate, type: TIMESTAMPTZ}
    effect: write
    evidence: O
    result_description: One row. Schema `CommunicationCappingRuleRepresentation`.
    notes: "**Notes:** The rule schema has no frequency, limit type or channel field, though [Trailhead](https://trailhead.salesforce.com/content/learn/modules/communication-capping-in-data-cloud-quick-look/get-to-know-communication-capping) lists all three as rule settings: frequency is `Daily` or `Monthly`, and limit type is profile or dimension. No source says how the API sets them; Trailhead treats them as parameters, so they presumably go in `data_comm_cap_rule_dim`. Profile limits apply per person, and dimension limits apply across everyone matching the values. A [vendor blog](https://deselect.com/blog/smart-communication-capping/) says rules apply at activation, first come, first served, so a low-value send can use up a cap before a high-value one (community, from a competing product). The [reference](https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping) marks `api_name` and `data_comm_cap_rule_dim` required, while the spec doesn't. [Help](https://help.salesforce.com/s/articleView?id=sf.c360_a_create_communication_capping_rules.htm&language=en_US&type=5) requires the Data Cloud Architect or Data Cloud Activation Manager permission set to create rules. No idempotency is documented, so don't retry this POST blindly."

  - name: communication_capping_activation_target_metadata_map
    method: POST
    host: connect
    path: /ssot/communication-capping/activation-target-capping-metadata/{activationTargetId}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping/paths/~1ssot~1communication-capping~1activation-target-capping-metadata~1%7BactivationTargetId%7D/post
    description: Maps a capping activation target to dimension values. Segments activated through the target are then evaluated against the rules, so choose values that match the rule, such as Channel = SMS.
    example: CALL cdp.communication_capping_activation_target_metadata_map (activation_target_id => 'TARGET_ID', activation_target_name => 'Email_capped', data_comm_cap_dim_info => [(data_comm_cap_dim_id = 'DIMENSION_ID', data_comm_cap_dim_value_id = 'DIMENSION_VALUE_ID')]);
    options:
      - {name: activation_target_id, api_name: activationTargetId, in: path, type: string, required: true, description: "Capping activation target, from `activation_target_create`."}
      - {name: activation_target_name, api_name: activationTargetName, in: body, type: string, description: "Name of the activation target."}
      - {name: data_comm_cap_dim_info, api_name: dataCommCapDimInfo, in: body, schema: CommunicationCappingActivationTargetDimInputRepresentation, array: 1, description: "Dimension and dimension value pairs for the target."}
    rows: /activationTargets
    columns:
      - {name: activation_target_id, api_name: activationTargetId, type: VARCHAR}
      - {name: actv_target_name, api_name: actvTargetName, type: VARCHAR}
      - {name: data_comm_cap_dim, api_name: dataCommCapDim, type: JSON, schema: CommunicationCappingDimRepresentation}
      - {name: data_comm_cap_dim_value, api_name: dataCommCapDimValue, type: JSON, schema: CommunicationCappingDimValueRepresentation}
      - {name: id, type: VARCHAR}
    effect: write
    evidence: O
    result_description: One row per item of `/activationTargets` in the response. Schema `CommunicationCappingActivationTargetRepresentation`.
    notes: "**Notes:** This needs a target of the capping type first. [Help](https://help.salesforce.com/apex/HTViewHelpDoc?id=data.c360_a_create_communication_capping_target.htm) says it can only be defined on data spaces already associated with the capping instance. The [reference](https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping) marks `activation_target_name` required, while the spec doesn't. [Capping-enabled targets](https://help.salesforce.com/s/articleView?id=data.c360_a_data_cloud_sandbox.htm&language=en_US&type=5) work in a sandbox but can't be deployed from it to production. Capping-enabled targets for Marketing Cloud, SFTP and Microsoft Azure [aren't supported in data kits](https://developer.salesforce.com/docs/data/data-cloud-dmo-mapping/guide/c360a-api-isv-readiness-data.html)."

  - name: communication_capping_dimension_create
    method: POST
    host: connect
    path: /ssot/communication-capping/dimensions
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping/paths/~1ssot~1communication-capping~1dimensions/post
    description: Creates a dimension and its possible values, such as Channel with Email and SMS. Dimensions come first, because configurations, rules and target mappings refer to their ids.
    example: CALL cdp.communication_capping_dimension_create (api_name => 'Channel', dimension_name => 'ssot__CommunicationChannel__dlm', function_type => 'NON_FUNCTIONAL_TYPE', hierarchy_order => 1, dimension_values => [(value = 'Email'), (value = 'SMS')]);
    options:
      - {name: api_name, api_name: apiName, in: body, type: string, description: "-"}
      - {name: dimension_name, api_name: dimensionName, in: body, type: string, description: "API name of the dimension object, such as `ssot__CommunicationChannel__dlm` in the [reference's sample](https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping)."}
      - {name: dimension_values, api_name: dimensionValues, in: body, schema: CommunicationCappingDimValueInputRepresentation, array: 1, description: "Values of the dimension."}
      - {name: function_type, api_name: functionType, in: body, type: string, description: "Function type. The [reference's samples](https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping) show `FUNCTIONAL_TYPE` and `NON_FUNCTIONAL_TYPE`."}
      - {name: hierarchy_order, api_name: hierarchyOrder, in: body, type: integer, description: "Position in the hierarchy. The reference's samples use 1 for Channel and 2 for Brand."}
      - {name: id, in: body, type: string, description: "-"}
      - {name: name, in: body, type: string, description: "-"}
    columns:
      - {name: api_name, api_name: apiName, type: VARCHAR}
      - {name: dimension_name, api_name: dimensionName, type: VARCHAR}
      - {name: dimension_values, api_name: dimensionValues, type: JSON, array: 1, schema: CommunicationCappingDimValueRepresentation}
      - {name: function_type, api_name: functionType, type: VARCHAR}
      - {name: hierarchy_order, api_name: hierarchyOrder, type: BIGINT}
      - {name: id, type: VARCHAR}
      - {name: name, type: VARCHAR}
    effect: write
    evidence: O
    result_description: One row. Schema `CommunicationCappingDimRepresentation`.
    notes: "**Notes:** Trailhead calls these parameters. It splits them into [enterprise and functional](https://trailhead.salesforce.com/content/learn/modules/communication-capping-in-data-cloud-quick-look/get-to-know-communication-capping): Channels and up to two user-defined ones are enterprise, and Frequency and Limit Type are preset functional ones. The `FUNCTIONAL_TYPE` and `NON_FUNCTIONAL_TYPE` values suggest the same split, but no source says so. No idempotency is documented, so don't retry this POST blindly."

schemas:
  CommunicationCappingActivationTargetDimInputRepresentation:
    attributes:
      - {name: data_comm_cap_dim_id, api_name: dataCommCapDimId, type: string, description: "Dimension of the pair, such as Channel."}
      - {name: data_comm_cap_dim_value_id, api_name: dataCommCapDimValueId, type: string, description: "Value of the pair, such as Email."}

  CommunicationCappingDataSpaceInputRepresentation:
    attributes:
      - {name: data_communication_cap_def_id, api_name: dataCommunicationCapDefId, type: string, description: "Capping definition this data space links to."}
      - {name: dataspace_id, api_name: dataSpaceId, type: string, description: "Data space to associate with the configuration."}

  CommunicationCappingDimInputRepresentation:
    attributes:
      - {name: api_name, api_name: apiName, type: string, description: "-"}
      - {name: dimension_name, api_name: dimensionName, type: string, description: "API name of the dimension object, such as `ssot__CommunicationChannel__dlm`."}
      - {name: dimension_values, api_name: dimensionValues, schema: CommunicationCappingDimValueInputRepresentation, array: 1, description: "Values of the dimension."}
      - {name: function_type, api_name: functionType, type: string, description: "Function type. The reference's samples show `FUNCTIONAL_TYPE` and `NON_FUNCTIONAL_TYPE`."}
      - {name: hierarchy_order, api_name: hierarchyOrder, type: integer, description: "Position in the hierarchy. The reference's samples use 1 for Channel and 2 for Brand."}
      - {name: id, type: string, description: "-"}
      - {name: name, type: string, description: "-"}

  CommunicationCappingDimValueInputRepresentation:
    attributes:
      - {name: api_name, api_name: apiName, type: string, description: "-"}
      - {name: data_comm_cap_dim_id, api_name: dataCommCapDimId, type: string, description: "Parent dimension, per the reference's response samples."}
      - {name: id, type: string, description: "-"}
      - {name: value, type: string, description: "The value, such as `Email` for a Channel dimension."}

  CommunicationCappingRelatedDimInputRepresentation:
    attributes:
      - {name: api_name, api_name: apiName, type: string, description: "-"}
      - {name: data_comm_cap_dim_id, api_name: dataCommCapDimId, type: string, description: "Dimension to relate to the configuration."}
      - {name: data_communication_cap_def_id, api_name: dataCommunicationCapDefId, type: string, description: "-"}

  CommunicationCappingRuleDimInputRepresentation:
    attributes:
      - {name: dim_id, api_name: dimId, type: string, description: "-"}
      - {name: dim_value_ids, api_name: dimValueIds, array: 1, type: string, description: "-"}
