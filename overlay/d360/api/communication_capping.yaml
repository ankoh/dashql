  - name: communication_capping_configuration_update
    method: PATCH
    host: connect
    path: /ssot/communication-capping/{id}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping/paths/~1ssot~1communication-capping~1%7Bid%7D/patch
    description: Changes a configuration's name, description, data spaces or related dimensions.
    example: CALL cdp.communication_capping_configuration_update (id => 'CONFIGURATION_ID', description => 'Caps for all marketing sends');
    options:
      - {name: id, in: path, type: string, required: true, description: "Configuration id, the `id` that `communication_capping_configuration_create` returns."}
      - {name: data_comm_cap_dataspaces, api_name: dataCommCapDataSpaces, in: body, schema: CommunicationCappingDataSpaceInputRepresentation, array: 1, description: "Data spaces associated with the configuration."}
      - {name: data_comm_cap_related_dims, api_name: dataCommCapRelatedDims, in: body, schema: CommunicationCappingRelatedDimInputRepresentation, array: 1, description: "Dimensions related to the configuration."}
      - {name: data_communication_cap_def_id, api_name: dataCommunicationCapDefId, in: body, type: string, description: "Capping definition id. Per the [reference](https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping), it's null on create and set only on update."}
      - {name: description, in: body, type: string, description: "-"}
      - {name: body_id, api_name: id, in: body, type: string, description: "Instance id of the configuration, per the [reference](https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping). It's the body field `id`, renamed because the path also has `id`."}
      - {name: name, in: body, type: string, description: "-"}
    columns:
      - {name: data_comm_cap_dataspaces, api_name: dataCommCapDataSpaces, type: JSON, array: 1, schema: CommunicationCappingDataSpaceRepresentation}
      - {name: data_comm_cap_related_dims, api_name: dataCommCapRelatedDims, type: JSON, array: 1, schema: CommunicationCappingRelatedDimRepresentation}
      - {name: data_communication_cap_def_id, api_name: dataCommunicationCapDefId, type: VARCHAR}
      - {name: data_communication_cap_status, api_name: dataCommunicationCapStatus, type: VARCHAR}
      - {name: description, type: VARCHAR}
      - {name: id, type: VARCHAR}
      - {name: last_status_date_time, api_name: lastStatusDateTime, type: TIMESTAMPTZ}
      - {name: last_status_error_code, api_name: lastStatusErrorCode, type: VARCHAR}
      - {name: name, type: VARCHAR}
    effect: write
    evidence: O
    result_description: One row. Schema `CommunicationCappingEntityRepresentation`.
    notes: "**Notes:** The body has its own `id`, so this function has both `id` (path) and `body_id`. The sources don't say whether the arrays replace the existing entries or add to them. See [`communication_capping_configuration_create`](#communication_capping_configuration_create) for the status a write can return."

  - name: communication_capping_rule_update
    method: PATCH
    host: connect
    path: /ssot/communication-capping/{id}/rules/{ruleIdOrName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping/paths/~1ssot~1communication-capping~1%7Bid%7D~1rules~1%7BruleIdOrName%7D/patch
    description: Changes a rule's limit, date window or dimension values. Use it to adjust a cap without recreating the rule.
    example: CALL cdp.communication_capping_rule_update (id => 'CONFIGURATION_ID', rule_id_or_name => 'Email_daily', limits => 5);
    options:
      - {name: id, in: path, type: string, required: true, description: "Configuration id, the `id` that `communication_capping_configuration_create` returns."}
      - {name: rule_id_or_name, api_name: ruleIdOrName, in: path, type: string, required: true, description: "Rule `id`, or a name. The sources don't say which name; `api_name` is the only name in the rule schema."}
      - {name: api_name, api_name: apiName, in: body, type: string, description: "-"}
      - {name: data_comm_cap_rule_dim, api_name: dataCommCapRuleDim, in: body, schema: CommunicationCappingRuleDimInputRepresentation, array: 1, description: "Dimension associations for the rule."}
      - {name: end_date, api_name: endDate, in: body, type: string, format: date-time, description: "End of the window when the rule is valid."}
      - {name: limits, in: body, type: integer, description: "Capping limit value: the [maximum number of messages](https://trailhead.salesforce.com/content/learn/modules/communication-capping-in-data-cloud-quick-look/get-to-know-communication-capping)."}
      - {name: start_date, api_name: startDate, in: body, type: string, format: date-time, description: "Start of the window when the rule is valid."}
    columns:
      - {name: api_name, api_name: apiName, type: VARCHAR}
      - {name: data_comm_cap_rule_dim, api_name: dataCommCapRuleDim, type: JSON, array: 1, schema: CommunicationCappingRuleDimRepresentation}
      - {name: data_communication_cap_def_id, api_name: dataCommunicationCapDefId, type: VARCHAR}
      - {name: end_date, api_name: endDate, type: TIMESTAMPTZ}
      - {name: id, type: VARCHAR}
      - {name: limits, type: BIGINT}
      - {name: source, type: VARCHAR}
      - {name: start_date, api_name: startDate, type: TIMESTAMPTZ}
    effect: write
    evidence: O
    result_description: One row. Schema `CommunicationCappingRuleRepresentation`.
    notes: "**Notes:** See [`communication_capping_rule_create`](#communication_capping_rule_create) for how the fields work."

  - name: communication_capping_dimension_update
    method: PATCH
    host: connect
    path: /ssot/communication-capping/dimensions/{dimensionId}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping/paths/~1ssot~1communication-capping~1dimensions~1%7BdimensionId%7D/patch
    description: Changes a dimension or its values. Use it when the possible values change, for example when a channel is added.
    example: CALL cdp.communication_capping_dimension_update (dimension_id => '1CDxx0000000001GAA', dimension_values => [(value = 'WhatsApp')]);
    options:
      - {name: dimension_id, api_name: dimensionId, in: path, type: string, required: true, description: "Dimension `id` from `communication_capping_dimension_list`."}
      - {name: api_name, api_name: apiName, in: body, type: string, description: "-"}
      - {name: dimension_name, api_name: dimensionName, in: body, type: string, description: "API name of the dimension object, such as `ssot__CommunicationChannel__dlm` in the [reference's sample](https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping)."}
      - {name: dimension_values, api_name: dimensionValues, in: body, schema: CommunicationCappingDimValueInputRepresentation, array: 1, description: "Values of the dimension."}
      - {name: function_type, api_name: functionType, in: body, type: string, description: "Function type. The [reference's samples](https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping) show `FUNCTIONAL_TYPE` and `NON_FUNCTIONAL_TYPE`."}
      - {name: hierarchy_order, api_name: hierarchyOrder, in: body, type: integer, description: "Position in the hierarchy. The reference's samples use 1 for Channel and 2 for Brand."}
      - {name: id, in: body, type: string, description: "-"}
      - {name: name, in: body, type: string, description: "-"}
    columns:
      - {name: api_name, api_name: apiName, type: VARCHAR}
      - {name: dimension_name, api_name: dimensionName, type: VARCHAR}
      - {name: dimension_values, api_name: dimensionValues, type: JSON, array: 1, schema: CommunicationCappingDimValueRepresentation}
      - {name: function_type, api_name: functionType, type: VARCHAR}
      - {name: hierarchy_order, api_name: hierarchyOrder, type: BIGINT}
      - {name: id, type: VARCHAR}
      - {name: name, type: VARCHAR}
    effect: write
    evidence: O
    result_description: One row. Schema `CommunicationCappingDimRepresentation`.
    notes: "**Notes:** Trailhead calls parameters [master data](https://trailhead.salesforce.com/content/learn/modules/communication-capping-in-data-cloud-quick-look/get-to-know-communication-capping): the values might change, but the parameters themselves don't. The sources don't say whether `dimension_values` replaces the existing values or adds to them. Rules and mappings refer to value ids, so check them before removing a value."

