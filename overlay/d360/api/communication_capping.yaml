title: Communication Capping
description: |
  Communication capping limits how many messages a customer, lead or prospect receives, for regulation, message fatigue or budget ([Trailhead](https://trailhead.salesforce.com/content/learn/modules/communication-capping-in-data-cloud-quick-look/get-to-know-communication-capping)). You define dimensions, which the UI calls parameters, such as channel and line of business. You give each dimension values, then write rules that cap a combination of values over a date window. A capping activation target is mapped to the same values, and segments activated through it get filtered.

  Trailhead's order is dimensions, rules, target mapping, then segment activation. The rule path needs a configuration id, so the configuration comes before its rules. The target itself comes from [`activation_target_create`](activation_targets.md#activation_target_create). No source says when to call enable, so the flow below puts it last.

  The gotchas that matter most:

  - The spec has no call that lists configurations, so keep the `id` from create.
  - Results show up in DMOs, not in this API: `CG_Audience_Dropped` holds the excluded profiles and the rule that dropped them, and `CG_Audience_Qualified` holds the included ones.
  - Capping [consumes Data 360 credits](https://trailhead.salesforce.com/content/learn/modules/communication-capping-in-data-cloud-quick-look/get-to-know-communication-capping).
  - Availability varies: [one changelog](https://help.salesforce.com/s/articleView?id=sf.c360_a_changelog_usage_and_access.htm&language=en_US&type=5) lists capping as a pilot and the [release notes](https://help.salesforce.com/s/articleView?id=release-notes.rn_c360_truth.htm&language=en_US&release=252&type=5) as a beta.

  The spec has no descriptions for this family. Field meanings below come from Trailhead and from search excerpts of the [API reference](https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping) and Salesforce Help, whose full text couldn't be downloaded.

  ```sql
  CALL cdp.communication_capping_dimension_create (api_name => 'Channel', dimension_name => 'ssot__CommunicationChannel__dlm', hierarchy_order => 1, dimension_values => [(value = 'Email')]);
  CALL cdp.communication_capping_configuration_create (name => 'Marketing caps', data_comm_cap_dataspaces => [(dataspace_id = 'DATA_SPACE_ID')], data_comm_cap_related_dims => [(api_name = 'Channel', data_comm_cap_dim_id = 'DIMENSION_ID')]);
  CALL cdp.communication_capping_rule_create (id => 'CONFIGURATION_ID', api_name => 'Email_daily', limits => 10, start_date => '2027-05-01T00:00:00Z', end_date => '2027-05-31T00:00:00Z', data_comm_cap_rule_dim => [(dim_id = 'DIMENSION_ID', dim_value_ids = ['DIMENSION_VALUE_ID'])]);
  CALL cdp.communication_capping_activation_target_metadata_map (activation_target_id => 'TARGET_ID', activation_target_name => 'Email_capped', data_comm_cap_dim_info => [(data_comm_cap_dim_id = 'DIMENSION_ID', data_comm_cap_dim_value_id = 'DIMENSION_VALUE_ID')]);
  CALL cdp.communication_capping_enable (id => 'CONFIGURATION_ID');
  ```

functions:
  - name: communication_capping_activation_target_metadata_delete
    method: DELETE
    host: connect
    path: /ssot/communication-capping/activation-target-capping-metadata/{activationTargetId}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping/paths/~1ssot~1communication-capping~1activation-target-capping-metadata~1%7BactivationTargetId%7D/delete
    description: Removes the dimension mapping of a capping activation target. Use it to detach a target from its dimension values.
    example: CALL cdp.communication_capping_activation_target_metadata_delete (activation_target_id => 'TARGET_ID');
    options:
      - {name: activation_target_id, api_name: activationTargetId, in: path, type: string, required: true, description: "-"}
    effect: write
    evidence: O
    result_description: No response body (HTTP 204). One row with only the standard columns.
    notes: "**Notes:** The sources don't say whether segments already activated through the target are affected."

  - name: communication_capping_rule_delete
    method: DELETE
    host: connect
    path: /ssot/communication-capping/rules/{ruleIdOrName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping/paths/~1ssot~1communication-capping~1rules~1%7BruleIdOrName%7D/delete
    description: Deletes a capping rule. Use it to retire a cap before its end date passes.
    example: CALL cdp.communication_capping_rule_delete (rule_id_or_name => 'Email_daily');
    options:
      - {name: rule_id_or_name, api_name: ruleIdOrName, in: path, type: string, required: true, description: "Rule `id`, or a name. The sources don't say which name; `api_name` is the only name in the rule schema."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 204). One row with only the standard columns.
    notes: "**Notes:** This is the only rule call whose path has no configuration id: delete is `/rules/{ruleIdOrName}`, and update is `/{id}/rules/{ruleIdOrName}`."

  - name: communication_capping_configuration_get
    method: GET
    host: connect
    path: /ssot/communication-capping/{id}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping/paths/~1ssot~1communication-capping~1%7Bid%7D/get
    description: Returns one capping configuration with its data spaces, dimensions and status. Use it to check the state of a configuration after you create or change it.
    example: CALL cdp.communication_capping_configuration_get (id => 'CONFIGURATION_ID');
    options:
      - {name: id, in: path, type: string, required: true, description: "Configuration id, the `id` that `communication_capping_configuration_create` returns."}
    columns:
      - {name: dataspaces_info, api_name: dataspacesInfo, type: JSON}
      - {name: description, type: VARCHAR}
      - {name: dimensions, type: JSON}
      - {name: id, type: VARCHAR}
      - {name: label, type: VARCHAR}
      - {name: name, type: VARCHAR}
      - {name: status, type: VARCHAR}
    effect: read
    evidence: O
    result_description: One row. Schema `CommunicationCappingRepresentation`.
    notes: "**Notes:** The spec has no call that lists configurations. The nearest is [`communication_capping_data_space_list`](activation_targets.md#communication_capping_data_space_list), which returns `data_communication_cap_def_id` per data space, but no source says this call's `id` accepts that value. This result has `status`, while create and update call the same thing `data_communication_cap_status`."

