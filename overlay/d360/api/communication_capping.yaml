    columns:
      - {name: api_name, api_name: apiName, type: VARCHAR}
      - {name: dimension_name, api_name: dimensionName, type: VARCHAR}
      - {name: dimension_values, api_name: dimensionValues, type: JSON, array: 1, schema: CommunicationCappingDimValueRepresentation}
      - {name: function_type, api_name: functionType, type: VARCHAR}
      - {name: hierarchy_order, api_name: hierarchyOrder, type: BIGINT}
      - {name: id, type: VARCHAR}
      - {name: name, type: VARCHAR}
    effect: write
    evidence: O
    result_description: One row per item of `/dimensions` in the response. Schema `CommunicationCappingDimRepresentation`.
    notes: "**Notes:** The HTTP path is `swap-priority`. The [reference's sample](https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Communication-Capping) sends only `id` and `hierarchy_order` per dimension, and the reference marks `dimensions` required, while the spec doesn't. The response returns the full dimensions. The sources don't explain how the order affects evaluation."

  - name: communication_capping_configuration_create
    method: POST
    host: connect
    path: /ssot/communication-capping
