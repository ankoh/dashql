      - {name: offset, in: query, type: integer, description: "-"}
      - {name: order_by_column, api_name: orderByColumn, in: query, type: string, enum: [Id, ActivationTargetId, Name, CreatedById, CreatedDate, LastModifiedById, LastModifiedDate, DataCommCapDimId, DataCommCapDimValueId], description: "-"}
      - {name: order_by_direction, api_name: orderByDirection, in: query, type: string, enum: [ASC, DESC], description: "-"}
    rows: /activationTargets
    columns:
      - {name: activation_target_id, api_name: activationTargetId, type: VARCHAR}
