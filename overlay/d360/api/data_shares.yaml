title: Data Shares
description: |
  Data shares publish Data 360 objects to another platform without copying them there. This is the outbound direction of zero copy. Reading external data into Data 360 is federation, and it uses connections and data streams instead. A share is a list of objects in one data space. A target is the connection to one external account or org. A [link](https://trailhead.salesforce.com/content/learn/modules/data-cloud-with-zero-copy/get-started-with-zero-copy-data-sharing) between them exposes the objects on the other side.

  The order is: create the share, wait until it is `Active`, create the target, then link them. The consumer then takes one more step on its own platform, such as subscribing to the listing in BigQuery or accepting the request in another Data 360 org.

  The gotchas that matter most:

  - The Help and blog walkthroughs authenticate Snowflake and BigQuery targets in a browser. The spec has no option for that step.
  - `data_share_target_create` takes different attributes per `target_type`. Its notes list them.
  - The spec's schemas and its request examples disagree on `dataspace_name` and `data_share_objects`.
  - `data_share_get` doesn't show which targets a share is linked to.

  Salesforce Help pages linked here could only be read as search excerpts, so check them before relying on a detail.

  ```sql
  CALL cdp.data_share_create (name => 'Sales_Data_Share', label => 'Sales Data Share', dataspace_name => 'default', data_share_objects => ['Sales_Order__dlm', 'Account_Home__dll']);
  CALL cdp.data_share_get (name_or_id => 'Sales_Data_Share'); /* repeat until status is Active */
  CALL cdp.data_share_target_create (target_type => 'BigQuery', name => 'BigQuery_Analytics_Target', label => 'BigQuery Analytics', target_email_id => 'analytics-team@example.com', target_email_type => 'Group');
  CALL cdp.data_share_link (name_or_id => 'Sales_Data_Share', data_share_target_names => ['BigQuery_Analytics_Target']);
  ```

functions:
  - name: data_share_target_delete
    method: DELETE
    host: connect
    path: /ssot/data-share-target/{nameOrId}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Shares/paths/~1ssot~1data-share-target~1%7BnameOrId%7D/delete
    description: Deletes a data share target. Since v63.0.
    example: CALL cdp.data_share_target_delete (name_or_id => 'BigQuery_Analytics_Target');
    options:
      - {name: name_or_id, api_name: nameOrId, in: path, type: string, required: true, description: "API name or record ID of the data share target. Since v63.0."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 200). One row with only the standard columns.
    notes: "**Notes:** [Manage Data Shares](https://help.salesforce.com/s/articleView?id=data.c360_a_manage_data_shares.htm&language=en_US&type=5) describes deleting unlinked shares and treats targets the same way, so unlink first with `data_share_unlink`. The spec doesn't state this rule or what the error looks like. Its status enum has `Deleting`, and it doesn't say whether the call returns before the target is gone."

  - name: data_share_delete
    method: DELETE
    host: connect
    path: /ssot/data-share/{nameOrId}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Shares/paths/~1ssot~1data-share~1%7BnameOrId%7D/delete
    description: Deletes a data share. Since v63.0.
    example: CALL cdp.data_share_delete (name_or_id => 'Sales_Data_Share');
    options:
      - {name: name_or_id, api_name: nameOrId, in: path, type: string, required: true, description: "API name or record ID of the data share. Since v63.0."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 200). One row with only the standard columns.
    notes: "**Notes:** [Manage Data Shares](https://help.salesforce.com/s/articleView?id=data.c360_a_manage_data_shares.htm&language=en_US&type=5) says you can delete a share that is unlinked and no longer needed, so unlink it first. The spec doesn't state this rule. Its status enum has `Deleting`, and it doesn't say whether the call returns before the share is gone."

