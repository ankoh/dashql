  - name: data_share_update
    method: PATCH
    host: connect
    path: /ssot/data-share/{nameOrId}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Shares/paths/~1ssot~1data-share~1%7BnameOrId%7D/patch
    description: Updates a data share's label, description or objects. Use it to add objects to a share or remove them from it. Since v63.0.
    example: CALL cdp.data_share_update (name_or_id => 'Sales_Data_Share', label => 'Sales Data Share (Updated)', description => 'Added order-line DMO', data_share_objects => ['Account_Home__dll', 'Sales_Order__dlm', 'Sales_Order_Line__dlm', 'Contact_Point_Email__cio']);
    options:
      - {name: name_or_id, api_name: nameOrId, in: path, type: string, required: true, description: "API name or record ID of the data share. Since v63.0."}
      - {name: dataspace_name, api_name: dataSpaceName, in: body, type: string, description: "Name of the data space. If unspecified, the `default` data space is used. This property is required for data graph resources. Since v59.0."}
      - {name: description, in: body, type: string, description: "Description of the object to create. Since v59.0."}
      - {name: label, in: body, type: string, description: "Label of the object to create. This property is required for data graph resources. Since v59.0."}
      - {name: name, in: body, type: string, description: "API name of the object to create. This property is required for data graph resources. Since v59.0."}
      - {name: data_share_objects, api_name: dataShareObjects, in: body, array: 1, type: string, description: "List of data share object names to include in the data share. Since v63.0."}
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: data_share_objects, api_name: dataShareObjects, type: JSON, schema: DataShareObjectRepresentation, description: "Data share objects included in the data share. Since v63.0."}
      - {name: dataspace_name, api_name: dataspaceName, type: VARCHAR, description: "Name of the data space that the data share belongs to. Since v63.0."}
      - {name: status, type: VARCHAR, description: "Status of the data share. Since v63.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `DataShareRepresentation`.
    notes: |
      **Done when:** `data_share_get.status` is `Active`. `Error` means it failed. The spec reuses one response example with `PROCESSING` and doesn't say how long an update takes.

      **Notes:** This changes what consumers can see. Per [Manage Data Shares](https://help.salesforce.com/s/articleView?id=data.c360_a_manage_data_shares.htm&language=en_US&type=5), added objects become reachable through the linked target and removed objects stop being reachable.

      The spec doesn't say whether `data_share_objects` replaces the list or adds to it. Its request example sends the three existing names plus one new one, which reads as a full replacement. Send the whole list. `data_share_objects` has the same conflict as in [`data_share_create`](#data_share_create).

      The options come from the spec's shared input schema. The spec doesn't say whether `name` or `dataspace_name` can change, and its example sends neither.

