title: Agent Configuration
description: |
  An agent in this family is a registration for [Agentic Memory and Context](https://developer.salesforce.com/docs/data/agentic-memory-context/guide/agentic-memory-agent-registration.md). The spec gives it a name, a label, a data space and data sources, and no prompts or behavior. Registering provisions what the [memory calls](agentic_memory.md) need: ingestion connectors, data lake objects, DMOs and data graphs.

  Registration comes first. Wait until `status` is `Active`, because the memory and context calls return errors while it's `Processing`. Then pass the agent's API name as `agent_id` to those calls.

  What matters most:

  - The spec marks these calls as available from API v66.0.
  - You can't change an agent's API name or data space afterwards.
  - The Profile DMO applies to the whole data space, not just this agent.
  - `agent_delete` removes the agent's conversations, session history and extracted memories, and can't be undone.
  - Agentic Memory and Context is free during Limited GA. [Memory extraction will consume flex credits](https://developer.salesforce.com/docs/data/agentic-memory-context/guide/agentic-memory-billing.md) once pricing takes effect.

  ```sql
  CALL cdp.agent_create (name => 'support_agent', label => 'Support Agent');

  /* Repeat until status is Active. */
  CALL cdp.agent_get (agent_id_or_api_name => 'support_agent');

  CALL cdp.agent_list (limit => 50);
  ```

functions:
  - name: agent_delete
    method: DELETE
    host: connect
    path: /ssot/agentic/agent/{agentIdOrApiName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Agent-Configuration/paths/~1ssot~1agentic~1agent~1%7BagentIdOrApiName%7D/delete
    description: Deletes an existing agent. Since v66.0.
    example: CALL cdp.agent_delete (agent_id_or_api_name => 'support_agent');
    options:
      - {name: agent_id_or_api_name, api_name: agentIdOrApiName, in: path, type: string, required: true, description: "The agent's `id` or its API name (`name` at creation)."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 200). One row with only the standard columns.
    notes: |
      **Notes:** Deleting [removes the agent's conversations, session history and extracted memories, and can't be undone](https://developer.salesforce.com/docs/data/agentic-memory-context/guide/agentic-memory-agent-registration.md). One lab found that [curated memories belong to the registration](https://github.com/congmingwudi/a2a-lab/blob/main/plan/03-results.md): a second registration with the same configuration didn't list them. It changes configuration with an unpublished PATCH rather than deleting and recreating (community, one org).

      The same lab's [script](https://github.com/congmingwudi/a2a-lab/blob/main/scripts/setup_agentic_memory.py) sends an explicit empty JSON body on this DELETE, saying the API requires it through current `sf` CLI versions. It also re-lists afterwards, so an empty 2xx isn't taken as proof (community).

  - name: agent_get
    method: GET
    host: connect
    path: /ssot/agentic/agent/{agentIdOrApiName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Agent-Configuration/paths/~1ssot~1agentic~1agent~1%7BagentIdOrApiName%7D/get
    description: Returns one agent. Use it to poll `status` after `agent_create`, and to read its configuration.
    example: CALL cdp.agent_get (agent_id_or_api_name => 'support_agent');
    options:
      - {name: agent_id_or_api_name, api_name: agentIdOrApiName, in: path, type: string, required: true, description: "The agent's `id` or its API name (`name` at creation)."}
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: configuration, type: JSON, schema: AgentConfigurationRepresentation, description: "Configuration of the agent. Since v66.0."}
      - {name: dataspace_name, api_name: dataspaceName, type: VARCHAR, description: "Name of the data space that the agent belongs to. Since v66.0."}
      - {name: setup_name, api_name: setupName, type: JSON, schema: CdpAssetReferenceRepresentation, description: "Name of the agent setup. Since v66.0."}
      - {name: status, type: VARCHAR, description: "Status of the agent. Since v66.0."}
    effect: read
    evidence: O
    result_description: One row. Schema `AgentRepresentation`.
    notes: |
      **Notes:** `status` is `Processing`, `Active` or `Error`. [`Error` points at the out-of-the-box data graphs](https://developer.salesforce.com/docs/data/agentic-memory-context/guide/agentic-memory-agent-registration.md): an additional data graph that's broken or still being created leaves the agent active. The case varies: the docs, the spec's enum and its list example use `Active`, while its create and get examples show `ACTIVE`. Compare case-insensitively.

      `ACTIVE` here doesn't mean the memory calls work yet. One lab saw [404 "Agent not found" from the tenant host for about 2.4 minutes](https://github.com/congmingwudi/a2a-lab/blob/main/plan/03-results.md) after registering (community, one org).

      The spec dates `configuration` from v66.0. The same lab's [notes](https://github.com/congmingwudi/a2a-lab/blob/main/plan/18-agentic-memory-context.md) report it missing at v66.0 and present at v67.0, with an extra `isMemoryGenerationEnabled` field the spec doesn't list (community, one org).

  - name: agent_list
    method: GET
    host: connect
    path: /ssot/agentic/agents
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Agent-Configuration/paths/~1ssot~1agentic~1agents/get
    description: Returns a list of all registered agents. Since v66.0.
    example: CALL cdp.agent_list ();
    options:
      - {name: filters, in: query, type: string, description: "Field names by which to filter results. Specify a comma-separated list of values of the form `[field=value]`. Since v66.0."}
      - {name: limit, in: query, type: integer, description: "Maximum number of agents to return from `1` through `200`. Since v66.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. Must be an integer greater than zero. If unspecified, no rows are skipped. Since v66.0."}
      - {name: order_by, api_name: orderBy, in: query, type: string, description: "Sort order for the result set: `ASC` for ascending or `DESC` for descending. If unspecified, results are returned in ascending order. Since v66.0."}
    rows: /agents
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: configuration, type: JSON, schema: AgentConfigurationRepresentation, description: "Configuration of the agent. Since v66.0."}
      - {name: dataspace_name, api_name: dataspaceName, type: VARCHAR, description: "Name of the data space that the agent belongs to. Since v66.0."}
      - {name: setup_name, api_name: setupName, type: JSON, schema: CdpAssetReferenceRepresentation, description: "Name of the agent setup. Since v66.0."}
      - {name: status, type: VARCHAR, description: "Status of the agent. Since v66.0."}
    paging: {kind: url, from: {body: /nextPageUrl}}
    effect: read
    evidence: O
    result_description: "One row per item of `/agents` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`, `limit`, `offset`. Schema `AgentRepresentation`."
    notes: |
      **Paging:** `next_page_url`.

      **Notes:** The spec doesn't say which fields `filters` accepts. With no agents registered, one lab got [an empty list, not an error](https://github.com/congmingwudi/a2a-lab/blob/main/plan/18-agentic-memory-context.md) (community, one org).

  - name: agent_create
    method: POST
    host: connect
    path: /ssot/agentic/agent
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Agent-Configuration/paths/~1ssot~1agentic~1agent/post
    description: Registers an agent for Agentic Memory and Context and provisions its infrastructure. Run it once per agent, before any memory or context call.
    example: CALL cdp.agent_create (name => 'support_agent', label => 'Support Agent', description => 'Support chat with customer memory', configuration => (profile_dmos = [(name = 'UnifiedIndividual__dlm')], context_data_sources = (data_graphs = [(name = 'CustomerDG1')])));
    options:
      - {name: dataspace_name, api_name: dataSpaceName, in: body, type: string, description: "Name of the data space. If unspecified, the `default` data space is used. This property is required for data graph resources. Since v59.0. Sources also spell it `dataspaceName`: quote that name to send that spelling."}
      - {name: description, in: body, type: string, description: "Description of the object to create. Since v59.0."}
      - {name: label, in: body, type: string, description: "Label of the object to create. This property is required for data graph resources. Since v59.0."}
      - {name: name, in: body, type: string, description: "API name of the object to create. This property is required for data graph resources. Since v59.0."}
      - {name: configuration, in: body, schema: AgentConfigurationInputRepresentation, description: "Configuration of the agent. Since v66.0."}
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: configuration, type: JSON, schema: AgentConfigurationRepresentation, description: "Configuration of the agent. Since v66.0."}
      - {name: dataspace_name, api_name: dataspaceName, type: VARCHAR, description: "Name of the data space that the agent belongs to. Since v66.0."}
      - {name: setup_name, api_name: setupName, type: JSON, schema: CdpAssetReferenceRepresentation, description: "Name of the agent setup. Since v66.0."}
      - {name: status, type: VARCHAR, description: "Status of the agent. Since v66.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `AgentRepresentation`.
    notes: |
      **Done when:** `agent_get.status` is `Active`, compared case-insensitively. `Error` means the agent has errors, so check its data graphs. One lab got `ACTIVE` straight from this call once the data space's setup existed (community, one org).

      **Notes:** The spec, the docs and one lab's results disagree on several points.

      - **Data space field:** the spec's schema calls it `dataSpaceName`, but the spec's own examples use `dataspaceName`. One lab got [`JSON_PARSER_ERROR Unrecognized field "dataSpaceName"`](https://github.com/congmingwudi/a2a-lab/blob/main/plan/18-agentic-memory-context.md) and succeeded with the lowercase `s` (community, one org). The example above leaves it out and uses the default data space.
      - **Inherited wording:** "required for data graph resources" comes from a shared base schema and isn't about agents.
      - **`associated_data_graph`:** the spec's example sends it on `profile_dmos`, but the schema doesn't have it, so the example above leaves it out.
      - **Setup:** the [registration guide](https://developer.salesforce.com/docs/data/agentic-memory-context/guide/agentic-memory-agent-registration.md) says both that the first registration creates the data space's agentic setup and that API callers create the setup first. The spec has `AgentSetup*` schemas but no path. One lab used an unpublished [`POST /ssot/agentic/setups`](https://github.com/congmingwudi/a2a-lab/blob/main/plan/18-agentic-memory-context.md), which took about 6 m 45 s to go active, and left open whether it's needed (community, one org).
      - **`profile_dmos`:** takes the DMO developer name. The docs say [you can't change it afterwards, and it applies to the whole data space](https://developer.salesforce.com/docs/data/agentic-memory-context/guide/agentic-memory-profile-unification.md). One lab's [unpublished v67 PATCH](https://github.com/congmingwudi/a2a-lab/blob/main/plan/03-results.md) changing it on one agent was accepted and kept that agent's memories, and an error message there implies the default is `UnifiedIndividual__dlm` (community, one org).
      - **`data_graphs`:** takes developer names of graphs in the agent's data space, [at most two: one rooted on User, one on Individual or Unified Individual](https://developer.salesforce.com/docs/data/agentic-memory-context/guide/agentic-memory-associate-rtdg-with-agent.md). One lab got `INVALID_API_INPUT` when the graph's root wasn't declared in `profile_dmos`, and its attached graph [never appeared in GetContext](https://github.com/congmingwudi/a2a-lab/blob/main/plan/03-results.md) over 16 reads (community, one org).
      - **Memory extraction:** isn't an input in the spec. One lab found it off after registration and turned it on with `configuration.isMemoryGenerationEnabled` through the same PATCH (community, one org).

      The spec returns 409 for a name already in use. The guide lists the [Data Cloud Architect permission set](https://developer.salesforce.com/docs/data/agentic-memory-context/guide/agentic-memory-agent-registration.md) for registering in the UI, and says nothing about the API.

schemas:
  AgentConfigurationInputRepresentation:
    description: Represents the input for agent configuration.
    attributes:
      - {name: context_data_sources, api_name: contextDataSources, schema: AgentContextDataSourcesInputRepresentation, description: "Context data sources for the agent. Since v66.0."}
      - {name: profile_dmos, api_name: profileDmos, schema: ProfileDmoInputRepresentation, array: 1, description: "List of profile data model objects (DMOs). Since v66.0."}

  AgentContextDataSourcesInputRepresentation:
    description: Represents the input for agent context data sources.
    attributes:
      - {name: data_graphs, api_name: dataGraphs, schema: DataGraphInputRepresentation, array: 1, description: "List of data graphs. Since v66.0."}

  DataGraphInputRepresentation:
    description: Represents the input for a data graph.
    attributes:
      - {name: name, type: string, description: "Name of the data graph. Since v66.0."}

  ProfileDmoInputRepresentation:
    description: Represents the input for a profile data model object (DMO).
    attributes:
      - {name: name, type: string, description: "Name of the profile data model object (DMO). Since v66.0."}
      - {name: associated_data_graph, api_name: associatedDataGraph, type: string, description: "Not in the spec schema: from the spec's examples."}
