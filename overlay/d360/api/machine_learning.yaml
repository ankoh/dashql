title: Machine Learning
description: |
  This family trains predictive models, serves them, and manages retrievers for AI search. Everything sits under `/ssot/machine-learning`. Functions with evidence `S` come from Salesforce's [MCP server](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp) and aren't in the spec.

  Training runs in this order. Inspect the data with `ml_query_setup_fields`, `ml_query_data_profile`, `ml_query_outcome` and `ml_query_row_count`. Then call `ml_model_setup_create`, `ml_setup_version_create` and `ml_setup_version_update` with `status = 'Training'`. A version that reaches `Published` produces a model artifact, and you wrap that artifact with `ml_configured_model_create`. Enable the configured model, then either score rows with `ml_predict` or batch-score a DMO with a prediction job.

  Retrievers are separate. They need a search index with `runtime_status` = `READY`. Test one with `hybrid_search()` in a `SELECT` over the connection.

  The gotchas that matter most:

  - [Retrying `retriever_create` creates a duplicate](https://github.com/salesforce-misc/Data360AgentforceSolutionKitRetail/blob/main/.claude/skills/create-individual-retrievers/SKILL.md). List by label before retrying.
  - Prediction job definitions start `Inactive`. Activate one before you run it, and deactivate it before most edits.
  - For several `O` functions the spec declares only a base schema. Variant attributes such as `input_config` are in [Schemas](#schemas), and each function's notes say which apply.
  - Keying differs: `model_setup_id_or_name` takes either, but a setup version takes only its ID.

  ```sql
  CALL cdp.ml_setup_version_update (model_setup_id_or_name => 'Attrition_Risk_Predictor', model_setup_version_id => '14kSB0000005d8nYAA', status => 'Training');
  CALL cdp.ml_configured_model_update (configured_model_id_or_name => 'Attrition_Predictor_Catboost', status => 'Enabled');
  CALL cdp.prediction_job_def_update (prediction_job_def_id_or_name => 'attrition_scores', activation_status => 'Active');
  CALL cdp.prediction_job_run (type => 'Prediction', input => (name = 'attrition_scores'));
  CALL cdp.prediction_job_def_get (prediction_job_def_id_or_name => 'attrition_scores');
  ```

functions:
  - name: ml_configured_model_delete
    method: DELETE
    host: connect
    path: /ssot/machine-learning/configured-models/{configuredModelIdOrName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Machine-Learning/paths/~1ssot~1machine-learning~1configured-models~1%7BconfiguredModelIdOrName%7D/delete
    tools: [d360_ml_configured_model_delete]
    description: Delete a configured model. Since v61.0.
    example: CALL cdp.ml_configured_model_delete (configured_model_id_or_name => '...');
    options:
      - {name: configured_model_id_or_name, api_name: configuredModelIdOrName, in: path, type: string, required: true, description: "Configured model ID or name. A name has the form `<namespace>__<devname>`, for example `mynamespace__ourGPT35Turbo`."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 200). One row with only the standard columns.

  - name: ml_model_artifact_delete
    method: DELETE
    host: connect
    path: /ssot/machine-learning/model-artifacts/{modelArtifactIdOrName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Machine-Learning/paths/~1ssot~1machine-learning~1model-artifacts~1%7BmodelArtifactIdOrName%7D/delete
    tools: [d360_ml_model_artifact_delete]
    description: Delete the model artifact. Since v61.0.
    example: CALL cdp.ml_model_artifact_delete (model_artifact_id_or_name => '...');
    options:
      - {name: model_artifact_id_or_name, api_name: modelArtifactIdOrName, in: path, type: string, required: true, description: "Model artifact ID or developer name, for example `Attrition_Risk_Predictor_v1__mla`."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 200). One row with only the standard columns.
    notes: "**Notes:** [Predictive deletes do not cascade](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/runtime/FamilyCatalog.java): configured models that reference the artifact become orphaned. Check with `ml_configured_model_list (asset_id_or_name => ..., asset_type => 'ModelArtifact')` first."

  - name: prediction_job_def_delete
    method: DELETE
    host: connect
    path: /ssot/machine-learning/prediction-job-definitions/{predictionJobDefIdOrName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Machine-Learning/paths/~1ssot~1machine-learning~1prediction-job-definitions~1%7BpredictionJobDefIdOrName%7D/delete
    tools: [d360_prediction_job_def_delete]
    description: Delete a specific prediction job definition. Since v59.0.
    example: CALL cdp.prediction_job_def_delete (prediction_job_def_id_or_name => '...');
    options:
      - {name: prediction_job_def_id_or_name, api_name: predictionJobDefIdOrName, in: path, type: string, required: true, description: "Prediction job definition ID or API name."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 200). One row with only the standard columns.
    notes: "**Notes:** [Irreversible](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/machinelearning/predictionjob/PredictionJobDefTools.java)."

  - name: retriever_delete
    method: DELETE
    host: connect
    path: /ssot/machine-learning/retrievers/{retrieverIdOrName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Machine-Learning/paths/~1ssot~1machine-learning~1retrievers~1%7BretrieverIdOrName%7D/delete
    tools: [d360_retriever_delete]
    description: Deletes a retriever and all its configuration versions. The retriever must not be used by other entities. The spec marks this endpoint as pilot or beta. Since v61.0.
    example: CALL cdp.retriever_delete (retriever_id_or_name => '...');
    options:
      - {name: retriever_id_or_name, api_name: retrieverIdOrName, in: path, type: string, required: true, description: "Retriever ID or the parent retriever's top-level `name`. The `active_configuration.name` value returns `ITEM_NOT_FOUND`."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 200). One row with only the standard columns.
    notes: "**Notes:** The way to remove a duplicate left by a retried `retriever_create`. [The kit](https://github.com/salesforce-misc/Data360AgentforceSolutionKitRetail/blob/main/.claude/skills/create-individual-retrievers/SKILL.md) (one org) saw HTTP 204 and the spec declares 200, so accept both."

  - name: retriever_config_delete
    method: DELETE
    host: connect
    path: /ssot/machine-learning/retrievers/{retrieverIdOrName}/configurations/{retrieverConfigurationIdOrName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Machine-Learning/paths/~1ssot~1machine-learning~1retrievers~1%7BretrieverIdOrName%7D~1configurations~1%7BretrieverConfigurationIdOrName%7D/delete
    tools: [d360_retriever_config_delete]
    description: Deletes one configuration version of a retriever. The spec marks this endpoint as pilot or beta. Since v61.0.
    example: CALL cdp.retriever_config_delete (retriever_configuration_id_or_name => '...', retriever_id_or_name => '...');
    options:
      - {name: retriever_configuration_id_or_name, api_name: retrieverConfigurationIdOrName, in: path, type: string, required: true, description: "Configuration ID or name."}
      - {name: retriever_id_or_name, api_name: retrieverIdOrName, in: path, type: string, required: true, description: "Retriever ID or the parent retriever's top-level `name`. The `active_configuration.name` value returns `ITEM_NOT_FOUND`."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 200). One row with only the standard columns.

  - name: ml_configured_model_list
    method: GET
    host: connect
    path: /ssot/machine-learning/configured-models
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Machine-Learning/paths/~1ssot~1machine-learning~1configured-models/get
    tools: [d360_ml_configured_model_list]
    description: Get the set of configured models and their properties. Since v61.0.
    example: CALL cdp.ml_configured_model_list (asset_id_or_name => 'Attrition_Risk_Predictor_v1__mla', asset_type => 'ModelArtifact');
    options:
      - {name: asset_id_or_name, api_name: assetIdOrName, in: query, type: string, description: "The model's name or ID. If not provided, information for all configured models is returned. Since v61.0."}
      - {name: asset_type, api_name: assetType, in: query, type: string, enum: [ModelArtifact, ModelSetup], description: "Whether the model is a configured model or a model artifact. Since v61.0."}
      - {name: capabilities, in: query, array: 1, type: string, enum: [BinaryClassification, ChatCompletion, Completion, Embedding, Generic, MulticlassClassification, Regression], description: "Model capability. Since v61.0."}
      - {name: connector_type, api_name: connectorType, in: query, type: string, enum: [Anthropic, AzureOpenAI, Bedrock, Databricks, Generic, InternalEmbedding, OpenAI, SageMaker, VertexAI], description: "For models that are externally connected, indicates the type of connector. Since v61.0."}
      - {name: limit, in: query, type: integer, description: "Maximum number of models to display on each page. Since v61.0."}
      - {name: model_type, api_name: modelType, in: query, type: string, enum: [Generative, Predictive, Unknown], description: "The type of model. Since v61.0."}
      - {name: offset, in: query, type: integer, description: "The number of models to skip, or offset, during pagination. Since v61.0."}
      - {name: out_of_the_box, api_name: outOfTheBox, in: query, type: boolean, description: "If `true`, the model is managed by Salesforce. Since v61.0."}
      - {name: search, in: query, type: string, description: "The search string to use when filtering the query. Since v61.0."}
      - {name: source_type, api_name: sourceType, in: query, type: string, enum: [EdcNoCode, ModelConnector, OutOfTheBox], description: "The model's source. - `OutOfTheBox` — a model managed by Salesforce. - `ModelConnector` — an external model exposed to Salesforce through a connector. - `EdcNoCode` — a model created using a no-code or low-code model builder. Since v61.0."}
    rows: /configuredModels
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: actionable_fields, api_name: actionableFields, type: JSON, array: 1, schema: CdpMlCustomizableFieldRepresentation, description: "List of actionable fields. Since v61.0."}
      - {name: activations, type: JSON, description: "List of activations. Since v61.0."}
      - {name: artifact, type: JSON, schema: CdpAssetReferenceRepresentation, description: "The model artifact. Since v61.0."}
      - {name: capability, type: VARCHAR, description: "Model capability. Since v61.0."}
      - {name: connector_type, api_name: connectorType, type: VARCHAR, description: "If the configured model references a model connector, this parameter indicates the connector type. Since v61.0."}
      - {name: description, type: VARCHAR, description: "User-defined description of the configured model. Since v61.0."}
      - {name: foundational_model, api_name: foundationalModel, type: JSON, schema: CdpMlFoundationalModelRepresentation, description: "Details for the foundational model. Since v59.0."}
      - {name: generative_model_type, api_name: generativeModelType, type: VARCHAR, description: "Type of generative model. Since v59.0."}
      - {name: input_fields, api_name: inputFields, type: JSON, array: 1, schema: CdpMlModelInputFieldBaseRepresentation, description: "List of input features into the model. Since v59.0."}
      - {name: input_types, api_name: inputTypes, type: JSON, array: 1, schema: MlModelInputTypeRepresentation, description: "List of supporting input types for multi-modalities. This includes parameters, such as maxToken for text input limits or maxImages for image input capacity. Since v63.0."}
      - {name: is_batch_supported, api_name: isBatchSupported, type: BOOLEAN, description: "Indicates whether this model supports batch (`true`) or not (`false`). Since v63.0."}
      - {name: last_activated_by, api_name: lastActivatedBy, type: JSON, schema: CdpUserRepresentation, description: "Information about the user who last activated the configured model. Since v61.0."}
      - {name: last_activated_date, api_name: lastActivatedDate, type: VARCHAR, description: "Date the configured model was last activated. Since v61.0."}
      - {name: model_capabilities, api_name: modelCapabilities, type: JSON, description: "List of capabilities supported by the model. Since v63.0."}
      - {name: model_disabled_reasons, api_name: modelDisabledReasons, type: JSON, description: "Reason(s) why the model status is disabled. Since v64.0."}
      - {name: model_type, api_name: modelType, type: VARCHAR, description: "Referenced model type. Since v61.0."}
      - {name: output_fields, api_name: outputFields, type: JSON, array: 1, schema: CdpMlModelOutputFieldRepresentation, description: "List of output features from the model. Since v59.0."}
      - {name: output_types, api_name: outputTypes, type: JSON, array: 1, schema: MlModelOutputTypeRepresentation, description: "List of supporting output types for multi-modalities, including parameters and their corresponding values. Since v63.0."}
      - {name: parameter_overrides, api_name: parameterOverrides, type: JSON, array: 1, schema: CdpMlModelParameterOverrideBaseRepresentation, description: "List of model parameter overrides. Since v61.0."}
      - {name: parameters, type: JSON, array: 1, schema: CdpMlModelParameterDefinitionBaseRepresentation, description: "List of parameters supported by the model. Since v59.0."}
      - {name: runtime_type, api_name: runtimeType, type: VARCHAR, description: "Model runtime type. Since v59.0."}
      - {name: setup_type, api_name: setupType, type: VARCHAR, description: "Referenced setup type. - `OutOfTheBox` — a model managed by Salesforce. - `ModelConnector` — an external model exposed to Salesforce through a connector. - `EdcNoCode` — a model created using a no-code or low-code model builder. Since v61.0."}
      - {name: status, type: VARCHAR, description: "Model status. Since v61.0."}
      - {name: visibility, type: VARCHAR, description: "Model visibility. Since v62.0."}
    paging: {kind: url, from: {body: /nextPageUrl}}
    effect: read
    evidence: O
    result_description: "One row per item of `/configuredModels` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`. Schema `MlConfiguredModelRepresentation`."
    notes: |
      **Paging:** `next_page_url`.

      **Notes:** `asset_id_or_name` with `asset_type` finds the configured models [bound to an artifact or a model setup](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/machinelearning/configuredmodel/ConfiguredModelTools.java). The MCP server lists enum values the spec omits: `model_type` also takes `Transcribe`, `SpeechSynthesis` and `Summarization`, and `capabilities` also takes `Clustering`, `Transcribe`, `SpeechSynthesis`, `Summarization`, `Forecast`, `SentimentAnalysis` and `TopicClassification`. It also has a `data_cloud_one_visibility` filter (`All`, `Local`, `Remote`, `Consumable`) that the spec lacks.

  - name: ml_configured_model_get
    method: GET
    host: connect
    path: /ssot/machine-learning/configured-models/{configuredModelIdOrName}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Machine-Learning/paths/~1ssot~1machine-learning~1configured-models~1%7BconfiguredModelIdOrName%7D/get
    tools: [d360_ml_configured_model_get]
    description: Get the configured model. If using the model's name, use `<namespace>__<devname>`, for example `mynamespace__ourGPT35Turbo`. Since v61.0.
    example: CALL cdp.ml_configured_model_get (configured_model_id_or_name => 'Attrition_Predictor_Catboost');
    options:
      - {name: configured_model_id_or_name, api_name: configuredModelIdOrName, in: path, type: string, required: true, description: "Configured model ID or name. A name has the form `<namespace>__<devname>`, for example `mynamespace__ourGPT35Turbo`."}
      - {name: filter_group, api_name: filterGroup, in: query, type: string, description: "Group on which to filter response results. Valid values are `Big`, `Medium`, and `Small`. - `Big` provides comprehensive results by returning properties whose filter group is `Big`, `Medium`, or `Small`. - `Medium` provides moderate results by returning properties whose filter group is `Medium` or `Small`. - `Small` provides essential results by returning only properties whose filter group is `Small`. The default is `Big`. Since v61.0."}
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what created the model configuration, artifact, or other asset. Since v60.0."}
      - {name: created_date, api_name: createdDate, type: VARCHAR, description: "Date that the artifact was created. Since v60.0."}
      - {name: id, type: VARCHAR, description: "18-character ID of the asset. Since v60.0."}
      - {name: label, type: VARCHAR, description: "Label of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation, description: "Who or what last modified the asset. Since v60.0."}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR, description: "When the asset was last modified. Since v60.0."}
      - {name: name, type: VARCHAR, description: "Name of the asset. Since v60.0."}
      - {name: namespace, type: VARCHAR, description: "Namespace of the asset. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: url, type: VARCHAR, description: "The artifact's, configured model's, or other asset's URL. Not applicable to the [get activation](https://developer.salesforce.com/docs/data/connectapi/references/spec?meta=getActivation) endpoint. Since v60.0."}
      - {name: actionable_fields, api_name: actionableFields, type: JSON, array: 1, schema: CdpMlCustomizableFieldRepresentation, description: "List of actionable fields. Since v61.0."}
      - {name: activations, type: JSON, description: "List of activations. Since v61.0."}
      - {name: artifact, type: JSON, schema: CdpAssetReferenceRepresentation, description: "The model artifact. Since v61.0."}
      - {name: capability, type: VARCHAR, description: "Model capability. Since v61.0."}
      - {name: connector_type, api_name: connectorType, type: VARCHAR, description: "If the configured model references a model connector, this parameter indicates the connector type. Since v61.0."}
      - {name: description, type: VARCHAR, description: "User-defined description of the configured model. Since v61.0."}
      - {name: foundational_model, api_name: foundationalModel, type: JSON, schema: CdpMlFoundationalModelRepresentation, description: "Details for the foundational model. Since v59.0."}
      - {name: generative_model_type, api_name: generativeModelType, type: VARCHAR, description: "Type of generative model. Since v59.0."}
