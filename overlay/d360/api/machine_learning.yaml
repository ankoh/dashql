      - {name: limit, in: query, type: integer, description: "Page size (default platform-defined)."}
      - {name: offset, in: query, type: integer, description: "Pagination offset."}
    rows: /modelSetups
    paging: {kind: offset, option: offset, size: limit, start: 0}
    effect: read
    unknown: warning
    evidence: S
    result_description: One row per item of `/modelSetups` in the response. This shape comes from an [MCP test fixture](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/test/java/com/salesforce/data360/mcp/tools/machinelearning/setup/ModelSetupToolsTest.java). The sources don't document the item fields, so each item is in `_raw`.
    notes: "**Paging:** `limit` and `offset`. The sources don't document a next-page field."

  - name: ml_model_setup_get
    method: GET
    host: connect
    path: /ssot/machine-learning/model-setups/{idOrName}
    tools: [d360_ml_model_setup_get]
    description: Gets one model setup by ID or developer name.
    example: CALL cdp.ml_model_setup_get (model_setup_id_or_name => 'Attrition_Risk_Predictor');
    options:
      - {name: model_setup_id_or_name, api_name: idOrName, in: path, type: string, required: true, description: "Model-setup id or developer name."}
    columns:
      - {name: id, type: VARCHAR, description: "Model setup ID."}
    effect: read
    unknown: warning
    evidence: S
    result_description: One row. This shape comes from an [MCP test fixture](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/test/java/com/salesforce/data360/mcp/tools/machinelearning/setup/ModelSetupToolsTest.java). Other response fields go to `_raw`.

  - name: ml_model_setup_create
    method: POST
    host: connect
    path: /ssot/machine-learning/model-setups
    tools: [d360_ml_model_setup_create]
    description: Creates a model setup, the parent record for setup versions. This is step 1 of 3 and starts no training. Follow with `ml_setup_version_create`.
    example: CALL cdp.ml_model_setup_create (label => 'Attrition Risk Predictor', description => 'Predict whether an employee will leave the company.', model_type => 'Predictive', model_capability => 'BinaryClassification', setup_type => 'EdcNoCode', outcome_definition => (goal = 'Minimize', field_names = ['Attrition__c']));
    options:
      - {name: label, in: body, type: string, required: true, description: "Display label for the model setup container."}
      - {name: description, in: body, type: string, description: "Free-form description."}
      - {name: model_type, api_name: modelType, in: body, type: string, required: true, description: "Model type. One of: Predictive, Generative, Transcribe, SpeechSynthesis, Summarization, Unknown."}
      - {name: model_capability, api_name: modelCapability, in: body, type: string, required: true, description: "Model capability. For predictive use one of: Regression, BinaryClassification, MulticlassClassification, Clustering.)"}
      - {name: setup_type, api_name: setupType, in: body, type: string, required: true, description: "Setup type. One of: EdcNoCode, OutOfTheBox, ModelConnector. Use EdcNoCode for the agent-authored, no-code training flow."}
      - {name: connector_type, api_name: connectorType, in: body, type: string, description: "Connector type: only when setup_type=ModelConnector. One of: SageMaker, OpenAI, AzureOpenAI, InternalEmbedding, Generic, Databricks, VertexAI, Anthropic, Bedrock, OpenConnector, Salesforce."}
      - {name: outcome_definition, api_name: outcomeDefinition, in: body, schema: ModelOutcomeDefinitionInput, description: "Optional outcome hints at the container level (per-version OutcomeInput is authoritative)."}
    columns:
      - {name: id, type: VARCHAR, description: "Model setup ID."}
    effect: write
    unknown: warning
    evidence: S
    result_description: One row. This shape comes from an [MCP test fixture](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/test/java/com/salesforce/data360/mcp/tools/machinelearning/setup/ModelSetupToolsTest.java). Other response fields go to `_raw`.
    notes: "**Notes:** `EdcNoCode` is [the no-code training flow](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/model/request/machinelearning/setup/ModelSetupCreateRequest.java). `outcome_definition` is only a hint: the version's `outcomes` are authoritative. The [payload example](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/resources/metadata/payload-examples.json) says it's immutable after creation, while the same file and the patch class list it as settable on `ml_model_setup_update`. No source says a retry is safe, so check `ml_model_setup_list` first."

  - name: ml_model_setup_update
    method: PATCH
    host: connect
    path: /ssot/machine-learning/model-setups/{idOrName}
    tools: [d360_ml_model_setup_update]
    description: Changes the label, description, capability or outcome hint of a model setup. Send only the attributes to change.
    example: CALL cdp.ml_model_setup_update (model_setup_id_or_name => 'Attrition_Risk_Predictor', description => 'Updated description for the attrition predictor.');
    options:
      - {name: model_setup_id_or_name, api_name: idOrName, in: path, type: string, required: true, description: "Model setup ID or developer name."}
      - {name: label, in: body, type: string, description: "New display label."}
      - {name: description, in: body, type: string, description: "New description."}
      - {name: model_capability, api_name: modelCapability, in: body, type: string, description: "Updated model capability. See create-request docs for valid values."}
      - {name: outcome_definition, api_name: outcomeDefinition, in: body, schema: ModelOutcomeDefinitionInput, description: "Updated outcome hint."}
    columns:
      - {name: id, type: VARCHAR, description: "Model setup ID."}
    effect: write
    unknown: warning
    evidence: S
    result_description: One row. This shape comes from an [MCP test fixture](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/test/java/com/salesforce/data360/mcp/tools/machinelearning/setup/ModelSetupToolsTest.java). Other response fields go to `_raw`.
    notes: "**Notes:** See `ml_model_setup_create` for the conflict about changing `outcome_definition`."

  - name: ml_model_setup_delete
    method: DELETE
    host: connect
    path: /ssot/machine-learning/model-setups/{idOrName}
    tools: [d360_ml_model_setup_delete]
    description: Deletes a model setup and all its versions.
    example: CALL cdp.ml_model_setup_delete (model_setup_id_or_name => 'Attrition_Risk_Predictor');
    options:
      - {name: model_setup_id_or_name, api_name: idOrName, in: path, type: string, required: true, description: "Model-setup id or developer name."}
    effect: write
    unknown: warning
    evidence: S
    result_description: The public sources don't document this response. One row, with the response in `_raw`.
    notes: "**Notes:** [Cascades to all versions and is irreversible](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/machinelearning/setup/ModelSetupTools.java). No source says what happens to artifacts and configured models trained from those versions."

schemas:
  BucketingStrategyInput:
    attributes:
      - {name: type, type: string, description: "Bucketing strategy. One of: EvenWidth, Manual, Percentile. EvenWidth/Percentile use number_of_buckets; Manual uses explicit buckets[]."}
      - {name: number_of_buckets, api_name: numberOfBuckets, type: integer, description: "Number of buckets (EvenWidth / Percentile strategies)."}
      - {name: buckets, array: 1, type: number, description: "Explicit bucket boundaries (Manual strategy only). Each entry is a numeric upper-bound for one bucket."}

  CdpAssetReferenceInputRepresentation:
    description: Input representation for an asset reference.
    attributes:
      - {name: id, type: string, description: "ID of the asset. Since v58.0."}
      - {name: name, type: string, description: "Name of the asset. Since v58.0."}
      - {name: namespace, type: string, description: "Namespace of the asset. Since v58.0."}

  CdpMlFilterCriterionInputRepresentation:
    description: Represents the input for a filter criterion.
    attributes:
      - {name: field, schema: MlFilterFieldAssetInputRepresentation, required: true, description: "Filter field. For `NoCode` retriever configuration, this is the reference ID, alias name, or related data model object (DMO) field developer name in `vector_embedding_related_fields` of the search index. Since v67.0."}
      - {name: operator, type: string, enum: [EqualTo, GreaterThan, GreaterThanOrEqualTo, In, LessThan, LessThanOrEqualTo, Like, NotEqualTo, NotIn], required: true, description: "Operator applied to the filter criterion. Since v67.0."}
      - {name: values, schema: CdpMlFilterValueInputRepresentation, array: 1, required: true, description: "List of values to apply in the filter. Since v67.0."}

  CdpMlFilterInputRepresentation:
    description: Represents the input for a filter expression.
    attributes:
      - {name: conjunctive_operator, api_name: conjunctiveOperator, type: string, enum: [And, Custom, Or], required: true, description: "Operator used to join filter criteria. Since v67.0."}
      - {name: criteria, schema: CdpMlFilterCriterionInputRepresentation, array: 1, required: true, description: "List of filter criteria. Since v67.0."}
      - {name: custom_boolean_expression, api_name: customBooleanExpression, type: string, description: "Custom boolean expression in the format \"{!$0} AND {!$1} AND ({!$2} OR {!$3}) AND (NOT {!$4})\". Each number is the index of a criterion in the criteria list. Used when `conjunctive_operator` is `Custom`. Since v67.0."}

  CdpMlFilterValueInputRepresentation:
    description: Represents the input for a filter value.
    attributes:
      - {name: type, type: string, enum: [Constant, Placeholder], required: true, description: "Type of value. Since v67.0."}
      - {name: value, type: string, required: true, description: "Value content. When `type` is `Constant`, this property contains the constant value. When `type` is `Placeholder`, this property contains the placeholder name in the format \"{!$parameter}\". Since v67.0."}

  CdpMlPredictInputBase_model:
    unknown: warning
    attributes:
      - {name: name, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}

  CustomizableFieldInput:
    unknown: warning
    attributes:
      - {name: name, type: string, required: true, description: "Field name on the artifact's input/output schema."}
      - {name: type, type: string, required: true, description: "Customizable field type. One of: ActionableVariable, TopFactor."}

  FieldConfigInput:
    attributes:
      - {name: type, type: string, required: true, description: "Field type. One of: Text, Date, Number. Per-type fields: Text uses includeOther/balanced/ordering/dataType/values; Date uses min/max (ISO date strings); Number uses min/max (doubles) plus optional bucketing_strategy."}
      - {name: name, type: string, required: true, description: "Field API name (must exist on the input source)."}
      - {name: label, type: string, description: "Display label."}
      - {name: source, type: string, description: "Owning data source name (multi-source only)."}
      - {name: ignored, type: boolean, description: "Mark field as ignored (excluded from training)."}
      - {name: include_other, api_name: includeOther, type: boolean, description: "Text fields only: group rare values into an \"Other\" bucket."}
      - {name: balanced, type: boolean, description: "Text fields only: balance class frequencies during training."}
      - {name: ordering, type: string, description: "Text fields only: value ordering. One of: Occurrence, Alphabetical, Numeric."}
      - {name: data_type, api_name: dataType, type: string, description: "Text fields only: data type. One of: Categorical, Boolean."}
      - {name: values, schema: TextFieldValueInput, array: 1, description: "Text fields only: distinct value configurations."}
      - {name: min, type: any, description: "A string or a number. Date fields: ISO-8601 minimum (e.g. 2024-01-01). Number fields: numeric minimum."}
      - {name: max, type: any, description: "A string or a number. Date fields: ISO-8601 maximum. Number fields: numeric maximum."}
      - {name: bucketing_strategy, api_name: bucketingStrategy, schema: BucketingStrategyInput, description: "Number fields only: bucketing strategy."}

  FieldRelationshipInput:
    attributes:
      - {name: source, type: string, description: "Source dataset (DMO/CIO/SDM) name owning the related field."}
      - {name: name, type: string, description: "Field API name on the source dataset."}
      - {name: joins, schema: JoinCriteriaInput, array: 1, description: "Join clauses linking the primary dataset to this related field."}

  FieldSourceInput:
    unknown: warning
    attributes:
      - {name: name, type: string, required: true, description: "Field API name (e.g. Amount__c)."}
      - {name: source, type: string, description: "API name of the source object that owns this field (e.g. Sales__dlm)."}
      - {name: type, type: string, description: "Source kind for the owning object. One of: DataModelObject, CalculatedInsightObject, SdmObject."}

  FilterCriterionInput:
    unknown: warning
    attributes:
      - {name: values, schema: FilterValueInput, array: 1, description: "Values compared against the field (interpreted by operator)."}
      - {name: operator, type: string, description: "Comparison operator. One of: In, NotIn, EqualTo, NotEqualTo, Contains, StartsWith, EndsWith, IsNull, IsNotNull, LessThan, LessThanOrEqualTo, GreaterThan, GreaterThanOrEqualTo, Like."}
      - {name: filter_field, api_name: filterField, schema: FieldSourceInput, description: "Reference to the field this criterion filters on."}

  FilterInput:
    unknown: warning
    attributes:
      - {name: criteria, schema: FilterCriterionInput, array: 1, description: "Filter conditions (each is a field/operator/values triple)."}
      - {name: conjunctive_operator, api_name: conjunctiveOperator, type: string, description: "How criteria combine. One of: And, Or, Custom. Required when there are 2+ criteria. With Custom, pair with custom_boolean_expression."}
      - {name: custom_boolean_expression, api_name: customBooleanExpression, type: string, description: "Boolean expression over criterion indices (e.g. \"(1 AND 2) OR 3\"). Honored only when conjunctive_operator=Custom."}

  FilterValueInput:
    unknown: warning
    attributes:
      - {name: value, type: string, description: "Literal value (for type=Constant) or placeholder name (for type=Placeholder)."}
      - {name: type, type: string, description: "Value type. One of: Constant, Placeholder."}

  InputSourceInput:
    unknown: warning
    attributes:
      - {name: type, type: string, required: true, description: "Source kind. One of: DataModelObject, CalculatedInsightObject, SdmObject, MultiSourceObjects. For the first three, set 'source' (required) and 'dataspace' and leave 'sources' empty. For MultiSourceObjects, set 'sources' (a list of single-source entries) and leave 'source'/'dataspace'/'primary' empty."}
      - {name: source, schema: CdpAssetReferenceInputRepresentation, description: "Single-source only. Reference to the DMO/CIO/SDM entity (by name or id)."}
      - {name: dataspace, api_name: dataSpace, schema: CdpAssetReferenceInputRepresentation, description: "Single-source only. Dataspace the source lives in."}
      - {name: primary, type: boolean, description: "Marks this entry as the primary source (relevant for MultiSourceObjects)."}
      - {name: sources, schema: InputSourceInput, array: 1, description: "MultiSourceObjects only. List of single-source entries (each with its own type/source/dataSpace; mark exactly one as primary=true)."}

  JoinCriteriaInput:
    unknown: warning
    attributes:
      - {name: fields, schema: JoinFieldsInput, array: 1, description: "Field-pair conditions that make up the join key."}
      - {name: operator, type: string, description: "How field-pair conditions combine within this join. One of: And, Or."}
      - {name: type, type: string, description: "Join type. One of: Inner, Left, Right, Outer."}
      - {name: left, type: string, description: "API name of the primary (left) dataset."}
      - {name: right, type: string, description: "API name of the related (right) dataset."}

  JoinFieldsInput:
    unknown: warning
    attributes:
      - {name: left_field, api_name: leftField, type: string, description: "Field API name on the left (primary) dataset."}
      - {name: right_field, api_name: rightField, type: string, description: "Field API name on the right (related) dataset."}

  JoinInput:
    unknown: warning
    attributes:
      - {name: criteria, schema: JoinCriteriaInput, array: 1, description: "Join clauses, each linking the primary dataset to one related dataset."}

  MlBinaryClassificationJobDefSettingsInputRepresentation:
    description: Represents the settings configuration for a binary classification prediction job definition.
    attributes:
      - {name: max_prescriptions, api_name: maxPrescriptions, type: integer, description: "Maximum number of prescriptions to generate. Since v66.0."}
      - {name: max_top_contributors, api_name: maxTopContributors, type: integer, description: "Maximum number of top contributors to generate. Since v66.0."}
      - {name: prescription_threshold, api_name: prescriptionThreshold, type: integer, description: "Prescription threshold value. Since v66.0."}
      - {name: show_class_probabilities, api_name: showClassProbabilities, type: boolean, description: "Indicates whether the outcome columns show class probabilities for both positive and negative classes (`true`) or not (`false`). If unspecified, the default value is `true`. Since v66.0."}

  MlClusteringJobDefSettingsInputRepresentation:
    description: Represents the settings configuration for a clustering prediction job definition.
    attributes:
      - {name: cluster_id_field_label, api_name: clusterIdFieldLabel, type: string, description: "Label for the cluster ID output field. Since v68.0."}
      - {name: cluster_label_field_label, api_name: clusterLabelFieldLabel, type: string, description: "Label for the cluster label output field. Since v68.0."}
      - {name: max_top_contributors, api_name: maxTopContributors, type: integer, description: "Maximum number of top contributors for clustering. Since v68.0."}

  MlDmoFieldSourceTargetRelationshipInputRepresentation:
    attributes:
      - {name: relation_source_dmo_field_name, api_name: relationSourceDmoFieldName, type: string, required: true, description: "Developer name of the source DMO field. Since v67.0."}
      - {name: relation_source_dmo_name, api_name: relationSourceDmoName, type: string, required: true, description: "Developer name of the source DMO. Since v67.0."}
      - {name: relation_target_dmo_field_name, api_name: relationTargetDmoFieldName, type: string, required: true, description: "Developer name of the target DMO field. Since v67.0."}
      - {name: relation_target_dmo_name, api_name: relationTargetDmoName, type: string, required: true, description: "Developer name of the target DMO. Since v67.0."}

  MlFilterFieldAssetInputRepresentation:
    description: Represents the input for a filter field asset.
    attributes:
      - {name: id, type: string, description: "ID of the asset. Since v58.0."}
      - {name: name, type: string, description: "Name of the asset. Since v58.0."}
      - {name: namespace, type: string, description: "Namespace of the asset. Since v58.0."}

  MlMulticlassClassificationJobDefSettingsInputRepresentation:
    description: Represents the settings configuration for a multiclass classification prediction job definition.
    attributes:
      - {name: max_top_contributors, api_name: maxTopContributors, type: integer, description: "Maximum number of top contributors to generate. Since v66.0."}
      - {name: number_of_classes, api_name: numberOfClasses, type: integer, description: "Number of classes to include in the output. If unspecified, the default value is all classes in the outcome. Since v66.0."}

  MlPredictionJobDefDataFieldInputRepresentation:
    description: Represents a data model object (DMO) field with an optional relationship path.
    attributes:
      - {name: id, type: string, description: "ID of the asset. Since v58.0."}
      - {name: name, type: string, description: "Name of the asset. Since v58.0."}
      - {name: namespace, type: string, description: "Namespace of the asset. Since v58.0."}
      - {name: data_object, api_name: dataObject, schema: CdpAssetReferenceInputRepresentation, description: "Data model object (DMO) that contains the field. Since v67.0."}

  MlPredictionJobDefFeatureMappingInputRepresentation:
    description: Represents the mapping between a model feature and a data model object (DMO) field.
    attributes:
      - {name: mapped_field, api_name: mappedField, schema: MlPredictionJobDefMappedFieldInputRepresentation, description: "Mapped data model object (DMO) field. Since v59.0."}
      - {name: model_field, api_name: modelField, schema: CdpAssetReferenceInputRepresentation, description: "Model feature field. Since v59.0."}
      - {name: update_score, api_name: updateScore, type: boolean, description: "Indicates whether an update to this field triggers a prediction update for streaming jobs (`true`) or not (`false`). Since v59.0."}

  MlPredictionJobDefFeaturesConfigInputRepresentation:
    description: Represents the input configuration for features, including the data model object (DMO) and field mappings.
    attributes:
      - {name: data_object, api_name: dataObject, schema: CdpAssetReferenceInputRepresentation, description: "Input data model object (DMO). Since v59.0."}
      - {name: fields, schema: MlPredictionJobDefFeatureMappingInputRepresentation, array: 1, description: "List of field mappings between model features and DMO fields. Since v59.0."}
      - {name: text_fields, api_name: textFields, schema: MlPredictionJobDefFeaturesConfigInput_textFields, array: 1, description: "Not in the spec schema: from the spec's examples."}
      - {name: topic_labels, api_name: topicLabels, schema: MlPredictionJobDefFeaturesConfigInput_topicLabels, description: "Not in the spec schema: from the spec's examples."}

  MlPredictionJobDefFeaturesConfigInput_textFields:
    unknown: warning
    attributes:
      - {name: mapped_field, api_name: mappedField, schema: MlPredictionJobDefFeaturesConfigInput_textFields_mappedField, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: update_score, api_name: updateScore, type: boolean, description: "Seen in examples: the spec types the parent as a free-form object."}

  MlPredictionJobDefFeaturesConfigInput_textFields_mappedField:
    unknown: warning
    attributes:
      - {name: id, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: data_object, api_name: dataObject, schema: MlPredictionJobDefFeaturesConfigInput_textFields_mappedField_dataObject, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: relationship_path, api_name: relationshipPath, schema: MlPredictionJobDefFeaturesConfigInput_textFields_mappedField_relationshipPath, array: 1, description: "Seen in examples: the spec types the parent as a free-form object."}

  MlPredictionJobDefFeaturesConfigInput_textFields_mappedField_dataObject:
    unknown: warning
    attributes:
      - {name: id, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}

  MlPredictionJobDefFeaturesConfigInput_textFields_mappedField_relationshipPath:
    unknown: warning
    attributes:
      - {name: source_field, api_name: sourceField, schema: MlPredictionJobDefFeaturesConfigInput_textFields_mappedField_relationshipPath_sourceField, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: target_field, api_name: targetField, schema: MlPredictionJobDefFeaturesConfigInput_textFields_mappedField_relationshipPath_targetField, description: "Seen in examples: the spec types the parent as a free-form object."}

  MlPredictionJobDefFeaturesConfigInput_textFields_mappedField_relationshipPath_sourceField:
    unknown: warning
    attributes:
      - {name: id, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: data_object, api_name: dataObject, schema: MlPredictionJobDefFeaturesConfigInput_textFields_mappedField_relationshipPath_sourceField_dataObject, description: "Seen in examples: the spec types the parent as a free-form object."}

  MlPredictionJobDefFeaturesConfigInput_textFields_mappedField_relationshipPath_sourceField_dataObject:
    unknown: warning
    attributes:
      - {name: id, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}

  MlPredictionJobDefFeaturesConfigInput_textFields_mappedField_relationshipPath_targetField:
    unknown: warning
    attributes:
      - {name: id, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: data_object, api_name: dataObject, schema: MlPredictionJobDefFeaturesConfigInput_textFields_mappedField_relationshipPath_targetField_dataObject, description: "Seen in examples: the spec types the parent as a free-form object."}

  MlPredictionJobDefFeaturesConfigInput_textFields_mappedField_relationshipPath_targetField_dataObject:
    unknown: warning
    attributes:
      - {name: id, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}

  MlPredictionJobDefFeaturesConfigInput_topicLabels:
    unknown: warning
    attributes:
      - {name: type, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: values, array: 1, description: "Seen in examples: the spec types the parent as a free-form object."}

  MlPredictionJobDefFieldRelationshipInputRepresentation:
    description: Represents a join relationship between two data model object (DMO) fields.
    attributes:
      - {name: source_field, api_name: sourceField, schema: MlPredictionJobDefDataFieldInputRepresentation, description: "Source field on the left side of the join. Since v59.0."}
      - {name: target_field, api_name: targetField, schema: MlPredictionJobDefDataFieldInputRepresentation, description: "Target field on the right side of the join. Since v59.0."}

  MlPredictionJobDefInputFieldInputRepresentation:
    attributes:
      - {name: mapped_field, api_name: mappedField, schema: MlPredictionJobDefMappedFieldInputRepresentation, description: "Mapped data model object (DMO) field. Since v66.0."}
      - {name: update_score, api_name: updateScore, type: boolean, description: "Indicates whether a prediction is rescored when this field updates (`true`) or not (`false`). Since v66.0."}

  MlPredictionJobDefMappedFieldInputRepresentation:
    description: Represents a data model object (DMO) field with an optional relationship path.
    attributes:
      - {name: id, type: string, description: "ID of the asset. Since v58.0."}
      - {name: name, type: string, description: "Name of the asset. Since v58.0."}
      - {name: namespace, type: string, description: "Namespace of the asset. Since v58.0."}
      - {name: data_object, api_name: dataObject, schema: CdpAssetReferenceInputRepresentation, description: "Data model object (DMO) that contains the field. Since v59.0."}
      - {name: relationship_path, api_name: relationshipPath, schema: MlPredictionJobDefFieldRelationshipInputRepresentation, array: 1, description: "List of join relationships for accessing the field from a related DMO. Since v59.0."}

  MlPredictionJobDefPredictionsConfigInputRepresentation:
    description: Represents the input configuration for predictions generated by a model.
    attributes:
      - {name: description, type: string, description: "Description of the output data model object (DMO). Since v59.0."}
      - {name: object_label, api_name: objectLabel, type: string, description: "Object label of the output DMO. Since v59.0."}
      - {name: object_name, api_name: objectName, type: string, description: "API name of the output DMO. Since v59.0."}

  MlRegressionJobDefSettingsInputRepresentation:
    description: Represents the settings configuration for a regression prediction job definition.
    attributes:
      - {name: max_prescriptions, api_name: maxPrescriptions, type: integer, description: "Maximum number of prescriptions to generate. Since v66.0."}
      - {name: max_top_contributors, api_name: maxTopContributors, type: integer, description: "Maximum number of top contributors to generate. Since v66.0."}
      - {name: prescription_threshold, api_name: prescriptionThreshold, type: integer, description: "Improvement threshold for prescriptions. Since v66.0."}

  MlRetrieverCitationConfigurationInputRepresentation:
    description: Represents the input for configuring citation fields.
    attributes:
      - {name: base_url, api_name: baseUrl, type: string, description: "Base URL that the `mapped_url_field` value is appended to. For example, if `base_url` is \"https://example.com\" and the data model object (DMO) field contains \"/docs/article-123\", the resulting URL is \"https://example.com/docs/article-123\". Since v61.0."}
      - {name: mapped_label_field, api_name: mappedLabelField, schema: MlRetrieverCitationFieldInputRepresentation, description: "Name of the mapped DMO field containing the citation label. Since v61.0."}
      - {name: mapped_url_field, api_name: mappedUrlField, schema: MlRetrieverCitationFieldInputRepresentation, description: "Name of the mapped data model object (DMO) field containing the URL or URL path. When `base_url` is provided, this field's value is appended to it to construct the complete URL. Since v61.0."}
      - {name: type, type: string, enum: [Custom, Default], required: true, description: "Type of citation. Since v61.0."}

  MlRetrieverCitationFieldInputRepresentation:
    description: Represents the input for a citation field reference.
    attributes:
      - {name: related_dmo_field_name, api_name: relatedDmoFieldName, type: string, description: "Name of the related data model object (DMO) field. Since v61.0."}
      - {name: related_dmo_name, api_name: relatedDmoName, type: string, description: "Name of the related DMO. Since v61.0."}

  MlRetrieverConfigurationBaseInputRepresentation:
    description: Represents the input for creating a retriever configuration.
    attributes:
      - {name: output_fields, api_name: outputFields, array: 1, type: string, description: "-"}
      - {name: referenced_retrievers, api_name: referencedRetrievers, schema: CdpAssetReferenceInputRepresentation, array: 1, description: "-"}
      - {name: citation_configuration, api_name: citationConfiguration, schema: MlRetrieverCitationConfigurationInputRepresentation, description: "-"}
      - {name: input, schema: MlRetrieverSourceInputRepresentation, description: "-"}
      - {name: query_filter, api_name: queryFilter, schema: CdpMlFilterInputRepresentation, description: "-"}
      - {name: is_active, api_name: isActive, type: boolean, description: "Indicates whether to activate the configuration on creation (`true`) or not (`false`). Since v61.0."}
      - {name: is_citation_enabled, api_name: isCitationEnabled, type: boolean, description: "Indicates whether to include citation fields (source record ID, label, URL) in results (`true`) or not (`false`). For CustomSql, `is_citation_supported` must be `true`. Since v61.0."}
      - {name: number_of_results, api_name: numberOfResults, type: integer, description: "Maximum number of results to return. Must be a positive integer. If unspecified, the default value is `10`. Since v61.0."}
      - {name: query_type, api_name: queryType, type: string, enum: [CustomSql, Ensemble, NoCode], required: true, description: "Type of query. Since v61.0."}
      - {name: retrieval_mode, api_name: retrievalMode, type: string, enum: [Advanced, Basic], description: "Retrieval mode. Since v61.0."}
      - {name: is_advanced_mode_supported, api_name: isAdvancedModeSupported, type: boolean, description: "-"}
      - {name: is_citation_supported, api_name: isCitationSupported, type: boolean, description: "-"}
      - {name: is_enriched_index_supported, api_name: isEnrichedIndexSupported, type: boolean, description: "-"}
      - {name: retriever_query_template_definition, api_name: retrieverQueryTemplateDefinition, schema: MlRetrieverQueryTemplateDefinitionInputRepresentation, description: "-"}

  MlRetrieverConfigurationCustomSqlInputRepresentation:
    attributes:
      - {name: is_active, api_name: isActive, type: boolean, description: "Indicates whether to activate the configuration on creation (`true`) or not (`false`). Since v61.0."}
      - {name: is_advanced_mode_supported, api_name: isAdvancedModeSupported, type: boolean, description: "Indicates whether advanced retrieval mode is supported (`true`) or not (`false`). If unspecified, the default value is `false`. Since v67.0."}
      - {name: is_citation_enabled, api_name: isCitationEnabled, type: boolean, description: "Indicates whether to include citation fields (source record ID, label, URL) in results (`true`) or not (`false`). For CustomSql, `is_citation_supported` must be `true`. Since v61.0."}
      - {name: is_citation_supported, api_name: isCitationSupported, type: boolean, description: "Indicates whether citation is supported (`true`) or not (`false`). If unspecified, the default value is `false`. When `true`, `query_citation_definition` is required. Since v67.0."}
      - {name: is_enriched_index_supported, api_name: isEnrichedIndexSupported, type: boolean, description: "Indicates whether enriched index chunk resolution is supported (`true`) or not (`false`). If unspecified, the default value is `false`. When `true`, `enriched_search_index_definition` is required. Since v67.0."}
      - {name: number_of_results, api_name: numberOfResults, type: integer, description: "Maximum number of results to return. Must be a positive integer. If unspecified, the default value is `10`. Since v61.0."}
      - {name: query_type, api_name: queryType, type: string, enum: [CustomSql, Ensemble, NoCode], required: true, description: "Type of query. Since v61.0."}
      - {name: retrieval_mode, api_name: retrievalMode, type: string, enum: [Advanced, Basic], description: "Retrieval mode. Since v61.0."}
      - {name: retriever_query_template_definition, api_name: retrieverQueryTemplateDefinition, schema: MlRetrieverQueryTemplateDefinitionInputRepresentation, required: true, description: "SQL query template definition including query template, parameters, citation definition, and enriched index definition. Since v67.0."}

  MlRetrieverConfigurationEnsembleInputRepresentation:
    attributes:
      - {name: is_active, api_name: isActive, type: boolean, description: "Indicates whether to activate the configuration on creation (`true`) or not (`false`). Since v61.0."}
      - {name: is_citation_enabled, api_name: isCitationEnabled, type: boolean, description: "Indicates whether to include citation fields (source record ID, label, URL) in results (`true`) or not (`false`). For CustomSql, `is_citation_supported` must be `true`. Since v61.0."}
      - {name: number_of_results, api_name: numberOfResults, type: integer, description: "Maximum number of results to return. Must be a positive integer. If unspecified, the default value is `10`. Since v61.0."}
      - {name: output_fields, api_name: outputFields, array: 1, type: string, description: "List of output field labels (display names) to project from the ensemble results. These must match field labels defined in the active configuration of the referenced sub-retrievers. If unspecified, the default value is the union of output field labels from the referenced retrievers' active configurations. Since v67.0."}
      - {name: query_type, api_name: queryType, type: string, enum: [CustomSql, Ensemble, NoCode], required: true, description: "Type of query. Since v61.0."}
      - {name: referenced_retrievers, api_name: referencedRetrievers, schema: CdpAssetReferenceInputRepresentation, array: 1, required: true, description: "List of sub-retrievers to fan out to. Each entry is a reference (ID or API name) pointing to an existing NoCode retriever. Since v67.0."}
      - {name: retrieval_mode, api_name: retrievalMode, type: string, enum: [Advanced, Basic], description: "Retrieval mode. Since v61.0."}

  MlRetrieverConfigurationNoCodeInputRepresentation:
    attributes:
      - {name: citation_configuration, api_name: citationConfiguration, schema: MlRetrieverCitationConfigurationInputRepresentation, description: "Citation configuration. Applies only to `NoCode`. Since v67.0."}
      - {name: input, schema: MlRetrieverSourceInputRepresentation, required: true, description: "ID or API name of the search index that the retriever is associated with. Applies only to `NoCode`. Since v67.0."}
      - {name: is_active, api_name: isActive, type: boolean, description: "Indicates whether to activate the configuration on creation (`true`) or not (`false`). Since v61.0."}
      - {name: is_citation_enabled, api_name: isCitationEnabled, type: boolean, description: "Indicates whether to include citation fields (source record ID, label, URL) in results (`true`) or not (`false`). For CustomSql, `is_citation_supported` must be `true`. Since v61.0."}
      - {name: number_of_results, api_name: numberOfResults, type: integer, description: "Maximum number of results to return. Must be a positive integer. If unspecified, the default value is `10`. Since v61.0."}
      - {name: output_fields, api_name: outputFields, schema: MlRetrieverOutputFieldInputRepresentation, array: 1, required: true, description: "List of data model object (DMO) fields to include in retriever results. Since v67.0."}
      - {name: query_filter, api_name: queryFilter, schema: CdpMlFilterInputRepresentation, description: "Pre-filter applied to available prefilter fields on the search index. Since v67.0."}
      - {name: query_type, api_name: queryType, type: string, enum: [CustomSql, Ensemble, NoCode], required: true, description: "Type of query. Since v61.0."}
      - {name: retrieval_mode, api_name: retrievalMode, type: string, enum: [Advanced, Basic], description: "Retrieval mode. Since v61.0."}

  MlRetrieverInputRepresentation:
    description: Represents the input for creating a retriever.
    attributes:
      - {name: configuration, schema: MlRetrieverConfigurationBaseInputRepresentation, required: true, description: "Initial configuration. Use the configuration input object that corresponds to the type of query. For example, use the Ml Retriever Configuration Custom Sql Input for the `CustomSql` type. Since v61.0."}
      - {name: dataspaces, api_name: dataSpaces, array: 1, type: string, description: "List of data space names. Required for `CustomSql` and `NoCode` retrievers. Derive the data space from the referenced retrievers for `Ensemble` retrievers. Since v61.0."}
      - {name: description, type: string, description: "Description of the retriever. Since v61.0."}
      - {name: label, type: string, required: true, description: "Label of the retriever. Since v61.0."}
      - {name: owner_type, api_name: ownerType, type: string, enum: [AiAgent, Api], required: true, description: "Type of owner. Since v61.0."}

  MlRetrieverOutputFieldInputRepresentation:
    attributes:
      - {name: data_source_type, api_name: dataSourceType, type: string, enum: [DataModelObject, SearchFunction], description: "Type of data source. Since v67.0."}
      - {name: label, type: string, required: true, description: "Display label for the output field. Must be unique within the retriever. Since v67.0."}
      - {name: related_dmo_field_name, api_name: relatedDmoFieldName, type: string, description: "Name of the related data model object (DMO) field. Since v61.0."}
      - {name: related_dmo_name, api_name: relatedDmoName, type: string, description: "Name of the related DMO. Since v61.0."}
      - {name: relationships, schema: MlDmoFieldSourceTargetRelationshipInputRepresentation, array: 1, description: "List of relationships forming a path from the DMO of this output field to the source DMO of the search index. The cardinality must be 1-to-1 or 1-to-many from this DMO to the source DMO. Maximum path length is 2. Empty when the field is on the source DMO itself. Applies only to `NoCode`. Since v67.0."}

  MlRetrieverQueryEnrichedSearchIndexDefinitionInputRepresentation:
    description: Represents the input for an enriched search index definition to resolve enriched chunks to plain chunks. Required when `is_enriched_index_supported` is `true`. CustomSql only.
    attributes:
      - {name: chunk_column_name, api_name: chunkColumnName, type: string, required: true, description: "Name or alias of the SELECT column containing the chunk content. Since v67.0."}
      - {name: chunk_record_id_column_name, api_name: chunkRecordIdColumnName, type: string, required: true, description: "Name or alias of the SELECT column containing the chunk record ID. Since v67.0."}
      - {name: search_index_api_name, api_name: searchIndexApiName, type: string, required: true, description: "API name of the enriched search index. Since v67.0."}

  MlRetrieverQueryTemplateCitationDefinitionCustomInputRepresentation:
    description: Represents the input for a custom citation definition where label and link are defined by user-specified SQL columns. CustomSql only.
    attributes:
      - {name: citation_type, api_name: citationType, type: string, enum: [Custom, Default], required: true, description: "Type of citation. Since v67.0."}
      - {name: custom_label_column_name, api_name: customLabelColumnName, type: string, description: "Name or alias of the SELECT column used as the citation label. Required when `citation_type` is `Custom`. Since v67.0."}
      - {name: custom_base_url, api_name: customBaseUrl, type: string, description: "Base URL that the `custom_link_column_name` value is appended to. For example, if `custom_base_url` is \"https://example.com\" and the column contains \"/docs/article-123\", the resulting URL is \"https://example.com/docs/article-123\". Since v67.0."}
      - {name: custom_link_column_name, api_name: customLinkColumnName, type: string, required: true, description: "Name or alias of the SELECT column used as the citation link. When `custom_base_url` is provided, this field's value is appended to it to construct the complete URL. Since v67.0."}

  MlRetrieverQueryTemplateCitationDefinitionDefaultInputRepresentation:
    description: Represents the input for a Default citation definition where citation links are generated from source and chunk record IDs in SQL columns. CustomSql only.
    attributes:
      - {name: citation_type, api_name: citationType, type: string, enum: [Custom, Default], required: true, description: "Type of citation. Since v67.0."}
      - {name: custom_label_column_name, api_name: customLabelColumnName, type: string, description: "Name or alias of the SELECT column used as the citation label. Required when `citation_type` is `Custom`. Since v67.0."}
      - {name: chunk_object_api_name, api_name: chunkObjectApiName, type: string, description: "API name of the chunk data model object (DMO) from a search index whose source DMO matches `source_object_api_name`. Applies only when the search index is not real time; ignored otherwise. When set, enables harmonized viewer and multimodal citations. Since v67.0."}
      - {name: chunk_record_id_column_name, api_name: chunkRecordIdColumnName, type: string, description: "Name or alias of the SELECT column used as the chunk record ID. Required when the search index for `chunk_object_api_name` is not real-time; must NOT be set when that index is real-time (JIT). Since v67.0."}
      - {name: source_object_api_name, api_name: sourceObjectApiName, type: string, required: true, description: "API name of the source DMO whose records are cited. Must be a DMO (DLOs and calculated insights must use custom citation). Since v67.0."}
      - {name: source_record_id_column_name, api_name: sourceRecordIdColumnName, type: string, required: true, description: "Name or alias of the SELECT column used as the source record ID. Since v67.0."}

  MlRetrieverQueryTemplateDefinitionInputRepresentation:
    description: Represents the input for a SQL query template definition. CustomSql only.
    attributes:
      - {name: enriched_search_index_definition, api_name: enrichedSearchIndexDefinition, schema: MlRetrieverQueryEnrichedSearchIndexDefinitionInputRepresentation, description: "Enriched search index definition to resolve enriched chunks to plain chunks. Required when `is_enriched_index_supported` is `true`. Since v67.0."}
      - {name: main_user_query_parameter_name, api_name: mainUserQueryParameterName, type: string, description: "Name of the parameter carrying the user query text in the format `\":\\\"parameter\\\"\"`. Must match a parameter in `query_template_placeholders`. Recommended to help monitor the quality of search results from `vector_search()` or `hybrid_search()` functions. Required when `is_advanced_mode_supported` or `is_enriched_index_supported` is `true`. Since v67.0."}
      - {name: query_citation_definition, api_name: queryCitationDefinition, schema: MlRetrieverQueryTemplateDefinitionInputRepresentation.query_citation_definition, description: "Citation definition (Default or Custom). Required when `is_citation_supported` is `true`. Use the citation definition input object that corresponds to the type of citation. For example, use the Ml Retriever Query Template Citation Definition Custom Input for custom citation types. Since v67.0."}
      - {name: query_template_placeholders, api_name: queryTemplatePlaceholders, schema: MlRetrieverQueryTemplatePlaceholderInputRepresentation, array: 1, description: "List of parameters used in the SQL query template. Each parameter specifies name, data type, placeholder type, optional default value, label, and description. Since v67.0."}
      - {name: retriever_query_template, api_name: retrieverQueryTemplate, type: string, required: true, description: "Data 360 SQL query template. Can contain parameters in the format `:\"parameter\"`. Since v67.0."}
      - {name: search_overall_score_column_name, api_name: searchOverallScoreColumnName, type: string, description: "Name or alias of the SELECT column containing the overall search relevance score from `vector_search()` or `hybrid_search()` functions. Recommended to help monitor the quality of search results. Since v67.0."}

  MlRetrieverQueryTemplateDefinitionInputRepresentation.query_citation_definition:
    variants: [MlRetrieverQueryTemplateCitationDefinitionCustomInputRepresentation, MlRetrieverQueryTemplateCitationDefinitionDefaultInputRepresentation]
    tag: {attribute: citation_type, values: {Custom: MlRetrieverQueryTemplateCitationDefinitionCustomInputRepresentation, Default: MlRetrieverQueryTemplateCitationDefinitionDefaultInputRepresentation}}

  MlRetrieverQueryTemplatePlaceholderInputRepresentation:
    description: Represents the input for a query template parameter or placeholder in the format `":\"parameter\""`. CustomSql only.
    attributes:
      - {name: placeholder_data_type, api_name: placeholderDataType, type: string, enum: [ArrayOfText, Boolean, Date, DateTime, Number, Text], required: true, description: "Data type of the parameter value. Since v67.0."}
      - {name: placeholder_description, api_name: placeholderDescription, type: string, description: "Description of the parameter purpose. Required for `CustomSql`. Not applicable to `NoCode`. Since v67.0."}
      - {name: placeholder_label, api_name: placeholderLabel, type: string, description: "Display label for the parameter. Since v67.0."}
      - {name: placeholder_name, api_name: placeholderName, type: string, required: true, description: "Name of the parameter in the format `\":\\\"parameter\\\"\"`. Must be unique in the SQL query template. Must be a valid developer name (begin with a letter, contain only alphanumeric characters and underscores, no spaces, and cannot end with or contain consecutive underscores). Since v67.0."}
      - {name: placeholder_value, api_name: placeholderValue, type: string, description: "Default value for the parameter. Since v67.0."}

  MlRetrieverSourceInputRepresentation:
    description: Represents the input for a search index reference.
    attributes:
      - {name: id, type: string, description: "ID of the asset. Since v58.0."}
      - {name: name, type: string, description: "Name of the asset. Since v58.0."}
      - {name: namespace, type: string, description: "Namespace of the asset. Since v58.0."}
      - {name: type, type: string, enum: [SearchIndex, SearchIndexConfiguration], description: "Type of search index source. Since v61.0."}

  MlSentimentDetectionInputConfigInputRepresentation:
    attributes:
      - {name: data_object, api_name: dataObject, schema: CdpAssetReferenceInputRepresentation, description: "Input data model object (DMO). Since v66.0."}
      - {name: text_fields, api_name: textFields, schema: MlPredictionJobDefInputFieldInputRepresentation, array: 1, description: "List of text fields to perform sentiment detection on. Since v66.0."}

  MlTopicClassificationInputConfigInputRepresentation:
    attributes:
      - {name: data_object, api_name: dataObject, schema: CdpAssetReferenceInputRepresentation, description: "Input data model object (DMO). Since v66.0."}
      - {name: text_fields, api_name: textFields, schema: MlPredictionJobDefInputFieldInputRepresentation, array: 1, description: "List of text fields to perform topic classification on. Since v66.0."}
      - {name: topic_labels, api_name: topicLabels, schema: MlTopicClassificationJobStaticLabelsInputRepresentation, description: "Topic labels for classifying the text fields. Since v66.0."}

  MlTopicClassificationJobStaticLabelsInputRepresentation:
    attributes:
      - {name: type, type: string, enum: [Static], description: "Type of labels mapping. Since v66.0."}
      - {name: values, array: 1, type: string, description: "Static list of topic labels to be used for classification. Since v66.0."}

  ModelOutcomeDefinitionInput:
    unknown: warning
    attributes:
      - {name: goal, type: string, description: "Outcome goal. One of: Minimize, Maximize."}
      - {name: field_names, api_name: fieldNames, array: 1, type: string, description: "Names of fields the outcome targets."}

  ModelParameterOverrideInput:
    unknown: warning
    attributes:
      - {name: parameter_name, api_name: parameterName, type: string, required: true, description: "Parameter name as declared on the referenced model artifact's parameter definitions."}
      - {name: discrete_value, api_name: discreteValue, type: string, description: "Override value for a discrete (string) parameter. Provide either discrete_value or continuous_value, not both."}
      - {name: continuous_value, api_name: continuousValue, type: number, description: "Override value for a continuous (numeric) parameter. Provide either discrete_value or continuous_value, not both."}

  OutcomeInput:
    attributes:
      - {name: type, type: string, required: true, description: "Outcome type. One of: Binary, DiscreteVariable, ContinuousVariable, Clustering. Per-type required fields: Binary needs success_value+failure_value; DiscreteVariable needs class_labels; ContinuousVariable needs min+max; Clustering needs n_clusters (omit for HDBSCAN: it's auto-determined)."}
      - {name: label, type: string, description: "Display label for the outcome."}
      - {name: name, type: string, description: "Field API name on the data source that holds the outcome (e.g. Attrition__c)."}
      - {name: goal, type: string, description: "Optimization goal. One of: Minimize, Maximize."}
      - {name: source, type: string, description: "Owning data source name (multi-source only: disambiguates which DMO the outcome field belongs to)."}
      - {name: success_value, api_name: successValue, type: string, description: "Binary outcomes only: value of the success class (e.g. \"Yes\")."}
      - {name: failure_value, api_name: failureValue, type: string, description: "Binary outcomes only: value of the failure class (e.g. \"No\")."}
      - {name: class_labels, api_name: classLabels, array: 1, type: string, description: "DiscreteVariable outcomes only: list of class labels."}
      - {name: min, type: number, description: "ContinuousVariable outcomes only: minimum value of the target variable."}
      - {name: max, type: number, description: "ContinuousVariable outcomes only: maximum value of the target variable."}
      - {name: n_clusters, api_name: nClusters, type: integer, description: "Clustering outcomes only: desired number of clusters (omit for HDBSCAN)."}

  TextFieldValueInput:
    attributes:
      - {name: name, type: string, description: "Value (the string the field actually contains, e.g. \"Yes\")."}
      - {name: label, type: string, description: "Display label for this value."}
      - {name: ignored, type: boolean, description: "Mark this value as ignored (excluded from training)."}
      - {name: count, type: integer, description: "Observed row count for this value."}

  TransformationInput:
    attributes:
      - {name: type, type: string, required: true, description: "Transformation type. One of: ExtractDayOfWeek, ExtractMonthOfYear, FreeTextClustering, NumericalImputation, SentimentAnalysis, TopicClassification."}
      - {name: source_field_name, api_name: sourceFieldName, type: string, required: true, description: "Field API name to read from."}
      - {name: target_field_name, api_name: targetFieldName, type: string, required: true, description: "Field API name to write to (often equals source_field_name for in-place transformations)."}
      - {name: source, type: string, description: "Multi-source inputs only: target dataset name."}
      - {name: source_field_source, api_name: sourceFieldSource, type: string, description: "Multi-source inputs only: source dataset name."}
      - {name: impute_method, api_name: imputeMethod, type: string, description: "NumericalImputation only: imputation method. One of: Mean, Median, Mode. Defaults to Mean."}
      - {name: candidates, array: 1, type: string, description: "TopicClassification only: list of candidate topics for the classifier."}

  ml_model_artifact_update_outputFields:
    unknown: warning
    attributes:
      - {name: id, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: feature_override_values, api_name: featureOverrideValues, schema: ml_model_artifact_update_outputFields_featureOverrideValues, array: 1, description: "Seen in examples: the spec types the parent as a free-form object."}

  ml_model_artifact_update_outputFields_featureOverrideValues:
    unknown: warning
    attributes:
      - {name: source_value, api_name: sourceValue, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: override_value, api_name: overrideValue, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}

  ml_setup_version_create_fields:
    unknown: warning
    attributes:
      - {name: type, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: name, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: label, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: min, type: number, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: max, type: number, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: bucketing_strategy, api_name: bucketingStrategy, schema: ml_setup_version_create_fields_bucketingStrategy, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: data_type, api_name: dataType, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
      - {name: ordering, type: string, description: "Seen in examples: the spec types the parent as a free-form object."}
