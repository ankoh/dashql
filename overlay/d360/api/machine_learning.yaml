    options:
      - {name: job_id_or_name, api_name: jobIdOrName, in: query, type: string, description: "ID or API name of the predict job. Since v59.0."}
      - {name: limit, in: query, type: integer, description: "Maximum number of predict jobs to return. Since v59.0."}
      - {name: offset, in: query, type: integer, description: "Number of rows to skip before returning results. If unspecified, no rows are skipped. Since v59.0."}
      - {name: type, in: query, type: string, enum: [Prediction, Training], description: "Type of job. Since v59.0."}
    rows: /jobs
