  - name: ml_alert_update
    method: PATCH
    host: connect
    path: /ssot/machine-learning/alerts/{alertId}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Machine-Learning/paths/~1ssot~1machine-learning~1alerts~1%7BalertId%7D/patch
    tools: [d360_ml_alert_update]
    description: Partially update an existing data alert. Since v61.0.
    example: CALL cdp.ml_alert_update (alert_id => '...', accepted => true);
    options:
      - {name: alert_id, api_name: alertId, in: path, type: string, required: true, description: "ID of the data alert. Since v61.0."}
      - {name: accepted, in: body, type: boolean, description: "Indicates whether the alert is accepted (`true`) or not (`false`). Include only one of the properties, `accepted` or `dismissed`, with the request. Since v61.0."}
      - {name: dismissed, in: body, type: boolean, description: "Indicates whether the alert is dismissed (`true`) or not (`false`). Include only one of the properties, `accepted` or `dismissed`, with the request Since v61.0."}
      - {name: id, in: body, type: string, description: "ID of the alert. Since v61.0."}
    columns:
      - {name: accepted, type: BOOLEAN, description: "Indicates whether the alert is accepted (`true`) or not (`false`). Since v61.0."}
      - {name: alert_type, api_name: alertType, type: VARCHAR, description: "Type of alert. Since v61.0."}
      - {name: applicable, type: BOOLEAN, description: "Indicates whether the alert is applicable (`true`) or not (`false`). Since v61.0."}
      - {name: directives, type: JSON, array: 1, schema: MlImprovementDirectiveRepresentation, description: "List of improvement directives (suggested actions) associated with the alert. Since v61.0."}
      - {name: dismissed, type: BOOLEAN, description: "Indicates whether the alert is dismissed (`true`) or not (`false`). Since v61.0."}
      - {name: id, type: VARCHAR, description: "ID of the alert. Since v61.0."}
      - {name: key, type: VARCHAR, description: "Unique key for the alert. Since v61.0."}
      - {name: last_status_change_by, api_name: lastStatusChangeBy, type: JSON, schema: CdpUserRepresentation, description: "User or system that last changed the status of the alert. Since v61.0."}
      - {name: last_status_change_date, api_name: lastStatusChangeDate, type: VARCHAR, description: "Date when the alert's status was last changed. Since v61.0."}
      - {name: last_status_change_version, api_name: lastStatusChangeVersion, type: BIGINT, description: "Version number associated with the alert's most recent status change. Since v61.0."}
      - {name: message, type: VARCHAR, description: "Alert message. Since v61.0."}
      - {name: related_data, api_name: relatedData, type: JSON, schema: MlDataAlertDataBaseRepresentation, description: "Data that is related to the alert. Since v61.0."}
      - {name: source_type, api_name: sourceType, type: VARCHAR, description: "Source type of alert. Since v61.0."}
      - {name: subject, type: VARCHAR, description: "Subject of the alert. Since v61.0."}
      - {name: url, type: VARCHAR, description: "URL of the data alert. Since v61.0."}
    effect: write
    evidence: O
    result_description: One row. Schema `MlDataAlertRepresentation`.
    notes: "**Notes:** [Send only one of `accepted` or `dismissed`](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/machinelearning/alerts/AlertTools.java). `accepted` flags the alert's `directives` to apply automatically on the next setup version, if you create it with `source_setup_version_number` set to the current version. `dismissed` hides the alert without applying anything."

