  - name: ml_job_list
    method: GET
    host: connect
    path: /ssot/machine-learning/jobs
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Machine-Learning/paths/~1ssot~1machine-learning~1jobs/get
    description: Get a list of predict jobs. Since v59.0.
