    notes: "**Notes:** `model` is an `Enabled` [configured model, not an artifact](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/resources/metadata/payload-examples.json). [At most 200 rows per call, and each row's length must equal `field_names`](https://github.com/forcedotcom/d360-mcp-server/blob/main/src/main/java/com/salesforce/data360/mcp/tools/machinelearning/predict/PredictTools.java). The MCP tool says all row values are strings on the wire, so write `'25'`, not `25`, although the spec's own example sends numbers. A row can fail on its own: each entry in `predictions` has `status` `Success` or `Error`. The spec allows `max_prescriptions` of `-1` for unlimited, while the MCP request class has a minimum of 0."

