title: Data Custom Code
description: |
  Code extension runs your own Python in Data 360. A deployment holds a zipped package. A script runs inside a data transform, and a function runs in a search index's chunking step ([docs](https://developer.salesforce.com/docs/data/data-cloud-code-ext/guide/use-custom-code.md)). These calls manage deployments and read their run history. None of them starts a run.

  A deployment takes three steps, as in the [SDK](https://github.com/forcedotcom/datacloud-customcode-python-sdk/blob/main/src/datacustomcode/deploy.py):

  1. `custom_code_deployment_create` returns a `file_upload_url`.
  2. You PUT the zip to that URL. This isn't a Connect API call, so no `CALL cdp.` function does it.
  3. You poll `deployment_status` until it is `Deployed`.

  A script then needs a transform that names it, and `transform_run` starts it. Runs show up in `custom_code_execution_list`.

  The main traps:

  - The spec's create options lack `version`, `invokeOptions` and `functionInvokeOptions`, which the SDK sends. See [`custom_code_deployment_create`](#custom_code_deployment_create).
  - Compute names differ between tools. API `CPU_L` is the largest size, and CLI `CPU_L` is the smallest.
  - Code Extension must be enabled in Feature Manager, and [orgs with Bring Your Own Key aren't supported](https://developer.salesforce.com/docs/data/data-cloud-code-ext/guide/use-custom-code.md).
  - The docs deploy to a sandbox and [move to production with a DevOps data kit](https://developer.salesforce.com/docs/data/data-cloud-code-ext/guide/migrate-code-to-prod.md).

  ```sql
  CALL cdp.custom_code_deployment_create (name => 'account_rollup', label => 'Account rollup', code_type => 'Script', compute_type => 'CPU_XS');
  /* PUT deployment.zip to file_upload_url, outside DashQL */
  CALL cdp.custom_code_deployment_get (custom_code_name_or_id => 'account_rollup'); /* until deployment_status = 'Deployed' */
  CALL cdp.transform_create (name => 'account_rollup', label => 'account_rollup', type => 'BATCH', dataspace_name => 'default', definition => $$
    {"type": "DCSQL", "version": "56.0", "manifest": {
      "nodes": {"node1": {"relation_name": "Account_std_copy__dll", "config": {"materialized": "table"}, "compiled_code": ""}},
      "sources": {"source1": {"relation_name": "Account_std__dll"}},
      "macros": {"macro.byoc": {"arguments": [{"name": "account_rollup", "type": "BYOC_SCRIPT"}]}}
    }}
  $$);
  CALL cdp.transform_run (data_transform_name_or_id => 'account_rollup');
  CALL cdp.custom_code_execution_list (custom_code_name_or_id => 'account_rollup', limit => 10);
  ```

functions:
  - name: custom_code_deployment_delete
    method: DELETE
    host: connect
    path: /ssot/data-custom-code/{customCodeNameOrId}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Custom-Code/paths/~1ssot~1data-custom-code~1%7BcustomCodeNameOrId%7D/delete
    description: Permanently delete a deployment. Use it to remove code that nothing depends on any more.
    example: CALL cdp.custom_code_deployment_delete (custom_code_name_or_id => 'account_rollup');
    options:
      - {name: custom_code_name_or_id, api_name: customCodeNameOrId, in: path, type: string, required: true, description: "Deployment `name` or `id`. The [SDK](https://github.com/forcedotcom/datacloud-customcode-python-sdk/blob/main/src/datacustomcode/deploy.py) reads by `name`."}
    effect: write
    evidence: O
    result_description: No response body (HTTP 200). One row with only the standard columns.
    notes: |
      **Done when:** The deployment is gone from `custom_code_deployment_list`. The [docs](https://developer.salesforce.com/docs/data/data-cloud-code-ext/guide/delete-deployed-code.md) say this takes a few minutes. The spec's `status` enum has `Deleting`, but no source ties it to this call.

      **Notes:** [You can't undo this, and you must first remove or disable everything that references the code](https://developer.salesforce.com/docs/data/data-cloud-code-ext/guide/delete-deployed-code.md), such as transforms and search indexes. The docs don't say what happens if you skip that step.

  - name: custom_code_deployment_list
    method: GET
    host: connect
    path: /ssot/data-custom-code
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Custom-Code/paths/~1ssot~1data-custom-code/get
    description: List the deployments in the org, with optional filters on type, status and label. Use it to find a deployment name or spot failed deployments.
    example: CALL cdp.custom_code_deployment_list (code_type => 'Script', deployment_status => 'Error', order_by => 'DeployedOnDesc', limit => 50);
    options:
      - {name: code_type, api_name: codeType, in: query, type: string, enum: [Function, Script], description: "`Script` runs in a data transform. `Function` runs in a search index."}
      - {name: deployment_status, api_name: deploymentStatus, in: query, type: string, enum: [Deployed, Disabled, Error, Initializing, Pending, Scanning], description: "Only deployments in this state. `Deployed` means ready and `Error` means failed."}
      - {name: label, in: query, type: string, description: "-"}
      - {name: limit, in: query, type: integer, description: "-"}
      - {name: offset, in: query, type: integer, description: "-"}
      - {name: order_by, api_name: orderBy, in: query, type: string, enum: [CodeTypeAsc, CodeTypeDesc, DeployedByAsc, DeployedByDesc, DeployedOnAsc, DeployedOnDesc, DeploymentStatusAsc, DeploymentStatusDesc, NameAsc, NameDesc, VersionDesc], description: "-"}
    rows: /customCodeDeployments
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation}
      - {name: created_date, api_name: createdDate, type: VARCHAR}
      - {name: id, type: VARCHAR}
      - {name: label, type: VARCHAR}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR}
      - {name: name, type: VARCHAR}
      - {name: namespace, type: VARCHAR}
      - {name: url, type: VARCHAR}
      - {name: code_type, api_name: codeType, type: VARCHAR}
      - {name: compute_type, api_name: computeType, type: VARCHAR}
      - {name: deployment_failure_code, api_name: deploymentFailureCode, type: BIGINT}
      - {name: deployment_failure_reason, api_name: deploymentFailureReason, type: VARCHAR}
      - {name: deployment_status, api_name: deploymentStatus, type: VARCHAR}
      - {name: description, type: VARCHAR}
      - {name: file_upload_url, api_name: fileUploadUrl, type: VARCHAR}
      - {name: is_remote, api_name: isRemote, type: BOOLEAN}
      - {name: owned_by, api_name: ownedBy, type: VARCHAR}
      - {name: status, type: VARCHAR}
    paging: {kind: url, from: /nextPageUrl}
    effect: read
    evidence: O
    result_description: "One row per item of `/customCodeDeployments` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`. Schema `CustomCodeDeploymentRepresentation`."
    notes: |
      **Paging:** `next_page_url`.

      **Notes:** See [`custom_code_deployment_get`](#custom_code_deployment_get) for what `deployment_status` means.

  - name: custom_code_deployment_get
    method: GET
    host: connect
    path: /ssot/data-custom-code/{customCodeNameOrId}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Custom-Code/paths/~1ssot~1data-custom-code~1%7BcustomCodeNameOrId%7D/get
    description: Read one deployment by name or id. Poll it after uploading a package to see whether the deployment finished.
    example: CALL cdp.custom_code_deployment_get (custom_code_name_or_id => 'account_rollup');
    options:
      - {name: custom_code_name_or_id, api_name: customCodeNameOrId, in: path, type: string, required: true, description: "Deployment `name` or `id`. The [SDK](https://github.com/forcedotcom/datacloud-customcode-python-sdk/blob/main/src/datacustomcode/deploy.py) reads by `name`."}
    columns:
      - {name: created_by, api_name: createdBy, type: JSON, schema: CdpUserRepresentation}
      - {name: created_date, api_name: createdDate, type: VARCHAR}
      - {name: id, type: VARCHAR}
      - {name: label, type: VARCHAR}
      - {name: last_modified_by, api_name: lastModifiedBy, type: JSON, schema: CdpUserRepresentation}
      - {name: last_modified_date, api_name: lastModifiedDate, type: VARCHAR}
      - {name: name, type: VARCHAR}
      - {name: namespace, type: VARCHAR}
      - {name: url, type: VARCHAR}
      - {name: code_type, api_name: codeType, type: VARCHAR}
      - {name: compute_type, api_name: computeType, type: VARCHAR}
      - {name: deployment_failure_code, api_name: deploymentFailureCode, type: BIGINT}
      - {name: deployment_failure_reason, api_name: deploymentFailureReason, type: VARCHAR}
      - {name: deployment_status, api_name: deploymentStatus, type: VARCHAR}
      - {name: description, type: VARCHAR}
      - {name: file_upload_url, api_name: fileUploadUrl, type: VARCHAR}
      - {name: is_remote, api_name: isRemote, type: BOOLEAN}
      - {name: owned_by, api_name: ownedBy, type: VARCHAR}
      - {name: status, type: VARCHAR}
    effect: read
    evidence: O
    result_description: One row. Schema `CustomCodeDeploymentRepresentation`.
    notes: |
      **Notes:** Poll `deployment_status`. It's the field the [SDK](https://github.com/forcedotcom/datacloud-customcode-python-sdk/blob/main/src/datacustomcode/deploy.py) reads, and `status` is a separate field (spec values `Active`, `Deleting`, `Error`, `Processing`) that no source explains.

      Only two `deployment_status` values have a documented meaning: `Deployed` means ready, and `Error` means failed. No source gives the order of `Pending`, `Scanning` and `Initializing`, or says what sets `Disabled`. The SDK's only exit is `Deployed`, so it keeps polling through `Error` until its 3000-second timeout. Stop on `Error` yourself and read `deployment_failure_code` and `deployment_failure_reason`.

      `file_upload_url` is in this schema, but the SDK only takes it from the create response. No source says whether a GET returns it.

  - name: custom_code_execution_list
    method: GET
    host: connect
    path: /ssot/data-custom-code/{customCodeNameOrId}/executions
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Custom-Code/paths/~1ssot~1data-custom-code~1%7BcustomCodeNameOrId%7D~1executions/get
    description: List the runs of one deployment, with status, row counts and timings. Use it as the run history after running a transform.
    example: CALL cdp.custom_code_execution_list (custom_code_name_or_id => 'account_rollup', limit => 20);
    options:
      - {name: custom_code_name_or_id, api_name: customCodeNameOrId, in: path, type: string, required: true, description: "Deployment `name` or `id`. The [SDK](https://github.com/forcedotcom/datacloud-customcode-python-sdk/blob/main/src/datacustomcode/deploy.py) reads by `name`."}
      - {name: limit, in: query, type: integer, description: "-"}
      - {name: offset, in: query, type: integer, description: "-"}
    rows: /executions
    columns:
      - {name: compute_type, api_name: computeType, type: VARCHAR}
      - {name: duration_in_seconds, api_name: durationInSeconds, type: BIGINT}
      - {name: end_time, api_name: endTime, type: TIMESTAMPTZ}
      - {name: error_code, api_name: errorCode, type: BIGINT}
      - {name: error_message, api_name: errorMessage, type: VARCHAR}
      - {name: id, type: VARCHAR}
      - {name: rows_read, api_name: rowsRead, type: DOUBLE}
      - {name: rows_written, api_name: rowsWritten, type: DOUBLE}
      - {name: start_time, api_name: startTime, type: TIMESTAMPTZ}
      - {name: status, type: VARCHAR}
      - {name: submitted_time, api_name: submittedTime, type: TIMESTAMPTZ}
    paging: {kind: url, from: /nextPageUrl}
    effect: read
    evidence: O
    result_description: "One row per item of `/executions` in the response. Other response fields go to `_meta`: `currentPageUrl`, `nextPageUrl`, `totalSize`. Schema `CustomCodeExecutionBaseRepresentation`."
    notes: |
      **Paging:** `next_page_url`.

      **Notes:** Rows appear only after something runs the code, such as `transform_run`. A new deployment has no runs yet. The [Run History docs](https://developer.salesforce.com/docs/data/data-cloud-code-ext/guide/view-deployment-details.md) cover scripts. For functions, the docs [point to search index job status](https://developer.salesforce.com/docs/data/data-cloud-code-ext/guide/monitor-custom-function-deployments.md) instead, and no source says whether those runs are listed here.

  - name: custom_code_execution_get
    method: GET
    host: connect
    path: /ssot/data-custom-code/{customCodeNameOrId}/executions/{customCodeExecutionId}
    spec_url: https://developer.salesforce.com/docs/data/connectapi/references/spec#tag/Data-Custom-Code/paths/~1ssot~1data-custom-code~1%7BcustomCodeNameOrId%7D~1executions~1%7BcustomCodeExecutionId%7D/get
    description: Read one run of a deployment. Use it to check a run's status or error once you have its id.
    example: CALL cdp.custom_code_execution_get (custom_code_name_or_id => 'account_rollup', custom_code_execution_id => :execution_id);
    options:
      - {name: custom_code_execution_id, api_name: customCodeExecutionId, in: path, type: string, required: true, description: "`id` from `custom_code_execution_list`."}
      - {name: custom_code_name_or_id, api_name: customCodeNameOrId, in: path, type: string, required: true, description: "Deployment `name` or `id`. The [SDK](https://github.com/forcedotcom/datacloud-customcode-python-sdk/blob/main/src/datacustomcode/deploy.py) reads by `name`."}
    columns:
      - {name: compute_type, api_name: computeType, type: VARCHAR}
      - {name: duration_in_seconds, api_name: durationInSeconds, type: BIGINT}
      - {name: end_time, api_name: endTime, type: TIMESTAMPTZ}
      - {name: error_code, api_name: errorCode, type: BIGINT}
      - {name: error_message, api_name: errorMessage, type: VARCHAR}
      - {name: id, type: VARCHAR}
      - {name: rows_read, api_name: rowsRead, type: DOUBLE}
      - {name: rows_written, api_name: rowsWritten, type: DOUBLE}
      - {name: start_time, api_name: startTime, type: TIMESTAMPTZ}
      - {name: status, type: VARCHAR}
      - {name: submitted_time, api_name: submittedTime, type: TIMESTAMPTZ}
    effect: read
    evidence: O
    result_description: One row. Schema `CustomCodeExecutionBaseRepresentation`.
    notes: |
      **Notes:** A run has ended when `status` is `Success`, `Failure` or `Cancelled`. The [docs](https://developer.salesforce.com/docs/data/data-cloud-code-ext/guide/view-deployment-details.md) list `Running`, `Success` and `Failure`, and the spec adds `Cancelled`.

      The script's own log lines aren't in this result. They are in the `DataCustomCodeLogs__dll` DLO, which you read with a `SELECT` over the connection. They can [take about 10 minutes to appear, and messages are cut at 31,072 characters](https://developer.salesforce.com/docs/data/data-cloud-code-ext/guide/query-logs-api.md). The docs filter that DLO by `ExecutionId__c`, and don't say that it equals this call's `id`. The spec defines `CustomCodeExecutionLogRepresentation` with a `downloadUrl`, but no operation in the spec returns it.

  - name: custom_code_deployment_update
